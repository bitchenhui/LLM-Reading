/2610.25012", "lines": [], "relevance": "high", "decision": "summary_only", "one_liner": "用LLM智能体自改进搜索联合编译投机解码的草稿与目标模型共享执行，几何平均提速1.37倍。", "abstract": "该文将投机解码重构为跨模型编译问题，在草稿模型与目标模型的共享执行内联合优化，而非各自独立编译，核心洞察是跨模型优化应由共置共享执行的实测性能引导。为此设计了将两模型块交错排布于公共tile的操作数布局，使GEMM与非GEMM计算共置且不改变数学语义。系统以自我改进的智能体搜索实现：LLM以编译器和GPU执行为环境编辑跨模型优化计划，利用实测得分、kernel级判定与编译器反馈迭代提案，并用蒙特卡洛树搜索累积奖励指导探索。在NVIDIA B300与RTX 5090上6种单GPU投机解码配置中，几何平均单轮加速1.37x，交错kernel后达1.45x（最佳1.59x），GPU利用率平均提升1.46x（RTX 5090）与1.50x（B300）。", "claims": [{"statement": "Conjugate Compilation在6种单GPU投机解码配置上相对常规执行取得几何平均单轮加速1.37x。", "metrics": ["几何平均单轮加速 1.37x（NVIDIA B300与RTX 5090上6种单GPU投机解码配置，对比常规执行）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "引入交错kernel布局后加速提升至1.45x，最佳情形达1.59x。", "metrics": ["几何平均单轮加速（交错kernel） 1.45x（同一6配置评测，引入交错kernel后）", "最佳情形加速 1.59x（全部配置中的最优单点结果）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "系统平均提升GPU利用率：RTX 5090上1.46x，B300上1.50x。", "metrics": ["GPU利用率提升 1.46x（RTX 5090，6配置平均）", "GPU利用率提升 1.50x（NVIDIA B300，6配置平均）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:SelfImprovement", "concept:LLM", "org:NVIDIA"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2610.24453", "type": "paper", "domain": "self_improvement", "title": "Hippo: Training-Free Agent Self-Evolution via Hippocampal Replay", "title_zh": "Hippo：基于海马回放的无训练智能体自我演化", "published": "2026-10-17", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2610.24453", "lines": [], "relevance": "high", "decision": "summary_only", "one_liner": "受海马选择性编码与回放启发的免训练外部记忆框架，让LLM智能体在不更新参数的情况下从经验中自我改进。", "abstract": "受递归自我改进（RSI）动机驱动，本文研究LLM智能体如何在不更新模型参数的前提下通过外部记忆学习。作者提出Hippo记忆框架，借鉴选择性海马编码与回放机制，在诊断出缺陷时通过对比同一任务的不同尝试来识别可复用决策并精化其适用条件；新经验与既有记忆合并重叠、以显式适用条件消解冲突，避免逐条堆积。实验显示无整合的经验累积基线先升后降、最终低于无记忆基线，而Hippo在SWE-bench Verified、WebArena和Mind2Web三个基准上均取得提升且保留经验远少于累积基线。增益在不同能力的基础模型上均成立，表明即使对强模型，基于记忆的适应仍然有效。", "claims": [{"statement": "Hippo在SWE-bench Verified、W omous Machine Learning Engineering", "title_zh": "MLExpert：迈向自主机器学习工程的通用智能体模型", "published": "2026-10-15", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2610.22344", "lines": [], "relevance": "medium", "decision": "summary_only", "one_liner": "以层级智能体SFT与窗口化交互RL训练35B MoE模型MLExpert，MLE-Bench Lite奖牌率37.9%→72.7%", "abstract": "论文面向AI for AI（AI4AI）与递归自我改进（RSI），提出面向长时程自主机器学习工程（MLE）优化的后训练方法，训练出35B混合专家（MoE）智能体模型MLExpert。作者构建Kaggle-MLE Factory生成可执行任务并设计模型主导实验的交互框架；层级智能体SFT以结果导向监督将通用工具使用与编码能力迁移到MLE。窗口化交互强化学习（WIRL）把相邻实验结果之间的多轮决策视为一个执行窗口并赋予共享的基于结果的奖励，配合异步轨迹收集与策略修正在轨迹结束前即可更新策略。在MLE-Bench Lite上，MLExpert将基座模型平均奖牌率从37.9%提升至72.7%，与Kimi-K3、GLM-5.3等更大前沿模型相当；在NatureBench Lite、智能体脚手架优化与算法优化上亦有提升，表明所学优化能力可泛化。", "claims": [{"statement": "MLExpert在MLE-Bench Lite上将基座模型的平均奖牌率从37.9%提升至72.7%，达到与Kimi-K3、GLM-5.3等更大前沿模型相当的水平", "metrics": ["MLE-Bench Lite平均奖牌率 37.9%→72.7%（35B基座模型→经后训练的MLExpert）", "参数规模 35B（MoE智能体模型MLExpert）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "窗口化交互强化学习（WIRL）将相邻实验结果之间的多轮决策视为执行窗口并共享基于结果的奖励，可在长轨迹结束前完成策略更新", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "所学MLE优化能力可泛化至NatureBench Lite、智能体脚手架优化与算法优化等其他任务并带来性能提升", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:SelfImprovement", "concept:RSI", "concept:MoE"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2610.21791", "type": "paper", "domain": "self_improvement", "title": "RSIFlow: Adaptive Self-Improvement Workflows with an Evolving Meta-Agent", "title_zh": "RSIFlow：具备演化元代理的自适应自我改进工作流", "published": "2026-10-15", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2610.21791", "lines": [], "relevance": "high", "decision": "summary_only", "one_liner": "提出RSIFlow递归自我改进框架，以自适应工作流编排加元代理harness演化提升LLM代理性能，六个基准全部SOTA。", "abstract": "论文提出RSIFlow，一个将自适应工作流编排与元代理能力演化相结合的递归自我改进（RSI）框架。该框架从任务-代理轨迹与环境反馈中诊断性能瓶颈，动态选择针对特定组件的改进工作流。元代理随后将工作流成果蒸馏为组件级技能与跨组件原则，并演化自身的harness，从而改进后续的 : "paper", "domain": "self_improvement", "title": "Harness^2: Recursive Agent Harnessing for an Open World", "title_zh": "Harness^2：面向开放世界的递归式智能体执行框架自我改进", "published": "2026-10-09", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2610.14224", "lines": [], "relevance": "high", "decision": "summary_only", "one_liner": "提出即插即用的双层递归框架，无需真值验证器即可自动进化LLM智能体执行框架，三项专业基准最多提升11.5分。", "abstract": "论文指出LLM智能体能力不仅取决于底层模型，还取决于其执行框架（harness），而开放世界场景下RSI面临任务测试时新颖、缺乏真值验证器、以及过程任务特异难以泛化两大挑战。Harness^2通过两层递归解决：任务级递归用对比式Propose-Probe-Compose步骤在没有真值验证器的情况下可靠引导框架编辑，并可通过并行或串行递归进一步扩展；框架化递归（harnessing-level recursion）从编辑经验中提取知识更新持续改进框架，使智能体更适应未来任务。在三项专业基准与四种模型-框架配置上，单步递归即可稳定改进GLM-5与Gemini 3.5 Flash：WorkBuddy-Bench最高提升11.5分、JobBench提升4.5分、LAB提升11.8个百分点，且随任务级递归预算增加收益进一步提升。", "claims": [{"statement": "任务级递归采用对比式Propose-Probe-Compose步骤，可在缺乏真值验证器的开放世界条件下可靠引导执行框架的在线编辑。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "框架化递归从任务级编辑经验中提取知识并更新持续改进框架，使智能体更好适应未来新任务，实现跨任务泛化。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "单步递归即可在三项专业基准、四种模型-框架配置上稳定超越基础执行框架，且收益随任务级递归预算增加而扩大。", "metrics": ["WorkBuddy-Bench 提升 11.5（单步递归对比基础harness，最多提升（points），GLM-5/Gemini 3.5 Flash）", "JobBench 提升 4.5（单步递归对比基础harness（points），GLM-5/Gemini 3.5 Flash）", "LAB 提升 11.8（单步递归对比基础harness（百分点），GLM-5/Gemini 3.5 Flash）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:RSI", "concept:SelfImprovement", "concept:LLM"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2610.12190", "type": "paper", "domain": "self_improvement", "title": "DataSense-Bench: The First Step Toward an AI Scientist", "title_zh": "DataSense-Bench：迈向AI科学家的第一步", "published": "2026-10-08", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2610.12190", "lines": [], "relevance": "medium", "decision": "summary_only", "one_liner": "构建DataSense-Bench，评测前沿AI代理为微调小型LLM挑选训练数据并预测性能的\"数据直觉\"能力。", "abstract": "针对RSI与AGI宣称盛行的现状，该工作提出DataSense-Bench，考察前沿AI模型是否具备可靠的数据选择能力。基准要求AI代理在禁止训练模型、禁止访问真实评测任务的约束下，通过检查数据、编写并执行分析代码、运行模型前向传播，为微调小型LLM挑选并排序候选训练子集；随后按标准化协议在各子集上微调基座模型并评估训练后性能，从最优子集训练后表现与排序准确性两个维度打分。基准在终端问题求解与工具使用两类任务上实例化，分别从OpenThoughts-Agent与EnvScaler选取训练轨迹，并在TBLite与BFCL上评测。结果显示：代理相对随机选择的收益有限，无法可靠排序所选子集，且排序能力跨任务不稳定；执行轨迹分析表明代理常使用相似的数据信号，却对其训练价值给出不同解读。", "claims": [{"statement": "在DataSense-Bench上，前沿AI代理相对随机选择的数据选择收益有限。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "代理无法可靠地对自身选出的数据子集的相对训练后性能进行排序。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "排序能力跨任务不一致：Astra在工具使用任务的三次运行中均识别出最优子集，而在终端任务的三次运行中仅一次命中。", "metrics": ["最优组命中运行数 3/3（Astra，工具使用任务（BFCL）三次运行）", "最优组命中运行数 1/3（Astra，终端问题求解任务（TBLite）三次运行）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "执行轨迹分析显示，代理常使用相似的数据信号，但对这些信号训练价值的解读各不相同。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:LLM", "concept:RSI", "concept:SelfImprovement"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2610.11794", "type": "paper", "domain": "self_improvement", "title": "Memento 3: Model-Based Recursive Self-Improvement through Reflective Rulebooks", "title_zh": "Memento 3：基于反思式规则手册的模型驱动递归自我改进", "published": "2026-10-08", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2610.11794", "lines": [], "relevance": "high", "decision": "summary_only", "one_liner": "冻结LLM智能体以自然语言规则手册为外部记忆，经反思-修订-编译-验证循环实现模型驱动RSI，在ARC-AGI-3上全部通关。", "abstract": "Memento 3 让冻结参数的 LLM 智能体通过外部记忆持续学习显式世界模型：以自然语言规则书作为持久语义记忆，记录关于环境动态的可修正假设，并将其编译为可执行代码用于预测与规划。在观察、反思、规则修订、编译与验证的持续循环中，智能体利用预测误差同时细化规则书与代码；只有当 LLM 判定代码忠实于规则书且单元级回放能复现观测转移时，更新才被接受。该过程被作为一条通向递归自我改进（RSI）的模型驱动路径加以研究，底层 LLM 全程保持不变；种群扩展版本并行维护多个世界模型，共享交互证据并以预测引导探索。在 ARC-AGI-3 上，单模型智能体通关全部 25 个公开游戏的所有关卡，平均 RHAE 达 100.0，动作数仅为人类用量的 44%；Atari Pong 案例中学习到的反馈控制器在三个不同开局对局均以 21:0 获胜且无需进一步 LLM 调用。", "claims": [{"statement": "在 ARC-AGI-3 基准上，单模型智能体通关全部 2 9421", "lines": [], "relevance": "high", "decision": "deep_read", "one_liner": "构建27264条标注的MT-JRD数据集并提出属性辅助预测模型AMT-JRD，在VCM中降码率且保住多任务机器视觉精度。", "abstract": "该文将仅适用于单任务的恰可辨识差异(JRD)建模扩展到多任务场景，构建了包含27,264条机器JRD标注的MT-JRD数据集，覆盖目标检测、实例分割与关键点检测三类任务。提出的属性辅助AMT-JRD预测模型通过广义/专用特征提取模块(GFEM/SFEM)实现多任务联合学习，并以属性特征融合模块(AFFM)引入目标尺寸与位置先验。在三任务上AMT-JRD的平均绝对误差为3.781、误差方差为5.332，较最先进单任务预测模型分别提升6.7%和6.3%。将预测的JRD应用于VCM后，相对VVC与JPEG基线平均提升BD-mAP 3.861%与7.886%，在保持多任务机器视觉精度的同时降低编码码率。", "claims": [{"statement": "基于AMT-JRD预测JRD的VCM在三个机器视觉任务上相对VVC与JPEG基线均取得BD-mAP编码增益，可在保精度前提下降码率。", "metrics": ["BD-mAP增益 3.861%（AMT-JRD-based VCM 对比 VVC 基线（检测/分割/关键点三任务平均））", "BD-mAP增益 7.886%（AMT-JRD-based VCM 对比 JPEG 基线（三任务平均））"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "AMT-JRD在三个任务上实现精确稳健的多任务JRD预测，优于最先进单任务预测模型。", "metrics": ["平均绝对误差(MAE) 3.781（AMT-JRD在目标检测/实例分割/关键点检测三任务上的JRD预测）", "误差方差 5.332（同上三任务）", "MAE相对提升 6.7%（对比SOTA单任务JRD预测模型）", "误差方差相对提升 6.3%（对比SOTA单任务JRD预测模型）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "构建了面向机器视觉的多任务JRD数据集MT-JRD，标注全部来自机器视角。", "metrics": ["JRD标注数量 27,264（MT-JRD数据集，覆盖目标检测、实例分割、关键点检测三类任务）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["codec:VVC"], "tags": [], "deep_dive_url": "https://github.com/bitchenhui/LLM-Reading/blob/main/docs/auto/2604.09421.md", "manual": false}, {"id": "paper:arxiv:2604.08329", "type": "paper", "domain": "video_image_coding", "title": "DiV-INR: Extreme Low-Bitrate Diffusion Video Compression with INR Conditioning", "title_zh": "DiV-INR：基于INR条件化的极低码率扩散视频压缩", "published": "2026-04-09", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2604.08329", "lines": ["inr_representation"], "relevance": "high", "decision": "deep_read", "one_liner": "结合INR紧凑表示与预训练视频扩散模型，在<0.05 bpp极低码率实现高感知质量的视频压缩。", "abstract": "该文提出感知驱动的视频压缩框架DiV-INR，面向<0.05 bpp的极低码率区间，将隐式神经表示（INR）与预训练视频扩散模型结合。方法以INR条件化替代传统帧内编码关键帧，训练INR估计潜在特征并引导扩散过程，同时联合优化INR权重与扩散模型的参数高效适配器，以极小参数开销编码视频特定信息。在UVG、MCL-JCV与JVET Class : "用深度强化学习构建时间与质量感知的码率阶梯，较HLS阶梯XPSNR BD-rate至少降10.3%、解码时间减22%。", "abstract": "自适应HTTP流媒体通常依赖固定的码率-分辨率对（码率阶梯），忽略内容与解码复杂度差异，导致编码时间、解码效率与质量权衡欠佳。DQ-Ladder采用Deep Q-Network智能体，以每段预测的解码时间、质量分数和码率等级为输入，奖励函数为解码时间、视频质量与分辨率平滑度的加权和，构建时间与质量感知的码率阶梯；并利用机器学习模型预测解码时间、码率等级及客观质量指标（VMAF、XPSNR），避免穷举编码与质量计算。评估基于VVC工具链（VVenC/VVdeC），覆盖750条视频序列、6种Apple HLS兼容分辨率与41个量化参数。与四个基线相比，DQ-Ladder相对HLS阶梯取得至少10.3%的XPSNR BD-rate降低，同时解码时间减少22%，且在预测误差含高达20%噪声时仍保持鲁棒。", "claims": [{"statement": "DQ-Ladder以预测解码时间、质量分数与码率等级为DQN输入，通过解码时间、视频质量与分辨率平滑度的加权奖励构建时间与质量感知的码率阶梯。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "相比Apple HLS码率阶梯，DQ-Ladder在XPSNR上取得至少10.3%的BD-rate降低。", "metrics": ["BD-rate (XPSNR) ≥10.3%（相对HLS码率阶梯；VVC工具链(VVenC/VVdeC)，750序列×6分辨率×41QP）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "DQ-Ladder相比基线减少22%的解码时间。", "metrics": ["解码时间 -22%（相对基线阶梯方案，VVdeC解码）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "DQ-Ladder对预测误差的敏感度显著低于对比方法，在预测值含最高20%噪声时仍保持鲁棒。", "metrics": ["预测噪声鲁棒性 20%（预测误差注入噪声比例上限内保持稳健）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "使用机器学习模型预测解码时间、码率等级与客观质量（VMAF、XPSNR），避免穷举编码与质量指标计算。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["codec:VVC", "impl:VVenC", "impl:VVdec", "metric:BD-Rate", "metric:VMAF", "org:Apple"], "tags": [], "deep_dive_url": "https://github.com/bitchenhui/LLM-Reading/blob/main/docs/auto/2603.13597.md", "manual": false}, {"id": "paper:arxiv:2603.10188", "type": "paper", "domain": "video_image_coding", "title": "ARCHE: Autoregressive Residual Compression with Hyperprior and Excitation", "title_zh": "ARCHE：基于超先验与激励机制的自回归残差压缩", "published": "2026-03-10", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.10188", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "统一分层/空间/通道先验的端到端学习图像压缩框架，Kodak上BD-Rate优于VVC Intra约5%。", "abstract": "论文提出ARCHE，一个端到端学习式图像压缩框架，在单一概率框架内统一了分层先验、空间先验与通道先验，同时捕获潜表示中的全局与局部依赖，并通过自适应特征重标定（激励）与残差精炼提升潜表示质量。该方法不依赖循环网络或Transformer组件，仅用高效卷积设计实现精确的熵建模。在Kodak数据集上，ARCHE相对Balle等人基准模型降低BD-Rate约48%，相对Minnen & Singh通道自回归模型降低约30%，相对VVC Intra编码器降低约5%。模型参数量95M、单图推理222ms，视觉对比显示低码率下纹理更锐利、色彩保真度更高。", "claims": [{"statement": "ARCHE在Kodak数据集上相对Balle等人常用基准模型降低BD-Rate约48%。", "metrics": ["BD-Rate ≈-48%（相对Balle et al.基准模型，Kodak数据集）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE相对Minnen & Singh通道自回归模型降低BD-Rate约30%。", "metrics": ["BD-Rate ≈-30%（相对Minnen & Singh通道自回归模型，Kodak数据集）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE的率失真性能超过VVC Intra编码器，BD-Rate降低约5%。", "metrics": ["BD-Rate ≈-5%（相对VVC Intra，Kodak数据集）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE在不使用循环或Transformer组件的情况下保持计算效率，参数量95M，单图运行时间222ms。", "metrics": ["参数量 95M（ARCHE模型整体）", "单图运行时间 222ms（每张图像）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE在单一概率框架内统一分层、空间与通道先验，并用自适应特征重标定与残差精炼增强潜表示，低码率下纹理更锐利、色彩保真度更好。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:Hyperprior", "dataset:Kodak", "metric:BD-Rate", "codec:VVC"], "tags": [], "deep_dive_url": "https://github.com/bitchenhui/LLM-Reading/blob/main/docs/auto/2603.10188.md", "manual": false}, {"id": "paper:arxiv:2603.06095", "type": "paper", "domain": "video_image_coding", "title": "Enhancing Neural Video Compression of Static Scenes with Positive-Incentive Noise", "title_zh": "利用正向激励噪声增强静态场景神经视频压缩", "published": "2026-03-06", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.06095", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "提出PIC框架，将静态场景短期时变重释为正向激励噪声以微调NVC，在0.009%压缩率下实现视觉无损重构。", "abstract": "针对监控、视频通话等静态场景视频，传统编码器时间冗余利用不足、神经视频压缩（NVC）又存在训练-测试分布鸿沟，而生成式压缩会引入不可接受的幻觉细节。论文提出正向激励相机（PIC）框架，将短期时变内容重新解释为正向激励噪声用于NVC模型微调，把瞬态变化与持久背景解耦，使结构化先验内化到压缩模型中。推理时仅不变分量需少量信令，在保持像素级保真的同时大幅降低传输 const LINE = DATA.line_names;
const DOMAIN = DATA.domain_names;
const REL_ZH = { high: "高相关", medium: "中相关", low: "低相关" };
const DEC_ZH = { deep_read: "深读", summary_only: "仅摘要" };
const state = { lines: new Set(), q: "", rel: "", dec: "", ent: "", dom: "" };

document.getElementById("stats").innerHTML =
  `<div class="stat"><b>${DATA.stats.items}</b>信息项（论文 ${DATA.stats.papers} + 版本 ${DATA.stats.releases}）</div>` +
  `<div class="stat"><b>${DATA.stats.claims}</b>结构化论断</div>` +
  `<div class="stat"><b>${DATA.stats.deep_reads}</b>深读笔记</div>` +
  `<div class="stat">更新 ${DATA.generated}</div>`;

const chips = document.getElementById("lineChips");
Object.entries(LINE).forEach(([k, name]) => {
  const n = DATA.items.filter(i => i.lines.includes(k)).length;
  const el = document.createElement("span");
  el.className = "chip"; el.textContent = `${name} ${n}`; el.dataset.k = k;
  el.onclick = () => { state.lines.has(k) ? state.lines.delete(k) : state.lines.add(k);
    el.classList.toggle("on"); render(); };
  chips.appendChild(el);
});
const allChip = document.createElement("span");
allChip.className = "chip on"; allChip.textContent = "全部";
allChip.onclick = () => { state.lines.clear();
  document.querySelectorAll("#lineChips .chip[data-k]").forEach(c => c.classList.remove("on"));
  render(); };
chips.prepend(allChip);

const domSel = document.getElementById("dom");
Object.entries(DOMAIN).forEach(([k, name]) => {
  const o = document.createElement("option"); o.value = k; o.textContent = name;
  domSel.appendChild(o);
});
domSel.onchange = e => { state.dom = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
document.getElementById("rel").onchange = e => { state.rel = e.target.value; render(); };
document.getElementById("dec").onchange = e => { state.dec = e.target.value; render(); };
window.filterEnt = ref => { state.ent = state.ent === ref ? "" : ref; render(); };

function match(it) {
  if (state.dom && it.domain !== state.dom) return false;
  if (state.lines.size && !it.lines.some(l => state.lines.has(l))) return false;
  if (state.rel && it.relevance !== state.rel) return false;
  if (state.dec && it.decision !== state.dec) return false;
  if (state.ent && !it.entities.includes(state.ent)) return false;
  if (state.q) {
    const hay = (it.title + " " + (it.title_zh || "") + " " + it.one_liner + " " +
      (it.abstract || "") + " " + it.entities.join(" ") + " " +
      it.claims.map(c => c.statement).join(" ")).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function card(it) {

    `<span class="ent" onclick="filterEnt('${e}')">${e}</span>`).join("");

    const m = c.metrics.map(x => `<span class="m">▸ ${x}</span>`).join(" ");
    const ev = c.evidence ? ` <span class="ev">[${c.evidence}]</span>` : "";
    return `<div class="claim">· ${c.statement}${m}${ev}</div>`;
  }).join("");
  const links = [`<a href="${it.url}" target="_blank">arXiv ↗</a>`]
    .concat(it.deep_dive_url ? [`<a href="${it.deep_dive_url}" target="_blank">深读笔记 ↗</a>`] : [])

  const lines = it.lines.map(l => LINE[l] || l).join(" / ") || "未分类";
  const domLabel = it.domain && it.domain !== "video_image_coding"

  return `<div class="${cls}" id="${it.id}">
    <div class="meta"><span>${it.published}</span>
      ${it.type === "repo_release" ? '<span class="badge b-rel">版本动态</span>' : ""}
      ${domLabel}
      <span class="badge b-${it.relevance}">${REL_ZH[it.relevance] || it.relevance}</span>
      <span class="badge ${it.decision === "deep_read" ? "b-deep" : "b-sum"}">${DEC_ZH[it.decision] || it.decision}</span>
      <span>${lines}</span></div>
    <h3><a href="${it.url}" target="_blank">${it.title_zh || it.title}</a></h3>
    <div class="orig">${it.title}</div>
    <div class="oneliner">${it.one_liner}</div>
    ${it.claims.length ? `<div class="claims-toggle" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='block'?'none':'block';this.textContent=el.style.display==='block'?'▲ 收起论断':'▼ 展开论断（'+${it.claims.length}）'">▼ 展开论断（${it.claims.length}）</div><div class="claims">${claims}</div>` : ""}
    <div class="ents">${ents}</div>
    <div class="links">${links}</div>
  </div>`;
}

function render() {
  const list = DATA.items.filter(match);
  document.getElementById("list").innerHTML = list.map(card).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("foot").innerHTML =
    `共 ${list.length}/${DATA.stats.items} 条 · 数据源：<a href="${DATA.repo_url}" target="_blank">LLM-Reading kb/</a>` +
    (state.ent ? ` · 实体过滤: <b onclick="filterEnt('${state.ent}')" style="cursor:pointer">${state.ent} ✕</b>` : "");
}
render();
</script>
</body>
</html>
