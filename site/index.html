 接口文本（standard_proposal:jvet:m200-AJ0049、m201-AK0053）、VVdeC 实时 NNPF 开源实现（standard_proposal:jvet:m206-AP0130）。\n- **端到端学习编解码器入锚**：DCVC-FM / DCVC-RT 作为 EE1 学习型帧内锚点（standard_proposal:jvet:m205-AO0186、m205-AO0191、m206-AP0080，交叉验证 m205-AO0295）。外部 MPAI-EEV 提供非 ITU/ISO 路线对照（paper:arxiv:2309.07589）。\n\n### 主线 4：面向机器与新兴内容\nVCM（AHG8）：VVC 工具的机器视觉适用性分析（standard_proposal:jvet:m194-AD0186）、机器消费残差精简（standard_proposal:jvet:m197-AG0217、m198-AH0248）、人机混合消费多层 VVC（standard_proposal:jvet:m197-AG0216、m198-AH0247）；游戏内容（standard_proposal:jvet:m201-AK0081、m201-AK0082）；GFVC（standard_proposal:jvet:m201-AK0068、m202-AL0101）；胶片颗粒（FGC SEI 编辑与网页播放器 standard_proposal:jvet:m198-AH0311、区域特性 SEI 进 VTM TuC standard_proposal:jvet:m203-AM0168）；全息/物波 SEI（standard_proposal:jvet:m195-AE0182、m197-AG0049）；V-PCC 评估指标与承载（standard_proposal:jvet:m193-AC0044、m205-AO0090）。\n\n### 主线 5：HEVC/AVC 存量生态再激活\n- HEVC：MV-HEVC 档位（字节跳动+苹果联合提案 standard_proposal:jvet:m197-AG0201，明确空间视频需求）、4:4:4 MV 档位链（standard_proposal:jvet:m199-AI0045、m200-AJ0247、m204-AN0293、m206-AP0242）、子图支持（standard_proposal:jvet:m199-AI0256、m206-AP0263、m207-AQ0188）、分层色度推导（standard_proposal:jvet:m200-AJ0215）、新档位/颜色描述符/SEI 草案序列（standard_proposal:jvet:m195-AE1006 ~ m207-AQ1006）、整合版本草案（standard_proposal:jvet:m204-AN1018 等）、白皮书（standard_proposal:jvet:m199-AI1011、m200-AJ1011）。\n- AVC：含扩展与修正的整合草案 Draft 1→6（standard_proposal:jvet:m195-AE1016 ~ m206-AP1016）、附加 SEI 支持 Draft 1→5（standard_proposal:jvet:m201-AK1017 ~ m205-AO1017）、新 SEI 扩展机制（standard_proposal:jvet:m205-AO0212、m205-AO0280）。\n\n### 主线 6：SEI 元数据与治理\n绿色元数据、SEI 处理顺序（standard_proposal:jvet:m191-AA2027 系列、HEVC/AVC 移植 m202-AL0210）、SPO/PON 跨规范归属调整（standard_proposal:jvet:m199-AI0146、m204-AN0059）、模态信息 SEI（standard_proposal:jvet:m197-AG0079、m198-AH0049、m201-AK0107）、AI 使用限制（standard_proposal:jvet:m202-AL0062）、数字签名内容（standard_proposal:jvet:m201-AK0194）、目标掩膜/深度/alpha 元数据信令（standard_proposal:jvet:m194-AD0175、m206-AP0229、m206-AP0230）、GSI/显示矩形/打包区域（standard_proposal:jvet:m206-AP0223、m202-AL0138、m202-AL0059）。\n\n### 主线 7：实现部署与许可生态\nVVenC/VVdeC（含多层与 NNPF，standard_proposal:jvet:m195-AE0172、m203-AM0239、m206-AP0130）、Ali266（智能手机实时编码与评测 standard_proposal:jvet:m205-AO0221、m206-AP0124）、BVC（直播优化 standard_proposal:jvet:m200-AJ0256）、Ittiam i266 移动部署（standard_proposal:jvet:m206-AP0214）、NHK 广播级多层编码器与浏览器/动态层切换原型（standard_proposal:jvet:m201-AK0274、m207-AQ0190、m207-AQ0191\n", "streaming_delivery": "# 流媒体传输 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-15 · 基于 42 条结构化条目 · glm-5.3\n\n# 流媒体传输（streaming_delivery）领域综述\n\n**数据范围**：2022-01-20 至 2026-11-15，共 42 条条目（均为论文）。以下所有量化结论严格保留条目原始口径。\n\n---\n\n## 发展历程\n\n### 阶段一：学习型 ABR 的多场景渗透与跨层化（2022–2023）\n\n2022 年以 ENAVS 开局：用 DRL 联合优化 ABR 码率决策与客户端视频增强，在相同带宽与算力条件下较常规 ABR 流多交付 5%–14% QoE，并给出“客户端处理中增强优于超分辨率（SNR 与 FPS 双指标）”的判断（paper:arxiv:2201.08197）。\n\n2023 年出现 16 条条目的方法爆发，沿三条轴同时扩展：\n\n- **场景轴**：从长视频点播外溢至实时视频通信（Palette paper:arxiv:2304.03505；Anableps paper:arxiv:2307.03436；Mamba paper:arxiv:2308.03643）、短视频（Incendio paper:arxiv:2304.04637）、360° 视频（BOLA360 paper:arxiv:2309.04023）、语义通信（ABRVSC paper:arxiv:2308.00531）、车载网（paper:arxiv:2311.02664、paper:arxiv:2311.13603）；\n- **层级轴**：优化点从客户端下沉至网络侧——网络辅助多播放器控制（CANE paper:arxiv:2301.05688）、P4 交换机 AQM（DESiRED paper:arxiv:2310.18159）、5G MEC 预取（paper:arxiv:2311.07399）、802.11p MAC 队列映射（paper:arxiv:2311.02664）；\n- **目标轴**：QoE 主观对齐（Jade/RLHF paper:arxiv:2308.04132）、终端能耗（EnDASH-5G paper:arxiv:2302.06004）、供给侧编码能耗（MCBE paper:arxiv:2310.09570）、无应用层报头的 QoE 推断（IMC'23，paper:arxiv:2306.01194）。\n\n**版本/生态里程碑**：dash.js v4.5.0 默认 Dynamic ABR 在延迟目标扫描中被测得最佳整体 QoE，且部分低延迟配置反而损害播放性能（paper:arxiv:2304.13551）；ACM MMGC2022 短视频效用口径（μ=1.85、ν=0.5）成为 SABR 对比的统一基准（paper:arxiv:2304.04637）；RFC 9335 为 RTP 头扩展全加密铺路，倒逼 QoE 推断从 RTP 头降级至 IP/UDP 头（paper:arxiv:2306.01194）；WebRTC 现行版本“GCC 传输层目标码率 + 编码器码控 + 互斥的分辨率/帧率调节模块”的级联结构缺陷被系统诊断（paper:arxiv:2308.03643）。\n\n### 阶段二：规模化测量与 LLM 入场（2024）\n\n- **测量规模化**：首个全球 LEO 视频流测量——基于 Netflix 生产环境两年多遥测，覆盖 85 国、超 100 万 Starlink 家庭，并部署 New Reno+MulTCP 拥塞控制与 ABR 吞吐平滑窗口的真实线上 A/B（paper:arxiv:2409.09846）。生态背景：截至 2024-04 Starlink 近 6000 颗卫星、用户超 260 万；2024-08 在 Netflix 两万余家 ISP 中按观看秒数排第 29。\n- **LLM 入场**：NetLLM 成为首个 LLM 网络适配框架，在视点预测、ABR、集群调度三任务上超越非 LLM SOTA（paper:arxiv:2402.02338）。\n- **沉浸式实验体系化**：Wi-Fi 6 上 Unity Render Streaming/WebRTC 边缘 VR 串流 QoS 评估（paper:arxiv:2402.00540）、ALVR 扩展与 NeSt-VR（paper:arxiv:2407.15614）、XR 帧级跨层 MS-DQN+TPPO（paper:arxiv:2404.09905）、360° MADRL/MAPPO（paper:arxiv:2405.07759）。\n- **学科整合**：端到端流水线综述覆盖 200+ 篇文献，以摄入—处理—分发三阶段重构分类法（paper:arxiv:2403.05192）。\n\n### 阶段三：训练范式、传输底座与现网重审（2025）\n\n- **训练范式反思**：SABR 提出行为克隆预训练 + RL 微调两阶段框架，并自建含专用 OOD 测试集的 ABRBench-3G/4G+ 基准（paper:arxiv:2509.10486）。\n- **LLM 效率化**：Mamba4Net 跨架构蒸馏至线性复杂度 Mamba 学生模型，吞吐 3.96×、存储仅先前 LLM 方案的 5.48%（paper:arxiv:2510.17147）。\n- **传输底座重审**：QUIC 多实现系统性评测揭示实现差异对 QoE 的直接影响（paper:arxiv:2505.21769）；XR 远程渲染测试床对比 WebRTC/DASH/QUIC 类协议（paper:arxiv:2507.00623）。\n- **现网实测**：泰国商用 5G SA/NSA 上 UHD 低延迟 DASH 直播性能评估（paper:arxiv:2511.20961）；语义路线深化至 FFmpeg 内嵌潜在扩散模型压缩 I 帧（paper:arxiv:2502.05695）。\n\n### 阶段四：MoQ 生态、风险感知与世界模型（2026.01–2026.11）\n\n- **MoQ 生态成型**：时移客户端 ABR 切换评测（SWITCH 规范进行中，paper:arxiv:2606.26368）→ 多接入 360° 直播 MultiMoQ（paper:arxiv:2608.06102）→ 3DGS 渐进传输 MoQSplat（对齐 draft-ietf-moq-transport-18，2026-05 版，paper:arxiv:2609.18624）。\n- **LEO 风险感知**：SafeSABR 做会话级尾部风险控制（paper:arxiv:2605.23560）；StarWorld 跨层世界模型替代单条 trace 回放（paper:arxiv:2611.05832）。\n- **LLM 在线强化**：NetRL 以 SFT + NetGRPO 统一网络决策任务（paper:arxiv:2610.16226）。\n- **粒度与状态重构**：云游戏对象级 ABR（DIA，paper:arxiv:2610.13698）；IPFS 上无状态网络感知 ABR（paper:arxiv:2606.29574）；HLS 跳转恢复的播放器级修补（IAR，paper:arxiv:2610.33120）；星载 VLM“先摘要后下载”（paper:arxiv:2608.06959）。\n\n〔综述推断〕上述阶段划分依据条目密度与主题迁移：2023 年是“单点算法增益”爆发年，2025 年起重心明显转向训练范式、传输底座与评测方法论的重审，2026 年 MoQ 与安全/世界模型成为新的组织性议题。\n\n---\n\n## 技术主线与代表工作\n\n### 主线一：ABR 决策智能的演进\n\n| 方向 | 代表工作 | 关键口径 |\n|---|---|---|\n| 联合客户端处理 | ENAVS（paper:arxiv:2201.08197） | QoE +5%–14%，增强优于超分（SNR/FPS） |\n| 主观对齐 | Jade（paper:arxiv:2308.04132） | RLHF + 秩比较 QoE 模型，+8.09%–38.13% |\n| 多智能体 RL | Incendio（paper:arxiv:2304.04637）；WebRTC Mamba（paper:arxiv:2308.03643）；360° MAPPO（paper:arxiv:2405.07759） | Incendio 效用分 +53.2% vs SOTA SABR；360° QoE 最高 +85.5%（论文自定义口径） |\n| 理论保证 | BOLA360（paper:arxiv:2309.04023） | 近最优证明 + 较 SOTA +13.6%–372.5% |\n| LLM 化 | NetLLM（paper:arxiv:2402.02338）→ Mamba4Net（paper:arxiv:2510.17147）→ NetRL（paper:arxiv:2610.16226） | 蒸馏后吞吐 3.96×、存储 5.48%；NetGRPO 在 ABR 上较 NetLLM +23.6% |\n| 训练范式 | Incendio（模仿初始化+MARL 微调）→ SABR（BC+RL，paper:arxiv:2509.10486）→ SafeSABR（风险校准 RL 微调+安全容量审计，paper:arxiv:2605.23560） | SABR 在 ABRBench-3G/4G+ 上对 Pensieve/Comyco/NetLLM 取最佳平均排名 |\n\n### 主线二：实时链路的网络—编码协同\n\nPalette 用 RL 统一网络层与编码层，直接最大化“视频质量×卡顿率×时延”加权 QoE，真实环境较 SOTA 卡顿率降 3.1%–46.3%、时延降 20.2%–50.8%（paper:arxiv:2304.03505）。Anableps 针对实时通信中 VBR 编码的大幅码率波动，用发送端历史预测码率区间并交由 RL ABR 设定编码码率目标，较 GCC 视频质量提升 1.88×、码率消耗 −57%、卡顿 −85%、交互延迟 −74%（真实轨迹驱动测试床，paper:arxiv:2307.03436）。Mamba（WebRTC）以 MARL+课程学习协同调控 QP/分辨率/帧率三维（paper:arxiv:2308.03643）。DIA 将粒度推进到对象级：现成语义分割 + transformer 特征提取 + 兴趣感知奖励，免眼动仪，5G 场景归一化平均 QoE 较 SOTA ABR 至少 +20%（paper:arxiv:2610.13698）。\n\n### 主线三：跨层与网络侧辅助\n\nCANE 以 ML 黑盒建模播放器行为 + MPC 级联控制，在网络对客户端内部状态可见性受限条件下求解多播放器 QoE 优化，公平性较纯客户端 ABR +约 50%、较均匀流量整形 +约 20%（现实仿真，paper:arxiv:2301.05688）。DESiRED 在 P4 交换机以 DRL 依据 INT 遥测动态调 AQM 目标时延，MPEG-DASH 测试中卡顿最多降 90×、高分辨率播放质量最高提升 42×（vs 固定阈值 AQM，paper:arxiv:2310.18159）。XR 场景解耦“每 TTI 资源分配”与“每百毫秒码率调整”两个时间尺度：MS-DQN 帧优先级调度单独提升传输质量 49.9%–80.2%，联合 TPPO 后 QoE +3.6%–37.8%（paper:arxiv:2404.09905）。蜂窝侧以复合空间复杂度（视频空间复杂度×时变频谱效率）把效用分配扩展到无线资源域，仅用商用能力即实现 QoE 感知分配（paper:arxiv:2609.09490）。\n\n### 主线四：预测、能效与供给侧\n\n低复杂度吞吐预测：多元线性回归 + 将测量误差方差纳入卡尔曼滤波校正，在 7 个公开 5G 数据集上准确率与推理/再训练耗时均优于 ML/DL 基线，且提升 MPC 类 ABR 的点播与直播 QoE（paper:arxiv:2307.04819）。终端能耗：EnDASH-5G 用迁移学习构建 5G 毫米波吞吐预测 + DRL 同步下载时机与信道，QoE 基本持平下最大能耗较 Pensieve 降 30.5%（paper:arxiv:2302.06004）。供给侧：MCBE 剔除 HEVC/AV1 阶梯中低于 AVC 率失真曲线的表示并按 JND（6 VMAF 点）去冗余，直播场景累计编码能耗 −56.45%、存储能耗 −94.99%、传输能耗 −77.61%（vs 工业实践基线阶梯，paper:arxiv:2310.09570）。\n\n### 主线五：沉浸式与交互式媒体\n\n360° 沿“tile 化 + 视口预测 + 差异化码率”演进：BOLA360 以“高概率 tile 高码率、其余低码率对冲”获得近最优保证（paper:arxiv:2309.04023）；多假设视口轨迹（带概率）+ 视口区域级 MAPPO/CTDE 压缩 6^72 维动作空间（paper:arxiv:2405.07759）。VR 串流：Wi-Fi 6 上 Unity Render Streaming/WebRTC 在 60/90 fps 下 RTT 与抖动极小（paper:arxiv:2402.00540）；ALVR 上扩展网络指标并实现 NeSt-VR 分级 ABR（paper:arxiv:2407.15614）；XR 远程渲染测试床对比 WebRTC/DASH/QUIC 类协议，指出 QUIC 系协议在连接迁移、流复用、多路径上的潜在优势（paper:arxiv:2507.00623）。3DGS：MoQSplat 将渐进质量子组映射到独立 QUIC 流消除队头阻塞，无状态订阅者依 6-DoF 视锥动态请求，且不透明度剪枝优于尺度剪枝（paper:arxiv:2609.18624）。\n\n### 主线六：传输协议体系\n\nDASH/HLS 低延迟：dash.js 延迟目标—配置扫描（paper:arxiv:2304.13551）、5G SA/NSA 上 UHD 低延迟 DASH 实测（paper:arxiv:2511.20961）、hls.js 跳转恢复的 IAR（恢复延迟配对中位数降 2.008 s，200 次配对实验，paper:arxiv:2610.33120）。QUIC：系统评测表明相同拥塞控制算法在不同实现下传输性能差异显著，CC×排队策略×流间竞争共同影响 ABR 与 QoE，主张 CC—ABR 跨层协同设计（paper:arxiv:2505.21769）。MoQ：pub/sub + 中继树 + 对象级交付，从时移 ABR 复用（paper:arxiv:2606.26368）到多接入 360° 直播（消融显示多接入控制是播放连续性收益的主要来源，paper:arxiv:2608.06102）再到 3DGS（paper:arxiv:2609.18624）。去中心化：IPFS 上无状态网络感知 ABR，适配状态嵌入 HTTP 头消除跨提供者同步，故障条件下 QoE 较有状态方案提升最高约 6×（paper:arxiv:2606.29574）。\n\n### 主线七：QoE 测量、推断与建模\n\n仅用 IP/UDP 头的机器学习方法逐秒估计 WebRTC 帧率/分辨率：FPS 估计误差 ≤2 FPS 的秒区间占 83.05%，仅比 RTP 头基线低 1.76 个百分点；覆盖 Meet/Teams/Webex、受控实验室 + 15 个家庭共 54,696 秒（paper:arxiv:2306.01194）。Starlink 全球测量确立“整体质量比肩传统网络、但波动致码率切换与重缓冲增多”的基线认知（paper:arxiv:2409.09846）。Jade 以 SQoE-IV（1350 会话、32 用户、43,200 个打分）实证 MOS 的评分尺度异质性并改用秩比较 + RLHF（paper:arxiv:2308.04132）。\n\n### 主线八：语义/任务导向传输\n\nABRVSC 以 Swin Transformer 语义编解码 + Actor-Critic ABR，低码率下语义分割 MIoU 约为传统方案 2 倍，QoE 较固定码率与传统 ABR 方案提升 36.57%（仿真，paper:arxiv:2308.00531）；潜在扩散模型嵌入 FFmpeg 压缩 I 帧、B/P 帧作为重建精化元数据，配合去噪与视频帧插值恢复时间一致性（paper:arxiv:2502.05695）；星载量化 VLM“先摘要后下载”三阶段协议把下行链路变为语义感知的主动对话（Jetson 边缘平台实现，paper:arxiv:2608.06959）。\n\n---\n\n## 当前关键问题\n\n### 1. 学习型 ABR 的分布外（OOD）泛化与训练稳定性\n\n现有学习型 ABR 因训练轨迹分布有限在 OOD 网络场景下泛化差，这是 SABR 的核心诊断，其对策是 BC 预训练 + RL 微调两阶段训练，并在含专用 OOD 测试集的 ABRBench-3G/4G+ 上对 Pensieve、Comyco、NetLLM 取得最佳平均排名（paper:arxiv:2509.10486）。同构问题在短视频侧早有暴露：PDAS 类 MPC 方案超参数高度依赖上下文，分布外网络失效，Incendio 以专家规则模仿初始化 + MARL 微调缓解（paper:arxiv:2304.04637）。NetLLM 主张预训练 LLM 提供跨任务复用与未见分布泛化（paper:arxiv:2402.02338），但 ABRBench 上其 OOD 表现被两阶段小模型训练超越——〔综述推断〕该对比仅在 SABR 自建基准上完成，大模型适配路线与小模型两阶段路线孰优仍缺统一跨域口径，且行为克隆的分布偏移、RL 微调阶段的奖励设计与基准轨迹覆盖度是三个尚未收敛的技术点。\n\n### 2. LLM 化决策的推理开销与在线适应\n\nTransformer LLM 直接用于网络任务的开销问题由 Mamba4Net 定量回应：跨架构蒸馏后吞吐 3.96×、存储 5.48%，且在三类任务上仍优于不用 LLM 的现有方法（paper:arxiv:2510.17147）。SFT 示范轨迹与在线策略分布的差距由 NetRL 的 NetGRPO 在线强化解决（ABR QoE 较 NetLLM +23.6%），其置信度感知预算在不降低验证 QoE 前提下把端到端训练时间缩短 27.1%（paper:arxiv:2610.16226）。未决技术点：〔综述推断〕条目未给出 LLM/蒸馏模型的单步推理时延相对 ABR 决策周期（秒级）与 RTVC 决策周期（百毫秒级）的适配性量化，蒸馏学生相对教师的质量上限亦未界定。\n\n### 3. 高方差 LEO 信道下传输与 ABR 的结构性失效\n\n三个层次的证据链已经闭合：\n\n- **测量层**：Starlink 点播整体质量与传统网络相当，但 LEO 固有吞吐波动与丢包导致码率切换与重缓冲增多；生产 A/B（New Reno+MulTCP、吞吐平滑窗口）证明流媒体与拥塞控制算法需适应快速演变的网络环境，参数级修补只带来带代价的边际改善（paper:arxiv:2409.09846）。地理上问题被不成比例放大：皮特凯恩群岛 30% 视频流量走 Starlink、赞比亚/卢旺达/马拉维超 5%、美国不足 1%。\n- **算法层**：平均 QoE 目标与尾部风险的冲突显式化——SafeSABR 将严重卡顿会话占比从 22.8% 降至 7.2%，最差 5% 会话重缓冲时长从 54.30 s 降至 22.68 s，平均 QoE 仅损失 1.8%；组件分析表明风险校准 RL 微调与安全容量审计是减少不安全码率决策的关键（真实 Starlink 轨迹，paper:arxiv:2605.23560）。\n- **评测层**：单条录制 trace 只揭示一条实现了的网络路径，无法回答“候选配置在共享未来上如何比较、结论是否可靠”——StarWorld 以跨层世界模型想象多步未来并用校准的 Trust Gate 评估可靠性，将成对控制器的 QoE 效应误差降低 76%（真实 Starlink 测量，paper:arxiv:2611.05832）。\n\n遗留技术点：会话级尾部指标与平均 QoE 的折中系数如何在线选择；世界模型多步 rollout 的模型偏差与数据支持边界（StarWorld 明确引用 MBPO/MOPO 一脉的偏差问题）。\n\n### 4. 网络层—编码层解耦与时间尺度失配\n\n这是贯穿 RTVC、XR、云游戏的结构性痛点，且均有前置实验定量支撑：\n\n- **WebRTC 级联失调**：注入带宽波动后 GCC 目标码率约 7 s 处骤降，编码器输出无法跟随，偏差反向污染 GCC 带宽估计，10 s 后长时间过冲；分辨率/帧率调节模块互斥；固定“码率区间→分辨率”查表存在内容盲区——三类内容的最优分辨率切换点显著漂移，次优切换点最多损失 5 VMAF（paper:arxiv:2308.03643）。\n- **带宽利用率 ≠ QoE**：带宽估计与编码器控制解耦时，仅最大化带宽利用率不能保证 RTVC QoE（paper:arxiv:2304.03505）；VBR 编码的大幅频繁码率波动进一步降低现有 ABR 效率（paper:arxiv:2307.03436）。\n- **帧级时间尺度**：XR 逐帧编码/传输/播放使帧级时延预算（实验取 10 ms）远小于 chunk 型 ABR 的秒级工作周期；GOP 内 I/P 帧重要性差异在现有 MAC 调度器中无从表达（paper:arxiv:2404.09905）。\n- **云游戏范式错位**：4K/120 fps 最低需 45 Mbps、端到端延迟需低于 50 ms、无法预编码多码率阶梯使 ABR 必须实时作用于编码过程本身，而主流 ABR 的 chunk 级（数秒多帧）决策粒度对交互流过粗，帧内均匀码率分配造成注意力带宽浪费（paper:arxiv:2610.13698）。\n- **QUIC 实现碎片化**：相同拥塞控制算法在不同 QUIC 实现下传输性能显著差异并直接传导至 QoE，CC、排队策略与流间竞争动态需与 ABR 跨层协同设计（paper:arxiv:2505.21769）。\n\n### 5. 传输协议语义缺口与实现行为异常\n\n- **MoQ 切换语义**：默认码率切换语义在网络拥塞期间存在引入播放间隙的风险，进行中的 SWITCH 规范旨在提供更顺畅的速率自适应；时移场景标准 ABR 可无修改复用并获得更高吞吐，且订阅端 rebuffering 后整体吞吐反而可能提升——非常规现象的机理未定论（Mininet 仿真，paper:arxiv:2606.26368）。\n- **标准 MoQ 承载多 tile 不稳**：96 客户端、4K/30 fps ERP 源（增强 tile 平均 2.35 Mbps）、DASH 1 s 段 vs MoQ 1 s group 的动机实验显示标准 MoQ 在多条高码率 tile 并发时不稳定，MultiMoQ 靠多接入控制取得播放连续性收益（消融验证为主要来源，paper:arxiv:2608.06102）。\n- **WebRTC 发包模式**：Unity/WebRTC 栈系统性按约 5.56 ms 固定间隔分批发送视频帧、与目标帧率无关，使不同帧率下包延迟一致但增加 Wi-Fi 空口占用；缩短批间隔有利于空口效率与整帧交付时延（paper:arxiv:2402.00540）。\n- **播放器配置反直觉**：dash.js 上部分低延迟配置设置对播放性能产生负面影响，L2A-LL 表现不佳（paper:arxiv:2304.13551）。\n- **有状态方案的脆弱性**：跨提供者状态同步在网络故障/重配置下崩溃，无状态化（状态嵌入 HTTP 头）后故障条件下 QoE 提升最高约 6×（paper:arxiv:2606.29574）。\n\n### 6. QoE 模型有效性与推断降级\n\n- **MOS 范式的实证崩塌**：SQoE-IV 上同一视频打分覆盖 0–100 全量程、几乎所有视频 max-min 差超 50、用户起评分标尺天然错位（user 0 从 0 起、user E 从 60 起），客观状态几乎相同的会话打分从 10 到 80 不等——以 MOS 为监督的 QoE 模型所学 reward 本身被系统性扭曲；秩比较式模型 + RLHF 是已验证替代（+8.09%–38.13%，paper:arxiv:2308.04132）。\n- **推断降级的精度代价**：RTP 头加密趋势（RFC 9335 铺路、Zoom 类私有封装）使 IP/UDP 头推断成为必选项，当前精度代价仅 1.76 个百分点（FPS 误差 ≤2 FPS 秒区间 83.05% vs RTP 头基线），但主观映射与音频 QoE 尚在范围之外（paper:arxiv:2306.01194）。\n- **网络侧可见性受限**：网络对客户端内部状态不可见时，需 ML 黑盒行为建模 + 级联控制抽象实现近优求解（paper:arxiv:2301.05688）。\n\n### 7. 短视频 SABR 的三元联合决策与带宽浪费\n\n问题从“下一 chunk 选哪档码率”扩展为“下载哪个视频 × 选哪档码率 × 是否休眠”三元决策：预取过多时用户划走导致已下载未播放 chunk 被清空（带宽浪费），预取不足则起播延迟与卡顿；效用函数为 QoE − μ·卡顿 − ν·带宽占用（μ=1.85、ν=0.5，MMGC2022 口径），预取价值依赖推荐系统侧的用户留存统计——跨系统信息流（推荐↔传输）的联合优化尚处早期（paper:arxiv:2304.04637）。\n\n### 8. 沉浸式媒体的体量—延迟—决策维度三重矛盾\n\n- **体量**：tile 化 8-tile 4K 全景约 200 Mbps（传统 4K 约 25 Mbps，高一个数量级）（paper:arxiv:2309.04023）；3DGS 三阶球谐每原语 45 参数、真实场景数百万 splats 总量数 GB（paper:arxiv:2609.18624）；ultimate VR 带宽预期超 1 Gbps、运动到光子上限 15 ms（paper:arxiv:2402.00540）。\n- **延迟**：motion-to-photon 与 XR 帧级时延预算（10 ms）远小于现有 ABR 周期（paper:arxiv:2404.09905）。\n- **决策维度**：tile×码率动作空间 N^M（72 tile、6 档即 6^72）；视口预测存在固有不确定性——相近历史轨迹可能分叉出迥异未来，DVMS 多轨迹方案不带概率、预测与决策接口不干净（paper:arxiv:2405.07759）。\n- **底座错配**：TCP 队头阻塞 + HAS 粗分段与 3DGS 细粒度组织不匹配，MoQ 四级层次（Track/Group/Subgroup/Object）成为映射候选（paper:arxiv:2609.18624）；多 tile 并发流任一子集不稳定即产生缺失区域，需多接入控制保障（paper:arxiv:2608.06102）。\n\n### 9. 能效：终端与供给侧双线\n\n终端侧 5G 毫米波下下载时机与信道同步可换最大能耗 30.5% 的降低而 QoE 持平（vs Pensieve，paper:arxiv:2302.06004）；供给侧多编解码器阶梯去冗余（JND=6 VMAF）可同时降编码 56.45%、存储 94.99%、传输 77.61% 能耗（paper:arxiv:2310.09570）；无线资源侧 QoE 感知共享相对速率公平可在可接受质量下支持 3× 并发实时视频会话（先前研究口径，paper:arxiv:2609.09490）。\n\n### 10. 现网承载能力边界\n\n5G SA 在静止、城区移动、高速移动、理想 SINR 全部场景下将 >95% UHD 片段在时限内送达；LTE 超过 20% 片段超时、无法胜任低延迟 UHD 直播；NSA 表现好坏参半、受制于底层 LTE 旧控制信令（泰国商用网实测，paper:arxiv:2511.20961）。叠加 Starlink 的地理依赖度差异（paper:arxiv:2409.09846），接入异质性已成为 QoE 保障的一等变量。\n\n---\n\n## 趋势与展望\n\n**1. 决策智能收敛于“预训练 +（风险感知）RL 微调”范式。** Incendio 的模仿初始化（paper:arxiv:2304.04637）、SABR 的 BC+RL（paper:arxiv:2509.10486）、SafeSABR 的风险校准微调+安全审计（paper:arxiv:2605.23560）、NetRL 的 SFT+NetGRPO（paper:arxiv:2610.16226）四条独立工作线在 2023–2026 逐步趋同于同一训练范式，〔综述推断〕该范式有望成为学习型流媒体传输的默认骨架，其上叠加的安全约束与置信度预算机制是可复用组件。\n\n**2. 基础模型进入网络决策并完成“效率化闭环”。** NetLLM 验证可行性（paper:arxiv:2402.02338）→ Mamba4Net 以蒸馏解决部署开销（3.96×/5.48%，paper:arxiv:2510.17147）→ NetRL 以在线强化解决 SFT 分布偏移（paper:arxiv:2610.16226）。下一步的关键是推理时延预算与实时媒体决策周期的对齐（当前条目未量化）。\n\n**3. 目标函数从平均 QoE 转向尾部风险。** SafeSABR 的会话级尾部指标（最差 5% 会话重缓冲）与 1.8% 平均 QoE 代价的显式折中（paper:arxiv:2605.23560），配合 StarWorld 的世界模型反事实评估（QoE 效应误差 −76%，paper:arxiv:2611.05832），标志着评测与优化目标的双重升级——〔综述推断〕“可校准的想象回放环境”可能逐步取代单条 trace 回放成为 LEO/高方差信道上 ABR 研究的标准基础设施。\n\n**4. MoQ 成为低延迟与沉浸式媒体的统一底座候选。** 2026 年内 MoQ 已从协议评测（时移 ABR 直接复用，paper:arxiv:2606.26368）扩展至 360° 直播多接入（paper:arxiv:2608.06102）与 3DGS 渐进传输（paper:arxiv:2609.18624），其 pub/sub + 中继 + 对象级交付同时覆盖 fan-out 与细粒度自适应。SWITCH 等切换语义规范的落地与拥塞期行为定义是近期最直接的标准化缺口。\n\n**5. 星地一体化与多接入传输。** Starlink 从测量（paper:arxiv:2409.09846）到风险感知算法（paper:arxiv:2605.23560）再到世界模型（paper:arxiv:2611.05832）已形成完整研究链；MultiMoQ 的多路径+无缝切换（paper:arxiv:2608.06102）与 QUIC 系协议的连接迁移/多路径能力（paper:arxiv:2507.00623）指向异构接入下的统一传输层。\n\n**6. 语义/任务导向传输向端到端系统化演进。** 从 ABR 决策嫁接语义编解码（paper:arxiv:2308.00531），到 FFmpeg 内嵌扩散模型的 I 帧压缩（paper:arxiv:2502.05695），再到星载 VLM 的“先摘要后下载”主动对话式下行（paper:arxiv:2608.06959），质量轴正从像素保真切换为任务精度；对象级云游戏 ABR（paper:arxiv:2610.13698）是同一逻辑在保真链路上的投影。\n\n**7. 跨层协同从论文走向可部署形态。** QUIC CC—ABR 协同设计的主张（paper:arxiv:2505.21769）、仅用商用能力的 RAN QoE 感知原型（paper:arxiv:2609.09490）、IPFS 无状态方案对故障鲁棒性与大规模部署的简化（paper:arxiv:2606.29574），共同指向“不改终端应用、不改协议栈内核”的渐进式落地路径。\n\n**8. 开放问题清单。** ① 学习型 ABR 跨基准统一评测与 OOD 口径标准化（ABRBench 为局部起点，paper:arxiv:2509.10486）；② MoQ 拥塞期切换语义与多 tile 并发稳定性（paper:arxiv:2606.26368、paper:arxiv:2608.06102）；③ 主观 QoE 对齐的规模化数据与秩比较模型的跨场景泛化（paper:arxiv:2308.04132）；④ LLM 系模型的决策时延与 RTVC/XR 帧级周期（10 ms 级）的兼容性（paper:arxiv:2404.09905、paper:arxiv:2510.17147）；⑤ 推荐—传输跨系统联合优化（paper:arxiv:2304.04637）。\n", "video_image_coding": "# 视频/图像编码 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-15 · 基于 257 条结构化条目 · glm-5.3\n\n# 视频/图像编码领域综述（截至 2026-11-15）\n\n## 一、发展历程\n\n### 1.1 HEVC/AV1 开源生态奠基与 VVC 定稿（2016–2020）\n\n本阶段的主线是传统混合编码框架的工程成熟化。开源 HEVC 编码器 Kvazaar 于 2016-10 发布 v1.0.0：预设重优化后 veryslow 平均提速约 12.42×（官方口径约 10×），3-fr 档全序列 BD-rate 较 v0.8.3 降 31.0%，并引入无损编码、--crypto 选择性加密与 --erp-aqp 前身特性 [repo_release:github:kvazaar-v1.0.0]。随后 v1.1.0 将码控下沉到 LCU 级并新增 ROI delta-QP [repo_release:github:kvazaar-v1.1.0]；v1.2.0 全预设提速 1.19–1.28×，0-uf 档 BD-Bitrate 降 14.80%，新增帧内预测模式加密与 360° ERP 自适应 QP [repo_release:github:kvazaar-v1.2.0]；v1.3.0 以部分档位降速换取大幅压缩增益（0-uf 档 BD-Bitrate −22.7%），--rd=2 改用 SSD 度量并引入 AVX2 优化 [repo_release:github:kvazaar-v1.3.0]。AV1 侧，dav1d 0.1.0 'Gazelle'（2018-12）作为快速轻量解码器支持全部 AV1 特性与 8–12bit，在 AVX-2 平台上显著快于同期 AV1 解码器 [repo_release:github:dav1d-0.1.0]。2020 年两条标志性事件：Kvazaar v2.0.0 引入 OBA 码控与 VAQ，较 v1.3 平均 BD-Bitrate 降 15.4%–31.1% [repo_release:github:kvazaar-v2.0.0]；VVC（H.266）于 2020-07 定稿，同等主观质量下较 HEVC 约省 50% 码率 [paper:arxiv:2107.13385]。\n\n### 1.2 VVC 工具链落地与学习式编码对标期（2021–2022）\n\nVVC 定稿一年内，VVenC+VVdeC+FFmpeg/GPAC+DASH 构成完整开源端到端工具链，覆盖编码、封装、自适应流与播放 [paper:arxiv:2107.13385]。学习式路线此时以“辅助/混合”形态对标传统编码器：SRVC 以低分辨率码流+时变轻量超分模型流实现同等 PSNR 下 bpp 仅为 H.265 slow 模式的 16%，V100 上解码 90fps [paper:arxiv:2104.02322]；M-SRGAN 作为解码端上采样器集成进 HM 16.20，VMAF 口径 BD 码率节省 35.6% [paper:arxiv:2106.08147]；JCEVC 以压缩-增强联合优化较 x265 LDP veryfast 在 MS-SSIM 口径降 bpp 54.92% [paper:arxiv:2111.14474]。同期浮现部署侧议题：RDO-PTQ 证明以参数量化 MSE 为目标的 PTQ 对压缩任务次优，提出率失真驱动的 INT8 后训练量化 [paper:arxiv:2211.02854]；Gemino 在 Titan X 上实现 1024×1024 实时神经视频会议压缩，同感知质量下码率较传统编解码器低 2.2–5× [paper:arxiv:2209.10507]；CaDM 将降分辨率与降色深联合编码、解码端条件扩散恢复，宣称相对常见标准省 5.12–21.44× 码率 [paper:arxiv:2211.08428]。\n\n### 1.3 LIC 越过 VVC intra 与 NVC 范式深化（2023）\n\n2023 年学习式图像压缩（LIC）系统性超越 VVC intra：LLIC 借大核深度卷积+自适应权重在 Kodak 上较 VTM-17.0 Intra 降 BD-rate 9.49%–10.94% [paper:arxiv:2304.09571]；MLIC++ 以线性复杂度多参考熵模型在 Kodak/PSNR 口径降 13.39% [paper:arxiv:2307.15421]；频率感知 Transformer 在 Kodak/Tecnick/CLIC 上降 13.0%–15.1%（锚点 VTM-12.1）[paper:arxiv:2310.16387]；eContextformer 并行上下文模型较非并行模型解码提速约 210×、较 VTM 16.2 intra 最多省 17% 码率 [paper:arxiv:2306.14287]。视频侧，条件编码范式深化：MMVC 将块级模式决策移植到特征域 [paper:arxiv:2304.02273]、免运动两层 CANF 分层 B 帧编码节省编码端 45% MACs [paper:arxiv:2304.02690]、可训练 MCTF 小波编码 UVG 上较 HEVC 最高省 21% BD-rate [paper:arxiv:2305.16211]。标准化同步推进：JVET NNVC 参考软件 NNVC-4.0 的 NN 帧内预测与环路滤波在 RA/AI/LD 下取得 Y 分量 9.18%–11.94% BD-rate 降低 [paper:arxiv:2309.05846]。部署问题开始显性化：跨平台浮点失配由校准传输机制缓解（720p 实时解码、较 H.265 最多省 24.2%）[paper:arxiv:2309.11276]，MobileNVC 首次在移动端实时解码 1080p YUV420 [paper:arxiv:2310.01258]。方法学层面，大规模实验揭示 BD 插值误差标准场景 <0.5pp、VMAF/能耗/跨编码器场景可达 5pp，与标准化中约 1% 量级的工具采纳判据同量级 [paper:arxiv:2304.12852]。\n\n### 1.4 全面对标 VVC 与生成式压缩爆发（2024）\n\nDCVC-FM 将单模型 PSNR 质量范围从约 3.8 dB 扩至 11.4 dB，并在单 I 帧设置下较先前 SOTA 省 29.7% 码率、MACs 减 16% [paper:arxiv:2402.17414]；同文披露先前 SOTA 在 intra-period=−1 协议下崩塌（HEVC-E 上较 VTM +84.4%），首次系统性暴露宽松测试协议问题。RA 方向 IBVC 码率优于 VTM RA [paper:arxiv:2309.13835]。生成式压缩爆发：GLC 在 VQ-VAE 感知潜空间做变换编码，<0.04bpp 下同 FID 较 MS-ILLM 省 45% [paper:arxiv:2505.16177]（会议版为 2024）；Promptus 以提示词流替代视频流、较 H.265 省 4× 以上带宽 [paper:arxiv:2405.20032]；M3-CVC 以 LMM 层级语义+条件扩散在超低码率优于 VVC [paper:arxiv:2411.15798]。INR 路线 NVRC 在 UVG 上较 VVC VTM RA 平均增益 24% [paper:arxiv:2409.07414]。低时延基准评测显示 JVET ECM 仍综合最优（较 AVM 省 16.1%、较 DCVC-FM 省 11.0%），且神经编码器在大背景运动内容上稳定性劣于传统编码器 [paper:arxiv:2408.05042]。开源生态上 VVenC 1.12.0 引入 CQF 恒定质量模式 [repo_release:github:vvenc-v1.12.0]，VVdec 3.0.0 新增胶片颗粒支持并完成破坏性 API 变更 [repo_release:github:vvdec-v3.0.0]，Kvazaar 2.3.x 持续 AVX2 优化 [repo_release:github:kvazaar-v2.3.1]。\n\n### 1.5 实用化拐点（2025）\n\nDCVC-RT 实现实用化跃迁：1080p 平均 125.2fps 编码/112.8fps 解码，较 H.266/VTM 平均省 21% 码率，并指出编码速度首要瓶颈是非计算性操作（内存 I/O 与函数调用）而非计算量 [paper:arxiv:2502.20762]。GIViC 成为首个 RA 配置下超越 VTM 的 INR 编码器（YUV4:2:0、GOPSize=32 下较 VTM 省 15.94%）[paper:arxiv:2503.19604]。一步扩散压缩成型：OneDC 以单步扩散达 SOTA 感知质量，较多步扩散方案省 39% 码率、解码提速约 20× [paper:arxiv:2505.16687]；StableCodec 将可用码率下探至 0.005bpp [paper:arxiv:2506.21977]。ECVC（较 DCVC-FM 再省 10.5%/11.5%）[paper:arxiv:2410.09706]、BiECVC（RA/IP32 较 VTM 13.2 省 13.4%）[paper:arxiv:2505.09193]、DCMVC（较 VVC 省 22.7%）[paper:arxiv:2505.14541] 标志学习式编码器在各配置下全面对标或超越 VTM。JPEG AI 以主档/高档较 VVC intra 取得 13.1%/19.2% BD-rate 增益，定位首个可在移动设备部署的学习式图像编码标准 [paper:arxiv:2503.16288]。\n\n### 1.6 部署融合与 AI 原生编码（2026）\n\nMLVC 通过显式传输 scale 参数规避 NPU 跨平台熵解码失配，首次在 Apple/Intel/Qualcomm NPU 上跑通神经视频编码（100FPS 量级，VCD 会议基准 MOS 口径较 HEVC-QSV 的 BD-rate 提升超 70%）[paper:arxiv:2606.28027]。AV2 完成实测验证：v13.0 在 RA 配置下较 AV1 基准 PSNR-YUV 省 29.81%、VMAF 省 33.79% [paper:arxiv:2605.15800]，其变换/量化/熵编码新工具（IST、TCQ、ATC、FSC 等）构成完整技术文献 [paper:arxiv:2601.02712]。LLM 进入编码器设计闭环：闭环进化自动发现帧级 QP 启发式（三库平均约省 1.26% 码率）[paper:arxiv:2606.20847]乃至直接设计 Planar 预测器（VVenC faster 下省 0.18%）[paper:arxiv:2609.01535]。新模态持续扩展：事件引导编码 ENVC 较 DCMVC 平均省 39.13% BD-rate（PSNR-RGB）[paper:arxiv:2610.02265]、2D 高斯泼溅实现 4K 实时压缩 [paper:arxiv:2609.14129]、神经无损视频压缩 NeuralLVC 全面优于 H.264/H.265 无损模式 [paper:arxiv:2604.03353]。SVT-AV1 进入 3.x/4.x 高速迭代：3.1.0 RA 提速 15–25% 并新增 RTC 模式 [repo_release:github:SVT-AV1-v3.1.0]，4.0.0 完成破坏性 API 更新并使 AVIF 提速 5–8× [repo_release:github:SVT-AV1-v4.0.0]，4.3.0 全 preset 效率再提升 5–8% [repo_release:github:SVT-AV1-v4.3.0]。VVdec 3.2.x 补齐 ARM NEON/SVE 体系并引入 fuzzing 与五项安全修复 [repo_release:github:vvdec-v3.2.1]。\n\n## 二、技术主线与代表工作\n\n### 2.1 传统混合编码标准的持续演进\n\n标准代际增益稳定在“同质量码率减半”节奏：VVC 较 HEVC 省 40–50% [paper:arxiv:2107.13385; paper:arxiv:2605.21526]，代价是编码复杂度约 10× [paper:arxiv:2312.10567]。VVC 之后的探索沿三条线：JVET ECM（2408 基准中最优）[paper:arxiv:2408.05042]、NNVC（神经网络工具进标准，NNVC-4.0 三配置 Y 分量省 9.18%–11.94%）[paper:arxiv:2309.05846]、AV2（IST/TCQ/ATC/FSC 等变换熵编码工具，实测省 29.81%–33.79%）[paper:arxiv:2601.02712; paper:arxiv:2605.15800]。传统框架内的工具级创新仍在产出：低复杂度不可分离变换 HyGT 在 HEVC 上平均省 6% 且内存较 KLT 少 6.8× [paper:arxiv:2505.21728]、INT-DTT+ 在 VVC MTS 框架下超 3% BD-rate 节省 [paper:arxiv:2511.17867]、快速二次变换 FaSST 计算量较 LFNST 降 83.67% 且 RD 持平 [paper:arxiv:2605.15086]、位置相关预测组合 PDPC 较 HEVC AI 平均省 2.0% [paper:arxiv:2505.23672]、匀加速运动模型 UAMM 与分割辅助帧间预测 SAIP 分别在 VTM 上取得 0.13% 与 0.82%（LDB 平均）增益 [paper:arxiv:2407.11541; paper:arxiv:2403.11694]。\n\n### 2.2 学习式图像压缩：变换与熵模型的双轮演进\n\n变换侧从 CNN/Transformer 混合（TCM）[paper:arxiv:2303.14978]、大核深卷积（LLIC）[paper:arxiv:2304.09571]、频率分解窗口注意力（FAT）[paper:arxiv:2310.16387]、窗口化通道注意力+小波下采样（SCH，四数据集较 VTM-23.1 降 18.54%–24.71%）[paper:arxiv:2409.14090]，演进到通道级小波域注意力（ChWDTA，−17.82% 至 −22.56%）[paper:arxiv:2606.00111]。熵模型侧从超先验+自回归，经棋盘/通道并行（eContextformer 解码提速 210×）[paper:arxiv:2306.14287]，到线性复杂度多参考（MLIC++）[paper:arxiv:2307.15421]、MetaFormer 式轻量变换+超先验引导全局相关（MLICv2 较 VTM-17.0 Intra 降 16.54%–24.35%）[paper:arxiv:2504.19119]、外部先验分层字典（HiDE，较 VTM-12.1 最多省 24.01%）[paper:arxiv:2603.06766]。此外出现结构化替代路线：无熵编码的 EF-LIC 用无约束 VQ+上下文条件自回归变换，编码提速 3×、解码提速 5× [paper:arxiv:2605.23323]。\n\n### 2.3 神经视频压缩：从残差编码到条件编码再到实时化\n\n范式主线是 DVC 系残差编码 → DCVC 系条件编码。理论侧揭示了条件编码预测路径的信息瓶颈（数据处理不等式限制预测信息传递），条件残差编码被提出以兼取两范式优势 [paper:arxiv:2307.12864]，MaskCRT 以逐像素软掩码融合两范式并在 PSNR 上匹敌 VTM-17.0 LDP [paper:arxiv:2312.15829]。上下文挖掘持续强化：结构-细节分解+长短期时域融合使学习型编解码器在全部常用数据集 PSNR/MS-SSIM 超越 VVC [paper:arxiv:2401.15864]；ECVC 引入多帧非局部相关性 [paper:arxiv:2410.09706]；BiECVC 以双向上下文门控成为首个全面超越 VTM 13.2 RA 的方案 [paper:arxiv:2505.09193]；DCMVC 以上下文补偿调制净化传播上下文 [paper:arxiv:2505.14541]。运动表示出现免运动趋势：TLZMC/IBVC 免码率插值式 MEMC [paper:arxiv:2304.02690; paper:arxiv:2309.13835]、光流增强两阶段（DCVC 上省 12.8%）[paper:arxiv:2307.05092]。统一化方面，Uni-LVC 以单模型覆盖帧内/帧间、低延迟/RA 并以可靠性门控对参考失效免疫 [paper:arxiv:2603.05756]。实时化由 DCVC-RT 标志（1080p 125.2/112.8fps）[paper:arxiv:2502.20762]，加速方法沿蒸馏搜索（KD-NVC，RTX 5060 上 1080p 69FPS）[paper:arxiv:2606.04595] 与内容自适应推理（DCVC-FM 单视频最高 41% BD-rate 提升）[paper:arxiv:2510.07283] 推进。\n\n### 2.4 过拟合/INR 路线：解码复杂度的另一极\n\nCOIN→NeRV→HiNeRV→Cool-chic→C3 谱系以逐实例过拟合解耦泛化与容量：C3 以 <3k MACs/px 达 VTM 相当 RD [paper:arxiv:2312.02753]；Cool-chic video 仅约 800 参数、900 乘法/px [paper:arxiv:2402.03179]；缩短训练使 300 乘法/px 仍超 HEVC [paper:arxiv:2403.11651]。视频侧 HiNeRV 较 HNeRV 省 72.3% 比特率 [paper:arxiv:2306.09818]，NVRC 完成首个完全端到端 RD 优化的 INR 压缩 [paper:arxiv:2409.07414]，GIViC 首次在 RA 超越 VTM [paper:arxiv:2503.19604]，NVRC++ 以高分辨率网格+轻网络实现四档固定复杂度（7.3–357.7 kMAC/px）单配置覆盖全码率区间 [paper:arxiv:2606.28163]，S-NVRC 用单一嵌入码流同时支持码率与解码复杂度双维可扩展 [paper:arxiv:2609.04273]。编码慢的痛点由 N-O Cool-chic（编码复杂度降约 1000×）[paper:arxiv:2607.13723]、空间竞争多编解码器选择（CLIC 2020 最多省 14.5% 码率）[paper:arxiv:2605.13243]、LotteryCodec 随机子网搜索 [paper:arxiv:2507.01204] 缓解。\n\n### 2.5 生成式与感知压缩：极低码率主战场\n\nGAN 系（HiFiC→EGIC）之后，扩散先验成为主力：多步方案（PerCo/DiffEIC 类）感知强但解码延迟数秒；一步扩散方案 OneDC [paper:arxiv:2505.16687]、StableCodec（0.005bpp）[paper:arxiv:2506.21977]、DiffCR（两步解码、提速超 10×）[paper:arxiv:2601.10373] 解决延迟；GenVC 首个为压缩从零训练的视频扩散模型（较 GLVC LPIPS 匹配下省 62.5%，1080p 单步 15.1fps/A100）[paper:arxiv:2607.22772]；YODA 以线性 DiT 一步去噪达四项感知指标 SOTA [paper:arxiv:2601.01141]；ZeroGVC 实现免训练低延迟生成式压缩（A800 上 5–10FPS）[paper:arxiv:2606.22371]。RDP 权衡的可操作性由 DCIC 的双衰减因子单码流 Pareto 调节提供 [paper:arxiv:2606.13366]。垂直域超低码率（<0.05bpp）人脸/说话人视频：PFVC [paper:arxiv:2410.08485]、ReGenVC（77 帧约 26kB、8-GPU 24fps 实时）[paper:arxiv:2607.28144]。生成先验与传输表示解耦的 Gen2-VC 以解码侧 LoRA 适配器在码流零改动下匹配 LPIPS 较 VTM-23.0 省 86.65% [paper:arxiv:2609.34725]。感知失真建模本身也在演进：Wasserstein 失真使 C3 以不到 HiFiC 1% 的解码计算量达到相当感知质量-码率权衡 [paper:arxiv:2412.00505]。\n\n### 2.6 面向机器的编码（ICM/VCM）\n\nMPEG VCM 双轨推进：特征压缩端到端多尺度模型较先前方法至少降 52% BD-rate、编码时间较 VVC 基方案减 5–27× [paper:arxiv:2306.16670]；TransVFC 的“压缩后转移”范式以轻量 FST 模块适配新任务而无需重训编解码器 [paper:arxiv:2603.23772]。任务迁移由 TransTIC 的提示机制 [paper:arxiv:2306.05085] 发展到 MoECodec 的 token 级 MoE 路由（分类/检测/分割 BD-rate 分别 −7.74%/−8.98%/−9.72%，远优于 adaptation 基线）[paper:arxiv:2606.21033]。恰可识别差异（JRD）建模从单任务 DT-JRD（较 VVC 省 29.58% 且保检测精度）[paper:arxiv:2411.09308] 走向多任务 MT-JRD（27,264 条标注+属性辅助预测，BD-mAP 较 VVC +3.861%）[paper:arxiv:2604.09421]。率分配层面，MFIBA 以多尺度特征重要性在检测任务较 ELIC 锚点省 38.202% [paper:arxiv:2503.19278]。面向 LVLM 的通用语义压缩将优化目标从任务级损失改为语义 token 损失，率-准确率显著优于 VVC [paper:arxiv:2407.17060]。\n\n### 2.7 编码器智能加速与学习增强\n\nVVC QTMTT 划分搜索是复杂度主源（64×64 intra CTU 最坏情形约 2000× HEVC 块数）[paper:arxiv:2605.21526]。加速路线从轻量 CNN 划分深度预测（VTM10 RA 提速 17–30%、BD-rate +0.37–1.18%）[paper:arxiv:2312.10567]、划分图方法（RA 省 51.30% 编码时间、BDBR 2.12%）[paper:arxiv:2504.18398] 到 CPU 友好的 CNN-Transformer 混合 HFViT [paper:arxiv:2605.29063]。工具级加速：2-tap 滤波器差分将 VVenC MMVD 候选判决降为一次内积，fast preset 下 BD-rate −0.35% 即拿走大部分加速收益 [paper:arxiv:2606.31084]。码控加速：低复杂度第一遍降 VVenC 全帧内编码时间 32%（BD-rate +2%）[paper:arxiv:2306.16786]、VCA 特征+随机森林降 33.3% [paper:arxiv:2602.06242]。神经网络工具低复杂度化：LUT 化 NN 环路滤波以 0.10–0.51% BD-rate 增益、约翻倍时间开销实现部署 [paper:arxiv:2407.10926]。感知 RDO：IDQD 以 Hessian 二次化将 FR-IQA 引入块级 RDO（五种度量 BD-rate 省 14.2–36.7%）[paper:arxiv:2609.30077]；NRM 集成优化适配 UGC [paper:arxiv:2602.15779]；码率分配迁移把 DCVC-FM 的感知重要性蒸馏为传统编码器 QP 图（较 HM-16.20 省 8.25%）[paper:arxiv:2608.07799]；H.264 可微代理驱动自适应量化（分割 BD-rate −17.12%）[paper:arxiv:2607.10478]。\n\n### 2.8 系统、传输与部署\n\n跨平台一致性：从校准流 [paper:arxiv:2309.11276]、SSF 超先验静态量化（同机 BD-rate 代价 +9.02%–9.93%）[paper:arxiv:2410.20145]，到 DCVC-RT 模型整数化 [paper:arxiv:2502.20762]、JOMP 混合精度量化（位操作减 87.6%）[paper:arxiv:2606.13110]、MLVC scale 显式传输 [paper:arxiv:2606.28027]。端侧轻量：MCUCoder 以 10.5K 参数适配 1–2MB RAM MCU，较 M-JPEG 省约 55% [paper:arxiv:2411.19442]；FPGA 上 VQ-LIC 在 220-DSP Zynq-7020 达 47.98fps [paper:arxiv:2609.29727]。硬件评估：软件解码甜点为 AV1（较 VP9 能耗仅 +16.55%、省 43.95% 码率），硬件解码甜点为 HEVC，硬件解码器能耗不足优化软件的 9% [paper:arxiv:2402.09001]；GPU 硬件编码器实时 RD 可匹敌软件编码器但代际 RD 提升甚微 [paper:arxiv:2511.18686]。流媒体系统：帕累托前沿码率阶梯（同 XPSNR 省 11.76%）[paper:arxiv:2601.10607]、DRL 码率阶梯 DQ-Ladder（较 HLS 至少 −10.3% 且解码时间 −22%）[paper:arxiv:2603.13597]、LCEVC 增强层主观评估 [paper:arxiv:2601.10448]。抗丢包与信道：GRACE 联合训练抗丢包（不可解码帧 −95%、卡顿 −90%）[paper:arxiv:2305.12333]、ReLViC 分散打包+双用途 Transformer [paper:arxiv:2608.30202]、语义感知抗差错 NVC [paper:arxiv:2609.16279]、语义通信/JSCC（PVSC 较 VTM+5G LDPC 省 75–87% 带宽）[paper:arxiv:2605.19397]。\n\n### 2.9 评测方法学、数据集与标准化\n\n评测维度扩展：BD 教程综述与误差分析 [paper:arxiv:2304.12852; paper:arxiv:2401.04039]、会议场景 VCD [paper:arxiv:2309.07376]、训练集 BVI-AOM（956 序列）[paper:arxiv:2408.05042]、通用基准 USTC-TD [paper:arxiv:2409.08481]、屏幕内容 SDU-SCICD10K [paper:arxiv:2502.15174]、相机原生谈话头数据集（838 段 FFV1，H.266 较 H.264 VMAF BD-rate 最高 −71.3%）[paper:arxiv:2603.26763]、DCT 频谱诊断（发现 NIC 高频能量 80–97% 泄漏到目标频带外）[paper:arxiv:2611.10000]、时域一致性实证 [paper:arxiv:2605.18378]。标准化：JPEG AI（ISO/IEC 6048/ITU-T T.840，含变码率机制至 2.0bpp）[paper:arxiv:2503.16288; paper:arxiv:2510.13867]、IEEE 1857.11 采纳 iWaveV3 为候选 [paper:arxiv:2403.05937]、AVS NVC 参考软件集成 RDO 优化的跳过模式 [paper:arxiv:2611.00181]、MPEG GS 编码 CTC 启动（双阶段 Morton 排序方案为代表）[paper:arxiv:2609.29041]。\n\n## 三、当前关键问题\n\n### 3.1 复杂度墙：编码侧与解码侧的不对称困境\n\n传统侧，VVC 编码复杂度约为 HEVC 的 10×，QTMTT 划分搜索为最大来源 [paper:arxiv:2312.10567]，这使加速方法必须随 VTM 内部启发式演进持续适配——在旧 VTM 上报告的“−50% 时间”可能被“新版 VTM+调低 MTT 深度”这一零成本操作吞没 [paper:arxiv:2605.21526]。神经侧，自编码器 LIC 解码复杂度可达每像素 10⁵–10⁶ 次乘法量级，移动端不可部署 [paper:arxiv:2307.12706]。DCVC-RT 的关键诊断是：编码速度的首要瓶颈是非计算性操作（内存 I/O 开销 Psize 与函数调用开销 Pnum），而非多数工作关注的 MACs——这解释了“通道减半、算力平方下降但时间近似线性改善”的现象，也意味着单纯算力量化指标（FLOPs/MACs）不足以排序神经压缩方法 [paper:arxiv:2502.20762; paper:arxiv:2311.12821]。率-失真-计算三维评测开始被明确提出 [paper:arxiv:2311.12821]，按每像素 MACs 归一化的 RD 基准（如 ShiftLIC 的 −102.6%）成为新口径 [paper:arxiv:2503.23772]。高分辨率下实时解码仍是硬约束：DCVC-HEM 在 UVG 4K 上实测仅 0.53FPS [paper:arxiv:2609.14129]。\n\n### 3.2 跨平台数值一致性与整数化\n\n神经编码器的熵编码要求编解码两端概率分布逐位一致，而不同厂商 NPU 即便同为 FP16/INT8 也无法逐位复现，一个 index 错位即级联成灾难性解码失败 [paper:arxiv:2606.28027]。解决谱系：(1) 校准辅助码流——编码端识别可能跨量化边界的熵参数并显式传输坐标 [paper:arxiv:2309.11276]，但只是概率性缓解 [paper:arxiv:2606.28027]；(2) 全整数化——DCVC-RT 采用 W16A16 [paper:arxiv:2502.20762]，JOMP 将量化步长与位宽同时作为可学习变量做混合精度（位操作 −87.6%，RD 对标 DCVC-FM）[paper:arxiv:2606.13110]；(3) 结构性改造——MLVC 将 scale 参数从隐式推断改为经固定 factorized 熵编码显式导出，从机制上消除失配 [paper:arxiv:2606.28027]。任务导向 PTQ（RDO-PTQ）同样以率失真损失而非参数 MSE 为目标 [paper:arxiv:2211.02854]。该问题已成为神经编码进入产品系统的先决条件 [paper:arxiv:2610.22421]。\n\n### 3.3 单模型宽质量范围、变码率与码控闭环\n\n传统编码器天然支持连续 QP 调节，而神经编码器长期绑定固定 λ 训练多套模型。DCVC-FM 通过可学习量化缩放+均匀量化参数采样将单模型 PSNR 范围从 3.8dB 扩至 11.4dB [paper:arxiv:2402.17414]；JPEG AI 标准化将变码率作为核心特性（连续码率函数至 2.0bpp）[paper:arxiv:2503.16288]；通道级掩码引导方法以单一 VBR 模型替代 40 个独立模型、存储缩减 14.8–15.9× [paper:arxiv:2610.27037]；渐进式编码走向区间收缩下的序贯隐变量推断（BLI 较 DPICT 降 17.78%）[paper:arxiv:2610.30966]。但码率“可达”不等于“分配最优”：开环 λ 接口在内容动态变化下序列级码率漂移，需 log 域 PI/PID 闭环+GRU 调节器实现精准跟踪（平均码率误差 2.13%–2.88%，BD-rate 再降 4.49%–5.69%）[paper:arxiv:2604.20104]。\n\n### 3.4 长预测链误差累积与测试协议失真\n\nDCVC-FM 首次系统性披露：先前 SOTA（DCVC-DC）在 CTC 规定的 intra-period=−1（全序列单 I 帧）下性能崩塌，HEVC-E 上较 VTM 码率 +84.4%——此前“超越传统 codec”的结论部分建立在小 intra-period 宽松协议上 [paper:arxiv:2402.17414]。缓解机制包括周期性上下文刷新 [paper:arxiv:2402.17414]、上下文补偿调制 [paper:arxiv:2505.14541]、部分级联微调抑制训练-测试序列长度失配 [paper:arxiv:2410.09706]、BiECVC 的数据依赖衰减启发双向门控 [paper:arxiv:2505.09193]。协议反思延伸到基准评测：低时延配置的系统性对比长期缺失，且神经编码器在大背景运动内容上表现出不一致性能 [paper:arxiv:2408.05042]。\n\n### 3.5 条件编码的信息瓶颈与解码端状态开销\n\n条件编码虽理论熵界不高于残差编码，但预测路径受数据处理不等式约束、网络容量有限，极端情形（x_t≡x_c）下无法零码率完美重建 [paper:arxiv:2307.12864]。DCVC 系以缓存大量传播特征缓解，代价是巨大解码图像缓冲：DCVC-TCM/HEM/DC 需 67/67.75/55.75 张全分辨率特征图当量，高分辨率高帧率下片外访存带宽问题长期被忽视 [paper:arxiv:2312.15829]。缓解路线：MaskCRT 软掩码混合两范式 [paper:arxiv:2312.15829]、HyTIP 混合显式解码帧+少量隐特征的递归传播 [paper:arxiv:2508.02072]、MH-LVC 限制每次预测最多两个参考帧 [paper:arxiv:2510.12479]、NVRC++ 将表达负担从网络卸载到高分辨率网格（解码 162.9FPS）[paper:arxiv:2606.28163]。\n\n### 3.6 感知-失真-真实感三角与生成式压缩的落地障碍\n\nRDP 理论约束下，生成式压缩面临三重落地问题。其一，解码延迟：多步扩散方案单图解码数秒（PerCo 3.742s、DiffEIC 7.423s 量级）[paper:arxiv:2506.21977]、生成式视频编码长期无实时方案 [paper:arxiv:2607.28144]；一步扩散已证明“多步采样并非必需” [paper:arxiv:2505.16687]，ZeroGVC/ReGenVC 将帧率推至 5–24FPS 量级 [paper:arxiv:2606.22371; paper:arxiv:2607.28144]，但距通用实时仍有距离。其二，保真与幻觉：扩散采样不保证像素级一致，语义漂移（文字损坏、人脸身份变化）在监控等强保真场景不可接受 [paper:arxiv:2603.06095; paper:arxiv:2606.21030]；单码流内连续调节保真-真实感权衡（DCIC 双衰减因子）成为可操作化方向 [paper:arxiv:2606.13366]。其三，UGC 非纯净参考：保真驱动 RDO 会复刻甚至强化源中已有伪影，需将参考从像素锚点降格为上下文引导（Mamba 感知损失在 DCVC/HiNeRV 上分别省 8.46%/12.89%）[paper:arxiv:2603.25566]。此外生成先验与编解码器的解耦复用（Gen2-VC 的 LoRA 适配器跨 DCVC-RT/ECM/VTM/HM 泛化）是降低该路线边际成本的关键 [paper:arxiv:2609.34725]。\n\n### 3.7 面向机器的编码：表示选择、任务泛化与机器感知阈值\n\n核心张力在“传像素还是传特征”：特征压缩码率低、可隐私保护，但重构特征只适配有限任务网络、泛化性差 [paper:arxiv:2407.17060]。多任务与人机联合感知的方案尚在收敛：单流压缩域表示（JPEG AI 定位）[paper:arxiv:2510.13867]、token 级动态算力分配（MoECodec）[paper:arxiv:2606.21033]、压缩后转移（TransVFC）[paper:arxiv:2603.23772]。级联管线中内层编码器的 SSE-RDO 与后处理包装器失配导致比特浪费，包装器感知 RDO（WA-RDO）可使 HEVC 级联追平 VVC 级最优 [paper:arxiv:2601.22070]。机器侧 JND（JRD）的预测建模刚从单任务走向多任务（MAE 3.781）[paper:arxiv:2604.09421]，与感知编码成熟的 JND 体系相比仍处早期。\n\n### 3.8 评测方法学：从标量 RD 到多维保真\n\n四个具体缺口：(1) BD 插值误差在 VMAF/能耗/跨编码器场景可达 5pp，与 1% 量级工具采纳判据同量级，且各开源实现的拟合器/对数底不统一 [paper:arxiv:2304.12852; paper:arxiv:2401.04039]；(2) 数据集与部署场景错位——高制作水准基准主导评测，会议 [paper:arxiv:2309.07376]、UGC [paper:arxiv:2605.15800]、屏幕内容 [paper:arxiv:2502.15174]、谈话头 [paper:arxiv:2603.26763] 等场景统计特性系统性不同，且编码器×数据集交互效应显著；(3) 标量 RD 掩盖结构性失真——NIC 在 ~1bpp 工作点高频重建能量 80–97% 泄漏到目标频带外、目标频率增益仅 0.02–0.23 [paper:arxiv:2611.10000]，时域一致性随压缩非线性退化且运动可预测性比运动量更决定失稳 [paper:arxiv:2605.18378]；(4) 率-失真-计算联合口径尚未标准化，FLOPs 与运行时均不足以单独排序方法 [paper:arxiv:2311.12821]。\n\n### 3.9 传输鲁棒性与跨层联合优化\n\n严格时延约束下重传不可行，帧内丢包率可能远超网络丢包率 [paper:arxiv:2305.12333]。学习式编码的结构化隐表示对突发丢包更脆弱：连续段打包会产生隐域大块连续缺失，且包间熵依赖导致误差级联 [paper:arxiv:2608.30202]。方向包括编解码联合丢包训练（GRACE）[paper:arxiv:2305.12333]、分散打包+双用途 Transformer 恢复（ReLViC）[paper:arxiv:2608.30202]、语义重要性分包与抗差错熵模型 [paper:arxiv:2609.16279]、语义通信/JSCC 端到端设计（PVSC 单卡 RTX 4090 实时）[paper:arxiv:2605.19397]。分离式“VTM+5G LDPC”基线在低 SNR 短块长场景的失配被量化 [paper:arxiv:2605.19397]，但语义通信的编解码生态、边信息格式与参考缓冲标准化仍是空白 [paper:arxiv:2605.19397]。\n\n## 四、趋势与展望\n\n**（1）标准化与学习式方法的融合加速。** JPEG AI 已作为 ISO/IEC 6048/ITU-T T.840 发布并定位首个移动端可部署的学习式图像标准 [paper:arxiv:2503.16288; paper:arxiv:2610.22421]；NNVC 验证了 NN 工具进 JVET 标准的可行路径 [paper:arxiv:2309.05846]；AVS NVC 参考软件已集成学习式跳过模式决策 [paper:arxiv:2611.00181]。〔综述推断〕下一代标准（VVC 之后的 JVET 主线）将大概率采取“传统工具+选择性 NN 工具”的混合形态，且 NN 工具的采纳判据会附加复杂度与一致性硬约束——AV2 已把编码复杂度 ≤5× AV1、解码 ≤2× 前置为红线 [paper:arxiv:2605.15800]，这一做法将成为后续标准制定的范式。\n\n**（2）实用化主线从“超越 VTM”转向“可部署地超越”。** DCVC-RT、MLVC、KD-NVC、JOMP 等工作表明研究重心已移向实时吞吐、整数化一致性、码控与 NPU 兼容 [paper:arxiv:2502.20762; paper:arxiv:2606.28027; paper:arxiv:2606.04595; paper:arxiv:2606.13110]。部署导向综述与开放基准（TinyLIC：10 kMACs/px 超 HEVC、50 kMACs/px 匹配 VVC）正在把变码率、整数推理、鲁棒性、互操作确立为系统级评测维度 [paper:arxiv:2610.22421]。〔综述推断〕神经编码器在视频会议等特定垂类（MLVC 在 VCD 上 MOS 口径较 HEVC-QSV 提升超 70% [paper:arxiv:2606.28027]）将率先商用，通用分发场景仍将长期由 AV1/AV2/VVC 硬件生态主导——硬件解码能耗不足优化软件的 9% [paper:arxiv:2402.09001] 且 GPU 硬件编码 RD 已可匹敌软件 [paper:arxiv:2511.18686]。\n\n**（3）生成先验作为“解码侧外挂”的解耦架构。** Gen2-VC 证明轻量 LoRA 适配器可在码流与参考帧链零改动下复用于多个异构编码器 [paper:arxiv:2609.34725]；一步扩散持续压缩解码延迟 [paper:arxiv:2505.16687; paper:arxiv:2601.10373]。〔综述推断〕“标准码流+解码侧可插拔生成增强”将成为感知质量升级与标准演进解耦的产业路径，其标准化形态（模型信令、NNR 类压缩 [paper:arxiv:2609.37328]、向后兼容）是关键待解问题。\n\n**（4）LLM/自动化方法进入编码器开发闭环。** 已验证范围从命令生成（ELLMPEG，78% 准确率、零 API 成本）[paper:arxiv:2602.00028]、帧级 QP 启发式进化（平均省 1.26%）[paper:arxiv:2606.20847] 推进到编码工具本体设计（Planar 预测器，0.18%）[paper:arxiv:2609.01535]。〔综述推断〕随着闭环评测成本下降，LLM 驱动的工具提案-验证将补充乃至部分替代标准化中的专家提案流程，但语法信令与解码端可复现性约束仍是主要瓶颈 [paper:arxiv:2609.01535]。\n\n**（5）模态与对象扩展。** 视频编码技术正在外溢：事件相机引导编码 [paper:arxiv:2610.02265]、3DGS/点云编码进入 MPEG GS 标准化 [paper:arxiv:2609.29041]、高斯泼溅作为视频表示（GSVC 1080p 1500fps 渲染）[paper:arxiv:2501.12060; paper:arxiv:2609.14129]、视频编解码器用于 LLM 权重压缩 [paper:arxiv:2606.05861]、神经无损视频压缩 [paper:arxiv:2604.03353]、传感器内闭环压缩（OASIS，6× 压缩、功耗降 5.8×）[paper:arxiv:2609.15749]。VVC 硬件编码支撑 8K 10-bit 4:2:2 V-PCC 实时流（122fps）[paper:arxiv:2606.29179] 显示传统标准向体积视频等新负载延伸。\n\n**（6）评测体系的多维化。** 复杂度约束前置进入 CTC（AV2 案例）[paper:arxiv:2605.15800]、UGC/AS 凸包/扩展色度纳入正式评测 [paper:arxiv:2605.15800]、频谱保真与时域一致性等结构化诊断补位 [paper:arxiv:2611.10000; paper:arxiv:2605.18378]、训练数据工程化（BVI-AOM 许可松绑）[paper:arxiv:2408.05042]。〔综述推断〕“率-失真-计算-鲁棒-任务”五维权衡将取代单一 RD 曲线成为领域默认报告口径，跨平台一致性与解码能耗有望进入标准化符合性测试。\n\n**总体判断**：截至 2026-11，该领域正处于三线交汇期——传统标准线（AV2/ECM/NNVC）以复杂度为约束持续收割工具红利；神经编码线在 RD 越过 VTM 后把主战场转向部署属性（实时、一致、可控、鲁棒）；生成式线在极低码率感知质量上打开传统框架不可达的空间，其与传输表示的解耦正使“标准码流+智能增强”的分层生态成为可能。三线之间的方法互鉴（传统 RDO 思想回流神经编码 [paper:arxiv:2611.00181]、神经工具进入标准 [paper:arxiv:2309.05846]、感知度量驱动传统编码器 [paper:arxiv:2609.30077]）将是未来数年最富产出的方向。\n"}};

function badge(it) {
  let b = it.type === "repo_release" ? '<span class="badge b-rel">版本动态</span>'
    : (it.deep ? '<span class="badge b-read">已精读</span>' : "");
  return b;
}
function itemHTML(it) {
  const links = [`<a href="${it.url}" target="_blank">原文 ↗</a>`]
    .concat(it.deep ? [`<a href="${it.deep}" target="_blank">精读笔记 ↗</a>`] : []).join("");
  return `<div class="item${it.deep ? " read" : ""}">
    <div class="meta"><span>${it.published}</span>${badge(it)}</div>
    <h3><a href="${it.url}" target="_blank">${it.title}</a></h3>
    <div class="oneliner">${it.one_liner}</div>
    <div class="links">${links}</div>
  </div>`;
}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md2html(md) {
  const lines = md.split("\n");
  let out = [], inList = null, tableRows = [];
  const flushList = () => { if (inList) { out.push(`</${inList}>`); inList = null; } };
  const flushTable = () => {
    if (!tableRows.length) return;
    const rows = tableRows.filter(r => !/^\s*\|?\s*:?-+/.test(r));
    out.push("<table>" + rows.map((r, i) => {
      const cells = r.split("|").slice(1, -1).map(c => c.trim());
      const tag = i === 0 ? "th" : "td";
      return "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
    }).join("") + "</table>");
    tableRows = [];
  };
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim().startsWith("|")) { flushList(); tableRows.push(line); continue; }
    flushTable();
    if (/^#{1,3}\s/.test(line)) {
      flushList();
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.replace(/^#+\s*/, ""))}</h${level}>`);
    } else if (/^[-*]\s/.test(line)) {
      if (inList !== "ul") { flushList(); out.push("<ul>"); inList = "ul"; }
      out.push(`<li>${inline(line.replace(/^[-*]\s*/, ""))}</li>`);
    } else if (/^\d+\.\s/.test(line)) {
      if (inList !== "ol") { flushList(); out.push("<ol>"); inList = "ol"; }
      out.push(`<li>${inline(line.replace(/^\d+\.\s*/, ""))}</li>`);
    } else if (line.trim() === "") {
      flushList();
    } else if (line.startsWith(">")) {
      flushList();
      out.push(`<p class="note">${inline(line.replace(/^>\s*/, ""))}</p>`);
    } else {
      flushList();
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  flushList(); flushTable();
  return out.join("");
}

function rowHTML(it, visible) {
  const links = [`<a href="${it.url}" target="_blank">${it.title}</a>`]
    .concat(it.deep ? [`<a href="${it.deep}" target="_blank" style="font-weight:400;font-size:12px;color:var(--accent);">精读笔记↗</a>`] : []).join(" ");
  return `<div class="row-item"${visible ? "" : ' style="display:none"'}>
    <div class="l1"><span class="d">${it.published}</span>${badge(it)}${links}</div>
    <div class="ol">${it.one_liner}</div>
  </div>`;
}
window.showAll = (el, dom) => {
  document.getElementById("items-" + dom)
    .querySelectorAll(".row-item").forEach(r => r.style.display = "");
  el.remove();
};

const sl = document.getElementById("synList");
let synHTML = "";
for (const [dom, items] of Object.entries(DATA.items_by_domain)) {
  if (!items.length) continue;
  const md = DATA.synthesis[dom];
  const nPaper = items.filter(i => i.type === "paper").length;
  const nRel = items.filter(i => i.type === "repo_release").length;
  const counts = `论文 ${nPaper} · 版本动态 ${nRel}` + (md ? " · 附综述" : "");
  const itemsHTML = items.map((it, i) => rowHTML(it, i < 8)).join("") +
    (items.length > 8
      ? `<span class="more-btn" onclick="showAll(this, '${dom}')">显示全部 ${items.length} 条 ▼</span>` : "");
  synHTML += `<div class="syn" id="syn-${dom}">
    <div class="head" onclick="this.parentElement.classList.toggle('open')">
      <h3>${DN[dom] || dom}${dom === DATA.core ? ' <span class="core-tag" style="font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 5px;">核心域</span>' : ""}</h3>
      <span class="arrow">${counts} · 展开/收起</span>
    </div>
    <div class="body">
      ${md ? md2html(md) + `<div class="divider">该领域全部条目（${items.length}）</div>` : ""}
      <div id="items-${dom}">${itemsHTML}</div>
    </div>
  </div>`;
}
sl.innerHTML = synHTML || '<div class="empty">领域综述生成中（scripts/synthesize_kb.py）</div>';

function showTab(t) {
  document.getElementById("view-week").style.display = t === "week" ? "" : "none";
  document.getElementById("view-kb").style.display = t === "kb" ? "" : "none";
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  document.getElementById("tab-kb").classList.toggle("on", t === "kb");
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  const btn = document.getElementById("askBtn");
  const ans = document.getElementById("ans");
  if (!q) return;
  btn.disabled = true;
  ans.textContent = "检索知识库并思考中…（glm-5.3，约 1-2 分钟）";
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    ans.innerHTML = md2html(d.answer) +
      `<div class="used">引用 ${d.used.length} 条：${d.used.join(" · ")}</div>`;
  } catch (e) {
    ans.innerHTML = `<b>问答服务不可达</b>（${e.message}）。线上静态页不带密钥——
      本地运行 <code>uv run --with pyyaml python scripts/serve.py</code> 后访问
      <code>http://127.0.0.1:8931</code> 即可提问；下方领域综述始终可读。`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("foot").innerHTML =
  `音视频信息引擎 · 数据与代码：<a href="${DATA.repo_url}" target="_blank">LLM-Reading</a> · 每日 09:30 自动更新`;
</script>
