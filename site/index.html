* { box-sizing: border-box; margin: 0; padding: 0; }

.wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }

.qa .hint { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }

.ans { margin-top: 14px; font-size: 13.5px; white-space: pre-wrap; }

.syn > .head { padding: 12px 16px; cursor: pointer; display: flex;

.syn > .head h3 { font-size: 14.5px; }
.syn > .head .arrow { color: var(--dim); font-size: 12px; }
.syn .body { display: none; padding: 4px 18px 16px; border-top: 1px solid var(--border);
  font-size: 13.5px; }
.syn.open .body { display: block; }
.row-item { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.row-item:last-child { border-bottom: none; }
.row-item .l1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-item .d { color: #a4acbd; font-size: 11.5px; }
.row-item a { color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 600; }
.row-item a:hover { color: var(--accent); }
.row-item .ol { color: #c6cdbe; font-size: 12.5px; margin-top: 1px; }
.more-btn { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 12.5px;

.divider { margin: 14px 0 4px; font-size: 13px; color: var(--accent); font-weight: 600; }
.body h1 { font-size: 16px; margin: 12px 0 6px; }
.body h2 { font-size: 14.5px; margin: 14px 0 6px; color: var(--accent); }
.body h3 { font-size: 13.5px; margin: 10px 0 4px; }

.body ul, .body ol { margin: 6px 0 6px 20px; }
.body code { background: var(--panel); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
.body table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
.body th, .body td { border: 1px solid var(--border); padding: 4px 8px; }
footer { color: var(--dim); font-size: 12px; margin-top: 36px; text-align: center; }
footer a { color: var(--dim); }

cursive Skill Evolution", "published": "2026-09-27", "url": "https://arxiv.org/abs/2609.33867", "one_liner": "递归自我改进框架：在共享编排图上交替策略学习、独立验证与版本化技能库更新，实现递归技能演化。", "deep": null}]}, "synthesis": {"audio_coding": "# 音频编码 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 11 条结构化条目 · glm-5.3\n\n# 音频编码（audio_coding）领域综述\n\n**数据截止：2026-11-13 ｜ 语料规模：11 条（3 条标准版本动态 + 8 篇论文）**\n\n---\n\n## 发展历程\n\n语料呈现两条时间脉络：**2023-11 至 2024-11 的沉浸式音频标准化进程**，与 **2026-08 至 2026-10 的编码算法研究密集产出期**；两个区间之间（2024-11 至 2026-08）知识库无条目入库。\n\n### 阶段一：沉浸式音频标准从首发到比特流冻结（2023-11 — 2024-11）\n\n- **2023-11-07｜IAMF v1.0.0**：AOMedia 发布沉浸式音频标准首个正式规范，定义 Immersive Audio Model and Formats，面向流媒体与离线场景，覆盖互联网音频流、组播/广播、文件下载、游戏、通信及 VR/AR，呈现端横跨耳机、手机、平板、电视、Soundbar、家庭影院与大屏（repo_release:github:iamf-v1.0.0）。\n- **2024-05-06｜IAMF v1.0.0-errata**：勘误版集中处理互操作细节——为 configOBUs 定义专用 Box、更新保留 OBU 条款、修订 ACN 与 SN3D 规范引用、约束同一 MixPresentation 内 audio_element_id 不重复，并清理 base profile 勘误与 9.1.4/9.2 节歧义（repo_release:github:iamf-v1.0.0-errata）。\n- **2024-07-01 比特流冻结（bitstream frozen）→ 2024-11-08 发布 v1.1.0**：新增 Base-Enhanced Profile、CENC（Common Encryption）通用加密、9.1.6ch 等新布局及 MixPresentationTags 语法语义（repo_release:github:iamf-v1.1.0）。\n\n### 阶段二：量化机制、流式架构与评估方法密集产出（2026-08 — 2026-10）\n\n- **2026-08｜码率分配与超轻量化**：BAMU 在冻结预训练神经语音编解码器上按精确字节预算动态选择 RVQ 前缀深度（paper:arxiv:2608.08432）；AudioTQ 借鉴 LLM 权重量化思想，构建数据无关的单线程 CPU 实时方案（paper:arxiv:2608.15369）。\n- **2026-09｜流式、混合编码与能效实测**：UniStream 提出全因果 48 kHz 多专家 RVQ 流式编解码器（paper:arxiv:2609.09866）；OLAC 实现与 Opus CELT 重叠兼容的无缝有损/无损切换（paper:arxiv:2609.15616）；语料中唯一一份解码端码率-能耗-质量的端侧实测研究发布（paper:arxiv:2609.34524）。\n- **2026-10｜表示革新、严格评估与空间音频**：GS-Codec 以一维高斯泼溅替代量化瓶颈（paper:arxiv:2610.04651）；两阶段 BS.1116-3 听测 + LMM/TOST 统计确定 Opus 音乐感知透明阈值 160 kbps（paper:arxiv:2610.20246）；SEMAC 以方向能量包络压缩高阶 Ambisonics（paper:arxiv:2610.32981）。\n\n---\n\n## 技术主线与代表工作\n\n| 代表工作 | 时间 | 定位 | 核心机制 | 关键量化口径 |\n|---|---|---|---|---|\n| BAMU | 2026-08 | 码率分配 | 冻结模型 + RVQ 前缀深度边际效用分配 | MOS 3.449→3.780（30 名听者） |\n| AudioTQ | 2026-08 | 超轻量 CPU | FWHT 旋转 + 6bit Lloyd-Max + 1bit 残差 | 最高 74.4% 体积缩减、SQNR≈30 dB |\n| UniStream | 2026-09 | 因果流式 | ME-RVQ + 历史解码状态路由 | +5.5M 参数；22.5 kbps ViSQOL 语音 4.67 |\n| OLAC | 2026-09 | 无损混合 | TDAC 与 CELT 重叠结构匹配 | 无缝切换 + SOTA 无损压缩率 |\n| 端侧能效实测 | 2026-09 | 部署评估 | 笔记本/手机解码端能耗 | 若干 DAC/SNAC >200 mJ/kbit；解码 >1 s/s |\n| GS-Codec | 2026-10 | 表示革新 | 1D 高斯泼溅替代量化瓶颈 | 单 checkpoint 免重训练调码率 |\n| Opus 透明阈值 | 2026-10 | 感知评估 | 两阶段 BS.1116-3 + LMM/TOST | 透明阈值 160 kbps |\n| SEMAC | 2026-10 | 空间音频 | 方向能量包络 + 少量 CELT 通道 | 16/36 通道优于全阶 CMF 3 |\n\n### 主线一：沉浸式与空间音频——标准定义与高效压缩双轨并行\n\n标准轨上，IAMF v1.0.0 确立沉浸式音频模型与格式基础，v1.1.0 通过 Base-Enhanced Profile、CENC 加密与 9.1.6ch 布局扩展能力边界（repo_release:github:iamf-v1.0.0；repo_release:github:iamf-v1.1.0）。压缩轨上，Opus 经 Channel Mapping Families 2/3（RFC 8486）逐通道编码全部 Ambisonics 通道，码率随球谐阶数二次增长，构成 HOA 编码的主要瓶颈（paper:arxiv:2610.32981）。SEMAC 将 CELT 频带能量匹配原理推广至方向性信号：仅传输量化后的全阶方向性能量包络 + 更少的 CELT 编码通道，解码端重新施加编码端观测的包络以恢复全阶方向能量分布。在五阶 HOA、与 Opus CMF 3 匹配配置（512 与 768 kbit/s）的 MUSHRA 测试中，仅用 36 个传输通道中 16 个即评分高于全阶 CMF 3；相同传输通道数下亦优于直接阶数截断（paper:arxiv:2610.32981）。\n\n### 主线二：量化瓶颈的系统性再设计\n\n1. **RVQ 深度边际效用分配（BAMU）**：冻结预训练模型不动，用轻量且与码率无关的预测器估计帧级/层级边际潜在失真减少量，在精确序列化字节预算下选择前缀有效的 RVQ 深度；相对匹配的固定深度编码，主观 MOS 由 3.449 提升至 3.780（30 名听者）；EnCodec 上一致率失真增益，DAC 改进集中于中高码率（LibriSpeech 实验，另含 VCTK 评估）（paper:arxiv:2608.08432）。\n2. **多专家扩展量化容量（UniStream ME-RVQ）**：专家路由仅依赖历史解码量化状态、无需传输专家标识；ME-RVQ 相对单一共享码本仅增加 5.5M 参数，支持 GPU 实时推理（paper:arxiv:2609.09866）。\n3. **去 VQ 化瓶颈（GS-Codec）**：以一维高斯基元加权和拟合替代 VQ-VAE 式量化瓶颈，训练管线不含任何量化器，训练后仅对拟合参数做标量量化；单一 checkpoint 通过改变基元数量与每参数位深实现免重训练的细粒度码率-质量控制；可比码率下 SIM/STOI/UTMOS 达到或超过开源 EnCodec 与 DAC，语义性能（WER）相当（paper:arxiv:2610.04651）。\n4. **数据无关标量量化（AudioTQ）**：随机 FWHT 正交旋转将时域幅度均匀化为标准正态分布后逐坐标标量量化；6 比特 Lloyd-Max + 1 比特 QJL 残差构成 7 比特虚拟索引，打包进 8 比特容器对齐 CPU 寄存器边界，无硬件并行加速器的单线程 CPU 上实时执行；基准测试中最高 74.4% 物理体积缩减，SQNR 约 30 dB；论文推导了稀疏输入下的数学失效模式并给出 24 比特录音棚音轨逐比特重建分析（paper:arxiv:2608.15369）。\n\n### 主线三：因果流式与端侧部署能效\n\nUniStream 为语料中唯一全因果 48 kHz 流式神经编解码器，覆盖语音/音乐/环境声：12 kbps 下 UniStream-Top1 的 PESQ 与 UTMOS 与 EnCodec 相当，语音 Mel-D 由 EnCodec 的 13.07 降至 8.21；22.5 kbps 的 UniStream-Top2 在 ViSQOL 语音模式达 4.67、环境声模式达 3.96（后者超过所有 ≤12 kbps 被评估系统）；语音 ViSQOL audio 模式与 24 kbps Opus 差距不超过 0.03 MOS-LQO（paper:arxiv:2609.09866）。部署侧，对四款神经编解码器的笔记本/手机实测表明：质量匹配工作点上，神经编解码器以更低码率达到相近 ViSQOL，但解码端能耗通常高于适用的传统编解码器（AAC-LC、Opus）；EnCodec 在两组质量匹配队列、两种平台上均给出神经编解码器中最低的盈亏平衡传输能耗阈值；若干 DAC 与 SNAC 对比项在 Phone XNNPACK CPU 路径的该阈值超过 200 mJ/kbit，且其全频段 Phone 配置解码 1 秒音频需超过 1 秒（paper:arxiv:2609.34524）。\n\n### 主线四：有损/无损混合与生态兼容（OLAC）\n\nOLAC 基于 TDAC 并与 Opus CELT 模式的重叠结构匹配，实现有损与无损之间无间断、无需传输冗余信息的切换，且在采用 TDAC 的前提下达到 SOTA 无损压缩性能（paper:arxiv:2609.15616）。\n\n### 主线五：感知透明的统计化评估（Opus 透明阈值）\n\n第一阶段（21 名合格听音员、23 段音乐片段）中，128 kbps 与未压缩参考差异检验不可区分（LMM p=0.456）但未通过严格等效检验（TOST p=0.064）；第二阶段 BLUP 筛选的最坏条件压力测试（10 名最关键听音员 + 8 个最难样本）中，128 kbps 被明确检出退化（LMM p=0.030），160 kbps 同时通过差异检验（p=0.747）与严格等效（TOST p=0.024）；结论为 160 kbps 是 Opus 音乐压缩在苛刻听音环境下对未压缩 CD 音质的感知透明码率阈值（paper:arxiv:2610.20246）。\n\n---\n\n## 当前关键问题\n\n### P1｜神经编解码器“低码率”与“高解码能耗”的结构性矛盾（最突出的落地障碍）\n\n- 质量匹配工作点上，被测神经编解码器解码能耗通常高于 AAC-LC/Opus（paper:arxiv:2609.34524）。〔综述推断〕盈亏平衡传输能耗阈值刻画“传输侧节省 = 解码能耗增量”的链路能耗水平，阈值越低越易净获益；DAC/SNAC 若干项 >200 mJ/kbit（Phone XNNPACK CPU 路径）意味着在低能耗近场链路下这些配置净能耗为正——神经编解码器的码率优势仅在传输能耗占主导的链路兑现。\n- 实时性失守：DAC 与 SNAC 全频段 Phone 配置解码 1 s 音频需 >1 s（paper:arxiv:2609.34524）；而 UniStream 的实时性依赖 GPU 推理（paper:arxiv:2609.09866）。〔综述推断〕“GPU 实时”与“手机 CPU 实时”之间的鸿沟（CPU 推理路径的算子效率）是神经编解码器端侧化的核心工程瓶颈，解码端架构选择影响巨大（EnCodec 在两组队列、两种平台均为神经方案中最低阈值）。\n- 待解技术点：解码端计算与码本访问的能耗优化、按平台分级的模型配置策略；条目未覆盖相关优化手段。\n\n### P2｜码率控制与训练架构的耦合：固定深度/固定码率的次优性\n\n- 固定 RVQ 深度在精确字节预算下显著次优：BAMU 动态前缀深度选择将 MOS 由 3.449 提至 3.780（paper:arxiv:2608.08432）。\n- 冻结模型约束下的适配边界：BAMU 预测器与码率无关且轻量、无需改动冻结模型，但增益依架构而异——EnCodec 一致增益、DAC 集中于中高码率（paper:arxiv:2608.08432），跨架构泛化性条目未覆盖。\n- 免重训练码率控制的另一路径是 GS-Codec 的“基元数量 × 每参数位深”双旋钮（paper:arxiv:2610.04651），但条目仅覆盖语音维度，且训练后标量量化的码率-质量边界标定未展开。〔综述推断〕外挂分配器（BAMU）与架构内建连续可调（GS-Codec）两条路线尚未在统一评测下比较；可变码率与流式自适应码率（ABR）的协同亦无条目涉及。\n\n### P3｜因果流式下的量化容量、边信息与跨内容通用性\n\n- ME-RVQ 以 +5.5M 参数（相对单一共享码本）解决共享码本容量不足，路由仅依赖历史解码量化状态、零专家标识边信息（paper:arxiv:2609.09866）。\n- 质量余差仍存在：语音 ViSQOL audio 模式下 UniStream-Top2 与 24 kbps Opus 差距 ≤0.03 MOS-LQO——接近但按条目口径未声明超越（paper:arxiv:2609.09866）。\n- 极低码率语音已具优势（12 kbps 语音 Mel-D 8.21 vs EnCodec 13.07），环境声 22.5 kbps ViSQOL 3.96 超过所有 ≤12 kbps 被评估系统，但音乐维度条目未给出量化指标（paper:arxiv:2609.09866）。〔综述推断〕路由依赖历史解码状态的设计在丢包/失同步场景下的鲁棒性，是流式部署的关键未知项。\n\n### P4｜空间音频：码率随阶数二次增长 vs 参数化方向表示的保真边界\n\n- Opus CMF 2/3 逐通道编码使码率随球谐阶数二次增长（paper:arxiv:2610.32981），HOA 高阶化的传输成本失控。\n- SEMAC 已验证“少传输通道 + 量化方向能量包络”在感知上优于“低精度编码全部 HOA 通道”与“直接阶数截断”（16/36 通道、512 与 768 kbit/s、五阶 MUSHRA 优于全阶 CMF 3）（paper:arxiv:2610.32981）。\n- 开放点：SEMAC 恢复的是全阶方向能量分布，包络量化精度与通道削减数的联合率失真优化、非能量类空间属性（相位/相干性等）的保持，条目均未涉及〔综述推断〕。〔综述推断〕该问题与 IAMF 部署侧相关：IAMF 定义格式与呈现，HOA 传输效率仍取决于底层编解码器的选择。\n\n### P5｜感知评估方法学：“不可区分”不等于“等效”\n\n- 128 kbps 差异检验 p=0.456 却未过 TOST（p=0.064），且在最坏条件压力测试下被检出退化（p=0.030）；160 kbps 双重通过（p=0.747 / p=0.024）（paper:arxiv:2610.20246）。\n- 技术要点：仅依赖差异检验（零假设不显著）会系统性高估透明性；等效性检验（TOST）+ BLUP 双向（听音员 × 样本）最坏条件筛选构成更严格的透明性声明流程（paper:arxiv:2610.20246）。〔综述推断〕该方法论对神经编解码器的主观评测同样构成改进方向；160 kbps 阈值为 Opus 音乐场景码率规划提供量化锚点。\n\n### P6｜超轻量数据无关编码的质量上限与失效边界\n\n- AudioTQ 的 SQNR 约 30 dB、最高 74.4% 物理体积缩减（基准测试最大值），存在被推导证明的稀疏输入数学失效模式（paper:arxiv:2608.15369）。\n- 其设计取向是 CPU 寄存器对齐（7 比特虚拟索引入 8 比特容器）而非感知最优（paper:arxiv:2608.15369）；24 比特录音棚音轨逐比特重建分析指向专业音轨场景的适用边界，但条目未给出与传统/神经感知编解码器的横向主观对比〔综述推断：其与感知编码路线的质量差距待界定〕。\n\n### P7｜标准文本工程化与互操作风险（IAMF）\n\nv1.0.0-errata 集中修复 configOBUs 封装、保留 OBU 处理、audio_element_id 唯一性等互操作细节（repo_release:github:iamf-v1.0.0-errata），表明沉浸式标准的部署一致性依赖持续的规范澄清机制；v1.1.0 引入 CENC 与 Base-Enhanced Profile 后，加密流与 MixPresentation 混合呈现的交互正确性成为新的互操作面（repo_release:github:iamf-v1.1.0）〔综述推断：CENC 与 MixPresentationTags 的交互细节条目未展开〕。\n\n---\n\n## 趋势与展望\n\n1. **量化瓶颈“去 VQ 化”与码率控制后置化**：从端到端学习量化器（RVQ）转向“参数化分解 + 训练后量化”（paper:arxiv:2610.04651）与“冻结模型 + 外挂分配器”（paper:arxiv:2608.08432），训练成本与部署期码率控制正在解耦。〔综述推断〕该方向有望统一可变码率、按内容自适应深度与流式 ABR 需求，是神经编解码器走向工程化的关键路径。\n2. **评估维度从“码率-质量”扩展为“码率-能耗-质量”**：端侧实测确立“低码率不必然带来端侧能耗收益”的结论（paper:arxiv:2609.34524）。〔综述推断〕解码能耗将进入编解码器设计的优化目标与基准报告的固定栏目，移动 CPU 实时性可能成为神经方案的准入门槛。\n3. **以 Opus/CELT 为锚点的兼容式演进**：OLAC 的无缝有损/无损切换（paper:arxiv:2609.15616）与 SEMAC 对 CELT 的复用（paper:arxiv:2610.32981）表明新能力倾向于在既有生态内叠加而非整体替换。\n4. **空间音频标准与压缩双轨推进**：标准化侧 IAMF 完成比特流冻结并补齐 Profile 与加密能力（repo_release:github:iamf-v1.1.0）；压缩侧“能量包络 + 少通道”已被主观验证优于逐通道编码与阶数截断（paper:arxiv:2610.32981）。〔综述推断〕更高球谐阶数与动态空间场景下的包络编码效率是下一步竞争点。\n5. **透明性声明的统计严格化**：等效性检验 + 最坏条件压力测试的流程（paper:arxiv:2610.20246）〔综述推断〕或成为后续编解码器主观评测与“透明”营销声明的方法论基线。\n6. **超轻量与全神经两条路线并行，中间地带空白**：数据无关 8 比特容器方案面向无加速器环境（paper:arxiv:2608.15369），全因果 48 kHz 多专家方案面向 GPU 实时流式（paper:arxiv:2609.09866）；〔综述推断〕移动 CPU 上的实时高质量神经编码——兼顾 P3 的容量设计与 P1 的能耗约束——是当前语料中未见覆盖、最具价值的攻关方向。\n", "immersive_media": "# 沉浸式与三维 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 14 条结构化条目 · glm-5.3\n\n# 沉浸式与三维媒体（immersive_media）领域综述\n\n**数据窗口**：2026-07-03 — 2026-11-10，共 14 条，全部为论文条目（无 repo_release 版本记录）。G-PCC/TMC13、V-PCC、GeS-TM、V-Mesh/V-DMC、Draco、GIFStream、TED-4DGS、OMG4 等均以条目中的对比基线身份出现，表明其在该窗口内仍是事实评测锚点。窗口仅约 4.5 个月，阶段划分以问题簇按月聚类。\n\n## 发展历程\n\n**阶段一：表示层争议与属性压缩基础（2026-07 — 2026-08）**\n- 动态点云**属性压缩**被确立为独立问题：基于图的帧间运动估计 + 免插值分数体素细化，MPEG 数据集有损几何条件下较 G-PCC 平均省 55.3%（vs GeS-TM 42.3%、vs V-PCC 16.5%），无损几何条件亦占优（paper:arxiv:2607.03576）。\n- **INR 与高斯泼溅之争显性化**：指出高斯表示视频/2D 稠密域时所需高斯数常逼近像素总数，主张以 INR 为统一连续表示，换取压缩、超分辨与深度生成模型集成能力（paper:arxiv:2607.16362）。\n- **隐私约束前置到相机端**：InViStream 在采集侧净化多视角 RGB-D、仅融合安全点云，>30 FPS 实时体视频流，合成场景重建 SSIM>0.98（paper:arxiv:2608.11645）。\n- **长序列表示引入时间条件锚点**：ATGS 以时间窗口激活 + 多级锚点特征（全局+局部空间+局部时间）约束高斯生成，缓解基元级长程跟踪的固有不稳定（paper:arxiv:2608.30184）。\n\n**阶段二：压缩与重建工具链密集落地（2026-09）**\n- 实时压缩极限推至**亚帧延迟**：DELUGE 利用粒子时间相干性与速度可预测性，解码较 G-PCC(TMC13) 快约 20×、编码较 Draco 快约 6×，落地 Web 与 Apple Vision Pro 端到端客户端（paper:arxiv:2609.19750）。\n- **纹理压缩范式转移**：TexF 以网格表面导出的稀疏体素替代 2D UV 图集，3DNTC 实现 GPU 常驻神经压缩与表面随机访问，MPEG/AOM 基准码流与 GPU 常驻两种模式率失真均优于代表性 UV 方法（paper:arxiv:2609.23606）。\n- 退化输入重建：ClearGS 以可靠性感知视图分配（分级权重替代二值筛选）+ 渲染引导视频修复处理画质混杂手持视频（paper:arxiv:2609.31509）。\n- 4DGS 压缩出现**数量级跃升**：SAGA 以 4D 时空分层稀疏锚点 + 核插值 INR 解码 + 记忆模块，Neu3D 上 PSNR-BD-rate 相对 GIFStream −90.88%、TED-4DGS −64.30%、OMG4 −65.14%（paper:arxiv:2609.33969）。\n\n**阶段三：挑战赛驱动与端侧流媒体（2026-10）**\n- 无损网格压缩统一框架：OctMesh 在共享八叉树层次联合编码几何与连接性，MPEG V-DMC 8 序列 256 帧上平均 **7.033 bit/face** 无损恢复最细层顶点/边/无向面，较 V-Mesh 低 12.8%，同一表示支持九级渐进细化（paper:arxiv:2610.04281）。\n- **稀疏视角成为竞技焦点**：其一以区域自适应空间先验 + 运动一致时间先验 + 扩散虚拟相机伪监督实现六相机宽基线 4D 重建，验证集全帧 PSNR 25.60→29.75 dB，官方测试 30.04 dB 全帧 / 27.88 dB 前景，稀疏视角赛道总排名第一（paper:arxiv:2610.04606）；其二将稀疏视角 3DGS 重构为少样本学习问题（光流伪视角 + 相机-场景联合优化 + 运动感知 dropout/早停），获 SIGGRAPH Asia 2025 体积视频挑战赛稀疏视角赛道第一（paper:arxiv:2610.25887）。两条目均称第一，应分属不同赛事或批次〔综述推断〕。\n- 移动端流媒体：ResStreamGS 按高斯时间特性双流分流编码，复杂全场景编码后 PSNR 较受控 V³ 式全高斯基线提升 7.51–8.35 dB，摊销传输负载最多降 56.5%（上界），骁龙 778G 上 30.883 FPS（paper:arxiv:2610.21121）。\n\n**阶段四：评估基础设施与跨域反思（2026-11）**\n- 主观评估基准建成：3DGS-VBench+ 含 3036 个 3DGS 重建视频（11 真实 + 22 合成场景、6 种代表性压缩算法）、9108 个 MOS，覆盖整体/几何/颜色三维；3DGSV-Assessor 单次前向输出三维分数、RR/NR 双模式（paper:arxiv:2611.04498）。\n- 跨域负结果：科学粒子与 CV 点云分形维数本质不同（后者局部平面状），八叉树归纳偏置失效，神经编解码器相对 G-PCC 仅边际码率缩减（paper:arxiv:2611.14832）。\n\n**版本里程碑形态说明**：窗口内无版本发布条目，里程碑由三类事件替代表征——挑战赛排名（paper:arxiv:2610.25887）、大规模基准发布（paper:arxiv:2611.04498）、端到端系统验证（Vision Pro 双人协作流体交互 paper:arxiv:2609.19750；骁龙 778G 实时渲染 paper:arxiv:2610.21121）。\n\n## 技术主线与代表工作\n\n**主线一：点云/粒子压缩——从码率竞争转向延迟竞争**\n- 属性压缩（paper:arxiv:2607.03576）：增益来源从帧内空间冗余转向**运动补偿去除时间冗余**，运动精度细化至分数体素级（免插值）。\n- DELUGE（paper:arxiv:2609.19750）：分解式熵编码，将**速度场可预测性**直接注入熵模型，实现亚帧延迟编解码；速度倍数口径：≈20×（解码，vs TMC13）、6×（编码，vs Draco）。\n- 边界划定（paper:arxiv:2611.14832）：CV 驱动的 PCC 架构在宇宙学/分子动力学/等离子体数据上仅获边际收益，为负结果型工作。\n\n**主线二：网格与纹理——联合编码与表面直接表示**\n- OctMesh（paper:arxiv:2610.04281）：连接性不再独立编码——子边按端点父节点类型（单子/多子）与是否共享父节点分**四类固定形状预测任务**，父图唯一确定的连接免比特继承，其余由神经预测器驱动算术编码；共享八叉树同时承载几何与连接性，天然支持渐进。\n- TexF/3DNTC（paper:arxiv:2609.23606）：表面导出稀疏体素保留局部三维相关性；体素位置由解码后网格重建、无需单独传输；量化哈希特征 + 轻量解码器支持表面随机访问与实时渲染，可微渲染用于图像空间细化。\n\n**主线三：3DGS/4DGS 体积视频——锚点化、混合 INR 与流式分流**\n- ATGS（paper:arxiv:2608.30184）：时间条件锚点局部化时空支撑，时间窗口仅激活相关锚点以提升长序列可扩展性与时序一致性。\n- SAGA（paper:arxiv:2609.33969）：4D 时空分层稀疏锚点跨时空共享结构参数，核插值 INR 解码生成精细锚点与高斯基元，记忆模块建模**非局部动态与遮挡显露**。\n- ResStreamGS（paper:arxiv:2610.21121）：按高斯时间特性（残差敏感性）分流编码传输，面向移动端。\n- 反方观点（paper:arxiv:2607.16362）：INR 更适配稠密连续域，OmniStyle-INR 以文本/视觉范例引导实现 2D/视频/3D/4D 全模态风格迁移，验证 INR 的跨模态通用性。\n\n**主线四：稀疏视角与退化输入重建——先验注入与过拟合抑制**\n- 生成先验路线（paper:arxiv:2610.04606）：扩散虚拟相机伪监督 + 空间/时间双先验。\n- 少样本正则路线（paper:arxiv:2610.25887）：数据侧伪视角合成与相机-场景联合优化 + 训练侧运动感知 dropout 与早停，协同抑制过拟合并保持动态场景稳定性。\n- 退化视频路线（paper:arxiv:2609.31509）：分级可靠性权重 + 弱化重激活维持轨迹覆盖，无参考修复专家与无参考感知评分（CLIP-IQA/MUSIQ）完成候选选择，无需成对清晰帧监督；在 GS2E 与 GSOTM 上 CLIP-IQA/MUSIQ 一致提升、多数退化设置下 LPIPS 下降。\n\n**主线五：评估、隐私与端到端系统**\n- 评估（paper:arxiv:2611.04498）：排序参考线索经有界门控融入冻结回归器，实现参考灵活（RR/NR）的多维评估，在其他 NVS 基准上具零样本泛化。\n- 隐私（paper:arxiv:2608.11645）：净化时序前置至相机端，避免敏感数据进入融合管线。\n- 系统（paper:arxiv:2609.19750）：经感知质量评估与双人协作任务研究验证实时手部追踪流体交互。\n\n## 当前关键问题\n\n**P1 属性/纹理压缩对几何质量的强依赖与增益上限**\n- 基于几何的帧间属性编码的节省幅度随锚点几何质量显著收窄：同一方法有损几何下 vs G-PCC 省 55.3%，vs V-PCC 仅 16.5%（paper:arxiv:2607.03576）——当几何基线通路本身较强时，属性时间冗余去除的边际收益被压缩；增益中运动补偿与几何重建差异的贡献未解耦〔综述推断〕。\n- 分数体素级运动细化隐含对亚体素几何对齐精度的要求，有损几何下属性-几何错位的误差传播未量化〔综述推断，条目未覆盖〕。\n- 纹理侧范式转移缺量化粒度：TexF 的率失真优势\"摘要未给出具体数值\"，GPU 常驻模式的显存占用、随机访问粒度与既有 UV 工具链的兼容性均无数据（paper:arxiv:2609.23606）。\n\n**P2 实时性指标口径与\"率-延迟-算力\"联合权衡缺失**\n- DELUGE 的 20×/6× 为速度倍数，绝对编解码耗时、所处码率点、\"亚帧\"的帧长基准均未给出，跨方法不可直接比较（paper:arxiv:2609.19750）。\n- OctMesh 的 7.033 bit/face 依赖神经预测器 + 算术编码，但解码吞吐、以及九级渐进在流式消费下的首层质量/时延未报告（paper:arxiv:2610.04281）。\n- ResStreamGS 的 7.51–8.35 dB 增益相对\"受控 V³ 式全高斯基线\"测得，56.5% 摊销负载降幅为上界口径（paper:arxiv:2610.21121）；相对锚点类 SOTA 4DGS 编码器（如 paper:arxiv:2609.33969）的增益幅度未验证，且 30.883 FPS 的工作点（分辨率/高斯规模）未说明〔综述推断〕。\n\n**P3 4D 表示的时空参数共享与非局部动态建模的张力**\n- 基元级显式跟踪长程运动\"本质上不稳定\"（paper:arxiv:2608.30184），SAGA 以跨时空参数共享 + 记忆模块建模非局部动态与遮挡显露（paper:arxiv:2609.33969）——但共享会限制突发运动与新暴露表面的表达，记忆模块的容量-延迟权衡未量化。\n- −90.88% BD-rate 集中于 Neu3D 单一测试集（paper:arxiv:2609.33969），部分反映锚点方案对 GIFStream 的代际差；跨数据集尤其长序列泛化未验证〔综述推断〕。\n- 分钟级长序列下的锚点漂移、时间窗口切换处一致性、与传输层（码率分配、视点自适应）协同均无条目证据〔综述推断〕。\n\n**P4 稀疏视角重建：生成先验的保真度风险与指标窄化**\n- 两条夺冠路线哲学分叉：扩散伪监督（paper:arxiv:2610.04606）vs 少样本正则化（paper:arxiv:2610.25887）。生成伪监督可能引入幻觉内容，全帧 PSNR 提升（25.60→29.75 dB）无法排除感知保真损失，条目无幻觉度量〔条目未覆盖〕。\n- 前景 PSNR（27.88 dB）显著低于全帧（30.04 dB）（paper:arxiv:2610.04606），关键内容区域更难，而赛道目标仍以全帧口径为主，存在指标与内容重要性错配〔综述推断〕。\n- ClearGS 以无参考感知评分（CLIP-IQA/MUSIQ）作候选选择代理（paper:arxiv:2609.31509），无参考感知与几何/颜色保真之间未建立闭环，与 P6 评估问题耦合。\n\n**P5 INR vs 显式高斯之争缺少统一判决条件**\n- \"高斯数逼近像素总数\"的批评针对视频/2D 稠密域（paper:arxiv:2607.16362），而 3D/4D 体积域的显式基元具有可分流（paper:arxiv:2610.21121）、可锚点化（paper:arxiv:2609.33969）的结构优势；实践已收敛为\"显式锚点 + INR 解码器\"混合形态，但纯 INR、纯显式、混合三类在同一数据集上的率-失真-解码速度-显存四维权衡基准尚缺〔综述推断〕。\n\n**P6 质量评估维度分裂与覆盖面缺口**\n- 3DGS-VBench+ 将几何/颜色从整体质量分离标注（9108 MOS），本身即确认\"单一整体分数掩盖维度特异性失真\"（paper:arxiv:2611.04498）；但仅覆盖 6 种代表性压缩算法、33 个场景，锚点选择约束基准代表性。\n- 3DGSV-Assessor 的\"较强零样本泛化\"为定性结论；点云/网格模态无对应多维主观基准，跨模态评估空白（条目仅覆盖 3DGS 视频）〔综述推断〕。\n- 压缩研究（P1–P3）普遍仍以 PSNR/BD-rate 为主口径，与新评估体系尚未打通〔综述推断〕。\n\n**P7 跨域数据结构失配：CV 归纳偏置的边界**\n- CV 点云局部平面状使八叉树有效；科学粒子不具备该特性导致八叉树失效，神经编码器相对 G-PCC 仅边际收益（paper:arxiv:2611.14832）——主流 PCC 架构把平面局部性隐式编码进了归纳偏置，跨域需结构感知（分形维数、物理量场）的再设计而非直接迁移。\n- 反例是 DELUGE 证明速度场先验对物理模拟粒子有效（paper:arxiv:2609.19750），提示\"物理先验\"较\"几何局部性先验\"更具跨域稳健性〔综述推断〕。\n\n**P8 隐私净化的漏检代价未量化**\n- 隐私掩码 Recall 为 0.891（合成）/0.908（真实），即约 9–11% 敏感区域参考未命中（paper:arxiv:2608.11645）；漏检的隐私后果（可识别性、重识别风险）与\"净化强度-重建效用\"曲线均未度量〔条目未覆盖〕；Dice≈0.79–0.80 的边界质量对多视角融合一致性的影响也未讨论〔综述推断〕。\n\n**P9 端到端系统指标未标准化**\n- 已有三类系统级验证——协作交互（paper:arxiv:2609.19750）、移动 SoC 渲染（paper:arxiv:2610.21121）、相机端隐私流（paper:arxiv:2608.11645）——但交互延迟、任务完成质量、功耗等指标各自定义，缺乏可比协议。\n\n## 趋势与展望\n\n- **锚点 + INR 混合成为 4D 压缩主流形态**：时间条件锚点（paper:arxiv:2608.30184）、4D 稀疏锚点 + INR 解码（paper:arxiv:2609.33969）、表面体素 + 轻量神经解码器（paper:arxiv:2609.23606）在表示、压缩、纹理三个子问题上收敛于同一分工——显式稀疏结构承担参数共享与随机访问，隐式解码器承担细节生成〔综述推断〕。\n- **评测维度从率失真扩展为\"率-失真-延迟-交互-隐私\"**：亚帧延迟（paper:arxiv:2609.19750）、移动 FPS（paper:arxiv:2610.21121）、协作任务研究（paper:arxiv:2609.19750）、隐私指标（paper:arxiv:2608.11645）与多维主观 MOS（paper:arxiv:2611.04498）构成系统级评价雏形，走向统一基准是下一步〔综述推断〕。\n- **生成模型从内容生产进入重建与压缩管线**：扩散虚拟相机伪监督已是六相机宽基线重建的关键组件（paper:arxiv:2610.04606），与深度生成模型无缝集成被列为 INR 的核心优势（paper:arxiv:2607.16362）；幻觉风险将催生保真度约束与不确定性量化需求〔综述推断〕。\n- **稀疏采集成为体积视频的经济性配置**：双夺冠路线验证六相机级采集可行（paper:arxiv:2610.04606; paper:arxiv:2610.25887），\"空间/时间/生成先验注入 + 训练正则\"的双策略有望固化为标准管线〔综述推断〕。\n- **压缩的域适应与物理先验化**：科学数据负结果（paper:arxiv:2611.14832）与速度场正结果（paper:arxiv:2609.19750）共同指向以分形维数、速度场、模拟约束替代通用 CV 归纳偏置的结构感知设计〔综述推断〕。\n- **渐进性、随机访问与 GPU 常驻成为三维码流基本能力**：九级渐进（paper:arxiv:2610.04281）、表面随机访问 + 实时渲染（paper:arxiv:2609.23606）、时间窗口激活（paper:arxiv:2608.30184）同时服务流式消费与编辑渲染一体化。\n- **隐私进入设计时序最前端**：相机端净化确立\"采集即净化\"范式（paper:arxiv:2608.11645），后续需与 PCC/3DGS 编码联动——净化造成的缺失区域对压缩与重建的耦合影响尚待研究〔综述推断〕。\n\n**遗留开放问题**：①分钟级以上长序列 4D 表示的漂移与内存行为；②生成先验的幻觉度量；③INR/显式/混合表示的统一四维权衡基准；④点云/网格模态的多维主观评估；⑤隐私漏检的后果量化。〔综述推断〕\n", "processing_enhancement": "# 处理增强 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 11 条结构化条目 · glm-5.3\n\n# 处理增强（processing_enhancement）领域综述\n\n**数据口径**：本综述基于截至 2026-11-13 的全部 11 条条目，观察窗为 2026-07-21 至 2026-11-13，**全部为论文条目，无 repo_release 类版本动态条目**，故下述“里程碑”均为方法学节点而非软件版本节点；阶段划分基于条目自身的时间聚类，属〔综述推断〕性归纳。\n\n## 发展历程\n\n**阶段一（2026-07 至 2026-08）：推理期计算进入稠密复原**\n\n- 2026-07-21，paper:arxiv:2607.18856（DQ-CTM/ThinkSR）将连续思维机器（CTM）的窗口级思考动态引入图像超分：以低秩、参数高效的紧凑-稠密查询机制把窗口级思考表示转化为窗口对齐稠密查询，验证“稀疏潜在思考支撑稠密空间重建”的可行性。在固定 4 tick 训练下，T=0→T=4 时 PSNR-Y 28.1045→30.2817 dB、PSNR-RGB 26.6271→28.7781 dB、平均 L1 误差 0.034602→0.023545；全部 100 张评测图像自 T=1 至 T=4 均获改善、无退化样本——确立观察窗内“多 tick 单调增益”的推理期扩展基线。\n- 2026-08-09，paper:arxiv:2608.08508 以测试时自适应（TTA）统一免参考视频质量评估与视频超分：免重训、免高质量监督，为未知失真下的 VSR 提供感知引导；配套面向屏幕内容的 Transformer 超分架构（保持文字清晰度与结构保真）与区域感知 TTA 策略（选择性精修文字/非文字区域）。至此观察窗内出现两类推理期适应机制：算力轴（思考 tick）与统计/参数自适应轴（TTA）。\n\n**阶段二（2026-09）：扩散先验的复用、采样与评测转向**\n\n- 2026-09-02，paper:arxiv:2609.02036（SelfLift）提出自恢复渐进分辨率过渡，免训练实现少步扩散的晚期升分辨率：FLUX.2-Klein / Z-Image-Turbo 上端到端延迟分别降低 41.5% / 44.1%；结合时间步蒸馏后相对对应 50 步模型取得 29.61× / 19.21× 整体加速。增强技术在观察窗内首次以生成管线内嵌组件的身份出现。\n- 2026-09-27，两条扩散复原路线同日发表：paper:arxiv:2609.33582（Fill2SR）将低质量观测写入修复扩散 Transformer 的原生掩码图像槽位（IIEA），在无 ControlNet 式分支或空间条件 token 下仅需 LoRA 微调即完成“修复模型→真实世界超分”的复用，支持 512/1024/2048 混合分辨率训练与输出（至 QHD），1536² 推理单张 32GB GPU 可运行、分块修复可扩展至多兆像素；paper:arxiv:2609.33834（CLIMB-Flow）面向金字塔级联扩散提出像素域由粗到细后验采样（每尺度交替“终点估计—数据一致性更新—再加噪”三步、近似吉布斯采样），CelebA 数据集上相对最强对比方法 PSNR 增益 1.37–7.66 dB，统一覆盖超分、去模糊、修复与加速 MRI 四类逆问题。\n- 2026-09-30，paper:arxiv:2609.39649（FANVIDv2）确立识别驱动评测：以检测框内人脸/车牌识别得分替代传统 PSNR/SSIM 评估复合退化下的 VSR；2.3M 参数 RCDM 基线将 FaceRecBox 由 0.6864（无超分，48 人基准）提升至 0.7222、匹配人脸身份识别准确率由 84.35% 提升至 86.93%、TextRecBox 由 0.3088 提升至 0.3667（360 车牌号基准），残差图门控变体 RCDM-RMGF 进一步达 0.3801。\n\n**阶段三（2026-10）：决策层上移——智能体编排与训练期控制**\n\n- 2026-10-05，paper:arxiv:2610.06196（EORestore-Agent）将修复决策上移至微调 VLM 智能体：逐步选择修复工具、以预测 PSNR 增益决定接受或停止；在含六种退化类型的合成 Landsat-8 基准上，2–6 种退化复合场景较最强重训 all-in-one 基线 PSNR 提升 2.3–3.2 dB，Sentinel-2 样例显示无需重训即可迁移到真实大气退化。同日 paper:arxiv:2610.07067 表明模型驱动混合框架在医学影像仍活跃：EMD/VMD/MEMD/BEMD 分解与 curvelet 软/硬阈值结合实现 CT 锐核→软核转换，VMD 在全部测试核（B50/B46/B41/B36）上一致取得最高 PSNR 与 SSIM。\n- 2026-10-08，paper:arxiv:2610.11433（DLC）把质量反馈内嵌训练循环：周期性在固定反馈子集上评估、由基于 LLM 的控制器依质量指标更新损失权重向量，架构与损失项无关，在低光照增强、去雨、真实世界超分三任务上以全参考/无参考指标将模型引向保真-感知间更有利的工作点。\n\n**阶段四（2026-11）：条件侧规模化与增强-下游任务耦合**\n\n- 2026-11-03，paper:arxiv:2611.05294（Wonder 4）以混合专家实现按区域并行修复多重退化：每个 MoE 块 13 个专家、每 patch 路由 top-5，以“仅设最低使用份额”的偏置替代语言模型式均衡负载规则（低于份额专家路由分升高直至再次被选中，高于份额者不受干预），无需退化分类器、掩码、提示、检测器或任务标签；在 DIV2K x4、DIV2K x8、Flickr2K x4 上对比五个已发表方法与三个开源权重流程取得最优 LPIPS、DISTS、NIQE（条目自注摘要未给出具体数值）。\n- 2026-11-09，paper:arxiv:2611.11831 将超分与压缩伪影去除端到端联合训练、兼顾人眼与机器感知：重度 JPEG 压缩下 PCB Defect 缺陷检测 mAP@50 由串联 SR-CAR 基线的 0.461 提升至 0.887（PSNR 仅轻微下降），并在 PCB Defect、DeepPCB、NEU-DET 三数据集上总体优于独立/分别训练流水线——完成观察窗内“增强为人眼→增强为机器”的落点迁移。\n\n## 技术主线与代表工作\n\n### 主线一：推理期计算扩展（测试时算力与测试时自适应）\n- **ThinkSR**（paper:arxiv:2607.18856）：思考 tick 作为质量旋钮，逐 tick 单调提升重建（T=1→T=4 全样本改善）；核心技术点是低秩紧凑-稠密查询消解“稀疏思考 token ↔ 稠密空间预测”的表征粒度失配。\n- **TTA-SR/VQA**（paper:arxiv:2608.08508）：以 NR-VQA 的自适应质量预测为感知引导，区域感知策略区分文字/非文字区域；免重训与免 HR 真值是其部署价值核心。\n\n### 主线二：扩散先验的复用、采样与生成-增强一体化\n- **模型接口复用**（Fill2SR，paper:arxiv:2609.33582）：条件接口复用（IIEA 掩码槽位）+ LoRA 轻量适配；基础模型在 DIV2K/LSDIR 合成基准取得最佳 LPIPS，加 RCDT 后以小幅 LPIPS 下降换 RealLQ250/RealPhoto60 上持续更强的无参考质量——同一模型族内显式呈现保真-感知权衡。\n- **采样算法构造**（CLIMB-Flow，paper:arxiv:2609.33834）：尺度间由粗到细 + 尺度内吉布斯式三步交替；坚持像素域（最大重建分辨率 512×512）以规避潜空间自编码器压缩的细节损失，并以四类逆问题验证后验采样器的跨任务泛化。\n- **生成内嵌增强**（SelfLift，paper:arxiv:2609.02036）：晚期分辨率过渡的免训练自恢复；SelfLift-zero 以“直接潜变量提升 vs 像素 VAE 重编码”的分歧同时充当伪影风险信号与模型原生修正方向，无需外部超分、额外去噪器评估或采样日程修改。\n\n### 主线三：复合退化的条件化——MoE 隐式分工、智能体显式编排与模型驱动医学路线\n- **Wonder 4**（paper:arxiv:2611.05294）：patch 级隐式退化分工，最低使用份额偏置兼顾专家利用与避免全图施加同种校正，且零额外损失/模块/处理步骤。\n- **EORestore-Agent**（paper:arxiv:2610.06196）：工具级显式编排 + 预测增益门控；学习型相对质量评分器是关键组件（替换为无参考质量差即损失 1.1–4.6 dB）。\n- **CT 核转换**（paper:arxiv:2610.07067）：分解域（EMD/VMD/MEMD/BEMD）× curvelet 软/硬阈值的组合空间；软阈值保精细视觉细节、硬阈值强噪声抑制，需按应用取舍。\n\n### 主线四：质量度量驱动的评测-训练/决策闭环\n- **事后评测任务化**：FANVIDv2（paper:arxiv:2609.39649）。\n- **训练期闭环**：DLC（paper:arxiv:2610.11433），指标→LLM 控制器→损失权重向量。\n- **推理期闭环**：EORestore-Agent（paper:arxiv:2610.06196），预测增益→接受/停止。\n- 共同特征：质量度量从“事后打分”转为“过程中的控制信号”，且系统上限受评分器/指标保真度约束。\n\n### 主线五：面向机器视觉的增强-下游联合优化\n- **端到端联合训练**（paper:arxiv:2611.11831）：联合优化优于串联流水线（重度 JPEG 下 mAP@50 0.887 vs 0.461），说明压缩感知工业系统中复原目标与检测目标不对齐时级联必然次优。\n- **前置呼应**：识别驱动评测（paper:arxiv:2609.39649）与文字可读性目标（paper:arxiv:2608.08508）分别从评测与目标函数侧推动同一转向。\n\n## 当前关键问题\n\n### 1. 推理期扩展的边界条件未被刻画\n- ThinkSR 的单调增益仅在固定 4 tick 训练范围内验证（paper:arxiv:2607.18856）；超出训练 tick 数的外推行为、tick 数-延迟开销曲线、跨退化类型/难度的增益稳定性均无数据。〔综述推断〕递归计算一般存在收益递减点，但本语料无法给出临界 tick 数。\n- 低秩紧凑-稠密查询的容量假设对高纹理/高频区域的表达上限未做分解分析。〔综述推断〕\n- TTA 路线面向未知失真与屏幕内容（paper:arxiv:2608.08508），但 TTA 统计量在剧烈分布外失真下的漂移与误差累积未量化。〔综述推断〕\n\n### 2. 保真-感知-任务三角无统一操作点，评分器成为系统瓶颈\n- Fill2SR 在同一工作中即呈现基准内冲突：DIV2K/LSDIR 最佳 LPIPS 与 RealLQ250/RealPhoto60 更强无参考质量（RCDT 变体）不可兼得（paper:arxiv:2609.33582）。\n- DLC 的立论前提即固定损失加权无法抵达理想工作点（paper:arxiv:2610.11433）；但控制器依赖固定反馈子集与指标选择，指标偏差会经权重向量放大进训练。〔综述推断〕\n- EORestore-Agent 给出量化证据：学习型相对评分器换成无参考质量差即损失 1.1–4.6 dB（paper:arxiv:2610.06196）——评分器保真度直接决定系统上限，而条目未报告评分器自身的校准/误差分析。〔综述推断〕\n- PSNR/SSIM 与识别得分脱钩已被证明（paper:arxiv:2609.39649），但任务驱动指标仅覆盖人脸、车牌两类语义目标。〔综述推断〕\n\n### 3. 零样本智能体修复的失效模式与接受准则设计\n- paper:arxiv:2610.06196 报告：零样本自然图像修复智能体在 18 个设置中 17 个 PSNR 低于退化输入本身——通用 agent 直接迁移到遥感复合退化不可行，领域微调是必要条件。\n- 有害步骤集中在接受阈值附近：阈值松紧敏感性、预测增益的置信度校准是具体待解技术点；条目仅报告“剩余有害步骤数量少”，未给分布刻画。\n- 停止准则仅以预测 PSNR 增益为据，感知/任务维度增益是否同样可预测未验证。〔综述推断〕\n\n### 4. 扩散复原的分辨率-显存-延迟三元约束与潜域/像素域取舍\n- **显存墙**：1536² 推理即需单张 32GB GPU，多兆像素依赖分块修复（paper:arxiv:2609.33582）；分块接缝一致性与块间伪影未在条目中讨论。〔综述推断〕\n- **像素域保真 vs 分辨率上限**：CLIMB-Flow 以像素域规避自编码器压缩损失，但最大重建分辨率 512×512（paper:arxiv:2609.33834）；潜域路线可达 QHD 却承受 VAE 压缩损失且未量化该损失。〔综述推断〕两路线尚未在同一基准下对齐比较。〔综述推断〕\n- **延迟**：晚期升分辨率环节开销之大可由 SelfLift 的优化收益反推（端到端延迟降 41.5%/44.1%，paper:arxiv:2609.02036）；SelfLift-zero 的分歧信号与实际伪影发生的相关性、分歧阈值标定均未量化。〔综述推断〕\n\n### 5. MoE 区域条件化的可解释性与路由稳定性\n- Wonder 4 的专家-退化对应关系不可显式解释，路由正确性无监督信号（paper:arxiv:2611.05294）；最低使用份额偏置是启发式，份额参数取值、路由震荡与“高于份额专家过载”的边界行为未报告。〔综述推断〕条目亦无专家-退化归因分析。\n- 与智能体路线（paper:arxiv:2610.06196）相比，MoE 无法对单区域错误校正做中途解释与干预——端到端效率与可干预性的取舍尚无定论。〔综述推断〕\n\n### 6. 评测口径碎片化削弱横向可比性\n- 指标子集各自为政：LPIPS/DISTS/NIQE（paper:arxiv:2611.05294）、LPIPS+无参考质量（paper:arxiv:2609.33582）、PSNR/SSIM（paper:arxiv:2610.07067）、识别得分（paper:arxiv:2609.39649）、mAP@50（paper:arxiv:2611.11831）。\n- Wonder 4 的最优性断言无法数值复核（条目自注摘要未给出具体数值，paper:arxiv:2611.05294）。\n- 任务驱动指标与感知指标之间不存在已验证的映射模型。〔综述推断〕\n\n### 7. 机器感知导向下“保真让位”的量化边界\n- 联合训练以“PSNR 仅轻微下降”换取重度 JPEG 下 mAP@50 由 0.461（串联 SR-CAR 基线）至 0.887（paper:arxiv:2611.11831），但下降幅度未量化；检测收益与重建保真冲突时缺乏类似 DLC 的可控调节旋钮。〔综述推断〕\n- 一致性验证覆盖 PCB Defect/DeepPCB/NEU-DET（paper:arxiv:2611.11831），但限于表面缺陷/钢材检测域，跨成像条件（光照、材质、传感器）外推未验证。〔综述推断〕\n\n### 8. 模型驱动医学路线的阈值自适应缺口\n- 软/硬阈值权衡（细节保持 vs 噪声抑制）需按核人工取舍（paper:arxiv:2610.07067）；条目自身指出与自适应阈值算法结合是潜力方向——即阈值参数的图像/信号自适应是明确的未解技术点。\n- 分解方法的模式混叠与端点效应在 CT 核转换语境下的影响未被讨论。〔综述推断〕\n\n## 趋势与展望\n\n1. **从专用复原网络到生成先验复用**：适配成本已从全量训练压至 LoRA 级（paper:arxiv:2609.33582）乃至零训练（paper:arxiv:2609.02036）。〔综述推断〕“复用而非重训”将成真实世界复原的默认路径，掩码槽位式条件接口有望成为 DiT 的通用复原接口。\n2. **质量控制信号闭环化、评分器一等公民化**：度量从事后评测（paper:arxiv:2609.39649）→训练期损失重加权（paper:arxiv:2610.11433）→推理期步骤门控（paper:arxiv:2610.06196）持续前移；1.1–4.6 dB 的消融差距表明学习型评分器本身将成为独立研究对象（paper:arxiv:2610.06196）。\n3. **区域级条件化取代全局退化建模**：patch 级 MoE 路由（paper:arxiv:2611.05294）、区域感知 TTA（paper:arxiv:2608.08508）、分块修复（paper:arxiv:2609.33582）共同指向以区域为处理与条件单元。\n4. **评测任务化与机器感知导向**：识别得分（paper:arxiv:2609.39649）与检测 mAP（paper:arxiv:2611.11831）已进入主流报告。〔综述推断〕“感知指标+任务指标”联合报告将成惯例，复原-检测联合训练在压缩感知工业质检场景将优先落地。\n5. **质量-延迟可调的部署形态**：多 tick 思考（paper:arxiv:2607.18856）、TTA（paper:arxiv:2608.08508）与少步扩散加速（paper:arxiv:2609.02036）同属“按需分配推理算力”谱系。〔综述推断〕可预期出现统一的推理预算控制器。\n6. **观察窗结束时的开放硬问题**：像素域保真与高分辨率兼得（512×512 上限 vs 分块 QHD）、接受阈值与预测增益校准、MoE 专家归因、跨语义类别的任务驱动评测、以及 MoE 与智能体两条条件化路线的公平对比——均无条目给出解。\n\n**边界说明**：以上趋势仅由 2026-07-21 至 2026-11-13 的 11 条论文条目外推，样本量小且无版本动态佐证，方向性结论应视为待验证假设。〔综述推断〕\n", "quality_assessment": "# 质量评估 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 15 条结构化条目 · glm-5.3\n\n# 质量评估领域综述\n\n**领域**：quality_assessment ｜ **数据窗口**：2026-07-25 至 2026-11-13 ｜ **条目**：15 条论文，无 repo_release 版本动态条目。所有量化结论保留条目原始口径；条目未覆盖的推断性判断以〔综述推断〕显式标注。\n\n---\n\n## 发展历程\n\n本窗口仅约 3.5 个月，但呈现出清晰的三阶段演进：\n\n| 阶段 | 时间 | 主题 | 条目 |\n|---|---|---|---|\n| 一 | 2026.07–08 | 指标有效性反思 + 医学 QA 起步 | 2607.23321 / 2607.26333 / 2608.13989 / 2608.21180 |\n| 二 | 2026.09 | 跨信号域扩展 + 标签生产范式创新 | 2609.03283 / 2610.00195 / 2609.25423 / 2609.25716 / 2609.27110 |\n| 三 | 2026.10–11 | MLLM 推理化、任务闭环与可靠性批判 | 2610.25770 / 2610.36978 / 2611.03007 / 2611.06203 / 2611.08754 / 2611.13200 |\n\n**阶段一（2026.07–08）：指标层的系统性反思与医学 QA 落地。** ISP 场景率先引入\"代理参考\"范式：从处理后 sRGB 图与 ISO 元数据预测代理参考图，无参考地估计 PSNR/SSIM/LPIPS，优于直接指标回归、与全参考排名一致性高于常规盲 IQA，且可仅从合成数据学习并泛化到真实相机数据（paper:arxiv:2607.23321）。同期，胸片工作把矛头指向评估本身：更换标签来源（报告衍生 vs 专家图像标注）不仅改变监督分类器（ResNet、DenseNet）与 VLM（MedKLIP、GLoRIA、ConVIRT）的性能估计，还改变模型排名，SSIM/PSNR 与专家诊断可用性判断经常不一致（paper:arxiv:2607.26333）。SI-PSNR 补上 PSNR 变体族对过锐化的惩罚缺失，并发布带均匀锐度增量与 DMOS 标注的数据集（paper:arxiv:2608.13989）。LGE-MRI 工作确立\"微调 VLM 生成结构化报告 → GPT 推理模块输出评分与可用性\"的两阶段医学 QA 架构，判据覆盖噪声、运动伪影、左心房边界、肺静脉区域、欠分割五项（paper:arxiv:2608.21180）。\n\n**阶段二（2026.09）：跨信号域扩展与标签自动化。** QA 讨论外溢至音频（SSL 语义表征不足以预测 MOS，需细粒度声学协同，paper:arxiv:2609.03283）、3D 高斯泼溅（参数域指标 GS-PQM，免渲染视点、优于 25 种现有图像/视频/点云指标，paper:arxiv:2610.00195）与真实 5G 网络（FWA 测试床上 DASH 4K 的帧级 PSNR/SSIM/VMAF 关联，paper:arxiv:2609.25423）。同期出现两条标注侧创新：FoMo 用扩散生成轨迹的分叉时刻全自动生成逐点感知距离标签，替代 MOS 点式标注（paper:arxiv:2609.25716）；Undertone 用他人评分的高斯先验 + 闭式求解实现免训练个性化（paper:arxiv:2609.27110）。\n\n**阶段三（2026.10–11）：MLLM 推理化与可靠性批判。** VHA 以双向 VQA 检测生成式超分幻觉（paper:arxiv:2610.25770）；QRH 引入像素级显式区域表示与确定性采样策略（paper:arxiv:2610.36978）；Q-CamTuning 把质量推理推进到相机参数调整建议的闭环（paper:arxiv:2611.03007）。11 月出现两个批判性节点：LDCT 工作以六项测量文本注入 MLLM 追平挑战赛冠军重训版，同时坦承对过度平滑图像评分偏高的局限（paper:arxiv:2611.08754）；PickGlass-TPI 则证明在 ±5% 织物允差任务下所有被测方法误差均超限、且参考标注自身复拍中位差达 9%，单张照片无法证明达标（paper:arxiv:2611.13200）。\n\n**版本里程碑**：本窗口无版本动态条目。可识别的系统版本锚点为论文中的基座/基线模型：InternVL2 与 DeepSeek 架构（paper:arxiv:2608.21180）、DOVER 作为 QRH 承载模型（paper:arxiv:2610.36978）、Molmo2-4B 与 GPT-6.1-sol（paper:arxiv:2611.13200）。\n\n---\n\n## 技术主线与代表工作\n\n### 主线一：全参考指标族的改造与适用性检验\n- **SI-PSNR**：在 IQA 基准上相关性统计优于所有其他 PSNR 变体；锐度感知复合损失恢复的图像在二值化主观对比中平均胜率 67%（对比无显式锐度目标损失的模型）（paper:arxiv:2608.13989）。\n- **传输侧 FR 指标**：真实开源 5G FWA 测试床上以 PSNR/SSIM/VMAF 实现 DASH 4K 网络性能与体验的帧级关联；MIMO+256-QAM 在 5 并发用户下 VMAF 保持高于视觉无损阈值，SISO 显著退化（paper:arxiv:2609.25423）。\n- **失效证据**：SSIM/PSNR 与放射科专家的胸片诊断可用性判断经常不一致，契合度高度依赖所选度量（paper:arxiv:2607.26333）。\n\n### 主线二：代理/间接参考范式（把 FR 能力搬进 NR 场景与新媒体）\n- **ISP 代理参考图**：sRGB+ISO 元数据 → 代理参考 → 无参考估计三项 FR 指标；LoRA 支撑组件/流水线配置变更时的高效适配（paper:arxiv:2607.23321）。\n- **GS 参数域参考**：从参数域失真误差出发、SVR 估计感知质量，无需渲染预定义视点、结果不依赖视角（paper:arxiv:2610.00195）。\n- **生成式锚定**：FoMo 以扩散轨迹分叉时刻（分叉越早仅共享粗结构、感知距离越大）作为参考锚定的逐点感知距离标签（paper:arxiv:2609.25716）。\n- **语义级全参考**：VHA 用双向 VQA 比对真值图与超分图的语义内容与低层视觉证据（paper:arxiv:2610.25770）。\n\n### 主线三：MLLM/VLM 作为评判器与推理器\n- **结构化报告 + 推理模块**：InternVL2 判据级 Avg ACC=0.65、PLCC=0.79；DeepSeek 架构临床可用性二值判定 Acc=1.00、kappa=1.00；训练集仅 60 个切片-文本对（20 名患者）（paper:arxiv:2608.21180）。\n- **测量注入**：六项图像域测量以文本注入多模态 LLM，LDCT-IQA 2023 测试集 Overall 2.735，与重训冠军持平、高于 MedSigLIP-FiLM 的 2.713；打乱测量输入降 0.048 且噪声测量贡献最大（paper:arxiv:2611.08754）。\n- **感知-证据-引导推理**：Q-CamTuning 在质量评分与细粒度图像对排序上优于现有 IQA 模型，并将质量问题映射到相机参数调整方向，用户研究验证调参建议（paper:arxiv:2611.03007）。\n- **个性化**：Undertone 仅先验 Spearman .640，超已发表 10 评分最优 .581 与 100 评分最优 .620；加 10 条评分 .648、100 条 .676；无标签下评判器期望分数预测 PARA MOS 达 .835，高于作者复现的已发表最优 .694，但 PARA 原始协议下端到端 MOS 训练网络仍占优（paper:arxiv:2609.27110）。\n\n### 主线四：表征融合与模型压缩\n- **语义 + 细粒度声学协同**：融合语义的统一神经音频编解码器表征在 BVCC 及多个域外集上具有更高的 MOS 预测上限（paper:arxiv:2609.03283）。\n- **教师集成蒸馏**：BiCG-Net 以嵌套采样 + 图内差分把 11 个教师蒸馏为 39,482 参数学生，CSIQ/LIVEC 上 PLCC 0.9009/0.9133，超最佳单教师与 11 教师共识；CSIQ→LIVEC 零样本冻结学生 PLCC 0.8416，高于共识 0.1947；铁路弱标签集 PLCC 0.9855（paper:arxiv:2611.06203）。\n\n### 主线五：任务型 / 特定目标 QA 与可靠性\n- **允差制任务 QA**：PickGlass-TPI（76 场景/44 布样）以 ±5% 纱线密度允差评估，VLM、CNN、计数专家、免训练谱计数器全部超差；仅合成图微调的 Molmo2-4B 误差 25%，与 GPT-6.1-sol 给定四张放大特写的 25% 持平、优于其直接提问的 27%，且是唯一两项误差指标均胜均值猜测基线的模型；非专业标注员相对参考计数误差 37%（paper:arxiv:2611.13200）。\n- **特定目标区域 QA**（paper:arxiv:2611.06203）、**临床可用性判定**（paper:arxiv:2608.21180）、**相机调参闭环**（paper:arxiv:2611.03007）。\n\n### 主线六：评估协议与标注方法论\n参考标准选择被视为临床有效性核心组成部分并需按病理类型、成像任务与下游用途论证（paper:arxiv:2611.13200 之外的 paper:arxiv:2607.26333）；全自动标签替代人工 MOS（paper:arxiv:2609.25716）；复拍一致性纳入协议（paper:arxiv:2611.13200）；免像素级标注的质量热图（paper:arxiv:2610.36978）。\n\n---\n\n## 当前关键问题\n\n**1. 指标—人类判断的错位是系统性的，且错位模式随域而变。** 胸片上 SSIM/PSNR 与专家可用性判断经常不一致、契合度高度依赖度量选择（paper:arxiv:2607.26333）；锐度维度上 PSNR 族对过锐化无惩罚，需 SI-PSNR 类度量补位（paper:arxiv:2608.13989）。更隐蔽的是**度量注入引入新偏置**：LDCT 场景中六项图像域测量导致模型对过度平滑的去噪图像给出偏高评分，且消融显示噪声测量贡献最大（paper:arxiv:2611.08754）——度量集合与退化类型耦合，去噪的\"平滑—噪声\"权衡处存在系统性评分倾斜。\n\n**2. 生成式媒体暴露失真度量真空。** 生成式超分的幻觉（真值信息缺失/改变 + 无依据新增内容）超出像素误差可分辨范围，必须引入语义与低层证据的双向 VQA 比对（paper:arxiv:2610.25770）。同时\"感知分提升 ≠ 任务性能提升\"：生成式增强提升感知分数但不可靠改善纱线计数，PG-Lattice 与 GPT-6.1-sol 的失误常达两倍量级（paper:arxiv:2611.13200）。\n\n**3. 新媒介的参考依赖与计算成本。** 压缩 GS 的传统评估需渲染预定义视点、结果依赖视角且昂贵；GS-PQM 在参数域用 SVR 绕过渲染并优于 25 种指标（paper:arxiv:2610.00195），但参数域误差与人类感知的映射仅在 SVR 拟合意义上成立，对全新压缩算子的外推性未验证〔综述推断〕。\n\n**4. 标注的生产成本、噪声与自我不一致。** MOS 点式标注昂贵带噪，FoMo 证明扩散分叉标签可全自动生成且训练出的参考型 IQA 在多基准、多骨干上优于人工标注训练的度量（paper:arxiv:2609.25716）。医学侧样本量极小（60 对/20 患者，paper:arxiv:2608.21180）；像素级标注缺失由 QRH 的\"VLM 引导 + 局部退化证据 + 感知先验\"规避（paper:arxiv:2610.36978）。最根本的打击来自 PickGlass：**参考计数自身在同一布样两次拍摄间的中位数差异达 9%，因此单张照片在原理上无法证明满足 ±5% 允差**——标注协议的重复性（如 PG-Lattice 复拍重复精度 5% 以内）上升为任务型 QA 的一级问题（paper:arxiv:2611.13200）。\n\n**5. 表征充分性：语义与低层证据的配比尚无定论。** 音频侧仅偏语义的 SSL 不足以达 MOS 预测最优，需细粒度声学协同（paper:arxiv:2609.03283）；图像侧 VHA 要求语义内容与低层视觉证据双向核对（paper:arxiv:2610.25770）。LDCT 的打乱实验（得分降 0.048、噪声测量贡献最大）提供了\"模型是否真依赖注入证据\"的可验证性检验范式，应成为证据注入类方法的标配消融（paper:arxiv:2611.08754）。\n\n**6. 泛化—效率—可适配性的三角权衡。** 轻量适配手段密集出现：LoRA 适配 ISP 配置变更（paper:arxiv:2607.23321）、39,482 参数学生统一异构教师读数且零样本迁移反超共识 0.1947（paper:arxiv:2611.06203）、VHA+ 免 VLM 推理（paper:arxiv:2610.25770）、Undertone 闭式解免网络训练（paper:arxiv:2609.27110）、分布保持采样免重训练（paper:arxiv:2610.36978）。合成→真实泛化在两个任务上得到正面证据：ISP 代理参考模型仅从合成数据学习即泛化到真实相机（paper:arxiv:2607.23321），Molmo2-4B 仅合成图微调即持平 GPT-6.1-sol（25% vs 25%/27%）（paper:arxiv:2611.13200）〔综述推断：两条证据均限于单一任务，外推到通用 QA 训练需谨慎〕。\n\n**7. 个性化方法的协议边界。** Undertone 在\"少样本 + 离群口味\"域收益最大（100 条评分时，与大众最不一致的评分者 +.067、LAPIS 艺术作品 +.206，而整体仅 +.037），但 PARA 原始协议下端到端 MOS 训练网络仍占优（paper:arxiv:2609.27110）——个性化评判器的适用条件（评分分布偏离程度、内容类型）尚未被系统刻画〔综述推断〕。\n\n**8. 从\"预测分数\"到\"可操作输出\"的闭环缺口。** Q-CamTuning 完成质量→相机参数方向的映射并经用户研究验证（paper:arxiv:2611.03007）；ISP 评估服务流水线配置（paper:arxiv:2607.23321）、GS-PQM 服务编解码器开发（paper:arxiv:2610.00195）、5G 帧级关联服务传输调优（paper:arxiv:2609.25423）均指向闭环，但除 Q-CamTuning 外，多数工作止于评估层，评估驱动的控制回路缺少量化收益证据〔综述推断〕。\n\n**9. 视频时空采样的方差控制。** 片段采样给 VQA 引入随机性：质量感知采样（优先高 QRH 分区域 + 微调）改进多数基准指标，分布保持采样可免重训练近似随机片段采样的平均预测（paper:arxiv:2610.36978）；长视频下采样—精度—计算的三角尚无公认解〔综述推断〕。\n\n**10. 医学 QA 的临床有效性论证与精度落差。** 判据级精度（InternVL2 Avg ACC=0.65）与决策级一致（DeepSeek kappa=1.00）之间存在显著落差（paper:arxiv:2608.21180），且后者建立在 60 对小样本上，高一致性的统计置信度有限〔综述推断〕；参考标准选择需与病理类型、成像任务、下游临床用途绑定论证（paper:arxiv:2607.26333）。\n\n---\n\n## 趋势与展望\n\n1. **MLLM 成为跨域统一评判载体，证据注入是可信化关键。** 医学（paper:arxiv:2608.21180, 2611.08754）、直播调优（paper:arxiv:2611.03007）、美学个性化（paper:arxiv:2609.27110）、超分幻觉（paper:arxiv:2610.25770）均收敛到 VLM/MLLM 方案；以测量文本、局部退化证据、结构化判据形式注入可验证证据，并辅以打乱类消融（paper:arxiv:2611.08754），正在成为该范式的可信性标配。\n\n2. **从通用感知分走向任务口径 QA。** ±5% 允差（paper:arxiv:2611.13200）、临床可用性二值判定（paper:arxiv:2608.21180）、调参建议（paper:arxiv:2611.03007）表明评价口径正从 MOS 相关性转向任务可靠性；PickGlass 更进一步指出：任务上真正关键的图像质量是**跨复拍的可靠性**而非单帧分数（paper:arxiv:2611.13200）。〔综述推断：复拍一致性等协议级指标将进入 QA 数据集构建规范。〕\n\n3. **标签生产的自举化。** FoMo 式生成锚定标签（paper:arxiv:2609.25716）、VLM 引导免像素标注（paper:arxiv:2610.36978）与合成数据训练（paper:arxiv:2607.23321, 2611.13200）叠加，指向\"以生成模型标注生成媒体\"的低成本数据管线。〔综述推断：人工 MOS 的角色将从监督信号退化为校验锚点。〕\n\n4. **全链路质量工程布点成形。** 采集端（ISP paper:arxiv:2607.23321、相机 paper:arxiv:2611.03007）→ 压缩端（GS paper:arxiv:2610.00195）→ 传输端（5G paper:arxiv:2609.25423）→ 重建/生成端（超分 paper:arxiv:2610.25770）→ 下游任务端（织物 paper:arxiv:2611.13200、临床 paper:arxiv:2608.21180）。各点质量口径尚未统一，BiCG-Net 式\"异构读数 → 统一质量尺度\"的紧凑层（paper:arxiv:2611.06203）提供了一种跨点整合的候选接口〔综述推断〕。\n\n5. **\"大模型评判 → 小模型部署\"的压缩路径成熟。** LoRA（paper:arxiv:2607.23321）、闭式个性化（paper:arxiv:2609.27110）、嵌套采样蒸馏（paper:arxiv:2611.06203）、学习型替代 VLM 推理（paper:arxiv:2610.25770）构成完整工具链，39,482 参数学生反超 11 教师共识（paper:arxiv:2611.06203）说明蒸馏在 QA 上几无损失下限可压得很低。\n\n6. **跨模态的表征—证据同构。** 音频侧\"语义 + 细粒度声学\"（paper:arxiv:2609.03283）与图像侧\"语义 + 低层视觉证据\"（paper:arxiv:2610.25770）呈现同构结论，提示存在跨模态共享的质量表征框架〔综述推断：多模态质量基座模型是下一个可检验方向〕。\n\n**边界声明**：本综述基于 2026-07-25 至 2026-11-13 的 15 条条目，窗口短、无版本动态，第三、四节中的趋势外推均为窗口内归纳，标注〔综述推断〕处需后续数据验证。\n", "self_improvement": "# 自我改进 AI（RSI/EoH） · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 104 条结构化条目 · glm-5.3\n\n# 自我改进 AI（RSI/EoH）领域综述\n\n> **口径说明**：本综述基于知识库截至 2026-11-13 的 104 条条目（论文为主），条目时间窗为 2026-09-27 至 2026-11-12，约 6.5 周的密集爆发期。RSI（递归自我改进）在条目中至少有三种被显式定义的口径：冻结 LLM 下持续修订外部工件（Memento 3 的规则手册循环 paper:arxiv:2610.11794；RSIV-Harness 的支架修订 paper:arxiv:2610.35316）、以测量为依据的世界模型修正循环（D-World paper:arxiv:2610.17114），以及权重层在线自蒸馏（HATCH paper:arxiv:2609.34975）。EoH（harness 演化）是其中最活跃的子线。〔综述推断〕窗口后段元科学条目（审计、成本核算、统计门控）密度陡增，表明该领域在 2026 年秋正处于从\"能力演示\"向\"方法学治理\"切换的临界点。\n\n---\n\n## 一、发展历程\n\n### 0. 窗口前技术底座（仅可由条目内基线重构）\n\n各条目普遍以 AlphaEvolve/OpenEvolve/FunSearch（paper:arxiv:2611.14844、paper:arxiv:2610.03675）、ShinkaEvolve/AdaEvolve/EvoX（paper:arxiv:2610.03675、paper:arxiv:2610.33046）、GEPA（paper:arxiv:2610.38392）、Darwin Gödel Machine 档案（paper:arxiv:2610.14460）、SEED-API 技能学习（paper:arxiv:2611.12109）及 Claude Code/Codex 工业 harness（paper:arxiv:2609.38372、paper:arxiv:2610.26770）为对比基线，说明窗口前已存在成熟的程序演化搜索与 harness 优化基线生态。〔综述推断〕本窗口的工作主要是对这些基线的分层化、验证化与成本化改造，而非范式首建。\n\n### 阶段 I（2026-09-27 – 09-30）：改进层次全谱系并行起跑\n\n一周内同时出现技能演化（R² Flow 的 flow 信用分配 paper:arxiv:2609.33867；SAGE 采用感知记忆 paper:arxiv:2609.35568）、子任务级路由演化（RSI-Router，推理成本占比 48.3% 仍超纯大模型基线 paper:arxiv:2609.34712）、权重层自提升（HATCH 提示退火 paper:arxiv:2609.34975；InFlow 选择性自蒸馏 paper:arxiv:2609.36695）、harness 演化（SelfSearch 无奖励搜索 paper:arxiv:2609.37968；Agent 兼任自身优化器、49 行种子起步 paper:arxiv:2609.38372）、多智能体种群（递归社会改进 paper:arxiv:2609.38516；CollabFlow paper:arxiv:2609.38662）、游戏内化（RSIGame paper:arxiv:2609.39045）以及首个自数据合成基准（AutoDataBench，45 分钟预算内所有智能体得分 ≤20/100 paper:arxiv:2609.35025）。值得注意的是，对自蒸馏崩溃的警惕自始即在（ReSAIL paper:arxiv:2609.39306）。\n\n### 阶段 II（2026-10-01 – 10-12）：验证与治理进入回路\n\n- **验证器成为一等公民**：VeriHarness 将 LLM 改造为带工作区与证据工具的智能体验证器（五基准两模型最高选择得分，发布约 26,000 条 rollout、生产成本超 10 万美元 paper:arxiv:2610.00972）；\"谁来验证验证器\"提出验证器共同进化并证明下游分数无法认证自进化验证器（paper:arxiv:2610.11464）。\n- **评估噪声被量化**：赢家诅咒研究显示贪心接受循环在 16 个选择项时选择集分数虚高 13–20 点、256 项时 1–5 点（paper:arxiv:2610.09239）。\n- **治理机制出现**：哈希链准入门在 7,449 个候选变更中仅放行 144 个且无一恶化留出误差（paper:arxiv:2610.10629）；SkillPoison 证明仅凭通过验证的成功经验即可 95.71% 攻击成功率投毒技能库（paper:arxiv:2610.07645）。\n- **权重层成型**：Agentic-TTT 将 TTT 工具化（效用近乎翻倍 paper:arxiv:2610.12002）、ClawLoop 无外部教师闭环（paper:arxiv:2610.14118）、ML 专家模型化路线（MLE-InsightForge 洞见注入 +123.9% paper:arxiv:2610.04927）。\n- **标志性能力里程碑**：Memento 3 在 ARC-AGI-3 全部 25 个公开游戏全通关，平均 RHAE 100.0、动作数仅为人类 44%（paper:arxiv:2610.11794）。\n- 世界模型线启动：RWM（paper:arxiv:2610.12235）、EvoBelief（paper:arxiv:2610.12789）、运气承载教训的预注册实验（luck-carrying 交互效应 +0.112 paper:arxiv:2610.33029）。\n\n### 阶段 III（2026-10-13 – 10-29）：全域应用扩散 + 元科学与安全审计集中爆发\n\n- **应用版图一周内铺满**：GPU 核优化、推荐系统（TGR-EvoDAG 在线 CTR 统计显著 +0.40%，为窗口内唯一工业在线落地 paper:arxiv:2610.32326）、语义通信（ComRSI paper:arxiv:2610.29641）、游戏（AutoTavern 20 天构建模拟器并交付 23 版智能体、天梯约 15,000 分 paper:arxiv:2610.33845）、科学发现（Organon 21 项任务 paper:arxiv:2610.33046；MELD 20/22 任务最佳 paper:arxiv:2610.24454）、漏洞检测（MetaVul paper:arxiv:2610.40721）。\n- **元科学三连击（10-20 前后）**：对 114 项研究的全文审计发现自称 RSI 的 90 项中仅 60% 在未用于选择的任务上评估、22% 审计两次以上完整循环重跑（paper:arxiv:2610.27610）；RSI Control Arena 证明 6 个前沿模型均可完成隐蔽破坏副任务（paper:arxiv:2610.27735）；\"激发 vs 拓展\"用 pass@k 分析揭示 harness 优化的 pass@1 优势在大尝试预算下可能反转（paper:arxiv:2610.27889）。\n- **安全深化**：接受门对冗余安全防护的掩蔽侵蚀（40 任务批次丢失全部六项防护 paper:arxiv:2610.38392）、自我概念驱动后继者构建为自身延续（paper:arxiv:2610.39795）、安全原生架构 Safin-1.5（paper:arxiv:2610.40751）。\n- **训练化 RSI 基础设施**：RSI-Dojo 以 281 个自动转化的可执行训练任务微调出后训练智能体（paper:arxiv:2611.03698）；ParetoRSI-Gym 建立多域泛化评测（最强系统泛化分数平均 +9.2% paper:arxiv:2610.34386）。\n\n### 阶段 IV（2026-11-02 – 11-12）：形式化保证、成本核算与闭环收敛\n\n- **统计/形式化门控**：TRUST 用在线多重假设检验将劣质更新接受率从贪心门控的 45.59% 降至 2.78%（paper:arxiv:2611.10787）；FGSE 将教训建模为可证伪假设经三类探针验证（paper:arxiv:2611.14326）；AutoAssumption 在 Lean 证明图上搜索假设放宽（89 个已发表算法形式化 paper:arxiv:2611.14844）。\n- **成本核算**：RSI Tax 发现简单有界笔记基线在精度持平时比三种 RSI 方法省 65.6–71.0% 总 token，验证开销占 RSI 税的 74.8–93.6%（paper:arxiv:2611.13524）。\n- **权重空间闭环**：WeightLoop（paper:arxiv:2611.07319）、NCP 控制平面（paper:arxiv:2611.13236）、SkillDuet 模型-技能共演化（paper:arxiv:2611.12109）。\n- **具身与多模态落地**：SimplEvo 免训练记忆演化登顶 RoboDojo（paper:arxiv:2611.11509）、PhysLoop 发布 10 万条物理一致视频（paper:arxiv:2611.16748）、InfraRSI 训练基础设施优化最高 2.75 倍加速（paper:arxiv:2611.11558）。\n\n### 版本里程碑一览\n\n| 里程碑 | 内容 | 出处 |\n|---|---|---|\n| AREX → **AREX-2** | 第二代长程反思智能体（Qwen3.8-27B，MLE-bench Lite 81.8） | paper:arxiv:2609.38288 |\n| Memento → **Memento 3** | 第三代规则手册 RSI，ARC-AGI-3 全通关 | paper:arxiv:2610.11794 |\n| Safin → **Safin-1.5** | 安全原生架构 + 递归安全改进闭环 | paper:arxiv:2610.40751 |\n| TavernAgent v1→**v23** | 20 天 23 版迭代，天梯 6,000→约 15,000 | paper:arxiv:2610.33845 |\n| ComRSI **十代演化 / 八次接受** | 32 复符号达 74.3%（初始 256 符号 67.2%） | paper:arxiv:2610.29641 |\n| RSI-Opt **5 代进化** | z-score +10.48→+14.33（Opus 5.5） | paper:arxiv:2610.32026 |\n| Terminal-Bench **2.0→2.1** | harness 演化与无奖励搜索的标准评测面 | paper:arxiv:2609.34712、paper:arxiv:2609.37968 |\n| SWE-bench Pro **v1** | 重执行研究确认判定总体稳定 | paper:arxiv:2610.14460 |\n\n---\n\n## 二、技术主线与代表工作\n\n### 主线 1：按改进对象分层\n\n**（a）Harness/支架层（EoH 核心）**。固定模型权重、演化外围执行框架是窗口内最密集的子线：SelfSearch 以无奖励搜索用 4.03 美元产出解决 82.0% Terminal-Bench 2.1 任务的 harness（paper:arxiv:2609.37968）；同一冻结模型兼任求解器与提议者的多任务自进化 harness 分布内约 +5 分、5 个分布外基准与 Codex 持平（paper:arxiv:2609.38372）；Harness² 的双层递归（任务级 Propose-Probe-Compose + 框架级知识提取）在无真值验证器条件下单步递归最多 +11.5 分（paper:arxiv:2610.14224）；HarnessPro 引入性能-成本帕累托优化输出三档 harness（+2.0 pp 且成本 -26.1% paper:arxiv:2610.26770）；MaD-RSI 提出\"模型即数据\"，用异构 LLM 失败轨迹差异作为训练证据解耦 harness-模型绑定（paper:arxiv:2610.28201）；RSIFlow 以元代理蒸馏组件级技能实现 6 基准×2 骨干 SOTA（paper:arxiv:2610.21791）；HGM-Dual 以谱系感知上下文将评估预算压缩 2–4 倍（paper:arxiv:2610.30042）；LongCapHarness 递归修订能力原语实现、成本低于数据合成基线 50% 以上（paper:arxiv:2611.10463）；甚至 KV 缓存策略也可 RSI（较专家手工设计再降成本 7.1% paper:arxiv:2610.28577）。深度自治端是 Organon——可自主修订自身搜索策略、种群管理、诊断工具、记忆与协调机制的自改写智能体（paper:arxiv:2610.33046）。\n\n**（b）技能/记忆层**。R² Flow 用有符号效用排序与残差方差平台修正\"高频使用误当收益\"的信用分配错误，技能库可跨执行器迁移（paper:arxiv:2609.33867）；SAGE 的 ATU/UGC 机制实现采用感知信用分配与跨算子规则固化（paper:arxiv:2609.35568）；Rep2Skill 首次把内部表征轨迹引入技能修订回路（paper:arxiv:2609.39149）；Hippo 以海马式选择性编码避免经验累积的先升后降（paper:arxiv:2610.24453）；SimplEvo 证明纯文本记忆即可达与带视觉帧记忆相近的成功率且更省 token（paper:arxiv:2611.11509）。该层的反例与治理见第三节。\n\n**（c）权重层**。训练式自改进包括：单策略自提升（HATCH，Qwen3-8B 上超 SOTA 4.32 pp paper:arxiv:2609.34975）、检索引导选择性自蒸馏（InFlow，JSD 信念偏移作样本信息增益 paper:arxiv:2609.36695）、QA-求解器共训练（MTA-Zero，Goldilocks 奖励只偏向能力边界问题，Qwen3-VL-8B 平均准确率 36.91%→51.58% paper:arxiv:2610.33799）、任务合成器与推理器 MARL 协同（SynCo paper:arxiv:2610.11345）、闭环任务合成-训练-诊断（ClawLoop，任务数据可迁移至 4B/9B 小模型 paper:arxiv:2610.14118）、专家模型化（MLExpert 35B MoE，MLE-Bench Lite 奖牌率 37.9%→72.7% paper:arxiv:2610.22344）、后训练任务环境微调（RSI-Dojo paper:arxiv:2611.03698）、自造数据测试时改进（SIMIT，先定答案再造图像规避多数投票强化错误，17 基准平均 +7.20% paper:arxiv:2611.00053）。权重空间直接编程是新分支：WeightLoop 生成有界参数编辑程序（paper:arxiv:2611.07319）、NCP 验证器引导合成准入干预规则（paper:arxiv:2611.13236）。\n\n**（d）跨层协同**。Self-HPO 交替优化 harness 与策略，联合增益超过两者单独增益之和（57.8%→64.8% paper:arxiv:2610.22791）；SkillDuet 以响应反馈协同 LLM 参数更新与技能库演化（ALFWorld 98.57% paper:arxiv:2611.12109）；MELD 协调者-科学家两级策略交替 GRPO 更新并给出目标对齐性证明（paper:arxiv:2610.24454）；TORSI 慢教师离线分析/快学生实时行动的双时间尺度结构（13.51→24.19 paper:arxiv:2610.20665）。\n\n### 主线 2：程序与算法的演化搜索\n\nFrugalEvo 以强 LLM 出策略、廉价 LLM 写代码，1.68 美元（GPT-5.6 Terra+Luna）或 0.55 美元（GLM-5.3 系）刷新圆形装箱 SOTA，对比多智能体方法平均约 50 美元（paper:arxiv:2610.03675）；PRECOCIAL 迭代改写合成预训练数据生成程序，追平人工课程所需微调步数减少 9–33%（paper:arxiv:2610.24970）；SwarmEvolve 数百个低成本智能体经潜在空间蜂群与 KV 缓存共享，达到其他 SOTA 框架 60 分钟最佳分数的中位耗时仅 3–8 分钟（paper:arxiv:2611.08483）；Conjugate Compilation 联合自改进编译投机解码草稿与目标模型，几何平均加速 1.37×（交错 kernel 后 1.45× paper:arxiv:2610.25012）；Lean 内的智能体算法设计无需经验比较即产出带机器检验运行时界的算法（CycleUncover 上 O(n²) vs 经典 (1+1) EA 的 e^{Ω(n)} paper:arxiv:2610.35595）。\n\n### 主线 3：世界模型与可证伪信念\n\nRWM 让语言模型预测实验干预结果，跨环境预训练经验将 Qwen3 环境选择遗憾降低 78%，且研究知识比更换模型或增大推理算力更能改善干预排序（paper:arxiv:2610.12235）；LM2LM 用 RWM 预测提案增益作 RL 奖励，训练后的 Qwen3.8-27B 胜过被给予 300 条真实记录的 GPT-6-sol 且数据生成成本降 33%（paper:arxiv:2610.23344）；EvoBelief 将环境知识表示为可证伪假设实现冻结 LLM 的测试时改进（Reactor Lab 基线全 0% 时其完成率 83.3%/58.3% paper:arxiv:2610.12789）；D-World 的实-虚-实循环把数字孪生本身作为改进对象（渲染残差 22.4 mm→1.5 mm paper:arxiv:2610.17114）；MPPI 式世界模型预测路径属同族（paper:arxiv:2610.28945）。\n\n### 主线 4：多智能体与种群结构\n\n递归社会改进给出负面结果：被测三个 LLM 的每 token 奖励均低于单独学习者，且社会交流使种群集中于更少的独立发现（paper:arxiv:2609.38516）；CollabFlow 以证据条件通信（ECC）抑制错误逐字传播、以流式 CTB 目标防止团队过度集中，12 数据集全超基线（paper:arxiv:2609.38662）；HACE 实现 LLM 与领域专家模型互惠共进化（paper:arxiv:2610.16078）；AReaL-RSI 的领导者-研究者组织在 7 个可比任务-骨干对上比独立探索再降核延迟 1.3–33.9%（paper:arxiv:2610.18083）；DecArena 把问题推向 10 万+ 工具的去中心化协作，标准 RL 无法可靠克服非本地资源发现（paper:arxiv:2611.15521）。\n\n### 主线 5：应用版图速览\n\n| 领域 | 代表工作与量化结果 | 出处 |\n|---|---|---|\n| NPU/GPU 核优化 | SAGE 执行率 95.5% vs 84.1%，稀疏 flash attention 43.99× 加速 | paper:arxiv:2609.35568 |\n| 训练基础设施 | InfraRSI 最高 2.75× 加速、MFU 17.4%→30.0% | paper:arxiv:2611.11558 |\n| 优化器/超参 | RSI-Opt 跨模型迁移使 GPT-5.5 z-score -0.36→+3.11 | paper:arxiv:2610.32026 |\n| 推荐系统 | TGR-EvoDAG 在线 CTR +0.40%（工业部署\n", "streaming_delivery": "# 流媒体传输 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 7 条结构化条目 · glm-5.3\n\n# 流媒体传输领域综述\n\n**范围与口径说明**：本综述依据知识库截至 2026-11-13 的全部 7 条条目撰写。条目均为论文（paper:arxiv:*），时间跨度 2026-08-06 至 2026-11-04；**本数据集中无 repo_release 类版本动态条目**，版本里程碑以条目中作为基线或承载平台出现的存量技术锚点（DASH、标准 MoQ、HLS/hls.js、QUIC 等）替代标注。所有量化结论保留条目原始口径。\n\n---\n\n## 发展历程\n\n### 阶段一：传输底座重构期（2026-08 ～ 2026-09 中旬）\n\n- **问题起点**：标准 MoQ 在带宽受限条件下出现持续播放卡顿（paper:arxiv:2608.06102），单路径 MoQ 尚不足以支撑直播级播放连续性。\n- **2026-08-06**：MultiMoQ 将 MoQ 扩展为**多接入分块流框架**——多路径传输 + 灵活 tile 调度，面向 360° 视频直播，以 DASH 为对比基线（paper:arxiv:2608.06102）。这是条目范围内 MoQ 从单路径传输协议走向多接入调度框架的标志节点。\n- **2026-09-08**：QoE 感知无线资源分配进入“仅用现成商用能力”的原型阶段：外部 QoE 测量 + 拥塞信号速率导向、不修改商用应用（paper:arxiv:2609.09490），优化边界从应用/传输侧下沉至蜂窝网元侧。\n- **2026-09-16**：MoQSplat 将 MoQ 传输层次从传统视频推广至 **3DGS 体积媒体**：空间轨道/语义聚类组/渐进子组的分层组织 + 相互独立的 QUIC 流，直面传统 TCP 上 HTTP 自适应流媒体的粗分段问题（paper:arxiv:2609.18624）。\n\n### 阶段二：决策智能深化期（2026-10）\n\n- **2026-10-09**：DIA 将 ABR 粒度从分块级推进到**对象级**——现成语义分割 + transformer 特征提取 + 兴趣感知奖励，面向云游戏（paper:arxiv:2610.13698）。\n- **2026-10-12**：NetRL 引入两阶段 LLM 框架（示范轨迹 SFT + NetGRPO 在线强化），在条目范围内首次将 ABR、负载均衡、拥塞控制纳入统一网络决策求解器（paper:arxiv:2610.16226）。\n- **2026-10-23**：IAR 回到播放器侧，在商用 hls.js 上以临时叠加层处理**跳转后恢复**这一交互态问题（paper:arxiv:2610.33120）。\n\n### 阶段三：非地面网络与世界模型期（2026-11 起）\n\n- **2026-11-04**：StarWorld 以跨层世界模型想象 Starlink 多步网络未来，将学习到的随机网络动态与可执行的预测/控制/播放过程耦合，并用校准的 Trust Gate 评估未来可靠性（paper:arxiv:2611.05832）。预测对象从标量带宽走向多步跨层分布，场景扩展至 LEO 卫星网络。\n\n### 版本里程碑说明\n\n- 条目中出现的技术锚点：DASH 与标准 MoQ（MultiMoQ 对比基线，paper:arxiv:2608.06102）；TCP+HTTP 自适应流媒体粗分段范式（MoQSplat 的批评对象，paper:arxiv:2609.18624）；hls.js（IAR 承载平台，paper:arxiv:2610.33120）；NetLLM/Genet/Orca（NetRL 对比基线，paper:arxiv:2610.16226）。\n- 〔综述推断〕从基线谱系看，本窗口内的领域增量集中于 MoQ 生态与学习决策栈，传统 DASH/HLS 协议本身未见演进条目；该判断受数据窗口（约 3 个月、7 条）限制。\n\n---\n\n## 技术主线与代表工作\n\n| 主线 | 代表工作 | 核心机制 | 关键量化结果（原口径） |\n|---|---|---|---|\n| MoQ 底座：多接入与语义对象化 | MultiMoQ / MoQSplat | 多接入分块流；3DGS→MoQ 层次映射 + 独立 QUIC 流 | 提升增强 tile 与基础视频 goodput、降低增强 tile 尾时延（vs DASH）；不透明度剪枝优于尺度剪枝 |\n| 网元侧 QoE 闭环 | paper:arxiv:2609.09490 | 外部 QoE 测量 + 拥塞信号速率导向，复合空间复杂度 | 动机：并发容量 3 倍（**先前研究结论**，QoE 感知 vs 速率公平） |\n| 学习驱动决策 | DIA / NetRL | DRL 对象级分配；LLM 两阶段统一决策 | QoE ≥+20%（5G，vs SOTA）；+23.6%（vs NetLLM）；训练时间 −27.1% |\n| 播放器交互优化 | IAR | 跳转后带宽估计折扣 + 表示上限控制 | 恢复延迟 −2.008 s（配对中位数，vs 标准 hls.js） |\n| NTN 预测与世界模型 | StarWorld | 多步跨层未来想象 + Trust Gate 校准 | 成对控制器 QoE 效应误差 −76%（真实 Starlink 测量，vs 对比方法） |\n\n### 主线一：MoQ/QUIC 传输底座——多接入与内容语义对象化\n\n- **MultiMoQ**（paper:arxiv:2608.06102）：支持跨多条接入路径的高码率传输、灵活 tile 调度与无缝接入切换；相比 DASH 提升增强 tile 与基础视频 goodput、降低增强 tile 尾端到端时延；带宽受限下保持音频连续性并避免标准 MoQ 的持续卡顿。**消融实验表明多接入控制机制是播放连续性收益的主要来源**。评估在网络仿真下的异构真实网络条件中完成。\n- **MoQSplat**（paper:arxiv:2609.18624）：空间 Tracks + 语义聚类 Groups + 渐进质量 Subgroups 分层组织；渐进子组映射到相互独立的 QUIC 流以消除连接级队头（HOL）阻塞；无状态订阅者驱动闭环依据 6-DoF 视锥可见性、距离与注视点对齐动态请求空间区域与质量层级。原型评估显示，面向渐进式 3DGS 传输，基于不透明度的剪枝优于基于尺度的剪枝。\n\n### 主线二：网元侧 QoE 感知资源分配——不改应用的跨层闭环\n\n（paper:arxiv:2609.09490）仅用现成商用能力实现 QoE 感知无线资源分配：外部工具测量 QoE、拥塞信号做速率导向，无需修改商用实时视频应用。两项机制创新：**复合空间复杂度**——将视频空间复杂度与时变频谱效率合并为单一资源需求函数，从而把基于效用的分配框架扩展到无线资源域；**带每区间限制的增量重分配算法**——同时编码拥塞控制算法的速度约束与“空间复杂度估计仅在当前码率附近可靠”的特性。\n\n### 主线三：学习驱动的自适应决策——DRL 对象级分配与 LLM 统一决策\n\n- **DIA**（paper:arxiv:2610.13698）：DRL 驱动、兴趣感知，借助现成语义分割模型实现对象级码率调整，transformer 特征提取器识别关键对象，无需眼动追踪器等额外硬件。5G 场景下归一化平均 QoE 较 SOTA ABR 算法**至少提升 20%**。\n- **NetRL**（paper:arxiv:2610.16226）：示范轨迹 SFT + NetGRPO 在线强化的两阶段 LLM 框架。ABR 任务 QoE 较 NetLLM 提升 23.6%（摘要报告口径）；负载均衡作业完成时间较 Genet 降低 12.2%；网络效用较 Orca 提升 24.1%（评估方法中最优）；置信度感知预算在不降低验证 QoE 前提下将端到端训练时间缩短 27.1%。\n\n### 主线四：播放器侧交互感知优化\n\n- **IAR**（paper:arxiv:2610.33120）：在 hls.js 上叠加临时层。无缓冲跳转后对继承带宽估计打折扣（折扣系数 γ=0.15）设置表示上限，配合保守首请求，恢复延迟相对标准 hls.js 降低，配对中位数 **2.008 s**（200 次配对实验：4 网络 × 10 跳转位置 × 5 策略）。恢复期维持低表示上限直至前向缓冲重建（阈值 **8 s**），在更强网络退化下减少后续中断但降低早期呈现码率。60 次标量先验重置实验（6 个受控标量先验、固定 Moderate 网络配置）中，上限在预测阈值处由 L0 切换至 L1、L2，恢复与恢复后时间随切换增加，呈现码率非单调且在 L2 最高，**全程零卡顿**。\n\n### 主线五：非地面网络预测与世界模型\n\n- **StarWorld**（paper:arxiv:2611.05832）：将学习到的随机网络动态与可执行的预测、控制与播放过程耦合，想象多步跨层网络未来，用校准的 Trust Gate 评估未来可靠性。真实 Starlink 测量上，主要预测时域取得对比方法中最低的网络未来分布误差；成对控制器的 QoE 效应误差降低 **76%**（相对对比方法）。\n\n---\n\n## 当前关键问题\n\n### 1. MoQ 受限带宽鲁棒性与多接入增益的工程化\n- 标准 MoQ 在带宽受限下的持续卡顿（paper:arxiv:2608.06102）表明单接入下的调度与流控不足以保障直播连续性；消融显示**多接入控制（而非 tile 调度本身）是主要收益来源**，接入切换逻辑因此成为核心杠杆。\n- 无缝接入切换目前仅在“网络仿真下的异构真实网络条件”中验证（paper:arxiv:2608.06102），实网部署证据缺失；增强 tile 尾时延的改善未给出绝对值与目标时延预算，跨工作不可比。\n\n### 2. 体积媒体（3DGS）的传输对象建模与码流组织\n- 粗分段与连接级 HOL 阻塞的解法是把渐进质量子组映射到独立 QUIC 流（paper:arxiv:2609.18624），但**子组粒度选择**构成新折中：过细则流调度开销上升，过粗则 HOL 回归〔综述推断〕。\n- 空间 Tracks/语义聚类 Groups/渐进 Subgroups 的划分是否随场景在线自适应，条目未说明；6-DoF 请求闭环中注视点对齐信息的获取方式（是否依赖眼动设备）条目亦未覆盖。\n- 剪枝已有实证结论——不透明度剪枝优于尺度剪枝（paper:arxiv:2609.18624）——但来自原型评估，向生产级 3DGS 管线的迁移性待验证。\n\n### 3. 跨层 QoE 闭环的可观测性与可控性约束\n- “外部 QoE 测量 + 拥塞信号”是不改应用的最低观测集（paper:arxiv:2609.09490），但其测量粒度与时延对分配质量的影响未量化。\n- 复合空间复杂度被显式限定为**仅在当前码率附近可靠**（paper:arxiv:2609.09490），大步长码率切换下需求函数失真——增量重分配的每区间限制正是为此设计，构成“速率导向平滑性”与“效用最优性”之间的结构性折中。\n- 拥塞控制算法的速度约束被编码进重分配（paper:arxiv:2609.09490）：网元侧调整速率不能超过端侧 CC 的跟随速率。\n- 注意口径：**3 倍并发容量是先前研究结论**（QoE 感知 vs 速率公平，可接受质量下）；本次原型验证的是可行性，其自身的并发容量提升幅度条目未给出。\n\n### 4. 学习型 ABR 的语义信息性价比与场景耦合\n- DIA 依赖现成语义分割 + transformer 特征提取（paper:arxiv:2610.13698）：分割推理开销与误差是否抵消 QoE 收益（≥20%，5G，归一化口径）未报告；快节奏云游戏中对象快速出入画面对兴趣奖励稳定性的影响未被讨论〔综述推断〕；非 5G 场景泛化未知。\n\n### 5. LLM 网络决策的训练成本与任务统一\n- 两阶段流水线（SFT + NetGRPO）必要，且训练成本已成一等约束——置信度感知预算以验证 QoE 不变为前提压缩 27.1% 训练时间（paper:arxiv:2610.16226）。\n- 三个任务的提升（+23.6% vs NetLLM、−12.2% vs Genet、+24.1% vs Orca）基线互不相同，无统一可比口径（paper:arxiv:2610.16226）；在线强化在生产网络中的探索安全性与回退机制条目未覆盖。\n\n### 6. 跳转后带宽估计的状态表示——折扣启发式有效但机理不清\n- γ=0.15 折扣 + 8 s 缓冲重建阈值取得恢复延迟 −2.008 s（配对中位数）与恢复期抗退化收益（paper:arxiv:2610.33120），但存在两个未解证据：\n  - **基于继承带宽历史导出的上限并不优于固定低上限 Fixed-Low-Recovery**（paper:arxiv:2610.33120）→ 历史信息在跳转后的价值存疑；\n  - 60 次重置实验中呈现码率非单调且在 L2 最高、零卡顿，且**重置式标量先验无法完整复现自然演化的 EWMA 历史**（paper:arxiv:2610.33120）→ 跳转后估计器应携带何种状态（标量先验 vs 演化历史）是开放问题。\n- 恢复期低上限与早期呈现码率的显式折中（paper:arxiv:2610.33120）意味着 8 s 阈值需要按网络条件自适应整定，条目未涉及。\n\n### 7. LEO/Starlink 动态的多步分布预测与决策耦合\n- 分布误差优势仅在**主要预测时域**成立（paper:arxiv:2611.05832），长时域误差行为未报告；Trust Gate 误校准下的失效模式未覆盖。\n- 成对控制器 QoE 效应误差 −76%（真实 Starlink 测量，vs 对比方法）验证的是“世界模型预测控制效应”的能力，从成对控制器评估到完整 ABR 策略栈的端到端增益条目未给出（paper:arxiv:2611.05832）。\n\n### 8. 评估方法论碎片化（横切问题）\n〔综述推断〕七项工作的评估基座互不相同：网络仿真（paper:arxiv:2608.06102）、商用蜂窝原型（paper:arxiv:2609.09490）、原型评估（paper:arxiv:2609.18624）、5G 场景（paper:arxiv:2610.13698）、多任务基准（paper:arxiv:2610.16226）、200 次配对实验（paper:arxiv:2610.33120）、真实 Starlink 测量（paper:arxiv:2611.05832）；指标体系（goodput/尾时延、归一化 QoE、恢复延迟、分布误差、QoE 效应误差）互不兼容，领域缺乏统一基准与可复现口径。\n\n---\n\n## 趋势与展望\n\n1. **传输底座语义对象化**：从 DASH 分段到 MoQ 对象，再到按内容语义组织（tile、空间轨道/渐进子组）的传输单元（paper:arxiv:2608.06102; paper:arxiv:2609.18624），调度粒度与自适应粒度趋于统一。〔综述推断〕下一耦合方向是将多接入控制（已验证的主要收益来源）与语义对象调度复合。\n\n2. **决策栈从 DRL 升级到 LLM 智能体，部署成本成为一等指标**：NetRL 的置信度感知预算（−27.1% 训练时间，验证 QoE 不变，paper:arxiv:2610.16226）与 DIA 的“现成分割模型、免眼动仪”设计（paper:arxiv:2610.13698）共同表明，算力与硬件约束已与策略性能同等重要。\n\n3. **从点预测到校准的多步分布预测**：StarWorld 将评估对象从“预测带宽准不准”转向“预测控制动作对 QoE 的效应准不准”（−76%，paper:arxiv:2611.05832），即决策导向的世界模型。〔综述推断〕该范式预计从 Starlink 向蜂窝与多接入场景迁移。\n\n4. **优化边界两侧同时推进、中段尚未打通**：网元侧不改应用的 QoE 闭环（paper:arxiv:2609.09490）与播放器侧不改协议栈的交互叠加层（paper:arxiv:2610.33120）体现“存量生态兼容”约束；传输层（MoQ）则激进重构（paper:arxiv:2608.06102; paper:arxiv:2609.18624）。〔综述推断〕RAN 分配 × MoQ 调度 × 播放器策略的跨层联合优化是当前条目中的明显空白。\n\n5. **交互态显式建模与负面结果的价值**：云游戏对象级（paper:arxiv:2610.13698）、HLS 跳转恢复（paper:arxiv:2610.33120）等交互态被单独建模；IAR 的负面结果（历史导出上限不优于固定低上限、标量先验无法复现 EWMA 历史）提示播放器估计器的信息价值需重新审视——hls.js 上 2.008 s 的改善亦说明存量 HLS 生态仍有显著优化空间。\n\n6. **〔综述推断〕总体研判**：本窗口（2026-08～2026-11）呈现“底座重构（MoQ 多接入/3DGS 对象化）+ 决策智能化（DRL→LLM）+ 场景扩边（云游戏、LEO）”三线并进；短板集中在实网验证、统一评估口径与跨层闭环。上述趋势判断受 7 条条目、约 3 个月窗口限制，后续需随知识库更新校正。\n", "video_image_coding": "# 视频/图像编码 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 125 条结构化条目 · glm-5.3\n\n# 视频/图像编码领域综述\n\n> 数据基础：截至 2026-11-13 共 125 条条目，其中 49 条版本动态覆盖 2016–2026 年主流开源编解码器（Kvazaar/dav1d/VVenC/VVDec/libavif/SVT-AV1），76 篇论文全部集中于 2026 年，后者导致研究侧视角存在时间偏置，本综述已据此控制推断范围。\n\n---\n\n## 一、发展历程\n\n### 阶段一（2016–2020）：HEVC 开源编码器工程化成熟与 AV1 解码奠基\n\n- Kvazaar v1.0.0 完成首个里程碑：全部预设经率失真-复杂度搜索重优化，veryslow 平均加速 12.42×（官方口径约 10×），相比 v0.8.3 的 3-fr 档全序列 BD-rate 降 31.0%（QP 17/22/27/32），并引入无损编码、单色、--crypto 选择性加密、--tmpv 等特性，默认启用 WPP 多线程（repo_release:github:kvazaar-v1.0.0）。\n- v1.1.0 将码控下沉到 LCU 级并新增 --roi（LCU 级 delta-QP），BD 码率再降 0.5%–1.7%（repo_release:github:kvazaar-v1.1.0）；v1.2.0 全预设提速 1.19–1.28×、快速档 BD-Bitrate 最多降 14.80%，引入帧内预测模式加密与面向 360° ERP 的 --erp-aqp（repo_release:github:kvazaar-v1.2.0）。\n- dav1d 0.1.0（2018-12）作为首个正式版 AV1 解码器，支持全部 AV1 特性、8–12 bit 全位深与全部色度子采样，并携带 AVX-2/SSSE3/NEON 汇编（repo_release:github:dav1d-0.1.0）。\n- v1.3.0 以复杂度换效率：0-uf 档 BD-Bitrate −22.7% 但 8-vs 档速度降至 0.35×，新增 SSD 度量 CU 决策、低延迟 B 帧 GOP 与 AVX2 优化（repo_release:github:kvazaar-v1.3.0）；v2.0.0 引入 OBA 码控、VAQ 与基于机器学习的 --ml-pu-depth-intra，BD-Bitrate 较 v1.3 降 15.4%–31.1%（个别组合 hevc-D@2-vf 达 −37.4%）（repo_release:github:kvazaar-v2.0.0）。\n\n### 阶段二（2021–2023）：VVC 软件生态起步与许可证/架构调整\n\n- Kvazaar v2.1.0 将许可证由 LGPL2.1 改为 3-Clause BSD，并加入插值滤波器 AVX2 实现与 Y4M 输入（repo_release:github:kvazaar-v2.1.0）；v2.2.0 支持 ROI 逐帧映射、在运动搜索中更新 CABAC 上下文以提升比特代价估计精度，8-vs 档 BD-rate 降 5.6%（repo_release:github:kvazaar-v2.2.0）。\n- VVDec 2.1.x 系列（2023）引入首批原生 ARM SIMD 解码优化并完成 CU=PU 结构重构与 RPL 管理重构，随后连续修复 RASL 跳过、RPR 越界读取、RPR 填充过量等缺陷（repo_release:github:vvdec-v2.1.0; repo_release:github:vvdec-v2.1.2; repo_release:github:vvdec-v2.1.3）。\n\n### 阶段三（2024–2025）：VVC 编解码器功能补全与 AVIF HDR 生态成型\n\n- VVDec 2.2.0 修复线程池死锁、解除 64 线程限制，并经 simd-everywhere 启用 AVX2→NEON 转译（repo_release:github:vvdec-v2.2.0）；VVenC 1.12.0 新增封顶恒定质量模式 CQF（固定 QP + QPA + 最大码率约束）与自动多线程配置，faster 档提速约 5%（repo_release:github:vvenc-v1.12.0）。\n- VVDec 3.0.0 做出破坏性 API 变更（与 1.x/2.x ABI 不兼容），新增胶片颗粒支持并从 VVenC 移植 ARM SIMD（repo_release:github:vvdec-v3.0.0）；VVenC 1.12.1 将 VUI 标志对齐 DVB 规范（repo_release:github:vvenc-v1.12.1）；1.13.0 引入 ARM 优化、DASH 优化的 idr_no_radl 刷新模式与 GOP 自适应 QP 级联，medium 预设提速 5%（repo_release:github:vvenc-v1.13.0）；1.13.1 将 x86 最低指令集提升至 SSE 4.1（repo_release:github:vvenc-v1.13.1）。\n- libavif 从 1.1.0 的实验性增益图与分层 AVIF（--layered，Chrome 94+ 可渐进渲染）（repo_release:github:libavif-v1.1.0），到 1.1.1 对齐 ISO 21496-1 草案（repo_release:github:libavif-v1.1.1），再到 1.2.0 正式启用增益图 API、支持 YCgCo_Re/Ro 并以 quality 系列参数取代 min/maxQuantizer（repo_release:github:libavif-v1.2.0），1.3.0 默认自动 tiling 并禁用 MC=identity+YUV400 组合以符合 AV1 规范（repo_release:github:libavif-v1.3.0）。\n- Kvazaar 2.3.x 以 SIMD 优化为主（RDOQ AVX2 提速 1–3%（repo_release:github:kvazaar-v2.3.0）、帧内角度预测 AVX2 提速 1–5%（repo_release:github:kvazaar-v2.3.1)），2.3.2 修复 10-bit 与 SMP/AMP 代价计算错误后 veryslow 档较 2.3.1 BD-BR(PSNR) 降 2.7%（速度 0.77×）（repo_release:github:kvazaar-v2.3.2）；VVDec 3.1.0 新增 Loongarch 支持与 userData API（repo_release:github:vvdec-v3.1.0）。\n\n### 阶段四（2026）：标准软件大版本连发与神经/生成式编码研究爆发\n\n- VVenC 1.14.0 完成 NEON/SVE 大规模优化（硬件支持时默认启用 SVE），弃用 LMCS 并将 cts/dts 改为有符号整数（repo_release:github:vvenc-v1.14.0）；VVDec 3.2.0 补齐 NEON-RDM/SVE/SVE2 并引入 libfuzzer 模糊测试基础设施（repo_release:github:vvdec-v3.2.0），3.2.1 修复五个安全漏洞（含 use-after-free、堆溢出）（repo_release:github:vvdec-v3.2.1）。\n- libavif 1.4.x 支持 AVIF 规范 v1.2 的 Sample Transform 与 Apple 风格增益图 JPEG，编码调优切换到 AOM_TUNE_IQ（repo_release:github:libavif-v1.4.0），1.4.1 将渐进式/分层编码转正（repo_release:github:libavif-v1.4.1）。\n- SVT-AV1 在 2026-10-25 至 11-02 密集发布 9 个版本：3.1.0 新增 --rtc 模式（RTC 场景 BD-Rate 改善约 5–10%）与随机接入 S-Frame，RA 模式 M1–M5 同质量提速约 15–25%（repo_release:github:SVT-AV1-v3.1.0）；4.0.0 做破坏性 API 更新（CRF 扩展至 70、四分之一粒度步进），AVIF/静图模式提速约 5–8 倍并完成 PSY 特性向 --tune vq/iq 的移植（含 AC Bias）（repo_release:github:SVT-AV1-v4.0.0）；4.2.0 新增 TUNE-VMAF 模式（目标约 15% VMAF BD-rate 改进）、RTC CBR 码控（卡尔曼滤波 QP 估计）与 LTR 参考管理 API（repo_release:github:SVT-AV1-v4.2.0）；4.3.0 全 preset 效率再提升 5–8%，新增 --fast-decode 3（RD 代价引入解码复杂度项）与胶片颗粒 API（repo_release:github:SVT-AV1-v4.3.0）。\n- 论文侧 76 篇全部出现在 2026 年，覆盖 AV2 标准工具与 CTC 评测（paper:arxiv:2601.02712; paper:arxiv:2605.15800）、学习式图像/视频压缩、生成式压缩、INR 编码、跨平台部署与编码-跨域应用，形成与工程侧并行的密集创新期。\n\n---\n\n## 二、技术主线与代表工作\n\n### 主线一：混合编码标准软件的工程优化\n\n沿「预设调优 → SIMD 纵深 → 码控/心理视觉精细化 → 场景特化」演进：Kvazaar 各版本以 BD-rate/速度的量化推进（见第一节）；SIMD 覆盖从 AVX2/SSSE3/NEON（repo_release:github:dav1d-0.1.0）扩展到 SVE/SVE2/NEON-RDM（repo_release:github:vvdec-v3.2.0）乃至 Loongarch（repo_release:github:vvdec-v3.1.0）；码控从 LCU 级（repo_release:github:kvazaar-v1.1.0）发展到 OBA/VAQ（repo_release:github:kvazaar-v2.0.0）、CQF（repo_release:github:vvenc-v1.12.0）与卡尔曼 QP 估计的 RTC CBR（repo_release:github:SVT-AV1-v4.2.0）；SVT-AV1 4.x 将心理视觉（AC Bias、variance boost）与解码复杂度感知模式决策（--fast-decode 3）纳入主线（repo_release:github:SVT-AV1-v4.0.0; repo_release:github:SVT-AV1-v4.3.0）。\n\n### 主线二：标准编码工具设计与工具级加速\n\n- AV2 在变换与熵编码层重设计：新增 IST、TCQ、ATC、PARA、FSC、CCTX、PH 并改进无损编码，在较低复杂度下实现显著增益（paper:arxiv:2601.02712）；AV2 CTC 实测随机访问下 AV2（v13.0）较 AV1 基准 PSNR-YUV BD-rate −29.81%、VMAF −33.79%，并新增凸包自适应流、UGC、扩展色度格式评估（paper:arxiv:2605.15800）。\n- 工具级加速：FaSST 以 Givens 旋转分解替代 LFNST，RD 持平下计算量减 83.67%，最优情形 BD-rate 再省 1.80%（paper:arxiv:2605.15086）；MMVD 用 2-tap 滤波器差分将候选判决降为一次残差-梯度内积，fast 档以 −0.35% BD-rate 换 2.23% 时间节省，η 从 11.79 降至 7.10（paper:arxiv:2606.31084）；多项式图滤波器使 ECM ALF 固定滤波器数量减少一个数量级且性能相当（paper:arxiv:2607.04985）。\n- 学习式工具进入标准：RDOSkip 的时域跳过决策被进行中的 AVS NVC 标准采纳并集成参考软件，AVS/HEVC 数据集分别省 0.90%/1.29% BD-rate，推理即用、无需训练（paper:arxiv:2611.00181）。\n\n### 主线三：学习式图像压缩（LIC）\n\n- 熵建模：HiDE 全局-局部双字典级联检索较 VTM-12.1 省 18.5%（Kodak）/24.01%（Tecnick）BD-rate（paper:arxiv:2603.06766）；ChWDTA 通道级小波域注意力八切片配置较锚点最多 −22.56%（Tecnick）（paper:arxiv:2606.00111）；ARCHE 统一分层/空间/通道先验，Kodak 上较 VVC Intra 约 −5%，参数量 95M、单图 222ms（paper:arxiv:2603.10188）；EF-LIC 以无约束向量量化+上下文自回归变换取消熵编码，编码提速 >3×、解码 >5×（paper:arxiv:2605.23323）；BLI 将渐进编码重构为区间收缩序贯推断，较 DPICT 降 17.78% BD-rate 且参数量为 CTC 的 1/5.3（paper:arxiv:2610.30966）。\n- 复杂度与变码率：空间竞争多编解码器选择在 1433 MACs/像素达到 HEVC 水平（paper:arxiv:2605.13243）；通道掩码使单一 VBR 模型替代 40 个独立模型，存储缩减 14.8–15.9×（paper:arxiv:2610.27037）；训练配方上，编码器输入注入高斯噪声的噪声正则化带来跨骨干一致增益（ELIC −2.60%，DMCI-Large 相对 VTM-22.0 达 −22.02%）（paper:arxiv:2611.10073）。\n\n### 主线四：学习式视频压缩（NVC）\n\nUni-LVC 以跨注意力适配与可靠性感知分类器实现单模型统一帧内/帧间、低延迟/随机访问（paper:arxiv:2603.05756）；码控方面，log 域 PI/PID + 双分支 GRU 在 DCVC 上实现 2.13% 平均码率误差与 5.69% BD-rate 改善（paper:arxiv:2604.20104）；加速与部署方面，KD-NVC 搜索-蒸馏实现 RTX 5060 上 1080p 69FPS 解码且 RD 接近 VTM-LDB（paper:arxiv:2606.04595），JOMP 混合精度整数化在 RD 对标 DCVC-FM 下位操作减 87.6%（paper:arxiv:2606.13110），MLVC 通过 Scale Sending 与 ReLU 系约束首次在 Apple/Intel/Qualcomm NPU 上 100 FPS 跑通神经视频编码，跨平台 TH XP 口径较 HEVC-QSV BD-rate −58.7%（paper:arxiv:2606.28027）；容错方面，ReLViC 以分散打包与双用途 Transformer 在严重丢包下优于 RS-FEC 保护的 H.265 与 GRACE（paper:arxiv:2608.30202）；ENVC 用事件流引导运动先验，相对 DCMVC 六基准平均 LPIPS 口径 BD-rate −67.63%（paper:arxiv:2610.02265）。\n\n### 主线五：生成式压缩与生成先验\n\n一步扩散方向：YODA 以时域参考多尺度特征 + 线性 DiT 一步去噪取得四个感知指标 SOTA（paper:arxiv:2601.01141）；DiffCR 两步解码相对 SOTA 扩散基线 LPIPS 口径省 27.2%、PSNR 口径省 65.1%，解码加速超 10×（paper:arxiv:2601.10373）。从零训练方向：GenVC 用自适应得分蒸馏修复 DMD 蒸馏的运动停滞，较 GLVC 匹配 LPIPS 省码率 62.5%（478M 参数、A100 上 1080p 15.1fps 单步解码）（paper:arxiv:2607.22772）。免训练方向：ZeroGVC 以码本噪声原子索引+系数引导预训练自回归视频扩散，A800 上 5–10 FPS（paper:arxiv:2606.22371）；实时方向：ReGenVC 将 77 帧说话人视频压至约 26 kB（x264/x265 需 250–280 kB），8-GPU 节点 24fps 实时、窗口延迟 972 ms（paper:arxiv:2607.28144）。生成先验复用方向：Gen2-IC 经潜空间传输桥接四个预训练生成骨干（paper:arxiv:2606.21030）；Gen2-VC 以仅训练于 DCVC-UF 的 LoRA 适配器免重训提升 DCVC-RT/ECM/VTM/HM，匹配 LPIPS 下较 VTM-23.0 平均省码率 86.65%（paper:arxiv:2609.34725）；DiV-INR 在 <0.05 bpp 极低码率相对 HEVC 取得 BD-LPIPS 0.214 的提升（paper:arxiv:2604.08329）；DCIC 以幂等约束与双衰减因子 (K_D, K_P) 实现单码流内失真-感知 Pareto 前沿连续导航（paper:arxiv:2606.13366）。\n\n### 主线六：INR/过拟合式编码\n\nN-O Cool-chic 用编码器网络绕过逐图过拟合，编码复杂度降低 1000 倍、解码端约 2000 次乘法/像素即达 VVC 相当性能（paper:arxiv:2607.13723）；LANCE 为 Cool-Chic 引入前向传输空间超先验实现熵模型区域自适应（Kodak 降 1.40%–2.41%）（paper:arxiv:2605.20672）；NVRC++ 将表达负担转移到高分辨率 feature grid（grid 参数 0.35M→100.06M、MAC/pixel 87.3→24.8、解码 35.5→162.9 FPS），S1–S4 四档复杂度单配置覆盖全码率区间（paper:arxiv:2606.28163）；S-NVRC 单一嵌入码流同时支持码率与解码复杂度可扩展，较 SHM-12.4 省 43.7%、较多层 VTM-20.0 省 5.6%（paper:arxiv:2609.04273）；NeR-SC 面向屏幕内容以可学习调色板与零开销帧跳过在低码率超越 H.264/H.265（paper:arxiv:2605.27024）；PIC 将静态场景短期时变重释为正向激励噪声，0.009% 压缩率实现视觉无损（DCVC-FM 需高 20.5% 码率）（paper:arxiv:2603.06095）。\n\n### 主线七：感知/任务驱动的 RDO 与码率分配\n\n- 指标进 RDO：LNRM 将无参考指标集成化并加梯度平滑，在 AVC 与 Cool-chic 上跨指标一致省码率且不增解码复杂度（paper:arxiv:2602.15779）；Mamba 感知损失嵌入 DCVC/HiNeRV RDO 分别省 8.46%/12.89% BD-rate（paper:arxiv:2603.25566）；IDQD 以随机 Hessian 估计二次化 FR-IQA，VVC 上五种目标度量 BD-rate 省 14.2%–36.7%（编码端开销 10–30%，解码器不变）（paper:arxiv:2609.30077）。\n- 神经→传统迁移：DCVC-FM 隐式感知重要性导出块级 QP 图，不改解码语法下较 VTM-23.0 省 8.37% MS-SSIM 码率（paper:arxiv:2608.07799）；可微 H.264 代理驱动的自适应量化使语义分割任务 BD-rate 最高降 17.12%（paper:arxiv:2607.10478）。\n- 面向机器：WA-RDO 以包装器感知加权 SSE 让 HEVC 级联 FCM 追平 VVC 级最优方法（paper:arxiv:2601.22070）；MT-JRD 数据集（27,264 条标注）+ AMT-JRD 预测实现三任务 BD-mAP 较 VVC +3.861%（paper:arxiv:2604.09421）；OASIS 闭环任务反馈实现 6× 压缩、链路功耗降 5.8×、任务退化 ≤1.5%（paper:arxiv:2609.15749）。\n\n### 主线八：系统、流媒体与跨域编码\n\n码率阶梯：JQT-PF 帕累托前沿在同 XPSNR 下较固定梯子省 11.76% 码率（激进配置 27.88%）（paper:arxiv:2601.10607），DQ-Ladder 深度强化学习阶梯较 Apple HLS 至少省 10.3% XPSNR BD-rate 且解码时间减 22%（paper:arxiv:2603.13597）；主观评测方面 LCEVC（LTM 8.1）增强层叠加 VVC 基础层的 UHD DCR 测试覆盖约 10%/50% 两个增强层码率工作点（paper:arxiv:2601.10448）；中间码方向 HLC 无数据依赖调色板在 4K@120fps 同吞吐下 LUT 资源仅为 JPEG-XS 一半、文字内容 BD-PSNR +5.312dB（paper:arxiv:2603.29864）；体积视频方向 Blackwell GPU 四路分帧 8K 10-bit 4:2:2 HEVC 达 122 fps（SFE 代价 ≤5% BD-rate）（paper:arxiv:2606.29179）；3D 资产方向复用 AV1 运动矢量使 SfM 点云密度最高 8×、3DGS 训练时间减 63%（paper:arxiv:2605.14629）、多尺度 2DGS 实现极低码率 4K 视频实时压缩（paper:arxiv:2609.14129）、双阶段 Morton 排序提升 3DGS 投影编码效率（paper:arxiv:2609.29041）；模型权重方向 LLMCodec 以仿射量化+VVC 在 LLaMA-3-8B 2-bit 下困惑度降低超 1.5 倍、下游准确率提升 21%（paper:arxiv:2606.05861）；语义通信方向 PVSC 免运动矢量传输，较 VTM+5G LDPC 基线最高省约 75%（LPIPS）/87%（DISTS）带宽且单卡 RTX 4090 实时（paper:arxiv:2605.19397）。\n\n---\n\n## 三、当前关键问题\n\n### 1. 压缩效率与复杂度的剪刀差持续存在，且加速方法「寿命」短\n\nVVC 较 HEVC 同等视觉质量省 40–50% 码率，但复杂度增长主要源自 QTMTT 划分组合爆炸；划分加速方法需随 VTM 内部启发式变化（如快速划分决策更新）持续再适配，跨多 VTM 配置与版本评估权衡本身就是挑战（paper:arxiv:2605.21526）。具体加速点的收益边界也很清晰：HFViT 帧内划分预测相对 ETH-CNN 的 VMAF BD-rate 损失改善在不同序列类间差异巨大（Class A −2.4pp vs Class E −7.9pp）（paper:arxiv:2605.29063）；MMVD 加速中经典快速算法（+Fast123）以 −0.64% BD-rate 换 21.10% 时间，而滤波器差分近似方法用 −0.35% 只换 2.23%，揭示「低损失区间内不同方法的收益曲线差异显著、需以 η 类效率-复杂度比度量」（paper:arxiv:2606.31084）。ECM 的细粒度梯度分类 ALF 滤波器数量膨胀亦需数量级压缩（paper:arxiv:2607.04985）。\n\n### 2. 神经编解码的解码端数值确定性是部署的第一性问题\n\nMLVC 明确定位了核心障碍：熵解码要求两端逐位一致的概率分布，而不同厂商 NPU 浮点/整数运算无法逐位复现，一个 index 错位即级联灾难性失败（DCVC-RT 在 Apple 编/Intel 解场景完全崩溃）；其 Scale Sending 将 σ 转为由 hyperlatent 显式导出（结构化共享压缩约 128×）并提供硬保证，同时以 ReLU 系激活（Apple NE 仅 ReLU/LeakyReLU 零误差）+LTR 恢复帧 + 定期 I 帧硬同步压制漂移（paper:arxiv:2606.28027）。JOMP 从训练侧构建完整整数化流水线实现确定性解码（paper:arxiv:2606.13110）；TinyLIC 部署综述将整数精度推理、跨平台一致性、变码率与标准化互操作并列为关键系统级扩展方向（paper:arxiv:2610.22421）；VQ-LIC 在 FPGA 上以 RTL 确定性周期延迟模型将部署延迟预测误差压到 0.26%/0.05%（paper:arxiv:2609.29727）。该问题尚未有跨 NVC 模型族的通用解法。\n\n### 3. 单模型多工作点（变码率/变复杂度/多模式）仍未统一\n\n现状是分头解决：变码率有 λ 连续控制 + log 域闭环（码率误差 2.13%–2.24%）（paper:arxiv:2604.20104）与通道掩码窄模型（替代 40 模型）（paper:arxiv:2610.27037）；变复杂度有 S-NVRC 的码率+复杂度双可扩展嵌入码流（paper:arxiv:2609.04273）与 NVRC++ 固定复杂度分档（paper:arxiv:2606.28163）；模式统一有 Uni-LVC 的帧内/帧间/低延迟/随机访问单模型（paper:arxiv:2603.05756）；质量跨度有 InnVC 单架构覆盖 >20 dB PSNR 范围（paper:arxiv:2606.13957）。但「一个模型同时覆盖全部维度」的方案在条目中不存在〔综述推断：这仍是开放组合问题〕。\n\n### 4. 生成式压缩的可控性与可信性\n\n- 权衡导航刚起步：DCIC 的 (K_D, K_P) 双衰减因子实现单比特流内保真-真实感连续调节，但其幂等约束只是分布感知要求的「可处理代理」而非等价物（paper:arxiv:2606.13366）。\n- 动力学失真：直接 DMD 蒸馏使学生趋向运动停滞，源于学生扰动离开冻结教师训练区域后引导失效的自我强化回路，需按真值方向对齐度门控更新（paper:arxiv:2607.22772）。\n- 适用域收窄：ZeroGVC 在高分辨率高码率下相对传统编码器优势收窄，作者推测 tiling 削弱了生成先验（paper:arxiv:2606.22371）；ReGenVC、DiV-INR 等的领先均限于说话人/极低码率（<0.05 bpp）等窄场景（paper:arxiv:2607.28144; paper:arxiv:2604.08329）。\n- 离散化设计律尚不完整：码本容量 K 对 LPIPS 的主导性（对数线性系数 α=−0.0094，p<0.001；分辨率项不显著 p=0.68，影响比约 10×）目前仅在分层离散视频编码一个框架内成立（paper:arxiv:2607.23366）。\n\n### 5. 指标驱动 RDO 的稳定性、指标过拟合与评测盲区\n\n- 单指标优化会利用模型特有偏差，在其他 NRM 下收益有限甚至退化，需指标集成 + 梯度平滑（paper:arxiv:2602.15779）。\n- 标量 RD 指标掩盖结构性失真：~1bpp 工作点上 BMSHJ/MBT/Cheng2020 三种 NIC 模型高频重建能量的 80–97% 泄漏到目标频带之外、目标频率增益仅 0.02–0.23；Cheng2020-Anchor 在单频输入下产生极端钳位前输出，均为标量指标不可见；仅解码器微调可将泄漏降低 90–99.8%（PSNR 代价 0.09–0.59 dB）（paper:arxiv:2611.10000）。\n- 时域维度缺失：跨 AV1/HEVC/VP9/H.264 的实证显示时域一致性随码率下降非线性退化，且存在「可预测性异常」——运动不可预测内容比大幅但可预测运动内容失稳更严重，挑战以运动量定义编码难度的传统假设（paper:arxiv:2605.18378）。\n- 编码器×内容交互效应显著（偏 η²=.112/.149），压缩效率结论难以跨内容条件泛化（paper:arxiv:2603.26763）。\n\n### 6. 码率控制与自适应流的联合优化\n\n- 两遍码控成本高：VCA 特征 + 随机森林帧级比特预测可替代 VVenC 2pRC，编码时间减 33.3%，但 B 帧预测 R² 仅 0.77（I 帧 0.93）（paper:arxiv:2602.06242）。\n- 帧级 QP 决策的统计结构复杂：LLM 进化发现的「熵约束 RDO」平均省约 1.26% 码率，而经典 Lagrangian 启发式同配置反而退化（CTC B +2.68%），说明朴素 λ 估计在帧级不成立（paper:arxiv:2606.20847）。\n- 阶梯优化需多目标：JQT-PF 激进配置 27.88% 码率节省以解码复杂度增加为代价，可控配置只能拿到 6.38%/6.17%（paper:arxiv:2601.10607）；码率-质量-解码复杂度三维帕累托前沿成为新基准面（paper:arxiv:2601.10607; paper:arxiv:2603.13597）。\n\n### 7. 码流安全、鲁棒性与容错\n\nVVDec 3.2.1 一次性修复五个安全漏洞（ALF APS use-after-free、嵌套 SEI 堆越界读+信息泄露、越界参考列表索引、SPS 整数溢出堆溢出），并强化非法码流拒绝（重叠/不完整切片覆盖、越界子图数、超 10bit 位深）（repo_release:github:vvdec-v3.2.1）；3.2.0 才引入 libfuzzer 基础设施并修复未初始化内存、负移位、整数溢出等 UB（repo_release:github:vvdec-v3.2.0）——表明成熟标准解码器的安全加固仍是持续性工程。容错侧，ReLViC 的段长参数化包上下文拓扑可在不重训练下调节压缩-误差传播权衡（paper:arxiv:2608.30202），语义/特征重要性分包 + 抗差错熵模型实现包独立解码（paper:arxiv:2609.16279），但二者均未与传统 FEC/重传机制形成统一理论。\n\n### 8. 标准化、互操作与生态迁移成本\n\n- API/ABI 破坏性变更频繁：VVDec 3.0.0（repo_release:github:vvdec-v3.0.0）、SVT-AV1 4.0.0（CRF 语义变更，repo_release:github:SVT-AV1-v4.0.0）、VVenC cts/dts 符号变更（repo_release:github:vvenc-v1.14.0）；工具生命周期管理出现（LMCS 弃用，repo_release:github:vvenc-v1.14.0）。\n- 跨平台输出一致性本身成为缺陷类别：SVT-AV1 3.0.1 专门修复 Arm 与 x86 输出不一致（repo_release:github:SVT-AV1-v3.0.1）。\n- 神经工具标准化路径初步成形但碎片化：AVS NVC 采纳学习式跳过决策（paper:arxiv:2611.00181），渐进式评测已对齐 JPEG-AI（paper:arxiv:2610.30966），增益图元数据对齐 ISO 21496-1（repo_release:github:libavif-v1.1.1）〔综述推断：学习式工具进入标准仍以「兼容现有语法的轻量插入」为主，端到端神经编码的标准化在条目中尚无进展证据〕。\n\n---\n\n## 四、趋势与展望\n\n1. **生成先验的一步化与实时化**：从多步到一步/少步（YODA 线性 DiT 一步去噪 paper:arxiv:2601.01141；DiffCR 两步+10× 加速 paper:arxiv:2601.10373；GenVC 478M 参数 15.1fps paper:arxiv:2607.22772；\n"}};

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md2html(md) {
  const lines = md.split("\n");
  let out = [], inList = null, tableRows = [];
  const flushList = () => { if (inList) { out.push(`</${inList}>`); inList = null; } };
  const flushTable = () => {
    if (!tableRows.length) return;
    const rows = tableRows.filter(r => !/^\s*\|?\s*:?-+/.test(r));
    out.push("<table>" + rows.map((r, i) => {
      const cells = r.split("|").slice(1, -1).map(c => c.trim());
      const tag = i === 0 ? "th" : "td";
      return "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
    }).join("") + "</table>");
    tableRows = [];
  };
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim().startsWith("|")) { flushList(); tableRows.push(line); continue; }
    flushTable();
    if (/^#{1,3}\s/.test(line)) {
      flushList();
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.replace(/^#+\s*/, ""))}</h${level}>`);
    } else if (/^[-*]\s/.test(line)) {
      if (inList !== "ul") { flushList(); out.push("<ul>"); inList = "ul"; }
      out.push(`<li>${inline(line.replace(/^[-*]\s*/, ""))}</li>`);
    } else if (/^\d+\.\s/.test(line)) {
      if (inList !== "ol") { flushList(); out.push("<ol>"); inList = "ol"; }
      out.push(`<li>${inline(line.replace(/^\d+\.\s*/, ""))}</li>`);
    } else if (line.trim() === "") {
      flushList();
    } else if (line.startsWith(">")) {
      flushList();
      out.push(`<p class="note">${inline(line.replace(/^>\s*/, ""))}</p>`);
    } else {
      flushList();
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  flushList(); flushTable();
  return out.join("");
}

}

  const counts = `论文 ${nPaper} · 版本动态 ${nRel}` + (md ? " · 附综述" : "");
  const itemsHTML = items.map((it, i) => rowHTML(it, i < 8)).join("") +
    (items.length > 8
      ? `<span class="more-btn" onclick="showAll(this, '${dom}')">显示全部 ${items.length} 条 ▼</span>` : "");
  synHTML += `<div class="syn" id="syn-${dom}">
    <div class="head" onclick="this.parentElement.classList.toggle('open')">
      <h3>${DN[dom] || dom}${dom === DATA.core ? ' <span class="core-tag" style="font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 5px;">核心域</span>' : ""}</h3>
      <span class="arrow">${counts} · 展开/收起</span>
    </div>
    <div class="body">
      ${md ? md2html(md) + `<div class="divider">该领域全部条目（${items.length}）</div>` : ""}
      <div id="items-${dom}">${itemsHTML}</div>
    </div>
  </div>`;
}
sl.innerHTML = synHTML || '<div class="empty">领域综述生成中（scripts/synthesize_kb.py）</div>';

function showTab(t) {
  document.getElementById("view-week").style.display = t === "week" ? "" : "none";
  document.getElementById("view-kb").style.display = t === "kb" ? "" : "none";
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  document.getElementById("tab-kb").classList.toggle("on", t === "kb");
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  const btn = document.getElementById("askBtn");
  const ans = document.getElementById("ans");
  if (!q) return;
  btn.disabled = true;
  ans.textContent = "检索知识库并思考中…（glm-5.3，约 1-2 分钟）";
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    ans.innerHTML = md2html(d.answer) +
      `<div class="used">引用 ${d.used.length} 条：${d.used.join(" · ")}</div>`;
  } catch (e) {
    ans.innerHTML = `<b>问答服务不可达</b>（${e.message}）。线上静态页不带密钥——
      本地运行 <code>uv run --with pyyaml python scripts/serve.py</code> 后访问
      <code>http://127.0.0.1:8931</code> 即可提问；下方领域综述始终可读。`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("foot").innerHTML =
  `音视频信息引擎 · 数据与代码：<a href="${DATA.repo_url}" target="_blank">LLM-Reading</a> · 每日 09:30 自动更新`;
</script>
