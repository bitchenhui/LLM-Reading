3957", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "提出InnVC：以可逆主变换路径结合隐式条件场与调度掩码策略，实现覆盖20 dB以上PSNR范围的宽质量高保真神经视频压缩。", "abstract": "针对现有学习式视频编码依赖不可逆分析-合成变换、重建同时受量化与变换近似误差制约的问题，提出InnVC，在量化前保持可逆的主变换路径，并通过紧凑的隐式条件场注入内容自适应上下文，将强相关的视频内容与难建模的细节解耦，使各组件分工完成互补的重建任务。进一步引入调度掩码策略，逐步将有效信息集中到更少的潜在通道以提升熵编码效率。在UVG和MCL-JCV基准上，InnVC在宽质量范围内取得强压缩性能，尤其在高保真区间有效，相对x265在UVG上PSNR BD-rate降低21.66%、MS-SSIM BD-rate降低46.06%。作者称其为首个在单一架构尺度内覆盖从低码率到高保真、PSNR跨度超过20 dB的神经视频编解码器。", "claims": [{"statement": "在UVG基准上，InnVC相对x265实现PSNR BD-rate降低21.66%。", "metrics": ["PSNR BD-Rate 21.66%（相对x265，UVG数据集（降低幅度））"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "在UVG基准上，InnVC相对x265实现MS-SSIM BD-rate降低46.06%。", "metrics": ["MS-SSIM BD-Rate 46.06%（相对x265，UVG数据集（降低幅度））"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "作者声称InnVC是首个在单一架构尺度内覆盖从低码率到高保真工作点的神经视频编解码器。", "metrics": ["PSNR工作点跨度 >20 dB（单模型覆盖范围（作者声明））"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:EntropyModel", "dataset:UVG", "dataset:MCL-JCV", "metric:BD-Rate", "metric:PSNR", "metric:MS-SSIM", "impl:x265"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2606.05861", "type": "paper", "domain": "video_image_coding", "title": "LLMCodec: Adapting Video Codecs for Efficient Weight Compression of Large Language Models", "title_zh": "LLMCodec：将视频编解码器改造用于大语言模型的高效权重压缩", "published": "2026-06-04", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2606.05861", "lines": [], "relevance": "high", "decision": "deep_read", "one_liner": "提出LLMCodec，将仿射量化与VVC视频编码结合压缩LLM权重，2-bit下困惑度降低超1.5倍、下游准确率提升21%", "abstract": "大语言模型规模增长带来存储、传输与部署挑战，而现有模型压缩与量化方法常依赖微调或校准数据，跨张量类型的泛化能力有限。论文提出LLMCodec，将仿射量化与VVC/H.266视频编码器相结合，利用视频编码器对矩阵结构数据的天然兼容性、可配置的压缩策略及高度优化的现成实现来压缩LLM权重。除VVC外，作者还比较了多种视频编码器及其编码配置（profile）对压缩性能的影响。在不同模型上的实验验证了该方法的鲁棒性与通用性：在LLaMA-3-8B的2-bit精度下，相比现有方法困惑度降低超过1.5倍，下游任务准确率提升21%。", "claims": [{"statement": "在LLaMA-3-8 ence": "abstract（初筛，未读全文）"}], "entities": ["codec:AV2", "metric:BD-Rate"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2605.13243", "type": "paper", "domain": "video_image_coding", "title": "Spatial Competition for Low-Complexity Learned Image Compression", "title_zh": "基于空间竞争的低复杂度学习式图像压缩", "published": "2026-05-13", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2605.13243", "lines": [], "relevance": "high", "decision": "deep_read", "one_liner": "通过多个专用神经编解码器的区域级空间竞争与模式图选择，在保持单编解码器解码复杂度的同时实现自适应压缩。", "abstract": "自编码器图像编解码器压缩性能领先但解码计算复杂度高。本文提出基于多个专用神经编解码器空间竞争的低复杂度学习式图像压缩框架：编码端按率失真代价为每个图像区域选择最匹配的编解码器，并将区域级选择以模式图作为边信息传输；解码端仅依据模式图执行相应重建，复杂度与单一编解码器相当。该设计实现逐图自适应、低解码复杂度与快速编码。在 CLIC 2020 数据集上，相对单一编解码器最多节省 14.5% 码率，并以每像素 1433 次 MAC 的解码复杂度达到 HEVC 水平的性能。", "claims": [{"statement": "基于空间竞争的多编解码器选择框架在 CLIC 2020 上相对单一编解码器最多可节省 14.5% 码率。", "metrics": ["码率节省 -14.5%（CLIC 2020 数据集，相对单一编解码器的最大降幅）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "该方法在解码复杂度仅 1433 MACs/像素的条件下达到 HEVC 水平的压缩性能。", "metrics": ["解码复杂度 1433 MACs/pixel（达到 HEVC 同等性能时的每像素乘累加运算数）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "以模式图作为边信息传输区域级编解码器选择，使解码端复杂度保持与单一编解码器相当，同时实现逐图自适应与快速编码。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["codec:HEVC"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2604.20104", "type": "paper", "domain": "video_image_coding", "title": "Feedback-Driven Rate Control for Learned Video Compression", "title_zh": "面向学习式视频压缩的反馈驱动码率控制", "published": "2026-04-22", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2604.20104", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "提出反馈驱动的学习式视频编码码率控制框架，用log域PI/PID闭环与GRU调节器实现精准码率跟踪与BD-rate增益。", "abstract": "该文针对端到端学习式视频压缩中码率控制研究不足的问题，提出反馈驱动的码率控制框架。首先在DCVC风格框架上构建单模型多码率编码接口，通过率失真参数λ实现连续比特率调节；随后采用log域PI/PID闭环控制器，根据目标码率与熵估计码率之间的偏差在线更新λ，实现稳定的目标码率跟踪。为进一步优 视觉的生成层级。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:INR", "codec:HEVC", "codec:VVC", "dataset:UVG", "dataset:MCL-JCV", "org:JVET", "metric:LPIPS", "metric:DISTS", "metric:FID"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2604.03353", "type": "paper", "domain": "video_image_coding", "title": "NeuralLVC: Neural Lossless Video Compression via Masked Diffusion with Temporal Conditioning", "title_zh": "NeuralLVC：基于时间条件掩码扩散的神经无损视频压缩", "published": "2026-04-03", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2604.03353", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "提出结合掩码扩散与I/P帧时间条件化的神经无损视频编解码器，在多种分辨率上无损性能超越H.264与H.265。", "abstract": "论文提出NeuralLVC，一个将掩码扩散与I/P帧架构结合的神经无损视频编解码器。I帧模型采用双射线性token化保证像素级精确重建；P帧模型压缩相邻帧的时间残差，通过仅增加1.3%可训练参数的轻量参考嵌入条件化于前一已解码帧，并支持分组解码以调节速度-压缩率权衡。该方法在输入域实现严格无损：视频精确重建YUV420平面，图像精确重建RGB通道。在9条Xiph CIF序列以及24条720p/1080p HD序列（Xiph、UVG、BVI-AOM基准）上的实验显示，NeuralLVC在所有测试分辨率上均显著优于H.264与H.265无损模式，并通过端到端编解码加算术编码验证了精确重建。", "claims": [{"statement": "NeuralLVC在所有测试分辨率（CIF、720p、1080p）上无损压缩性能均显著优于H.264与H.265无损模式。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "P帧模型的轻量参考嵌入仅增加1.3%的可训练参数即可实现时间条件化。", "metrics": ["可训练参数增幅 1.3%（P帧参考嵌入相对基模型的参数占比）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "I帧模型通过双射线性token化保证像素级精确重建，编解码器在输入域严格无损（YUV420平面/RGB通道精确重建），并经端到端编解码加算术编码验证。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "评估覆盖9条Xiph CIF序列与24条720p/1080p HD序列（来自Xiph、UVG、BVI-AOM基准），分组解码机制提供可控的速度-压缩率权衡。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["codec:AVC", "codec:HEVC", "dataset:UVG", "concept:EntropyModel"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.29864", "type": "paper", "domain": "video_image_coding", "title": "HLC: A High-Quality Lightweight Mezzanine Codec Featuring High-Throughput Palette", "title_zh": "HLC：具备高吞吐调色板编码的高质量轻量级中间码编解码器", "published": "2026-03-31", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.29864", "lines": ["learned_codec", "traditional_codec_opt"], "relevance": "high", "decision": "deep_read", "one_liner": "提出无数据依赖高吞吐调色板的轻量级中间码编解码器HLC，同吞吐下LUT资源减半，BD-PSNR较JPEG-XS最高提升5.312dB。", "abstract": "现有中间码（mezzanine）图像编解码器缺乏专门的屏幕内容编码工具，在带宽受限尤其是密集文字场景下难以保证高质量，而标准编码器中的屏幕内容压缩技术计算复杂度过高，不适用于中间码编码。HLC 的核心创新是一种无数据依赖的调色板（palette）编码模式，消除了吞吐瓶颈，使高吞吐 palette 编码切实可行。系统还协同设计了率失真优化（RDO）模块，在调色板与传统预测模式之间仲裁，并通过率估计与熵编码之间的数据复用策略降低整体硬件资源开销。实验表明，与 4K@120fps JPEG-XS 编码器相比，HLC 在相同吞吐下仅用一半 LUT 资源，在游戏、自然和文字内容数据集上分别取得 3.461dB、3.299dB 和 5.312dB 的 BD-PSNR 提升。", "claims": [{"statement": "HLC 的无数据依赖调色板设计消除了传统 palette 编码的吞吐瓶颈，使高吞吐 palette 模式可实际用于中间码编码", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "协同设计的 RDO 模块在调色板与传统预测模式间仲裁，保证工具对所有内容类型有效；率估计与熵编码间的数据复用降低系统硬件资源", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "HLC 在达到与 4K@120fps JPEG-XS 编码器相同吞吐量的同时，LUT 资源占用仅为其一半", "metrics": ["LUT资源 50%（相对4K@120fps JPEG-XS编码器，相同吞吐条件下）", "吞吐量 4K@120fps（与JPEG-XS编码器相同）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "相比 JPEG-XS 编码器，HLC 在游戏、自然和文字内容数据集上均取得显著 BD-PSNR 增益，文字内容收益最大", "metrics": ["BD-PSNR增益 3.461dB（游戏内容数据集，对比4K@120fps JPEG-XS）", "BD-PSNR增益 3.299dB（自然内容数据集，对比4K@120fps JPEG-XS）", "BD-PSNR增益 5.312dB（文字内容数据集，对比4K@120fps JPEG-XS）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:RDO", "concept:EntropyModel", "metric:BD-PSNR"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.25566", "type": "paper", "domain": "video_image_coding", "title": "A Mamba-based Perceptual Loss Function for Learning-based UGC Transcoding", "title_zh": "基于Mamba的感知损失函数用于学习式UGC视频转码", "published": "2026-03-26", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.25566", "lines": ["inr_representation", "traditional_codec_opt"], "relevance": "high", "decision": "deep_read", "one_liner": "提出Mamba质量模型作感知损失并嵌入DCVC与HiNeRV的RDO，UGC转码较基线分别节省8.46%与12.89% BD-rate。", "abstract": "UGC源视频常因先前压缩、编辑或欠佳拍摄条件而带有失真，传统以参考视频为像素锚点的保真优化会迫使编解码器复制源本身缺陷。该文将参考视频的角色重新定位为上下文引导而非真值锚点，训练一个基于Mamba（选择性结构化状态空间模型）的轻量神经质量模型，并采用弱监督Siamese排序策略优化。该模型作为感知损失被集成进两个神经视频编解码器DCVC与HiNeRV的率失真优化（RDO）过程，以改善重建内容的感知质量。实验表明，该框架相对自编码器类基线与INR类基线分别取得8.46%和12.89%的BD-rate节省。", "claims": [{"statement": "将基于Mamba的感知损失集成进DCVC的RDO后，相对自编码器类基线取得8.46%的BD-rate节省。", "metrics": ["BD-Rate节省 8.46%（DCVC上集成所提损失，对比自编码器（autoencoder）类基线）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "将所提感知损失集成进HiNeRV的RDO后，相对INR类基线取得12.89%的BD-rate节省。", "metrics": ["BD-Rate节省 12.89%（HiNeRV上集成所提损失，对比INR（隐式神经表示）类基线）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "提出用弱监督Siamese排序策略训练基于Mamba的轻量神经质量模型，把参考视频从像素锚点重新定位为上下文引导。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:RDO", "impl:HiNeRV", "concept:INR", "metric:BD-Rate"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.26763", "type": "paper", "domain": "video_image_coding", "title": "A Camera-Native Talking-Head Video Dataset for Various Computer Vision Tasks", "title_zh": "面向多种计算机视觉任务的相机原生谈话头视频数据集", "published": "2026-03-23", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.26763", "lines": [], "relevance": "medium", "decision": "summary_only", "one_liner": "开源838段相机原生FFV1无损谈话头数据集，四编码器评测中H.266较H.264的VMAF BD-rate最高节省71.3%。", "abstract": "作者开源了一个相机原生谈话头视频数据集：838段15秒录像（约210分钟），来自799名参与者、443种相机型号，全部以FFV1无损存储，保留未压缩（24.7%）或MJPEG编码（75.3%）的原始相机信号；每段附MOS及十个感知质量标签，联合解释64.4%的MOS方差。从中构建120段的分层基准子集，涵盖原始、背景虚化、背景替换三种内容条件。在四数据集×四编码器（H.264/H.265/H.266/AV1）效率评测中，H.266相对H.264的VMAF BD-rate节省最高达-71.3%，且编码器×数据集（ηp²=.112）与编码器×内容条件（ηp²=.149）交互显著，表明内容类型与背景处理均影响压缩效率。初步超分辨率评测（四个SR模型）显示数据集显著影响绝对性能但保持模型排序，验证其可用于视频压缩、超分辨率与质量评估的基准测试。", "claims": [{"statement": "在四数据集×四编码器（H.264/H.265/H.266/AV1）的效率评测中，H.266相对H.264取得最高-71.3%的VMAF BD-rate节省。", "metrics": ["BD-Rate (VMAF) -71.3%（H.266 vs H.264，四数据集×四编码器评测中的最大节省）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "编码器与数据集、编码器与内容条件（原始/背景虚化/背景替换）的交互效应均显著，说明内容类型与背景处理会影响压缩效率。", "metrics": ["偏η² .112（编码器×数据集交互效应量）", "偏η² .149（编码器×内容条件交互效应量）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "数据集规模为最大既有网络摄像头谈话头数据集的5倍，并以FFV1无损保留相机原生信号，未做额外有损处理。", "metrics": ["片段数 838 vs 160（本数据集 vs 最大先前谈话头网络摄像头数据集）", "未压缩占比 24.7%（相机原生信号中未压缩录像比例）", "MJPEG编码占比 75.3%（相机原生信号中MJPEG编码录像比例）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "每段录像附MOS与十个感知质量标签，后者联合解释大部分MOS方差。", "metrics": ["MOS方差解释率 64.4%（十个感知质量标签对MOS的联合解释比例）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "四个超分辨率模型的初步评测显示，数据集显著影响绝对性能但保持模型排序，表明其适用性超出编解码器基准。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["codec:VVC", "codec:HEVC", "codec:AV1", "codec:AVC", "metric:BD-Rate", "metric:VMAF", "metric:MOS"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "repo_release:github:libavif-v1.4.1", "type": "repo_release", "domain": "video_image_coding", "title": "v1.4.1", "title_zh": "libavif 发布 v1.4.1", "published": "2026-03-20", "collected": "2026-11-12", "url": "https://github.com/AOMediaCodec/libavif/releases/tag/v1.4.1", "lines": ["traditional_codec_opt"], "relevance": "medium", "decision": "summary_only", "one_liner": "补丁版修复构建与内存泄漏，渐进式/分层编码等实验特性正式转正", "abstract": "libavif v1.4.1 修复 CMake 3.22 构建问题，支持 Windows 长路径名，并修复 avifgainmaputil 中的 CICP 管理与内存泄漏。同时将 avifenc 的 --progressive、--layered、--scaling-mode 及 avifEncoder 的 extraLayerCount 从实验性状态转正，标志分层与渐进式 AVIF 编码能力进入稳定阶段。依赖同步更新至 aom v3.13.2、libxml2 v2.15.2 及新版 libyuv。", "claims": [{"statement": "avifenc 的 --progressive、--layered、--scaling-mode 选项及 avifEncoder 的 extraLayerCount 不再标记为实验性，分层/渐进式编码特性正式稳定", "metrics": [], "confidence": "report ": ["预测噪声鲁棒性 20%（预测误差注入噪声比例上限内保持稳健）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "使用机器学习模型预测解码时间、码率等级与客观质量（VMAF、XPSNR），避免穷举编码与质量指标计算。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["codec:VVC", "impl:VVenC", "impl:VVdec", "metric:BD-Rate", "metric:VMAF", "org:Apple"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.10188", "type": "paper", "domain": "video_image_coding", "title": "ARCHE: Autoregressive Residual Compression with Hyperprior and Excitation", "title_zh": "ARCHE：基于超先验与激励机制的自回归残差压缩", "published": "2026-03-10", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.10188", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "统一分层/空间/通道先验的端到端学习图像压缩框架，Kodak上BD-Rate优于VVC Intra约5%。", "abstract": "论文提出ARCHE，一个端到端学习式图像压缩框架，在单一概率框架内统一了分层先验、空间先验与通道先验，同时捕获潜表示中的全局与局部依赖，并通过自适应特征重标定（激励）与残差精炼提升潜表示质量。该方法不依赖循环网络或Transformer组件，仅用高效卷积设计实现精确的熵建模。在Kodak数据集上，ARCHE相对Balle等人基准模型降低BD-Rate约48%，相对Minnen & Singh通道自回归模型降低约30%，相对VVC Intra编码器降低约5%。模型参数量95M、单图推理222ms，视觉对比显示低码率下纹理更锐利、色彩保真度更高。", "claims": [{"statement": "ARCHE在Kodak数据集上相对Balle等人常用基准模型降低BD-Rate约48%。", "metrics": ["BD-Rate ≈-48%（相对Balle et al.基准模型，Kodak数据集）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE相对Minnen & Singh通道自回归模型降低BD-Rate约30%。", "metrics": ["BD-Rate ≈-30%（相对Minnen & Singh通道自回归模型，Kodak数据集）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE的率失真性能超过VVC Intra编码器，BD-Rate降低约5%。", "metrics": ["BD-Rate ≈-5%（相对VVC Intra，Kodak数据集）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE在不使用循环或Transformer组件的情况下保持计算效率，参数量95M，单图运行时间222ms。", "metrics": ["参数量 95M（ARCHE模型整体）", "单图运行时间 222ms（每张图像）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "ARCHE在单一概率框架内统一分层、空间与通道先验，并用自适应特征重标定与残差精炼增强潜表示，低码率下纹理更锐利、色彩保真度更好。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["concept:Hyperprior", "dataset:Kodak", "metric:BD-Rate", "codec:VVC"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.06095", "type": "paper", "domain": "video_image_coding", "title": "Enhancing Neural Video Compression of Static Scenes with Positive-Incentive Noise", "title_zh": "利用正向激励噪声增强静态场景神经视频压缩", "published": "2026-03-06", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.06095", "lines": ["learned_codec"], "relevance": "high", "decision": "deep_read", "one_liner": "提出PIC框架，将静态场景短期时变重释为正向激励噪声以微调NVC，在0.009%压缩率下实现视觉无损重构。", "abstract": "针对监控、视频通话等静态场景视频，传统编码器时间冗余利用不足、神经视频压缩（NVC）又存在训练-测试分布鸿沟，而生成式压缩会引入不可接受的幻觉细节。论文提出正向激励相机（PIC）框架，将短期时变内容重新解释为正向激励噪声用于NVC模型微调，把瞬态变化与持久背景解耦，使结构化先验内化到压缩模型中。推理时仅不变分量需少量信令，在保持像素级保真的同时大幅降低传输数据量。实验表明PIC在0.009%的极低压缩率下对静态场景实现视觉无损重构，而DCVC-FM基线需要高20.5%的Bjøntegaard delta码率。该方法以算力换带宽，适用于恶劣网络下的鲁棒传输和监控 footage 的长期经济存储。", "claims": [{"statement": "PIC在静态场景上以0.009%的极低压缩率实现视觉无损重构。", "metrics": ["压缩率 0.009%（静态场景视觉无损重构）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "与PIC相比，DCVC-FM基线需要高20.5%的Bjøntegaard delta码率才能达到相当质量。", "metrics": ["BD-rate 20.5%（DCVC-FM相对PIC的码率增加）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["impl:DCVC-FM"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.06766", "type": "paper", "domain": "video_image_coding", "title": "HiDE: Hierarchical Dictionary-Based Entropy Modeling for Learned Image Compression", "title_zh": "HiDE：面向学习式图像压缩的分层字典熵建模", "published": "2026-03-06", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.06766", "lines": [], "relevance": "high", "decision": "deep_read", "one_liner": "提出分层字典熵建模HiDE，以全局-局部双字典级联检索利用外部先验，较VTM-12.1最多节省24%BD-rate。", "abstract": "该论文针对学习式图像压缩（LIC）中的熵建模问题，指出现有字典式熵模型将异构外部先验压入单层字典，导致先验利用不均衡、表示能力受限。HiDE框架将外部先验分解为全局结构字典与局部细节字典，并通过级联检索实现外部信息的结构化高效利用。同时设计具有并行多感受野的上下文感知参数估计网络，自适应融合异构上下文以精确估计条件概率。实验显示HiDE在Kodak、CLIC、Tecnick上分别相对VTM-12.1取得18.5%、21.99%、24.01%的BD-rate节省。", "claims": [{"statement": "HiDE在Kodak数据集上相对VTM-12.1取得18.5%的BD-rate节省。", "metrics": ["BD-rate savings 18.5%（Kodak数据集，锚点VTM-12.1）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "HiDE在CLIC数据集上相对VTM-12.1取得21.99%的BD-rate节省。", "metrics": ["BD-rate savings 21.99%（CLIC数据集，锚点VTM-12.1）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "HiDE在Tecnick数据集上相对VTM-12.1取得24.01%的BD-rate节省。", "metrics": ["BD-rate savings 24.01%（Tecnick数据集，锚点VTM-12.1）"], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "HiDE将外部先验分解为全局结构字典与局部细节字典并采用级联检索，配合并行多感受野的上下文感知参数估计网络，缓解了单层字典先验利用不均衡的问题。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}], "entities": ["dataset:Kodak", "impl:VTM", "metric:BD-Rate"], "tags": [], "deep_dive_url": null, "manual": false}, {"id": "paper:arxiv:2603.05756", "type": "paper", "domain": "video_image_coding", "title": "Uni-LVC: A Unified Method for Intra- and Inter-Mode Learned Video Compression", "title_zh": "Uni-LVC：帧内与帧间模式统一的学习式视频压缩方法", "published": "2026-03-05", "collected": "2026-11-12", "url": "https://arxiv.org/abs/2603.05756", "lines": [], "relevance": "high", "decision": "deep_read", "one_liner": "提出单模型统一支持帧内/帧间与低延迟/随机访问模式的学习式视频压缩，率失真性能优越。", "abstract": "现有学习式视频压缩通常需要帧内与帧间分离模型，且时间参考不可靠时性能退化。Uni-LVC 将帧间编码建模为以参考帧提取的时间信息为条件的帧内编码，在单一模型中同时支持帧内/帧间编码及低延迟与随机访问两种配置。方法上设计了高效的跨注意力适配模块以融合时间线索，支持单向（低延迟）与双向（随机访问）预测；并提出可靠性感知分类器选择性缩放时间线索，使参考不可靠时行为趋近帧内编码，配合多阶段训练策略适配多种编码模式。实验表明 Uni-LVC 在帧内与帧间配置下均取得优越的率失真性能，同时保持相当的计算效率。", "claims": [{"statement": "以 DCVC-RT 为代表的学习式视频编解码器在压缩效率上已超越 H.266/VVC 低延迟模式。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "Uni-LVC 在单一模型中同时支持帧内与帧间编码，并覆盖低延迟与随机访问两种配置。", "metrics": [], "confidence": "reported", "evidence": "abstract（初筛，未读全文）"}, {"statement": "跨注意力适配模块将时间线索整合进帧内编码条件框架，可无缝支持单向（低延迟）与双向（随机访问）预测。", "metrics": [], "confidence": "reported", "evidence": "abstra const LINE = DATA.line_names;
const DOMAIN = DATA.domain_names;
const REL_ZH = { high: "高相关", medium: "中相关", low: "低相关" };
const DEC_ZH = { deep_read: "深读", summary_only: "仅摘要" };
const state = { lines: new Set(), q: "", rel: "", dec: "", ent: "", dom: "" };

document.getElementById("stats").innerHTML =
  `<div class="stat"><b>${DATA.stats.items}</b>信息项（论文 ${DATA.stats.papers} + 版本 ${DATA.stats.releases}）</div>` +
  `<div class="stat"><b>${DATA.stats.claims}</b>结构化论断</div>` +
  `<div class="stat"><b>${DATA.stats.deep_reads}</b>深读笔记</div>` +
  `<div class="stat">更新 ${DATA.generated}</div>`;

const chips = document.getElementById("lineChips");
Object.entries(LINE).forEach(([k, name]) => {
  const n = DATA.items.filter(i => i.lines.includes(k)).length;
  const el = document.createElement("span");
  el.className = "chip"; el.textContent = `${name} ${n}`; el.dataset.k = k;
  el.onclick = () => { state.lines.has(k) ? state.lines.delete(k) : state.lines.add(k);
    el.classList.toggle("on"); render(); };
  chips.appendChild(el);
});
const allChip = document.createElement("span");
allChip.className = "chip on"; allChip.textContent = "全部";
allChip.onclick = () => { state.lines.clear();
  document.querySelectorAll("#lineChips .chip[data-k]").forEach(c => c.classList.remove("on"));
  render(); };
chips.prepend(allChip);

const domSel = document.getElementById("dom");
Object.entries(DOMAIN).forEach(([k, name]) => {
  const o = document.createElement("option"); o.value = k; o.textContent = name;
  domSel.appendChild(o);
});
domSel.onchange = e => { state.dom = e.target.value; render(); };
document.getElementById("q").oninput = e => { state.q = e.target.value.toLowerCase(); render(); };
document.getElementById("rel").onchange = e => { state.rel = e.target.value; render(); };
document.getElementById("dec").onchange = e => { state.dec = e.target.value; render(); };
window.filterEnt = ref => { state.ent = state.ent === ref ? "" : ref; render(); };

function match(it) {
  if (state.dom && it.domain !== state.dom) return false;
  if (state.lines.size && !it.lines.some(l => state.lines.has(l))) return false;
  if (state.rel && it.relevance !== state.rel) return false;
  if (state.dec && it.decision !== state.dec) return false;
  if (state.ent && !it.entities.includes(state.ent)) return false;
  if (state.q) {
    const hay = (it.title + " " + (it.title_zh || "") + " " + it.one_liner + " " +
      (it.abstract || "") + " " + it.entities.join(" ") + " " +
      it.claims.map(c => c.statement).join(" ")).toLowerCase();
    if (!hay.includes(state.q)) return false;
  }
  return true;
}

function card(it) {
  const ents = it.entities.slice(0, 12).map(e =>
    `<span class="ent" onclick="filterEnt('${e}')">${e}</span>`).join("");
  const claims = it.claims.map(c => {
    const m = c.metrics.map(x => `<span class="m">▸ ${x}</span>`).join(" ");
    const ev = c.evidence ? ` <span class="ev">[${c.evidence}]</span>` : "";
    return `<div class="claim">· ${c.statement}${m}${ev}</div>`;
  }).join("");
  const links = [`<a href="${it.url}" target="_blank">arXiv ↗</a>`]
    .concat(it.deep_dive_url ? [`<a href="${it.deep_dive_url}" target="_blank">深读笔记 ↗</a>`] : [])
    .join("");
  const cls = it.manual ? "card manual" : (it.relevance === "high" ? "card top" : "card");
  const lines = it.lines.map(l => LINE[l] || l).join(" / ") || "未分类";
  const domLabel = it.domain && it.domain !== "video_image_coding"
    ? `<span class="badge b-dom">${DOMAIN[it.domain] || it.domain}</span>` : "";
  return `<div class="${cls}" id="${it.id}">
    <div class="meta"><span>${it.published}</span>
      ${it.type === "repo_release" ? '<span class="badge b-rel">版本动态</span>' : ""}
      ${domLabel}
      <span class="badge b-${it.relevance}">${REL_ZH[it.relevance] || it.relevance}</span>
      <span class="badge ${it.decision === "deep_read" ? "b-deep" : "b-sum"}">${DEC_ZH[it.decision] || it.decision}</span>
      <span>${lines}</span></div>
    <h3><a href="${it.url}" target="_blank">${it.title_zh || it.title}</a></h3>
    <div class="orig">${it.title}</div>
    <div class="oneliner">${it.one_liner}</div>
    ${it.claims.length ? `<div class="claims-toggle" onclick="const el=this.nextElementSibling;el.style.display=el.style.display==='block'?'none':'block';this.textContent=el.style.display==='block'?'▲ 收起论断':'▼ 展开论断（'+${it.claims.length}）'">▼ 展开论断（${it.claims.length}）</div><div class="claims">${claims}</div>` : ""}
    <div class="ents">${ents}</div>
    <div class="links">${links}</div>
  </div>`;
}

function render() {
  const list = DATA.items.filter(match);
  document.getElementById("list").innerHTML = list.map(card).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
  document.getElementById("foot").innerHTML =
    `共 ${list.length}/${DATA.stats.items} 条 · 数据源：<a href="${DATA.repo_url}" target="_blank">LLM-Reading kb/</a>` +
    (state.ent ? ` · 实体过滤: <b onclick="filterEnt('${state.ent}')" style="cursor:pointer">${state.ent} ✕</b>` : "");
}
render();
</script>
