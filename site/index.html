<style>
:root {

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text);

.wrap { max-width: 900px; margin: 0 auto; padding: 28px 20px 80px; }

.tabs { display: flex; gap: 8px; margin: 18px 0 16px; }

.empty { color: var(--dim); font-size: 13px; text-align: center; padding: 40px 0; }

.qa { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;

.qa .hint { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
.qa .row { display: flex; gap: 10px; }

.qa button { background: var(--accent); border: none; color: #fff; border-radius: 8px;
  padding: 9px 20px; font-size: 14px; cursor: pointer; }
.qa button:disabled { opacity: .5; cursor: wait; }
.ans { margin-top: 14px; font-size: 13.5px; white-space: pre-wrap; }
.ans .used { margin-top: 10px; font-size: 11.5px; color: var(--dim); border-top: 1px dashed var(--border); padding-top: 8px; }
.syn { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 12px; overflow: hidden; }
.syn > .head { padding: 12px 16px; cursor: pointer; display: flex;
  justify-content: space-between; align-items: center; }
.syn > .head h3 { font-size: 14.5px; }
.syn > .head .arrow { color: var(--dim); font-size: 12px; }
.syn .body { display: none; padding: 4px 18px 16px; border-top: 1px solid var(--border);
  font-size: 13.5px; }
.syn.open .body { display: block; }
.row-item { padding: 8px 0; border-bottom: 1px dashed var(--border); }
.row-item:last-child { border-bottom: none; }
.row-item .l1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.row-item .d { color: #a4acbd; font-size: 11.5px; }
.row-item a { color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 600; }
.row-item a:hover { color: var(--accent); }
.row-item .ol { color: #c6cdbe; font-size: 12.5px; margin-top: 1px; }
.more-btn { display: inline-block; margin-top: 8px; color: var(--accent); font-size: 12.5px;
  cursor: pointer; user-select: none; }
.divider { margin: 14px 0 4px; font-size: 13px; color: var(--accent); font-weight: 600; }
.body h1 { font-size: 16px; margin: 12px 0 6px; }
.body h2 { font-size: 14.5px; margin: 14px 0 6px; color: var(--accent); }
.body h3 { font-size: 13.5px; margin: 10px 0 4px; }
.body p { margin: 6px 0; }
.body ul, .body ol { margin: 6px 0 6px 20px; }
.body code { background: var(--panel); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
.body table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
.body th, .body td { border: 1px solid var(--border); padding: 4px 8px; }
footer { color: var(--dim); font-size: 12px; margin-top: 36px; text-align: center; }
footer a { color: var(--dim); }
</style>
</head>

智能体SAGE，用采用感知效用估计与效用门控固化积累NPU算子知识，执行率达95.5%。", "deep": null}, {"id": "paper:arxiv:2609.33867", "type": "paper", "domain": "self_improvement", "title": "R² Flow：通过递归技能演化实现递归自我改进", "orig_title": "R$^2$ Flow: Recursive Self-Improvement via Recursive Skill Evolution", "published": "2026-09-27", "url": "https://arxiv.org/abs/2609.33867", "one_liner": "递归自我改进框架：在共享编排图上交替策略学习、独立验证与版本化技能库更新，实现递归技能演化。", "deep": null}]}, "synthesis": {"audio_coding": "# 音频编码 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 9 条结构化条目 · glm-5.3\n\n# 音频编码（audio_coding）领域综述\n\n数据窗口：2023-11 至 2026-10（条目共 9 条：IAMF 规范版本动态 3 条、论文 6 条）。条目在 2024-11-08 之后至 2026-08-15 之前无记录，下文阶段划分仅反映条目覆盖情况，不代表该区间无领域进展。\n\n## 发展历程\n\n### 阶段一：沉浸式音频标准化落地期（2023.11–2024.11）\n\n以 AOMedia IAMF 规范的三次版本动态为主线，完成从首版规范到比特流冻结的标准化闭环：\n\n| 时间 | 版本 | 里程碑要点 |\n|---|---|---|\n| 2023-11-07 | v1.0.0 | 首个正式规范，定义沉浸式音频模型与格式；覆盖流媒体、组播/广播、文件下载、游戏、通信、VR/AR 场景；呈现端横跨耳机、手机、平板、电视、Soundbar、家庭影院及大屏（repo_release:github:iamf-v1.0.0） |\n| 2024-05-06 | v1.0.0-errata | configOBUs 定义专用 Box；更新保留 OBU 条款；修订 ACN/SN3D 规范引用；约束同一 MixPresentation 中 audio_element_id 不得重复；base profile 勘误及 9.1.4/9.2 节澄清（repo_release:github:iamf-v1.0.0-errata） |\n| 2024-11-08 | v1.1.0 | 发布前的 7 月 1 日完成比特流冻结（bitstream frozen）；新增 Base-Enhanced Profile、CENC 通用加密、MixPresentationTags 语法语义及 9.1.6ch 等新布局（repo_release:github:iamf-v1.1.0） |\n\n该阶段的演进逻辑：先立格式与场景覆盖（v1.0.0），再以勘误收敛互操作细节（封装、保留 OBU、ID 唯一性），最终以比特流冻结加 Profile/加密/元数据扩展进入流媒体工程可用状态〔综述推断：基于三次条目内容的内在递进关系〕。\n\n### 阶段二：神经/混合编码研究密集期（2026.08–2026.10）\n\n约三个月内 6 篇论文集中出现，主题高度分化但共同指向“量化瓶颈重构 + 部署可行性”：\n\n- **2026-08-15** AudioTQ：随机 Hadamard 旋转 + Lloyd-Max 量化的数据无关 CPU 编解码器（paper:arxiv:2608.15369）\n- **2026-09-09** UniStream：全因果 48 kHz 流式神经编解码器，多专家残差矢量量化（paper:arxiv:2609.09866）\n- **2026-09-14** OLAC：TDAC 基、与 Opus CELT 重叠兼容的无损编解码器（paper:arxiv:2609.15616）\n- **2026-09-28** 解码端码率-能耗-质量实测分析：低码率并不必然带来端侧能耗收益（paper:arxiv:2609.34524）\n- **2026-10-03** GS-Codec：以一维高斯泼溅瓶颈替代量化瓶颈（paper:arxiv:2610.04651）\n- **2026-10-23** SEMAC：面向高阶 Ambisonics 的球面能量匹配编解码器（paper:arxiv:2609.34524 之外的空间音频压缩路线，paper:arxiv:2610.32981）\n\n## 技术主线与代表工作\n\n### 主线一：沉浸式音频标准化（IAMF）\n规范能力沿“格式—互操作—安全/元数据”扩展：v1.0.0 确立模型与多场景多设备覆盖（repo_release:github:iamf-v1.0.0）；errata 收敛封装与约束细节（repo_release:github:iamf-v1.0.0-errata）；v1.1.0 以 CENC、MixPresentationTags、Base-Enhanced Profile 与新声道布局补齐流媒体分发刚需（repo_release:github:iamf-v1.1.0）。\n\n### 主线二：神经编解码器的量化瓶颈重构\n\n| 工作 | 瓶颈处理方式 | 关键量化结论（按条目口径） |\n|---|---|---|\n| UniStream（paper:arxiv:2609.09866） | 多专家残差矢量量化（ME-RVQ），路由仅依赖历史解码量化状态、无需传输专家标识，相对单一共享码本仅 +5.5M 参数 | 12 kbps 下 Top1 的 PESQ/UTMOS 与 EnCodec 相当，语音 Mel-D 由 13.07（EnCodec @12 kbps）降至 8.21；22.5 kbps Top2 ViSQOL 语音模式 4.67、环境声模式 3.96（后者超过所有 ≤12 kbps 被评估系统）；语音 ViSQOL audio 模式与 24 kbps Opus 差距 ≤0.03 MOS-LQO |\n| GS-Codec（paper:arxiv:2610.04651） | 以 1D 高斯基元加权和的参数化信号分解替代 VQ-VAE 式量化瓶颈，训练管线不含任何量化器，仅训练后对拟合参数做标量量化 | 单一 checkpoint 通过基元数量 × 每参数位深实现免重训练细粒度码率控制；可比码率下 SIM/STOI/UTMOS 达到或超过 EnCodec 与 DAC，WER 相当 |\n| AudioTQ（paper:arxiv:2608.15369） | 随机化 FWHT 正交旋转将时域幅度均匀化为标准正态，使数据无关的逐坐标标量量化可行；6 bit Lloyd-Max + 1 bit QJL 残差构成 7 bit 虚拟索引、打包进 8 bit 容器对齐 CPU 寄存器边界 | 单线程 CPU（无硬件并行加速器）实时；物理体积缩减最高 74.4%（基准测试最大值），重建 SQNR 约 30 dB；推导了稀疏输入下的数学失效模式并给出 24 bit 录音棚音轨逐比特重建分析 |\n\n### 主线三：与 CELT/Opus 生态的结构兼容与参数化混合编码\n- **OLAC**（paper:arxiv:2609.15616）：基于 TDAC 且与 Opus CELT 模式的重叠结构匹配，实现有损/无损间无间断、无需传输冗余信息的切换；在保留 TDAC 的前提下仍达到 SOTA 无损压缩性能，压缩率未因 TDAC 受损。\n- **SEMAC**（paper:arxiv:2610.32981）：针对 Opus 经 Channel Mapping Families 2/3（RFC 8486）逐通道编码 HOA、码率随球谐阶数二次增长的瓶颈，改为传输量化全阶方向性能量包络 + 更少的 CELT 编码通道，解码端重新施加编码端观测的包络；五阶 HOA 素材、与 Opus CMF 3 匹配配置（512 与 768 kbit/s）的 MUSHRA 中，仅用 36 个传输通道中 16 个的 SEMAC 评分高于全阶 CMF 3；相同传输通道数下优于直接阶数截断。\n\n### 主线四：部署侧实测——能耗与实时性\n基于笔记本与手机平台的实测（paper:arxiv:2609.34524）确立“低码率 ≠ 低端侧能耗”的结论：质量匹配工作点上，被测神经编解码器以更低码率达到相近 ViSQOL 分数，但解码端能耗通常高于适用的传统编解码器（AAC-LC、Opus）；EnCodec 在两组质量匹配队列、两种平台上均为神经编解码器中最低盈亏平衡传输能耗阈值；DAC 与 SNAC 若干对比项在 Phone XNNPACK CPU 路径的盈亏平衡阈值超过 200 mJ/kbit，且其全频段 Phone 配置解码 1 秒音频需超过 1 秒、无法满足实时解码。\n\n### 主线五：跨领域方法迁移〔综述推断：基于两篇论文明确声明的方法来源〕\nLLM 权重量化思想（随机旋转 + Lloyd-Max）迁移至音频时域压缩（paper:arxiv:2608.15369）；3D 渲染中的高斯泼溅迁移为编解码瓶颈的参数化分解（paper:arxiv:2610.04651）。\n\n## 当前关键问题\n\n### 1. 神经编解码器解码端能耗与实时性（最突出的部署瓶颈）\n- **能耗反转**：质量匹配工作点上神经编解码器解码能耗通常高于 AAC-LC/Opus，“低码率省电”直觉在端侧不成立（paper:arxiv:2609.34524）。\n- **盈亏平衡阈值分化**：EnCodec 为神经中最低，而 DAC/SNAC 若干对比项在 Phone XNNPACK CPU 路径超过 200 mJ/kbit——同属神经编解码器家族，能耗代价可相差一个量级级别的问题〔综述推断：量级判断基于阈值差异，条目未给出全家族数值〕，提示瓶颈在架构（量化级联深度、上采样器规模、推理后端）而非码率本身。\n- **实时性红线**：DAC/SNAC 全频段 Phone 配置解码 1 秒音频需 >1 秒（paper:arxiv:2609.34524），此类配置在手机端不可部署。\n\n### 2. 量化瓶颈的容量—开销—可控性三难\n- **ME-RVQ 路线**：以 +5.5M 参数扩容，且路由不传专家标识、零码率开销；但路由仅依赖历史解码量化状态，专家选择非全局最优，且解码端误差可能经路由状态沿时间传播〔综述推断：误差传播机制为从“路由仅依赖历史解码量化状态”推断，条目未直接评估〕（paper:arxiv:2609.09866）。\n- **GS-Codec 路线**：训练期完全去量化换来免重训练的细粒度码率控制，但收益集中在声学/感知指标（SIM/STOI/UTMOS），语义指标 WER 仅“相当”而非超越（paper:arxiv:2610.04651）——参数化分解作为信息瓶颈是否保留下游任务（如 ASR）所需信息，尚无正面证据〔综述推断〕。\n- **AudioTQ 路线**：数据无关标量量化的精度上限约 30 dB SQNR，固定 7 bit 虚拟索引/8 bit 容器导致码率粒度粗、无感知加权；稀疏输入存在已推导的数学失效模式，24 bit 录音棚音轨逐比特分析进一步暴露高精度内容风险（paper:arxiv:2608.15369）。\n\n### 3. 全频带因果流式的质量—部署张力\nUniStream 达到全因果 48 kHz、GPU 实时推理（paper:arxiv:2609.09866），但 GPU 依赖与问题 1 揭示的端侧 CPU 能耗约束直接冲突〔综述推断：交叉引用两篇条目〕。且其对成熟标准编解码器的优势是分维度的：12 kbps 档 PESQ/UTMOS 仅“相当”，对 Opus 的逼近发生在 22.5 kbps 档、且以 ViSQOL audio 模式 ≤0.03 MOS-LQO 差距的形式呈现——中低码率区间尚无对 Opus 的全面工作点优势〔综述推断：基于条目指标的覆盖范围〕。\n\n### 4. HOA 码率随球谐阶数二次增长\n根因是 RFC 8486 CMF 2/3 的逐通道编码（paper:arxiv:2610.32981）。SEMAC 证明“少传输通道 + 方向能量包络”在感知上优于低精度编全部通道（16/36 通道胜全阶 CMF 3，MUSHRA @ 512/768 kbit/s 匹配配置），但遗留问题包括：包络量化误差的空间感知边界、非平稳方向场的包络表示能力、以及该结论向五阶以外阶数的泛化——条目内均无数据覆盖〔综述推断〕。\n\n### 5. 有损/无损切换的兼容性设计约束\nOLAC 表明结构匹配（TDAC 重叠与 Opus CELT 对齐）可实现无信令冗余的无缝切换且不损无损压缩率（paper:arxiv:2609.15616）；但该方案绑定 Opus CELT 的窗口/重叠约定，向其他核心编解码器迁移需重新做结构匹配〔综述推断〕。\n\n### 6. 标准侧的工程化与安全细节\nerrata 集中暴露互操作级细节（configOBUs 封装、保留 OBU、audio_element_id 唯一性，repo_release:github:iamf-v1.0.0-errata）；v1.1.0 补齐 CENC 与 MixPresentationTags（repo_release:github:iamf-v1.1.0）。跨设备（耳机→家庭影院）一致渲染目前停留在规范能力声明层面，条目内无实测验证闭环〔综述推断〕。\n\n### 7. 评测口径碎片化〔综述推断：基于条目中出现的指标谱系〕\nSQNR（paper:arxiv:2608.15369）、Mel-D/PESQ/UTMOS/ViSQOL（paper:arxiv:2609.09866）、MUSHRA（paper:arxiv:2610.32981）、SIM/STOI/WER（paper:arxiv:2610.04651）、能耗/盈亏平衡阈值（paper:arxiv:2609.34524）并存，且工作点（码率档、带宽、平台、后端）互不统一，缺乏“质量 × 码率 × 复杂度 × 能耗”的四维统一基准，横向结论可比性受限。\n\n## 趋势与展望\n\n1. **跨领域迁移成为创新主引擎**：LLM 权重量化（随机 FWHT 旋转 + Lloyd-Max，paper:arxiv:2608.15369）与高斯泼溅（paper:arxiv:2610.04651）在 2026 年下半年先后落地音频编码，预计随机投影类数据无关变换、参数化分解 + 后置量化的组合会进一步渗透〔综述推断〕。\n2. **能耗与实时性进入一线设计约束**：实测研究确立“盈亏平衡传输能耗阈值”类度量（paper:arxiv:2609.34524），将推动神经编解码器从“仅压码率”转向架构级轻量化；AudioTQ 式单线程 CPU 实时路径（paper:arxiv:2608.15369）代表了无加速器部署的极端取向。\n3. **与 CELT/Opus 生态融合而非替代**：OLAC（paper:arxiv:2609.15616）与 SEMAC（paper:arxiv:2610.32981）均以 CELT 为基座或锚点，参数化混合编码（方向能量包络、包络重施加）在空间音频与无损场景复兴，兼容既有分发生态成为硬约束〔综述推断〕。\n4. **码率控制从多档位走向单模型细粒度伸缩**：GS-Codec 的“基元数量 × 每参数位深”免重训练控制（paper:arxiv:2610.04651）若在语义指标上补齐短板，可能改变神经编解码器的训练-部署范式〔综述推断〕。\n5. **流式统一编解码深化**：全因果、语音/音乐/环境声统一、专家化量化扩容（paper:arxiv:2609.09866）与端侧部署约束的调和将是近期核心矛盾。\n6. **标准与研究的汇合**：IAMF 已完成比特流冻结并具备 CENC 加密与扩展布局（repo_release:github:iamf-v1.1.0），其沉浸声分发与 HOA 高效压缩（paper:arxiv:2610.32981）的对接是自然方向；布局库仍在扩展（9.1.6ch）表明声道级演进未止〔综述推断〕。\n7. **统一多维评测基准缺位**：跨“质量-码率-复杂度-能耗”的可复现基准（含主观 MUSHRA 与客观 ViSQOL/UTMOS 的对齐）是该领域当前最急需的基础设施性工作〔综述推断〕。\n", "immersive_media": "# 沉浸式与三维 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 3 条结构化条目 · glm-5.3\n\n# 沉浸式与三维领域综述\n\n> 语料范围：截至 2026-11-13，共 3 条条目（论文 3 条、版本动态 0 条）。全部结论仅基于给定条目；条目未覆盖而确需给出的判断以〔综述推断〕标注。条目中出现的 G-PCC（TMC13）、V-PCC、GeS-TM、Draco、高斯泼溅均以「基线/对比技术」身份出现，其自身版本演进不在语料覆盖范围内。\n\n---\n\n## 一、发展历程\n\n**版本里程碑说明**：本语料不含任何 repo_release 条目，故本节以论文时间线呈现；观测窗口集中于 2026-07 至 2026-09，约三个月，属局部切片观测。〔综述推断〕\n\n### 阶段一：属性级帧间压缩的精细化（—2026-07 上旬）\n\n动态点云压缩的重心从几何编码转向**属性的时间冗余消除**。paper:arxiv:2607.03576 提出基于几何的帧间属性编码方案，核心技术为基于图的运动估计（去除属性时间冗余）与免插值的分数体素运动估计（将运动精度从整数体素细化至分数体素级）。量化结果：MPEG 点云数据集、有损几何条件下，平均码率节省 vs G-PCC 55.3%、vs GeS-TM 42.3%、vs V-PCC 16.5%；且在无损与有损几何两种条件下均优于三个基线（paper:arxiv:2607.03576）。\n\n### 阶段二：统一连续表示路线的成形（2026-07 中旬）\n\npaper:arxiv:2607.16362 提出 OmniStyle-INR，以隐式神经表示（INR）作为统一连续表示，在文本提示与视觉范例双引导下覆盖 2D 图像、视频、3D 场景、4D 动态全部视觉模态的风格迁移。该工作同时给出了对显式表示路线的明确批评：高斯泼溅表示视频与 2D 图像这类稠密连续域时结构上欠优，所需高斯数量常逼近像素总数，实用性被削弱（paper:arxiv:2607.16362）。表示层选型（显式高斯 vs 隐式神经场）由此上升为沉浸式媒体管线的基础性争论。\n\n### 阶段三：实时交互级传输与端侧落地（2026-09）\n\npaper:arxiv:2609.19750 提出 DELUGE（分解式熵编码非结构化几何交换），面向实时物理模拟粒子流，利用粒子的时间相干性与速度可预测性实现**亚帧延迟**编解码：动态点云数据集上解码速度较 G-PCC（TMC13）快约 20×，编码速度较 Draco 快约 6×。落地形态为 Web 浏览器与 Apple Vision Pro 双端到端客户端，经感知质量评估与双人协作任务研究（实时手部追踪流体交互）验证（paper:arxiv:2609.19750）。至此，本窗口内的脉络可概括为：**压缩效率 → 表示统一 → 实时交互落地**三级递进。\n\n| 时间 | 条目 | 里程碑意义 |\n|---|---|---|\n| 2026-07-03 | paper:arxiv:2607.03576 | 属性帧间编码 + 分数体素级运动精度 |\n| 2026-07-17 | paper:arxiv:2607.16362 | INR 统一 2D/3D/4D 表示，质疑高斯泼溅稠密域适用性 |\n| 2026-09-17 | paper:arxiv:2609.19750 | 亚帧延迟实时粒子流压缩 + XR 头显端侧部署 |\n\n---\n\n## 二、技术主线与代表工作\n\n### 主线 A：动态点云/粒子流的时域压缩\n\n**A1. 图上运动估计 + 免插值分数体素细化**（paper:arxiv:2607.03576）\n- 以几何为锚的帧间属性编码：基于图的运动估计建模动态实体点云跨帧属性对应关系；免插值分数体素运动估计将运动补偿精度细化至分数体素级，规避插值环节。\n- 定位：补强 G-PCC 体系中属性维度的时间预测能力，覆盖无损与有损几何两种工作点。\n\n**A2. DELUGE：物理先验驱动的实时编码**（paper:arxiv:2609.19750）\n- 分解式熵编码的非结构化几何交换；核心先验为物理模拟粒子的速度可预测性与时间相干性，据此实现亚帧延迟编码与解码。\n- 定位：切入 TMC13（解码过慢）与 Draco（编码过慢）均无法满足的实时传输场景。\n\n### 主线 B：统一连续表示与上层编辑能力\n\n**OmniStyle-INR**（paper:arxiv:2607.16362）\n- 以 INR 为统一连续表示，单框架服务 2D 图像/视频/3D/4D 四类模态的风格迁移，支持文本提示与视觉范例双引导。\n- 论点性贡献：高斯泼溅在稠密连续域（视频、2D 图像）中高斯数量常逼近像素总数，结构性欠优；INR 天然适配各视觉域，附带数据压缩、超分辨能力与深度生成模型无缝集成三重红利。\n\n### 主线 C：端侧实时协作系统\n\nDELUGE 配套的 Web 浏览器与 Apple Vision Pro 客户端构成异构双端部署，以感知质量评估 + 双人协作任务（实时手部追踪流体交互）完成系统级验证（paper:arxiv:2609.19750），代表了从「码率指标」向「交互任务绩效指标」的验证范式迁移。\n\n---\n\n## 三、当前关键问题\n\n**1. 属性运动估计的精度—复杂度权衡**\n整数体素级运动精度不足以支撑属性对齐，需细化至分数体素级；而传统亚体素细化依赖插值，引入额外误差与计算开销，免插值细化（paper:arxiv:2607.03576）是对该矛盾的直接回应。跨帧对应关系的建模方式（图结构 vs 简单平移搜索）仍是属性帧间编码的核心设计变量。\n\n**2. 编码范式间增益严重不均衡**\n同条件下，paper:arxiv:2607.03576 的节省幅度从 vs V-PCC 的 16.5% 到 vs G-PCC 的 55.3% 拉开近 4 倍差距，说明视频投影路线（V-PCC）在属性维度已具较强竞争力，几何基方案的优势高度依赖对比对象与内容类型。〔综述推断〕不存在跨内容类型通吃的属性压缩方案，基线选择本身即影响结论量级，评测需多基线并报。\n\n**3. 表示选型之争：高斯泼溅与 INR 的域适配边界**\n稠密连续域中高斯数量逼近像素总数导致表示退化（paper:arxiv:2607.16362），这是对显式泼溅路线在视频/2D 模态的结构性批评；INR 具备压缩、超分、生成式集成三重优势。但条目未涉及 INR 自身的解码串行性、每查询前向计算成本与训练开销——这构成该争论尚未闭合的部分。〔综述推断〕稀疏三维域（点云、粒子流）与稠密连续域（视频、图像）可能走向不同的表示选型。\n\n**4. 通用标准编解码器的实时性鸿沟**\nTMC13 解码速度落后专用方案约 20×，Draco 编码落后约 6×（paper:arxiv:2609.19750，动态点云数据集）。根因在于标准编码器面向通用内容设计，未利用物理模拟数据的结构先验（速度场可预测性、时间相干性）；「亚帧延迟」（单帧时间预算内完成编解码）作为新的硬约束，正把实时粒子流推向专用编码器路线。\n\n**5. 端侧异构部署与多人协作验证方法学**\nApple Vision Pro 与 Web 浏览器算力差异悬殊却需共享同一实时码流（paper:arxiv:2609.19750）；验证手段从客观失真指标扩展为感知质量评估叠加双人协作任务研究，任务级指标（协作交互流畅度）如何标准化仍缺成熟口径。〔综述推断〕\n\n**6. 几何失真与属性压缩的耦合**\npaper:arxiv:2607.03576 需在无损与有损几何两种条件下分别验证，说明几何误差会传导至属性运动补偿环节。〔综述推断〕几何—属性联合率失真优化（而非属性单独优化）是有损链路下尚未解决的技术点。\n\n**7. 压缩管线与上层可编辑性的割裂**\nDELUGE/属性压缩代表传输管线成熟，OmniStyle-INR 代表 4D 内容可编辑能力成形，但二者分属两条技术栈；「INR 即压缩」的端到端管线（传输表示同时即编辑表示）尚无条目覆盖。〔综述推断〕\n\n---\n\n## 四、趋势与展望\n\n1. **时间维度成为压缩增益主战场**：从帧内属性编码转向帧间运动估计（paper:arxiv:2607.03576）与物理速度先验（paper:arxiv:2609.19750），时域冗余消除是本窗口内两个压缩工作的共同增益来源。\n\n2. **内容先验驱动的专用编码器崛起**：DELUGE 证明利用模拟数据速度可预测性可获得 20× 级解码加速（paper:arxiv:2609.19750）。〔综述推断〕仿真—编码协同设计（如以速度场直接作为运动矢量预测源）可能成为物理模拟类沉浸式内容的标配。\n\n3. **表示层按模态分工收敛**：INR 以压缩 + 超分 + 生成式集成的三重优势争取统一表示地位（paper:arxiv:2607.16362），高斯泼溅在稠密连续域受结构性质疑。〔综述推断〕短期更可能形成「稀疏三维域显式表示、稠密连续域隐式表示」的分工格局，而非单一表示通吃。\n\n4. **评测指标体系扩展**：从 MPEG 数据集上的 BD-rate 式码率节省（paper:arxiv:2607.03576），扩展至延迟（亚帧级）、解码吞吐（≈20×）、感知质量与双人协作任务绩效（paper:arxiv:2609.19750）。\n\n5. **落地场景锚定 XR 多人协作**：XR 头显 + 浏览器异构双端、实时手部追踪流体交互（paper:arxiv:2609.19750）显示沉浸式媒体的验证场景正从单机点播转向多用户实时协作。\n\n**语料局限声明**：本综述基于 3 条论文、观测窗口约 3 个月、无版本动态条目，上述趋势为局部切片推断，不宜外推为领域全周期结论。〔综述推断〕\n", "processing_enhancement": "# 处理增强 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 1 条结构化条目 · glm-5.3\n\n# 处理增强（processing_enhancement）领域综述\n\n> **数据截止**：2026-11-13 ｜ **知识库覆盖**：共 1 条条目（`paper:arxiv:2609.33834`），无版本发布动态（repo_release 类条目为 0）。本综述所有结论均以此为限，超出条目覆盖的判断显式标注〔综述推断〕。\n\n## 发展历程\n\n**覆盖形态说明**：截至 2026-11-13，知识库在本领域仅收录一篇论文条目，时间轴呈“单点”形态，无法构建多阶段谱系。以下按可考信息划分。\n\n- **阶段 0（2026-09-27 之前，库内空白）**：无任何条目。仅可从唯一条目的动机陈述反推此阶段的领域痛点：潜空间扩散修复链路中自编码器压缩导致的高频细节损失（`paper:arxiv:2609.33834` 以此为核心设计动机），即“细节保持 vs. 压缩效率”的矛盾在像素域/潜空间两条路线间尚未收敛。〔综述推断〕更早期的方法谱系与路线演化在库内不可考证，不做陈述。\n\n- **阶段 1（2026-09-27，库内唯一里程碑）**：CLIMB-flow 论文发布（`paper:arxiv:2609.33834`），确立“金字塔级联扩散架构 + 像素域由粗到细后验采样”的技术形态，题名表述为“基于多尺度流的耦合线性逆问题后验采样”，在修复、去模糊、超分辨率、加速 MRI 四类逆问题任务上验证。\n\n- **版本里程碑**：**无**。截至 2026-11-13（论文发布后约 1.5 个月），库内未跟踪到任何代码发布、权重发布或版本迭代记录。〔综述推断〕可复现性基础设施（代码/权重/benchmark 脚本）状态在库内为空白，属当前生态短板。\n\n## 技术主线与代表工作\n\n**主线定义**：将图像处理增强类任务统一表述为（耦合）线性逆问题，在多尺度生成先验下执行**后验采样**而非点估计，以“由粗到细 + 尺度内块采样”求解。\n\n**代表工作：CLIMB-flow**（`paper:arxiv:2609.33834`），库内唯一工作，其技术构成：\n\n| 维度 | 内容 | 条目依据 |\n|---|---|---|\n| 问题形式 | 耦合线性逆问题，覆盖修复、去模糊、超分辨率、加速 MRI 四类任务 | `paper:arxiv:2609.33834` |\n| 核心算法 | 每个尺度内交替执行三步：**①终点估计 → ②数据一致性更新 → ③再加噪**，以近似吉布斯采样逼近该尺度后验；尺度间由粗到细级联 | `paper:arxiv:2609.33834` |\n| 重建域 | **像素域**，规避潜空间自编码器压缩导致的细节损失；最大重建分辨率 **512×512** | `paper:arxiv:2609.33834` |\n| 量化结果 | CelebA 上相对最强对比方法 PSNR 增益 **1.37–7.66 dB**（口径：CelebA 数据集、相对最强对比方法） | `paper:arxiv:2609.33834` |\n| 泛化主张 | 单方法跨 4 类逆问题任务 | `paper:arxiv:2609.33834` |\n\n**技术立场**：该工作选择回到像素域、用金字塔级联分摊像素域计算成本，以对抗潜空间压缩伪影——这是库内唯一可考的路线分歧证据（`paper:arxiv:2609.33834`）。\n\n## 当前关键问题\n\n**P1：尺度内吉布斯近似的保真度与理论保证（首要问题）**\n三步交替仅为对每尺度后验吉布斯采样的“近似”（`paper:arxiv:2609.33834`），条目未提供：(a) 各条件步（终点估计/数据一致性更新/再加噪）的具体形式与近似误差界；(b) 内层交替次数与采样质量的经验关系；(c) 收敛性或混合时间保证。若终点估计步引入系统性偏差而再加噪步无法纠偏，方法存在退化为“MAP 式点估计+扰动”的风险，其输出的不确定度（协方差、后验方差）是否可用即存疑。〔综述推断〕\n\n**P2：尺度间不确定度传播机制**\n由粗到细级联中，粗尺度样本作为细尺度条件或初始化时，粗尺度采样误差会在细化中被固化（误差累积/收缩到错误流形）。条目未报告逐尺度消融实验或跨尺度一致性度量。〔综述推断〕\n\n**P3：像素域路线的分辨率天花板与算力代价**\n条目口径明确最大重建分辨率为 512×512（`paper:arxiv:2609.33834`）。像素域选择以算力换细节，512² 以上的注意力/卷积代价如何被金字塔分摊、能否扩展至 1K–2K，条目完全未涉及——该问题决定像素域路线相对潜空间路线的长期竞争力。〔综述推断〕\n\n**P4：评测口径窄且增益高度不均**\nPSNR 增益区间 1.37–7.66 dB 跨度达 **6.29 dB**，说明任务/设置间增益极不均匀，但条目未给出分任务数值，无法定位弱项任务。此外：(a) 该口径绑定 CelebA（人脸域）与“最强对比方法”（对比集合身份在库内不可考）；(b) 感知类指标、非人脸自然图像域的结果缺失；(c) 加速 MRI 任务的量化结果未按同一口径给出——“跨任务泛化”目前仅是任务覆盖层面的主张，缺跨域量化支撑。（前半句区间与口径为条目事实，后半句缺口评估为〔综述推断〕）\n\n**P5：算子线性性限制与跨算子一致性设计**\n方法明确定位于线性逆问题（`paper:arxiv:2609.33834`）；非线性退化（盲模糊核、压缩伪影、传感器非线性）及 A 未知的盲设定未被覆盖。且修复掩码（低秩/结构化）与 MRI Fourier 欠采样（病态性分布迥异）在算子谱性质上差异巨大，数据一致性更新步的步长/正则化如何跨算子统一，条目未讨论。〔综述推断〕\n\n**P6：复现与基线可比性**\n库内无该方法任何代码/权重发布记录（0 条版本动态），被对比的“最强对比方法”亦无条目收录，调参公平性与结果可复现性在库内不可验证。\n\n## 趋势与展望\n\n**库内可证的（单点）信号**：①统一逆问题求解器形态——单算法族覆盖修复/去模糊/SR/MRI 四任务（`paper:arxiv:2609.33834`）；②像素域回潮——以多尺度级联分摊像素域成本、以细节保真换取路线优势；③采样式求解——输出后验分布而非点估计。\n\n**〔综述推断〕展望方向**：\n1. **效率化**：少步采样/蒸馏以压缩像素域成本，冲击 512×512 分辨率上限；\n2. **理论化**：为“三步交替 ≈ 吉布斯采样”补收敛性与误差界，明确其与引导类/一致性类扩散逆问题求解器的关系；\n3. **问题类扩展**：线性 → 非线性与盲逆问题，需重设计数据一致性步的算子处理方式；\n4. **评测扩展**：跨域（人脸 → 通用自然图像 → 医学影像）验证、感知指标、分任务报告，压缩 6.29 dB 的增益方差；\n5. **生态化**：代码/权重/benchmark 发布，弥补库内零版本动态的空白。\n\n**〔综述推断〕风险提示**：本领域当前知识密度为单条目，上述“趋势”实质是单点外推；随条目扩充（尤其同类方法与版本动态入库），本综述的时间轴、路线对比与问题清单需整体重估。\n", "quality_assessment": "# 质量评估 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 2 条结构化条目 · glm-5.3\n\n# 质量评估（quality_assessment）领域综述\n\n**数据基础声明**：截至 2026-11-13，知识库共收录 2 条条目（paper:arxiv:2607.23321、paper:arxiv:2609.25423），时间跨度 2026-07 至 2026-09，**无 repo_release 版本动态条目**。以下综述严格以条目为据；条目未覆盖的背景性判断均标注〔综述推断〕。\n\n---\n\n## 一、发展历程\n\n**覆盖范围说明**：本批条目不含工具/基准的版本发布记录，无法从条目内重建长时段领域史与版本里程碑，故以论文级里程碑替代；2026-07 之前的领域脉络描述均为〔综述推断〕（PSNR/SSIM 家族长期作为全参考客观指标的事实可由条目间接印证——两篇工作均以其为评估锚点，但具体演化史条目未载）。\n\n**阶段一（2026-07）：成像端——单帧 ISP 流水线无参考评估范式的确立**\npaper:arxiv:2607.23321 提出代理参考（proxy reference）框架：从处理后单帧 sRGB 图像与 ISO 元数据预测代理参考图，再据此无参考估计 PSNR/SSIM/LPIPS，用于评估相机 ISP 流水线。三项论文级里程碑：(1) 代理参考路线在指标值估计上优于直接指标回归；(2) 与全参考排名的一致性高于常规盲 IQA 方法；(3) 引入 LoRA 轻量微调应对 ISP 组件或流水线配置变更。同时确立“仅合成数据训练 → 泛化到真实相机数据”的训练范式。\n\n**阶段二（2026-09）：传输端——真实 5G 测试床上的全参考视频质量测量**\npaper:arxiv:2609.25423 将客观质量评估置于开源 5G FWA OTT 交付场景：在**真实测试床（非仿真）**上经 MPEG-DASH 交付 4K 视频，以 PSNR/SSIM/VMAF 全参考指标实现网络性能与视觉体验的**帧级关联**，受控变量覆盖 SISO/MIMO、调制方式（含 256-QAM）与并发用户负载。\n\n〔综述推断〕两条主线并非同一谱系的先后演进，而是分别对应“成像端图像质量”与“传输端视频质量”两条评估链路；条目不足以判断二者存在方法层面的直接继承关系。\n\n---\n\n## 二、技术主线与代表工作\n\n| 维度 | 主线 A：ISP 图像质量评估 | 主线 B：5G 传输视频质量评估 |\n|---|---|---|\n| 代表工作 | paper:arxiv:2607.23321 | paper:arxiv:2609.25423 |\n| 评估对象 | 相机 ISP 流水线 | 5G FWA 网络 OTT 视频交付 |\n| 参考可用性 | 无参考（预测代理参考图） | 全参考（实测） |\n| 指标 | PSNR/SSIM/LPIPS（估计值） | PSNR/SSIM/VMAF |\n| 输入数据 | 单帧 sRGB 图 + ISO 元数据 | 4K DASH 视频，帧级序列 |\n| 关键变量 | ISP 组件/流水线配置 | SISO/MIMO × 调制方式 × 并发用户数 |\n| 泛化/适配机制 | 合成→真实泛化；LoRA 适配 | 真实测试床实测 |\n\n**主线 A 的技术路线**（paper:arxiv:2607.23321）：核心思想是把“盲回归指标”改写为“重建伪参考 + 计算全参考指标”，使无参考评估继承全参考指标的物理语义；三条实证结论为——估计精度优于直接回归、全参考排名一致性优于常规盲 IQA、合成数据训练即可泛化至真实相机数据；适配层面以 LoRA 微调处理流水线变更，避免全量重训。\n\n**主线 B 的技术路线**（paper:arxiv:2609.25423）：以真实开源 5G FWA 测试床为实验载体，量化网络配置对体验质量的影响，两条核心结论：(1) MIMO 传输模式在吞吐量与视觉质量上整体持续优于 SISO，用户负载增加时仍保持更高吞吐与更优画质；(2) 在 5 个并发用户负载下，MIMO+256-QAM 的 VMAF 仍高于视觉无损阈值（条目摘要未给出阈值具体数值），SISO 则出现显著质量退化。条目口径将“5 并发用户”标注为 MIMO+256-QAM 维持视觉无损 VMAF 的**负载上限**（该上限为实验观测边界，非失效点）。\n\n---\n\n## 三、当前关键问题\n\n**3.1 代理参考的保真度构成估计精度上界（主线 A）**\n- paper:arxiv:2607.23321 的精度以代理参考图逼近真参考的程度为上界；当 ISP 造成的信息损失无法从 sRGB+ISO 单观测恢复时，代理参考偏差直接传导至 PSNR/SSIM/LPIPS 估计误差。〔综述推断〕条目未给出代理参考与真参考的像素级/感知级偏差分布，该上界目前无量化刻画。\n- 条目仅给出“优于直接回归”“排名一致性更高”的定性结论，未披露一致性数值口径（如 SRCC 具体值），导致跨工作不可比。\n\n**3.2 域差距与适配成本的结构性张力（主线 A）**\n- “仅合成数据训练并泛化到真实相机”成立的同时，ISP 组件/流水线配置变更仍需 LoRA 微调（paper:arxiv:2607.23321）——即配置变更构成分布偏移，**零样本跨配置能力未被主张**，适配成本只是被降低而非消除。\n- 单帧设定：条目明确为“单帧 ISP 流水线评估”，时域降噪、帧间一致性等时域处理不在评估范围内；〔综述推断〕视频 ISP 场景需要时域质量维度，现有框架需扩展。\n- 输入依赖 ISO 元数据；〔综述推断〕元数据缺失场景的鲁棒性是落地关键点，条目未覆盖。\n\n**3.3 全参考方法在网场景的可扩展性受限（主线 B）**\n- 帧级 PSNR/SSIM/VMAF 需参考与失真序列精确对齐，适用于 paper:arxiv:2609.25423 这类测试床离线测量；〔综述推断〕在线实时 QoE 监控仍依赖无参考方法，条目未涉及。\n- “视觉无损阈值”作为判据被使用但未给出 VMAF 数值（条目口径：摘要未给出具体数值）；且 5 并发用户为实验观测的负载上限，**超过 5 用户的行为未被测量**，不能外推为系统容量结论。\n- 变量覆盖不全：条目未涉及信道条件（SNR/干扰）、移动性以及 ABR 码率自适应逻辑的影响。〔综述推断〕DASH 场景下 ABR 决策与网络波动深度耦合，忽略 ABR 会系统性低估端到端质量动态。\n\n**3.4 两条主线指标体系割裂**\n- 主线 A 使用 LPIPS（感知类）而主线 B 使用 VMAF，LPIPS 与 VMAF 无交叉验证；公共锚点仅 PSNR/SSIM。〔综述推断〕成像端与传输端评估语言不统一，阻碍“成像—压缩—传输”全链路联合优化；两项工作亦均未涉及面向新型失真（AI 压缩伪影、生成内容）的指标。\n\n**3.5 “合成—真实”关系的立场分歧与基准缺位**\n- 主线 A 主张“合成数据训练、真实数据泛化”，主线 B 则明确**拒绝仿真、坚持真实测试床评估**——两线对合成数据可信度的立场相反。〔综述推断〕如何构建“训练侧可扩展的合成管线 + 评估侧可信的真实基准”的配套体系，是两条主线的共性难题；本批条目均未附带公开基准或工具发布（无 repo_release 条目），可复现性支撑不足。\n\n---\n\n## 四、趋势与展望\n\n1. **代理参考范式外溢**：〔综述推断〕“生成代理参考 + 全参考指标计算”有望从单帧 ISP 扩展至视频时域评估与传输失真评估，弥合成像端与传输端盲评估的方法鸿沟。\n2. **质量模型进入持续适配周期**：LoRA 级微调应对流水线配置变更（paper:arxiv:2607.23321）预示质量模型从“一次性训练”转向“随 ISP 版本迭代的轻量适配链”；〔综述推断〕后续或出现质量模型与 ISP 版本协同发布的工程形态——本知识库尚无版本动态条目可验证。\n3. **sim2real 训练策略固化**：仅合成数据学习并泛化至真实相机的实证（paper:arxiv:2607.23321）将推动可控失真合成管线的标准化，降低标注成本。\n4. **真实测试床成为网络 QoE 研究的默认方法论**：paper:arxiv:2609.25423 的“真实 5G 测试床 + 帧级网络 KPI—VMAF 关联”范式预计被复制扩展；〔综述推断〕自然后续是超出 5 并发用户的压力测试边界、更多调制阶数与移动性场景的补充测量。\n5. **阈值与口径标准化需求凸显**：视觉无损 VMAF 阈值数值、排名一致性指标的口径、失真合成的规范，均需社区统一，否则跨工作结论不可比（基于两篇条目均存在口径缺失的事实，〔综述推断〕此为领域级痛点）。\n6. **知识库观测缺口**：2026-07 之前与 2026-09-21 之后本领域无新条目；〔综述推断〕需持续追踪 ISP 评估基准、5G/6G QoE 测试床两条线的后续论文及工具版本发布，方可确认上述趋势的持续性。\n", "self_improvement": "# 自我改进 AI（RSI/EoH） · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 46 条结构化条目 · glm-5.3\n\n# 自我改进 AI（RSI / EoH）领域综述\n\n> **语料口径**：基于知识库截至 2026-11-13 的全部 46 条条目，均为 arXiv 论文（本窗口内无 repo_release 类版本动态），发表时间集中于 2026-09-27 至 2026-11-09 约 6 周。所有量化结论保留条目原始口径；超出条目直接陈述的判断标注〔综述推断〕。\n\n---\n\n## 一、发展历程\n\n本库 46 条全部落在约六周窗口内（约 10 篇/周→约 20 篇/三周），呈现明显的加速曲线，说明该方向处于爆发期而非成熟期。更早的谱系仅能从条目内基线引用间接确认：PRECOCIAL 以 FunSearch/AlphaEvolve 为对照（paper:arxiv:2610.24970）、HarnessPro 以 RHO 为对照（paper:arxiv:2610.26770）、SkillDuet 以 SEED-API 为基线（paper:arxiv:2611.12109）、AReaL-RSI 以 Codex-Goal 为对照（paper:arxiv:2610.18083），即窗口之前已存在演化式程序搜索与 harness 优化方法系〔综述推断：谱系存在，细节不在本库覆盖范围〕。窗口内的演化可分三阶段。\n\n### 阶段一（2026-09-27 — 10-08，10 篇）：技能—记忆—验证三原语系统化\n\n确立「冻结 LLM + 外部可改进工件」的主导范式，并把**验证**与**信用分配**首次提升为一等技术问题：\n\n- **递归技能演化**：R² Flow 以共享编排图上的策略学习—独立验证—版本化技能库更新交替推进，用对反向策略不变的 flow-share 读出与有符号效用排序修正「非负 flow 信用将高频使用误当收益」的偏差（paper:arxiv:2609.33867）。\n- **成本感知路由与领域记忆**：RSI-Router 演化子任务级路由+模型专属技能，推理成本占比 48.3% 仍全面超越纯 DeepSeek-V4.1-Flash 基线（paper:arxiv:2609.34712）；SAGE 以采用感知效用估计（ATU）与效用门控固化（UGC）在 NPUKernelBench 上取得 95.5% 执行率（最强受控基线 84.1%）（paper:arxiv:2609.35568）。\n- **多智能体 RSI 与崩溃修复**：CollabFlow 提出证据条件通信（ECC）与协作轨迹平衡（CTB）流式目标，并给出 CTB 自生成目标轮间移动量的理论上界（paper:arxiv:2609.38662）；ReSAIL 针对迭代自蒸馏的性能崩溃，末轮成功率平均绝对提升 22.5%（paper:arxiv:2609.39306）。\n- **验证器智能体化**：VeriHarness 将 LLM 改造为带工作区与证据工具的验证器，并发布 5 基准×2 模型、约 26,000 条 rollout（成本超 10 万美元）的数据池（paper:arxiv:2610.00972）。\n- **免训练门控**：SAG 用动作级模糊性（全局熵+top-2 间距）近似批评的信息价值，7B+3B≈无批评 14B（paper:arxiv:2610.07335）。\n- **能力里程碑与负结果探针同日出现**：Memento 3 在 ARC-AGI-3 上以自然语言规则手册通关 25/25 个公开游戏全部关卡（RHAE 100.0，动作数为人类 44%；Pong 21:0 且不再调用 LLM）（paper:arxiv:2610.11794）；DataSense-Bench 则测得前沿代理的「数据直觉」相对随机选择收益有限（paper:arxiv:2610.12190）。参数化记忆综述同窗口将 RSI 列为该领域开放方向（paper:arxiv:2610.08630）。\n\n### 阶段二（2026-10-09 — 10-19，16 篇）：Harness 层递归成型与改进对象扩散\n\n改进对象从上下文扩展到 harness、世界模型、数据程序、内核与具身技能；性能—成本帕累托意识成型；出现对 LLM 预测能力的定量上界测量：\n\n- **Harness 递归**：Harness² 提出任务级（对比式 Propose-Probe-Compose，无需真值验证器）+框架级双层递归，单步递归即在三项专业基准上取得 4.5—11.8 分提升（paper:arxiv:2610.14224）；RSIFlow 以自适应工作流编排+元代理 harness 演化在 6 基准×2 骨干上全 SOTA（paper:arxiv:2610.21791）；HarnessPro 以无标签帕累托优化产出 lite/medium/heavy 三档（paper:arxiv:2610.26770）。\n- **改进对象外移**：D-World 显式将 RSI 定义为「LLM 冻结、可执行数字孪生持续被改进」的双控制问题，局部参数修正把渲染深度残差从 22.4\n", "video_image_coding": "# 视频/图像编码 · 领域综述\n\n> 引擎合成 · 数据截止 2026-11-13 · 基于 125 条结构化条目 · glm-5.3\n\n# 视频/图像编码领域综述\n\n> 数据基础：截至 2026-11-13 共 125 条条目，其中 49 条版本动态覆盖 2016–2026 年主流开源编解码器（Kvazaar/dav1d/VVenC/VVDec/libavif/SVT-AV1），76 篇论文全部集中于 2026 年，后者导致研究侧视角存在时间偏置，本综述已据此控制推断范围。\n\n---\n\n## 一、发展历程\n\n### 阶段一（2016–2020）：HEVC 开源编码器工程化成熟与 AV1 解码奠基\n\n- Kvazaar v1.0.0 完成首个里程碑：全部预设经率失真-复杂度搜索重优化，veryslow 平均加速 12.42×（官方口径约 10×），相比 v0.8.3 的 3-fr 档全序列 BD-rate 降 31.0%（QP 17/22/27/32），并引入无损编码、单色、--crypto 选择性加密、--tmpv 等特性，默认启用 WPP 多线程（repo_release:github:kvazaar-v1.0.0）。\n- v1.1.0 将码控下沉到 LCU 级并新增 --roi（LCU 级 delta-QP），BD 码率再降 0.5%–1.7%（repo_release:github:kvazaar-v1.1.0）；v1.2.0 全预设提速 1.19–1.28×、快速档 BD-Bitrate 最多降 14.80%，引入帧内预测模式加密与面向 360° ERP 的 --erp-aqp（repo_release:github:kvazaar-v1.2.0）。\n- dav1d 0.1.0（2018-12）作为首个正式版 AV1 解码器，支持全部 AV1 特性、8–12 bit 全位深与全部色度子采样，并携带 AVX-2/SSSE3/NEON 汇编（repo_release:github:dav1d-0.1.0）。\n- v1.3.0 以复杂度换效率：0-uf 档 BD-Bitrate −22.7% 但 8-vs 档速度降至 0.35×，新增 SSD 度量 CU 决策、低延迟 B 帧 GOP 与 AVX2 优化（repo_release:github:kvazaar-v1.3.0）；v2.0.0 引入 OBA 码控、VAQ 与基于机器学习的 --ml-pu-depth-intra，BD-Bitrate 较 v1.3 降 15.4%–31.1%（个别组合 hevc-D@2-vf 达 −37.4%）（repo_release:github:kvazaar-v2.0.0）。\n\n### 阶段二（2021–2023）：VVC 软件生态起步与许可证/架构调整\n\n- Kvazaar v2.1.0 将许可证由 LGPL2.1 改为 3-Clause BSD，并加入插值滤波器 AVX2 实现与 Y4M 输入（repo_release:github:kvazaar-v2.1.0）；v2.2.0 支持 ROI 逐帧映射、在运动搜索中更新 CABAC 上下文以提升比特代价估计精度，8-vs 档 BD-rate 降 5.6%（repo_release:github:kvazaar-v2.2.0）。\n- VVDec 2.1.x 系列（2023）引入首批原生 ARM SIMD 解码优化并完成 CU=PU 结构重构与 RPL 管理重构，随后连续修复 RASL 跳过、RPR 越界读取、RPR 填充过量等缺陷（repo_release:github:vvdec-v2.1.0; repo_release:github:vvdec-v2.1.2; repo_release:github:vvdec-v2.1.3）。\n\n### 阶段三（2024–2025）：VVC 编解码器功能补全与 AVIF HDR 生态成型\n\n- VVDec 2.2.0 修复线程池死锁、解除 64 线程限制，并经 simd-everywhere 启用 AVX2→NEON 转译（repo_release:github:vvdec-v2.2.0）；VVenC 1.12.0 新增封顶恒定质量模式 CQF（固定 QP + QPA + 最大码率约束）与自动多线程配置，faster 档提速约 5%（repo_release:github:vvenc-v1.12.0）。\n- VVDec 3.0.0 做出破坏性 API 变更（与 1.x/2.x ABI 不兼容），新增胶片颗粒支持并从 VVenC 移植 ARM SIMD（repo_release:github:vvdec-v3.0.0）；VVenC 1.12.1 将 VUI 标志对齐 DVB 规范（repo_release:github:vvenc-v1.12.1）；1.13.0 引入 ARM 优化、DASH 优化的 idr_no_radl 刷新模式与 GOP 自适应 QP 级联，medium 预设提速 5%（repo_release:github:vvenc-v1.13.0）；1.13.1 将 x86 最低指令集提升至 SSE 4.1（repo_release:github:vvenc-v1.13.1）。\n- libavif 从 1.1.0 的实验性增益图与分层 AVIF（--layered，Chrome 94+ 可渐进渲染）（repo_release:github:libavif-v1.1.0），到 1.1.1 对齐 ISO 21496-1 草案（repo_release:github:libavif-v1.1.1），再到 1.2.0 正式启用增益图 API、支持 YCgCo_Re/Ro 并以 quality 系列参数取代 min/maxQuantizer（repo_release:github:libavif-v1.2.0），1.3.0 默认自动 tiling 并禁用 MC=identity+YUV400 组合以符合 AV1 规范（repo_release:github:libavif-v1.3.0）。\n- Kvazaar 2.3.x 以 SIMD 优化为主（RDOQ AVX2 提速 1–3%（repo_release:github:kvazaar-v2.3.0）、帧内角度预测 AVX2 提速 1–5%（repo_release:github:kvazaar-v2.3.1)），2.3.2 修复 10-bit 与 SMP/AMP 代价计算错误后 veryslow 档较 2.3.1 BD-BR(PSNR) 降 2.7%（速度 0.77×）（repo_release:github:kvazaar-v2.3.2）；VVDec 3.1.0 新增 Loongarch 支持与 userData API（repo_release:github:vvdec-v3.1.0）。\n\n### 阶段四（2026）：标准软件大版本连发与神经/生成式编码研究爆发\n\n- VVenC 1.14.0 完成 NEON/SVE 大规模优化（硬件支持时默认启用 SVE），弃用 LMCS 并将 cts/dts 改为有符号整数（repo_release:github:vvenc-v1.14.0）；VVDec 3.2.0 补齐 NEON-RDM/SVE/SVE2 并引入 libfuzzer 模糊测试基础设施（repo_release:github:vvdec-v3.2.0），3.2.1 修复五个安全漏洞（含 use-after-free、堆溢出）（repo_release:github:vvdec-v3.2.1）。\n- libavif 1.4.x 支持 AVIF 规范 v1.2 的 Sample Transform 与 Apple 风格增益图 JPEG，编码调优切换到 AOM_TUNE_IQ（repo_release:github:libavif-v1.4.0），1.4.1 将渐进式/分层编码转正（repo_release:github:libavif-v1.4.1）。\n- SVT-AV1 在 2026-10-25 至 11-02 密集发布 9 个版本：3.1.0 新增 --rtc 模式（RTC 场景 BD-Rate 改善约 5–10%）与随机接入 S-Frame，RA 模式 M1–M5 同质量提速约 15–25%（repo_release:github:SVT-AV1-v3.1.0）；4.0.0 做破坏性 API 更新（CRF 扩展至 70、四分之一粒度步进），AVIF/静图模式提速约 5–8 倍并完成 PSY 特性向 --tune vq/iq 的移植（含 AC Bias）（repo_release:github:SVT-AV1-v4.0.0）；4.2.0 新增 TUNE-VMAF 模式（目标约 15% VMAF BD-rate 改进）、RTC CBR 码控（卡尔曼滤波 QP 估计）与 LTR 参考管理 API（repo_release:github:SVT-AV1-v4.2.0）；4.3.0 全 preset 效率再提升 5–8%，新增 --fast-decode 3（RD 代价引入解码复杂度项）与胶片颗粒 API（repo_release:github:SVT-AV1-v4.3.0）。\n- 论文侧 76 篇全部出现在 2026 年，覆盖 AV2 标准工具与 CTC 评测（paper:arxiv:2601.02712; paper:arxiv:2605.15800）、学习式图像/视频压缩、生成式压缩、INR 编码、跨平台部署与编码-跨域应用，形成与工程侧并行的密集创新期。\n\n---\n\n## 二、技术主线与代表工作\n\n### 主线一：混合编码标准软件的工程优化\n\n沿「预设调优 → SIMD 纵深 → 码控/心理视觉精细化 → 场景特化」演进：Kvazaar 各版本以 BD-rate/速度的量化推进（见第一节）；SIMD 覆盖从 AVX2/SSSE3/NEON（repo_release:github:dav1d-0.1.0）扩展到 SVE/SVE2/NEON-RDM（repo_release:github:vvdec-v3.2.0）乃至 Loongarch（repo_release:github:vvdec-v3.1.0）；码控从 LCU 级（repo_release:github:kvazaar-v1.1.0）发展到 OBA/VAQ（repo_release:github:kvazaar-v2.0.0）、CQF（repo_release:github:vvenc-v1.12.0）与卡尔曼 QP 估计的 RTC CBR（repo_release:github:SVT-AV1-v4.2.0）；SVT-AV1 4.x 将心理视觉（AC Bias、variance boost）与解码复杂度感知模式决策（--fast-decode 3）纳入主线（repo_release:github:SVT-AV1-v4.0.0; repo_release:github:SVT-AV1-v4.3.0）。\n\n### 主线二：标准编码工具设计与工具级加速\n\n- AV2 在变换与熵编码层重设计：新增 IST、TCQ、ATC、PARA、FSC、CCTX、PH 并改进无损编码，在较低复杂度下实现显著增益（paper:arxiv:2601.02712）；AV2 CTC 实测随机访问下 AV2（v13.0）较 AV1 基准 PSNR-YUV BD-rate −29.81%、VMAF −33.79%，并新增凸包自适应流、UGC、扩展色度格式评估（paper:arxiv:2605.15800）。\n- 工具级加速：FaSST 以 Givens 旋转分解替代 LFNST，RD 持平下计算量减 83.67%，最优情形 BD-rate 再省 1.80%（paper:arxiv:2605.15086）；MMVD 用 2-tap 滤波器差分将候选判决降为一次残差-梯度内积，fast 档以 −0.35% BD-rate 换 2.23% 时间节省，η 从 11.79 降至 7.10（paper:arxiv:2606.31084）；多项式图滤波器使 ECM ALF 固定滤波器数量减少一个数量级且性能相当（paper:arxiv:2607.04985）。\n- 学习式工具进入标准：RDOSkip 的时域跳过决策被进行中的 AVS NVC 标准采纳并集成参考软件，AVS/HEVC 数据集分别省 0.90%/1.29% BD-rate，推理即用、无需训练（paper:arxiv:2611.00181）。\n\n### 主线三：学习式图像压缩（LIC）\n\n- 熵建模：HiDE 全局-局部双字典级联检索较 VTM-12.1 省 18.5%（Kodak）/24.01%（Tecnick）BD-rate（paper:arxiv:2603.06766）；ChWDTA 通道级小波域注意力八切片配置较锚点最多 −22.56%（Tecnick）（paper:arxiv:2606.00111）；ARCHE 统一分层/空间/通道先验，Kodak 上较 VVC Intra 约 −5%，参数量 95M、单图 222ms（paper:arxiv:2603.10188）；EF-LIC 以无约束向量量化+上下文自回归变换取消熵编码，编码提速 >3×、解码 >5×（paper:arxiv:2605.23323）；BLI 将渐进编码重构为区间收缩序贯推断，较 DPICT 降 17.78% BD-rate 且参数量为 CTC 的 1/5.3（paper:arxiv:2610.30966）。\n- 复杂度与变码率：空间竞争多编解码器选择在 1433 MACs/像素达到 HEVC 水平（paper:arxiv:2605.13243）；通道掩码使单一 VBR 模型替代 40 个独立模型，存储缩减 14.8–15.9×（paper:arxiv:2610.27037）；训练配方上，编码器输入注入高斯噪声的噪声正则化带来跨骨干一致增益（ELIC −2.60%，DMCI-Large 相对 VTM-22.0 达 −22.02%）（paper:arxiv:2611.10073）。\n\n### 主线四：学习式视频压缩（NVC）\n\nUni-LVC 以跨注意力适配与可靠性感知分类器实现单模型统一帧内/帧间、低延迟/随机访问（paper:arxiv:2603.05756）；码控方面，log 域 PI/PID + 双分支 GRU 在 DCVC 上实现 2.13% 平均码率误差与 5.69% BD-rate 改善（paper:arxiv:2604.20104）；加速与部署方面，KD-NVC 搜索-蒸馏实现 RTX 5060 上 1080p 69FPS 解码且 RD 接近 VTM-LDB（paper:arxiv:2606.04595），JOMP 混合精度整数化在 RD 对标 DCVC-FM 下位操作减 87.6%（paper:arxiv:2606.13110），MLVC 通过 Scale Sending 与 ReLU 系约束首次在 Apple/Intel/Qualcomm NPU 上 100 FPS 跑通神经视频编码，跨平台 TH XP 口径较 HEVC-QSV BD-rate −58.7%（paper:arxiv:2606.28027）；容错方面，ReLViC 以分散打包与双用途 Transformer 在严重丢包下优于 RS-FEC 保护的 H.265 与 GRACE（paper:arxiv:2608.30202）；ENVC 用事件流引导运动先验，相对 DCMVC 六基准平均 LPIPS 口径 BD-rate −67.63%（paper:arxiv:2610.02265）。\n\n### 主线五：生成式压缩与生成先验\n\n一步扩散方向：YODA 以时域参考多尺度特征 + 线性 DiT 一步去噪取得四个感知指标 SOTA（paper:arxiv:2601.01141）；DiffCR 两步解码相对 SOTA 扩散基线 LPIPS 口径省 27.2%、PSNR 口径省 65.1%，解码加速超 10×（paper:arxiv:2601.10373）。从零训练方向：GenVC 用自适应得分蒸馏修复 DMD 蒸馏的运动停滞，较 GLVC 匹配 LPIPS 省码率 62.5%（478M 参数、A100 上 1080p 15.1fps 单步解码）（paper:arxiv:2607.22772）。免训练方向：ZeroGVC 以码本噪声原子索引+系数引导预训练自回归视频扩散，A800 上 5–10 FPS（paper:arxiv:2606.22371）；实时方向：ReGenVC 将 77 帧说话人视频压至约 26 kB（x264/x265 需 250–280 kB），8-GPU 节点 24fps 实时、窗口延迟 972 ms（paper:arxiv:2607.28144）。生成先验复用方向：Gen2-IC 经潜空间传输桥接四个预训练生成骨干（paper:arxiv:2606.21030）；Gen2-VC 以仅训练于 DCVC-UF 的 LoRA 适配器免重训提升 DCVC-RT/ECM/VTM/HM，匹配 LPIPS 下较 VTM-23.0 平均省码率 86.65%（paper:arxiv:2609.34725）；DiV-INR 在 <0.05 bpp 极低码率相对 HEVC 取得 BD-LPIPS 0.214 的提升（paper:arxiv:2604.08329）；DCIC 以幂等约束与双衰减因子 (K_D, K_P) 实现单码流内失真-感知 Pareto 前沿连续导航（paper:arxiv:2606.13366）。\n\n### 主线六：INR/过拟合式编码\n\nN-O Cool-chic 用编码器网络绕过逐图过拟合，编码复杂度降低 1000 倍、解码端约 2000 次乘法/像素即达 VVC 相当性能（paper:arxiv:2607.13723）；LANCE 为 Cool-Chic 引入前向传输空间超先验实现熵模型区域自适应（Kodak 降 1.40%–2.41%）（paper:arxiv:2605.20672）；NVRC++ 将表达负担转移到高分辨率 feature grid（grid 参数 0.35M→100.06M、MAC/pixel 87.3→24.8、解码 35.5→162.9 FPS），S1–S4 四档复杂度单配置覆盖全码率区间（paper:arxiv:2606.28163）；S-NVRC 单一嵌入码流同时支持码率与解码复杂度可扩展，较 SHM-12.4 省 43.7%、较多层 VTM-20.0 省 5.6%（paper:arxiv:2609.04273）；NeR-SC 面向屏幕内容以可学习调色板与零开销帧跳过在低码率超越 H.264/H.265（paper:arxiv:2605.27024）；PIC 将静态场景短期时变重释为正向激励噪声，0.009% 压缩率实现视觉无损（DCVC-FM 需高 20.5% 码率）（paper:arxiv:2603.06095）。\n\n### 主线七：感知/任务驱动的 RDO 与码率分配\n\n- 指标进 RDO：LNRM 将无参考指标集成化并加梯度平滑，在 AVC 与 Cool-chic 上跨指标一致省码率且不增解码复杂度（paper:arxiv:2602.15779）；Mamba 感知损失嵌入 DCVC/HiNeRV RDO 分别省 8.46%/12.89% BD-rate（paper:arxiv:2603.25566）；IDQD 以随机 Hessian 估计二次化 FR-IQA，VVC 上五种目标度量 BD-rate 省 14.2%–36.7%（编码端开销 10–30%，解码器不变）（paper:arxiv:2609.30077）。\n- 神经→传统迁移：DCVC-FM 隐式感知重要性导出块级 QP 图，不改解码语法下较 VTM-23.0 省 8.37% MS-SSIM 码率（paper:arxiv:2608.07799）；可微 H.264 代理驱动的自适应量化使语义分割任务 BD-rate 最高降 17.12%（paper:arxiv:2607.10478）。\n- 面向机器：WA-RDO 以包装器感知加权 SSE 让 HEVC 级联 FCM 追平 VVC 级最优方法（paper:arxiv:2601.22070）；MT-JRD 数据集（27,264 条标注）+ AMT-JRD 预测实现三任务 BD-mAP 较 VVC +3.861%（paper:arxiv:2604.09421）；OASIS 闭环任务反馈实现 6× 压缩、链路功耗降 5.8×、任务退化 ≤1.5%（paper:arxiv:2609.15749）。\n\n### 主线八：系统、流媒体与跨域编码\n\n码率阶梯：JQT-PF 帕累托前沿在同 XPSNR 下较固定梯子省 11.76% 码率（激进配置 27.88%）（paper:arxiv:2601.10607），DQ-Ladder 深度强化学习阶梯较 Apple HLS 至少省 10.3% XPSNR BD-rate 且解码时间减 22%（paper:arxiv:2603.13597）；主观评测方面 LCEVC（LTM 8.1）增强层叠加 VVC 基础层的 UHD DCR 测试覆盖约 10%/50% 两个增强层码率工作点（paper:arxiv:2601.10448）；中间码方向 HLC 无数据依赖调色板在 4K@120fps 同吞吐下 LUT 资源仅为 JPEG-XS 一半、文字内容 BD-PSNR +5.312dB（paper:arxiv:2603.29864）；体积视频方向 Blackwell GPU 四路分帧 8K 10-bit 4:2:2 HEVC 达 122 fps（SFE 代价 ≤5% BD-rate）（paper:arxiv:2606.29179）；3D 资产方向复用 AV1 运动矢量使 SfM 点云密度最高 8×、3DGS 训练时间减 63%（paper:arxiv:2605.14629）、多尺度 2DGS 实现极低码率 4K 视频实时压缩（paper:arxiv:2609.14129）、双阶段 Morton 排序提升 3DGS 投影编码效率（paper:arxiv:2609.29041）；模型权重方向 LLMCodec 以仿射量化+VVC 在 LLaMA-3-8B 2-bit 下困惑度降低超 1.5 倍、下游准确率提升 21%（paper:arxiv:2606.05861）；语义通信方向 PVSC 免运动矢量传输，较 VTM+5G LDPC 基线最高省约 75%（LPIPS）/87%（DISTS）带宽且单卡 RTX 4090 实时（paper:arxiv:2605.19397）。\n\n---\n\n## 三、当前关键问题\n\n### 1. 压缩效率与复杂度的剪刀差持续存在，且加速方法「寿命」短\n\nVVC 较 HEVC 同等视觉质量省 40–50% 码率，但复杂度增长主要源自 QTMTT 划分组合爆炸；划分加速方法需随 VTM 内部启发式变化（如快速划分决策更新）持续再适配，跨多 VTM 配置与版本评估权衡本身就是挑战（paper:arxiv:2605.21526）。具体加速点的收益边界也很清晰：HFViT 帧内划分预测相对 ETH-CNN 的 VMAF BD-rate 损失改善在不同序列类间差异巨大（Class A −2.4pp vs Class E −7.9pp）（paper:arxiv:2605.29063）；MMVD 加速中经典快速算法（+Fast123）以 −0.64% BD-rate 换 21.10% 时间，而滤波器差分近似方法用 −0.35% 只换 2.23%，揭示「低损失区间内不同方法的收益曲线差异显著、需以 η 类效率-复杂度比度量」（paper:arxiv:2606.31084）。ECM 的细粒度梯度分类 ALF 滤波器数量膨胀亦需数量级压缩（paper:arxiv:2607.04985）。\n\n### 2. 神经编解码的解码端数值确定性是部署的第一性问题\n\nMLVC 明确定位了核心障碍：熵解码要求两端逐位一致的概率分布，而不同厂商 NPU 浮点/整数运算无法逐位复现，一个 index 错位即级联灾难性失败（DCVC-RT 在 Apple 编/Intel 解场景完全崩溃）；其 Scale Sending 将 σ 转为由 hyperlatent 显式导出（结构化共享压缩约 128×）并提供硬保证，同时以 ReLU 系激活（Apple NE 仅 ReLU/LeakyReLU 零误差）+LTR 恢复帧 + 定期 I 帧硬同步压制漂移（paper:arxiv:2606.28027）。JOMP 从训练侧构建完整整数化流水线实现确定性解码（paper:arxiv:2606.13110）；TinyLIC 部署综述将整数精度推理、跨平台一致性、变码率与标准化互操作并列为关键系统级扩展方向（paper:arxiv:2610.22421）；VQ-LIC 在 FPGA 上以 RTL 确定性周期延迟模型将部署延迟预测误差压到 0.26%/0.05%（paper:arxiv:2609.29727）。该问题尚未有跨 NVC 模型族的通用解法。\n\n### 3. 单模型多工作点（变码率/变复杂度/多模式）仍未统一\n\n现状是分头解决：变码率有 λ 连续控制 + log 域闭环（码率误差 2.13%–2.24%）（paper:arxiv:2604.20104）与通道掩码窄模型（替代 40 模型）（paper:arxiv:2610.27037）；变复杂度有 S-NVRC 的码率+复杂度双可扩展嵌入码流（paper:arxiv:2609.04273）与 NVRC++ 固定复杂度分档（paper:arxiv:2606.28163）；模式统一有 Uni-LVC 的帧内/帧间/低延迟/随机访问单模型（paper:arxiv:2603.05756）；质量跨度有 InnVC 单架构覆盖 >20 dB PSNR 范围（paper:arxiv:2606.13957）。但「一个模型同时覆盖全部维度」的方案在条目中不存在〔综述推断：这仍是开放组合问题〕。\n\n### 4. 生成式压缩的可控性与可信性\n\n- 权衡导航刚起步：DCIC 的 (K_D, K_P) 双衰减因子实现单比特流内保真-真实感连续调节，但其幂等约束只是分布感知要求的「可处理代理」而非等价物（paper:arxiv:2606.13366）。\n- 动力学失真：直接 DMD 蒸馏使学生趋向运动停滞，源于学生扰动离开冻结教师训练区域后引导失效的自我强化回路，需按真值方向对齐度门控更新（paper:arxiv:2607.22772）。\n- 适用域收窄：ZeroGVC 在高分辨率高码率下相对传统编码器优势收窄，作者推测 tiling 削弱了生成先验（paper:arxiv:2606.22371）；ReGenVC、DiV-INR 等的领先均限于说话人/极低码率（<0.05 bpp）等窄场景（paper:arxiv:2607.28144; paper:arxiv:2604.08329）。\n- 离散化设计律尚不完整：码本容量 K 对 LPIPS 的主导性（对数线性系数 α=−0.0094，p<0.001；分辨率项不显著 p=0.68，影响比约 10×）目前仅在分层离散视频编码一个框架内成立（paper:arxiv:2607.23366）。\n\n### 5. 指标驱动 RDO 的稳定性、指标过拟合与评测盲区\n\n- 单指标优化会利用模型特有偏差，在其他 NRM 下收益有限甚至退化，需指标集成 + 梯度平滑（paper:arxiv:2602.15779）。\n- 标量 RD 指标掩盖结构性失真：~1bpp 工作点上 BMSHJ/MBT/Cheng2020 三种 NIC 模型高频重建能量的 80–97% 泄漏到目标频带之外、目标频率增益仅 0.02–0.23；Cheng2020-Anchor 在单频输入下产生极端钳位前输出，均为标量指标不可见；仅解码器微调可将泄漏降低 90–99.8%（PSNR 代价 0.09–0.59 dB）（paper:arxiv:2611.10000）。\n- 时域维度缺失：跨 AV1/HEVC/VP9/H.264 的实证显示时域一致性随码率下降非线性退化，且存在「可预测性异常」——运动不可预测内容比大幅但可预测运动内容失稳更严重，挑战以运动量定义编码难度的传统假设（paper:arxiv:2605.18378）。\n- 编码器×内容交互效应显著（偏 η²=.112/.149），压缩效率结论难以跨内容条件泛化（paper:arxiv:2603.26763）。\n\n### 6. 码率控制与自适应流的联合优化\n\n- 两遍码控成本高：VCA 特征 + 随机森林帧级比特预测可替代 VVenC 2pRC，编码时间减 33.3%，但 B 帧预测 R² 仅 0.77（I 帧 0.93）（paper:arxiv:2602.06242）。\n- 帧级 QP 决策的统计结构复杂：LLM 进化发现的「熵约束 RDO」平均省约 1.26% 码率，而经典 Lagrangian 启发式同配置反而退化（CTC B +2.68%），说明朴素 λ 估计在帧级不成立（paper:arxiv:2606.20847）。\n- 阶梯优化需多目标：JQT-PF 激进配置 27.88% 码率节省以解码复杂度增加为代价，可控配置只能拿到 6.38%/6.17%（paper:arxiv:2601.10607）；码率-质量-解码复杂度三维帕累托前沿成为新基准面（paper:arxiv:2601.10607; paper:arxiv:2603.13597）。\n\n### 7. 码流安全、鲁棒性与容错\n\nVVDec 3.2.1 一次性修复五个安全漏洞（ALF APS use-after-free、嵌套 SEI 堆越界读+信息泄露、越界参考列表索引、SPS 整数溢出堆溢出），并强化非法码流拒绝（重叠/不完整切片覆盖、越界子图数、超 10bit 位深）（repo_release:github:vvdec-v3.2.1）；3.2.0 才引入 libfuzzer 基础设施并修复未初始化内存、负移位、整数溢出等 UB（repo_release:github:vvdec-v3.2.0）——表明成熟标准解码器的安全加固仍是持续性工程。容错侧，ReLViC 的段长参数化包上下文拓扑可在不重训练下调节压缩-误差传播权衡（paper:arxiv:2608.30202），语义/特征重要性分包 + 抗差错熵模型实现包独立解码（paper:arxiv:2609.16279），但二者均未与传统 FEC/重传机制形成统一理论。\n\n### 8. 标准化、互操作与生态迁移成本\n\n- API/ABI 破坏性变更频繁：VVDec 3.0.0（repo_release:github:vvdec-v3.0.0）、SVT-AV1 4.0.0（CRF 语义变更，repo_release:github:SVT-AV1-v4.0.0）、VVenC cts/dts 符号变更（repo_release:github:vvenc-v1.14.0）；工具生命周期管理出现（LMCS 弃用，repo_release:github:vvenc-v1.14.0）。\n- 跨平台输出一致性本身成为缺陷类别：SVT-AV1 3.0.1 专门修复 Arm 与 x86 输出不一致（repo_release:github:SVT-AV1-v3.0.1）。\n- 神经工具标准化路径初步成形但碎片化：AVS NVC 采纳学习式跳过决策（paper:arxiv:2611.00181），渐进式评测已对齐 JPEG-AI（paper:arxiv:2610.30966），增益图元数据对齐 ISO 21496-1（repo_release:github:libavif-v1.1.1）〔综述推断：学习式工具进入标准仍以「兼容现有语法的轻量插入」为主，端到端神经编码的标准化在条目中尚无进展证据〕。\n\n---\n\n## 四、趋势与展望\n\n1. **生成先验的一步化与实时化**：从多步到一步/少步（YODA 线性 DiT 一步去噪 paper:arxiv:2601.01141；DiffCR 两步+10× 加速 paper:arxiv:2601.10373；GenVC 478M 参数 15.1fps paper:arxiv:2607.22772；\n"}};
const DN = DATA.domain_names;

  `最近 7 天（自 ${DATA.cutoff}）新增 <b>${DATA.stats.week}</b> 条 · 基底累计 ${DATA.stats.total} 条 · 更新 ${DATA.generated}`;

function badge(it) {
  let b = it.type === "repo_release" ? '<span class="badge b-rel">版本动态</span>'
    : (it.deep ? '<span class="badge b-read">已精读</span>' : "");
  return b;
}
function itemHTML(it) {
  const links = [`<a href="${it.url}" target="_blank">原文 ↗</a>`]
    .concat(it.deep ? [`<a href="${it.deep}" target="_blank">精读笔记 ↗</a>`] : []).join("");
  return `<div class="item${it.deep ? " read" : ""}">
    <div class="meta"><span>${it.published}</span>${badge(it)}</div>
    <h3><a href="${it.url}" target="_blank">${it.title}</a></h3>
    <div class="oneliner">${it.one_liner}</div>
    <div class="links">${links}</div>
  </div>`;
}

const wl = document.getElementById("weekList");
let html = "";
for (const [dom, items] of Object.entries(DATA.week_by_domain)) {
  if (!items.length) continue;
  html += `<h2 class="sec">${DN[dom]}
    ${dom === DATA.core ? '<span class="core-tag">核心域</span>' : ""}
    <span class="n">${items.length} 条</span></h2>`;
  html += items.map(itemHTML).join("");
}
wl.innerHTML = html || `<div class="empty">最近 7 天无新增（引擎每日 09:30 自动拉取）</div>`;

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md2html(md) {
  const lines = md.split("\n");
  let out = [], inList = null, tableRows = [];
  const flushList = () => { if (inList) { out.push(`</${inList}>`); inList = null; } };
  const flushTable = () => {
    if (!tableRows.length) return;
    const rows = tableRows.filter(r => !/^\s*\|?\s*:?-+/.test(r));
    out.push("<table>" + rows.map((r, i) => {
      const cells = r.split("|").slice(1, -1).map(c => c.trim());
      const tag = i === 0 ? "th" : "td";
      return "<tr>" + cells.map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
    }).join("") + "</table>");
    tableRows = [];
  };
  function inline(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (line.trim().startsWith("|")) { flushList(); tableRows.push(line); continue; }
    flushTable();
    if (/^#{1,3}\s/.test(line)) {
      flushList();
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.replace(/^#+\s*/, ""))}</h${level}>`);
    } else if (/^[-*]\s/.test(line)) {
      if (inList !== "ul") { flushList(); out.push("<ul>"); inList = "ul"; }
      out.push(`<li>${inline(line.replace(/^[-*]\s*/, ""))}</li>`);
    } else if (/^\d+\.\s/.test(line)) {
      if (inList !== "ol") { flushList(); out.push("<ol>"); inList = "ol"; }
      out.push(`<li>${inline(line.replace(/^\d+\.\s*/, ""))}</li>`);
    } else if (line.trim() === "") {
      flushList();
    } else if (line.startsWith(">")) {
      flushList();
      out.push(`<p class="note">${inline(line.replace(/^>\s*/, ""))}</p>`);
    } else {
      flushList();
      out.push(`<p>${inline(line)}</p>`);
    }
  }
  flushList(); flushTable();
  return out.join("");
}

function rowHTML(it, visible) {
  const links = [`<a href="${it.url}" target="_blank">${it.title}</a>`]
    .concat(it.deep ? [`<a href="${it.deep}" target="_blank" style="font-weight:400;font-size:12px;color:var(--accent);">精读笔记↗</a>`] : []).join(" ");
  return `<div class="row-item"${visible ? "" : ' style="display:none"'}>
    <div class="l1"><span class="d">${it.published}</span>${badge(it)}${links}</div>
    <div class="ol">${it.one_liner}</div>
  </div>`;
}
window.showAll = (el, dom) => {
  document.getElementById("items-" + dom)
    .querySelectorAll(".row-item").forEach(r => r.style.display = "");
  el.remove();
};

const sl = document.getElementById("synList");
let synHTML = "";
for (const [dom, items] of Object.entries(DATA.items_by_domain)) {
  if (!items.length) continue;
  const md = DATA.synthesis[dom];
  const nPaper = items.filter(i => i.type === "paper").length;
  const nRel = items.filter(i => i.type === "repo_release").length;
  const counts = `论文 ${nPaper} · 版本动态 ${nRel}` + (md ? " · 附综述" : "");
  const itemsHTML = items.map((it, i) => rowHTML(it, i < 8)).join("") +
    (items.length > 8
      ? `<span class="more-btn" onclick="showAll(this, '${dom}')">显示全部 ${items.length} 条 ▼</span>` : "");
  synHTML += `<div class="syn" id="syn-${dom}">
    <div class="head" onclick="this.parentElement.classList.toggle('open')">
      <h3>${DN[dom] || dom}${dom === DATA.core ? ' <span class="core-tag" style="font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 5px;">核心域</span>' : ""}</h3>
      <span class="arrow">${counts} · 展开/收起</span>
    </div>
    <div class="body">
      ${md ? md2html(md) + `<div class="divider">该领域全部条目（${items.length}）</div>` : ""}
      <div id="items-${dom}">${itemsHTML}</div>
    </div>
  </div>`;
}
sl.innerHTML = synHTML || '<div class="empty">领域综述生成中（scripts/synthesize_kb.py）</div>';

function showTab(t) {
  document.getElementById("view-week").style.display = t === "week" ? "" : "none";
  document.getElementById("view-kb").style.display = t === "kb" ? "" : "none";
  document.getElementById("tab-week").classList.toggle("on", t === "week");
  document.getElementById("tab-kb").classList.toggle("on", t === "kb");
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  const btn = document.getElementById("askBtn");
  const ans = document.getElementById("ans");
  if (!q) return;
  btn.disabled = true;
  ans.textContent = "检索知识库并思考中…（glm-5.3，约 1-2 分钟）";
  try {
    const r = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    ans.innerHTML = md2html(d.answer) +
      `<div class="used">引用 ${d.used.length} 条：${d.used.join(" · ")}</div>`;
  } catch (e) {
    ans.innerHTML = `<b>问答服务不可达</b>（${e.message}）。线上静态页不带密钥——
      本地运行 <code>uv run --with pyyaml python scripts/serve.py</code> 后访问
      <code>http://127.0.0.1:8931</code> 即可提问；下方领域综述始终可读。`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("foot").innerHTML =
  `音视频信息引擎 · 数据与代码：<a href="${DATA.repo_url}" target="_blank">LLM-Reading</a> · 每日 09:30 自动更新`;
</script>
