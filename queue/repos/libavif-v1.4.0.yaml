  notes: "## [1.4.0] - 2026-03-04\n\n### Added since 1.3.0\n\n* Allow avifenc to read png or jpeg files\
    \ through stdin using --stdin-format.\n* Support some Sample Transform schemes as defined in the version\
    \ 1.2 of the\n  AVIF specification.\n* Add an optional argument to the --depth flag of avifenc used\
    \ to enable a bit\n  depth extension scheme in the encoded file.\n* Add support for converting jpeg\
    \ files with Apple style gain maps.\n* Add support for PNG cICP chunk when decoding PNG files. If\
    \ a PNG file contains\n  a cICP chunk and other color information chunks, such as iCCP (ICC profile),\n\
    \  the other chunks are ignored as per the PNG Specification Third Edition\n  Section 4.3.\n* Support\
    \ reading Sample-Transform-based 16-bit AVIF files when\n  avifDecoder::imageContentToDecode & AVIF_IMAGE_CONTENT_SAMPLE_TRANSFORMS\
    \ is\n  not zero.\n* Support Sample Transform derived image items with grid input image items.\n*\
    \ Add --sato flag to avifdec to enable Sample Transforms support at decoding.\n* Add --grid option\
    \ to avifgainmaputil.\n* Apply clean aperture crop, rotation and mirror when decoding to PNG or JPEG.\n\
    \  Remove orientation information from Exif if present.\n* Add avif::RGBImageCleanup to the C++ API.\n\
    \n### Changed since 1.3.0\n\n* Set avifDecoder::image->depth to the same value after avifDecoderParse()\
    \ as\n  after avifDecoderNextImage() when the file to decode contains a 'sato' derived\n  image item.\n\
    * avifdec only enables Sample Transform decoding when --depth is set to 16.\n* Update dav1d.cmd/dav1d_android.sh/LocalDav1d.cmake:\
    \ 1.5.3\n* Update googletest.cmd/LocalGTest.cmake: v1.17.0\n* Update libgav1.cmd: v0.20.0\n* Update\
    \ libjpeg.cmd/LocalJpeg.cmake: 3.1.3\n* Update libyuv.cmd/LocalLibyuv.cmake: deeb764bb (1922)\n* Update\
    \ libsharpyuv.cmd/LocalLibsharpyuv.cmake: v1.6.0\n* Update libxml2.cmd/LocalLibXml2.cmake: v2.15.1\n\
    * Update aom.cmd/LocalAom.cmake: v3.13.1\n* Update LocalAvm.cmake: research-v13.0.0\n* Update rav1e.cmd/LocalRav1e.cmake:\
    \ cargo-c v0.10.20, corrosion v0.6.1,\n  rav1e v0.8.1\n* Update svt.cmd/svt.sh/LocalSvt.cmake: v4.0.1\n\
    * Update zlibpng.cmd/LocalZlibpng.cmake: libpng 1.6.55, zlib 1.3.2\n* Fix grayscale conversion when\
    \ changing the bit depth.\n* Bump cmake_minimum_required from 3.13 to 3.22\n* Associate transformative\
    \ properties with alpha auxiliary image items.\n* Always forward the CICP color primaries, transfer\
    \ characteristics,\n  and matrix coefficients to the AV1 encoder, which writes them in the Sequence\n\
    \  Header OBU, for compatibility with libraries that wrongly ignore the colr box.\n* Use a \"quality\
    \ to quantizer (QP)\" mapping formula designed for AOM_TUNE_IQ.\n* Set tuning before applying the\
    \ user-provided specific aom codec options.\n* Use AOM_TUNE_PSNR by default when encoding alpha with\
    \ libaom because\n  AOM_TUNE_SSIM causes ringing for alpha.\n* Use AOM_TUNE_IQ by default when encoding\
    \ still non-RGB color samples with\n  libaom v3.13.0 or later.\n* Converting an image containing a\
    \ gain map using avifenc with the --grid flag\n  now also splits the gain map into a grid.\n* In avifenc,\
    \ set Exif orientation to 1 (no transformation) when converting\n  JPEGs to AVIF.\n* Use all-intra\
    \ encoding for a layered image if the total number of layers is 2\n  and the quality of the first\
    \ layer is very low (q <= 10).\n\n### Removed since 1.3.0\n\n* Remove ext/avm.cmd.\n* Remove the AVIF_ENABLE_EXPERIMENTAL_SAMPLE_TRANSFORM\
    \ CMake flag.\n* Remove support for libaom versions up to 2.0.0 inclusive.\n* Un-export the private\
    \ function avifImagePushProperty().\n\n[1.4.0]: https://github.com/AOMediaCodec/libavif/compare/v1.3.0...v1.4.0"
