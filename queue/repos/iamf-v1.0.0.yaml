  notes: 'This specification defines the Immersive Audio Model and Formats (IAMF) to provide an Immersive
    Audio experience to end-users.


    IAMF is used to provide Immersive Audio content for presentation on a wide range of devices in both
    streaming and offline applications. These applications include internet audio streaming, multicasting/broadcasting
    services, file download, gaming, communication, virtual and augmented reality, and others. In these
    applications, audio may be played back on a wide range of devices, e.g., headphones, mobile phones,
    tablets, TVs, sound bars, home theater systems, and big screens.


    This is the first version of the specification (v1.0.0).'
