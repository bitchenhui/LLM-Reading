  notes: "Kvazaar 2.0 has been released!\n\nSince 1.3, the encoder has received such improvements and\
    \ fixes that make this one of our most significant releases so far. It is only fitting to call this\
    \ version 2.0.\n\nHere are some of the more interesting changes in this release:\n\n# Important for\
    \ MinGW users\nAVX2 optimizations are no longer enabled for MinGW GCC due to stack alignment issues.\n\
    Use Clang for AVX2 support and therefore better performance.\n\n# Highlights\n- Updated presets\n\
    - Updated GOP definitions using QP offset model.\n  - There is now even longer hierarchical GOP `--gop=16`\n\
    - Much faster and improved bipred\n- Alternative and better rate control algorithm, optimal bit allocation\
    \ (`--rc-algorithm oba`)\n- Variance adaptive quantization (`--vaq`)\n\n# Features\n- Option to set\
    \ QP offset for intra frames (`--intra-qp-offset`, automatical by default)\n- Zero-coeff-rdo is now\
    \ configurable (`--zero-coeff-rdo`)\n- Optional intra frame analysis for rate control (`--intra-bits`)\n\
    - Optional machine learning based depth constraints for intra search (`--ml-pu-depth-intra`)\n- PU\
    \ depths are now separately configurable for each GOP layer\n\n# User Interface\n- Report bitrate\
    \ and some kind of (cumulative) average QP\n\n# Optimizations:\n- More AVX2 opimizations for SAO\n\
    - More AVX2 opimizations for transforms\n- More AVX2 opimizations for intra prediction\n- AVX2 strategy\
    \ for variance calculation\n\n...and several other improvements and fixes\n\n### BD-Bitrate\n\nAverage\
    \ BD-Bitrate compared with v1.3:\n\n| class  | 0-uf | 1-sf | 2-vf | 3-fr | 4-f  | 5-m  | 6-s  | 7-sr\
    \ | 8-vs |\n| --- | --: | --: | --: | --: | --: | --: | --: | --: | --: |\n| hevc-A | -20.2&nbsp;%\
    \ | -21.4&nbsp;% | -28.8&nbsp;% | -24.8&nbsp;% | -21.4&nbsp;% | -23.5&nbsp;% | -19.1&nbsp;% | -11.3&nbsp;%\
    \ | -15.0&nbsp;% |\n| hevc-B | -35.1&nbsp;% | -34.5&nbsp;% | -34.7&nbsp;% | -31.8&nbsp;% | -28.6&nbsp;%\
    \ | -29.5&nbsp;% | -21.8&nbsp;% | -11.4&nbsp;% | -16.2&nbsp;% |\n| hevc-C | -21.0&nbsp;% | -23.6&nbsp;%\
    \ | -31.3&nbsp;% | -27.7&nbsp;% | -22.4&nbsp;% | -23.5&nbsp;% | -19.8&nbsp;% | -12.9&nbsp;% | -18.0&nbsp;%\
    \ |\n| hevc-D | -22.5&nbsp;% | -26.6&nbsp;% | -37.4&nbsp;% | -33.2&nbsp;% | -26.6&nbsp;% | -25.3&nbsp;%\
    \ | -18.3&nbsp;% | -10.8&nbsp;% | -15.1&nbsp;% |\n| hevc-E | -35.9&nbsp;% | -34.9&nbsp;% | -30.9&nbsp;%\
    \ | -29.8&nbsp;% | -28.0&nbsp;% | -30.4&nbsp;% | -25.7&nbsp;% | -19.0&nbsp;% | -20.2&nbsp;% |\n| hevc-F\
    \ | -18.6&nbsp;% | -17.7&nbsp;% | -21.3&nbsp;% | -19.9&nbsp;% | -17.5&nbsp;% | -15.2&nbsp;% | -17.6&nbsp;%\
    \ | -26.8&nbsp;% | -37.0&nbsp;% |\n|||||||||||\n| Total | -26.0&nbsp;% | -26.9&nbsp;% | -31.1&nbsp;%\
    \ | -28.2&nbsp;% | -24.4&nbsp;% | -24.6&nbsp;% | -20.3&nbsp;% | -15.4&nbsp;% | -20.6&nbsp;% |\n\n\
    ### Speedup\n\nAverage speedup compared with v1.3 on an AMD Ryzen 7 1700X machine:\n\n| class  | 0-uf\
    \ | 1-sf | 2-vf | 3-fr | 4-f  | 5-m  | 6-s  | 7-sr | 8-vs |\n| --- | --: | --: | --: | --: | --: |\
