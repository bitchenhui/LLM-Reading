  notes: "## uvg266\n\nWe now also have a VVC encoder called uvg266, which is available at [github/uvg266](https://github.com/ultravideo/uvg266).\
    \ The majority of future development will go towards uvg266 but do not consider Kvazaar to be abandoned!\n\
    \n## Features\n- Updated Region of Interest (ROI) functionality to allow separate ROI map for each\
    \ frame\n- Improve inter search\n- Update cabac context during search to improve the accuracy of bit\
    \ cost estimation \n- Move intra chroma search option from `--rd 3` to its own option `--(no-)intra-chroma-search`\
    \  and fast bipred to `--(no-)fast-bipred`\n- Change maximum rd level to 4, where 3 performs more\
    \ rd search for inter and 4 performs full intra search\n- Add `--(no-)combine-intra-cus` for controlling\
    \ whether the larger intra blocks are tried even when search at current depth is disabled\n- Add `--force-inter`\
    \ for debugging purposes to force all PUs in inter slices to use best inter mode \n\n## Optimizations\n\
    - AVX2 implementations of bidirectional blending\n\n## Fixes\n- Make sure the dpb is more than max_num_reorder_pics\
    \ 899c672ed15a522fe2391ff81eef682e0a9d89a9\n-  Compute proper count of buffered frames for vps and\
    \ sps. Use common function d4880be6f256bb7ccbcab844c2488162b9580f15\n- Fix some strategy function\
    \ pointer signatures a4005046ae2ebb3c88e92ff06736ce57b60fdcc7\n\n## External contributors\n* build:\
    \ fix automake warning by @bradh in https://github.com/ultravideo/kvazaar/pull/335\n* cli: add missing\
    \ newlines in usage by @bradh in https://github.com/ultravideo/kvazaar/pull/336\n* refactor SEI by\
    \ @bradh in https://github.com/ultravideo/kvazaar/pull/341\n* cli: minor api doc fix by @bradh in\
    \ https://github.com/ultravideo/kvazaar/pull/342\n* add sudo ldconfig by @binbinzhm in https://github.com/ultravideo/kvazaar/pull/345\n\
    * Enable -mpopcnt and -mlzcnt on AVX2 by @klondi in https://github.com/ultravideo/kvazaar/pull/301\n\
    \n## New Contributors\n* @bradh made their first contribution in https://github.com/ultravideo/kvazaar/pull/335\n\
    * @binbinzhm made their first contribution in https://github.com/ultravideo/kvazaar/pull/345\n* @klondi\
    \ made their first contribution in https://github.com/ultravideo/kvazaar/pull/301\n## Performance\n\
    ### BD-Bitrate\n\nAverage BD-Bitrate compared with v2.1:\n\n|  class | 0-uf   | 1-sf    | 2-vf   \
    \  | 3-fr     | 4-f      | 5-m      | 6-s      | 7-sr    | 8-vs   |\n|:------:|--------|---------|----------|----------|----------|----------|----------|---------|--------|\n\
    | hevc-A | 0.4 %  | 0.7 %   | 0.0 %    | -0.1 %   | 0.0 %    | -1.1 %   | -0.8 %   | 0.2 %   | -5.1\
    \ % |\n| hevc-B | 0.3 %  | 0.4 %   | -0.3 %   | -0.6 %   | -0.4 %   | -1.7 %   | -1.2 %   | 0.1 %\
    \   | -7.1 % |\n| hevc-C | 0.5 %  | 1.1 %   | 0.7 %    | 0.5 %    | 0.2 %    | -0.8 %   | -0.4 % \
    \  | 0.4 %   | -5.5 % |\n| hevc-D | 0.4 %  | 1.5 %   | 1.0 %    | 0.6 %    | 0.7 %    | -0.3 %   |\
    \ -0.1 %   | 0.4 %   | -6.6 % |\n| hevc-E | -2.1 % | -1.7 %  | -2.2 %   | -2.5 %   | -2.5 %   | -1.4\
    \ %   | -1.1 %   | -1.1 %  | -5.4 % |\n| hevc-F | -0.1 % | 0.2 %   | -0.2 %   | -0.2 %   | -0.3 %\
    \   | -0.6 %   | -0.4 %   | 0.1 %   | -3.1 % |\n|||||||||\n| total  | 0.0 %  | 0.4   % | -0.1   %\
    \ | -0.3   % | -0.3   % | -1.0   % | -0.7   % | 0.0   % | -5.6 % |\n\n### Speedup\n\nAverage speedup\
    \ compared with v2.1 on an Intel Xeon W-2145 (8-core) machine:\n|  class | 0-uf  | 1-sf  | 2-vf  |\
