  notes: "## [1.3.0](https://github.com/AOMediaCodec/libavif/compare/v1.2.1...v1.3.0) - 2025-05-09\n\n\
    ### Added since 1.2.1\n\n* Add grayscale conversions in avifImageRGBToYUV and avifImageYUVToRGB.\n\
    * Add avifRGBFormatIsGray to check whether an avifRGBFormat is gray.\n\n### Changed since 1.2.1\n\n\
    * Reject the conversion in avifenc from non-monochrome/monochrome to\n  monochrome/non-monochrome\
    \ when an ICC profile is present and not explicitly\n  discarded.\n* Forbid encoding with AVIF_MATRIX_COEFFICIENTS_IDENTITY\
    \ and\n  AVIF_PIXEL_FORMAT_YUV400 to be AV1 spec compatible.\n* Do not go through RGB when reading/writing\
    \ a grayscale PNG/JPG images in\n  avifenc/avifdec\n* Ignore tmap items not present in `grpl` box\n\
    * Assume any id is present in only one altr group as per spec.\n* avifpng.c: support ImageMagick app1\
    \ exif text data\n* avifjpeg.c: check for uint32_t overflow before add\n* Update googletest.cmd/LocalGTest.cmake:\
    \ v1.16.0\n* Update libjpeg.cmd/LocalJpeg.cmake: 3.1.0\n* Update libsharpyuv: v1.5.0\n* Update libxml2.cmd/LocalLibXml2.cmake:\
    \ v2.14.0\n* Update libyuv.cmd/LocalLibyuv.cmake: 4db2af62d (1909)\n* Update LocalRav1e.cmake: cargo-c\
    \ v0.10.12\n* Update zlibpng.cmd: libpng 1.6.47\n* Fix wrong Exif orientation set in JPEG or PNG output\
    \ by avifdec when the input\n  AVIF file has an ImageRotation property with angle set to 1 or 3, has\
    \ no\n  ImageMirror property, and carries an Exif chunk. Note that Exif orientation is\n  usually\
    \ ignored in PNG files, so this mainly impacts JPEG files.\n* Encoder: fix ispe property for tmap\
    \ with grid.\n* Decoder: check the ispe property of tmap items.\n* Allow lowercase GUIDs in XMP when\
    \ reading JPEG files.\n* Update aom.cmd/LocalAom.cmake: v3.12.1\n* Change avifenc to start in automatic\
    \ tiling mode.\n* Always forward Unspecified (2) CICP color primaries, transfer characteristics,\n\
    \  and matrix coefficients to the AV1 encoder. Rely on the 'colr' box instead.\n* Declare *RowBytes\
    \ as size_t in avifImageRGBToYUV()\n* Check ftell returned value in avifjpeg.c\n* Add integer overflow\
    \ checks to makeRoom.\n* LocalJpeg.cmake: Support multi-config generators."
