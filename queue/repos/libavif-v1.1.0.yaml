  url: https://github.com/AOMediaCodec/libavif/releases/tag/v1.1.0
  notes: "# [1.1.0](https://github.com/AOMediaCodec/libavif/compare/v1.0.0...v1.1.0) - 2024-07-11\n\n\
    ## Added\n* Add experimental API for reading and writing gain maps in AVIF files.\n  If enabled at\
    \ compile time, add `gainMap` field to `avifImage`,\n  add `qualityGainMap` field to `avifEncoder`,\
    \ add `gainMapPresent`,\n  `enableDecodingGainMap`, `enableParsingGainMapMetadata` and\n  `ignoreColorAndAlpha`\
    \ to `avifDecoder`.\n  Utility functions for working with gain maps are also added.\n  Gain maps allow\
    \ readers that support them to display HDR images that look\n  good on both HDR and SDR displays.\n\
    \  This feature is highly experimental. The API might change or be removed\n  in the future. Files\
    \ created now might not decode in a future version.\n  This feature is off by default and must be\
    \ enabled with the\n  AVIF_ENABLE_EXPERIMENTAL_GAIN_MAP compilation flag.\n* Add experimental support\
    \ for converting jpeg files with gain maps to AVIF\n  files with gain maps. Requires libxml2, and\
    \ the AVIF_ENABLE_EXPERIMENTAL_GAIN_MAP\n  compilation flag.\n  Add a --qgain-map flag to control\
    \ the gain map quality in avifenc.\n* Add the headerFormat member of new type avifHeaderFormat to\
    \ avifEncoder.\n* Add experimental API for reading and writing \"mif3\"-branded AVIF files\n  behind\
    \ the compilation flag AVIF_ENABLE_EXPERIMENTAL_METAV1.\n* Implement avifImageScale() fallback when\
    \ libyuv is not available.\n* Partial import of libyuv to third_party/libyuv (new LICENSE).\n* Add\
    \ avifenc flag suffixes \":update\" and \":u\". Quality-relative,\n  tiling-relative and codec-specific\
    \ flags can now be positional, relative to\n  input files.\n* Add experimental support for layered\
    \ AVIF encoding in avifenc.\n  Use the --layered flag to enable layered AVIF encoding.\n  Layered\
    \ AVIF has multiple layers, which works like frame of animated AVIF,\n  and layers can be rendered\
    \ in progressive manner on supported viewers\n  (e.g. Chrome 94 or newer).\n  Only aom supports layered\
    \ AVIF encoding at the time of writing.\n  Add --scaling-mode flag to set scaling mode of each layer.\n\
    \  This part of AV1 encoder is not as thoroughly tested, so there are higher\n  possibility encoder\
    \ may crash when given certain configuration or input.\n* Add imageSequenceTrackPresent flag to the\
    \ avifDecoder struct.\n* avifImageScale() function was made part of the public ABI.\n* Add avif_cxx.h\
    \ as a C++ header with basic functionality.\n* Add enum aliases AVIF_COLOR_PRIMARIES_SRGB, AVIF_COLOR_PRIMARIES_BT2100,\n\
    \  AVIF_COLOR_PRIMARIES_DCI_P3, AVIF_TRANSFER_CHARACTERISTICS_PQ.\n* Add avifResult enum entry AVIF_RESULT_INTERNAL_ERROR.\n\
    * Require libyuv by default (but it can still be disabled with\n  -DAVIF_LIBYUV=OFF).\n* Add avifdec\
    \ --icc flag to override the output color profile.\n* Add experimental API for reading and writing\
    \ 16-bit AVIF files behind the\n  compilation flag AVIF_ENABLE_EXPERIMENTAL_SAMPLE_TRANSFORM.\n* Add\
    \ AVIF_CHROMA_SAMPLE_POSITION_RESERVED to avifChromaSamplePosition enum.\n\n## Changed\n* Update aom.cmd:\
    \ v3.9.1\n* Update avm.cmd: research-v7.0.1\n* Update dav1d.cmd: 1.4.3\n* Update libgav1.cmd: v0.19.0\n\
    * Update libjpeg.cmd: v3.0.3\n* Update libxml2.cmd: v2.12.7\n* Update libyuv.cmd: a6a2ec65\n* Update\
    \ mp4box.sh: v2.4.0\n* Update rav1e.cmd: v0.7.1\n* Update svt.cmd/svt.sh: v2.1.1\n* Update zlibpng.cmd:\
    \ zlib 1.3.1 and libpng 1.6.40\n* AVIF sequences encoded by libavif will now also have the \"avio\"\
    \ brand when\n  there is at least one track made only of AV1 keyframes.\n* Fix SVT-AV1 codec interface\
    \ which was not setting video range at encoding.\n* Any item ID being 0 in an \"iref\" box with version\
    \ 0 or 1 is now treated as an\n  error instead of being ignored.\n* API calls now return AVIF_RESULT_OUT_OF_MEMORY\
    \ instead of aborting on memory\n  allocation failure.\n* avifdec and avifenc: Change the default\
    \ value of the --jobs option from 1 to\n  \"all\".\n* Update avifCropRectConvertCleanApertureBox()\
    \ to the revised requirements in\n  ISO/IEC 23000-22:2019/Amd. 2:2021 Section 7.3.6.7.\n* AVIF files\
    \ with an exif_tiff_header_offset pointing at another byte than the\n  first II or MM tag in the Exif\
    \ metadata payload will now fail to be decoded.\n  Set decoder->ignoreExif to true to skip the issue\
    \ and decode the image.\n* Fix memory errors reported in crbug.com/1501766, crbug.com/1501770, and\n\
    \  crbug.com/1504792 by [Fudan University](https://secsys.fudan.edu.cn/).\n* For codecs, AVIF_CODEC_*\
    \ and AVIF_LOCAL_* are now merged into AVIF_CODEC_*\n  that can only take the values: OFF, LOCAL or\
    \ SYSTEM.\n* For the gtest, jpeg, libsharpyuv, libxml2, libyuv and zlibpng dependencies,\n  AVIF_LOCAL_*\
    \ is now replaced by flags AVIF_* that can take the values:\n  OFF, LOCAL or SYSTEM.\n* src/reformat.c:\
    \ Allocate the threadData array directly.\n* AVIF_ENABLE_WERROR is set to OFF by default.\n* Fix wrong\
    \ alpha plane deallocation when decoded tile pixel format does not\n  match reconstructed output image\
    \ pixel format (b/320234262).\n* Fix identical chunk skipping optimization when writing animation\
    \ data\n  (b/321189607).\n* Fix ID selection for artificial grid alpha item when decoding a grid of\
    \ tiles\n  which each have an associated auxiliary alpha image item\n  (https://crbug.com/oss-fuzz/65657).\n\
    * ext/libjpeg.cmd now pulls libjpeg-turbo instead of libjpeg and AVIF_JPEG=LOCAL\n  now expects the\
    \ library dependency in ext/libjpeg-turbo/build.libavif.\n* Fix 'iloc' box parsing bugs that may have\
    \ wrongly accepted, rejected or parsed\n  some files with rare values of offset_size, length_size,\
    \ base_offset_size and\n  index_size.\n* 'infe' boxes with an item_type different from 'mime' and\
    \ without a\n  null-terminated item_name are now considered invalid as per ISO/IEC 14496-12."
