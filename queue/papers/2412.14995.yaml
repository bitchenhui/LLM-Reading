  title: 'HSEvo: Elevating Automatic Heuristic Design with Diversity-Driven Harmony Search and Genetic
    Algorithm Using LLMs'
  authors:
  - Pham Vu Tuan Dat
  - Long Doan
  - Huynh Thi Thanh Binh
  published: '2024-12-19'
  updated: '2024-12-19'
  categories:
  - cs.NE
