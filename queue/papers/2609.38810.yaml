  title: 'CRAFT: Causal Responsibility and Failure Tracing in Medical Vision Language Models'
  authors:
  - Chunzheng Zhu
  - Jiaqi Zeng
  - Hongbo Zhao
  - Yihang Chen
  - Yijun Wang
  - Jianxin Lin
  published: '2026-09-30'
  updated: '2026-10-29'
  categories:
  - cs.CV
