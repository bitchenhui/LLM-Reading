  title: Sparse Rewards Can Self-Train Dialogue Agents
  authors:
  - Barrett Martin Lattimer
  - Varun Gangal
  - Ryan McDonald
  - Yi Yang
  published: '2024-09-06'
  updated: '2025-07-18'
