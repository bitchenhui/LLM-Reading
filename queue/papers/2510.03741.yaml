  abstract: While neural-based models have led to significant advancements in audio feature extraction,
    the interpretability of the learned representations remains a critical challenge. To address this,
    disentanglement techniques have been integrated into discrete neural audio codecs to impose structure
    on the extracted tokens. However, these approaches often exhibit strong dependencies on specific datasets
    or task formulations. In this work, we propose a disentangled neural audio codec that leverages spectral
    decomposition of time-domain signals to enhance representation interpretability. Experimental evaluations
    demonstrate that our method surpasses a state-of-the-art baseline in both reconstruction fidelity
    and perceptual quality.
