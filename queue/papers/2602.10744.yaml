  title: Self-Supervised Image Super-Resolution Quality Assessment based on Content-Free Multi-Model Oriented
    Representation Learning
  authors:
  - Kian Majlessi
  - Amir Masoud Soltani
  - Mohammad Ebrahim Mahdavi
  - Aurelien Gourrier
  - Peyman Adibi
  published: '2026-02-11'
  updated: '2026-02-11'
