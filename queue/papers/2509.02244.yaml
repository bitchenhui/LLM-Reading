  title: 'Spectrogram Patch Codec: A 2D Block-Quantized VQ-VAE and HiFi-GAN for Neural Speech Coding'
  authors:
  - Luis Felipe Chary
  - Miguel Arjona Ramirez
  published: '2025-09-02'
  updated: '2025-09-02'
