  abstract: Block based image compression relies on transform coding to concentrate signal energy into
    a small number of coefficients. While classical codecs use fixed transforms such as the Discrete Cosine
    Transform (DCT), data driven methods such as Principal Component Analysis (PCA) are theoretically
    optimal for decorrelation. This paper presents an experimental comparison of DCT, Hadamard, and PCA
    across multiple block sizes and compression rates. Using rate distortion and energy compaction analysis,
    we show that PCA outperforms fixed transforms only when block dimensionality is sufficiently large,
    while DCT remains near optimal for standard block sizes such as $8\times8$ and at low bit rates. These
    results explain the robustness of DCT in practical codecs and highlight the limitations of block wise
    learned transforms.
