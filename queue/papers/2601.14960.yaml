  abstract: We present VCNAC, a variable channel neural audio codec. Our approach features a single encoder
    and decoder parametrization that enables native inference for different channel setups, from mono
    speech to cinematic 5.1 channel surround audio. Channel compatibility objectives ensure that multi-channel
    content maintains perceptual quality when decoded to fewer channels. The shared representation enables
    training of generative language models on a single set of codebooks while supporting inference-time
    scalability across modalities and channel configurations. Evaluation using objective spatial audio
    metrics and subjective listening tests demonstrates that our unified approach maintains high reconstruction
    quality across mono, stereo, and surround audio configurations.
