  title: 'Medial Skeletal Diagram: A Generalized Medial Axis Approach for 3D Shape Representation'
  authors:
  - Minghao Guo
  - Bohan Wang
  - Wojciech Matusik
  published: '2023-10-13'
  updated: '2024-10-02'
  categories:
  - cs.GR
  abstract: We propose the Medial Skeletal Diagram, a novel skeletal representation that tackles the prevailing
    issues around skeleton sparsity and reconstruction accuracy in existing skeletal representations.
    Our approach augments the continuous elements in the medial axis representation to effectively shift
    the complexity away from the discrete elements. To that end, we introduce generalized enveloping primitives,
    an enhancement over the standard primitives in the medial axis, which ensure efficient coverage of
    intricate local features of the input shape and substantially reduce the number of discrete elements
    required. Moreover, we present a computational framework for constructing a medial skeletal diagram
    from an arbitrary closed manifold mesh. Our optimization pipeline ensures that the resulting medial
    skeletal diagram comprehensively covers the input shape with the fewest primitives. Additionally,
    each optimized primitive undergoes a post-refinement process to guarantee an accurate match with the
    source mesh in both geometry and tessellation. We validate our approach on a comprehensive benchmark
    of 100 shapes, demonstrating the sparsity of the discrete elements and superior reconstruction accuracy
    across a variety of cases. Finally, we exemplify the versatility of our representation in downstream
    applications such as shape generation, mesh decomposition, shape optimization, mesh alignment, mesh
    compression, and user-interactive design.
