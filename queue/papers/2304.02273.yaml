  title: 'MMVC: Learned Multi-Mode Video Compression with Block-based Prediction Mode Selection and Density-Adaptive
    Entropy Coding'
  authors:
  - Bowen Liu
  - Yu Chen
  - Rakesh Chowdary Machineni
  - Shiyu Liu
  - Hun-Seok Kim
  published: '2023-04-05'
  updated: '2023-04-05'
