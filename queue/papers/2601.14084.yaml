  abstract: Vision-language models (VLMs) are increasingly important in medical applications; however,
    their evaluation in dermatology remains limited by datasets that focus primarily on image-level classification
    tasks such as lesion recognition. While valuable for recognition, such datasets cannot assess the
    full visual understanding, language grounding, and clinical reasoning capabilities of multimodal models.
    Visual question answering (VQA) benchmarks are required to evaluate how models interpret dermatological
    images, reason over fine-grained morphology, and generate clinically meaningful descriptions. We introduce
    DermaBench, a clinician-annotated dermatology VQA benchmark built on the Diverse Dermatology Images
    (DDI) dataset. DermaBench comprises 656 clinical images from 570 unique patients spanning Fitzpatrick
    skin types I-VI. Using a hierarchical annotation schema with 22 main questions (single-choice, multi-choice,
    and open-ended), expert dermatologists annotated each image for diagnosis, anatomic site, lesion morphology,
    distribution, surface features, color, and image quality, together with open-ended narrative descriptions
    and summaries, yielding approximately 14.474 VQA-style annotations. DermaBench is released as a metadata-only
    dataset to respect upstream licensing and is publicly available at Harvard Dataverse.
