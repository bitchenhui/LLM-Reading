  title: 'GRACE: Grounded Reasoning via Adapter Composition and Evidence-Aware Calibration for Educational
    Visual Question Answering'
  authors:
  - Xinjin Li
  - Yudi Xia
  - Xi Zhao
  - Yiliu Xu
