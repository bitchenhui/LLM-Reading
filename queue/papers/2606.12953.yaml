  abstract: 'We present OpenMedQ, a medical vision-language model pretrained on the broadest fully-open
    medical mix to date: 14 datasets totaling ~3.35M pretraining samples spanning pathology, radiology,
    microscopy, and text-only clinical QA. OpenMedQ reaches state-of-the-art BLEU-1 on PathVQA (75.9),
    beating Med-PaLM M variants up to 562B parameters (~80x larger), and matches the best reported VQA-MED
    BLEU-1 (64.5). Its vision encoder, transferred to 8 unseen medical classification benchmarks under
    an identical downstream recipe, obtains the highest average macro-F1 (0.757) among BiomedCLIP (0.745),
    PMC-CLIP (0.745), PubMedCLIP (0.746), and a from-scratch baseline (0.616). We release our code and
    an interactive demo is publicly available as a reproducible baseline for the community.'
