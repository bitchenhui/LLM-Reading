  title: 'The Self-Improvement Paradox: Can Language Models Bootstrap Reasoning Capabilities without External
    Scaffolding?'
  authors:
  - Yutao Sun
  - Mingshuai Chen
  - Tiancheng Zhao
  - Ruochen Xu
  - Zilun Zhang
