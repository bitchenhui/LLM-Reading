  title: Enhancing Adversarial Training with Prior Knowledge Distillation for Robust Image Compression
  authors:
  - Zhi Cao
  - Youneng Bao
  - Fanyang Meng
  - Chao Li
  - Wen Tan
  - Genhong Wang
