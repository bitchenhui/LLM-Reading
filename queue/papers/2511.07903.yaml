  abstract: Prevailing quantization techniques in Learned Image Compression (LIC) typically employ a static,
    uniform bit-width across all layers, failing to adapt to the highly diverse data distributions and
    sensitivity characteristics inherent in LIC models. This leads to a suboptimal trade-off between performance
    and efficiency. In this paper, we introduce DynaQuant, a novel framework for dynamic mixed-precision
    quantization that operates on two complementary levels. First, we propose content-aware quantization,
    where learnable scaling and offset parameters dynamically adapt to the statistical variations of latent
    features. This fine-grained adaptation is trained end-to-end using a novel Distance-aware Gradient
    Modulator (DGM), which provides a more informative learning signal than the standard Straight-Through
    Estimator. Second, we introduce a data-driven, dynamic bit-width selector that learns to assign an
    optimal bit precision to each layer, dynamically reconfiguring the network's precision profile based
    on the input data. Our fully dynamic approach offers substantial flexibility in balancing rate-distortion
    (R-D) performance and computational cost. Experiments demonstrate that DynaQuant achieves rd performance
    comparable to full-precision models while significantly reducing computational and storage requirements,
    thereby enabling the practical deployment of advanced LIC on diverse hardware platforms.
