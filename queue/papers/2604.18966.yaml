  title: Self-Improving Tabular Language Models via Iterative Reward-Guided Post-Training
  authors:
  - Yunbo Long
  - Tejumade Afonja
  - Guangya Hao
  - Alexandra Brintrup
  - Mario Fritz
  published: '2026-04-21'
  updated: '2026-05-17'
