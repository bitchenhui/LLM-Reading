  title: Ultra-Low-Bitrate Speech Coding with Pretrained Transformers
  authors:
  - Ali Siahkoohi
  - Michael Chinen
  - Tom Denton
  - W. Bastiaan Kleijn
  - Jan Skoglund
  published: '2022-07-05'
  updated: '2022-07-05'
  categories:
  - cs.SD
