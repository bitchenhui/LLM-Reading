  abstract: Serving web queries at scale with multi-agent systems requires jointly configuring large language
    models, collaboration modes, agent counts, interaction rounds, and skills. However, the resulting
    configuration space grows combinatorially, while sparse execution rewards provide limited fine-grained
    supervision for interdependent planning decisions. We propose EvoRouter, a self-evolving multi-agent
    routing framework driven by insight-guided on-policy distillation. A dedicated expert periodically
    synthesizes performance-cost feedback from configuration trajectories across tasks into reusable conditional
    routing insights about capability requirements, returns from resource scaling, and interactions among
    configuration choices. A privileged teacher combines these evolving insights with current execution
    feedback to provide dense token-level supervision for the router's own planning trajectories through
    on-policy distillation. Cost-aware reinforcement learning jointly optimizes task performance and computational
    cost. Together, these training signals internalize execution insights into the routing policy. The
    updated policy generates new trajectories that support subsequent insight extraction, forming an execution-driven
    self-improvement loop. We evaluate EvoRouter on 19 in-domain datasets spanning five domains and two
    out-of-domain benchmarks. EvoRouter achieves an average in-domain accuracy of 68.69%, outperforming
    the strongest routing baseline by 7.23 percentage points while reducing inference compute cost by
    50.95%. Our code is open-sourced at https://github.com/CenYangtze/EvoRouter.
