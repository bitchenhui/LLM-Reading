  title: '3DGSI-Assessor: A Large-Scale Dataset and An LMM-based Method for 3D Gaussian Splatting Image
    Quality Assessment'
  authors:
  - Yuke Xing
  - Jiarui Wang
  - William Gordon
  - Zhu Li
  - Guangtao Zhai
  - Yiling Xu
  published: '2026-08-04'
  updated: '2026-08-04'
