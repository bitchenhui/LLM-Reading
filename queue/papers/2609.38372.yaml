  abstract: 'A harness is the code around a language-model agent that organizes prompts, calls tools,
    manages context, and controls execution. As models grow stronger, recent work has begun to let agents
    improve their own harnesses, a line of work known as self-evolving harnesses. In most existing methods,
    a separate proposer running on a human-designed harness modifies the solver''s harness, and a separate
    harness is evolved for each benchmark. Real-world tasks come from many domains, so both the evolution
    and the evaluation of a harness should cover a diverse range of tasks. We propose a framework close
    to recursive self-improvement: the same frozen model, on the same version of the harness, first solves
    tasks as the solver and then, as the proposer, reads the complete run records and directly edits the
    harness that runs it. Each evolution batch draws tasks from five benchmarks in different domains.
    To measure generalization, training and held-out tasks are strictly separated, and we additionally
    evaluate on five out-of-distribution benchmarks never used during evolution. We frame the evolution
    process as deep-learning training with two stages, multi-task pretraining and continual training.
    Starting from a 49-line seed harness, the harnesses evolved by GLM-5.3 and GPT-5.6 Sol gain about
    5 points on the in-distribution benchmarks, matching or exceeding Claude Code and Codex, and the GPT-5.6
    Sol harness is on par with Codex on five out-of-distribution benchmarks. Continued evolution on Claw-Eval
    in the second stage then lifts GPT-5.6 Sol and GLM-5.3-Flash above Codex and Claude Code. We also
    provide an in-depth analysis of the mechanisms that emerged during evolution, including output truncation,
    history compaction, completion checks, independent review, and visual inspection. Code and the evolved
    harnesses are available at https://github.com/xqkkk/self-evolving-harness.'
