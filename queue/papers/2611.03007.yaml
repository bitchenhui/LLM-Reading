  title: 'Q-CamTuning: A Multimodal Large Language Model for Fine-Grained Quality Reasoning in Livestreaming
    Camera Tuning'
  authors:
  - Yanchao Bi
  - Pengfei Chen
  - Yulong Yan
  - Qian Zhang
  - Biao Wang
  - Leida Li
  published: '2026-11-02'
  updated: '2026-11-02'
