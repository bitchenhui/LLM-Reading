  title: Decomposition-Guided Curvelet Thresholding for Sharp-to-Soft CT Kernel Conversion
  authors:
  - Mahmoud Nasr
  - Jan K. Argasinski
  - Krzysztof Brzostowski
  - Adam Piorkowski
  published: '2026-10-05'
  updated: '2026-10-05'
