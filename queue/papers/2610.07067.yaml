  - cs.CV
  abstract: 'Image denoising is a crucial task in image processing, focused on improving image quality
    by minimizing noise while maintaining essential structural elements. This study presents a hybrid
    denoising framework that combines several decomposition techniques, including empirical mode decomposition
    (EMD), variational mode decomposition (VMD), multichannel EMD (MEMD), and bidimensional EMD (BEMD),
    with curvelet transform thresholding. Each decomposition mode undergoes processing through both soft
    and hard thresholding, and the denoised modes are combined to rebuild the final image. Comprehensive
    evaluations of standard CT image datasets reconstructed with various kernels (B50, B46, B41, B36)
    reveal substantial enhancements in denoising efficacy. VMD consistently achieves the highest peak
    signal-to-noise ratio (PSNR) and structural similarity index (SSIM), signifying exceptional noise
    reduction and feature preservation. The study analyses the trade-offs between soft and hard thresholding:
    soft thresholding maintains intricate visual details, whilst harsh thresholding provides enhanced
    noise reduction. The suggested method surpasses traditional techniques in both reference and non-reference
    quality criteria, indicating its potential for broader application in medical imaging and future incorporation
    with adaptive thresholding algorithms.'
