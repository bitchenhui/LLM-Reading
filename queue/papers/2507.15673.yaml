  abstract: 'Point clouds are a promising video representation for virtual and augmented reality. Their
    high-bitrate, however, has so far limited the practicality of live streaming systems. In this work,
    we leverage the delivery timeout feature within the Media Over QUIC protocol to perform implicit server-side
    adaptation based on an application''s latency target. Through experimentation with several publisher
    and network configurations, we demonstrate that our system unlocks a unique trade-off on a per-client
    basis: applications with lower latency requirements will receive lower-quality video, while applications
    with more relaxed latency requirements will receive higher-quality video.'
