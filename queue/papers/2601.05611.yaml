  abstract: While Vision-Language Models (VLMs) offer rich world knowledge for end-to-end autonomous driving,
    current approaches heavily rely on labor-intensive language annotations (e.g., VQA) to bridge perception
    and control. This paradigm suffers from a fundamental mismatch between discrete linguistic tokens
    and continuous driving trajectories, often leading to suboptimal control policies and inefficient
    utilization of pre-trained knowledge. To address these challenges, we propose FLARE (Future-aware
    LAtent REpresentation), a novel framework that activates the visual-semantic capabilities of pre-trained
    VLMs without requiring language supervision. Instead of aligning with text, we introduce a self-supervised
    future feature prediction objective. This mechanism compels the model to anticipate scene dynamics
    and ego-motion directly in the latent space, enabling the learning of robust driving representations
    from large-scale unlabeled trajectory data. Furthermore, we integrate Group Relative Policy Optimization
    (GRPO) into the planning process to refine decision-making quality. Extensive experiments on the NAVSIM
    benchmark demonstrate that FLARE achieves state-of-the-art performance, validating the effectiveness
    of leveraging VLM knowledge via predictive self-supervision rather than explicit language generation.
