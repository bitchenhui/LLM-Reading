  abstract: Digital restoration of historical manuscript images aims to improve readability while preserving
    the authenticity of cultural heritage documents. However, evaluating quality of restored manuscripts
    remains challenging, where readability is often subjective and expert annotations are scarce. This
    study investigates the suitability of contrast-based image quality measures to assess quality and
    legibility of reconstructed manuscript images from multi-spectral imaging. Two experiments were conducted
    with publicly-available data sets, facilitating manual quality scores by experts and full-reference
    image quality measures as reference evaluations. The results show that potential contrast achieves
    the highest correlation with expert ratings, while contrast-to-noise ratio demonstrates the strongest
    agreement with full-reference quality measures. Overall, contrast-based measures consistently outperform
    general image quality measures, demonstrating their potential as objective indicators of manuscript
    legibility and reconstruction quality.
