  title: 'GEM-MM: Reducing VLM Hallucination with Entropy-Guided Preference Alignment'
  authors:
  - Yuanshan Chua
  - Xuejiao Zhao
  published: '2026-11-15'
  updated: '2026-11-15'
  categories:
  - cs.AI
  - cs.LG
  abstract: 'Vision-language models (VLMs) are routinely aligned with offline pairwise RLHF objectives,
    but multimodal preference data is scarce and treats every response token as equally informative. Under
    a small preference budget, pair construction becomes nearly irrelevant: standard DPO-style, image-conditional,
    and self-improvement objectives all perform within 1.1 points on MM-RLHF metrics and 0.5 points on
    hallucination rates, matching the SFT baseline. We call this entropy-blind preference optimization:
    the learning signal ignores policy uncertainty, which in chain-of-thought VLMs concentrates on specific
    fork tokens where visual claims are made. We introduce GEM-MM, extending entropy-guided preference
    modeling to VLMs. It samples on-policy candidates, rewards high-entropy reasoning forks, penalizes
    uncertain final answers, and updates the model via group-normalized policy gradients. On a 3000-prompt
    MM-RLHF budget with Qwen3-VL-4B-Instruct, GEM-MM achieves the best entropy-depth preference score
    (61.7% vs. 57.3-58.4% baselines) and implicit-reward accuracy (41.4%). Crucially, it reduces AMBER
    hallucination from 23.4-24.0 to 20.6 and CHAIR from 5.0-5.1 to 4.6 at matched caption coverage. It
    also ranks best on all three HallusionBench granularities, with a conservative operating point raising
    the near-chosen rate to 62.4%. An off-the-shelf multimodal reward model ranks GEM-MM first, and two
    such models independently confirm our main ablations (p < 0.001). We report confidence intervals,
    paired significance tests, metric-reward functional overlaps, and document a collapse mode when exceeding
    the fair budget. Code and evaluation harness: https://github.com/SNOWTEAM2023/GEM-MM'
