  abstract: Chest X-ray visual question answering (CXR VQA) requires models not only to predict correct
    answers, but also to produce reliable medical reasoning. However, existing reinforcement-learning-based
    training typically relies on answer-level rewards, which are often too coarse to improve chain-of-thought
    (CoT) quality and can become ineffective when group-level advantages collapse to zero. We propose
    \textbf{Teach-to-Reason (T2R)}, a framework that introduces comparison-based supervision into CoT
    optimization through a self-improving \emph{Teacher} and a competition-guided \emph{Reasoner}. As
    the Teacher is iteratively strengthened via self-competition, the Reasoner is optimized against progressively
    stronger Teacher-generated references. We further introduce a case-wise reward design that preserves
    the original reward-induced positive/negative partition when it is informative, and restores supervision
    from competition scores when the original reward signal degenerates. Experiments on multiple CXR open-ended
    VQA benchmarks show that T2R consistently outperforms strong baselines, indicating that comparison-based
    supervision, when integrated in a controlled and principled manner, provides a more effective training
    signal for reasoning optimization.
