  title: 'PostGAN: A GAN-Based Post-Processor to Enhance the Quality of Coded Speech'
  authors:
  - Srikanth Korse
  - Nicola Pia
  - Kishan Gupta
  - Guillaume Fuchs
  published: '2022-01-31'
  updated: '2022-01-31'
