  title: 'SR-Ground: Image Quality Grounding for Super-Resolved Content'
  authors:
  - Artem Borisov
  - Evgeney Bogatyrev
  - Khaled Abud
  - Dmitriy Vatolin
  published: '2026-05-20'
  updated: '2026-09-30'
  categories:
  - cs.CV
  abstract: Super-Resolution (SR) has advanced rapidly in recent years, with diffusion-based models achieving
    unprecedented fidelity at the cost of introducing new types of visual artifacts. While existing Image
    Quality Assessment (IQA) methods provide holistic quality scores, they lack interpretability and fail
    to distinguish between different artifact types arising from modern SR approaches. To address this
    gap, we introduce SR-Ground, a large-scale dataset specifically designed for fine-grained artifact
    segmentation in super-resolved images. The dataset comprises images processed by a diverse set of
    state-of-the-art SR models, with pixel-level annotations for multiple artifact categories. We conduct
    a large-scale crowdsourcing study involving 1,062 participants to validate and refine automatically
    generated segmentations, resulting in a highquality dataset of 63,000 images spanning 6 distinct artifact
    types. We demonstrate that training IQA models with grounding capabilities on SR-Ground significantly
    improves performance on downstream tasks. Furthermore, we introduce a fine-tuning pipeline that leverages
    our grounding model to reduce perceptible artifacts in SR outputs, showcasing the practical utility
    of our dataset. On a separate benchmark of 1,000 outputs from five unseen SR methods, an Low-Resolution-referenced
    grounding model significantly improves prominence alignment over its no-reference counterpart and
    performs best on native real-world datasets of Low-Resolution images without High-Resolution Ground-Truth.
