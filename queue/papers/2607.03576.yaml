  title: Motion Estimation Techniques for Volumetric Video Attribute Compression
  authors:
  - Haoran Hong
  - Eduardo Pavez
  - Antonio Ortega
  - Ryosuke Watanabe
  - Keisuke Nonaka
  published: '2026-07-03'
  updated: '2026-07-03'
