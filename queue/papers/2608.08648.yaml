  title: Agentic Visual Reasoning in Whole-Slide Pathology Images via Active Perception
  authors:
  - Jingyun Chen
  - Fengchun Liu
  - Linghan Cai
  - Songhan Jiang
  - Shenjin Huang
  - Hongpeng Wang
  - Lequan Yu
  - Yongbing Zhang
  published: '2026-08-09'
  updated: '2026-08-09'
