  title: 'Breaking the Barriers of One-to-One Usage of Implicit Neural Representation in Image Compression:
    A Linear Combination Approach with Performance Guarantees'
  authors:
  - Sai Sanjeet
  - Seyyedali Hosseinalipour
  - Jinjun Xiong
  - Masahiro Fujita
  - Bibhu Datta Sahoo
  published: '2024-09-19'
  updated: '2024-09-19'
