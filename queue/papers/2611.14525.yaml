  abstract: 'Large language model (LLM) agents are increasingly capable of automating end-to-end OpenFOAM
    workflows for computational fluid dynamics (CFD). However, current progress is bottlenecked by two
    critical limitations. First, existing evaluations are dominated by tutorial-level cases and execution-oriented
    metrics, masking a substantial executability--acceptability gap: successfully executed simulations
    often fail to satisfy prescribed numerical or quantity-of-interest (QoI) criteria. Second, domain
    expertise in existing systems is tightly coupled with bespoke agent architectures, limiting its reuse
    and continual refinement across agent implementations. To address these challenges, we introduce ExtFoamBench,
    a challenging benchmark for OpenFOAM agents that spans five axes of workflow variation, and separately
    assesses execution completion, numerical soundness, and QoI satisfaction. Complementing this, we propose
    EasyFoam, an agent framework that decouples CFD expertise into modular, externalized skills driven
    by a dual-loop mechanism. An execution loop constructs workflows from explicit task requirements and
    uses structured simulation evidence to diagnose failures and guide targeted repairs. Meanwhile, an
    evolution loop distills task experience into reusable skill updates selected through paired evaluation.
    Empirical evaluations demonstrate that EasyFoam achieves substantially higher task acceptance rates
    than baseline agents, establishing this work as a starting point for future research toward self-improving
    CFD agents.'
