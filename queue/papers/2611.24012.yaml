  title: 'FlyVQA: Seeing Video Frame Interpolation Quality through Fly Eyes'
  authors:
  - Baoliang Chen
  - Lingyu Zhu
  - Zhiwei Zhong
  - Shiqi Wang
  published: '2026-11-18'
  updated: '2026-11-18'
  categories:
  - cs.CV
  abstract: The ultimate ambition of visual quality assessment is to reproduce the neural computations
    of human vision and thereby achieve full alignment with human perception. However, the immense complexity
    of human visual circuitry makes this goal difficult to realize. Recently released fly visual connectomes
    provide a tractable biological starting point. Despite differences between fly and human vision, the
    fly's well-characterized motion pathways motivate us to investigate their potential for assessing
    the perceptual impact of temporal distortions. In this paper, we use a shared, frozen fly visual circuit
    to perform full-reference quality assessment of frame-interpolated videos, whose artifacts can disrupt
    temporal consistency. Specifically, compound-eye sampling maps reference and distorted sequences into
    the circuit, while a connectome-aware readout quantifies discrepancies in cell-type-specific activity
    and excitatory--inhibitory synaptic dynamics. Reference-guided temporal pooling and a lightweight
    regression head integrate these differences into a quality score. Experiments across multiple interpolation
    methods demonstrate better agreement with human ratings than CNN, RNN, and Transformer baselines with
    comparable parameters, supporting a biologically grounded approach to perceptual quality modeling.
