  abstract: Pre-training has become a standard paradigm in many computer vision tasks. However, most of
    the methods are generally designed on the RGB image domain. Due to the discrepancy between the two-dimensional
    image plane and the three-dimensional space, such pre-trained models fail to perceive spatial information
    and serve as sub-optimal solutions for 3D-related tasks. To bridge this gap, we aim to learn a spatial-aware
    visual representation that can describe the three-dimensional space and is more suitable and effective
    for these tasks. To leverage point clouds, which are much more superior in providing spatial information
    compared to images, we propose a simple yet effective 2D Image and 3D Point cloud Unsupervised pre-training
    strategy, called SimIPU. Specifically, we develop a multi-modal contrastive learning framework that
    consists of an intra-modal spatial perception module to learn a spatial-aware representation from
    point clouds and an inter-modal feature interaction module to transfer the capability of perceiving
    spatial information from the point cloud encoder to the image encoder, respectively. Positive pairs
    for contrastive losses are established by the matching algorithm and the projection matrix. The whole
    framework is trained in an unsupervised end-to-end fashion. To the best of our knowledge, this is
    the first study to explore contrastive learning pre-training strategies for outdoor multi-modal datasets,
    containing paired camera images and LIDAR point clouds. Codes and models are available at https://github.com/zhyever/SimIPU.
