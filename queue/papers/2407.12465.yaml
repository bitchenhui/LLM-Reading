  abstract: 'This paper presents an in-depth analysis of film grain handling in open-source implementations
    of the Versatile Video Coding (VVC) standard. We focus on two key components: the Film Grain Analysis
    (FGA) module implemented in VVenC and the Film Grain Synthesis (FGS) module implemented in VVdeC.
    We describe the methodologies used to implement these modules and discuss the generation of Supplementary
    Enhancement Information (SEI) parameters to signal film grain characteristics in the encoded video
    sequences. Additionally, we conduct subjective and objective evaluations across Full HD videos to
    assess the effectiveness of film grain handling. Our results demonstrate the capability of the FGA
    and FGS techniques to accurately analyze and synthesize film grain, thereby improving the visual quality
    of encoded video content. Overall, our study contributes to advancing the understanding and implementation
    of film grain handling techniques in VVC open-source implementations, with implications for enhancing
    the viewing experience in multimedia applications.'
