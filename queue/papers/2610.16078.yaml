  abstract: 'Recent advances in self-improving LLM agents have demonstrated the potential of AI systems
    that drive their own intelligence. However, many domain-specific applications rely on specialized
    foundation models that possess strong domain expertise but remain dependent on human-designed improvements.
    Extending recursive self-improvement to these models presents a key challenge: as a specialist improves,
    the strategies used to advance it must also adapt. To address this challenge, we propose Heterogeneous
    Agentic CoEvolution (HACE), a framework that jointly evolves specialized foundation models and LLM
    agents through reciprocal learning. HACE improves the specialist through supervised learning while
    training the agent with on-policy reinforced self-training, guided by verified performance gains on
    the current specialist. The agent''s exploration, in turn, informs subsequent specialist training,
    enabling both models to adapt to each other''s progress. To sustain this reciprocal learning, HACE
    further employs evolutionary search to optimize their interaction harness, adapting how the models
    exchange information and select training experiences as their capabilities evolve. We evaluate HACE
    across three challenging domains: recommendation systems, protein function prediction in biology,
    and crystal stability prediction in material discovery. We show that HACE outperforms the evaluated
    self-improving methods on the primary task metrics across all three domains. These results shed light
    on heterogeneous coevolution as a universal approach to improving specialized foundation models through
    reciprocal interaction with a learning agent.'
