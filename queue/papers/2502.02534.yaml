  title: Adaptive Self-improvement LLM Agentic System for ML Library Development
  authors:
  - Genghan Zhang
  - Weixin Liang
  - Olivia Hsu
  - Kunle Olukotun
  published: '2025-02-04'
  updated: '2025-09-19'
  categories:
  - cs.CL
  abstract: ML libraries, often written in architecture-specific programming languages (ASPLs) that target
    domain-specific architectures, are key to efficient ML systems. However, writing these high-performance
    ML libraries is challenging because it requires expert knowledge of ML algorithms and the ASPL. Large
    language models (LLMs), on the other hand, have shown general coding capabilities. However, challenges
    remain when using LLMs for generating ML libraries using ASPLs because 1) this task is complicated
    even for experienced human programmers and 2) there are limited code examples because of the esoteric
    and evolving nature of ASPLs. Therefore, LLMs need complex reasoning with limited data in order to
    complete this task. To address these challenges, we introduce an adaptive self-improvement agentic
    system. In order to evaluate the effectiveness of our system, we construct a benchmark of a typical
    ML library and generate ASPL code with both open and closed-source LLMs on this benchmark. Our results
    show improvements of up to $3.9\times$ over a baseline single LLM.
