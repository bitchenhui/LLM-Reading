  title: Learned Compression of Point Cloud Geometry and Attributes in a Single Model through Multimodal
    Rate-Control
  authors:
  - Michael Rudolph
  - Aron Riemenschneider
  - Amr Rizk
  published: '2024-08-01'
  updated: '2024-08-01'
  categories:
  - cs.CV
