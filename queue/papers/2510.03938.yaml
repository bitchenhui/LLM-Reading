  abstract: Image projection systems must be efficient in data storage, computation and transmission while
    maintaining a large space-bandwidth-product (SBP) at their output. Here, we introduce a hybrid image
    projection system that achieves extended depth-of-field (DOF) with improved resolution, combining
    a convolutional neural network (CNN)-based digital encoder with an all-optical diffractive decoder.
    A CNN-based encoder compresses input images into compact phase representations, which are subsequently
    displayed by a low-resolution (LR) projector and processed by an analog diffractive decoder for all-optical
    image reconstruction. This optical decoder is completely passive, designed to synthesize pixel super-resolved
    image projections that feature an extended DOF while eliminating the need for additional power consumption
    for super-resolved image reconstruction. Our pixel super-resolution (PSR) image projection system
    demonstrates high-fidelity image synthesis over an extended DOF of ~267xW, where W is the illumination
    wavelength, concurrently offering up to ~16-fold SBP improvement at each lateral plane. The proof
    of concept of this approach is validated through an experiment conducted in the THz spectrum, and
    the system is scalable across different parts of the electromagnetic spectrum. This image projection
    architecture can reduce data storage and transmission requirements for display systems without imposing
    additional power constraints on the optical decoder. Beyond extended DOF PSR image projection, the
    underlying principles of this approach can be extended to various applications, including optical
    metrology and microscopy.
