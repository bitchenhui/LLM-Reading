  abstract: Neural networks have dramatically increased our capacity to learn from large, high-dimensional
    datasets across innumerable disciplines. However, their decisions are not easily interpretable, their
    computational costs are high, and building and training them are not straightforward processes. To
    add structure to these efforts, we derive new mathematical results to efficiently measure the changes
    in entropy as fully-connected and convolutional neural networks process data. By measuring the change
    in entropy as networks process data effectively, patterns critical to a well-performing network can
    be visualized and identified. Entropy-based loss terms are developed to improve dense and convolutional
    model accuracy and efficiency by promoting the ideal entropy patterns. Experiments in image compression,
    image classification, and image segmentation on benchmark datasets demonstrate these losses guide
    neural networks to learn rich latent data representations in fewer dimensions, converge in fewer training
    epochs, and achieve higher accuracy.
