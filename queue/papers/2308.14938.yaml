  title: Entropy-based Guidance of Deep Neural Networks for Accelerated Convergence and Improved Performance
  authors:
  - Mackenzie J. Meni
  - Ryan T. White
  - Michael Mayo
  - Kevin Pilkiewicz
  published: '2023-08-28'
  updated: '2024-07-03'
  categories:
  - cs.CV
