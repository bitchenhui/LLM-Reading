  abstract: 'Volumetric video enables immersive free viewpoint rendering of dynamic real world scenes,
    yet existing methods struggle with long sequences and complex motions, often leading to temporal instability
    and visual artifacts. To address these challenges, we propose \ourname, a Gaussian splatting based
    framework for volumetric video reconstruction. Our key insight is that explicitly tracking long term
    complex motion with individual Gaussian primitives is inherently unstable. Instead, we organize Gaussians
    around time conditioned anchors that localize their spatial and temporal support, thereby reducing
    long range motion complexity. We further introduce a temporal windowing strategy to activate only
    anchors relevant to the queried time, which improves scalability and temporal coherence. In addition,
    to ensure spatial and temporal stability, we design a compact set of multi level anchor features that
    encode global features, local spatial features, and local temporal features, jointly constraining
    Gaussian generation. Extensive experiments demonstrate that \ourname \ consistently outperforms prior
    methods on long sequence volumetric videos with complex motions. Project page: https://github.com/WuJH2001/ATGS.'
