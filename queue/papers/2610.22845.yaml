  title: Variational and Decomposed method for Mitigating Bimodal Bias in Robust Visual Question Answering
  authors:
  - Yihan Zhao
  - Yuncheng Jiang
  published: '2026-10-16'
  updated: '2026-10-16'
  categories:
  - cs.CV
  abstract: 'Visual question answering (VQA) models are known to suffer from the bias issue, which refers
    to overfitting the regularities of frequent patterns. Previously, researchers only consider the language
    bias. Recently, the multimodal bias is noticed. However, what multimodal bias is remains unclear.
    In this paper, we investigate the multimodal bias in counting and non-counting questions. We find
    that they have distinct underlying mechanism, so their biases come from distinct reasons. We provide
    valuable interpretations of VQA counting mechanism: \textbf{quantity information stems from the magnitude
    of the multimodal features in specific dimensions.} Thus, counting bias stems from the vision side
    and propagates to multimodal features through modality fusion, while the non-counting bias stems from
    primarily language bias and slightly vision bias. Thus, we propose a method to deal with them differently:
    Variational and Decomposed method for mitigating Bimodal Bias (VDB). It extracts bimodal bias affected
    by different proportion of vision and language sides. We introduce variational bias models utilizing
    the principle of Variational Auto-Encoder to learn mainly language bias with slight vision effect,
    and a bimodal bias model for bimodal bias combining language and vision sides. Extensive experiments
    on VQACPv2, VQACPv1, and GQAOOD datasets demonstrate the rationality of our claim and the effectiveness
    of our method. We also provide explanation for the compromised performance on VQAv2.'
