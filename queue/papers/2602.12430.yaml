  abstract: 'The transition from monolithic language models to modular, skill-equipped agents marks a
    defining shift in how large language models (LLMs) are deployed in practice. Rather than encoding
    all procedural knowledge within model weights, agent skills -- composable packages of instructions,
    code, and resources that agents load on demand -- enable dynamic capability extension without retraining.
    It is formalized in a paradigm of progressive disclosure, portable skill definitions, and integration
    with the Model Context Protocol (MCP). This survey provides a comprehensive treatment of the agent
    skills landscape, as it has rapidly evolved during the last few months. We organize the field along
    four axes: (i) architectural foundations, examining the SKILL$.$md specification, progressive context
    loading, and the complementary roles of skills and MCP; (ii) skill acquisition, covering reinforcement
    learning with skill libraries, autonomous skill discovery (SEAgent), and compositional skill synthesis;
    (iii) deployment at scale, including the computer-use agent (CUA) stack, GUI grounding advances, and
    benchmark progress on OSWorld and SWE-bench; and (iv) security, where recent empirical analyses reveal
    that 26.1% of community-contributed skills contain vulnerabilities, motivating our proposed Skill
    Trust and Lifecycle Governance Framework -- a four-tier, gate-based permission model that maps skill
    provenance to graduated deployment capabilities. We identify seven open challenges -- from cross-platform
    skill portability to capability-based permission models -- and propose a research agenda for realizing
    trustworthy, self-improving skill ecosystems. Unlike prior surveys that broadly cover LLM agents or
    tool use, this work focuses specifically on the emerging skill abstraction layer and its implications
    for the next generation of agentic systems. Project repo: https://github.com/scienceaix/agentskills'
