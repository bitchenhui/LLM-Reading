  abstract: Existing real-world video super-resolution (VSR) methods focus on designing a general degradation
    pipeline for open-domain videos while ignoring data intrinsic characteristics which strongly limit
    their performance when applying to some specific domains (eg., animation videos). In this paper, we
    thoroughly explore the characteristics of animation videos and leverage the rich priors in real-world
    animation data for a more practical animation VSR model. In particular, we propose a multi-scale Vector-Quantized
    Degradation model for animation video Super-Resolution (VQD-SR) to decompose the local details from
    global structures and transfer the degradation priors in real-world animation videos to a learned
    vector-quantized codebook for degradation modeling. A rich-content Real Animation Low-quality (RAL)
    video dataset is collected for extracting the priors. We further propose a data enhancement strategy
    for high-resolution (HR) training videos based on our observation that existing HR videos are mostly
    collected from the Web which contains conspicuous compression artifacts. The proposed strategy is
    valid to lift the upper bound of animation VSR performance, regardless of the specific VSR model.
    Experimental results demonstrate the superiority of the proposed VQD-SR over state-of-the-art methods,
    through extensive quantitative and qualitative evaluations of the latest animation video super-resolution
    benchmark. The code and pre-trained models can be downloaded at https://github.com/researchmm/VQD-SR.
