  - cs.CV
  abstract: Visual grounding in documents is a crucial ability for Large Multimodal Models (LMMs) in areas
    such as document understanding, deep research and document error detection. However, existing approaches
    exhibit poor grounding precision in text-rich document images, often failing to accurately locate
    the critical document elements needed for reliable reasoning. To address this gap, we introduce PreciseDoc,
    an LMM specifically designed for precise element grounding and can be further optimized for Document
    VQA tasks. Specifically, to enhance the basic localization capability, we construct challenging training
    data by two pipelines capable of mass-producing high-quality documents with paired metadata of fine-grained
    coordinates, including synthetic hand-filled documents with camera effects. The model develops more
    real-world functions beyond straightforward localization of single text, such as locating personal
    information from CVs. Furthermore, we introduce a training paradigm for visual grounded reasoning
    where the grounding and reasoning are supervised jointly with reinforcement learning to improve the
    contribution of the grounded evidence. A comprehensive evaluation on various benchmarks demonstrates
    the advantage of the proposed data and methods in document spatial grounding and document understanding.
