  abstract: The Alliance for Open Media (AOMedia) has developed the AV2 video coding standard to supersede
    AV1, aiming for substantial compression efficiency gains across diverse media applications. This paper
    details the quality and performance evaluation methodology defined in the AV2 Common Test Conditions
    (CTC), which introduces new evaluation methods and content, including convex-hull-based adaptive streaming
    (AS) configuration, user-generated content (UGC), and extended chroma formats. We present the coding
    gains of the AV2 (v13.0) against the AV1 baseline. Experimental results show that AV2 achieves significant
    Bjøntegaard-Delta Rate (BD-rate) reductions of 29.81\% and 33.79\% for PSNR-YUV and VMAF, respectively,
    under random access configuration, validating the efficiency of AV2 for next-generation streaming
    applications.
