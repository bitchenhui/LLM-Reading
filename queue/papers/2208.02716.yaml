  abstract: This document describes a deep learning-based point cloud geometry codec and a deep learning-based
    point cloud joint geometry and colour codec, submitted to the Call for Proposals on JPEG Pleno Point
    Cloud Coding issued in January 2022. The proposed codecs are based on recent developments in deep
    learning-based PC geometry coding and offer some of the key functionalities targeted by the Call for
    Proposals. The proposed geometry codec offers a compression efficiency that outperforms the MPEG G-PCC
    standard and outperforms or is competitive with the V-PCC Intra standard for the JPEG Call for Proposals
    test set; however, the same does not happen for the joint geometry and colour codec due to a quality
    saturation effect that needs to be overcome.
