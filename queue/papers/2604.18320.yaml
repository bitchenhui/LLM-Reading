  title: 'EVE: Verifiable Self-Evolution of MLLMs via Executable Visual Transformations'
  authors:
  - Yongrui Heng
  - Chaoya Jiang
  - Han Yang
  - Shikun Zhang
  - Wei Ye
  published: '2026-04-20'
  updated: '2026-04-20'
  categories:
