  title: 'EG-VQA: Benchmarking Verifiable Video Question Answering with Grounded Temporal Evidence'
  authors:
  - Linpeng Huang
  - Weixing Chen
  - Zexin Chen
  - Yang Liu
  - Liang Lin
  published: '2026-06-23'
  updated: '2026-10-04'
  categories:
  - cs.CV
