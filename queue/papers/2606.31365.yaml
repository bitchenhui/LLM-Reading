  title: 'Beyond Cross-Reconstruction: Probing-Based Disentanglement Evaluation for Acoustic Teleportation
    Codecs'
  authors:
  - Philipp Grundhuber
  - Emanuël A. P. Habets
  published: '2026-06-30'
  updated: '2026-06-30'
  categories:
  - eess.AS
