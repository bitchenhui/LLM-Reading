  title: Bitstream Organization for Parallel Entropy Coding on Neural Network-based Video Codecs
  authors:
  - Amir Said
  - Hoang Le
  - Farzad Farhadzadeh
  published: '2023-12-01'
  updated: '2023-12-01'
