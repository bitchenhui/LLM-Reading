  title: 'Semantic and Visual Evidence for Efficient Long-Video Reasoning: A Solution for the HD-EPIC
    VQA Challenge'
  authors:
  - Yinsong Xu
  - Wei Jing
  - Liuxin Zhang
  - Wanjun Lv
  - Hui Li
  published: '2026-05-28'
  updated: '2026-05-28'
