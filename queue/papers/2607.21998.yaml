  title: 'Medical-Checklist: Assessing the Comprehension of Medical Images by Multimodal Models'
  authors:
  - Bannapol Limanond
  - Masanori Suganuma
  - Takayuki Okatani
  published: '2026-07-24'
  updated: '2026-07-24'
  categories:
  - cs.CV
  abstract: 'This paper introduces a new benchmark test, Medical-Checklist, for assessing medical multimodal
    models. The recent advancements in multimodal models have demonstrated significant potential in the
    field of medical vision-language tasks. However, it is becoming increasingly clear that evaluating
    these models'' performance, whether they are applied to natural or medical images, is challenging.
    The critical question is whether the models can accurately understand an input image while associating
    it with relevant input text. To address this, Medical-Checklist imposes a binary test on the models:
    they are given an image and two captions, where one is correct and the other incorrect, and the model
    must select the correct one. The incorrect caption contains a single medical concept (word or phrase)
    that is inaccurately substituted from the correct caption. Although the task is simple, this simplicity
    enables the unified assessment of diverse multimodal models designed and learned on different principles.
    It also enables us to verify whether models correctly understand a wide range of medical concepts
    across various medical sub-domains. Medical-Checklist is designed to reduce potential biases in data
    and to enable evaluation of the models'' ability to handle out-of-distribution inputs, which were
    difficult in existing datasets. When evaluating four state-of-the-art medical multimodal models with
    Medical-Checklist, it was revealed that despite their excellent performance in specific tasks such
    as Med-VQA, they may not correctly understand images, suggesting a long journey ahead for clinical
    application. The dataset and code will be made public upon acceptance.'
