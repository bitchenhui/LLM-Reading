  abstract: Compressed Sensing MRI reconstructs images of the body's internal anatomy from undersampled
    measurements, thereby reducing scan time. Recently, deep learning has shown great potential for reconstructing
    high-fidelity images from highly undersampled measurements. However, one needs to train multiple models
    for different undersampling patterns and desired output image resolutions, since most networks operate
    on a fixed discretization. Such approaches are highly impractical in clinical settings, where undersampling
    patterns and image resolutions are frequently changed to accommodate different real-time imaging and
    diagnostic requirements. We propose a unified MRI reconstruction model robust to various measurement
    undersampling patterns and image resolutions. Our approach uses neural operators, a discretization-agnostic
    architecture applied in both image and measurement spaces, to capture local and global features. Empirically,
    our model improves SSIM by 11% and PSNR by 4 dB over a state-of-the-art CNN (End-to-End VarNet), with
    600$\times$ faster inference than diffusion methods. The resolution-agnostic design also enables zero-shot
    super-resolution and extended field-of-view reconstruction, offering a versatile and efficient solution
    for clinical MR imaging. Our unified model offers a versatile solution for MRI, adapting seamlessly
    to various measurement undersampling and imaging resolutions, making it highly effective for flexible
    and reliable clinical imaging. Our code is available at https://armeet.ca/nomri.
