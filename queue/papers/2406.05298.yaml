  - eess.AS
  abstract: Historically, most speech models in machine-learning have used the mel-spectrogram as a speech
    representation. Recently, discrete audio tokens produced by neural audio codecs have become a popular
    alternate speech representation for speech synthesis tasks such as text-to-speech (TTS). However,
    the data distribution produced by such codecs is too complex for some TTS models to predict, typically
    requiring large autoregressive models to get good quality. Most existing audio codecs use Residual
    Vector Quantization (RVQ) to compress and reconstruct the time-domain audio signal. We propose a spectral
    codec which uses Finite Scalar Quantization (FSQ) to compress the mel-spectrogram and reconstruct
    the time-domain audio signal. A study of objective audio quality metrics and subjective listening
    tests suggests that our spectral codec has comparable perceptual quality to equivalent audio codecs.
    We show that FSQ, and the use of spectral speech representations, can both improve the performance
    of parallel TTS models.
