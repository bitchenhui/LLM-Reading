  abstract: Spoken language models (SLMs) have gained increasing attention with advancements in text-based,
    decoder-only language models. SLMs process text and speech, enabling simultaneous speech understanding
    and generation. This paper presents Double-Codebook Speaker-invariant Clustering (DC-Spin), which
    aims to improve speech tokenization by bridging audio signals and SLM tokens. DC-Spin extracts speaker-invariant
    tokens rich in phonetic information and resilient to input variations, enhancing zero-shot SLM tasks
    and speech resynthesis. We propose a chunk-wise approach to enable streamable DC-Spin without retraining
    and degradation. Comparisons of tokenization methods (self-supervised and neural audio codecs), model
    scalability, and downstream task proxies show that tokens easily modeled by an n-gram LM or aligned
    with phonemes offer strong performance, providing insights for designing speech tokenizers for SLMs.
