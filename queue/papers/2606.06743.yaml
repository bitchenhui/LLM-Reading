  abstract: 'The popularity of neural audio codecs as speech tokenizers has surged with the advent of
    Multimodal Large Language Models. New codec architectures with semantic and acoustic disentanglement
    have emerged. There are two main approaches to introduce semantic information into codec models: one
    distills semantic information from SSL representations into the first RVQ layer, while the other maintains
    separate streams for semantic and acoustic features. We propose HybridCodec, a unified architecture
    that combines both paradigms. It employs separate semantic and acoustic branches while distilling
    SSL representations into the semantic stream. This design ensures strong disentanglement without requiring
    an SSL model during inference. HybridCodec shows superior semantic specialization (RVQ-1) on in-domain
    test set and competitive reconstruction (RVQ-all). We demonstrate its robustness in out-of-domain
    and zero-shot cross-lingual settings, achieving a 3x speedup over existing dual-stream models.'
