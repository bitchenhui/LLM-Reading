  title: 'MSNeRV: Neural Video Representation with Multi-Scale Feature Fusion'
  authors:
  - Jun Zhu
  - Xinfeng Zhang
  - Lv Tang
  - JunHao Jiang
  published: '2025-06-18'
  updated: '2025-06-18'
