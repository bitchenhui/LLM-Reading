  abstract: We study online alignment of large language models under misspecified preference feedback,
    where the observed preference oracle deviates from an ideal but unknown ground-truth oracle. The online
    LLM alignment problem is a bi-level reinforcement problem due to the coupling between data collection
    and policy updates. Recently, the problem has been reduced to a tractable single-level objective in
    the SAIL (Self-Improving Efficient Online Alignment) framework. In this paper, we introduce a pointwise
    oracle uncertainty set in this problem and formulate an oracle-robust online alignment objective as
    a worst-case optimization problem. For log-linear policies, we show that this robust objective admits
    an exact closed-form decomposition into the original loss function plus an explicit sensitivity penalty.
    In the finite-response log-linear setting, we develop projected stochastic composite updates for the
    resulting weakly convex objective and prove $\widetilde{O}(\varepsilon^{-2})$ oracle complexity for
    reaching approximate stationarity.
