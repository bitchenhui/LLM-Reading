  title: 'Listening and Seeing Again: Generative Error Correction for Audio-Visual Speech Recognition'
  authors:
  - Rui Liu
  - Hongyu Yuan
  - Haizhou Li
  published: '2025-01-03'
  updated: '2025-01-03'
