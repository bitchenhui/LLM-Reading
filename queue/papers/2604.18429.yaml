  title: Revisiting Change VQA in Remote Sensing with Structured and Native Multimodal Qwen Models
  authors:
  - Yakoub Bazi
  - Mohamad M. Al Rahhal
  - Mansour Zuair
  - Faroun Mohamed
  published: '2026-04-20'
  updated: '2026-04-20'
  categories:
  - cs.CV
