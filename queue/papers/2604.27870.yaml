  title: Parameter-Efficient Architectural Modifications for Translation-Invariant CNNs
  authors:
  - Nuria Alabau-Bosque
  - Jorge Vila-Tomas
  - Paula Dauden-Oliver
  - Valero Laparra
  - Jesus Malo
  published: '2026-04-30'
  updated: '2026-04-30'
