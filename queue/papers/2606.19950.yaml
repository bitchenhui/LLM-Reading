  abstract: Multimodal Large Language Models (MLLMs) show great potential in medical tasks, but their
    elicited confidence often misaligns with actual accuracy, potentially leading to misdiagnosis or overlooking
    correct advice. This study presents the first comprehensive analysis of the relationship between accuracy
    and confidence in medical MLLMs. It proposes a novel method that combines Multi-Strategy Fusion-Based
    Interrogation (MS-FBI) with auxiliary expert LLM assessment, aiming to improve confidence calibration
    in Medical Visual Question Answering (VQA). Experiments demonstrate that our method reduces the Expected
    Calibration Error (ECE) by an average of 40\% across three Medical VQA datasets, significantly enhancing
    MLLMs' reliability. The findings highlight the importance of domain-specific calibration for MLLMs
    in healthcare, offering a more trustworthy solution for AI-assisted diagnosis.
