  abstract: In this work, we study the task of Audio Language Modeling, in which we aim at learning probabilistic
    models for audio that can be used for generation and completion. We use a state-of-the-art perceptually-guided
    audio compression model, to encode audio to discrete representations. Next, we train a transformer-based
    causal language model using these representations. At inference time, we perform audio auto-completion
    by encoding an audio prompt as a discrete sequence, feeding it to the audio language model, sampling
    from the model, and synthesizing the corresponding time-domain signal. We evaluate the quality of
    samples generated by our method on Audioset, the largest dataset for general audio to date, and show
    that it is superior to the evaluated baseline audio encoders. We additionally provide an extensive
    analysis to better understand the trade-off between audio-quality and language-modeling capabilities.
