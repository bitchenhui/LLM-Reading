  abstract: Recent spatial self supervised audio models achieve high performance on localization tasks,
    raising questions about their encoding of microsecond interaural phase fine structures. We propose
    a psychoacoustic benchmark based on the binaural masking level difference to evaluate this. Using
    an equalization cancellation baseline and a GCC PHAT positive control we evaluate nine frozen audio
    models spanning binaural SSL, monaural SSL, and neural audio codecs. Four monaural negative controls
    yield zero BMLD confirming binaural specificity. Two general purpose binaural SSL models exhibit minimal
    phase sensitivity while dedicated binaural spatial SSL models achieve BMLD comparable to the analytical
    baseline. Progressive physical ablations show that general purpose binaural SSL models rely on spectro
    temporal interference textures rather than cross channel phase computation. High detection rates in
    speech reflect a confounding reliance on broadband envelopes rather than genuine phase encoding.
