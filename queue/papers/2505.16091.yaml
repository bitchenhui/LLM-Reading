  abstract: Pretrained latent diffusion models have shown strong potential for lossy image compression,
    owing to their powerful generative priors. Most existing diffusion-based methods reconstruct images
    by iteratively denoising from random noise, guided by compressed latent representations. While these
    approaches have achieved high reconstruction quality, their multi-step sampling process incurs substantial
    computational overhead. Moreover, they typically require training separate models for different compression
    bit-rates, leading to significant training and storage costs. To address these challenges, we propose
    a one-step diffusion codec across multiple bit-rates. termed OSCAR. Specifically, our method views
    compressed latents as noisy variants of the original latents, where the level of distortion depends
    on the bit-rate. This perspective allows them to be modeled as intermediate states along a diffusion
    trajectory. By establishing a mapping from the compression bit-rate to a pseudo diffusion timestep,
    we condition a single generative model to support reconstructions at multiple bit-rates. Meanwhile,
    we argue that the compressed latents retain rich structural information, thereby making one-step denoising
    feasible. Thus, OSCAR replaces iterative sampling with a single denoising pass, significantly improving
    inference efficiency. Extensive experiments demonstrate that OSCAR achieves superior performance in
    both quantitative and visual quality metrics. The code and models are available at https://github.com/jp-guo/OSCAR.
