  title: Feedback-Driven Rate Control for Learned Video Compression
  authors:
  - Zhiheng Xu
  - Xuerui Ma
  - Chunhua Peng
  - Hao Zhang
  published: '2026-04-22'
  updated: '2026-04-22'
