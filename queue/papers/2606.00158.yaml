  abstract: Continuous variable-rate compression is highly demanded in real-world applications, but remains
    underexplored in scalable image coding for humans and machines. In this paper, we propose a training-free
    variable-rate scalable image coding framework. By adaptively adjusting quantization step sizes based
    on predicted scale values, the proposed method enables independent and continuous bitrate control
    for the machine and enhancement layers while preserving important latent information in each layer.
    Experimental results demonstrate the effectiveness of the proposed method and highlight the importance
    of bitrate allocation between the two layers.
