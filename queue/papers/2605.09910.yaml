  title: 'CloudEmu: A Trace-Driven Cloud-Native Emulation Testbed for Vehicle Video Uplink over Cellular
    Networks'
  authors:
  - Takashi Torii
  - Soto Anno
  - Masaki Okada
  - Takuma Tsubaki
  - Nobuhiro Azuma
  - Takuya Tojo
  published: '2026-05-11'
  updated: '2026-05-11'
