  title: 'Bridging the Perceptual Gap: Residual-Enhanced Downscaling and Manifold-Aware Perception Alignment
    Adaptation for NR-IQA'
  authors:
  - Yu Li
  - Zhengran Shen
  - Yachun Mi
  - Puchao Zhou
  - Shaohui Liu
  published: '2026-09-15'
  updated: '2026-09-15'
