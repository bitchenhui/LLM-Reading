  title: 'InfraQR: Edge-Placed QR-Inspired Structured Patch Attacks on Infrared Vision-Language Models'
  authors:
  - Xin Li
  - Jiaju Han
  - Ma Yaqi
  - Chengyin Hu
  - Yingying Zhao
  - Jiahuan Long
  - Fengyu Zhang
  - Yahui Chai
  published: '2026-07-08'
