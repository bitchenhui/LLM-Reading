  abstract: In recent years, there has been a growing focus on fairness and inclusivity within speech
    technology, particularly in areas such as automatic speech recognition and speech sentiment analysis.
    When audio is transcoded prior to processing, as is the case in streaming or real-time applications,
    any inherent bias in the coding mechanism may result in disparities. This not only affects user experience
    but can also have broader societal implications by perpetuating stereotypes and exclusion. Thus, it
    is important that audio coding mechanisms are unbiased. In this work, we contribute towards the scarce
    research with respect to language and gender biases of audio codecs. By analyzing the speech quality
    of over 2 million multilingual audio files after transcoding through a representative subset of codecs
    (PSTN, VoIP and neural), our results indicate that PSTN codecs are strongly biased in terms of gender
    and that neural codecs introduce language biases.
