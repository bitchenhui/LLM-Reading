  abstract: The Low-Resource Audio Codec (LRAC) Challenge aims to advance neural audio coding for deployment
    in resource-constrained environments. The first edition focuses on low-resource neural speech codecs
    that must operate reliably under everyday noise and reverberation, while satisfying strict constraints
    on computational complexity, latency, and bitrate. Track 1 targets transparency codecs, which aim
    to preserve the perceptual transparency of input speech under mild noise and reverberation. Track
    2 addresses enhancement codecs, which combine coding and compression with denoising and dereverberation.
    This paper presents the official baseline systems for both tracks in the 2025 LRAC Challenge. The
    baselines are convolutional neural codec models with Residual Vector Quantization, trained end-to-end
    using a combination of adversarial and reconstruction objectives. We detail the data filtering and
    augmentation strategies, model architectures, optimization procedures, and checkpoint selection criteria.
