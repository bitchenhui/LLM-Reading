  abstract: The primary challenge in accelerating image super-resolution lies in reducing computation
    while maintaining performance and adaptability. Motivated by the observation that high-frequency regions
    (e.g., edges and textures) are most critical for reconstruction, we propose a training-free adaptive
    masking module for acceleration that dynamically focuses computation on these challenging areas. Specifically,
    our method first extracts high-frequency components via Gaussian blur subtraction and adaptively generates
    binary masks using K-means clustering to identify regions requiring intensive processing. Our method
    can be easily integrated with both CNNs and Transformers. For CNN-based architectures, we replace
    standard $3 \times 3$ convolutions with an unfold operation followed by $1 \times 1$ convolutions,
    enabling pixel-wise sparse computation guided by the mask. For Transformer-based models, we partition
    the mask into non-overlapping windows and selectively process tokens based on their average values.
    During inference, unnecessary pixels or windows are pruned, significantly reducing computation. Moreover,
    our method supports dilation-based mask adjustment to control the processing scope without retraining,
    and is robust to unseen degradations (e.g., noise, compression). Extensive experiments on benchmarks
    demonstrate that our method reduces FLOPs by 24--43% for state-of-the-art models (e.g., CARN, SwinIR)
    while achieving comparable or better quantitative metrics. The source code is available at https://github.com/shangwei5/AMSR
