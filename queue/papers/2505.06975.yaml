  title: High-Frequency Prior-Driven Adaptive Masking for Accelerating Image Super-Resolution
  authors:
  - Wei Shang
  - Dongwei Ren
  - Wanying Zhang
  - Pengfei Zhu
  - Qinghua Hu
  - Wangmeng Zuo
  published: '2025-05-11'
  updated: '2025-05-11'
