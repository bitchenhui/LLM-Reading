  abstract: As large engineering efforts go towards improving the resolution of mobile, AR and VR displays,
    it is important to know the maximum resolution at which further improvements bring no noticeable benefit.
    This limit is often referred to as the "retinal resolution", although the limiting factor may not
    necessarily be attributed to the retina. To determine the ultimate resolution at which an image appears
    sharp to our eyes with no perceivable blur, we created an experimental setup with a sliding display,
    which allows for continuous control of the resolution. The lack of such control was the main limitation
    of the previous studies. We measure achromatic (black-white) and chromatic (red-green and yellow-violet)
    resolution limits for foveal vision, and at two eccentricities (10 and 20 deg). Our results demonstrate
    that the resolution limit is higher than what was previously believed, reaching 94 pixels-per-degree
    (ppd) for foveal achromatic vision, 89 ppd for red-green patterns, and 53 ppd for yellow-violet patterns.
    We also observe a much larger drop in the resolution limit for chromatic patterns (red-green and yellow-violet)
    than for achromatic. Our results set the north star for display development, with implications for
    future imaging, rendering and video coding technologies.
