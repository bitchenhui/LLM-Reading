  title: 'DocIntent: Answerability-Guided Agentic Restoration for Real-World Document Visual Question
    Answering'
  authors:
  - Zihan Huang
  - Shihang Wu
  - Junle Liu
  - Peirong Zhang
  - Yongxin Shi
  - Xuhan Zheng
  - Lianwen Jin
  published: '2026-08-29'
  updated: '2026-08-29'
