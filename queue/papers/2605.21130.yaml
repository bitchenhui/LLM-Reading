  title: 'VersusQ: Pairwise Margin Reasoning for Generalizable Video Quality Assessment'
  authors:
  - Shibei Meng
  - Binxin Yang
  - Yuan Liu
  - Jiexuan Zhang
  - Zhengyao Lv
  - Hubery Yin
  - Qiang Xu
  published: '2026-05-20'
  updated: '2026-05-20'
