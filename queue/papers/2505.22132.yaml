  abstract: The proliferation of Extended Reality (XR) applications, requiring high-quality, low-latency
    media streaming, has driven the demand for efficient remote rendering solutions. This paper focuses
    on holographic conferencing in virtual environments and their required uplink and downlink media transmission
    capabilities. By examining Media over QUIC (MoQ), Real-time Transport Protocol (RTP) over QUIC (RoQ),
    and Web Real-Time Communication (WebRTC), we assess their latency performance over Wi-Fi and 5G networks.
    Improvements of approximately 30% in latency and 60% in connection startup are expected in QUIC-based
    protocols compared to WebRTC. The experimental setup transmits a remote-rendered virtual experience
    using real-time video streaming protocols to provide the content to the participant. Our findings
    contribute to understanding the maturity of streaming protocols, particularly within open-source frameworks,
    and evaluate their suitability in supporting latency-sensitive XR applications. The study highlights
    specific protocol advantages across varied remote rendering scenarios, informing the design of future
    XR communication solutions.
