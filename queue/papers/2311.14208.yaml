  title: 'ECRF: Entropy-Constrained Neural Radiance Fields Compression with Frequency Domain Optimization'
  authors:
  - Soonbin Lee
  - Fangwen Shu
  - Yago Sanchez
  - Thomas Schierl
  - Cornelius Hellge
  published: '2023-11-23'
  updated: '2023-11-23'
