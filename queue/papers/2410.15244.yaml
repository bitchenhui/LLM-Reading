  abstract: The discrete cosine transform (DCT) is a central tool for image and video coding because it
    can be related to the Karhunen-Loève transform (KLT), which is the optimal transform in terms of retained
    transform coefficients and data decorrelation. In this paper, we introduce 16-, 32-, and 64-point
    low-complexity DCT approximations by minimizing individually the angle between the rows of the exact
    DCT matrix and the matrix induced by the approximate transforms. According to some classical figures
    of merit, the proposed transforms outperformed the approximations for the DCT already known in the
    literature. Fast algorithms were also developed for the low-complexity transforms, asserting a good
    balance between the performance and its computational cost. Practical applications in image encoding
    showed the relevance of the transforms in this context. In fact, the experiments showed that the proposed
    transforms had better results than the known approximations in the literature for the cases of 16,
    32, and 64 blocklength.
