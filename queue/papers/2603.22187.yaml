  title: 'Seeing is Improving: Visual Feedback for Iterative Text Layout Refinement'
  authors:
  - Junrong Guo
  - Shancheng Fang
  - Yadong Qu
  - Hongtao Xie
  published: '2026-03-23'
  updated: '2026-03-23'
