  title: 'PDStream: Slashing Long-Tail Delay in Interactive Video Streaming via Pseudo-Dual Streaming'
  authors:
  - Xuedou Xiao
  - Yingying Zuo
  - Mingxuan Yan
  - Kezhong Liu
  - Wei Wang
  published: '2025-02-07'
  updated: '2025-02-07'
  categories:
  - cs.MM
