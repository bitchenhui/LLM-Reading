  title: Super Efficient Neural Network for Compression Artifacts Reduction and Super Resolution
  authors:
  - Wen Ma
  - Qiuwen Lou
  - Arman Kazemi
  - Julian Faraone
  - Tariq Afzal
  published: '2024-01-26'
