  abstract: Diffusion models (DMs) are generative models that learn to synthesize images from Gaussian
    noise. DMs can be trained to do a variety of tasks such as image generation and image super-resolution.
    Researchers have made significant improvements in the capability of synthesizing photorealistic images
    in the past few years. These successes also hasten the need to address the potential misuse of synthesized
    images. In this paper, we highlighted the effectiveness of Bayer pattern and local statistics in distinguishing
    digital camera images from DM-generated images. We further hypothesized that local statistics should
    be used to address the spatial non-stationarity problems in images. We showed that our approach produced
    promising results for distinguishing real images from synthesized images. This approach is also robust
    to various perturbations such as image resizing and JPEG compression.
