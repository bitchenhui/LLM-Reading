  abstract: Since LIC has made rapid progress recently compared to traditional methods, this paper attempts
    to discuss the question about 'Where is the boundary of Learned Image Compression(LIC)?'. Thus this
    paper splits the above problem into two sub-problems:1)Where is the boundary of rate-distortion performance
    of PSNR? 2)How to further improve the compression gain and achieve the boundary? Therefore this paper
    analyzes the effectiveness of scaling parameters for encoder, decoder and context model, which are
    the three components of LIC. Then we conclude that scaling for LIC is to scale for context model and
    decoder within LIC. Extensive experiments demonstrate that overfitting can actually serve as an effective
    context. By optimizing the context, this paper further improves PSNR and achieves state-of-the-art
    performance, showing a performance gain of 14.39% with BD-RATE over VVC.
