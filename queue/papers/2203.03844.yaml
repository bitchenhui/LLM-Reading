  title: Dynamic Dual Trainable Bounds for Ultra-low Precision Super-Resolution Networks
  authors:
  - Yunshan Zhong
  - Mingbao Lin
  - Xunchao Li
  - Ke Li
  - Yunhang Shen
  - Fei Chao
  - Yongjian Wu
  - Rongrong Ji
  published: '2022-03-08'
  updated: '2022-07-04'
