  abstract: Amphion is an open-source toolkit for Audio, Music, and Speech Generation, designed to lower
    the entry barrier for junior researchers and engineers in these fields. It provides a versatile framework
    that supports a variety of generation tasks and models. In this report, we introduce Amphion v0.2,
    the second major release developed in 2024. This release features a 100K-hour open-source multilingual
    dataset, a robust data preparation pipeline, and novel models for tasks such as text-to-speech, audio
    coding, and voice conversion. Furthermore, the report includes multiple tutorials that guide users
    through the functionalities and usage of the newly released models.
