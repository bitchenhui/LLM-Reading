  title: Label-Free Cross-Task LoRA Merging with Null-Space Compression
  authors:
  - Wonyoung Lee
  - Wooseong Jeong
  - Kuk-Jin Yoon
  published: '2026-03-27'
  updated: '2026-03-27'
