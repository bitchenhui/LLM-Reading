  title: Content-Driven Frame-Level Bit Prediction for Rate Control in Versatile Video Coding
  authors:
  - Amritha Premkumar
  - Prajit T Rajendran
  - Vignesh V Menon
  - Christian Herglotz
  published: '2026-02-05'
  updated: '2026-02-05'
