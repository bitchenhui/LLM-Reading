  abstract: This chapter briefky describes a study on software defined networks and the tools necessary
    for video transmission on this type of networks. Among the aspects presented is the methodology used
    to establish the video transmission and the procedure to evaluate the quality obtained. A video transmission
    experiment is presented, which consists on the evaluation of adaptive transmission of video streams
    using adaptive techniques as MPEG/DASH and scalable coding. The experiments were carried out over
    a software defined network topology in the MININET Platform
