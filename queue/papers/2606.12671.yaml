  title: 'SalArt-VQA: Diagnosing Whether VLMs Understand Salient Artifacts in Generated Images'
  authors:
  - Ruotian Zhang
  - Xiaoxiao Sun
  - Junzhe Huang
  - James Burgess
  - Serena Yeung-Levy
  published: '2026-06-10'
  updated: '2026-10-06'
