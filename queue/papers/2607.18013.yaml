  abstract: This paper introduces a method for real-time processing and transmission of autonomous underwater
    vehicle (AUV) imagery over low-bandwidth communication links. It leverages artificial intelligence
    (AI) techniques to identify a set of images that best represent an entire dataset, or automatically
    finds the most similar images to a given query image for transmission to operators. Combined with
    metadata of a larger set of images, compressed versions of the selected images can be transmitted
    over satellite communication links or underwater modems, and provide operators on shore with information
    about the type of imagery the AUV is collecting while it is still deployed. Data from three deployments
    off the coast of the UK and in Gran Canaria using different AUVs and imaging systems demonstrate the
    method in the field. It achieved an almost 400,000-fold reduction in data volume compared to the raw
    data size, enabling transmission of data summaries of a 2-hour 47-minute-long mapping mission in just
    over 34 minutes over low-bandwidth satellite communication.
