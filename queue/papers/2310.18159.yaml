  title: 'DESiRED -- Dynamic, Enhanced, and Smart iRED: A P4-AQM with Deep Reinforcement Learning and
    In-band Network Telemetry'
  authors:
  - Leandro C. de Almeida
  - Washington Rodrigo Dias da Silva
  - Thiago C. Tavares
  - Rafael Pasquini
  - Chrysa Papagianni
  - Fábio L. Verdi
