  abstract: This paper explores the integration of model-based and data-driven approaches within the realm
    of neural speech and audio coding systems. It highlights the challenges posed by the subjective evaluation
    processes of speech and audio codecs and discusses the limitations of purely data-driven approaches,
    which often require inefficiently large architectures to match the performance of model-based methods.
    The study presents hybrid systems as a viable solution, offering significant improvements to the performance
    of conventional codecs through meticulously chosen design enhancements. Specifically, it introduces
    a neural network-based signal enhancer designed to post-process existing codecs' output, along with
    the autoencoder-based end-to-end models and LPCNet--hybrid systems that combine linear predictive
    coding (LPC) with neural networks. Furthermore, the paper delves into predictive models operating
    within custom feature spaces (TF-Codec) or predefined transform domains (MDCTNet) and examines the
    use of psychoacoustically calibrated loss functions to train end-to-end neural audio codecs. Through
    these investigations, the paper demonstrates the potential of hybrid systems to advance the field
    of speech and audio coding by bridging the gap between traditional model-based approaches and modern
    data-driven techniques.
