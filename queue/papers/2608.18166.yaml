  title: 'TractoGraphVLM: A Unified Vision-Language Framework for White Matter Tractography'
  authors:
  - Gurucharan Marthi Krishna Kumar
  - Janine Dale Mendola
  - Amir Shmuel
  published: '2026-08-16'
  updated: '2026-08-16'
  categories:
