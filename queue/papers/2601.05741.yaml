  title: 'ViTNT-FIQA: Training-Free Face Image Quality Assessment with Vision Transformers'
  authors:
  - Guray Ozgur
  - Eduarda Caldeira
  - Tahar Chettaoui
  - Jan Niklas Kolf
  - Marco Huber
  - Naser Damer
  - Fadi Boutros
