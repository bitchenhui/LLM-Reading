  abstract: As immersive eXtended Reality (XR) applications demand substantial network resources, understanding
    their interaction with 5G networks becomes crucial to improve them. This paper investigates the role
    of 5G physical-layer monitoring to manage and enhance the remote rendering of XR content dynamically.
    By observing network metrics directly from the physical layer, we propose a system to adapt streaming
    parameters such as bitrate, framerate, and resolution in real time based on available network capacity.
    Using theoretical formulas to estimate maximum data rate, our approach evaluates network resource
    availability, enabling the renderer to self-adjust media content representation. This is critical
    for providing consistent and smooth XR experiences to users, especially as network conditions fluctuate.
    Our findings suggest that physical-layer monitoring offers valuable insights to increase the Quality
    of Service (QoS) and has the potential to elevate user experience in remote-rendered XR applications.
