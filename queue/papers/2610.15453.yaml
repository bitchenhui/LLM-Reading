  abstract: 'Neural audio codecs achieve remarkable performance but operate as closed ecosystems with
    rigidly co-trained encoderdecoder pairs, severely hindering interoperability. To resolve this, we
    propose BridgeCodec, a versatile framework that decouples these pairs by translating latent representations
    between mismatched, frozen endpoints. We formulate this cross-codec translation as a Schrödinger Bridge
    optimal transport problem, enabling robust mapping between disparate distributions without predefined
    noise priors. To efficiently capture longrange speech temporal dependencies, we integrate a Mambaenhanced
    U-Net architecture. We validate BridgeCodec on an extreme deployment scenario: mapping a lightweight
    8 kHz source encoder directly to a 48 kHz target decoder at an ultralow bitrate of 1 kbps. Experimental
    results demonstrate that BridgeCodec achieves superior wideband reconstruction and high perceptual
    quality, successfully bridging heavily bottlenecked, heterogeneous codecs.'
