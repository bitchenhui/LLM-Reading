  title: 'StableCodec: Taming One-Step Diffusion for Extreme Image Compression'
  authors:
  - Tianyu Zhang
  - Xin Luo
  - Li Li
  - Dong Liu
  published: '2025-06-27'
  updated: '2025-06-27'
