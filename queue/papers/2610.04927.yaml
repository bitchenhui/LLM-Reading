  abstract: 'Agentic machine learning engineering (MLE) is an emerging AI4SE application for complex ML
    tasks and a step toward recursive self-improvement of AI systems. Recent agentic MLE systems show
    the value of leveraging insights from related MLE tasks: some systems condition code generation on
    expert domain knowledge, which is implicitly curated from peer MLE tasks; some systems have a loop
    of solving an MLE task, gathering memory to benefit future tasks. However, insight collection and
    injection remain ad hoc, and existing evaluations often do not control insight sources, making data
    leakage a threat to validity. To close these gaps, we systematically study how insights from related
    MLE tasks affect agentic MLE systems, and how their impact depends on insight type and injection method.
    We introduce MLE-InsightBench, a benchmark of 160 Kaggle competitions across 12 domains. To prevent
    leakage, one competition per domain is held out as the target, while the remaining 148 serve as sources
    only when they cannot have been influenced by the target task, such as through later editions or reused
    solutions. We also develop MLE-InsightForge, an insight assembly agent that explores source competitions,
    top human solutions, and writeups to construct three insight types: 12 domain insights summarizing
    best practices, 148 competition insights describing winning solutions, and 16 improvement insights
    capturing generic debugging and optimization strategies. These insights are injected either as on-demand
    skills or as an upfront playbook. In our evaluation, the extracted insights improve the normalized
    private-test score by 123.9% over a no-insight baseline. Controlled experiments further show that
    the three insight types are complementary; the better injection mode (skill vs. playbook) varies by
    tasks, with skills more cost-effective overall; and the gains generalize across backend LLMs.'
