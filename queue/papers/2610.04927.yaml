  title: Assembling Insights for Agentic Machine Learning Engineering Systems
  authors:
  - Bihui Jin
  - Yinxi Li
  - Kaiyuan Wang
  - Pengyu Nie
  published: '2026-10-04'
  updated: '2026-10-04'
