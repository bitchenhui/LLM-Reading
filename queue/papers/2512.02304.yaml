  title: When Does Verification Pay Off? A Closer Look at LLMs as Solution Verifiers
  authors:
  - Jack Lu
  - Ryan Teehan
  - Jinran Jin
  - Mengye Ren
  published: '2025-12-02'
  updated: '2026-04-21'
  categories:
  - cs.CL
  abstract: Large language models (LLMs) can act as both problem solvers and solution verifiers, where
    the latter select high-quality answers from a pool of solver-generated candidates. This raises the
    question of under what conditions verification pays off in solver-verifier systems. Prior work has
    conducted only limited studies of the factors influencing verification performance, focusing primarily
    on self-verification and examining neither the relationship between solver and verifier model families
    nor the effects of reasoning post-training. To rectify this, we present a systematic study across
    37 models spanning multiple families, sizes, and base vs. post-trained variants, evaluated on 9 benchmarks
    covering logical reasoning, structured puzzles, symbolic computation, mathematics, commonsense, factual
    recall, and domain knowledge. In order to support our analysis, we introduce and empirically validate
    verifier gain, a metric that predicts the performance improvements from test-time verifier-based rejection
    sampling. Our experiments find that 1) verification across model families is more effective than either
    self-verification or verification within the same family, and more generally that the benefits of
    verification decrease as the solver and verifier become more similar, 2) reasoning post-training weakens
    self-improvement abilities but strengthens cross-family improvement, and 3) some tasks are inherently
    more amenable to improvement through verification, particularly mathematical and logical tasks.
