  title: An Empirical Study of Reducing AV1 Decoder Complexity and Energy Consumption via Encoder Parameter
    Tuning
  authors:
  - Vibhoothi Vibhoothi
  - Julien Zouein
  - Shanker Shreejith
  - Jean-Baptiste Kempf
  - Anil Kokaram
  published: '2025-10-14'
  updated: '2025-10-14'
