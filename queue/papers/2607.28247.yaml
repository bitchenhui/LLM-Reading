  abstract: Accurate and scalable parcel-level agricultural monitoring remains challenging because satellite
    Earth Observation alone provides only an overhead perspective of agricultural parcels, while optical
    observations are further affected by cloud-induced temporal gaps. This paper presents Space2Ground
    2.0, a multi-source framework integrating Sentinel-1 SAR and Sentinel-2 multispectral time series
    with geo-tagged street-level imagery acquired using vehicle-mounted cameras and shared through the
    Mapillary platform. A largely automated processing pipeline performs semantic filtering, image quality
    assessment, viewpoint-based parcel association, and dataset refinement, transforming large volumes
    of crowdsourced imagery into parcel-linked, analysis-ready data. Applied over Cyprus during the 2022
    growing season, the pipeline produced a curated dataset of 46,050 annotated street-level images, selected
    from an initial collection exceeding 900,000 images and linked with satellite information for 8,581
    agricultural parcels. The practical value of the dataset was assessed through parcel-level crop classification
    experiments using both single- and multi-source observations. The results demonstrate that street-level
    imagery provides complementary fine-scale visual information that enhances classification when integrated
    with satellite time series. Overall, Space2Ground 2.0 provides an openly available benchmark dataset
    and a reproducible methodology for multimodal agricultural monitoring, with potential applications
    in visual verification, reduced reliance on costly field inspections, and data-driven agricultural
    policy implementation.
