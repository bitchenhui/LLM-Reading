  title: 'Space2Ground 2.0: A Multi-Source Dataset and Framework for Agricultural Monitoring through Fusion
    of Street-Level and Satellite Imagery'
  authors:
  - Iason Tsardanidis
  - Alkiviadis Koukos
  - George Choumos
  - Vasileios Sitokonstantinou
  - Charalampos Kontoes
  published: '2026-07-30'
