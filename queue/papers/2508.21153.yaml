  title: 'WaveLLDM: Design and Development of a Lightweight Latent Diffusion Model for Speech Enhancement
    and Restoration'
  authors:
  - Kevin Putra Santoso
  - Rizka Wakhidatus Sholikah
  - Raden Venantius Hari Ginardi
  published: '2025-08-28'
  updated: '2025-08-28'
  categories:
  - cs.SD
