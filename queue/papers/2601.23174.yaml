  title: 'Beyond Fixed Frames: Dynamic Character-Aligned Speech Tokenization'
  authors:
  - Luca Della Libera
  - Cem Subakan
  - Mirco Ravanelli
  published: '2026-01-30'
  updated: '2026-02-04'
