  abstract: 'Real-world image super-resolution (Real-ISR) aims to reconstruct high-resolution images from
    low-resolution inputs degraded by complex, unknown processes. While many Stable Diffusion (SD)-based
    Real-ISR methods have achieved remarkable success, their slow, multi-step inference hinders practical
    deployment. Recent SD-based one-step networks like OSEDiff and S3Diff alleviate this issue but still
    incur high computational costs due to their reliance on large pretrained SD models. This paper proposes
    a novel Real-ISR method, AdcSR, by distilling the one-step diffusion network OSEDiff into a streamlined
    diffusion-GAN model under our Adversarial Diffusion Compression (ADC) framework. We meticulously examine
    the modules of OSEDiff, categorizing them into two types: (1) Removable (VAE encoder, prompt extractor,
    text encoder, etc.) and (2) Prunable (denoising UNet and VAE decoder). Since direct removal and pruning
    can degrade the model''s generation capability, we pretrain our pruned VAE decoder to restore its
    ability to decode images and employ adversarial distillation to compensate for performance loss. This
    ADC-based diffusion-GAN hybrid design effectively reduces complexity by 73% in inference time, 78%
    in computation, and 74% in parameters, while preserving the model''s generation capability. Experiments
    manifest that our proposed AdcSR achieves competitive recovery quality on both synthetic and real-world
    datasets, offering up to 9.3$\times$ speedup over previous one-step diffusion-based methods. Code
    and models are available at https://github.com/Guaishou74851/AdcSR.'
