  title: 'HyperVis: Continuous Latent Visual Relational Graphs on the Lorentz Hyperboloid for Compositional
    Reasoning'
  authors:
  - Moshiur Farazi
  - Sameera Ramasinghe
  - Mahbub Ahmed Turza
  - Shafin Rahman
  published: '2026-06-04'
  updated: '2026-06-04'
