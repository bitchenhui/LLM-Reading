  title: 'Understanding Dynamic Scenes at Gigapixel Scale: Wide-Area Spatio-Temporal Perception from UAVs'
  authors:
  - Yuhang Zhu
  - Meiyi Zhu
  - Yunkai Dang
  - Zhangnan Li
  - Yuxuan Wang
  - Wenbin Li
  - Hongbing Pan
  published: '2026-09-16'
  updated: '2026-09-29'
  categories:
  - cs.CV
  abstract: UAV-borne imaging has advanced from megapixel to gigapixel sensors, shifting aerial perception
    from recognizing individual targets to understanding entire dynamic scenes. We characterize this demand
    as Wide-area Spatio-temporal Scene Understanding (WSTU), which requires wide-area coverage, per-target
    resolution, and temporal continuity at once, a combination existing datasets lack. To fill this gap,
    we introduce an ultra-High-resolution (12768x9564) Airborne Remote-sensing Dataset (HARD) annotated
    at three levels for object detection, multi-object tracking, and scene-level visual question answering.
    Ultra-high-resolution imagery raises per-frame processing time to seconds. At that scale latency can
    no longer be ignored in evaluation. Thus, we propose a latency-aware metric for multi-object tracking
    called streaming-HOTA (s-HOTA). Extensive baseline experiments show how ultra-high-resolution processing
    reshapes each task. For detection, the end-to-end pipeline affects accuracy and speed as much as the
    detector itself does. For tracking, high latency charges the association axis far more unevenly than
    the detection axis, and association is where pipelines diverge. As a result, the pipeline that performs
    best offline can lose its lead under s-HOTA. For VQA, vision-language models remain weak at cross-frame
    identity binding and cannot transfer their single-frame gains to it. Together these findings show
    that the baselines we evaluate fall short of WSTU. HARD provides the data and the systematic baselines
    to advance it.
