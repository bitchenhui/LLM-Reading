  title: Evaluation of Objective Image Quality Metrics for High-Fidelity Image Compression
  authors:
  - Shima Mohammadi
  - Mohsen Jenadeleh
  - Jon Sneyers
  - Dietmar Saupe
  - João Ascenso
  published: '2025-09-16'
  updated: '2025-09-16'
  categories:
  - cs.MM
  abstract: Nowadays, image compression solutions are increasingly designed to operate within high-fidelity
    quality ranges, where preserving even the most subtle details of the original image is essential.
    In this context, the ability to detect and quantify subtle compression artifacts becomes critically
    important, as even slight degradations can impact perceptual quality in professional or quality sensitive
    applications, such as digital archiving, professional editing and web delivery. However, the performance
    of current objective image quality assessment metrics in this range has not been thoroughly investigated.
    In particular, it is not well understood how reliably these metrics estimate distortions at or below
    the threshold of Just Noticeable Difference (JND). This study directly addresses this issue by proposing
    evaluation methodologies for assessing the performance of objective quality metrics and performing
    a comprehensive evaluation using the JPEG AIC-3 dataset which is designed for high-fidelity image
    compression. Beyond conventional criteria, the study introduces Z-RMSE to incorporate subjective score
    uncertainty and applies novel statistical tests to assess significant differences between metrics.
    The analysis spans the full JPEG AIC-3 range and its high- and medium-fidelity subsets, examines the
    impact of cropping in subjective tests, and a public dataset with benchmarks and evaluation tools
    is released to support further research.
