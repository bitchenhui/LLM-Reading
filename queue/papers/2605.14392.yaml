  title: 'Learning to Build the Environment: Self-Evolving Reasoning RL via Verifiable Environment Synthesis'
  authors:
  - Yucheng Shi
  - Zhenwen Liang
  - Kishan Panaganti
  - Dian Yu
  - Wenhao Yu
  - Haitao Mi
  published: '2026-05-14'
  updated: '2026-05-14'
