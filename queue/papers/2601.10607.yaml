  title: Multi-Objective Pareto-Front Optimization for Efficient Adaptive VVC Streaming
  authors:
  - Angeliki Katsenou
  - Vignesh V. Menon
  - Guoda Laurinaviciute
  - Benjamin Bross
  - Detlev Marpe
  published: '2026-01-15'
