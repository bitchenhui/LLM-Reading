  title: 'DIPA: Distilled Preconditioned Algorithms for Solving Imaging Inverse Problems'
  authors:
  - Romario Gualdrón-Hurtado
  - Roman Jacome
  - Leon Suarez
  - Henry Arguello
  published: '2026-05-14'
