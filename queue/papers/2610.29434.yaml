  title: 'RubatoCodec: Budgeted Adaptive Speech Tokenization with Streaming Decoding'
  authors:
  - Chihiro Arata
  - Shohei Taniguchi
  - Gouki Minegishi
  - Kan Hatakeyama-Sato
  published: '2026-10-21'
