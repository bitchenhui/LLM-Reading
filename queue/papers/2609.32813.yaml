  abstract: Large vision-language models (VLMs) have emerged as a powerful paradigm for urban and spatial
    AI. However, current state-of-the-art large VLMs still struggle with quantitative reasoning on remote
    sensing imagery. Existing benchmarks and algorithms are predominantly based on qualitative Visual
    Question Answering (VQA), providing limited insights into the quantitative reasoning capabilities
    of VLMs for built environment metrics. To address this gap, we develop Quantitative Urban and Spatial
    AI benchmark (USAI-Quant), the first benchmark designed to quantitatively evaluate VLM's reasoning
    capabilities on built environment metrics via remote sensing imagery. USAI-Quant is curated from the
    335 largest U.S. cities, aligning high-resolution remote sensing images with quantitative built environment
    metrics. We then evaluate both general-purpose and remote sensing VLMs (RS-VLMs) by applying VQAs
    to tens of built environment metrics across three complexity levels. Our results reveal that current
    state-of-the-art models consistently fall short on numeric reasoning tasks. We further conduct in-depth
    analyses across models, question types, and geographic locations, uncovering insights into performance
    variability and task-specific challenges.
