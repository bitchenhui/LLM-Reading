  abstract: 'Neural audio codecs compress waveforms into compact discrete tokens that underpin speech
    language models, real-time communication, and large-scale audio storage. Almost every dominant design,
    including residual vector quantization, finite scalar quantization, and single-codebook variants,
    follows the VQ-VAE template by partitioning the encoder latent through a learned codebook or a fixed
    scalar grid. We ask whether this partition is necessary. We introduce GS-Codec, a neural speech codec
    whose bottleneck is a parametric signal decomposition rather than a quantizer. We adapt Gaussian splatting
    from 3D scene reconstruction to one-dimensional latents. An inner optimization loop fits each encoder
    segment as a weighted sum of 1D Gaussian primitives. The decoder then reconstructs the waveform from
    the rendered sum. To avoid the cost of this iterative inner loop at inference time, we additionally
    train a lightweight GS Predictor Net that regresses the primitive parameters in a single forward pass.
    The encoder and decoder are trained end-to-end through the inner loop, with no quantizer anywhere
    in the training pipeline: the bottleneck is the decomposition itself, and scalar quantization is applied
    only post-training to the fitted parameters. Rather than relying on discrete codebook stages for bitrate
    control, our representation exposes a fine-grained rate-quality tradeoff: a single trained checkpoint
    supports post-training bitrate control by varying the number of primitives and the per-parameter bit
    depth, with no retraining required. GS-Codec matches or exceeds well-established open-source codecs
    such as EnCodec and DAC on speaker similarity (SIM), intelligibility (STOI), and perceptual quality
    (UTMOS) at comparable bitrates, while achieving comparable semantic performance (WER). Code and audio
    samples are available at https://ronaluf.github.io/gs-codec/'
