  title: 'First SFT, Second RL, Third UPT: Continual Improving Multi-Modal LLM Reasoning via Unsupervised
    Post-Training'
  authors:
  - Lai Wei
  - Yuting Li
  - Chen Wang
  - Yue Wang
  - Linghe Kong
  - Weiran Huang
