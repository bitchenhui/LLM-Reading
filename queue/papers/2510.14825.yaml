  title: Programmatic Representation Learning with Language Models
  authors:
  - Gabriel Poesia
  - Georgia Gabriela Sampaio
  published: '2025-10-16'
  updated: '2025-10-16'
  categories:
  - cs.LG
  abstract: Classical models for supervised machine learning, such as decision trees, are efficient and
    interpretable predictors, but their quality is highly dependent on the particular choice of input
    features. Although neural networks can learn useful representations directly from raw data (e.g.,
    images or text), this comes at the expense of interpretability and the need for specialized hardware
    to run them efficiently. In this paper, we explore a hypothesis class we call Learned Programmatic
    Representations (LeaPR) models, which stack arbitrary features represented as code (functions from
    data points to scalars) and decision tree predictors. We synthesize feature functions using Large
    Language Models (LLMs), which have rich prior knowledge in a wide range of domains and a remarkable
    ability to write code using existing domain-specific libraries. We propose two algorithms to learn
    LeaPR models from supervised data. First, we design an adaptation of FunSearch to learn features rather
    than directly generate predictors. Then, we develop a novel variant of the classical ID3 algorithm
    for decision tree learning, where new features are generated on demand when splitting leaf nodes.
    In experiments from chess position evaluation to image and text classification, our methods learn
    high-quality, neural network-free predictors often competitive with neural networks. Our work suggests
    a flexible paradigm for learning interpretable representations end-to-end where features and predictions
    can be readily inspected and understood.
