  abstract: Understanding biomolecular function requires characterizing three-dimensional structure and
    conformational variability, for which cryogenic electron microscopy (cryo-EM) is a powerful tool.
    Cryo-EM produces noisy two-dimensional particle images in which molecular structure, particle pose,
    and imaging conditions are jointly encoded. Recovering biological information from these observations
    spans inverse problems including pose estimation, heterogeneity analysis, and reconstruction. These
    tasks are usually addressed independently despite shared protein structure and image formation, motivating
    a common representation across inverse problems. Since biologically meaningful differences may be
    spatially localized, we study self-distillation with complementary global and masked patch objectives.
    Because experimental dataset discrimination can reflect acquisition-specific cues, we develop controlled
    synthetic and experimental evaluations and find that structural discrimination benefits from dense
    spatial features. We introduce the EMber family of vision transformers, pre-trained on >50 million
    experimental particle images from 214 EMPIAR datasets together with simulated projections from 268,000
    molecular assemblies. EMber improves upon existing methods at conformational and compositional discrimination
    by 14.85 and 14.26 percentage points, estimates conformational populations to within 1.59pp error
    with a linear probe, and produces particle assignments yielding reference-quality reconstructions
    in fewer epochs. We demonstrate how to learn representations that capture biological information for
    use across multiple cryo-EM inverse problems.
