  title: Bit Allocation Transfer for Perceptual Quality Enhancement of VVC Intra Coding
  authors:
  - Runyu Yang
  - Ivan V. Bajić
  published: '2025-10-13'
  updated: '2025-10-15'
  categories:
  - eess.IV
  abstract: Mainstream image and video coding standards -- including state-of-the-art codecs like H.266/VVC,
    AVS3, and AV1 -- adopt a block-based hybrid coding framework. While this framework facilitates straightforward
    optimization for Peak Signal-to-Noise Ratio (PSNR), it struggles to effectively optimize perceptually-aligned
    metrics such as Multi-Scale Structural Similarity (MS-SSIM). To address this challenge, this paper
    proposes a low-complexity method to enhance perceptual quality in VVC intra coding by transferring
    bit allocation knowledge from end-to-end image compression. We introduce a lightweight model trained
    with perceptual losses to generate a quantization step map. This map implicitly captures block-level
    perceptual importance, enabling efficient derivation of a QP map for VVC. Experiments on Kodak and
    CLIC datasets demonstrate significant advantages, both in execution time and perceptual metric performance,
    with more than 11% BD-rate reduction in terms of MS-SSIM. Our scheme provides an efficient, practical
    pathway for perceptual enhancement of traditional codecs.
