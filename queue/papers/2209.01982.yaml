  abstract: The rise of capturing systems for objects and scenes in 3D with increased fidelity and immersion
    has led to the popularity of volumetric video contents that can be seen from any position and angle
    in 6 degrees of freedom navigation. Such contents need large volumes of data to accurately represent
    the real world. Thus, novel optimization solutions and delivery systems are needed to enable volumetric
    video streaming over bandwidth-limited networks. In this chapter, we discuss theoretical approaches
    to volumetric video streaming optimization, through compression solutions, as well as network and
    user adaptation, for high-end and low-powered devices. Moreover, we present an overview of existing
    end-to-end systems, and we point to the future of volumetric video streaming.
