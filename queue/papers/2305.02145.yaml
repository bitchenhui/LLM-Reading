  title: 'ProgDTD: Progressive Learned Image Compression with Double-Tail-Drop Training'
  authors:
  - Ali Hojjat
  - Janek Haberer
  - Olaf Landsiedel
  published: '2023-05-03'
  updated: '2024-04-30'
