  title: Prototypicality Bias Reveals Blindspots in Multimodal Evaluation Metrics
  authors:
  - Subhadeep Roy
  - Gagan Bhatia
  - Steffen Eger
  published: '2026-01-08'
  updated: '2026-06-01'
  categories:
  - cs.CV
