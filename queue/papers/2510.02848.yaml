  title: 'Flamed-TTS: Flow Matching Attention-Free Models for Efficient Generating and Dynamic Pacing
    Zero-shot Text-to-Speech'
  authors:
  - Hieu-Nghia Huynh-Nguyen
  - Huynh Nguyen Dang
  - Ngoc-Son Nguyen
  - Van Nguyen
  published: '2025-10-03'
  updated: '2025-10-03'
