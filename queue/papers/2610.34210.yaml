  abstract: Modern surgical AI increasingly requires multimodal understanding rather than isolated perception,
    yet existing datasets remain largely limited to single-task supervision such as recognition or templated
    question answering. Current medical VQA resources often rely on synthetic templates, lack natural
    descriptive supervision, or provide sparse annotations that hinder reasoning about spatial relations
    and procedural context. We introduce MIS-VQA, a surgical vision-language dataset generated through
    an annotation-driven pipeline that converts heterogeneous surgical annotations into structured textual
    scene representations. Using EndoVis18 and CholecT50, we transform phase, instrument, interaction,
    triplet, and segmentation labels into unified contexts that guide large language models to generate
    clinically coherent question-answer pairs. MIS-VQA supports four response types-concise and detailed
    descriptions, perception-level grounding, and multi-step reasoning-enabling hierarchical evaluation
    from atomic visual grounding to compositional reasoning. To address annotation sparsity, we incorporate
    confidence-filtered segmentation and cross-annotation consistency checks, enabling spatially grounded
    supervision at scale. MIS-VQA establishes a unified benchmark for surgical vision-language understanding
    with spatial supervision and multi-tier reasoning evaluation. To demonstrate its utility, we introduce
    LLaVA-SurgXpert, a family of surgical vision-language models with visual encoders to analyze how visual
    representations influence multimodal reasoning. Experiments show consistent improvements over existing
    surgical VQA baselines while revealing capability gaps between perceptual grounding and higher-level
    reasoning hidden in prior benchmarks.
