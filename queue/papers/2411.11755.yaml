  abstract: In 2023 we have conducted extensive experiments on subjective video quality for the TV 3.0
    project at University of Brasília. A full report on these tests is available at the Fórum SBTVD website
    . These tests have evaluated the H.266/VVC codec and a hybrid codec formed by the H.266/VVC and the
    LCEVC (Low Complexity Enhancement Video Coding) with different resolutions, ranging from 720p to 4K.
    This report contains the results of additional tests performed for TV 3.0 performed at University
    of Brasília. This new experiment consists of two new Video Under Tests (VUTs), one with the H.266/VVC
    codec at 4K resolution, and the other with the H.266/VVC+LCEVC codec at 4K resolution. In this new
    test, both codecs have the same GOP size (120 frames) and use the same VVC encoder (MainConcept live
    encoder). This new experiment follows the same experimental protocol as the previous experiments,
    in order to be fully comparable to the reported results. This document details the results of the
    new experiments.
