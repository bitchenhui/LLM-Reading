  title: 'Verification Mirage: Mapping the Reliability Boundary of Self-Verification in Medical VQA'
  authors:
  - Ruinan Jin
  - Beidi Zhao
  - Myeongkyun Kang
  - Qiong Zhang
  - Xiaoxiao Li
  published: '2026-05-11'
  updated: '2026-05-11'
