  title: 'Better than Your Teacher: LLM Agents that learn from Privileged AI Feedback'
  authors:
  - Sanjiban Choudhury
  - Paloma Sodhi
  published: '2024-10-07'
  updated: '2024-10-07'
  categories:
  - cs.LG
  - cs.AI
  abstract: While large language models (LLMs) show impressive decision-making abilities, current methods
    lack a mechanism for automatic self-improvement from errors during task execution. We propose LEAP,
    an iterative fine-tuning framework that continually improves LLM agents using feedback from AI expert
    teachers. Our key insight is to equip the expert teachers with a privileged state -- information that
    is available during training but hidden at test time. This allows even weak experts to provide precise
    guidance, significantly improving the student agent's performance without access to privileged information
    at test time. We evaluate LEAP on diverse decision-making benchmarks, including text-based games (ALFWorld),
    web navigation (WebShop), and interactive coding (Intercode Bash). Our experiments show that LEAP
    (1) outperforms behavior cloning and ReAct baselines (2) enables weak student models (e.g., Llama3-8B)
    to exceed the performance of strong teacher models (GPT4-o), and (3) allows weak models to self-improve
    using privileged versions of themselves. We also provide a theoretical analysis showing that LEAP's
    success hinges on balancing privileged information with the student's realizability, which we empirically
    validate. Our code is available at https://leap-llm.github.io
