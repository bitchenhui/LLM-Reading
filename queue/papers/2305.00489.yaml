  title: Learned Focused Plenoptic Image Compression with Microimage Preprocessing and Global Attention
  authors:
  - Kedeng Tong
  - Xin Jin
  - Yuqing Yang
  - Chen Wang
  - Jinshi Kang
  - Fan Jiang
  published: '2023-04-30'
  updated: '2023-04-30'
  categories:
  - cs.CV
  - cs.MM
  abstract: Focused plenoptic cameras can record spatial and angular information of the light field (LF)
    simultaneously with higher spatial resolution relative to traditional plenoptic cameras, which facilitate
    various applications in computer vision. However, the existing plenoptic image compression methods
    present ineffectiveness to the captured images due to the complex micro-textures generated by the
    microlens relay imaging and long-distance correlations among the microimages. In this paper, a lossy
    end-to-end learning architecture is proposed to compress the focused plenoptic images efficiently.
    First, a data preprocessing scheme is designed according to the imaging principle to remove the sub-aperture
    image ineffective pixels in the recorded light field and align the microimages to the rectangular
    grid. Then, the global attention module with large receptive field is proposed to capture the global
    correlation among the feature maps using pixel-wise vector attention computed in the resampling process.
    Also, a new image dataset consisting of 1910 focused plenoptic images with content and depth diversity
    is built to benefit training and testing. Extensive experimental evaluations demonstrate the effectiveness
    of the proposed approach. It outperforms intra coding of HEVC and VVC by an average of 62.57% and
    51.67% bitrate reduction on the 20 preprocessed focused plenoptic images, respectively. Also, it achieves
    18.73% bitrate saving and generates perceptually pleasant reconstructions compared to the state-of-the-art
    end-to-end image compression methods, which benefits the applications of focused plenoptic cameras
    greatly. The dataset and code are publicly available at https://github.com/VincentChandelier/GACN.
