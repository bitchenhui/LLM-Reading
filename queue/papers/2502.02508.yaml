  title: 'Satori: Reinforcement Learning with Chain-of-Action-Thought Enhances LLM Reasoning via Autoregressive
    Search'
  authors:
  - Maohao Shen
  - Guangtao Zeng
  - Zhenting Qi
  - Zhang-Wei Hong
