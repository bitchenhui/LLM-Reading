  title: 'DeepTumorVQA: A Hierarchical 3D CT Benchmark for Stage-Wise Evaluation of Medical VLMs and Tool-Augmented
    Agents'
  authors:
  - Yixiong Chen
  - Wenjie Xiao
  - Pedro R. A. S. Bassi
