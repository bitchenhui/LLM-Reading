  title: CNN-based Prediction of Partition Path for VVC Fast Inter Partitioning Using Motion Fields
  authors:
  - Yiqun Liu
  - Marc Riviere
  - Thomas Guionnet
  - Aline Roumy
  - Christine Guillemot
