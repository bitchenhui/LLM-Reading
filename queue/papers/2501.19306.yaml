  abstract: 'Recent advancements in Large Language Models (LLMs) have created new opportunities to enhance
    performance on complex reasoning tasks by leveraging test-time computation. However, existing scaling
    methods have key limitations: parallel methods like repeated sampling are often inefficient and quickly
    saturate, while sequential methods like SELF-REFINE struggle to improve after a few rounds. Although
    combining these approaches shows promise, current methods require fine-tuned reward and revision models.
    This paper proposes Self-Enhanced Test-Time Scaling (SETS), a simple yet effective approach that overcomes
    these limitations by strategically combining parallel and sequential techniques and fully leveraging
    LLMs'' self-improvement abilities. SETS exploits the inherent self-verification and self-correction
    capabilities of LLMs, unifying sampling, verification, and correction within a single framework. This
    facilitates efficient and scalable test-time computation for enhanced performance on complex tasks
    without any model training. Our comprehensive experimental results on challenging benchmarks spanning
    planning, reasoning, math, and coding demonstrate that SETS achieves significant performance improvements
    and more advantageous test-time scaling behavior than the alternatives.'
