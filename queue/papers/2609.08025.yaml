  title: Eliciting Self-Verification in Multimodal Reasoning Agents with Reinforcement Learning
  authors:
  - Vishwas Sathish
  - Viresh Ranjan
  - Xinliang Zhu
  - Arnab Dhua
  - Douglas Gray
  published: '2026-09-07'
  updated: '2026-09-07'
  categories:
  - cs.AI
