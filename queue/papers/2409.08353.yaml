  title: Robust Dual Gaussian Splatting for Immersive Human-centric Volumetric Videos
  authors:
  - Yuheng Jiang
  - Zhehao Shen
  - Yu Hong
  - Chengcheng Guo
  - Yize Wu
  - Yingliang Zhang
  - Jingyi Yu
  - Lan Xu
  published: '2024-09-12'
  updated: '2024-09-12'
