  title: Asymmetric VAE for One-Step Video Super-Resolution Acceleration
  authors:
  - Jianze Li
  - Yong Guo
  - Yulun Zhang
  - Xiaokang Yang
  published: '2025-09-29'
  updated: '2025-09-29'
