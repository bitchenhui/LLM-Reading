  title: Self-Learning Surprise Detection in Spatial Audio for Viewport-Aware 360-Video Streaming
  authors:
  - Arman Nik Khah
  - Ravi Prakash
  published: '2026-01-06'
  updated: '2026-10-28'
  categories:
  - cs.MM
  abstract: 'Adaptive streaming of 360-degree video relies on viewport prediction to allocate bandwidth
    efficiently. Current approaches predominantly use visual saliency or historical gaze patterns, neglecting
    the role of spatial audio in guiding user attention. This paper presents a self-learning framework
    for detecting "surprising" auditory events, moments that deviate from learned temporal expectations,
    and demonstrates their utility for viewport prediction. The proposed architecture combines SE(3)-equivariant
    graph neural networks with recurrent temporal modeling, trained via a dual self-supervised objective.
    A key feature is the natural modeling of temporal attention decay: surprise is high at event onset
    but diminishes as the listener adapts. Experiments on the AVTrack360 dataset show that integrating
    audio surprise with visual cues reduces bitrate waste by up to 18% compared to visual-only methods.'
