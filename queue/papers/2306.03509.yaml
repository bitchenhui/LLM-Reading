  abstract: 'Scaling text-to-speech to a large and wild dataset has been proven to be highly effective
    in achieving timbre and speech style generalization, particularly in zero-shot TTS. However, previous
    works usually encode speech into latent using audio codec and use autoregressive language models or
    diffusion models to generate it, which ignores the intrinsic nature of speech and may lead to inferior
    or uncontrollable results. We argue that speech can be decomposed into several attributes (e.g., content,
    timbre, prosody, and phase) and each of them should be modeled using a module with appropriate inductive
    biases. From this perspective, we carefully design a novel and large zero-shot TTS system called Mega-TTS,
    which is trained with large-scale wild data and models different attributes in different ways: 1)
    Instead of using latent encoded by audio codec as the intermediate feature, we still choose spectrogram
    as it separates the phase and other attributes very well. Phase can be appropriately constructed by
    the GAN-based vocoder and does not need to be modeled by the language model. 2) We model the timbre
    using global vectors since timbre is a global attribute that changes slowly over time. 3) We further
    use a VQGAN-based acoustic model to generate the spectrogram and a latent code language model to fit
    the distribution of prosody, since prosody changes quickly over time in a sentence, and language models
    can capture both local and long-range dependencies. We scale Mega-TTS to multi-domain datasets with
    20K hours of speech and evaluate its performance on unseen speakers. Experimental results demonstrate
    that Mega-TTS surpasses state-of-the-art TTS systems on zero-shot TTS, speech editing, and cross-lingual
    TTS tasks, with superior naturalness, robustness, and speaker similarity due to the proper inductive
    bias of each module. Audio samples are available at https://mega-tts.github.io/demo-page.'
