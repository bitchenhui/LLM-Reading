  abstract: With the advent of 5G, the internet has entered a new video-centric era. From short-video
    platforms like TikTok to long-video platforms like Bilibili, online video services are reshaping user
    consumption habits. Adaptive Bitrate (ABR) control is widely recognized as a critical factor influencing
    Quality of Experience (QoE). Recent learning-based ABR methods have attracted increasing attention.
    However, most of them rely on limited network trace sets during training and overlook the wide-distribution
    characteristics of real-world network conditions, resulting in poor generalization in out-of-distribution
    (OOD) scenarios. To address this limitation, we propose SABR, a training framework that combines behavior
    cloning (BC) pretraining with reinforcement learning (RL) fine-tuning. We also introduce benchmarks,
    ABRBench-3G and ABRBench-4G+, which provide wide-coverage training traces and dedicated OOD test sets
    for assessing robustness to unseen network conditions. Experimental results demonstrate that SABR
    achieves the best average rank compared with Pensieve, Comyco, and NetLLM across the proposed benchmarks.
    These results indicate that SABR enables more stable learning across wide distributions and improves
    generalization to unseen network conditions.
