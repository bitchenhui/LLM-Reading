  abstract: 'Modern large language models (LLMs) can translate natural-language descriptions into operations
    research (OR) formulations. Post-training techniques including reinforcement learning and on-policy
    self-distillation have further improved this capability. However, three limitations remain in training
    LLMs for OR formulations. First, training commonly relies on synthetic formulations validated by human
    experts or stronger models, constraining scalable supervision. Second, credit assignment is either
    coarse or costly: outcome rewards score an entire trajectory without locating the responsible modeling
    decision, whereas process-level supervision requires an additional evaluator. Third, privileged self-distillation
    can induce style mismatch by using solver context unavailable at deployment. We find that a model
    can improve from solver-artifact feedback generated by its own rollouts, making self-distillation
    a practical, evaluator-free source of dense supervision. Therefore, we propose SOLID: Solver-Informed
    On-Policy LearnIng through Self-Distillation, a novel framework for self-improving OR language models
    without verified answers or external evaluators. SOLID executes candidate programs from multiple rollouts,
    clusters their objectives, and selects a majority-group artifact as a pseudo-reference. The model
    then performs updates using group-relative advantages and dense self-supervision signals. Across multiple
    OR benchmarks, SOLID improves solution accuracy for both general-purpose and OR-tuned models over
    outcome-only group-relative training. These results show that solver artifacts can support scalable
    self-improvement without trusted answers.'
