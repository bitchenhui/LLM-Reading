  title: Edge Storage Management Recipe with Zero-Shot Data Compression for Road Anomaly Detection
  authors:
  - YeongHyeon Park
  - Uju Gim
  - Myung Jin Kim
  published: '2023-07-10'
  updated: '2023-08-26'
