  abstract: Recent advances in neural audio codec-based speech generation (CoSG) models have produced
    remarkably realistic audio deepfakes. We refer to deepfake speech generated by CoSG systems as codec-based
    deepfake, or CodecFake. Although existing anti-spoofing research on CodecFake predominantly focuses
    on verifying the authenticity of audio samples, almost no attention was given to tracing the CoSG
    used in generating these deepfakes. In CodecFake generation, processes such as speech-to-unit encoding,
    discrete unit modeling, and unit-to-speech decoding are fundamentally based on neural audio codecs.
    Motivated by this, we introduce source tracing for CodecFake via neural audio codec taxonomy, which
    dissects neural audio codecs to trace CoSG. Our experimental results on the CodecFake+ dataset provide
    promising initial evidence for the feasibility of CodecFake source tracing while also highlighting
    several challenges that warrant further investigation.
