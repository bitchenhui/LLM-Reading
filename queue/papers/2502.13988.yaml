  - Ajmal Mian
  published: '2025-02-19'
  updated: '2025-02-19'
  categories:
  - eess.IV
  abstract: Perceptual image compression has shown strong potential for producing visually appealing results
    at low bitrates, surpassing classical standards and pixel-wise distortion-oriented neural methods.
    However, existing methods typically improve compression performance by incorporating explicit semantic
    priors, such as segmentation maps and textual features, into the encoder or decoder, which increases
    model complexity by adding parameters and floating-point operations. This limits the model's practicality,
    as image compression often occurs on resource-limited mobile devices. To alleviate this problem, we
    propose a lightweight perceptual Image Compression method using Implicit Semantic Priors (ICISP).
    We first develop an enhanced visual state space block that exploits local and global spatial dependencies
    to reduce redundancy. Since different frequency information contributes unequally to compression,
    we develop a frequency decomposition modulation block to adaptively preserve or reduce the low-frequency
    and high-frequency information. We establish the above blocks as the main modules of the encoder-decoder,
    and to further improve the perceptual quality of the reconstructed images, we develop a semantic-informed
    discriminator that uses implicit semantic priors from a pretrained DINOv2 encoder. Experiments on
    popular benchmarks show that our method achieves competitive compression performance and has significantly
    fewer network parameters and floating point operations than the existing state-of-the-art.
