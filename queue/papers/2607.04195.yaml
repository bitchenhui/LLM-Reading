  title: Noisy Environment Adaptation of Neural Speech Codec via Focal Mask and Noise Feature Separation
  authors:
  - Shaokai Li
  - Weiping Tu
  - Yuhong Yang
  published: '2026-07-05'
  updated: '2026-07-05'
