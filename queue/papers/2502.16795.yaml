  title: Continuous Patch Stitching for Block-wise Image Compression
  authors:
  - Zifu Zhang
  - Shengxi Li
  - Henan Liu
  - Mai Xu
  - Ce Zhu
  published: '2025-02-24'
  updated: '2025-02-24'
