  title: 'PerCoV2: Ultra-Low Bit-Rate Perceptual Image Compression via Query-Based 1D Multimodal Image
    Tokens'
  authors:
  - Nikolai Körber
  - Eduard Kromer
  - Andreas Siebert
  - Sascha Hauke
  - Daniel Mueller-Gritschneder
  - Björn Schuller
  published: '2025-03-12'
  updated: '2026-10-05'
