  abstract: '*Chulin Zhao and Ruoqi Hu contributed equally to this work. State-of-the-art text-to-image
    (T2I) models exhibit pronounced and systematic defects when prompts involve intricate compositional
    factors such as multiple entities and multiple attributes. In this paper, we investigate how humans
    identify such defects. Specifically, we manually select 651 reference images from the four categories
    of people, hand, object, and scene that exhibit complex compositional characteristics, from which
    prompts emphasizing compositional factors are derived by manually editing ChatGPT-generated prompts.
    We then feed the prompts into three selected T2I models to generate AI images and conduct a comprehensive
    subjective study to identify their defects. For each image, 29 participants provide multi-label assessments
    specifying defect types and locations. The study yields the compositional AI-generated image defect
    (CO-AID) dataset, including reference images, prompts, AI-generated images, and information on defect
    locations and types. Experimental results show that training a deep model on CO-AID can both predict
    defects in AI-generated images and optimize AI image generation, demonstrating its usability and effectiveness.
    The database and supplementary materials are available at: https://github.com/Future-IQA/CO-AID .'
