  title: An agentic system with reinforcement-learned subsystem improvements for parsing form-like documents
  authors:
  - Ayesha Amjad
  - Saurav Sthapit
  - Tahir Qasim Syed
  published: '2025-05-16'
  updated: '2025-05-16'
