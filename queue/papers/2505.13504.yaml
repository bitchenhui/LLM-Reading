  - cs.MA
  abstract: Extracting alphanumeric data from form-like documents such as invoices, purchase orders, bills,
    and financial documents is often performed via vision (OCR) and learning algorithms or monolithic
    pipelines with limited potential for systemic improvements. We propose an agentic AI system that leverages
    Large Language Model (LLM) agents and a reinforcement learning (RL) driver agent to automate consistent,
    self-improving extraction under LLM inference uncertainty. Our work highlights the limitations of
    monolithic LLM-based extraction and introduces a modular, multi-agent framework with task-specific
    prompts and an RL policy of rewards and penalties to guide a meta-prompting agent to learn from past
    errors and improve prompt-based actor agents. This self-corrective adaptive system handles diverse
    documents, file formats, layouts, and LLMs, aiming to automate accurate information extraction without
    the need for human intervention. Results as reported on two benchmark datasets of SOIRE, and CORD,
    are promising for the agentic AI framework.
