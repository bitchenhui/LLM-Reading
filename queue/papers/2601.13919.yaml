  title: 'HyperWalker: Dynamic Hypergraph-Based Deep Diagnosis for Multi-Hop Clinical Modeling across
    EHR and X-Ray in Medical VLMs'
  authors:
  - Yuezhe Yang
  - Hao Wang
  - Yige Peng
  - Jinman Kim
  - Lei Bi
  published: '2026-01-20'
  updated: '2026-01-20'
