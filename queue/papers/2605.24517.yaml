  title: 'ECHO: Terminal Agents Learn World Models for Free'
  authors:
  - Vaishnavi Shrivastava
  - Piero Kauffmann
  - Ahmed Awadallah
  - Dimitris Papailiopoulos
  published: '2026-05-23'
  updated: '2026-05-23'
  categories:
  - cs.LG
