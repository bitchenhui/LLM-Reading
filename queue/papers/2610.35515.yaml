  abstract: Diffusion-based real-world image super-resolution suffers from limited reconstruction fidelity
    due to information loss in VAE-based latent representations. Recently, pixel-space diffusion models
    offer a promising high-faithfulness alternative by avoiding latent compression, but adapting them
    to Real-ISR remains challenging due to inherent patch boundary artifacts and degraded generative capability.
    To address the issues and maximize the potential of pretrained pixel-space diffusion models, we propose
    HiFiPix, a pixel-space Real-ISR framework capable of ultra high-fidelity reconstruction and fine-grained
    visual generation effects. To suppress patch boundary artifacts, we penalize unrealistic high-frequency
    periodic components with a Cross-Scale Wavelet Discriminator (CWSD) for image-level supervision, and
    Mixup Contrastive Self-Distillation (MixCSD) for intermediate representation regularization. Furthermore,
    we uncover a heterogeneous generation-fidelity trade-off across low-rank adapters (LoRA) and propose
    Selective LoRA Pruning (LoRA-SP) to adaptively prune LoRA layers, enhancing generative capability
    with minimal deterioration of reconstruction fidelity. Extensive experiments demonstrate that HiFiPix
    consistently outperforms existing state-of-the-art latent space methods in terms of both restoration
    accuracy and perceptual quality by a large margin. Code and models will be released.
