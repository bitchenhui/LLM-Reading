  abstract: Recent advances in agentic AI have demonstrated the potential to automate complex high-energy
    physics (HEP) workflows. We focus on the regime of HEP tasks where frontier models still struggle
    to provide correct and complete solutions, and introduce an open-ended optimization task format with
    continuous, automatically evaluated rewards. Unlike conventional benchmarks focused on task completion,
    these tasks target reinforcement learning (RL) environments to generate agentic improvement on state-
    of-the-art HEP challenges. We benchmark frontier reasoning models on several HEP tasks and demonstrate
    an initial proof of concept in which a small language model improves through RL using automated feedback
    without human intervention. By connecting challenging HEP problems with verifiable scientific rewards
    and RL, we aim to advance agentic AI from reproducing established workflows to autonomously discovering
    better scientific solutions, paving the way toward self-improving scientific agents.
