  abstract: 'Search has been proposed as an effective method for self-improving language models and agentic
    systems, both for post-training sample generation and for inference. However, widely used methods
    such as best-of-N sampling and tree search face two fundamental limitations: they are guided by sparse
    verification signals, and they construct candidates primarily through autoregressive expansion, restricting
    exploration to regions with substantial model probability mass. To address these, we propose Bidirectional
    Evolutionary Search (BES), a search framework that couples forward candidate evolution with backward
    goal decomposition. In the forward search, BES augments standard expansion with evolution operators
    that recombine partial trajectories to generate candidates that are difficult to obtain from a single
    model rollout. In the backward search, BES recursively decomposes the original task into checkable
    sub-goals, producing dense intermediate feedback that guides forward search. We provide motivation
    illustrating that candidates generated by expansion-only search may be confined to a narrow entropy
    shell, while evolution operators may escape it. Experiments show that on challenging post-training
    tasks where mainstream post-training algorithms fail to improve, BES enables consistent gains. At
    inference time, BES outperforms existing open-source frameworks on three open problem solving benchmarks
    in both average and best-case performance, and outperforms majority voting and Monte Carlo Tree Search
    on mathematical reasoning and competitive programming benchmarks. Code and trained models are available
    at https://github.com/Embodied-Minds-Lab/BES.'
