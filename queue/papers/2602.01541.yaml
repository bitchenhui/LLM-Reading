  abstract: Multimodal Large Language Models (MLLMs) have achieved remarkable success in open-vocabulary
    perceptual tasks, yet their ability to solve complex cognitive problems remains limited, especially
    when visual details are abstract and require visual memory. Current approaches primarily scale Chain-of-Thought
    (CoT) reasoning in the text space, even when language alone is insufficient for clear and structured
    reasoning, and largely neglect visual reasoning mechanisms analogous to the human visuospatial sketchpad
    and visual imagery. To mitigate this deficiency, we introduce Cognitive Supersensing, a novel training
    paradigm that endows MLLMs with human-like visual imagery capabilities by integrating a Latent Visual
    Imagery Prediction (LVIP) head that jointly learns sequences of visual cognitive latent embeddings
    and aligns them with the answer, thereby forming vision-based internal reasoning chains. We further
    introduce a reinforcement learning stage that optimizes text reasoning paths based on this grounded
    visual latent. To evaluate the cognitive capabilities of MLLMs, we present CogSense-Bench, a comprehensive
    visual question answering (VQA) benchmark assessing five cognitive dimensions. Extensive experiments
    demonstrate that MLLMs trained with Cognitive Supersensing significantly outperform state-of-the-art
    baselines on CogSense-Bench and exhibit superior generalization on out-of-domain mathematics and science
    VQA benchmarks, suggesting that internal visual imagery is potentially key to bridging the gap between
    perceptual recognition and cognitive understanding. We will open-source the CogSense-Bench and our
    model weights.
