  abstract: This paper presents the design and evaluation of SQP, a congestion control algorithm (CCA)
    for interactive video streaming applications that need to stream high-bitrate compressed video with
    very low end-to-end frame delay (eg. AR streaming, cloud gaming). SQP uses frame-coupled, paced packet
    trains to sample the network bandwidth, and uses an adaptive one-way delay measurement to recover
    from queuing, for low, bounded queuing delay. SQP rapidly adapts to changes in the link bandwidth,
    ensuring high utilization and low frame delay, and also achieves competitive bandwidth shares when
    competing with queue-building flows within an acceptable delay envelope. SQP has good fairness properties,
    and works well on links with shallow buffers. In real-world A/B testing of SQP against Copa in Google's
    AR streaming platform, SQP achieves 27% and 15% more sessions with high bitrate and low frame delay
    for LTE and Wi-Fi, respectively. When competing with queue-building traffic like Cubic and BBR, SQP
    achieves 2-3X higher bandwidth compared to GoogCC (WebRTC), Sprout, and PCC-Vivace, and comparable
    performance to Copa (with mode switching).
