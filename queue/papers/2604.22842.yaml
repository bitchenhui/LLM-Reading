  title: 'EX-FIQA: Leveraging Intermediate Early eXit Representations from Vision Transformers for Face
    Image Quality Assessment'
  authors:
  - Guray Ozgur
  - Tahar Chettaoui
  - Eduarda Caldeira
  - Jan Niklas Kolf
