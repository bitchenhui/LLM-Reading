  abstract: Harness optimization, which improves an agent's prompts, tools, and workflows, is an increasingly
    effective way to enhance agents built on frozen or closed-source LLMs. Leading approaches such as
    the Darwin--Godel Machine and the Huxley--Godel Machine (HGM) rely on recursive self-improvement and
    were developed mainly for coding, where the competence needed to improve the agent coincides with
    the competence being improved. Planning tasks, in which an agent must produce a sequence of tool calls
    that jointly satisfies interacting constraints, break this alignment. There, open-ended self-modification
    repeatedly explores ineffective changes and consumes substantial evaluation budgets. We introduce
    HGM-Dual, a diagnostic-guided framework for budget-efficient harness evolution for planning agents.
    First, HGM-Dual represents agent evolution as lineage-aware context. This context records what each
    ancestor changed, which behaviors improved or regressed, and which modifications were ineffective,
    giving the editor explicit edit-outcome attribution instead of an unstructured archive of past agents.
    Second, HGM-Dual introduces error-conditioned dual-path child generation. For each selected parent,
    it generates a general child that preserves open-ended exploration and specialized children that target
    the harness components most likely responsible for the parent's highest-ranked constraint violations.
    HGM-Dual outperforms the strongest baseline by up to 14.45% relative improvement in case accuracy
    while matching HGM variants' final performance with 2x-4x fewer evaluation budget.
