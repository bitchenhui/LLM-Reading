  title: 'HGM-Dual: Lineage-Aware Guided Agent Harness Optimization for Long-Horizon Planning'
  authors:
  - Sudipta Paul
  - Pengrui Quan
  - Aounon Kumar
  - Nicholas Tzou
  - Vivek Kulkarni
  - Srinivas Chappidi
  published: '2026-10-21'
  updated: '2026-10-21'
