  title: 'DARC: Decoupled Asymmetric Reasoning Curriculum for LLM Evolution'
  authors:
  - Shengda Fan
  - Xuyan Ye
  - Yankai Lin
  published: '2026-01-20'
  updated: '2026-01-21'
