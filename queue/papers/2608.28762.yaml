  abstract: Recent advances in visual question answering (VQA) and multimodal large language models (MLLMs)
    have enabled natural-language reasoning over traffic scenes. However, existing benchmarks are largely
    built from ego-vehicle views or 2D roadside videos, limiting their ability to evaluate 3D-grounded
    reasoning over real-world distances, trajectories, infrastructure topology, and safety-critical interactions.
    We introduce Inter-3D VQA, a large-scale roadside multimodal benchmark for 3D spatiotemporally grounded
    VQA at intersections. Built from synchronized point clouds and multi-view images, Inter-3D VQA contains
    407K QA pairs covering lane-level positions, object relationships, motion patterns, and near-miss-oriented
    interaction reasoning. We further propose Inter-Geo, an MLLM baseline that integrates object- and
    scene-level aligned LiDAR representations, and Inter-Metrics, a unified evaluation framework for textual
    consistency, numerical accuracy, and semantic correctness. Experiments show that Inter-Geo outperforms
    image-based VLMs, especially on grounded spatial and temporal reasoning tasks. Our benchmark and codes
    are available at https://github.com/ASU-Suo-Lab/Inter-3D-VQA .
