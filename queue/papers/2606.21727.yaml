  abstract: In this paper, we introduce Synthetic Heart Sound Detection (SHAC), a task aimed at identifying
    phonocardiograms (PCGs) synthesized using neural audio codecs (NACs). To facilitate research in this
    direction, we release CARDIOFAKE, the first benchmark dataset for SHAC containing both real and codec-synthesized
    PCGs. We benchmark spectral representations (MFCC, LFCC) and self-supervised learning (SSL) representations
    (e.g., WavLM) for the task. Furthermore, we propose GROOT, a fusion framework that integrates spectral
    and SSL features for leveraging their complementary behavior. Experiments show that GROOT, combining
    MFCC and WavLM, achieves state-of-the-art performance, outperforming individual representations and
    competitive baselines.
