  abstract: Speech intelligibility assessment is essential for evaluating neural speech codecs, yet most
    evaluation efforts focus on overall quality rather than intelligibility. Only a few publicly available
    tools exist for conducting standardized intelligibility tests, like the Diagnostic Rhyme Test (DRT)
    and Modified Rhyme Test (MRT). We introduce the Speech Intelligibility Toolkit for Subjective Evaluation
    (SITool), a Flask-based web application for conducting DRT and MRT in laboratory and crowdsourcing
    settings. We use SITool to benchmark 13 neural and traditional speech codecs, analyzing phoneme-level
    degradations and comparing subjective DRT results with objective intelligibility metrics. Our findings
    show that, while neural speech codecs can outperform traditional ones in subjective intelligibility,
    only STOI and ESTOI - not WER - significantly correlate with subjective results, although they struggle
    to capture gender and wordlist-specific variations observed in subjective evaluations.
