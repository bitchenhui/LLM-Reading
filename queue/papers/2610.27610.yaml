  title: 'Auditing the Product, Not the Recursion: The Evaluation Evidence Behind Recursive Self-Improvement
    Claims'
  authors:
  - Zihan Chen
  - Di Zhu
  - Lei Nico Zheng
  published: '2026-10-20'
  updated: '2026-10-20'
  categories:
  - cs.LG
  - cs.AI
  - cs.CL
