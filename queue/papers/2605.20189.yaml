  abstract: Despite the remarkable success of large language models (LLMs), they still face bottlenecks
    while deploying in dynamic, real-world settings with primary challenges being concept drift and the
    high cost of gradient-based adaptation. Traditional fine-tuning (FT) struggles to adapt to non-stationary
    data streams without resulting in catastrophic for getting or requiring extensive manual data curation.
    To address these limitations within the streaming and continual learning paradigm, we propose the
    Self-Optimizing Lifelong Autonomous Reasoner (SOLAR) which is an open-ended autonomous agent that
    leverages parameter-level meta-learning to self-improve, treating model weights as an environment
    for exploration. It initiates the process by consolidating a strong prior over common-sense knowledge
    making it effective for transfer-learning. By utilizing a multi-level reinforcement learning approach,
    SOLAR autonomously discovers adaptation strategies, enabling efficient test-time adaptation to unseen
    domains. Crucially, SOLAR maintains an evolving knowledge base of valid modification strategies, implicitly
    acting as an episodic memory buffer to balance plasticity (adaptation to new tasks) and stability
    (retention of meta-knowledge). Experiments demonstrate that SOLAR outperforms strong baselines on
    common-sense, mathematical, medical, coding, social and logical reasoning tasks, marking a significant
    step toward autonomous agents capable of lifelong adaptation in evolving environments.
