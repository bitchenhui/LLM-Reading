  title: 'CoachSI: Self-Improvement of Robot Policies with a Language Coach'
  authors:
  - Jiachen Tao
  - Gengyu Zhang
  - Haoxuan Wang
  - Bing Liu
  - Yan Yan
  published: '2026-11-19'
  updated: '2026-11-19'
  categories:
  - cs.RO
  - cs.AI
  abstract: 'Generalist robot policies execute atomic skills reliably but fail when the same skills are
    composed into long-horizon tasks. Self-improvement from the policy''s own experience does not close
    this gap: experience collected by the policy alone stays within its own distribution and reproduces
    what it can already do. We show that what the policy lacks is not a skill but the next step. We present
    CoachSI, a self-improvement method in which a frozen, off-the-shelf vision-language model (VLM) coaches
    the policy in language: it watches the robot and names the next step in the format of the policy''s
    atomic instructions, and never outputs an action. Successful coached rollouts are relabeled in hindsight
    with the original task instruction and used to fine-tune the policy. The fine-tuned policy is then
    deployed on its own. On states where a World Action Model and a Vision-Language-Action model have
    stalled, naming the next step raises subgoal completion by 4.6x over the unchanged task instruction,
    and the frozen VLM supplies it from the same camera images the policy sees. After fine-tuning, unassisted
    success on long-horizon tasks in unseen scenes rises from 47.4% to 59.3%, 9.8 points above fine-tuning
    on human demonstrations and 7.3 points above fine-tuning on self-collected successes at an equal data
    budget. With a coach that sees only camera images, it reaches 56.8%, above both baselines. The gain
    is obtained with the action backbone frozen: language coaching teaches the policy what should happen
    next, and the skills it already has do the rest.'
