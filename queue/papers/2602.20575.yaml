  abstract: Driving interaction data are important for training and evaluating autonomous drivingVision-Language-Action
    (VLA) models, but existing datasets contain limited denseinteraction samples and weak alignment between
    trajectories, visual inputs, and languageannotations. This work presents the Interactive Enhanced
    Driving Dataset (IEDD), alarge-scale interaction-oriented dataset constructed from five naturalistic
    trajectory datasets:Lyft Level 5, Waymo, nuPlan, INTERACTION, and SIND. IEDD contains 7.31 millionego-centric
    interaction segments, including 6.66 million multi agents cases, covering head-on,car-following, merging,
    and crossing interactions. Each segment is associated withtrajectory-derived interaction metrics describing
    interaction intensity and efficiency. Based onthese annotations, IEDD-VQA further provides trajectory-reconstructed
    BEV videos,structured interaction semantics, and multi-turn question-answer pairs. The dataset cansupport
    interaction mining, long-tail scenario analysis, VLA instruction tuning, andhierarchical evaluation
    of perception, behavior description, physical quantification, andcounterfactual reasoning.
