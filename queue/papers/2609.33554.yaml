  title: An Efficient Parametric Codec for Low-Bitrate First-Order Ambisonics
  authors:
  - Wei-Ting Lai
  - Amy Bastine
  - Lachlan Birnie
  - Thushara D. Abhayapala
  - Prasanga N. Samarasinghe
  published: '2026-09-27'
  updated: '2026-09-27'
