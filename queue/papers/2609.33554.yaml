  abstract: Driven by the rapid growth of immersive teleconferencing and generative spatial audio, efficient
    low-bitrate coding of first-order Ambisonics (FOA) has become increasingly important. In this work,
    we develop a lightweight parametric FOA codec that retains the standard Directional Audio Coding analysis
    and synthesis while redesigning the spatial metadata quantization scheme. Rather than quantizing direction-of-arrival
    (DOA) and diffuseness independently, we combine them into a 3-D directivity vector and jointly quantize
    these vectors across frequency bands via residual vector quantization (RVQ). The RVQ codebooks are
    optimized within minutes via stage-wise k-means without backpropagation, yielding a constant-bitrate
    (CBR) representation that decouples metadata rate from the number of frequency bands. Evaluations
    show that our approach outperforms low-bitrate perceptual codecs in FOA reconstruction, remains competitive
    with neural codecs on the downstream Sound Event Localization and Detection task, and maintains robust
    performance when paired with different external monaural codecs. Given its lightweight training, strong
    performance, and CBR design, we consider the proposed method to be a favorable and reproducible baseline
    for future FOA codec research.
