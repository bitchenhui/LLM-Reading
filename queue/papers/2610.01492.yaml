  abstract: 'Neural speech codecs increasingly serve as tokenizers for speech language models (SLMs).
    Lowering the frame rate reduces the computational and memory costs of SLMs, but makes it difficult
    to preserve both linguistic information and acoustic detail. Existing approaches rely on rule-based
    compression: average pooling can discard linguistic information, whereas similarity-based merging
    uses a fixed threshold on adjacent-frame similarity and applies the resulting boundaries to the acoustic
    stream. We propose Q-SPT, a low-frame-rate dual-stream speech tokenizer with separate, context-aware,
    learnable query-based compressors specialized for semantic and acoustic representations. In particular,
    queries at a fixed rate independently attend to the semantic and acoustic streams as separate key-value
    sources, enabling stream-specific, context-aware aggregation through two separately learned compressors.
    In addition, an autoregressive text loss explicitly supervises the semantic compressor to preserve
    linguistic information. Experimental results show that Q-SPT achieves the best reconstruction among
    the evaluated codecs at the same frame rate. In downstream SLMs, it yields the best speech recognition
    accuracy and text-to-speech perceptual quality with competitive intelligibility.'
