  abstract: 'Adaptive bitrate streaming (ABR) over the HyperText Transfer Protocol (HTTP), which raises
    numerous delicate questions, is nowadays almost the only approach to video streaming. This paper presents
    elementary solutions to three key issues: 1) A straightforward feedforward control strategy for the
    bitrate and the buffer level via flatness-based control. 2) Closing the loop permits mitigating unavoidable
    mismatches and disturbances, such as Internet fluctuations. This is adapted from the new HEOL setting,
    which mixes model-free and flatness-based controls. 3) An easily implementable closed-form estimate
    of the bandwidth via algebraic identification techniques is derived, perhaps for the first time. It
    permits handling severe variations in channel capacity. Several computer experiments and metrics for
    evaluating the Quality of Experience (QoE) are displayed and discussed.'
