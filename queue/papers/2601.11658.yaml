  abstract: Large Language Model (LLM) based agents are powerful yet fundamentally static after deployment,
    lacking the ability to autonomously expand capabilities, generate new tools, or evolve their reasoning.
    This work introduces a hierarchical self-evolving multi-agent framework that integrates a Base LLM,
    an operational SLM agent, a Code-Generation LLM, and a Teacher-LLM to enable continuous adaptation.
    The workflow begins with the agent attempting a task using reasoning and existing tools; if unsuccessful,
    it escalates to tool synthesis through the Code-Gen LLM, and when failures persist, it triggers an
    evolution phase using Curriculum Learning (CL), Reward-Based Learning (RL), or Genetic Algorithm (GA)
    evolution. Using the TaskCraft dataset rich in hierarchical tasks, tool-use traces, and difficulty
    scaling we evaluate these paradigms. CL delivers fast recovery and strong generalization, RL excels
    on high-difficulty tasks, and GA offers high behavioral diversity. Across all settings, evolved agents
    outperform their originals, demonstrating robust, autonomous, self-improving agentic evolution.
