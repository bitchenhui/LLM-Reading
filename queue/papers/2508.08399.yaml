  abstract: Neural audio codecs (NACs), which use neural networks to generate compact audio representations,
    have garnered interest for their applicability to many downstream tasks -- especially quantized codecs
    due to their compatibility with large language models. However, unlike text, speech conveys not only
    linguistic content but also rich paralinguistic features. Encoding these elements in an entangled
    fashion may be suboptimal, as it limits flexibility. For instance, voice conversion (VC) aims to convert
    speaker characteristics while preserving the original linguistic content, which requires a disentangled
    representation. Inspired by VC methods utilizing $k$-means quantization with self-supervised features
    to disentangle phonetic information, we develop a discrete NAC capable of structured disentanglement.
    Experimental evaluations show that our approach achieves reconstruction performance on par with conventional
    NACs that do not explicitly perform disentanglement, while also matching the effectiveness of conventional
    VC techniques.
