  title: 'BrainFocus: EEG-Guided ROI Selection for Efficient Vision-Language Models'
  authors:
  - Yihui Peng
  - Guorui Lu
  - Qinyu Chen
  published: '2026-09-15'
  updated: '2026-09-15'
  categories:
  - cs.CV
  abstract: Vision-language models (VLMs) achieve strong visual question answering (VQA) performance,
    but processing large cluttered images is computationally expensive when only a small region is relevant.
    Electroencephalography (EEG) signals, which capture human neural responses to visual stimuli, can
    provide a human-derived semantic cue about the region of interest (ROI). However, EEG-guided visual
    category decoding remains imperfect, making direct ROI routing unreliable. In this work, we propose
    BrainFocus, a reliable EEG-guided efficient VLM framework for VQA. An EEG classifier predicts a target
    category, and a YOLO detector localizes the matching ROI. The VLM receives the cropped ROI only when
    both predictions pass confidence thresholds; otherwise, it processes the full image. For evaluation,
    we build on EEG-ImageNet to construct a 40-class benchmark comprising generated cluttered images and
    real object-centric images, with target-ROI annotations and 600 English visual question-answer pairs.
    Across Qwen3.5-VL 2B, 4B, and 9B models, BrainFocus improves VQA accuracy by 4.14-9.87 percentage
    points (pp) on cluttered scenes while reducing input tokens and total tokens by 23.2%-39.4% and 23.2%-39.3%,
    and end-to-end floating-point operations (FLOPs) by 23.2%-39.5%. These results demonstrate that EEG
    can guide efficient VLM inference even when its semantic decoding is imperfect.
