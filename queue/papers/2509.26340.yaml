  title: Memory-Driven Self-Improvement for Decision Making with Large Language Models
  authors:
  - Xue Yan
  - Zijing Ou
  - Mengyue Yang
  - Yan Song
  - Haifeng Zhang
  - Yingzhen Li
  - Jun Wang
  published: '2025-09-30'
  updated: '2025-09-30'
