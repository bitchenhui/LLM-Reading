  abstract: Spatially encoded speech conveys not only linguistic information but also spatial cues. This
    enables listeners to distinguish and localize speakers, contributing to more natural and realistic
    auditory experiences in applications such as remote conferencing and immersive media. Neural speech
    codecs (NSCs) enable high-quality reconstruction of monaural speech at increasingly low bitrates while
    preserving linguistic information, but their ability to effectively preserve spatial cues remains
    limited. We propose FOAdapter, a plug-and-play spatial tokenizer that leverages a pretrained monaural
    speech codec to efficiently represent both linguistic and spatial information in first-order ambisonic
    (FOA) speech at low bitrates. Comprehensive evaluation demonstrates that FOAdapter consistently preserves
    spatial information across all evaluated codecs. Source code and audio examples are available on our
    demo website.
