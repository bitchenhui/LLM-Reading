  abstract: The Human Visual System (HVS), with its intricate sophistication, is capable of achieving
    ultra-compact information compression for visual signals. This remarkable ability is coupled with
    high generalization capability and energy efficiency. By contrast, the state-of-the-art Versatile
    Video Coding (VVC) standard achieves a compression ratio of around 1,000 times for raw visual data.
    This notable disparity motivates the research community to draw inspiration to effectively handle
    the immense volume of visual data in a green way. Therefore, this paper provides a survey of how visual
    data can be efficiently represented for green multimedia, in particular when the ultimate task is
    knowledge extraction instead of visual signal reconstruction. We introduce recent research efforts
    that promote green, sustainable, and efficient multimedia in this field. Moreover, we discuss how
    the deep understanding of the HVS can benefit the research community, and envision the development
    of future green multimedia technologies.
