  abstract: 'Multi-modal Large Language Models (MLLMs) for Visual Question Answering (VQA) often suffer
    from dual limitations: knowledge hallucination and insufficient fine-grained visual perception. Crucially,
    we identify that commonsense graphs and scene graphs provide precisely complementary solutions to
    these respective deficiencies by providing rich external knowledge and capturing fine-grained visual
    details. However, prior works typically treat them in isolation, overlooking their synergistic potential.
    To bridge this gap, we propose KG-ViP, a unified framework that empowers MLLMs by fusing scene graphs
    and commonsense graphs. The core of the KG-ViP framework is a novel retrieval-and-fusion pipeline
    that utilizes the query as a semantic bridge to progressively integrate both graphs, synthesizing
    a unified structured context that facilitates reliable multi-modal reasoning. Extensive experiments
    on FVQA 2.0+ and MVQA benchmarks demonstrate that KG-ViP significantly outperforms existing VQA methods.'
