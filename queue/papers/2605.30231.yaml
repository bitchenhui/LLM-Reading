  title: 'Beyond 3D VQAs: Injecting 3D Spatial Priors into Vision-Language Models for Enhanced Geometric
    Reasoning'
  authors:
  - Chun-Hsiao Yeh
  - Shengyi Qian
  - Manchen Wang
  - Yi Ma
  - Joseph Tighe
  - Fanyi Xiao
  published: '2026-05-28'
  updated: '2026-05-28'
  categories:
  - cs.CV
  - cs.AI
  abstract: 'Vision-Language Models (VLMs) often struggle with robust 3D spatial reasoning. Prevailing
    methods that rely on fine-tuning with 3D visual question-answering (VQA) datasets may overfit dataset-specific
    biases, while integrating specialized 3D visual encoders is often inflexible and cumbersome. In this
    paper, we argue that genuine spatial understanding should emerge from learning fundamental geometric
    priors, not only from high-level VQA supervision. We propose GASP (Geometric-Aware Spatial Priors),
    a framework that injects these priors directly into the LLM''s transformer layers. GASP employs a
    small correspondence head, applied as a deep supervision signal across all layers, and is trained
    with a dual objective leveraging ground-truth geometry from large-scale video scenes: a contrastive
    loss on ground-truth point correspondences enforces 2D view-invariance, while a depth consistency
    supervision resolves 3D geometric ambiguities. Our analysis first provides a diagnostic showing that
    standard VLMs'' internal correspondence matching accuracy is very low (often below 5%). We then demonstrate
    that our training substantially improves this behavior, boosting peak layer-wise correspondence to
    over 70% and maintaining over 85% temporal robustness while baselines remain below 5%. These internal
    improvements translate to significant gains on downstream spatial benchmarks including +18.2% on All-Angles
    Bench and +29.0% on VSI-Bench, all without training on any 3D VQA data. Our findings indicate that
    learning from fundamental geometric priors is a promising and generalizable pathway towards VLMs with
    more reliable 3D spatial reasoning.'
