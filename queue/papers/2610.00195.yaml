  title: 'GS-PQM: A Parameter-Domain Quality Metric for Compressed Gaussian Splatting'
  authors:
  - Pedro Martin
  - António Rodrigues
  - João Ascenso
  - Maria Paula Queluz
  published: '2026-09-18'
