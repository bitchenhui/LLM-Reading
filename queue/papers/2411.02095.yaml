  abstract: Volumetric video, the capture and display of three-dimensional (3D) imagery, has emerged as
    a revolutionary technology poised to transform the media landscape, enabling immersive experiences
    that transcend the limitations of traditional 2D video. One of the key challenges in this domain is
    the efficient delivery of these high-bandwidth, data-intensive volumetric video streams, which requires
    innovative transcoding and compression techniques. This research paper explores the state-of-the-art
    in volumetric video compression and delivery, with a focus on the potential of AI-driven solutions
    to address the unique challenges posed by this emerging medium.
