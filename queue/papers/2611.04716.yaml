  abstract: Generative speech models synthesize audio that is difficult to distinguish from human recordings.
    Synthetic speech can be watermarked as a proactive disclosure method, but watermarking models remain
    vulnerable to resynthesis attacks using neural audio codecs. This article investigates speech watermarking
    robustness across neural codec and digital signal processing attacks, when specific neural codecs
    are used for channel augmentation during training. We also present a novel zero-bit watermarking system
    that uses Descript Audio Codec as the generator. Our results demonstrate that the choice of augmentation
    codec significantly influences robustness generalization. Experiments show that augmentation with
    low-bitrate, high-quality neural codecs-Mimi and SNAC-results in promising robustness against unseen
    neural codecs and traditional attacks with limited quality impact.
