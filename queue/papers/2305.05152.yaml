  title: Who is Speaking Actually? Robust and Versatile Speaker Traceability for Voice Conversion
  authors:
  - Yanzhen Ren
  - Hongcheng Zhu
  - Liming Zhai
  - Zongkun Sun
  - Rubing Shen
  - Lina Wang
  published: '2023-05-09'
  updated: '2023-07-26'
