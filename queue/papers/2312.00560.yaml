  abstract: 'This document provides a technical description of the codec proposed by EPFL to the JPEG
    DNA Call for Proposals. The codec we refer to as V-DNA for its versatility, enables the encoding of
    raw images and already compressed JPEG 1 bitstreams, but the underlying algorithm could be used to
    encode and transcode any kind of data. The codec is composed of two main modules: the image compression
    module, handled by the state-of-the-art JPEG XL codec, and the DNA encoding module, implemented using
    a modified Raptor Code implementation following the RU10 (Raptor Unsystematic) description. The code
    for encoding and decoding, as well as the objective metrics results, plots and biochemical constraints
    analysis are available on ISO Documents system with document number WG1M101013-ICQ-EPFL submission
    to the JPEG DNA CfP.'
