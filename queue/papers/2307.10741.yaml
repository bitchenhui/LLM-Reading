  title: Aggressive saliency-aware point cloud compression
  authors:
  - Eleftheria Psatha
  - Dimitrios Laskos
  - Gerasimos Arvanitis
  - Konstantinos Moustakas
  published: '2023-07-20'
  updated: '2023-07-20'
  categories:
  - eess.IV
