  title: 'UniAudio 2.0: A Unified Audio Language Model with Text-Aligned Factorized Audio Tokenization'
  authors:
  - Dongchao Yang
  - Yuanyuan Wang
  - Dading Chong
  - Songxiang Liu
  - Xixin Wu
  - Helen Meng
  published: '2026-02-04'
  updated: '2026-02-11'
