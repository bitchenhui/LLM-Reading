  title: 'S-PRESSO: Ultra Low Bitrate Sound Effect Compression With Diffusion Autoencoders And Offline
    Quantization'
  authors:
  - Zineb Lahrichi
  - Gaëtan Hadjeres
  - Gaël Richard
  - Geoffroy Peeters
  published: '2026-02-16'
  updated: '2026-02-23'
