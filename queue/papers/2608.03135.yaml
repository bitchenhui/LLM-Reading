  title: 'Rectify Then Diffuse: Disentangling Concepts Before Denoising Trajectory Unfolds'
  authors:
  - Ning Zhu
  - An Chen
  - Mengfei Zhao
  - Juntao Xu
  - Jingze Liang
  - Boyuan Gu
  - Liang-Jian Deng
  published: '2026-08-04'
  updated: '2026-08-04'
