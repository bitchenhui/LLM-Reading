  title: 'HiNeRV: Video Compression with Hierarchical Encoding-based Neural Representation'
  authors:
  - Ho Man Kwan
  - Ge Gao
  - Fan Zhang
  - Andrew Gower
  - David Bull
  published: '2023-06-16'
  updated: '2024-01-26'
