  title: 'NAWQ-SR: A Hybrid-Precision NPU Engine for Efficient On-Device Super-Resolution'
  authors:
  - Stylianos I. Venieris
  - Mario Almeida
  - Royson Lee
  - Nicholas D. Lane
  published: '2022-12-15'
  updated: '2023-03-14'
