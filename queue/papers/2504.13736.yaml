  title: 'LimitNet: Progressive, Content-Aware Image Offloading for Extremely Weak Devices & Networks'
  authors:
  - Ali Hojjat
  - Janek Haberer
  - Tayyaba Zainab
  - Olaf Landsiedel
  published: '2025-04-18'
  updated: '2025-04-18'
  categories:
  - cs.CV
