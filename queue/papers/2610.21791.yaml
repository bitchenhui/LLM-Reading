  abstract: Large language model (LLM) agents have demonstrated strong capabilities in complex tasks,
    including code generation, tool use, and multi-hop question answering. Existing self-improvement methods
    enhance agent performance through model optimization, harness evolution, and executable artifact refinement,
    while recursive self-improvement (RSI) further extends optimization to the improvement mechanisms
    themselves. However, adapting self-improvement workflows to evolving performance bottlenecks while
    improving workflow orchestration through execution feedback remains a key challenge. We propose \textbf{RSIFlow},
    a \textbf{R}ecursive \textbf{S}elf-\textbf{I}mprovement framework that integrates adaptive work\textbf{flow}
    orchestration with meta-agent capability evolution. RSIFlow diagnoses performance bottlenecks from
    task-agent trajectories and environmental feedback to dynamically select component-specific improvement
    workflows. The meta-agent then distills workflow outcomes into component-specific skills and cross-component
    principles, evolving its own harness to improve subsequent workflow orchestration. Experiments across
    six benchmarks and two backbone models show that RSIFlow achieves the SOTA average performance on
    all benchmarks. Ablation studies further demonstrate the contributions of adaptive workflow orchestration
    and meta-harness evolution. Code is available at https://github.com/1HUAN1/RSI-Flow.
