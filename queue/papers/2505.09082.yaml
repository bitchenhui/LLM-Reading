  abstract: Recent advancements in large language models (LLMs) demonstrate exceptional Chinese text processing
    capabilities, particularly in Chinese Spelling Correction (CSC). While LLMs outperform traditional
    BERT-based models in accuracy and robustness, challenges persist in reliability and generalization.
    This paper proposes CEC-Zero, a novel reinforcement learning (RL) framework enabling LLMs to self-correct
    through autonomous error strategy learning without external supervision. By integrating RL with LLMs'
    generative power, the method eliminates dependency on annotated data or auxiliary models. Experiments
    reveal RL-enhanced LLMs achieve industry-viable accuracy and superior cross-domain generalization,
    offering a scalable solution for reliability optimization in Chinese NLP applications. This breakthrough
    facilitates LLM deployment in practical Chinese text correction scenarios while establishing a new
    paradigm for self-improving language models.
