  title: 'RDEIC: Accelerating Diffusion-Based Extreme Image Compression with Relay Residual Diffusion'
  authors:
  - Zhiyuan Li
  - Yanhui Zhou
  - Hao Wei
  - Chenyang Ge
  - Ajmal Mian
  published: '2024-10-03'
  updated: '2025-05-26'
