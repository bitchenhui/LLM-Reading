  title: 'DiffuseAgent-MI: Distributionally-Grounded,Tool-Integrated Self-Evolving Agents for Faithful
    Visual Reasoning'
  authors:
  - An Lanji
  - Dawei Liu
  - Jin Li
  - Haoran Xu
  - Mei Chen
  - Yu Tian
  published: '2026-08-01'
  updated: '2026-08-01'
  categories:
  - cs.CV
  abstract: 'Tool-integrated vision-language agents have made remarkable progress on compositional and
    multi-step visual reasoning. Yet their outputs frequently exhibit unfaithfulness: the stated reasoning
    path diverges from the computation that actually produced the answer, undermining reliability in safety-critical
    applications. We present DiffuseAgent-MI, a self-evolving agent whose perceptual grounding is governed
    by a KL-minimal energy model over feature units, providing a distributional view of visual mechanistic
    interpretability. The agent learns an energy landscape that softly constrains generated samples to
    lie near the native prior conditioned on the chosen interpretable unit, closing the gap between the
    explanation and the internal representation. A verifier then supplies trajectory-level faithfulness
    rewards, and a repair branch re-conditions the energy when the verifier flags an unfaithful step.
    On GeoQA, SciVis, VQA-v2 and an in-house multimodal reasoning set, DiffuseAgent-MI improves accuracy
    by up to 5.1 points over prior self-evolving agents while more than doubling mutual-information faithfulness
    and human-interpretability agreement. Our analysis shows the energy term and the verifier are complementary:
    the former guarantees distributional faithfulness, the latter trajectory-level faithfulness, and only
    their combination closes both gaps.'
