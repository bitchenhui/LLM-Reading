  title: 'ReAct Meets ActRe: When Language Agents Enjoy Training Data Autonomy'
  authors:
  - Zonghan Yang
  - Peng Li
  - Ming Yan
  - Ji Zhang
  - Fei Huang
  - Yang Liu
  published: '2024-03-21'
