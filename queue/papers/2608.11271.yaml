  title: Hardware-Aware Deployment of Joint SAR Compression and Despeckling on FPGA
  authors:
  - Cédric Léonard
  - Francescopaolo Sica
  - Martin Schulz
  published: '2026-08-11'
  updated: '2026-08-11'
