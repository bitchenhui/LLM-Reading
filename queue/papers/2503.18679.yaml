  abstract: This paper presents an intra coding tool, named Merge mode for Template-based Intra Mode Derivation
    (TIMD). TIMD-Merge has been adopted in the 15\textsuperscript{th} version of the Enhanced Compression
    Model (ECM) software that explores video coding technologies beyond Versatile Video Coding (VVC) standard.
    This proposed tool operates on top of the regular TIMD mode that applies a template-based search on
    a causal adjacent template at top and at left of the current block, in order to find the best Intra
    Prediction Modes (IPMs) that matches the template. The proposed TIMD-Merge in this paper addresses
    a shortcoming in the regular TIMD method where due to texture discrepancy, the adjacent template information
    around the block is not reliable. To do so, the proposed TIMD-Merge constructs a list of all TIMD-coded
    blocks in relatively larger template area than the template of the regular TIMD, which also includes
    non-adjacent neighboring blocks. This list, called the merge list, is then sorted on the template
    to give one best set of TIMD modes. The use of TIMD-Merge mode is signalled at the block level and
    the implementation in the ECM-14.0 demonstrates -0.08\% performance improvement in terms of luma BDR
    gain, with negligible encoding and decoding runtime increase of 100.6% and 100.2%, respectively.
