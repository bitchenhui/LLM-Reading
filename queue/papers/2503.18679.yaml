  title: Merge Mode for Template-based Intra Mode Derivation (TIMD) in ECM
  authors:
  - Mohsen Abdoli
  - Ramin G. Youvalari
  - Frank Plowman
  - Alexandre Tissier
  published: '2025-03-24'
