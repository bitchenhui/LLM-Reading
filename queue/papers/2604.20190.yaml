  title: 'WildFireVQA: A Large-Scale Radiometric Thermal VQA Benchmark for Aerial Wildfire Monitoring'
  authors:
  - Mobin Habibpour
  - Niloufar Alipour Talemi
  - John Spodnik
  - Camren J. Khoury
  - Fatemeh Afghah
  published: '2026-04-22'
  updated: '2026-04-22'
