  abstract: Neural audio codecs (NACs) enable efficient audio compression and have achieved success in
    downstream tasks such as speech synthesis. However, their discrete representations consistently underperform
    traditional spectral features in automatic speaker verification (ASV). We empirically demonstrate
    that speaker cues are implicitly preserved in discrete tokens but remain underutilized by conventional
    ASV training paradigms. To address this, we propose a Cross-Feature Knowledge Distillation (CFKD)
    framework. By guiding the codec-based student to mimic the embedding space of a strong Fbank-based
    teacher, CFKD provides structured supervision for effective utilization of speaker information in
    tokens. Experiments on the VoxCeleb benchmarks show that CFKD substantially improves the ASV performance
    of codec-based systems, allowing them to approach the accuracy of Fbank-based teacher models and highlighting
    the potential of discrete audio tokens for diverse speech tasks.
