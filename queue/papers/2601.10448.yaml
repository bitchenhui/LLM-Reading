meta:
  title: Subjective evaluation of UHD video coded using VVC with LCEVC and ML-VVC
  authors:
  - Naeem Ramzan
  - Muhammad Tufail Khan
  published: '2026-01-15'
  updated: '2026-01-15'
  categories:
