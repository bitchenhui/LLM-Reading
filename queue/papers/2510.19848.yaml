  abstract: Immersive televisualization is important both for telepresence and teleoperation, but resolution
    and fidelity are often limited by communication bandwidth constraints. We propose a lightweight method
    for foveated compression of immersive televisualization video streams that can be easily integrated
    with common video codecs, reducing the required bandwidth if eye tracking data is available. Specifically,
    we show how to spatially adjust the Quantization Parameter of modern block-based video codecs in a
    adaptive way based on eye tracking information. The foveal region is transmitted with high fidelity
    while quality is reduced in the peripheral region, saving bandwidth. We integrate our method with
    the NimbRo avatar system, which won the ANA Avatar XPRIZE competition. Our experiments show that bandwidth
    can be reduced to a third without sacrificing immersion. We analyze transmission fidelity with qualitative
    examples and report quantitative results.
