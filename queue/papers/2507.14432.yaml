  abstract: The advent of 3D Gaussian splatting (3DGS) has significantly enhanced the quality of volumetric
    video representation. Meanwhile, in contrast to conventional volumetric video, 3DGS video poses significant
    challenges for streaming due to its substantially larger data volume and the heightened complexity
    involved in compression and transmission. To address these issues, we introduce an innovative framework
    for 3DGS volumetric video streaming. Specifically, we design a 3DGS video construction method based
    on the Gaussian deformation field. By employing hybrid saliency tiling and differentiated quality
    modeling of 3DGS video, we achieve efficient data compression and adaptation to bandwidth fluctuations
    while ensuring high transmission quality. Then we build a complete 3DGS video streaming system and
    validate the transmission performance. Through experimental evaluation, our method demonstrated superiority
    over existing approaches in various aspects, including video quality, compression effectiveness, and
    transmission rate.
