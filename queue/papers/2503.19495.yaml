  title: End-to-End Semantic Preservation in Text-Aware Image Compression Systems
  authors:
  - Stefano Della Fiore
  - Alessandro Gnutti
  - Marco Dalai
  - Pierangelo Migliorati
  - Riccardo Leonardi
  published: '2025-03-25'
  updated: '2025-10-15'
