  title: A Two-Stage Multitask Vision-Language Framework for Explainable Crop Disease Visual Question
    Answering
  authors:
  - Md. Zahid Hossain
  - Most. Sharmin Sultana Samu
  - Md. Rakibul Islam
  - Md. Siam Ansary
  published: '2026-01-08'
  updated: '2026-03-07'
  categories:
  - cs.CV
