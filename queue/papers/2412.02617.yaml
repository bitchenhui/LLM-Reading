  abstract: 'Large text-to-video models hold immense potential for a wide range of downstream applications.
    However, they struggle to accurately depict dynamic object interactions, often resulting in unrealistic
    movements and frequent violations of real-world physics. One solution inspired by large language models
    is to align generated outputs with desired outcomes using external feedback. In this work, we investigate
    the use of feedback to enhance the quality of object dynamics in text-to-video models. We aim to answer
    a critical question: what types of feedback, paired with which specific self-improvement algorithms,
    can most effectively overcome movement misalignment and realistic object interactions? We first point
    out that offline RL-finetuning algorithms for text-to-video models can be equivalent as derived from
    a unified probabilistic objective. This perspective highlights that there is no algorithmically dominant
    method in principle; rather, we should care about the property of reward and data. While human feedback
    is less scalable, vision-language models could notice the video scenes as humans do. We then propose
    leveraging vision-language models to provide perceptual feedback specifically tailored to object dynamics
    in videos. Compared to popular video quality metrics measuring alignment or dynamics, the experiments
    demonstrate that our approach with binary AI feedback drives the most significant improvements in
    the quality of interaction scenes in video, as confirmed by AI, human, and quality metric evaluations.
    Notably, we observe substantial gains when using signals from vision language models, particularly
    in scenarios involving complex interactions between multiple objects and realistic depictions of objects
    falling.'
