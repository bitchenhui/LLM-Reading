  title: 'Solving the Problem of Poor Internet Connectivity in Dhaka: Innovative Solutions Using Advanced
    WebRTC and Adaptive Streaming Technologies'
  authors:
  - Pavel Malinovskiy
  published: '2025-06-19'
  updated: '2025-06-19'
