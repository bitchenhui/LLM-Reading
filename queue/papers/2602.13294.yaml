  title: 'VisPhyWorld: Probing Physical Reasoning via Code-Driven Video Reconstruction'
  authors:
  - Jiarong Liang
  - Max Ku
  - Ka-Hei Hui
  - Ping Nie
  - Wenhu Chen
  published: '2026-02-09'
  updated: '2026-05-21'
