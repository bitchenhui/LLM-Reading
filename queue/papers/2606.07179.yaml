  title: 'EvoGS: Constructing Continuous-Layered Gaussian Splatting with Evolution Tree for Scalable 3D
    Streaming'
  authors:
  - Yuang Shi
  - Simone Gasparini
  - Géraldine Morin
  - Wei Tsang Ooi
  published: '2026-06-05'
  updated: '2026-06-05'
