  title: A Reference-Free Framework for Evaluating Single-Frame ISP Pipelines
  authors:
  - Yujin Cho
  - Sira Ferradans
  - Jean-Michel Morel
  - Gabriele Facciolo
  - Thomas Eboli
  published: '2026-07-25'
  updated: '2026-07-25'
