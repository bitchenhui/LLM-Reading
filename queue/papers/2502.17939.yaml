  title: 'Deep-JGAC: End-to-End Deep Joint Geometry and Attribute Compression for Dense Colored Point
    Clouds'
  authors:
  - Yun Zhang
  - Zixi Guo
  - Linwei Zhu
  - C. -C. Jay Kuo
  published: '2025-02-25'
  updated: '2025-02-25'
