  abstract: 'Video compression artifacts arise due to the quantization operation in the frequency domain.
    The goal of video quality enhancement is to reduce compression artifacts and reconstruct a visually-pleasant
    result. In this work, we propose a hierarchical frequency-based upsampling and refining neural network
    (HFUR) for compressed video quality enhancement. HFUR consists of two modules: implicit frequency
    upsampling module (ImpFreqUp) and hierarchical and iterative refinement module (HIR). ImpFreqUp exploits
    DCT-domain prior derived through implicit DCT transform, and accurately reconstructs the DCT-domain
    loss via a coarse-to-fine transfer. Consequently, HIR is introduced to facilitate cross-collaboration
    and information compensation between the scales, thus further refine the feature maps and promote
    the visual quality of the final output. We demonstrate the effectiveness of the proposed modules via
    ablation experiments and visualized results. Extensive experiments on public benchmarks show that
    HFUR achieves state-of-the-art performance for both constant bit rate and constant QP modes.'
