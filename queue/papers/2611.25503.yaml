  abstract: Speech-scene generation aims to synthesize intelligible target speech together with diverse
    environmental sounds as a coherent acoustic scene. The task is considered challenging in two respects.
    Speech and environmental audio differ substantially in their semantic and acoustic characteristics,
    yet existing approaches typically model the complete scene using a single mixed acoustic representation.
    At the same time, the two sounds are closely related in real-world speech scenes, whereas conventional
    approaches usually rely on simulated scenes mixed from independently recorded sources. We propose
    a large language model (LLM)-based framework for joint modeling of distinct speech and environment
    token streams. A source-aware neural audio codec extracts temporally aligned speech and environment
    tokens from mixed audio, and a pretrained LLM generates both token streams in an interleaved fashion
    conditioned on the natural-language scene description and speech content. This formulation preserves
    source-specific representations while modeling the token streams within a shared generative context.
    Since both streams are extracted directly from mixed recordings, the model can also be adapted to
    in-the-wild speech scenes without isolated sources. Our experimental results demonstrate that the
    proposed framework improves speech intelligibility, scene relevance, and audio quality over existing
    speech-scene generation techniques, with consistent gains from real-world adaptation. We further investigate
    the effects of distinct token representations and interleaved generation, and analyze whether the
    environmental sound remains stable while speech is active and how the two streams interact.
