  abstract: Large language model-based agents make mistakes, yet critique can often guide the same model
    toward correct behavior. However, when critique is removed, the model may fail again on the same query,
    indicating that it has not internalized the critique's guidance into its underlying capability. Meanwhile,
    a frozen critic cannot improve its feedback quality over time, limiting the potential for iterative
    self-improvement. To address this, we propose learning to internalize self-critique with reinforcement
    learning(ICRL), a novel framework that jointly trains a solver and a critic from a shared backbone
    to convert critique-induced success into unassisted solver ability. The critic is rewarded based on
    the solver's subsequent performance gain, incentivizing actionable feedback. To address the distribution
    shift between critique-conditioned and critique-free behavior, ICRL introduces a distribution-calibration
    re-weighting ratio that selectively transfers critique-guided improvements compatible with the solver's
    own prompt distribution. Additionally, a role-wise group advantage estimation stabilizes joint optimization
    across the two roles. Together, these mechanisms ensure that the solver learns to improve itself without
    external critique, rather than becoming dependent on critique-conditioned behavior. We evaluate ICRL
    on diverse benchmarks spanning agentic and mathematical reasoning tasks, using Qwen3-4B and Qwen3-8B
    as backbones. Results show consistent improvements, with average gains of 6.4 points over GRPO on
    agentic tasks, and 7.0 points on mathematical reasoning. Notably, the learned 8B critic is comparable
    to 32B critics while using substantially fewer tokens. The code is available at https://github.com/brick-pid/ICRL.
