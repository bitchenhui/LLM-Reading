  title: 'ReSAIL: Mitigating Collapse in Iterative Agent Self-Distillation'
  authors:
  - Shengjie Jin
  - Hengbo Xu
  - Zelong Sun
  - YuJie Guo
  - Zhiwu Lu
  published: '2026-09-30'
  updated: '2026-09-30'
  categories:
  - cs.LG
