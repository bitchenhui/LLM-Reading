  title: 'V^3: Viewing Volumetric Videos on Mobiles via Streamable 2D Dynamic Gaussians'
  authors:
  - Penghao Wang
  - Zhirui Zhang
  - Liao Wang
  - Kaixin Yao
  - Siyuan Xie
