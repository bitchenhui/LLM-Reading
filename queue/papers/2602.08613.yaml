  abstract: Point cloud is a prevalent 3D data representation format with significant application values
    in immersive media, autonomous driving, digital heritage protection, etc. However, the large data
    size of point clouds poses challenges to transmission and storage, which influences the wide deployments.
    Therefore, point cloud compression plays a crucial role in practical applications for both human and
    machine perception optimization. To this end, the Moving Picture Experts Group (MPEG) has established
    two standards for point cloud compression, including Geometry-based Point Cloud Compression (G-PCC)
    and Video-based Point Cloud Compression (V-PCC). In the meantime, the Audio Video coding Standard
    (AVS) Workgroup of China also have launched and completed the development for its first generation
    point cloud compression standard, namely AVS PCC. This new standardization effort has adopted many
    new coding tools and techniques, which are different from the other counterpart standards. This paper
    reviews the AVS PCC standard from two perspectives, i.e., the related technologies and performance
    comparisons.
