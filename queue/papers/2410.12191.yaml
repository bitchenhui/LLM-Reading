  abstract: Current test- or compression-time adaptation image compression (TTA-IC) approaches, which
    leverage both latent and decoder refinements as a two-step adaptation scheme, have potentially enhanced
    the rate-distortion (R-D) performance of learned image compression models on cross-domain compression
    tasks, \textit{e.g.,} from natural to screen content images. However, compared with the emergence
    of various decoder refinement variants, the latent refinement, as an inseparable ingredient, is barely
    tailored to cross-domain scenarios. To this end, we aim to develop an advanced latent refinement method
    by extending the effective hybrid latent refinement (HLR) method, which is designed for \textit{in-domain}
    inference improvement but shows noticeable degradation of the rate cost in \textit{cross-domain} tasks.
    Specifically, we first provide theoretical analyses, in a cue of marginalization approximation from
    in- to cross-domain scenarios, to uncover that the vanilla HLR suffers from an underlying mismatch
    between refined Gaussian conditional and hyperprior distributions, leading to deteriorated joint probability
    approximation of marginal distribution with increased rate consumption. To remedy this issue, we introduce
    a simple Bayesian approximation-endowed \textit{distribution regularization} to encourage learning
    a better joint probability approximation in a plug-and-play manner. Extensive experiments on six in-
    and cross-domain datasets demonstrate that our proposed method not only improves the R-D performance
    compared with other latent refinement counterparts, but also can be flexibly integrated into existing
    TTA-IC methods with incremental benefits.
