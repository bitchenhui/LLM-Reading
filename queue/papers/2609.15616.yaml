  abstract: Lossless audio coding is a highly mature field of research, with limited potential for significant
    improvements in pure compression performance. However, emerging real-time wireless applications increasingly
    require dynamic transitions between lossy and lossless coding to adapt to fluctuating network capacities.
    Existing standalone lossless codecs cannot achieve this seamless switching without discontinuity.
    In this paper, we propose a lossless codec based on time-domain aliasing cancellation (TDAC) that
    can match the overlap in the CELT mode of the Opus codec. This allows the transition between lossy
    and lossless coding to be achieved without discontinuity or the transmission of redundant information.
    We show that the proposed codec still achieves state-of-the-art lossless compression without being
    penalized by its use of TDAC.
