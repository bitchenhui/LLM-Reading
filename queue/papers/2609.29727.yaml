  title: 'VQ-LIC: Shared Vector-Quantized Learned Image Compression on a Resource-Constrained FPGA'
  authors:
  - Muhammad Fahd Ibrahim Bhatti
  - Abdullah Bin Faisal
  - Ahsan Usman
  - Naveed Anwar Bhatti
  - Muhammad Ali Siddiqi
  published: '2026-09-24'
  updated: '2026-09-24'
