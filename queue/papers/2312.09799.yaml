  title: 'IQNet: Image Quality Assessment Guided Just Noticeable Difference Prefiltering For Versatile
    Video Coding'
  authors:
  - Yu-Han Sun
  - Chiang Lo-Hsuan Lee
  - Tian-Sheuan Chang
  published: '2023-12-15'
