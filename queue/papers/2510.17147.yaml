  title: 'Mamba4Net: Distilled Hybrid Mamba Large Language Models For Networking'
  authors:
  - Linhan Xia
  - Mingzhan Yang
  - Jingjing Wang
  - Ziwei Yan
  - Yakun Ren
  - Guo Yu
  - Kai Lei
  published: '2025-10-20'
  updated: '2025-10-20'
