  abstract: Video Question Grounding (VideoQG) requires both accurate question answering and precise temporal
    localization. Existing supervised methods rely on costly temporal annotations, while existing zero-shot
    approaches are primarily designed for Video Question Answering (VQA) and are not optimized for temporal
    grounding. We propose DiffGround, an action-driven zero-shot framework built upon frozen Multimodal
    Large Language Models (MLLMs). Our framework first predicts an answer-relevant action cue that transforms
    the input question into an explicit semantic target for grounding. Action Cue converts a reasoningoriented
    question into an action-centric retrieval query. Guided by the action cue, a Vision-Language Model
    (VLM) efficiently selects informative keyframes for reasoning. Finally, we introduce Semantic Diff
    Refinement, a training-free temporal refinement method that exploits semantic differences between
    neighboring SigLIP2 embeddings to recover complete action segments from sparse predictions. Extensive
    experiments on NExT-GQA and STAR show that DiffGround consistently outperforms existing zero-shot
    and supervised methods, establishing a new state of the art for Video Question Grounding.
