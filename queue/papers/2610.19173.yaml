  abstract: Dynamic meshes reconstructed from real-world scenes often exhibit scan-induced artifacts such
    as surface jitter and missing geometry, which strongly impact perceived visual quality. Objective
    assessment remains challenging due to the absence of artifact-free ground truth and limited perceptual
    understanding of artifact interactions. This paper presents a systematic and controlled perceptual
    study of scan-induced artifacts in dynamic meshes, focusing on surface jitter and holes. To enable
    systematic analysis, we introduce a physically grounded artifact synthesis framework in which holes
    are synthesized using a reconstruction uncertainty model derived from multi-view geometry. The study
    reveals asymmetric cross-artifact interactions, non-additive integration, and motion-dependent temporal
    masking. Based on these findings, we propose a compact, perceptually grounded no-reference quality
    assessment framework that encodes the observed perceptual mechanisms.
