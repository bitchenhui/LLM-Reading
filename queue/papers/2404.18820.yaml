  title: Towards Extreme Image Compression with Latent Feature Guidance and Diffusion Prior
  authors:
  - Zhiyuan Li
  - Yanhui Zhou
  - Hao Wei
  - Chenyang Ge
  - Jingwen Jiang
  published: '2024-04-29'
