  title: Latent Veracity Inference for Identifying Errors in Stepwise Reasoning
  authors:
  - Minsu Kim
  - Jean-Pierre Falet
  - Oliver E. Richardson
  - Xiaoyin Chen
  - Moksh Jain
  - Sungjin Ahn
  - Sungsoo Ahn
  - Yoshua Bengio
  published: '2025-05-17'
  updated: '2026-02-17'
