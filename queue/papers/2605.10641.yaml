  title: 'LLaVA-CKD: Bottom-Up Cascaded Knowledge Distillation for Vision-Language Models'
  authors:
  - Nikolaos Gkalelis
  - Vasileios Mezaris
  published: '2026-05-11'
  updated: '2026-10-20'
  categories:
  - cs.CV
  - cs.AI
  abstract: 'Large Vision-Language Models (VLMs) are successful in addressing a multitude of vision-language
    understanding tasks, such as Visual Question Answering (VQA), but their memory and compute requirements
    remain a concern for practical deployment. A promising class of techniques for mitigating this concern
    is Knowledge Distillation, where knowledge from a high-capacity Teacher network is transferred to
    a considerably smaller Student network. However, the capacity gap between the two networks is both
    a blessing and a curse: the smaller the Student network, the better its efficiency, and the stronger
    (typically, also larger) the Teacher, the more knowledge it carries; yet, beyond a point, the larger
    capacity gap between the two leads to worse knowledge transfer. To counter this effect, we propose
    a bottom-up cascaded knowledge distillation (CKD) framework. Instead of treating knowledge transfer
    as an activity involving one high-capacity Teacher (or an ensemble of such), inspired by human formal
    education systems, we introduce one (potentially, more) additional Teacher(s) of intermediate capacity
    that gradually bring the Student network to the next level, where the next (higher-capacity) Teacher
    can take over. We provide a theoretical analysis to motivate why progressive reduction of the Teacher-Student
    gap may improve distillation. We apply the proposed framework on models built upon the LLaVA methodology
    and evaluate the derived models on seven standard, publicly available VQA benchmarks, demonstrating
    competitive performance with recent compact VLMs. Source code for cascaded distillation and trained
    models are available at https://github.com/IDT-ITI/LLaVA-CKD.'
