  abstract: 'We introduce a cutting-edge video compression framework tailored for the age of ubiquitous
    video data, uniquely designed to serve machine learning applications. Unlike traditional compression
    methods that prioritize human visual perception, our innovative approach focuses on preserving semantic
    information critical for deep learning accuracy, while efficiently reducing data size. The framework
    operates on a batch basis, capable of handling multiple video streams simultaneously, thereby enhancing
    scalability and processing efficiency. It features a dual reconstruction mode: lightweight for real-time
    applications requiring swift responses, and high-precision for scenarios where accuracy is crucial.
    Based on a designed deep learning algorithms, it adeptly segregates essential information from redundancy,
    ensuring machine learning tasks are fed with data of the highest relevance. Our experimental results,
    derived from diverse datasets including urban surveillance and autonomous vehicle navigation, showcase
    DMVC''s superiority in maintaining or improving machine learning task accuracy, while achieving significant
    data compression. This breakthrough paves the way for smarter, scalable video analysis systems, promising
    immense potential across various applications from smart city infrastructure to autonomous systems,
    establishing a new benchmark for integrating video compression with machine learning.'
