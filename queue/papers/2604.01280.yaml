  title: 'Look Twice: Training-Free Evidence Highlighting for Knowledge-based Visual Question Answering'
  authors:
  - Marco Morini
  - Sara Sarto
  - Marcella Cornia
  - Lorenzo Baraldi
  - Rita Cucchiara
  published: '2026-04-01'
  updated: '2026-08-06'
