  abstract: Very few studies have addressed quality enhancement for compressed dynamic point clouds. In
    particular, the effective exploitation of spatial-temporal correlations between point cloud frames
    remains largely unexplored. Addressing this gap, we propose a spatial-temporal attribute quality enhancement
    (STQE) network that exploits both spatial and temporal correlations to improve the visual quality
    of G-PCC compressed dynamic point clouds. Our contributions include a recoloring-based motion compensation
    module that remaps reference attribute information to the current frame geometry to achieve precise
    inter-frame geometric alignment, a channel-aware temporal attention module that dynamically highlights
    relevant regions across bidirectional reference frames, a Gaussian-guided neighborhood feature aggregation
    module that efficiently captures spatial dependencies between geometry and color attributes, and a
    joint loss function based on the Pearson correlation coefficient, designed to alleviate over-smoothing
    effects typical of point-wise mean squared error optimization. When applied to the latest G-PCC test
    model, STQE achieved improvements of 0.855 dB, 0.682 dB, and 0.828 dB in delta PSNR, with Bjøntegaard
    Delta rate (BD-rate) reductions of -25.2%, -31.6%, and -32.5% for the Luma, Cb, and Cr components,
    respectively.
