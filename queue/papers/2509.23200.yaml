  abstract: Underwater imaging plays a pivotal role in marine exploration and ecological monitoring. However,
    it faces significant challenges of limited transmission bandwidth and severe distortion in the aquatic
    environment. In this work, to achieve the target of both underwater image compression and enhancement
    simultaneously, an enhanced quality-aware scalable underwater image compression framework is presented,
    which comprises a Base Layer (BL) and an Enhancement Layer (EL). In the BL, the underwater image is
    represented by controllable number of non-zero sparse coefficients for coding bits saving. Furthermore,
    the underwater image enhancement dictionary is derived with shared sparse coefficients to make reconstruction
    close to the enhanced version. In the EL, a dual-branch filter comprising rough filtering and detail
    refinement branches is designed to produce a pseudo-enhanced version for residual redundancy removal
    and to improve the quality of final reconstruction. Extensive experimental results demonstrate that
    the proposed scheme outperforms the state-of-the-art works under five large-scale underwater image
    datasets in terms of Underwater Image Quality Measure (UIQM).
