  abstract: We present ClearGS for 3D Gaussian Splatting (3DGS) from handheld videos with uneven viewpoint
    coverage and mixed frame quality. Rather than selecting frames with binary decisions, ClearGS uses
    Reliability-aware View Allocation (RVA) to assign graded raw-supervision weights based on appearance
    reliability, degradation risk, and geometric utility, while weakly reactivating useful suppressed
    frames to maintain trajectory coverage. Since weighting cannot restore details lost to blur or distortion,
    ClearGS further introduces Render-Guided In-Video Restoration (RIVR). The current 3DGS render provides
    a pose-aligned structural candidate, a frozen no-reference restoration expert restores the corresponding
    raw video observation without any clean reference image, and no-reference perceptual scores select
    among the render, restored observation, and high-frequency fused candidate. ClearGS then applies Full-Trajectory
    Repair Consolidation to revisit accepted repairs and preserve details introduced early. On GS2E and
    GSOTM, ClearGS achieves state-of-the-art overall performance, with consistent CLIP-IQA and MUSIQ gains
    and LPIPS reductions in most degradation settings, without paired sharp supervision or matched clean
    references.
