  title: Neural Feature Predictor and Discriminative Residual Coding for Low-Bitrate Speech Coding
  authors:
  - Haici Yang
  - Wootaek Lim
  - Minje Kim
  published: '2022-11-04'
  updated: '2022-11-04'
  categories:
  - eess.AS
