  abstract: Low and ultra-low-bitrate neural speech coding achieves unprecedented coding gain by generating
    speech signals from compact speech features. This paper introduces additional coding efficiency in
    neural speech coding by reducing the temporal redundancy existing in the frame-level feature sequence
    via a recurrent neural predictor. The prediction can achieve a low-entropy residual representation,
    which we discriminatively code based on their contribution to the signal reconstruction. The harmonization
    of feature prediction and discriminative coding results in a dynamic bit allocation algorithm that
    spends more bits on unpredictable but rare events. As a result, we develop a scalable, lightweight,
    low-latency, and low-bitrate neural speech coding system. We demonstrate the advantage of the proposed
    methods using the LPCNet as a neural vocoder. While the proposed method guarantees causality in its
    prediction, the subjective tests and feature space analysis show that our model achieves superior
    coding efficiency compared to LPCNet and Lyra V2 in the very low bitrates.
