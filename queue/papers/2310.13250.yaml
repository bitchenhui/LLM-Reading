  title: Diagnosis-oriented Medical Image Compression with Efficient Transfer Learning
  authors:
  - Guangqi Xie
  - Xin Li
  - Xiaohan Pan
  - Zhibo Chen
  published: '2023-10-20'
  updated: '2023-10-20'
