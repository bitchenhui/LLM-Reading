  abstract: As Automatic Train Operation (ATO) advances toward GoA4 and beyond, it increasingly depends
    on efficient, reliable cab-view visual perception and decision-oriented inference to ensure safe operation
    in complex and dynamic railway environments. However, existing approaches focus primarily on basic
    perception and often generalize poorly to rare yet safety-critical corner cases. They also lack the
    high-level reasoning and planning capabilities required for operational decision-making. Although
    recent Large Multi-modal Models (LMMs) show strong generalization and cognitive capabilities, their
    use in safety-critical ATO is hindered by high computational cost and hallucination risk. Meanwhile,
    reliable domain-specific benchmarks for systematically evaluating cognitive capabilities are still
    lacking. To address these gaps, we introduce RailVQA-bench, the first VQA benchmark for cab-view visual
    cognition in ATO, comprising 20,000 single-frame and 1,168 video based QA pairs to evaluate cognitive
    generalization and interpretability in both static and dynamic scenarios. Furthermore, we propose
    RailVQA-CoM, a collaborative large-small model framework that combines small-model efficiency with
    large-model cognition via a transparent three-module architecture and adaptive temporal sampling,
    improving perceptual generalization and enabling more efficient reasoning and planning. Experiments
    demonstrate that the proposed approach substantially improves performance, enhances interpretability,
    improves efficiency, and strengthens cross-domain generalization in autonomous driving systems. Code
    and datasets will be available at https://cybereye-bjtu.github.io/RailVQA.html.
