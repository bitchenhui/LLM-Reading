  abstract: Neural audio codecs have gained recent popularity for their use in generative modeling as
    they offer high-fidelity audio reconstruction at low bitrates. While human listening studies remain
    the gold standard for assessing perceptual quality, they are time-consuming and impractical. In this
    work, we examine the reliability of existing objective quality metrics in assessing the performance
    of recent neural audio codecs. To this end, we conduct a MUSHRA listening test on high-fidelity speech
    signals and analyze the correlation between subjective scores and widely used objective metrics. Our
    results show that, while some metrics align well with human perception, others struggle to capture
    relevant distortions. Our findings provide practical guidance for selecting appropriate evaluation
    metrics when using neural audio codecs for speech.
