  title: 'From Spikes to Speech: NeuroVoc -- A Biologically Plausible Vocoder Framework for Auditory Perception
    and Cochlear Implant Simulation'
  authors:
  - Jacob de Nobel
  - Jeroen J. Briaire
  - Thomas H. W. Baeck
  - Anna V. Kononova
  - Johan H. M. Frijns
  published: '2025-06-04'
