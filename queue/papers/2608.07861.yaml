  title: How Much Does It Cost to Answer My Question? Benchmarking Cloud VLM-based VQA Systems
  authors:
  - Henri Vanhuynegem
  - Weitao Xu
  - Yiran Shen
  - Guohao Lan
  published: '2026-08-08'
  updated: '2026-08-08'
