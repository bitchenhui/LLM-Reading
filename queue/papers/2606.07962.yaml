  abstract: 'Recent advancements in Multimodal Large Language Models (MLLMs) have demonstrated remarkable
    proficiency in open-world reasoning and understanding. However, a critical ambiguity persists: it
    remains unclear whether these models genuinely synthesize cross-modal information to construct physically
    grounded reasoning chains, or if they merely exploit strong language priors to mask single-modality
    reliance, thereby hallucinating advanced multimodal capabilities. Motivated by this, and to rigorously
    mitigate language modality bias and shortcuts, we propose a novel multimodal Chrono}logical Physical
    Dynamics Reasoning Benchmark ChronoPhyBench, which unifies next state prediction with Visual Question
    Answering (VQA) paradigms by conditioning on historical video context and textual captions to enforce
    models to deduce subsequent physical states through both single image selection and the inherently
    more complex task of multiple frame chronological sorting. Concurrently, we construct a large-scale
    multimodal reasoning dataset curated using the ChronoPhyBench criteria, comprising over 10,000 long-form
    videos paired with meticulously annotated captions, totaling 5M tokens. Our experimental evaluations
    reveal a stark contrast to conclusions drawn by previous benchmarks. The capacity of current open-source
    models to perform physically grounded multimodal reasoning remains in its infancy. Ultimately, this
    work seeks to systematically stress-test the reasoning capabilities of multimodal models, quantify
    hallucination rates, and advance the development of Physical AI, thereby providing the community with
    a robust and transparent evaluation framework toward Artificial General Intelligence (AGI).'
