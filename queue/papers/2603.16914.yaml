  abstract: Neural audio codecs discretize speech via residual vector quantization (RVQ), forming a coarse-to-fine
    hierarchy across quantizers. While codec models have been explored for representation learning, their
    discrete structure remains underutilized in speech deepfake detection. In particular, different quantization
    levels capture complementary acoustic cues, where early quantizers encode coarse structure and later
    quantizers refine residual details that reveal synthesis artifacts. Existing systems either rely on
    continuous encoder features or ignore this quantizer-level hierarchy. We propose a hierarchy-aware
    representation learning framework that models quantizer-level contributions through learnable global
    weighting, enabling structured codec representations aligned with forensic cues. Keeping the speech
    encoder backbone frozen and updating only 4.4% additional parameters, our method achieves relative
    EER reductions of 46.2% on ASVspoof 2019 and 13.9% on ASVspoof5 over strong baselines.
