  abstract: Overfitted image codecs offer compelling compression performance and low decoder complexity,
    through the overfitting of a lightweight decoder for each image. Such codecs include Cool-chic, which
    presents image coding performance on par with VVC while requiring around 2000 multiplications per
    decoded pixel. This paper proposes to decrease Cool-chic encoding and decoding complexity. The encoding
    complexity is reduced by shortening Cool-chic training, up to the point where no overfitting is performed
    at all. It is also shown that a tiny neural decoder with 300 multiplications per pixel still outperforms
    HEVC. A near real-time CPU implementation of this decoder is made available at https://orange-opensource.github.io/Cool-Chic/.
