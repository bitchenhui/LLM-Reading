  abstract: Lossy compression and rate-adaptive streaming are a mainstay in traditional video steams.
    However, a new class of neuromorphic ``event'' sensors records video with asynchronous pixel samples
    rather than image frames. These sensors are designed for computer vision applications, rather than
    human video consumption. Until now, researchers have focused their efforts primarily on application
    development, ignoring the crucial problem of data transmission. We survey the landscape of event-based
    video systems, discuss the technical issues with our recent scalable event streaming work, and propose
    a new low-latency event streaming format based on the latest additions to the Media Over QUIC protocol
    draft.
