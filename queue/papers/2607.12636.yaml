  title: Spatially-Aligned Chroma from Luma Prediction for Lossless JPEG XS Raw Image Compression
  authors:
  - Taizo Suzuki
  - Soma Yokota
  - Masaki Onuki
  published: '2026-07-14'
  updated: '2026-07-14'
