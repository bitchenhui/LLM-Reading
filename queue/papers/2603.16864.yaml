  title: 'SparkVSR: Interactive Video Super-Resolution via Sparse Keyframe Propagation'
  authors:
  - Jiongze Yu
  - Xiangbo Gao
  - Pooja Verlani
  - Akshay Gadde
  - Yilin Wang
  - Balu Adsumilli
  - Zhengzhong Tu
