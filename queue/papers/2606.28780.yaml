  title: Multimodal Graph RAG for Long-range Visually Rich Document Understanding
  authors:
  - Yi-Cheng Wang
  - Chu-Song Chen
  published: '2026-06-27'
  updated: '2026-11-05'
  categories:
  - cs.IR
