  title: 'RadFusion: Towards Threshold-Controllable Radiology Report Generation'
  authors:
  - Ying Jin
  - Noel C. F. Codella
  - John Corring
  - Mu Wei
  - Dinei Florencio
  - Eric Horvitz
  published: '2026-08-11'
  updated: '2026-08-11'
