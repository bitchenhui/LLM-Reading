  abstract: 'The commercialization of Virtual Reality (VR) headsets has made immersive and 360-degree
    video streaming the subject of intense interest in the industry and research communities. While the
    basic principles of video streaming are the same, immersive video presents a set of specific challenges
    that need to be addressed. In this survey, we present the latest developments in the relevant literature
    on four of the most important ones: (i) omnidirectional video coding and compression, (ii) subjective
    and objective Quality of Experience (QoE) and the factors that can affect it, (iii) saliency measurement
    and Field of View (FoV) prediction, and (iv) the adaptive streaming of immersive 360-degree videos.
    The final objective of the survey is to provide an overview of the research on all the elements of
    an immersive video streaming system, giving the reader an understanding of their interplay and performance.'
