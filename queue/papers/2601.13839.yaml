  title: 'DisasterVQA: A Visual Question Answering Benchmark Dataset for Disaster Scenes'
  authors:
  - Aisha Al-Mohannadi
  - Ayisha Firoz
  - Yin Yang
  - Muhammad Imran
  - Ferda Ofli
  published: '2026-01-20'
  updated: '2026-05-18'
