  abstract: Reasoning about relational structures remains a significant challenge for neural models, particularly
    when they must systematically apply learned knowledge to problem instances that are harder than those
    seen in training. Progress is hampered by the difficulty of evaluating such generalization, since
    a priori, it is rarely clear what makes an instance hard. We study how this issue can be addressed
    by using large language models (LLMs) to automate benchmark generation, learning to produce increasingly
    challenging instances in an end-to-end manner. Concretely, given a world parametrized by Datalog rules,
    and an Edge Transformer as the reasoning evaluator, we use LLM-driven evolutionary search (based on
    FunSearch) and autonomous agentic search to discover sampling functions that yield hard problem instances.
    We also show that the Edge Transformer can be improved using this data such that it generalizes well
    to further data perturbations. Finally, we show that the same machinery can be applied to novel worlds
    proposed by LLMs, opening the door to autonomous research on neural relational reasoning.
