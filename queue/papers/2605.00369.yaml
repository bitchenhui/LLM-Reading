  abstract: We study how large language models can be used to generate inventory policies in online settings
    with non-stationary demand. Our work is motivated by recent advances in LLM-based evolutionary search,
    such as AlphaEvolve, which demonstrates strong performance on static and highly structured problems
    such as mathematical discovery, but is not directly suited to dynamic inventory settings with online
    updates. We propose InvEvolve, an end-to-end inventory policy evolution and inference framework grounded
    in confidence-interval-based certification. Built on a large language model trained via reinforcement
    learning, InvEvolve can process demand data together with additional numerical and textual features,
    and generates white-box inventory policies with statistical safety guarantees for future deployment.
    We further introduce a unified framework with theoretical guarantees that connects training, inference,
    and deployment. This allows us to derive a lower bound on the probability that InvEvolve evolves a
    statistically safe and improved policy, and to characterize the multi-period performance gap relative
    to the oracle-safe benchmark. Tested on both synthetic data and real-world retail data, InvEvolve
    outperforms classical inventory policies and deep-learning-based methods. In canonical inventory settings,
    it generates new policies that outperform existing benchmarks.
