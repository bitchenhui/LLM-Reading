  title: Just how sure are you? Improving Verbalized Uncertainty Calibration in Medical VQA
  authors:
  - Eren Senoglu
  - Federico Toschi
  - Nicolo Brunello
  - Andrea Sassella
  - Mark James Carman
  published: '2026-06-25'
  updated: '2026-06-25'
  categories:
  - cs.LG
  - cs.CL
  - cs.CV
  abstract: Multimodal large language models (MLLMs) applied to Medical Visual Question Answering (VQA)
    tend to produce overconfident outputs regardless of actual correctness, and existing verbalized confidence
    calibration methods, developed primarily for text only LLMs, do not account for the multimodal nature
    of medical image understanding. This work proposes a training based framework that finetunes MLLMs
    to improve their calibration using a composite loss function combining a Brier style calibration term,
    an anchor regularizer that prevents confidence collapse toward extreme values, a contrastive image
    text alignment term, and a KL based model stabilization term. The alignment signal is derived from
    a $2 \times 2$ factorial perturbation design that crosses image presence with text integrity, probing
    the reliance of the model on visual modality input versus language priors. Finally, a top K KL divergence
    regularizer is used to protect the answering ability of the model during finetuning. Across three
    Medical VQA benchmarks and two architectures (MedGemma 4B IT and Qwen2 VL 7B Instruct), our method
    reduces calibration error by 60% or more, and improves discrimination by 26% or more, while preserving
    predictive accuracy. On average across benchmarks, the technique outperforms prompting based, sampling
    based, and training based approaches, and ablation experiments confirm that each component of the
    loss function is indeed necessary for improving the calibration. All code for the experiments is publicly
    available.
