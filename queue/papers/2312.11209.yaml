  abstract: Learned image compression has a problem of non-bit-exact reconstruction due to different calculations
    of floating point arithmetic on different devices. This paper shows a method to achieve a deterministic
    reconstructed image by quantizing only the decoder of the learned image compression model. From the
    implementation perspective of an image codec, it is beneficial to have the results reproducible when
    decoded on different devices. In this paper, we study quantization of weights and activations without
    overflow of accumulator in all decoder subnetworks. We show that the results are bit-exact at the
    output, and the resulting BD-rate loss of quantization of decoder is 0.5 % in the case of 16-bit weights
    and 16-bit activations, and 7.9 % in the case of 8-bit weights and 16-bit activations.
