  title: Multi-Scale Deformable Alignment and Content-Adaptive Inference for Flexible-Rate Bi-Directional
    Video Compression
  authors:
  - M. Akın Yılmaz
  - O. Ugur Ulas
  - A. Murat Tekalp
  published: '2023-06-28'
  updated: '2023-06-28'
