  title: 'OPT-BENCH: Evaluating the Iterative Self-Optimization of LLM Agents in Large-Scale Search Spaces'
  authors:
  - Xiaozhe Li
  - Jixuan Chen
  - Xinyu Fang
  - Shengyuan Ding
  - Haodong Duan
  - Qingwen Liu
  - Kai Chen
  published: '2026-05-09'
  updated: '2026-05-09'
