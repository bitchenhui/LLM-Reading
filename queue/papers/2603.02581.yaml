  title: 'ATD: Improved Transformer with Adaptive Token Dictionary for Image Restoration'
  authors:
  - Leheng Zhang
  - Wei Long
  - Yawei Li
  - Xingyu Zhou
  - Xiaorui Zhao
  - Shuhang Gu
  published: '2026-03-03'
  updated: '2026-03-03'
