  title: 'Stream-Voice-Anon: Enhancing Utility of Real-Time Speaker Anonymization via Neural Audio Codec
    and Language Models'
  authors:
  - Nikita Kuzmin
  - Songting Liu
  - Kong Aik Lee
  - Eng Siong Chng
  published: '2026-01-20'
  updated: '2026-02-05'
