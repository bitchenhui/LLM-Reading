  abstract: Film grain is a distinctive visual characteristic cherished by filmmakers and cinephiles for
    its ability to evoke nostalgia and artistic aesthetics. However, faithful preservation of film grain
    during encoding poses unique challenges. Film grain introduces random noise, complicating traditional
    compression techniques. Consequently, specialized algorithms and encoding strategies have emerged,
    aiming to strike a harmonious equilibrium. This paper delves into the nuanced realm of film grain
    handling in Versatile Video Coding (VVC) encoding. We explore the delicate balance between retaining
    the cinematic charm of film grain and achieving efficient compression. Moreover, we discuss the importance
    of perceptual quality assessment and adaptive encoding techniques in preserving film grain fidelity.
    Additionally, we delve into the impact of film grain handling on bitrate control and compression efficiency
    using VVenC, an open and optimized VVC encoder. Understanding the role of film grain and its nuanced
    treatment within encoders becomes increasingly pivotal for delivering high-quality, grain-inclusive
    content in the digital age.
