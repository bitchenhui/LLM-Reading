  abstract: The promising improvement in compression efficiency of Versatile Video Coding (VVC) compared
    to High Efficiency Video Coding (HEVC) comes at the cost of a non-negligible encoder side complexity.
    The largely increased complexity overhead is a possible obstacle towards its industrial implementation.
    Many papers have proposed acceleration methods for VVC. Still, a better understanding of VVC complexity,
    especially related to new partitions and coding tools, is desirable to help the design of new and
    better acceleration methods. For this purpose, statistical analyses have been conducted, with a focus
    on Coding Unit (CU) sizes and inter coding modes.
