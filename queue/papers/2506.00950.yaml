  title: 'Crowdsourcing MUSHRA Tests in the Age of Generative Speech Technologies: A Comparative Analysis
    of Subjective and Objective Testing Methods'
  authors:
  - Laura Lechler
  - Chamran Moradi
  - Ivana Balic
  published: '2025-06-01'
  updated: '2025-06-01'
  categories:
  - eess.AS
  - cs.SD
  abstract: The MUSHRA framework is widely used for detecting subtle audio quality differences but traditionally
    relies on expert listeners in controlled environments, making it costly and impractical for model
    development. As a result, objective metrics are often used during development, with expert evaluations
    conducted later. While effective for traditional DSP codecs, these metrics often fail to reliably
    evaluate generative models. This paper proposes adaptations for conducting MUSHRA tests with non-expert,
    crowdsourced listeners, focusing on generative speech codecs. We validate our approach by comparing
    results from MTurk and Prolific crowdsourcing platforms with expert listener data, assessing test-retest
    reliability and alignment. Additionally, we evaluate six objective metrics, showing that traditional
    metrics undervalue generative models. Our findings reveal platform-specific biases and emphasize codec-aware
    metrics, offering guidance for scalable perceptual testing of speech codecs.
