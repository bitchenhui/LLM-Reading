  title: Joint Reference Frame Synthesis and Post Filter Enhancement for Versatile Video Coding
  authors:
  - Weijie Bao
  - Yuantong Zhang
  - Jianghao Jia
  - Zhenzhong Chen
  - Shan Liu
  published: '2024-04-28'
