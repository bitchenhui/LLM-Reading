  abstract: Audio restoration has become increasingly significant in modern society, not only due to the
    demand for high-quality auditory experiences enabled by advanced playback devices, but also because
    the growing capabilities of generative audio models necessitate high-fidelity audio. Typically, audio
    restoration is defined as a task of predicting undistorted audio from damaged input, often trained
    using a GAN framework to balance perception and distortion. Since audio degradation is primarily concentrated
    in mid- and high-frequency ranges, especially due to codecs, a key challenge lies in designing a generator
    capable of preserving low-frequency information while accurately reconstructing high-quality mid-
    and high-frequency content. Inspired by recent advancements in high-sample-rate music separation,
    speech enhancement, and audio codec models, we propose Apollo, a generative model designed for high-sample-rate
    audio restoration. Apollo employs an explicit frequency band split module to model the relationships
    between different frequency bands, allowing for more coherent and higher-quality restored audio. Evaluated
    on the MUSDB18-HQ and MoisesDB datasets, Apollo consistently outperforms existing SR-GAN models across
    various bit rates and music genres, particularly excelling in complex scenarios involving mixtures
    of multiple instruments and vocals. Apollo significantly improves music restoration quality while
    maintaining computational efficiency. The source code for Apollo is publicly available at https://github.com/JusperLee/Apollo.
