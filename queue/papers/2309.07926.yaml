  title: 'COMPASS: High-Efficiency Deep Image Compression with Arbitrary-scale Spatial Scalability'
  authors:
  - Jongmin Park
  - Jooyoung Lee
  - Munchurl Kim
  published: '2023-09-11'
  updated: '2026-01-05'
  categories:
  - eess.IV
