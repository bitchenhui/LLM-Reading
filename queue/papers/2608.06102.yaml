  title: 'MultiMoQ: Multi-Access Media-Over-QUIC for Robust Immersive Video Streaming'
  authors:
  - Yitong Li
  - Xinjiao Li
  - Ruonan Chai
  - Dirk Kutscher
  published: '2026-08-06'
  updated: '2026-08-06'
