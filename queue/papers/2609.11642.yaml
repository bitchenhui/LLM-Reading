  abstract: Neural audio codecs are a fundamental component of modern speech generation systems. While
    recent codecs achieve increasingly low bitrates, reducing frame rate remains challenging, as each
    token must preserve more information while maintaining reconstruction quality. We present ZipCodec,
    a streaming neural speech codec operating at 6.25 Hz and 0.80 kbps with a theoretical latency of 160
    ms. Our approach combines large-scale WavLM distillation with a redesigned transformer-based architecture,
    a scalar spherical quantizer, and a latency-aware streaming decoder. Experiments show that ZipCodec
    substantially outperforms existing streaming codecs at comparable bitrates in both reconstruction
    and downstream tasks, while operating at a significantly lower frame rate. Despite its 842M parameters,
    ZipCodec achieves real-time single-stream inference on a consumer-grade CPU. Demo samples, code and
    checkpoints are available at https://lucadellalib.github.io/zipcodec-web/.
