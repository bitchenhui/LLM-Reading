  title: An Efficient Implicit Neural Representation Image Codec Based on Mixed Autoregressive Model for
    Low-Complexity Decoding
  authors:
  - Xiang Liu
  - Jiahong Chen
  - Bin Chen
  - Zimo Liu
  - Baoyi An
  - Shu-Tao Xia
  - Zhi Wang
  published: '2024-01-23'
  updated: '2024-06-07'
