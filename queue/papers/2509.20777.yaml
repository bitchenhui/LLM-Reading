  title: 'CompressAI-Vision: Open-source software to evaluate compression methods for computer vision
    tasks'
  authors:
  - Hyomin Choi
  - Heeji Han
  - Chris Rosewarne
  - Fabien Racapé
  published: '2025-09-25'
  updated: '2025-09-25'
