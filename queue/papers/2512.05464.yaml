  title: 'Dynamic Alignment for Collective Agency: Toward a Scalable Self-Improving Framework for Open-Ended
    LLM Alignment'
  authors:
  - Panatchakorn Anantaprayoon
  - Nataliia Babina
  - Jad Tarifi
  - Nima Asgharbeygi
  published: '2025-12-05'
  updated: '2025-12-05'
