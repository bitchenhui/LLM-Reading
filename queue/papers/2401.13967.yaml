  abstract: In this paper, we extend our prior research named DKIC and propose the perceptual-oriented
    learned image compression method, PO-DKIC. Specifically, DKIC adopts a dynamic kernel-based dynamic
    residual block group to enhance the transform coding and an asymmetric space-channel context entropy
    model to facilitate the estimation of gaussian parameters. Based on DKIC, PO-DKIC introduces PatchGAN
    and LPIPS loss to enhance visual quality. Furthermore, to maximize the overall perceptual quality
    under a rate constraint, we formulate this challenge into a constrained programming problem and use
    the Linear Integer Programming method for resolution. The experiments demonstrate that our proposed
    method can generate realistic images with richer textures and finer details when compared to state-of-the-art
    image compression techniques.
