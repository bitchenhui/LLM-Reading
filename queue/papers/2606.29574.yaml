  title: Stateless Network-Aware Adaptive Bitrate Streaming over IPFS
  authors:
  - Iliya Mirzaei
  - Shabnam Jafarzade Mojaveri
  - Amirhossein Najafizadeh
  published: '2026-06-28'
  updated: '2026-06-28'
