  title: 'Code-Space Response Oracles: Generating Interpretable Multi-Agent Policies with Large Language
    Models'
  authors:
  - Daniel Hennes
  - Zun Li
  - John Schultz
  - Marc Lanctot
  published: '2026-03-10'
