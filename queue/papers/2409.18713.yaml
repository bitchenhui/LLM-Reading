  title: Decoding Complexity-Rate-Quality Pareto-Front for Adaptive VVC Streaming
  authors:
  - Angeliki Katsenou
  - Vignesh V Menon
  - Adam Wieckowski
  - Benjamin Bross
  - Detlev Marpe
  published: '2024-09-27'
  updated: '2024-09-27'
