  title: Codebook Capacity Governs Perceptual Quality Across Resolutions in Hierarchical Discrete Video
    Compression
  authors:
  - Manikanta Kotthapalli
  - Banafsheh Rekabdar
  published: '2026-07-25'
  updated: '2026-07-25'
  categories:
  - eess.IV
