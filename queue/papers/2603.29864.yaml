  title: 'HLC: A High-Quality Lightweight Mezzanine Codec Featuring High-Throughput Palette'
  authors:
  - Chenlong He
  - Leilei Huang
  - Wei Li
  - Hanyang Cui
  - Zhijian Hao
  - Xiaoyang Zeng
  - Yibo Fan
  published: '2026-03-31'
  updated: '2026-03-31'
