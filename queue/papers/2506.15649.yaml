  title: Dual-Stage Value-Guided Inference with Margin-Based Reward Adjustment for Fast and Faithful VLM
    Captioning
  authors:
  - Ankan Deria
  - Adinath Madhavrao Dukre
  - Feilong Tang
  - Sara Atito
  - Sudipta Roy
  - Muhammad Awais
  - Muhammad Haris Khan
  - Imran Razzak
  published: '2025-06-18'
  updated: '2025-06-18'
