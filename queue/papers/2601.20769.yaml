  title: 'Leveraging Second-Order Curvature for Efficient Learned Image Compression: Theory and Empirical
    Evidence'
  authors:
  - Yichi Zhang
  - Fengqing Zhu
  published: '2026-01-28'
  updated: '2026-01-29'
