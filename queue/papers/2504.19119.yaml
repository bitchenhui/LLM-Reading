  title: 'MLICv2: Enhanced Multi-Reference Entropy Modeling for Learned Image Compression'
  authors:
  - Wei Jiang
  - Yongqi Zhai
  - Jiayu Yang
  - Feng Gao
  - Ronggang Wang
  published: '2025-04-27'
  updated: '2026-02-25'
