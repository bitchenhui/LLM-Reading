  abstract: 'Recent advances in learned image compression (LIC) have achieved remarkable performance improvements
    over traditional codecs. Notably, the MLIC series-LICs equipped with multi-reference entropy models-have
    substantially surpassed conventional image codecs such as Versatile Video Coding (VVC) Intra. However,
    existing MLIC variants suffer from several limitations: performance degradation at high bitrates due
    to insufficient transform capacity, suboptimal entropy modeling that fails to capture global correlations
    in initial slices, and lack of adaptive channel importance modeling. In this paper, we propose MLICv2
    and MLICv2+, enhanced successors that systematically address these limitations through improved transform
    design, dvanced entropy modeling, and exploration of the potential of instance-specific optimization.
    For transform enhancement, we introduce a lightweight token mixing block inspired by the MetaFormer
    architecture, which effectively mitigates high-bitrate performance degradation while maintaining computational
    efficiency. For entropy modeling improvements, we propose hyperprior-guided global correlation prediction
    to extract global context even in the initial slice of latent representation, complemented by a channel
    reweighting module that dynamically emphasizes informative channels. We further explore enhanced positional
    embedding and guided selective compression strategies for superior context modeling. Additionally,
    we apply the Stochastic Gumbel Annealing (SGA) to demonstrate the potential for further performance
    improvements through input-specific optimization. Extensive experiments demonstrate that MLICv2 and
    MLICv2+ achieve state-of-the-art results, reducing Bjøntegaard-Delta Rate by 16.54%, 21.61%, 16.05%
    and 20.46%, 24.35%, 19.14% on Kodak, Tecnick, and CLIC Pro Val datasets, respectively, compared to
    VTM-17.0 Intra.'
