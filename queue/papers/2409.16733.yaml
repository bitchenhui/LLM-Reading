  title: The Effect of Lossy Compression on 3D Medical Images Segmentation with Deep Learning
  authors:
  - Anvar Kurmukov
  - Bogdan Zavolovich
  - Aleksandra Dalechina
  - Vladislav Proskurov
  - Boris Shirokikh
  published: '2024-09-25'
  updated: '2024-09-25'
  categories:
  - eess.IV
  - cs.CV
  abstract: Image compression is a critical tool in decreasing the cost of storage and improving the speed
    of transmission over the internet. While deep learning applications for natural images widely adopts
    the usage of lossy compression techniques, it is not widespread for 3D medical images. Using three
    CT datasets (17 tasks) and one MRI dataset (3 tasks) we demonstrate that lossy compression up to 20
    times have no negative impact on segmentation quality with deep neural networks (DNN). In addition,
    we demonstrate the ability of DNN models trained on compressed data to predict on uncompressed data
    and vice versa with no quality deterioration.
