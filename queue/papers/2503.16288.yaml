  title: Overview of Variable Rate Coding in JPEG AI
  authors:
  - Panqi Jia
  - Fabian Brand
  - Dequan Yu
  - Alexander Karabutov
  - Elena Alshina
  - Andre Kaup
  published: '2025-03-20'
