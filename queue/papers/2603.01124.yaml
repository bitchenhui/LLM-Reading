  abstract: Medical Vision-Language Models have shown promising potential in clinical decision support,
    yet they remain prone to factual hallucinations due to insufficient grounding in localized pathological
    evidence. Existing medical alignment methods primarily operate at the response level through preference
    optimization, improving output correctness but leaving intermediate reasoning weakly connected to
    visual regions. Although chain-of-thought (CoT) enhances multimodal reasoning, it remains largely
    text-centric, limiting effective integration of clinical visual cues. To address this gap, we propose
    ClinCoT, a clinical-aware visual chain-of-thought framework that transforms preference optimization
    from response-level correction to visual-driven reasoning. We introduce an automatic data generation
    pipeline that constructs clinically grounded preference pairs through reasoning with hypotheses-driven
    region proposals. Multiple Med-LLMs evaluators rank and assign scores to each response, and these
    rankings serve as supervision to train the target model. We further introduce a scoring-based margin-aware
    optimization strategy that incorporates both preference ranking and score difference to refine region-level
    reasoning trajectories. To maintain alignment as the model's policy evolves during training, we adopt
    an iterative learning scheme that dynamically regenerates preference data. Extensive experiments on
    three medical VQA and report generation benchmarks demonstrate that ClinCoT consistently improves
    factual grounding and achieves superior performance compared with existing preference-based alignment
    methods.
