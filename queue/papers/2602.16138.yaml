  title: 'IRIS: Intent Resolution via Inference-time Saccades for Open-Ended VQA in Large Vision-Language
    Models'
  authors:
  - Parsa Madinei
  - Srijita Karmakar
  - Russell Cohen Hoffing
  - Felix Gervitz
  - Miguel P. Eckstein
  published: '2026-02-18'
  updated: '2026-05-05'
