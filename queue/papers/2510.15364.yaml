  abstract: Neural audio coding has been shown to outperform classical audio coding at extremely low bitrates.
    However, the practical application of neural audio codecs is still limited by their elevated complexity.
    To address this challenge, we have developed a high-quality neural audio codec with a low-complexity
    decoder, named LDCodec (Low-complexity Decoder Neural Audio Codec), specifically designed for on-demand
    streaming media clients, such as smartphones. Specifically, we introduced a novel residual unit combined
    with Long-term and Short-term Residual Vector Quantization (LSRVQ), subband-fullband frequency discriminators,
    and perceptual loss functions. This combination results in high-quality audio reconstruction with
    lower complexity. Both our subjective and objective tests demonstrated that our proposed LDCodec at
    6kbps outperforms Opus at 12kbps.
