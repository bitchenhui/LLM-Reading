  title: Visual Marking as a Native Reasoning Capability for Multimodal LLMs
  authors:
  - Jiazhen Liu
  - Yanghao Wang
  - Chaolei Tan
  - Long Chen
  published: '2026-11-15'
  updated: '2026-11-15'
