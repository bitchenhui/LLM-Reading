  abstract: 'As claims about recursive self-improvement (RSI) and artificial general intelligence (AGI)
    proliferate, we ask a simple question: do frontier AI models have a sense of data, i.e., can they
    reliably select the right data for training? We introduce DataSense-Bench to study this capability
    through the fundamental problem of data selection and performance forecasting in machine learning.
    We ask AI agents to select and rank candidate training subsets that can be used to fine-tune a small
    LLM model. Agents are allowed to inspect the data, write and execute analysis code, and run model
    forward passes, but can not train the model or access the actual evaluation tasks. We then fine-tune
    the base model on each selected subset and evaluate its post-training performance under a standardized
    protocol. We instantiate the benchmark in terminal problem solving and tool use, selecting trajectories
    from OpenThoughts-Agent and EnvScaler and evaluating on TBLite and BFCL, respectively. We then evaluate
    the agents along two complementary dimensions: the post-training performance of the top-ranked subset,
    reflecting the ability to identify high-value training data, and ranking accuracy, reflecting the
    ability to predict the relative performance of the selected subsets. In our experiments, selection
    gains over random selection are limited; agents do not reliably rank their selected groups, and ranking
    ability does not hold consistently across tasks: Astra identifies the best group in all three tool-use
    runs but in only one of three terminal runs. Analysis of execution traces on both tasks shows that
    agents often use similar data signals while interpreting their training value differently.'
