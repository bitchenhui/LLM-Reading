  abstract: 'Vision-language models (VLMs) can produce confident answers without relevant visual evidence,
    a failure mode known as mirage (Asadi et al., 2026). We study pre-release mirage detection: deciding
    whether a VLM answer should be released or withheld. Our model-agnostic method, Text-Conditioned Layer-wise
    Internal Alignment (TC-LIA), tracks question-image alignment across the layers of a frozen CLIP ViT-H/14
    encoder, summarizing patch-text alignment by final similarity, late-layer top-k alignment, early-to-late
    gain, and slope. TC-LIA is training-free at deployment with fixed projections and scoring weights,
    without any label-specific training, and delivers strong detection independently. Additionally, when
    combined with blank/noise detection, domain routing, and VLM self-assessment, it forms an ensemble
    whose supervised training improves performance but is an optional add-on. On 19,004 samples spanning
    10 VQA domains, 14 state-of-the-art VLMs exhibit 57.3-75.0% base mirage rates. Our proposed TC-LIA
    alone cuts this to 7.5% with 83.5% Related/Unrelated/Blank-Noise classification accuracy, and the
    ensemble reaches 84.5-88.4% accuracy with 5.9-7.2% mirage rates (best joint result: 88.4% accuracy,
    6.4% mirage rate). Notably, an ensemble trained on a single backbone transfers well to unseen backbones,
    with the best-transferring source staying within 0.7% accuracy points of per-backbone training across
    13 held-out VLMs.'
