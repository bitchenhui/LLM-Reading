  title: 'Detect Before You Leap: Mirage Detection in Vision-Language Models'
  authors:
  - Md. Shaown Miah
  - S. M. Taiabul Haque
  - Syed Ishtiaque Ahmed
  - Sayeed Shafayet Chowdhury
  published: '2026-05-29'
  updated: '2026-10-01'
  categories:
  - cs.CV
