  title: 'D-Compress: Detail-Preserving LiDAR Range Image Compression for Real-Time Streaming on Resource-Constrained
    Robots'
  authors:
  - Shengqian Wang
  - Chang Tu
  - He Chen
  published: '2026-03-14'
  updated: '2026-03-14'
