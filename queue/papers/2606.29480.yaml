  title: 'DTM-Codec: Dynamic Token Masking for VFR Speech Coding with Efficient Boundary Selection'
  authors:
  - Hoyeol Sohn
  - Juhan Nam
  published: '2026-06-28'
  updated: '2026-06-28'
