  abstract: 'Fusing sensors with complementary modalities is crucial for maintaining a stable and comprehensive
    understanding of abnormal driving scenes. However, Multimodal Large Language Models (MLLMs) are underexplored
    for leveraging multi-sensor information to understand adverse driving scenarios in autonomous vehicles.
    To address this gap, we propose the DriveXQA, a multimodal dataset for autonomous driving VQA. In
    addition to four visual modalities, five sensor failure cases, and five weather conditions, it includes
    $102,505$ QA pairs categorized into three types: global scene level, allocentric level, and ego-vehicle
    centric level. Since no existing MLLM framework adopts multiple complementary visual modalities as
    input, we design MVX-LLM, a token-efficient architecture with a Dual Cross-Attention (DCA) projector
    that fuses the modalities to alleviate information redundancy. Experiments demonstrate that our DCA
    achieves improved performance under challenging conditions such as foggy (GPTScore: $53.5$ vs. $25.1$
    for the baseline).'
