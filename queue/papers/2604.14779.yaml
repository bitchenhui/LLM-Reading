  abstract: In continual visual question answering (VQA), existing Continual Learning (CL) methods are
    mostly built for symmetric, unimodal architectures. However, modern Vision-Language Models (VLMs)
    violate this assumption, as their trainable components are inherently asymmetric. This structural
    mismatch renders VLMs highly prone to catastrophic forgetting when learning from continuous data streams.
    Specifically, the asymmetry causes standard global regularization to favor the massive language decoder
    during optimization, leaving the smaller but critical visual projection layers highly vulnerable to
    interference. Consequently, this localized degradation leads to a severe loss of compositional reasoning
    capabilities. To address this, we propose Asymmetric Information Masking (AIM), which balances stability
    and plasticity by applying targeted masks based on modality-specific sensitivity. Experiments on VQA
    v2 and GQA under continual VQA settings show that AIM achieves state-of-the-art performance in both
    Average Performance (AP) and Average Forgetting (AF), while better preserving generalization to novel
    skill-concept compositions.
