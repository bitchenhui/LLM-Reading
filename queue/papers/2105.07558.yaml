  abstract: The demand for streaming media and live video conferencing is at peak and expected to grow
    further, thereby the need for low-cost streaming services with better quality and lower latency is
    essential. Therefore, in this paper, we propose a novel peer-to-peer (P2P) live streaming platform,
    called fybrrStream, where a logical mesh and physical tree i.e., hybrid topology-based approach is
    leveraged for low latency streaming. fybrrStream distributes the load on participating peers in a
    hierarchical manner by considering their network bandwidth, network latency, and node stability. fybrrStream
    costs as low as the cost of just hosting a light-weight website and the performance is comparable
    to the existing state-of-the-art media streaming services. We evaluated and tested the proposed fybrrStream
    platform with real-field experiments using 50+ users spread across India and results obtained show
    significant improvements in the live streaming performance over other schemes.
