  title: Inter-Frame Compression for Dynamic Point Cloud Geometry Coding
  authors:
  - Anique Akhtar
  - Zhu Li
  - Geert Van der Auwera
  published: '2022-07-25'
  updated: '2024-09-02'
  categories:
  - cs.CV
