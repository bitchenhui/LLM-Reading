  abstract: Clinical prostate multi-parametric MRI relies heavily on high-quality diffusion-weighted imaging
    (DWI), yet reading DWI is frequently compromised by geometric distortion, often caused by rectal air.
    Assessing quality via the PI-QUAL scoring system is an emerging clinical standard, but it is subjective,
    time-consuming and suffers from a class imbalance where low-quality cases are diverse and relatively
    scarce. Using the PRIME clinical trial as an example, there are $6\%$ images with PI-QUAL scores lower
    than 4, $87\%$ of DWI issues are due to distortion. Many of the other clinical quality issues are
    under-represented. To address this common dual-scarcity of annotated clinical data, we propose a few-shot
    biparametric prototypical network for automated image quality assessment (IQA). Our framework utilizes
    a dual-branch 3D ResNet to fuse T2-weighted and DWI features, providing anatomical context to distinguish
    true morphology from distortion. To handle real-world heterogeneity, we introduce feature-wise linear
    modulation (FiLM) and a gradient reversal layer (GRL) to align feature distributions conditioned on
    varying b-values while suppressing acquisition-related biases. We demonstrate that a model meta-trained
    solely on comparatively objective, readily obtainable distortion labels can effectively adapt to predicting
    complex, multi-factorial clinical quality scores such as PI-QUAL using only five representative samples.
    Experimental results on two datasets show that our method significantly outperforms few-shot learning
    baselines for this challenging IQA task, offering a practically feasible and data-efficient solution
    for standardizing prostate MRI quality control in clinical workflows.
