  title: 'Federation over Text: Insight Sharing for Multi-Agent Reasoning'
  authors:
  - Dixi Yao
  - Tahseen Rabbani
  - Manzil Zaheer
  - Tian Li
  published: '2026-04-18'
  updated: '2026-09-30'
  categories:
  - cs.LG
  - cs.AI
  abstract: Modern agents specialize in varying domains while there is no clear approach combining different
    domain skills. We propose a federated learning-like framework, Federation over Text (FoT), that enables
    multiple clients solving different tasks to collectively generate a shared library of metacognitive
    insights by iteratively federating their local reasoning processes without sharing actual problem
    instances. Instead of federation over gradients (e.g., as in distributed training), FoT operates at
    the semantic level without any gradient optimization or supervision signal. At each round, client
    LLM agents independently apply arbitrary local reasoning and self-improvement procedures to their
    own tasks and share the resulting reasoning traces with a central server. The server then aggregates,
    distills, and consolidates knowledge across tasks and domains into a shared insight library, which
    can be reused by current and future agents to improve their reasoning. Experiments show that FoT improves
    reasoning effectiveness and efficiency across real-world daily tasks, cross-domain collaboration,
    and research insight discovery, achieving an average performance gain of 11.9 absolute percentage
    points while reducing client-generated task-completion tokens by 5.5%.
