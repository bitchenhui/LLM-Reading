  title: An Integrated Vision-and-Language Pretraining (VLP) and Visual Question Answering (VQA) model
    to Automate Nondestructive Evaluation Image Analysis
  authors:
  - Mehrdad Shafiei Dizaji
  - Hoda Azari
  published: '2026-08-29'
  updated: '2026-09-04'
  categories:
  - cs.CV
  - cs.LG
  abstract: An AI-based approach called ChatNDE Figure to Caption is introduced, which aims to automate
    the interpretation of NDE images using deep learning and natural language processing (NLP). A Vision-and-Language
    Pretraining (VLP) strategy is developed to help the model learn how to connect visual features with
    meaningful language. Basically, we built a large NDE image dataset, trained the model using annotated
    examples, and then evaluated how well it performed using BLEU scores to compare its output to expert
    written descriptions. So, the system combines a ResNet50 model to extract important features from
    the images and a GPT2 language model to turn those features into natural sounding text. Even though
    the accuracy of the model has been low the generated caption results have been solid so far, the captions
    were shorter but mentioned some important features of images what human experts would say, which shows
    the model is learning to pick up on key details. Also, a Visual Question Answering (VQA) model is
    used as part of the system. VQA models are designed to take an image and a question about that image
    (like Is there a crack? or Where is the defect located?) and generate a useful answer. By adding this
    layer, the platform will not just describe what it sees, it can also respond to specific questions,
    making it even more interactive and helpful for inspectors in the field. This whole approach is a
    big step toward speeding up NDE workflows, reducing human error, and making the technology more accessible.
