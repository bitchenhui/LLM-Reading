  title: Measurement-Aware Multimodal LLM for No-Reference Low-Dose CT Quality Assessment
  authors:
  - Kerem Basim
  - Tolga Demiroglu
  - Mehmet Ozan Unal
  - Metin Ertas
  - Isa Yildirim
  published: '2026-11-05'
  updated: '2026-11-05'
  categories:
  - eess.IV
