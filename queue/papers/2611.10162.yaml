  abstract: We present M5-TTS, a compact text-to-speech system supporting multilingual and Chinese multidialect
    synthesis, zero-shot voice cloning, speaker-specific multilingual generation, and CPU streaming. Its
    50M-parameter language model, excluding the speech codec, combines a temporal backbone with a local
    multi-token prediction module over 16 codebooks. GRPO post-training combines global speaker-similarity
    and pause feedback with a token-level CER process advantage. Character-level error comparisons provide
    local feedback, with negative credit propagated backward within a clause and projected onto audio-token
    positions. M5-TTS achieves 1.37% CER on Seed-ZH and 2.91% WER on Seed-EN, corresponding to relative
    error reductions of 62.2% and 35.3% over MOSS-TTS-Nano with half the language-model parameters. It
    also achieves lower content error rates in five of six evaluated MiniMax languages, while difficult
    Chinese inputs remain a limitation. On four Intel Xeon Gold 6530 cores, it achieves a real-time factor
    of 0.653 and a warm first-chunk latency of 225ms. A 10-listener evaluation gives M5-TTS higher speaker-similarity
    and intelligibility ratings than MOSS-TTS-Nano, with a lower naturalness rating. We will release training,
    post-training, and inference code, together with voice-cloning and speaker-specific checkpoints, to
    support reproducible research on compact speech generation for on-device voice interaction.
