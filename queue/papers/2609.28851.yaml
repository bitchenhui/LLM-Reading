  title: 'Looks the Same, Answers Differently: Flip-Direction Steering for Robust Vision-Language Reasoning'
  authors:
  - Yeonsung Jung
  - Joonhyun Jeong
  - Hoang Pham
  - Joowon Kim
  - Yoonsik Park
  - Viet Dac Lai
  - Eunho Yang
  published: '2026-09-23'
  updated: '2026-09-23'
  categories:
  - cs.CV
  abstract: Vision-language models (VLMs) achieve strong visual reasoning performance, yet subtle changes
    from routine image capture and processing can alter their reasoning trajectories even when images
    appear nearly identical. In long-horizon generation, the resulting activation shifts may accumulate
    across decoding steps, progressively altering reasoning tokens and ultimately changing the final answer,
    a phenomenon referred to as answer flips. To address this instability, we propose FlipDir (Flip-Direction
    Steering), a training-free inference-time method that estimates a low-rank flip-inducing activation
    subspace from contrastive pairs of original and answer-flipping inputs and selectively steers hidden
    states during decoding. A margin-based gate limits subspace attenuation to uncertain decoding steps,
    recovering original predictions while preserving stable ones. To evaluate robustness beyond accuracy
    or consistency on fixed test sets, we introduce VisFlip, a benchmark framework that constructs evaluation
    groups for a target model and visual variation setting to separately assess recovery of original predictions
    and preservation of stable ones. VisFlip spans nine dataset-variation combinations across scientific
    reasoning, robot-scene understanding, and medical VQA, covering subtle visual variations common in
    each domain. Experiments across 18 settings demonstrate that FlipDir consistently outperforms existing
    methods on the combined recovery and preservation metric. We will make our code publicly available.
