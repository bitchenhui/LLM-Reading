  title: Variable-Rate Learned Image Compression with Multi-Objective Optimization and Quantization-Reconstruction
    Offsets
  authors:
  - Fatih Kamisli
  - Fabien Racape
  - Hyomin Choi
  published: '2024-02-29'
  updated: '2024-02-29'
  categories:
  - eess.IV
