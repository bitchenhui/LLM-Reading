  title: 'VCD: A Video Conferencing Dataset for Video Compression'
  authors:
  - Babak Naderi
  - Ross Cutler
  - Nabakumar Singh Khongbantabam
  - Yasaman Hosseinkashi
  - Henrik Turbell
  - Albert Sadovnikov
