  title: Application Space and the Rate-Distortion-Complexity Analysis of Neural Video CODECs
  authors:
  - Ricardo L. de Queiroz
  - Diogo C. Garcia
  - Yi-Hsin Chen
  - Ruhan Conceição
  - Wen-Hsiao Peng
  - Luciano V. Agostini
  published: '2025-09-07'
  updated: '2025-09-07'
