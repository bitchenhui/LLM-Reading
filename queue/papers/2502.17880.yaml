  title: 'VVRec: Reconstruction Attacks on DL-based Volumetric Video Upstreaming via Latent Diffusion
    Model with Gamma Distribution'
  authors:
  - Rui Lu
  - Bihai Zhang
  - Dan Wang
  published: '2025-02-25'
