  abstract: 'While Large Vision-Language Models (LVLMs) have significantly advanced GUI agents'' capabilities
    in parsing textual instructions, interpreting screen content, and executing tasks, a critical challenge
    persists: the irreversibility of agent operations-where a single erroneous action can trigger catastrophic
    deviations. To address this, we propose the \textbf{G}UI \textbf{A}ction Cr\textbf{i}tic''s Dat\textbf{a}
    Flywheel System (GAIA), a training framework that enables the models to have iterative critic capabilities,
    which are used to improve the Test-Time Scaling (TTS) of basic GUI agents'' performance. Specifically,
    we train an \textbf{Intuitive Critic Model} (ICM) using positive and negative action examples from
    a base agent first. This critic evaluates the immediate correctness of the agent''s intended actions,
    thereby selecting operations with higher success probability. Then, the initial critic guides agent
    actions to collect refined positive/negative samples, initiating the self-improving cycle. The augmented
    data then trains a second-round critic with enhanced discernment capability. We conduct experiments
    on various datasets and demonstrate that the proposed ICM can improve the test-time performance of
    various closed-source and open-source models, and the performance can be gradually improved as the
    data is recycled. The code, dataset, and accompanying datasheet will be publicly released at https://github.com/SeerRay-Lab/GAIA.'
