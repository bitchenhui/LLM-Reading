  abstract: 'This paper introduces Actor as Its Own Critic, a unified reinforcement learning framework,
    Cycle Group Relative Policy Optimization (CycleGRPO), that jointly optimizes region understanding
    and localization for Multimodal Large Language Models (MLLMs). Unlike existing separate pipelines,
    we leverage the inherent duality between the two tasks to construct a self-evaluating reinforcement
    learning paradigm: "region $\to$ text $\to$ region''''. Specifically, a single MLLM first acts as
    the actor to generate region captions, then immediately transitions to a critic to ground its generated
    text back in the spatial domain. Therefore, CycleGRPO requires only region inputs, e.g., masks or
    bounding boxes, entirely bypassing the need for textual ground truths. A quality-aware token-level
    cycle-consistency reward is employed to assess the semantic discriminability of text captions via
    their physical localization accuracy. Empirically, built upon SAMTok, our CycleGRPO framework successfully
    bootstraps both capabilities simultaneously. Without any task-specific fine-tuning, the framework
    yields consistent performance gains across a wide range of benchmarks, including region captioning,
    region VQA, grounded dialogue, and referring segmentation. Overall, CycleGRPO offers a straightforward
    and scalable way to advance pixel-level capabilities in MLLMs. Code and models are released at https://github.com/devinxzhang/CycleGRPO.'
