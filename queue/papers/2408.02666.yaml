  abstract: Model-based evaluation is at the heart of successful model development -- as a reward model
    for training, and as a replacement for human evaluation. To train such evaluators, the standard approach
    is to collect a large amount of human preference judgments over model responses, which is costly and
    the data becomes stale as models improve. In this work, we present an approach that aims to im-prove
    evaluators without human annotations, using synthetic training data only. Starting from unlabeled
    instructions, our iterative self-improvement scheme generates contrasting model outputs and trains
    an LLM-as-a-Judge to produce reasoning traces and final judgments, repeating this training at each
    new iteration using the improved predictions. Without any labeled preference data, our Self-Taught
    Evaluator can improve a strong LLM (Llama3-70B-Instruct) from 75.4 to 88.3 (88.7 with majority vote)
    on RewardBench. This outperforms commonly used LLM judges such as GPT-4 and matches the performance
    of the top-performing reward models trained with labeled examples.
