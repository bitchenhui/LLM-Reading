  title: The Vicomtech Audio Deepfake Detection System based on Wav2Vec2 for the 2022 ADD Challenge
  authors:
  - Juan M. Martín-Doñas
  - Aitor Álvarez
  published: '2022-03-03'
  updated: '2022-03-03'
