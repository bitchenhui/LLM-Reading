  title: Efficient Evaluation of Quantization-Effects in Neural Codecs
  authors:
  - Wolfgang Mack
  - Ahmed Mustafa
  - Rafał Łaganowski
  - Samer Hijazy
  published: '2025-02-07'
  updated: '2025-02-07'
