  title: 'L-LBVC: Long-Term Motion Estimation and Prediction for Learned Bi-Directional Video Compression'
  authors:
  - Yongqi Zhai
  - Luyang Tang
  - Wei Jiang
  - Jiayu Yang
  - Ronggang Wang
  published: '2025-04-03'
  updated: '2025-04-03'
  categories:
  - cs.CV
