  title: Spatially-Adaptive Learning-Based Image Compression with Hierarchical Multi-Scale Latent Spaces
  authors:
  - Fabian Brand
  - Alexander Kopte
  - Kristian Fischer
  - André Kaup
  published: '2023-07-12'
  updated: '2023-07-12'
