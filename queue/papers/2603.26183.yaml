  title: 'DUGAE: Unified Geometry and Attribute Enhancement via Spatiotemporal Correlations for G-PCC
    Compressed Dynamic Point Clouds'
  authors:
  - Pan Zhao
  - Hui Yuan
  - Chang Sun
  - Chongzhen Tian
  - Raouf Hamzaoui
  - Sam Kwong
  published: '2026-03-27'
  updated: '2026-03-27'
