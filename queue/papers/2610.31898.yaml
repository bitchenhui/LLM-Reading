  abstract: Traffic safety videos provide rich evidence for understanding interactions between pedestrians
    and vehicles, but synthetic-to-real evaluation makes this setting challenging because models must
    learn from simulated scenes and generalize to real-world traffic. In this work, we present StateBridge,
    a traffic video-language framework designed to operate under this synthetic-only training protocol.
    Our approach uses phase-aware clip construction, pedestrian and vehicle track summaries, and structured
    prompts to ground vision-language models in stable traffic evidence rather than appearance alone.
    We fine-tune public vision-language models on synthetic captioning and visual question answering examples,
    then combine their outputs through fact-locked caption fusion and evidence-diverse VQA consensus to
    improve consistency across actor roles, behavioral phases, and question types. StateBridge achieves
    an official S2 score of 55.4679 on AI City Challenge 2026 Track 2 using only synthetic training data.
    These results demonstrate the effectiveness of structured evidence transfer for traffic safety captioning
    and visual question answering.
