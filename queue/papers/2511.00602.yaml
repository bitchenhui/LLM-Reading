  - cs.CL
  abstract: Recent advances in large language model (LLM) reasoning through reinforcement learning rely
    on annotated datasets for verifiable rewards, which may limit models' ability to surpass human-level
    performance. While self-play offers a promising alternative, prior methods yield only marginal or
    even negative gains on post-trained models because they generate problems that cluster around familiar
    concepts rather than discovering novel ones. We introduce Open-Ended Self-Improving Reasoner (OpenSIR),
    a self-play framework in which a single LLM alternates teacher and student roles to generate and solve
    novel problems without external verifiers or annotated data. Starting from a single seed problem,
    OpenSIR sustains open-ended exploration through diversity rewards that push the model toward unfamiliar
    concepts and difficulty calibration that keeps problems learnable. Across seven math benchmarks, OpenSIR
    consistently improves all models, averaging +3.6 points on instruction models and +3.1 on reasoning
    models, while recent self-play baselines yield marginal or even negative gains; starting from a single
    trivial seed, it also surpasses GRPO baselines trained on over 7K annotated examples. Despite training
    only on self-generated math, OpenSIR is the only self-play method that transfers to general reasoning,
    improving by at least +4.4 points on reasoning models.
