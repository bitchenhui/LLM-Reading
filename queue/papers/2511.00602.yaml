  title: 'OpenSIR: Open-Ended Self-Improving Reasoner'
  authors:
  - Wai-Chung Kwan
  - Joshua Ong Jun Leang
  - Pavlos Vougiouklis
  - Jeff Z. Pan
  - Marco Valentino
