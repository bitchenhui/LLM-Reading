  title: Algorithmic Prompt-Augmentation for Efficient LLM-Based Heuristic Design for A* Search
  authors:
  - Thomas Bömer
  - Nico Koltermann
  - Max Disselnmeyer
  - Bastian Amberg
  - Anne Meyer
  published: '2026-01-27'
  updated: '2026-01-27'
  categories:
  - cs.AI
