  abstract: Existing multi-view image compression methods often rely on 2D projection-based similarities
    between views to estimate disparities. While effective for small disparities, such as those in stereo
    images, these methods struggle with the more complex disparities encountered in wide-baseline multi-camera
    systems, commonly found in virtual reality and autonomous driving applications. To address this limitation,
    we propose 3D-LMVIC, a novel learning-based multi-view image compression framework that leverages
    3D Gaussian Splatting to derive geometric priors for accurate disparity estimation. Furthermore, we
    introduce a depth map compression model to minimize geometric redundancy across views, along with
    a multi-view sequence ordering strategy based on a defined distance measure between views to enhance
    correlations between adjacent views. Experimental results demonstrate that 3D-LMVIC achieves superior
    performance compared to both traditional and learning-based methods. Additionally, it significantly
    improves disparity estimation accuracy over existing two-view approaches.
