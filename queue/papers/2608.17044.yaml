  abstract: The 10th AI City Challenge, held with ECCV 2026, marks a decade of community benchmarking
    for intelligent transportation, smart cities, and physical AI. Since its 2017 start with vehicle detection,
    classification, and tracking, the challenge has grown into a broad benchmark suite for multi-camera
    perception, multimodal reasoning, synthetic-to-real learning, generative forecasting, and privacy-preserving
    evaluation. The 2026 edition continued this growth with 325 registered teams, up from 245 in 2025,
    and participation from 26 countries and regions, up from 15. Its six primary tracks cover multi-camera
    3D perception, transportation safety captioning and VQA, traffic anomaly reasoning, text-based person
    anomaly search, generative traffic video forecasting, and cross-city object detection. Track 3 further
    includes two out-of-domain leaderboards, submitted as Tracks 7 and 8, for fisheye traffic-violation
    understanding and pedestrian situated-intent VQA. This paper summarizes the challenge setup, datasets,
    evaluation protocols, leaderboard results, and workshop papers. Across tracks, successful systems
    combine foundation models with geometric grounding, retrieval or reranking, synthetic-data design,
    domain adaptation, and controlled inference.
