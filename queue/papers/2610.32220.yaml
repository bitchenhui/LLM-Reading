  title: Angular Supervision for Visual Object Grounding in Autoregressive Vision-Language Models
  authors:
  - Parsa Esmaeilkhani
  - Longin Jan Latecki
  published: '2026-10-23'
  updated: '2026-10-29'
  categories:
  - cs.CV
  abstract: Autoregressive vision-language models (VLMs) struggle to ground generated text in the correct
    image regions, and existing explainability methods, such as attention maps and Logit Lens, often produce
    poor spatial explanations due to weak text-to-vision attention and sink tokens. We propose \textbf{Angular
    Relevance} ($R_L$), a simple visualization measure based on cosine similarity between visual token
    embeddings and unembedding-matrix rows. Because $R_L$ is invariant to token norm, it produces substantially
    sharper and more faithful heatmaps than attention maps or Logit Lens on out-of-the-box models. Without
    any training, $R_L$ yields competitive referring-expression segmentation (RES), outperforming prior
    diagnostic maps and CLIP-based training-free methods. To preserve localized object information during
    cross-modal mixing, we introduce \textbf{Angular Object-Aware Loss (AOL)}, an auxiliary loss that
    directly supervises visual token embeddings to align angularly with the vocabulary directions of their
    corresponding object concepts. Finetuning with AOL alongside the standard next-token prediction objective
    significantly sharpens object localization in heatmaps, showing that the VLM's own visual tokens can
    be used directly for grounding and improving RES, without training any segmentation heads and without
    degrading general VQA performance. We further demonstrate that the learned grounding also transfers
    to category-level segmentation of object categories not seen during training.
