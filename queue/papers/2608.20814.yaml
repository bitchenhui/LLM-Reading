  title: Enhancing Localized Reasoning for Long Video Understanding via Efficient Segment-to-Video Supervision
  authors:
  - Beibei Zhang
  - Chao Xu
  - Jun Lan
  - Zongyi Li
  - Lai Wei
  - Huijia Zhu
  - Tongwei Ren
  published: '2026-08-21'
  updated: '2026-08-21'
  categories:
