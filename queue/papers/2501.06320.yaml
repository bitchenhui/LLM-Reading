  abstract: This work introduces TTS-Transducer - a novel architecture for text-to-speech, leveraging
    the strengths of audio codec models and neural transducers. Transducers, renowned for their superior
    quality and robustness in speech recognition, are employed to learn monotonic alignments and allow
    for avoiding using explicit duration predictors. Neural audio codecs efficiently compress audio into
    discrete codes, revealing the possibility of applying text modeling approaches to speech generation.
    However, the complexity of predicting multiple tokens per frame from several codebooks, as necessitated
    by audio codec models with residual quantizers, poses a significant challenge. The proposed system
    first uses a transducer architecture to learn monotonic alignments between tokenized text and speech
    codec tokens for the first codebook. Next, a non-autoregressive Transformer predicts the remaining
    codes using the alignment extracted from transducer loss. The proposed system is trained end-to-end.
    We show that TTS-Transducer is a competitive and robust alternative to contemporary TTS systems.
