  title: A Multi-Agent Framework for Automated Machine Learning with Evidence-based Planning for Medical
    Image Analysis
  authors:
  - Yiqing Shen
  - Mathias Unberath
  published: '2026-10-20'
  updated: '2026-10-20'
  categories:
  - cs.CV
  abstract: 'Deep learning has become the default tool for medical image analysis, driven by the open-source
    movement. However, achieving the best performance on a given task remains difficult, with architecture
    selection and hyperparameter optimization (HPO) still considered "more of an art than a science".
    Automated machine learning (AutoML) automates parts of model training, yet helps little in medical
    imaging: general-purpose approaches lack medical architectures and preprocessing, and medical-focused
    ones demand engineering expertise and remain confined to narrow tasks such as 3D segmentation. We
    introduce MedicalMLOmni, a multi-agent AutoML framework that automates model training for diverse
    single- and multi-modal medical tasks through a natural language interface. Specifically, MedicalMLOmni
    performs evidence-based planning by retrieving published results to guide model selection and configuration,
    and employs parallel HPO where multiple agents explore adjustment strategies concurrently. MedicalMLOmni
    achieves the best score on 19 of 20 benchmarks; PMC-VQA is the exception, where a vision-language
    model with broader pre-training leads. Backbone-matched controls attribute the gains to the framework,
    not the backbone. By removing coding requirements, MedicalMLOmni lowers the barrier for domain experts
    with rich datasets but limited engineering expertise.'
