  title: 'DQ-Ladder: A Deep Reinforcement Learning-based Bitrate Ladder for Adaptive Video Streaming'
  authors:
  - Reza Farahani
  - Zoha Azimi
  - Vignesh V Menon
  - Hermann Hellwagner
  - Radu Prodan
  - Schahram Dustdar
  - Christian Timmerer
  published: '2026-03-13'
  updated: '2026-03-13'
