  title: Enhanced adaptive cross-layer scheme for low latency HEVC streaming over Vehicular Ad-hoc Networks
    (VANETs)
  authors:
  - Mohamed Aymen Labiod
  - Mohamed Gharbi
  - François-Xavier Coudoux
  - Patrick Corlay
  - Noureddine Doghmane
  published: '2023-11-05'
  updated: '2023-11-05'
