  title: Can LLMs Design Video Coding Tools? A Case Study on Planar Mode
  authors:
  - Yingwen Zhang
  - Meng Wang
  - Liqiang He
  - Shiqi Wang
  published: '2026-09-01'
  updated: '2026-10-27'
