  title: Cognitive Behaviors that Enable Self-Improving Reasoners, or, Four Habits of Highly Effective
    STaRs
  authors:
  - Kanishk Gandhi
  - Ayush Chakravarthy
  - Anikait Singh
  - Nathan Lile
  - Noah D. Goodman
  published: '2025-03-03'
  updated: '2025-08-15'
  categories:
  - cs.CL
