  abstract: 'This paper studies the removal of salt-and-pepper (SP) noise from grayscale images using
    a median filter (MF) within a recursive thresholding algorithm. Denoising performance is assessed
    using two complementary metrics: SSIM-Img and SSIM-Map.SSIM-Img is standard Image Quality Assessment
    (IQA), the conventional Structural Similarity Index (SSIM) computed between the restored and clean
    images. SSIM-Map is novel IQA, an SSIM-based evaluation computed between entropy maps of these images,
    where the maps are obtained using singular value-decomposition entropy in sliding windows. We show
    that SSIM-Map is more sensitive to residual impulse artifacts, blur, and local intensity transitions,
    and therefore complements the conventional SSIM-Img metric.'
