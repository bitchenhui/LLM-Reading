  title: 'ITSRN++: Stronger and Better Implicit Transformer Network for Continuous Screen Content Image
    Super-Resolution'
  authors:
  - Sheng Shen
  - Huanjing Yue
  - Jingyu Yang
  - Kun Li
  published: '2022-10-17'
  updated: '2022-10-17'
