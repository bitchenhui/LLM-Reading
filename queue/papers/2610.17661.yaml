  title: 'ScenePercept: Scenario-Conditioned Perceptual Assessment of Real-World User-Generated Content
    Images'
  authors:
  - Shuhan Xia
  - Yu Chen
  - Xiang Wang
  - Shuai Li
  - Peipie Li
  - Zekun Li
  published: '2026-10-13'
  updated: '2026-10-26'
