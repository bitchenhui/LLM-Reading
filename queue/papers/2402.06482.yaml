  abstract: The wide adoption of multimedia service capable mobile devices, the availability of better
    networks with higher bandwidths, and the availability of platforms offering digital content has led
    to an increasing popularity of multimedia streaming services. However, multimedia streaming services
    can be subject to different factors that affect the quality perceived by the users, such as service
    interruptions or quality oscillations due to changing network conditions, particularly in mobile networks.
    Dynamic Adaptive Streaming over HTTP (DASH), leverages the use of content-distribution networks and
    the capabilities of the multimedia devices to allow multimedia players to dynamically adapt the quality
    of the media streaming to the available bandwidth and the device characteristics. While many elements
    of DASH are standardized, the algorithms providing the dynamic adaptation of the streaming are not.
    The adaptation is often based on the estimation of the throughput or a buffer control mechanism. In
    this paper, we present a new throughput estimation adaptation algorithm based on a statistical method
    named Adaptive Forgetting Factor (AFF). Using this method, the adaptation logic is able to react appropriately
    to the different conditions of different types of networks. A set of experiments with different traffic
    profiles show that the proposed algorithm improves video quality performance in both wired and wireless
    environments.
