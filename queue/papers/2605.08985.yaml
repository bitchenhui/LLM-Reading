  title: 'LLaVA-UHD v4: What Makes Efficient Visual Encoding in MLLMs?'
  authors:
  - Kechen Fang
  - Yihua Qin
  - Chongyi Wang
  - Wenshuo Ma
  - Tianyu Yu
  - Yuan Yao
  published: '2026-05-09'
  updated: '2026-05-09'
