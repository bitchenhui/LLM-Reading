  title: 'FANVIDv2: Evaluating Video Super-Resolution by Face and Licence-Plate Recognition Under Compound
    Degradation'
  authors:
  - Kavitha Viswanathan
  - Vrinda Goel
  - Shlesh Gholap
  - Devayan Ghosh
  - Madhav Gupta
  - Dhruvi Ganatra
  - Sanket Potdar
  - Amit Sethi
  published: '2026-09-30'
  updated: '2026-09-30'
