  abstract: As virtual try-on (VTON) systems become increasingly important in fashion e-commerce, there
    is a growing need for reliable reference-free evaluation methods, since ground-truth images of the
    same person wearing the target garment are typically unavailable in real-world scenarios. To address
    this challenge, we propose VTON-IQA, a reference-free framework for human-aligned image quality assessment
    without requiring ground-truth images. To model human perceptual judgments, we construct VTON-QBench,
    a large-scale human-annotated benchmark comprising 62,688 try-on images generated by 14 representative
    VTON models and 431,800 quality annotations collected from 13,838 qualified annotators. To the best
    of our knowledge, this is the largest dataset to date for human subjective evaluation in VTON. Extensive
    experiments show that VTON-IQA achieves reliable human-aligned image quality assessment. Moreover,
    we conduct a comprehensive benchmark evaluation of 14 representative VTON models using VTON-IQA.
