  abstract: In the history of audio and acoustic signal processing, perceptual audio coding has certainly
    excelled as a bright success story by its ubiquitous deployment in virtually all digital media devices,
    such as computers, tablets, mobile phones, set-top-boxes, and digital radios. From a technology perspective,
    perceptual audio coding has undergone tremendous development from the first very basic perceptually
    driven coders (including the popular mp3 format) to today's full-blown integrated coding/rendering
    systems. This paper provides a historical overview of this research journey by pinpointing the pivotal
    development steps in the evolution of perceptual audio coding. Finally, it provides thoughts about
    future directions in this area.
