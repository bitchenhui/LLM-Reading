  abstract: We present video-io, a generic web component to publish or subscribe to a media stream in
    WebRTC (web real-time communication) applications. Unlike a call or conference room abstraction of
    existing video conferencing services, it uses a named stream abstraction, which is useful in many
    scenarios beyond just a call or conference. It keeps most of the application logic in the endpoint
    using the extensive application interface of this component, and keeps any vendor specific access
    control or signaling negotiation in a service-specific connector implementation. This allows an app
    developer to write once, and be able to run the web app on different servers or services. We also
    demonstrate its flexibility by implementing the connector for ten different existing systems and services.
    Decoupling the app from the hosted vendor service promotes innovation in the endpoint beyond what
    a single vendor locked client app can offer.
