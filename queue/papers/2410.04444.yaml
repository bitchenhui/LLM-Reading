  abstract: The rapid advancement of large language models (LLMs) has significantly enhanced the capabilities
    of AI-driven agents across various tasks. However, existing agentic systems, whether based on fixed
    pipeline algorithms or pre-defined meta-learning frameworks, cannot search the whole agent design
    space due to the restriction of human-designed components, and thus might miss the globally optimal
    agent design. In this paper, we introduce Gödel Agent, a self-evolving framework inspired by the Gödel
    machine, enabling agents to recursively improve themselves without relying on predefined routines
    or fixed optimization algorithms. Gödel Agent leverages LLMs to dynamically modify its own logic and
    behavior, guided solely by high-level objectives through prompting. Experimental results on mathematical
    reasoning and complex agent tasks demonstrate that implementation of Gödel Agent can achieve continuous
    self-improvement, surpassing manually crafted agents in performance, efficiency, and generalizability.
