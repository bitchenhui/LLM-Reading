  title: Legal Compliance Evaluation of Smart Contracts Generated By Large Language Models
  authors:
  - Chanuka Wijayakoon
  - Hai Dong
  - H. M. N. Dilum Bandara
  - Zahir Tari
  - Anurag Soin
  published: '2025-06-01'
  updated: '2025-06-01'
