  title: 'EAGLE-360: Embodied Active Global-to-Local Exploration in 360$^\circ$'
  authors:
  - Jingtao Xu
  - Zizhuo Lin
  - Jianwen Sun
  - Yi Yang
  - Yawei Luo
  published: '2026-07-02'
  updated: '2026-07-02'
  categories:
