  title: 'IOSVLM: A 3D Vision-Language Model for Unified Dental Diagnosis from Intraoral Scans'
  authors:
  - Huimin Xiong
  - Zijie Meng
  - Tianxiang Hu
  - Chenyi Zhou
  - Yang Feng
  - Zuozhu Liu
  published: '2026-03-17'
  updated: '2026-03-17'
