  abstract: 'While Large Vision-Language Models (VLMs) demonstrate remarkable generic capabilities, their
    clinical reasoning in specialized domains like ocular surface diseases (OSDs) is severely hindered
    by a paucity of high-fidelity, multimodal instruction-tuning data. To dismantle this data bottleneck,
    we introduce IRIS, an Intelligent Recognition and Interaction System tailored for fine-grained OSD
    understanding via external eye photography. First, we curate IRIS-120K, the largest and most comprehensive
    OSD visual question-answering (VQA) dataset to date. Crucially, to overcome the semantic shallowness
    of conventional image-caption pairs, we propose a synergistic data generation paradigm to explicitly
    inject clinical priors. Our data engine operates via a dual-branch framework: 1) a Topic Finding Tree
    (TFT) that hierarchically anchors visual features to precise anatomical and pathological concepts,
    enforcing rigorous medical deduction logic; and 2) a Scene-driven strategy that synthesizes role-adaptive
    clinical dialogues to ensure pragmatic generalization. By explicitly aligning a compact 4B-parameter
    VLM on this structurally enriched corpus, IRIS achieves state-of-the-art performance, comprehensively
    outperforming both generalist and specialized medical VLMs with up to 34B parameters. Our findings
    underscore that structured knowledge injection profoundly prevails over sheer parameter scaling, unlocking
    the potential for resource-efficient, expert-level AI deployment on mobile edge devices for scalable
    OSD screening. Code, datasets, and model weights will be publicly released by this repo.'
