  title: 'IRIS: An Intelligent Vision-Language System for Ocular Surface Diseases via Topic Tree and Scene-Driven
    VQA Generation'
  authors:
  - Hao Wei
  - Wenjin Qi
  - Dasen Dai
  - Minqing Zhang
  - Wu Yuan
  published: '2026-07-05'
  updated: '2026-07-05'
