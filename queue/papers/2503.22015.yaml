  abstract: Learning-based denoising algorithms achieve state-of-the-art performance across various denoising
    tasks. However, training such models relies on access to large training datasets consisting of clean
    and noisy image pairs. On the other hand, in many imaging applications, such as microscopy, collecting
    ground truth images is often infeasible. To address this challenge, researchers have recently developed
    algorithms that can be trained without requiring access to ground truth data. However, training such
    models remains computationally challenging and still requires access to large noisy training samples.
    In this work, inspired by compression-based denoising and recent advances in neural compression, we
    propose a new compression-based denoising algorithm, which we name DeCompress, that i) does not require
    access to ground truth images, ii) does not require access to large training dataset - only a single
    noisy image is sufficient, iii) is robust to overfitting, and iv) achieves superior performance compared
    with zero-shot or unsupervised learning-based denoisers.
