  abstract: 'Frequency features and compression-invariant representation learning are widely assumed to
    be key to deepfake detection that survives video compression. We test this with CAFRL - block-DCT
    and FFT-phase streams, compression-level-conditioned band attention, and adversarial (gradient-reversal)
    compression invariance - and report a controlled negative. Under a pre-registered protocol with capacity-
    and augmentation-matched controls, a plain EfficientNet-B0 on multi-quality data beat CAFRL as specified
    at every compression level on the FaceForensics++ test split, by 3.66 AUC points at CRF 40 (paired,
    single seed). A self-audit of our own negative found four defects biased against the frequency hypothesis,
    and pre-specified re-tests repairing all four showed the deficit to be a recipe artifact, not an architecture
    failure: the baseline recipe recovered 3.96 points over the matching shipped-recipe variant. The frequency
    path made no detectable difference: discriminative alone (standalone validation AUC 0.91-0.98 late
    in training) but of no marginal value under this fusion, at two feature widths of one 4.0 M trunk,
    every seed-pooled interval for the intra-dataset compression contrasts including zero; on the single
    held-out manipulation tested, the fair variants sat below the plain backbone. The adversarial branch,
    as specified, added nothing and degraded its own conditioning estimator; at the fair recipe it is
    untested. Robustness under single-pass H.264 re-encoding came instead from data diversity: real constant-rate-factor
    variants beat synthetic JPEG augmentation by 7.3 points (single runs, non-overlapping intervals).
    The evidence is FaceForensics++-family, GAN-era and single-codec. Match controls on training recipe
    as well as capacity, and buy compression robustness with codec diversity before architecture.'
