  title: 'BigCodec: Pushing the Limits of Low-Bitrate Neural Speech Codec'
  authors:
  - Detai Xin
  - Xu Tan
  - Shinnosuke Takamichi
  - Hiroshi Saruwatari
  published: '2024-09-09'
  updated: '2024-09-09'
  categories:
  - eess.AS
  - cs.SD
  abstract: We present BigCodec, a low-bitrate neural speech codec. While recent neural speech codecs
    have shown impressive progress, their performance significantly deteriorates at low bitrates (around
    1 kbps). Although a low bitrate inherently restricts performance, other factors, such as model capacity,
    also hinder further improvements. To address this problem, we scale up the model size to 159M parameters
    that is more than 10 times larger than popular codecs with about 10M parameters. Besides, we integrate
    sequential models into traditional convolutional architectures to better capture temporal dependency
    and adopt low-dimensional vector quantization to ensure a high code utilization. Comprehensive objective
    and subjective evaluations show that BigCodec, with a bitrate of 1.04 kbps, significantly outperforms
    several existing low-bitrate codecs. Furthermore, BigCodec achieves objective performance comparable
    to popular codecs operating at 4-6 times higher bitrates, and even delivers better subjective perceptual
    quality than the ground truth.
