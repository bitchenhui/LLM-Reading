  abstract: We present a novel WebRTC communication system capable of hosting multi-party audio and video
    conferencing sessions without a media server. We implement various communication models based on the
    needs and capabilities of the communicating parties, and show that we can construct the equivalent
    of Mesh, SFU, and MCU WebRTC networks in our peer-to-peer architecture. In our evaluation we conclude
    that using a limited number of merged streams can improve the user experience significantly, in particular
    if low-resource devices are involved.
