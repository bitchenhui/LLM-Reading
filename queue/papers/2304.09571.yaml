  title: 'LLIC: Large Receptive Field Transform Coding with Adaptive Weights for Learned Image Compression'
  authors:
  - Wei Jiang
  - Peirong Ning
  - Jiayu Yang
  - Yongqi Zhai
  - Feng Gao
