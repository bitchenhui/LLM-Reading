  title: How Much AI Is in This Track? Quantifying the Proportion of AI-Generated Stems in Hybrid Music
    Mixtures
  authors:
  - Fernando Garcia de la Cruz
  - David López-Ayala
  - Pablo Zinemanas
  - Emilio Molina
  - Martín Rocamora
  published: '2026-08-07'
  updated: '2026-10-19'
