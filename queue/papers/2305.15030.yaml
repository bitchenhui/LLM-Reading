  title: Make Lossy Compression Meaningful for Low-Light Images
  authors:
  - Shilv Cai
  - Liqun Chen
  - Sheng Zhong
  - Luxin Yan
  - Jiahuan Zhou
  - Xu Zou
  published: '2023-05-24'
