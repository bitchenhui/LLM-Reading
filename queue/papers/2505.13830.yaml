  abstract: Large language model (LLM) based zero-shot text-to-speech (TTS) methods tend to preserve the
    acoustic environment of the audio prompt, leading to degradation in synthesized speech quality when
    the audio prompt contains noise. In this paper, we propose a novel neural codec-based speech denoiser
    and integrate it with the advanced LLM-based TTS model, LauraTTS, to achieve noise-robust zero-shot
    TTS. The proposed codec denoiser consists of an audio codec, a token denoiser, and an embedding refiner.
    The token denoiser predicts the first two groups of clean acoustic tokens from the noisy ones, which
    can serve as the acoustic prompt for LauraTTS to synthesize high-quality personalized speech or be
    converted to clean speech waveforms through the embedding refiner and codec decoder. Experimental
    results show that our proposed codec denoiser outperforms state-of-the-art speech enhancement (SE)
    methods, and the proposed noise-robust LauraTTS surpasses the approach using additional SE models.
