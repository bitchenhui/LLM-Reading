  abstract: Recent advancements in real-time super-resolution have enabled higher-quality video streaming,
    yet existing methods struggle with the unique challenges of compressed video content. Commonly used
    datasets do not accurately reflect the characteristics of streaming media, limiting the relevance
    of current benchmarks. To address this gap, we introduce a comprehensive dataset - StreamSR - sourced
    from YouTube, covering a wide range of video genres and resolutions representative of real-world streaming
    scenarios. We benchmark 11 state-of-the-art real-time super-resolution models to evaluate their performance
    for the streaming use-case. Furthermore, we propose EfRLFN, an efficient real-time model that integrates
    Efficient Channel Attention and a hyperbolic tangent activation function - a novel design choice in
    the context of real-time super-resolution. We extensively optimized the architecture to maximize efficiency
    and designed a composite loss function that improves training convergence. EfRLFN combines the strengths
    of existing architectures while improving both visual quality and runtime performance. Finally, we
    show that fine-tuning other models on our dataset results in significant performance gains that generalize
    well across various standard benchmarks. We made the dataset, the code, and the benchmark available
    at https://github.com/EvgeneyBogatyrev/EfRLFN.
