  title: Accelerating Learnt Video Codecs with Gradient Decay and Layer-wise Distillation
  authors:
  - Tianhao Peng
  - Ge Gao
  - Heming Sun
  - Fan Zhang
  - David Bull
  published: '2023-12-05'
