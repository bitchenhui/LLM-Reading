  title: 'DT-JRD: Deep Transformer based Just Recognizable Difference Prediction Model for Video Coding
    for Machines'
  authors:
  - Junqi Liu
  - Yun Zhang
  - Xiaoqi Wang
  - Xu Long
  - Sam Kwong
  published: '2024-11-14'
  updated: '2024-11-14'
  categories:
  - eess.IV
  - cs.CV
  abstract: Just Recognizable Difference (JRD) represents the minimum visual difference that is detectable
    by machine vision, which can be exploited to promote machine vision oriented visual signal processing.
    In this paper, we propose a Deep Transformer based JRD (DT-JRD) prediction model for Video Coding
    for Machines (VCM), where the accurately predicted JRD can be used reduce the coding bit rate while
    maintaining the accuracy of machine tasks. Firstly, we model the JRD prediction as a multi-class classification
    and propose a DT-JRD prediction model that integrates an improved embedding, a content and distortion
    feature extraction, a multi-class classification and a novel learning strategy. Secondly, inspired
    by the perception property that machine vision exhibits a similar response to distortions near JRD,
    we propose an asymptotic JRD loss by using Gaussian Distribution-based Soft Labels (GDSL), which significantly
    extends the number of training labels and relaxes classification boundaries. Finally, we propose a
    DT-JRD based VCM to reduce the coding bits while maintaining the accuracy of object detection. Extensive
    experimental results demonstrate that the mean absolute error of the predicted JRD by the DT-JRD is
    5.574, outperforming the state-of-the-art JRD prediction model by 13.1%. Coding experiments shows
    that comparing with the VVC, the DT-JRD based VCM achieves an average of 29.58% bit rate reduction
    while maintaining the object detection accuracy.
