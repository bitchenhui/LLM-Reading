  title: 'Speaking Clearly: A Simplified Whisper-Based Codec for Low-Bitrate Speech Coding'
  authors:
  - Xin Zhang
  - Lin Li
  - Xiangni Lu
  - Jianquan Liu
  - Kong Aik Lee
  published: '2025-10-23'
  updated: '2026-01-27'
