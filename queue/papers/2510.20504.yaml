  - cs.SD
  abstract: 'Speech codecs serve as bridges between continuous speech signals and large language models,
    yet face an inherent conflict between acoustic fidelity and semantic preservation. To mitigate this
    conflict, prevailing methods augment acoustic codecs with complex semantic supervision. We explore
    the opposite direction: a semantic-first approach that starts from a semantically-capable model and
    adapts it for high-fidelity acoustic reconstruction. Through empirical analysis, we discover that
    targeted architectural simplification can unlock the acoustic modeling potential of Whisper, a text-aligned
    Automatic Speech Recognition (ASR) model. Based on this finding, we propose SimWhisper-Codec, a novel
    codec that balances the semantic and acoustic preservation by leveraging a frozen, simplified Whisper
    encoder without requiring external supervision. Experimental results demonstrate that SimWhisper-Codec
    achieves superior performance in both semantic preservation and acoustic quality compared to semantically-supervised
    codecs such as Mimi Codec and SpeechTokenizer at similar bitrates, validating the effectiveness of
    our semantic-first approach. Code is available at https://github.com/ZhangXinWhut/SimWhisper-Codec.'
