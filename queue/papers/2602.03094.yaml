  abstract: 'Modern Large Language Models (LLMs) have shown rapid improvements in reasoning capabilities,
    driven largely by reinforcement learning (RL) with verifiable rewards. Here, we ask whether these
    LLMs can self-improve without the need for additional training. We identify two core challenges for
    such systems: (i) efficiently generating diverse, high-quality candidate solutions, and (ii) reliably
    selecting correct answers in the absence of ground-truth supervision. To address these challenges,
    we propose Test-time Recursive Thinking (TRT), an iterative self-improvement framework that conditions
    generation on rollout-specific strategies, accumulated knowledge, and self-generated verification
    signals. Using TRT, open-source models reach 100% accuracy on AIME-25/24, and on LiveCodeBench''s
    most difficult problems, closed-source models improve by 10.4-14.8 percentage points without external
    feedback.'
