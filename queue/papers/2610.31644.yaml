  updated: '2026-10-22'
  categories:
  - cs.CV
  abstract: Learnable Representations (LRs) can fit parametric families of functions to diverse kinds
    of signals. These emergent neural-native data formats are gathering interest in the scientific community
    due to their compactness, resolution-agnosticism and amenability to direct neural processing. On the
    other hand, gigapixel images are becoming increasingly widespread across a variety of scientific,
    cultural, and industrial domains. In this paper, we present GigaBench, the first benchmark and experimental
    evaluation focused on deploying LRs with gigapixel imagery. GigaBench includes images collected, acquired,
    and synthetically rendered across diverse domains, and addresses image compression and super-resolution.
    We adapt a representative set of LRs, spanning Implicit, Hybrid, and Explicit methods, so as to operate
    reliably at the gigapixel scale on consumer hardware. Through systematic evaluation across reconstruction
    quality, model size, compression and inference times, we identify consistent trends across methods
    and suggest actionable guidance for future investigation.
