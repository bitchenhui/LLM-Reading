  abstract: Point cloud compression significantly reduces data volume but sacrifices reconstruction quality,
    highlighting the need for advanced quality enhancement techniques. Most existing approaches focus
    primarily on point-to-point fidelity, often neglecting the importance of perceptual quality as interpreted
    by the human visual system. To address this issue, we propose a generative adversarial network for
    point cloud quality enhancement (PCE-GAN), grounded in optimal transport theory, with the goal of
    simultaneously optimizing both data fidelity and perceptual quality. The generator consists of a local
    feature extraction (LFE) unit, a global spatial correlation (GSC) unit and a feature squeeze unit.
    The LFE unit uses dynamic graph construction and a graph attention mechanism to efficiently extract
    local features, placing greater emphasis on points with severe distortion. The GSC unit uses the geometry
    information of neighboring patches to construct an extended local neighborhood and introduces a transformer-style
    structure to capture long-range global correlations. The discriminator computes the deviation between
    the probability distributions of the enhanced point cloud and the original point cloud, guiding the
    generator to achieve high quality reconstruction. Experimental results show that the proposed method
    achieves state-of-the-art performance. Specifically, when applying PCE-GAN to the latest geometry-based
    point cloud compression (G-PCC) test model, it achieves an average BD-rate of -19.2% compared with
    the PredLift coding configuration and -18.3% compared with the RAHT coding configuration. Subjective
    comparisons show a significant improvement in texture clarity and color transitions, revealing finer
    details and more natural color gradients.
