  title: 'PCE-GAN: A Generative Adversarial Network for Point Cloud Attribute Quality Enhancement based
    on Optimal Transport'
  authors:
  - Tian Guo
  - Hui Yuan
  - Qi Liu
  - Honglei Su
  - Raouf Hamzaoui
  - Sam Kwong
  published: '2025-02-26'
  updated: '2025-02-26'
