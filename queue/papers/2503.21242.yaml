  abstract: 'Integrated sensing and communication (ISAC) is envisioned be to one of the paradigms upon
    which next-generation mobile networks will be built, extending localization and tracking capabilities,
    as well as giving birth to environment-aware wireless access. A key aspect of sensing integration
    is parameter estimation, which involves extracting information about the surrounding environment,
    such as the direction, distance, and velocity of various objects within. This is typically of a high-dimensional
    nature, which leads to significant computational complexity, if performed jointly across multiple
    sensing dimensions, such as space, frequency, and time. Additionally, due to the incorporation of
    sensing on top of the data transmission, the time window available for sensing is likely to be short,
    resulting in an estimation problem where only a single snapshot is accessible. In this work, we propose
    PLAIN, a tensor-based estimation architecture that flexibly scales with multiple sensing dimensions
    and can handle high dimensionality, limited measurement time, and super-resolution requirements. It
    consists of three stages: a compression stage, where the high dimensional input is converted into
    lower dimensionality, without sacrificing resolution; a decoupled estimation stage, where the parameters
    across the different dimensions are estimated in parallel with low complexity; an input-based fusion
    stage, where the decoupled parameters are fused together to form a paired multidimensional estimate.
    We investigate the performance of the architecture for different configurations and compare it against
    practical sequential and joint estimation baselines, as well as theoretical bounds. Our results show
    that PLAIN, using tools from tensor algebra, subspace-based processing, and compressed sensing, can
    scale flexibly with dimensionality, while operating with low complexity and maintaining super-resolution.'
