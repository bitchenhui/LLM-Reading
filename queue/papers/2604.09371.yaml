  abstract: We propose a generative framework for multi-track music source separation (MSS) that reformulates
    the task as conditional discrete token generation. Unlike conventional approaches that directly estimate
    continuous signals in the time or frequency domain, our method combines a Conformer-based conditional
    encoder, a dual-path neural audio codec (HCodec), and a decoder-only language model to autoregressively
    generate audio tokens for four target tracks. The generated tokens are decoded back to waveforms through
    the codec decoder. Evaluation on the MUSDB18-HQ benchmark shows that our generative approach achieves
    perceptual quality approaching state-of-the-art discriminative methods, while attaining the highest
    NISQA score on the vocals track. Ablation studies confirm the effectiveness of the learnable Conformer
    encoder and the benefit of sequential cross-track generation.
