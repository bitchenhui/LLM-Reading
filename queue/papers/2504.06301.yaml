  title: Subjective Visual Quality Assessment for High-Fidelity Learning-Based Image Compression
  authors:
  - Mohsen Jenadeleh
  - Jon Sneyers
  - Panqi Jia
  - Shima Mohammadi
  - Joao Ascenso
  - Dietmar Saupe
  published: '2025-04-07'
  updated: '2025-04-10'
  categories:
  - eess.IV
  - cs.CV
  abstract: Learning-based image compression methods have recently emerged as promising alternatives to
    traditional codecs, offering improved rate-distortion performance and perceptual quality. JPEG AI
    represents the latest standardized framework in this domain, leveraging deep neural networks for high-fidelity
    image reconstruction. In this study, we present a comprehensive subjective visual quality assessment
    of JPEG AI-compressed images using the JPEG AIC-3 methodology, which quantifies perceptual differences
    in terms of Just Noticeable Difference (JND) units. We generated a dataset of 50 compressed images
    with fine-grained distortion levels from five diverse sources. A large-scale crowdsourced experiment
    collected 96,200 triplet responses from 459 participants. We reconstructed JND-based quality scales
    using a unified model based on boosted and plain triplet comparisons. Additionally, we evaluated the
    alignment of multiple objective image quality metrics with human perception in the high-fidelity range.
    The CVVDP metric achieved the overall highest performance; however, most metrics including CVVDP were
    overly optimistic in predicting the quality of JPEG AI-compressed images. These findings emphasize
    the necessity for rigorous subjective evaluations in the development and benchmarking of modern image
    codecs, particularly in the high-fidelity range. Another technical contribution is the introduction
    of the well-known Meng-Rosenthal-Rubin statistical test to the field of Quality of Experience research.
    This test can reliably assess the significance of difference in performance of quality metrics in
    terms of correlation between metrics and ground truth. The complete dataset, including all subjective
    scores, is publicly available at https://github.com/jpeg-aic/dataset-JPEG-AI-SDR25.
