  title: 'FunFace: Feature Utility and Norm Estimation for Face Recognition'
  authors:
  - Žiga Babnik
  - Fadi Boutros
  - Naser Damer
  - Deepak Kumar Jain
  - Peter Peer
  - Vitomir Štruc
  published: '2026-04-29'
  updated: '2026-04-29'
