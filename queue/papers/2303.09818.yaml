  title: A real-time blind quality-of-experience assessment metric for HTTP adaptive streaming
  authors:
  - Chunyi Li
  - May Lim
  - Abdelhak Bentaleb
  - Roger Zimmermann
  published: '2023-03-17'
  updated: '2023-03-17'
  categories:
  - eess.IV
  - cs.MM
  abstract: In today's Internet, HTTP Adaptive Streaming (HAS) is the mainstream standard for video streaming,
    which switches the bitrate of the video content based on an Adaptive BitRate (ABR) algorithm. An effective
    Quality of Experience (QoE) assessment metric can provide crucial feedback to an ABR algorithm. However,
    predicting such real-time QoE on the client side is challenging. The QoE prediction requires high
    consistency with the Human Visual System (HVS), low latency, and blind assessment, which are difficult
    to realize together. To address this challenge, we analyzed various characteristics of HAS systems
    and propose a non-uniform sampling metric to reduce time complexity. Furthermore, we design an effective
    QoE metric that integrates resolution and rebuffering time as the Quality of Service (QoS), as well
    as spatiotemporal output from a deep neural network and specific switching events as content information.
    These reward and penalty features are regressed into quality scores with a Support Vector Regression
    (SVR) model. Experimental results show that the accuracy of our metric outperforms the mainstream
    blind QoE metrics by 0.3, and its computing time is only 60\% of the video playback, indicating that
    the proposed metric is capable of providing real-time guidance to ABR algorithms and improving the
    overall performance of HAS.
