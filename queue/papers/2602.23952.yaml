  abstract: 'Knowledge-based visual question answering (KB-VQA) demonstrates significant potential for
    handling knowledge-intensive tasks. However, conflicts arise between static parametric knowledge in
    vision language models (VLMs) and dynamically retrieved information due to the static model knowledge
    from pre-training. The outputs either ignore retrieved contexts or exhibit inconsistent integration
    with parametric knowledge, posing substantial challenges for KB-VQA. Current knowledge conflict mitigation
    methods primarily adapted from language-based approaches, focusing on context-level conflicts through
    engineered prompting strategies or context-aware decoding mechanisms. However, these methods neglect
    the critical role of visual information in conflicts and suffer from redundant retrieved contexts,
    which impair accurate conflict identification and effective mitigation. To address these limitations,
    we propose \textbf{CC-VQA}: a novel training-free, conflict- and correlation-aware method for KB-VQA.
    Our method comprises two core components: (1) Vision-Centric Contextual Conflict Reasoning, which
    performs visual-semantic conflict analysis across internal and external knowledge contexts; and (2)
    Correlation-Guided Encoding and Decoding, featuring positional encoding compression for low-correlation
    statements and adaptive decoding using correlation-weighted conflict scoring. Extensive evaluations
    on E-VQA, InfoSeek, and OK-VQA benchmarks demonstrate that CC-VQA achieves state-of-the-art performance,
    yielding absolute accuracy improvements of 3.3\% to 6.4\% compared to existing methods. Code is available
    at https://github.com/cqu-student/CC-VQA.'
