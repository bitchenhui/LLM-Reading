  title: Learning to Classify New Foods Incrementally Via Compressed Exemplars
  authors:
  - Justin Yang
  - Zhihao Duan
  - Jiangpeng He
  - Fengqing Zhu
  published: '2024-04-11'
  updated: '2024-04-11'
