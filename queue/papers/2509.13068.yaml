  title: 'MSR-Codec: A Low-Bitrate Multi-Stream Residual Codec for High-Fidelity Speech Generation with
    Information Disentanglement'
  authors:
  - Jingyu Li
  - Guangyan Zhang
  - Zhen Ye
  - Yiwen Guo
  published: '2025-09-16'
  updated: '2026-02-24'
  categories:
  - eess.AS
  abstract: 'Audio codecs are a critical component of modern speech generation systems. This paper introduces
    a low-bitrate, multi-scale residual codec that encodes speech into four distinct streams: semantic,
    timbre, prosody, and residual. This architecture achieves high-fidelity speech reconstruction at competitive
    low bitrates while demonstrating an inherent ability for information disentanglement. We construct
    a two-stage language model for text-to-speech (TTS) synthesis using this codec, which, despite its
    lightweight design and minimal data requirements, achieves a state-of-the-art Word Error Rate (WER)
    and superior speaker similarity compared to several larger models. Furthermore, the codec''s design
    proves highly effective for voice conversion, enabling independent manipulation of speaker timbre
    and prosody. Our inference code, pre-trained models, and audio samples are available at https://github.com/herbertLJY/MSRCodec.'
