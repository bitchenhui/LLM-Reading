  abstract: We present GMLv2, a reference-based model designed for the prediction of subjective audio
    quality as measured by MUSHRA scores. GMLv2 introduces a Beta distribution-based loss to model the
    listener ratings and incorporates additional neural audio coding (NAC) subjective datasets to extend
    its generalization and applicability. Extensive evaluations on diverse testset demonstrate that proposed
    GMLv2 consistently outperforms widely used metrics, such as PEAQ and ViSQOL, both in terms of correlation
    with subjective scores and in reliably predicting these scores across diverse content types and codec
    configurations. Consequently, GMLv2 offers a scalable and automated framework for perceptual audio
    quality evaluation, poised to accelerate research and development in modern audio coding technologies.
