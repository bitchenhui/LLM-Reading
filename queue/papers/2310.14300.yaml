  abstract: In this paper, we proposed AI-based audio coding using MFCC features in an adversarial setting.
    We combined a conventional encoder with an adversarial learning decoder to better reconstruct the
    original waveform. Since GAN gives implicit density estimation, therefore, such models are less prone
    to overfitting. We compared our work with five well-known codecs namely AAC, AC3, Opus, Vorbis, and
    Speex, performing on bitrates from 2kbps to 128kbps. MFCCGAN_36k achieved the state-of-the-art result
    in terms of SNR despite a lower bitrate in comparison to AC3_128k, AAC_112k, Vorbis_48k, Opus_48k,
    and Speex_48K. On the other hand, MFCCGAN_13k also achieved high SNR=27 which is equal to that of
    AC3_128k, and AAC_112k while having a significantly lower bitrate (13 kbps). MFCCGAN_36k achieved
    higher NISQA-MOS results compared to AAC_48k while having a 20% lower bitrate. Furthermore, MFCCGAN_13k
    obtained NISQAMOS= 3.9 which is much higher than AAC_24k, AAC_32k, AC3_32k, and AAC_48k. For future
    work, we finally suggest adopting loss functions optimizing intelligibility and perceptual metrics
    in the MFCCGAN structure to improve quality and intelligibility simultaneously.
