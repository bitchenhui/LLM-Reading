  title: Continuous Degradation Modeling via Latent Flow Matching for Real-World Super-Resolution
  authors:
  - Hyeonjae Kim
  - Dongjin Kim
  - Eugene Jin
  - Tae Hyun Kim
  published: '2026-02-04'
  updated: '2026-02-04'
  categories:
  - cs.CV
  abstract: While deep learning-based super-resolution (SR) methods have shown impressive outcomes with
    synthetic degradation scenarios such as bicubic downsampling, they frequently struggle to perform
    well on real-world images that feature complex, nonlinear degradations like noise, blur, and compression
    artifacts. Recent efforts to address this issue have involved the painstaking compilation of real
    low-resolution (LR) and high-resolution (HR) image pairs, usually limited to several specific downscaling
    factors. To address these challenges, our work introduces a novel framework capable of synthesizing
    authentic LR images from a single HR image by leveraging the latent degradation space with flow matching.
    Our approach generates LR images with realistic artifacts at unseen degradation levels, which facilitates
    the creation of large-scale, real-world SR training datasets. Comprehensive quantitative and qualitative
    assessments verify that our synthetic LR images accurately replicate real-world degradations. Furthermore,
    both traditional and arbitrary-scale SR models trained using our datasets consistently yield much
    better HR outcomes.
