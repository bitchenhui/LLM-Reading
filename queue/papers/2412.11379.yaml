  title: Controllable Distortion-Perception Tradeoff Through Latent Diffusion for Neural Image Compression
  authors:
  - Chuqin Zhou
  - Guo Lu
  - Jiangchuan Li
  - Xiangyu Chen
  - Zhengxue Cheng
  - Li Song
  - Wenjun Zhang
  published: '2024-12-16'
  updated: '2024-12-16'
