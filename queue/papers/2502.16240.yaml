  abstract: Recent advancements in Neural Audio Codec (NAC) models have inspired their use in various
    speech processing tasks, including speech enhancement (SE). In this work, we propose a novel, efficient
    SE approach by leveraging the pre-quantization output of a pretrained NAC encoder. Unlike prior NAC-based
    SE methods, which process discrete speech tokens using Language Models (LMs), we perform SE within
    the continuous embedding space of the pretrained NAC, which is highly compressed along the time dimension
    for efficient representation. Our lightweight SE model, optimized through an embedding-level loss,
    delivers results comparable to SE baselines trained on larger datasets, with a significantly lower
    real-time factor of 0.005. Additionally, our method achieves a low GMAC of 3.94, reducing complexity
    18-fold compared to Sepformer in a simulated cloud-based audio transmission environment. This work
    highlights a new, efficient NAC-based SE solution, particularly suitable for cloud applications where
    NAC is used to compress audio before transmission. Copyright 20XX IEEE. Personal use of this material
