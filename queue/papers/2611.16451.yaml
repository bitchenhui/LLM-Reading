  abstract: 'The gap between controlled synthetic distortions and complex real-world degradations introduces
    a critical domain shift challenge for No-Reference Image Quality Assessment. Although Unsupervised
    Domain Adaptation (UDA) approaches attempt to address this issue, they remain constrained by substantial
    retraining overhead and cumulative error propagation inherent in iterative pseudo-labeling. Inspired
    by the dual-process theory of human cognition for remarkable generalization ability, we propose Hierarchical
    Intuitive and Fuzzy Consensus (HIFC), a completely train-free Cross-Domain IQA framework. HIFC employs
    asymmetric perceptual decomposition to disentangle semantic content from distortion-sensitive representations.
    The final quality score is fused through the synergy of two complementary branches: a memory consensus
    branch that retrieves a stable Fuzzy Quality Centroid from a synthetic reference gallery, and an intuitive
    branch that captures aesthetic polarization via zero-shot vision-language alignment. Extensive experiments
    show that HIFC achieves state-of-the-art performance across multiple benchmarks, attaining the highest
    average SRCC and PLCC among competing UDA methods. Most notably, in the challenging synthetic-to-authentic
    cross-domain setting, HIFC achieves a substantial performance margin over competing methods, demonstrating
    remarkable robustness and generalization.'
