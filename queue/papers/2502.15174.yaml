  title: 'FD-LSCIC: Frequency Decomposition-based Learned Screen Content Image Compression'
  authors:
  - Shiqi Jiang
  - Hui Yuan
  - Shuai Li
  - Huanqiang Zeng
  - Sam Kwong
  published: '2025-02-21'
  updated: '2025-02-21'
