  title: 'Review the Episodes, Refine the Lessons: Simple Memory Evolution for Embodied Agents'
  authors:
  - Yifei Yao
  - Yude Zou
  - Xing Gao
  - Guanbo Jiao
  - Yukai Wang
  - Jianming Ma
  - Weinan Zhang
  - Chunhua Shen
  published: '2026-11-08'
  updated: '2026-11-08'
  categories:
  - cs.RO
