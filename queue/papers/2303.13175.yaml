  abstract: The Internet has turned the entire world into a small village;this is because it has made
    it possible to share millions of images and videos. However, sending and receiving a huge amount of
    data is considered to be a main challenge. To address this issue, a new algorithm is required to reduce
    image bits and represent the data in a compressed form. Nevertheless, image compression is an important
    application for transferring large files and images. This requires appropriate and efficient transfers
    in this field to achieve the task and reach the best results. In this work, we propose a new algorithm
    based on discrete Hermite wavelets transformation (DHWT) that shows the efficiency and quality of
    the color images. By compressing the color image, this method analyzes it and divides it into approximate
    coefficients and detail coefficients after adding the wavelets into MATLAB. With Multi-Resolution
    Analyses (MRA), the appropriate filter is derived, and the mathematical aspects prove to be validated
    by testing a new filter and performing its operation. After the decomposition of the rows and upon
    the process of the reconstruction, taking the inverse of the filter and dealing with the columns of
    the matrix, the original matrix is improved by measuring the parameters of the image to achieve the
    best quality of the resulting image, such as the peak signal-to-noise ratio (PSNR), compression ratio
    (CR), bits per pixel (BPP), and mean square error (MSE).
