  abstract: 'Ultrasound is one of the most widely used medical imaging modalities, and recent large vision-language
    models(VLMs) have shown increasing capabilities in ultrasound image understanding. However, these
    models fail to provide pixel-level visual evidence aligned with their semantic predictions, and their
    fine-grained grounding capability in ultrasound remains largely unclear. We introduce UltraG-Bench,
    a large-scale multi-task benchmark for evaluating pixel-level evidence grounding in ultrasound. UltraG-Bench
    is built by annotating 40 public ultrasound segmentation datasets spanning 13 anatomical categories,
    and comprises three progressive tasks: instruction-guided segmentation, evidence-grounded VQA, and
    evidence-grounded report generation, with 331125, 666779, and 138832 annotations, respectively. Comprehensive
    evaluation of 14 state-of-the-art models reveals a substantial gap between semantic understanding
    and fine-grained pixel-level localization. We further propose UltraG-Agent, which combines the semantic
    reasoning capabilities of a VLM with the ultrasound-specific segmentation capability of UltraSAM3.
    Experiments show that UltraG-Agent substantially improves both semantic prediction and pixel-level
    visual grounding. Our dataset and code are available at https://github.com/zhuqh19/UltraG-Bench.'
