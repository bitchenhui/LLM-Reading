  title: 'SSR-Zero: Simple Self-Rewarding Reinforcement Learning for Machine Translation'
  authors:
  - Wenjie Yang
  - Mao Zheng
  - Mingyang Song
  - Zheng Li
  - Sitong Wang
  published: '2025-05-22'
  updated: '2026-04-26'
  categories:
