  abstract: 'LLM-based autonomous agents have demonstrated strong capabilities in reasoning, planning,
    and tool use, yet remain limited when tasks require sustained coordination across roles, tools, and
    environments. Multi-agent systems address this through structured collaboration among specialized
    agents, but tighter coordination also amplifies a less explored risk: errors can propagate across
    agents and interaction rounds, producing failures that are difficult to diagnose and rarely translate
    into structural self-improvement. Existing surveys cover individual agent capabilities, multi-agent
    collaboration, or agent self-evolution separately, leaving the causal dependencies among them unexamined.
    This survey provides a unified review organized around four causally linked stages, which we term
    the LIFE progression: Lay the capability foundation, Integrate agents through collaboration, Find
    faults through attribution, and Evolve through autonomous self-improvement. For each stage, we provide
    systematic taxonomies and formally characterize the dependencies between adjacent stages, revealing
    how each stage both depends on and constrains the next. Beyond synthesizing existing work, we identify
    open challenges at stage boundaries and propose a cross-stage research agenda for closed-loop multi-agent
    systems capable of continuously diagnosing failures, reorganizing structures, and refining agent behaviors,
    extending current coordination frameworks toward more self-organizing forms of collective intelligence.
    By bridging these previously fragmented research threads, this survey aims to offer both a systematic
    reference and a conceptual roadmap toward autonomous, self-improving multi-agent intelligence.'
