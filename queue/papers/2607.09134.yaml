  title: 'ReGen: Hierarchical Multi-Prompt Representation Generation for Efficient Waveform Diffusion
    Models'
  authors:
  - Sang-Hoon Lee
  - Ha-Yeong Choi
  published: '2026-07-10'
  updated: '2026-07-10'
