  abstract: Self-evolving LLMs excel in verifiable domains but struggle in open-ended tasks, where reliance
    on proxy LLM judges introduces capability bottlenecks and reward hacking. To overcome this, we introduce
    G-Zero, a verifier-free, co-evolutionary framework for autonomous self-improvement. Our core innovation
    is Hint-$δ$, an intrinsic reward that quantifies the predictive shift between a Generator model's
    unassisted response and its response conditioned on a self-generated hint. Using this signal, a Proposer
    model is trained via GRPO to continuously target the Generator's blind spots by synthesizing challenging
    queries and informative hints. The Generator is concurrently optimized via DPO to internalize these
    hint-guided improvements. Theoretically, we prove a best-iterate suboptimality guarantee for an idealized
    standard-DPO version of G-Zero, provided that the Proposer induces sufficient exploration coverage
    and the data filteration keeps pseudo-label score noise low. By deriving supervision entirely from
    internal distributional dynamics, G-Zero bypasses the capability ceilings of external judges, providing
    a scalable, robust pathway for continuous LLM self-evolution across unverifiable domains.
