  - cs.AI
  abstract: 'Textual skills enable large language model (LLM) based agents to accumulate reusable procedural
    knowledge without updating model parameters. Yet existing skill evolution remains largely confined
    to the text space: an optimizer must diagnose success and failure patterns, and revise skills solely
    from long execution trajectories and sparse task outcomes. This text-only paradigm leaves the agent''s
    internal representations, which contain rich records of its evolving execution state, outside the
    skill optimization loop. We ask whether an agent can improve its external textual skills by reflecting
    on its own internal representations. We introduce Rep2Skill, a representation-guided framework for
    self-evolution on agent skills. Specifically, upon the collected agent rollouts, Rep2Skill models
    their internal model representation trajectories to localize turns that deviate from successful execution
    dynamics, and it further interprets these signals alongside the execution contexts as actionable textual
    feedback for targeted skill revision. Experiments on two agent environments with two open-source LLMs
    show that Rep2Skill consistently outperforms text-only approaches in the self-evolution setting, where
    the same LLM serves as both executor and optimizer without a stronger external model. This establishes
    a promising direction moving agent self-improvement beyond text-only reflection.'
