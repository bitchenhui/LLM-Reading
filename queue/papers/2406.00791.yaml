  title: 'Towards Point Cloud Compression for Machine Perception: A Simple and Strong Baseline by Learning
    the Octree Depth Level Predictor'
  authors:
  - Lei Liu
  - Zhihao Hu
  - Zhenghao Chen
  published: '2024-06-02'
  updated: '2024-06-02'
  categories:
  - cs.CV
