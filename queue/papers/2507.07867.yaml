  title: 'Re-Bottleneck: Latent Re-Structuring for Neural Audio Autoencoders'
  authors:
  - Dimitrios Bralios
  - Jonah Casebeer
  - Paris Smaragdis
  published: '2025-07-10'
  updated: '2025-09-08'
