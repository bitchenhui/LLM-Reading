  title: An Integrated Representation & Compression Scheme Based on Convolutional Autoencoders with 4D
    DCT Perceptual Encoding for High Dynamic Range Light Fields
  authors:
  - Sally Khaidem
  - Mansi Sharma
  published: '2022-06-21'
