  title: 'DecArena: Evaluating Large-Scale Decentralized Multi-Agent Collaboration'
  authors:
  - Jiali Cheng
  - Oleg Rokhlenko
  - Joo-Kyung Kim
  - Hadi Amiri
  - Xingzhi Guo
  published: '2026-11-11'
  updated: '2026-11-11'
  categories:
  - cs.MA
  - cs.AI
  - cs.CL
  abstract: Emerging personal AI agents raise fundamental scalability and privacy concerns for centralized
    multi-agent systems (MASs), which rely on a global orchestrator with broad access to agents, resources,
    and communication. In decentralized environments, global visibility is unavailable. Agents need to
    proactively discover non-local resources (e.g. tools, skills), and collaborate with other agents to
    solve tasks. We study decentralized multi-agent collaboration under graph-constrained communication,
    a natural reflection of human structures. Each agent observes only its local state and can interact
    only with neighboring agents. We introduce a benchmark with synthetic scalable distributed tool calling
    with 100K+ tools. Our experiments reveal that recent LLM agents struggle to discover non-local relevant
    resources and collaborate in decentralized setting. Moreover, standard reinforcement learning fails
    to reliably overcome this limitation, suggesting that decentralized MAS needs more explicit harness
    mechanisms for effective collaboration, even using SOTA LLMs. We then present a strong baseline \textbf{GraphHarness},
    combining topology-aware warmup with self-improving LLM-based routing. Results show that GraphHarness
    substantially improves task success (+48.5) and produces higher quality collaboration (+30.6), while
    using fewer costs (+34.0) than baselines.
