  abstract: While MPEG-standardized video-based point cloud compression (VPCC) achieves high compression
    efficiency for human perception, it struggles with a poor trade-off between bitrate savings and detection
    accuracy when supporting 3D object detectors. This limitation stems from VPCC's inability to prioritize
    regions of different importance within point clouds. To address this issue, we propose DetVPCC, a
    novel method integrating region-of-interest (RoI) encoding with VPCC for efficient point cloud sequence
    compression while preserving the 3D object detection accuracy. Specifically, we augment VPCC to support
    RoI-based compression by assigning spatially non-uniform quality levels. Then, we introduce a lightweight
    RoI detector to identify crucial regions that potentially contain objects. Experiments on the nuScenes
    dataset demonstrate that our approach significantly improves the detection accuracy. The code and
    demo video are available in supplementary materials.
