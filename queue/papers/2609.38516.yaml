  title: 'From Solo to Social Learning: Characterizing Recursive Social Improvement in LLMs'
  authors:
  - Kunal Jha
  - Max Kleiman-Weiner
  - Natasha Jaques
  published: '2026-09-29'
  updated: '2026-10-01'
  categories:
  - cs.MA
