  abstract: 'Language model agents reason from scratch on every query, discarding their chain of thought
    after each run. The result is lower accuracy and high run-to-run variance. We introduce reasoning
    graphs, which persist the per-evidence chain of thought as structured edges. Unlike prior memory that
    retrieves distilled strategies by query similarity, reasoning graphs enable evidence-centric feedback:
    for every candidate item, the system traverses all incoming evaluation edges across prior runs to
    surface how that specific item has been judged before. We further introduce retrieval graphs, which
    feed a planner that prunes consistently-rejected candidates over successive runs. Together they form
    a ROZA graph: a self-improving feedback loop in which accuracy gains scale with gold-passage reuse
    (reasoning graph) and efficiency gains scale with candidate-pool overlap (retrieval graph). The base
    model remains frozen; all gains come from context engineering via graph traversal. We evaluate on
    MuSiQue and HotpotQA, plus a high-reuse deployment subset. Four findings stand out. (1) Dose-response:
    accuracy improves monotonically with evidence-profile coverage, reaching +10.6pp over Vanilla RAG
    at 50%+ coverage on the same questions (47% error reduction, $p<0.0001$; per-question Spearman $ρ=+0.144$,
    $p<10^{-6}$, $n=1{,}100$). (2) Multi-hop scaling: 4-hop accuracy improves by +11.0pp ($p=0.0001$).
    (3) Cross-cluster prediction: the cluster-level gain is predicted by gold-passage reuse density ($r=0.604$,
    $p=0.001$, $n=26$ clusters). (4) High-reuse Pareto dominance: highest or tied-for-highest accuracy
    alongside 46% lower cost and 46% lower latency. Per-passage decision consistency across repeated runs
    ($N=73$ paired probes, $K=10$ runs each, two model families, three temperatures) rises by +8 to +13pp
    on a fixed 20-passage context and by +12 to +21pp when the retrieval graph also prunes (all $p<0.005$).'
