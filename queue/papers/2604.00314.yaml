  abstract: The rapid progress of large Vision-Language Models (VLMs) has enabled a wide range of applications,
    such as image understanding and Visual Question Answering (VQA). Query images are often uploaded to
    the cloud, where VLMs are typically hosted, hence efficient image compression becomes crucial. However,
    traditional human-centric codecs are suboptimal in this setting because they preserve many task-irrelevant
    details. Existing Image Coding for Machines (ICM) methods also fall short, as they assume a fixed
    set of downstream tasks and cannot adapt to prompt-driven VLMs with an open-ended variety of objectives.
    We propose a lightweight, plug-and-play, prompt-guided prefiltering module to identify image regions
    most relevant to the text prompt, and consequently to the downstream task. The module preserves important
    details while smoothing out less relevant areas to improve compression efficiency. It is codec-agnostic
    and can be applied before conventional and learned encoders. Experiments on several VQA benchmarks
    show that our approach achieves a 25-50% average bitrate reduction while maintaining the same task
    accuracy. Our source code is available at https://github.com/bardia-az/pgp-vlm-compression.
