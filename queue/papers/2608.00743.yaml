  abstract: Multimodal large language models have advanced visual understanding, yet perception-intensive
    reasoning remains challenging. Recent latent visual reasoning methods introduce hidden-space computation
    before answering, but they often rely on costly intermediate supervision, such as bounding boxes,
    sketches, or interleaved rationales. These strategies focus on how latent states should be shaped,
    but do not explicitly assess whether the latent is useful for the final answer. We propose LUT, a
    latent reasoning framework trained with only standard VQA pairs. LUT centers training on Latent Utility
    at two levels. At the trajectory level, we propose Utility-Aware Latent Distillation SFT, which explores
    answer-relevant latent trajectories, selects qualified trajectories by their information gain, and
    distills more reliable and learnable supervision through curriculum learning. At the step level, we
    propose Latent Attribution Policy Optimization, which uses answer-to-latent attribution to differentially
    optimize latent steps during reinforcement learning. Experiments on perception-intensive visual reasoning
    benchmarks show that LUT outperforms previous latent reasoning methods and remains competitive with
    latent-text interleaved methods with lower annotation cost.
