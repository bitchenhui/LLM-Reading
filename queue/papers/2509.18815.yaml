  abstract: High-performance learned image compression codecs require flexible probability models to fit
    latent representations. Gaussian Mixture Models (GMMs) were proposed to satisfy this demand, but suffer
    from a significant runtime performance bottleneck due to the large Cumulative Distribution Function
    (CDF) tables that must be built for rANS coding. This paper introduces a fast coding algorithm that
    entirely eliminates this bottleneck. By leveraging the CDF's monotonic property, our decoder performs
    a dynamic binary search to find the correct symbol, eliminating the need for costly table construction
    and lookup. Aided by SIMD optimizations and numerical approximations, our approach accelerates the
    GMM entropy coding process by up to approximately 90x without compromising rate-distortion performance,
    significantly improving the practicality of GMM-based codecs. The implementation will be made publicly
    available at https://github.com/tokkiwa/FlashGMM.
