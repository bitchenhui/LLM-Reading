  title: 'Colon-Bench: An Agentic Workflow for Scalable Dense Lesion Annotation in Full-Procedure Colonoscopy
    Videos'
  authors:
  - Abdullah Hamdi
  - Changchun Yang
  - Xin Gao
  published: '2026-03-26'
