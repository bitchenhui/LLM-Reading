  abstract: Video coding standards are essential to enable the interoperability and widespread adoption
    of efficient video compression technologies. In pursuit of greater video compression efficiency, the
    AVS video coding working group launched the standardization exploration of end-to-end intelligent
    video coding, establishing the AVS End-to-End Intelligent Video Coding Exploration Model (AVS-EEM)
    project. A core design principle of AVS-EEM is its focus on practical deployment, featuring inherently
    low computational complexity and requiring strict adherence to the common test conditions of conventional
    video coding. This paper details the development history of AVS-EEM and provides a systematic introduction
    to its key technical framework, covering model architectures, training strategies, and inference optimizations.
    These innovations have collectively driven the project's rapid performance evolution, enabling continuous
    and significant gains under strict complexity constraints. Through over two years of iterative refinement
    and collaborative effort, the coding performance of AVS-EEM has seen substantial improvement. Experimental
    results demonstrate that its latest model achieves superior compression efficiency compared to the
    conventional AVS3 reference software, marking a significant step toward a deployable intelligent video
    coding standard.
