  abstract: We present a generative optimization approach for learning game-playing agents, where policies
    are represented as Python programs and refined using large language models (LLMs). Our method treats
    decision-making policies as self-evolving code, with current observation as input and an in-game action
    as output, enabling agents to self-improve through execution traces and natural language feedback
    with minimal human intervention. Applied to Atari games, our game-playing Python program achieves
    performance competitive with deep reinforcement learning (RL) baselines while using significantly
    less training time and much fewer environment interactions. This work highlights the promise of programmatic
    policy representations for building efficient, adaptable agents capable of complex, long-horizon reasoning.
