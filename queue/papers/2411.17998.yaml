  title: Speech Separation using Neural Audio Codecs with Embedding Loss
  authors:
  - Jia Qi Yip
  - Chin Yuen Kwok
  - Bin Ma
  - Eng Siong Chng
  published: '2024-11-27'
  updated: '2024-11-27'
