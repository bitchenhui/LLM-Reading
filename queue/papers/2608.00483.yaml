  title: 'Streamable Neural Video Compression: A Mixed Precision Approach for Cross-Platform Deployment'
  authors:
  - Kasidis Arunruangsirilert
  - Heming Sun
  - Jiro Katto
  published: '2026-08-01'
  updated: '2026-08-01'
