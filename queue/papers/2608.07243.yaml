  abstract: 'Generative models are often evaluated through singular artifacts, whereas human creativity
    typically emerges through iterative generation, appraisal, and refinement. This pilot study examines
    whether iterative search improves LLM creativity by adapting FunSearch to recipe generation for the
    2024 Pillsbury Bake-Off and evaluating outputs against human benchmarks using TTCT-based LLM evaluation.
    Across two experiments, we test iteration count, generator temperature, and in-loop selection-scorer
    model size. Results show that iterative generation-selection can produce recipes with creativity scores
    comparable to human benchmarks, but additional iterations alone do not improve creativity. The in-loop
    evaluator matters most: a smaller selection scorer yields significantly higher scores across most
    TTCT dimensions, while temperature has limited effects except for originality. These findings suggest
    that evaluator design is a first-order design variable in subjective creative search.'
