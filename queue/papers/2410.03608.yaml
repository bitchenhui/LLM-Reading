  title: 'TICKing All the Boxes: Generated Checklists Improve LLM Evaluation and Generation'
  authors:
  - Jonathan Cook
  - Tim Rocktäschel
  - Jakob Foerster
  - Dennis Aumiller
  - Alex Wang
  published: '2024-10-04'
