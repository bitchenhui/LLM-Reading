  title: '$\mathtt{M^3VIR}$: A Large-Scale Multi-Modality Multi-View Synthesized Benchmark Dataset for
    Image Restoration and Content Creation'
  authors:
  - Yuanzhi Li
  - Lebin Zhou
  - Nam Ling
  - Zhenghao Chen
  - Wei Wang
  - Wei Jiang
  published: '2025-09-21'
  updated: '2025-10-30'
  categories:
  - cs.CV
  abstract: The gaming and entertainment industry is rapidly evolving, driven by immersive experiences
    and the integration of generative AI (GAI) technologies. Training such models effectively requires
    large-scale datasets that capture the diversity and context of gaming environments. However, existing
    datasets are often limited to specific domains or rely on artificial degradations, which do not accurately
    capture the unique characteristics of gaming content. Moreover, benchmarks for controllable video
    generation remain absent. To address these limitations, we introduce $\mathtt{M^3VIR}$, a large-scale,
    multi-modal, multi-view dataset specifically designed to overcome the shortcomings of current resources.
    Unlike existing datasets, $\mathtt{M^3VIR}$ provides diverse, high-fidelity gaming content rendered
    with Unreal Engine 5, offering authentic ground-truth LR-HR paired and multi-view frames across 80
    scenes in 8 categories. It includes $\mathtt{M^3VIR\_MR}$ for super-resolution (SR), novel view synthesis
    (NVS), and combined NVS+SR tasks, and $\mathtt{M^3VIR\_{MS}}$, the first multi-style, object-level
    ground-truth set enabling research on controlled video generation. Additionally, we benchmark several
    state-of-the-art SR and NVS methods to establish performance baselines. While no existing approaches
    directly handle controlled video generation, $\mathtt{M^3VIR}$ provides a benchmark for advancing
    this area. By releasing the dataset, we aim to facilitate research in AI-powered restoration, compression,
    and controllable content generation for next-generation cloud gaming and entertainment.
