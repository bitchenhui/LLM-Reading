  title: 'INT-DTT+: Low-Complexity Data-Dependent Transforms for Video Coding'
  authors:
  - Samuel Fernández-Menduiña
  - Eduardo Pavez
  - Antonio Ortega
  - Tsung-Wei Huang
  - Thuong Nguyen Canh
  - Guan-Ming Su
  - Peng Yin
  published: '2025-11-22'
  updated: '2025-11-22'
