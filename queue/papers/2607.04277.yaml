  title: 'Self-Reference in Large Language Models: The Introspection Threshold for Recursive Self-Improvement'
  authors:
  - Jiang Zhang
  - Bing Yuan
  - Qian Zhang
  published: '2026-07-05'
  updated: '2026-09-18'
  categories:
  - physics.soc-ph
  - cs.AI
  abstract: 'The pursuit of self-evolving AI raises a critical question: when is autonomous self-improvement
    sustainable rather than degenerative? Drawing an analogy to von Neumann''s complexity threshold for
    self-reproducing automata, we argue that sustainable recursive self-improvement in Large Language
    Models (LLMs) requires a functional analogue: introspection -- the system''s capacity to simulate
    its own operations and target modifications. Grounded in Kleene''s Second Recursion Theorem, we demonstrate
    the theoretical existence of such introspective programs. However, an empirical review reveals that
    while current LLMs exhibit quasi-introspection (e.g., partial metacognition), they fall short of true
    introspection due to structural bottlenecks: a lack of complete self-access, the feedforward nature
    of the Transformer, and computational class constraints that prevent fixed-point iteration. We conclude
    by outlining architectural paths to cross this complexity threshold and discussing the associated
    safety implications.'
