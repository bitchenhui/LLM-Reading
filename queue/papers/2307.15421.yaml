  title: 'MLIC++: Linear Complexity Multi-Reference Entropy Modeling for Learned Image Compression'
  authors:
  - Wei Jiang
  - Jiayu Yang
  - Yongqi Zhai
  - Feng Gao
  - Ronggang Wang
  published: '2023-07-28'
  updated: '2025-02-17'
  categories:
  - eess.IV
