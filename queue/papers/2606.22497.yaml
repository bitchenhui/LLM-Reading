  abstract: Microscopic imaging provides essential visual evidence for studying plant biology and pathology
    at the cellular and subcellular levels. However, existing benchmarks on vision-language models primarily
    focus on macroscopic plant imagery, while the microscopic domain remains underexplored. To address
    this gap, we present PlantMicro, a comprehensive benchmark for evaluating vision-language models (VLMs)
    in microscopic plant imagery. PlantMicro integrates more than 5,000 images collected across diverse
    hosts, biological domains, and imaging modalities. Building on this diversity, we design a set of
    complementary tasks that capture different facets of microscopic image understanding. To support these
    tasks, we construct over 9,000 VQA pairs that systematically evaluate the capabilities of VLMs. Experiments
    on PlantMicro show that current VLMs struggle with fine-grained recognition and biologically grounded
    reasoning. For example, GPT-5 achieves 34.93% accuracy on the pathogen classification task, which
    is only modestly above the random-guessing baseline. The results highlight a significant gap in current
    VLMs' ability to comprehend plant microscopic images. PlantMicro provides a standardized foundation
    for advancing VLMs toward reliable and comprehensive microscopy-level plant understanding.
