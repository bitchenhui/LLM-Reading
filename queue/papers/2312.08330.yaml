  title: 'Preparing VVC for Streaming: A Fast Multi-Rate Encoding Approach'
  authors:
  - Yiqun Liu
  - Hadi Amirpour
  - Mohsen Abdoli
  - Christian Timmerer
  - Thomas Guionnet
