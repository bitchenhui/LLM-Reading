  title: 'ReGenesis: LLMs can Grow into Reasoning Generalists via Self-Improvement'
  authors:
  - Xiangyu Peng
  - Congying Xia
  - Xinyi Yang
  - Caiming Xiong
  - Chien-Sheng Wu
  - Chen Xing
  published: '2024-10-03'
  updated: '2025-04-16'
