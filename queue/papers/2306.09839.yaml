  title: Super-Resolution Radar Imaging with Sparse Arrays Using a Deep Neural Network Trained with Enhanced
    Virtual Data
  authors:
  - Christian Schuessler
  - Marcel Hoffmann
  - Martin Vossiek
  published: '2023-06-16'
  updated: '2023-06-16'
