  title: 'HiddenSinger: High-Quality Singing Voice Synthesis via Neural Audio Codec and Latent Diffusion
    Models'
  authors:
  - Ji-Sang Hwang
  - Sang-Hoon Lee
  - Seong-Whan Lee
  published: '2023-06-12'
  updated: '2023-06-12'
  categories:
