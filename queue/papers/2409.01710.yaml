  title: Privacy-Preserving Multimedia Mobile Cloud Computing Using Protective Perturbation
  authors:
  - Zhongze Tang
  - Mengmei Ye
  - Yao Liu
  - Sheng Wei
  published: '2024-09-03'
  updated: '2024-09-03'
