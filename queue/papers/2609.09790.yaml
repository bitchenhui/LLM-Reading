  title: 'LogiScope-VQA: Benchmarking Vision-Language Models for Logistics Hazard Identification in Industrial
    Scenarios'
  authors:
  - Hanjing Zhou
  - Mingze Yin
  - Ying Lian
  - Jun Ma
