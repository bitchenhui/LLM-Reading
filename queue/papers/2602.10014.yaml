  title: A Task-Centric Theory for Iterative Self-Improvement with Easy-to-Hard Curricula
  authors:
  - Chenruo Liu
  - Yijun Dong
  - Yiqiu Shen
  - Qi Lei
  published: '2026-02-10'
  updated: '2026-05-31'
  categories:
  - cs.LG
