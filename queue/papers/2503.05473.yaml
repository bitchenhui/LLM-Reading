  title: 'The Society of HiveMind: Multi-Agent Optimization of Foundation Model Swarms to Unlock the Potential
    of Collective Intelligence'
  authors:
  - Noah Mamie
  - Susie Xi Rao
  published: '2025-03-07'
  updated: '2025-03-13'
