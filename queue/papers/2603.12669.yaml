  title: Vision Verification Enhanced Fusion of VLMs for Efficient Visual Reasoning
  authors:
  - Selim Furkan Tekin
  - Yichang Xu
  - Gaowen Liu
  - Ramana Rao Kompella
  - Margaret L. Loper
  - Ling Liu
  published: '2026-03-13'
  updated: '2026-03-13'
  categories:
  - cs.CV
  - cs.LG
  abstract: With the growing number and diversity of Vision-Language Models (VLMs), many works explore
    language-based ensemble, collaboration, and routing techniques across multiple VLMs to improve multi-model
    reasoning. In contrast, we address the diverse model selection using both vision and language modalities.
    We introduce focal error diversity to capture complementary reasoning across VLMs and a CKA-based
    focal diversity metric (CKA-focal) to measure disagreement in their visual embeddings. On the constructed
    ensemble surface from a pool of candidate VLMs, we applied a Genetic Algorithm to effectively prune
    out those component VLMs that do not add value to the fusion performance. We identify the best combination
    for each task as well as fuse the outputs of each VLMs in the model pool, and show that heterogeneous
    models can capture epistemic uncertainty dynamically and mitigate hallucinations. Our V3Fusion approach
    is capable of producing dual focal-diversity fused predictions with high performance for vision-language
    reasoning, even when there is no majority consensus or the majority of VLMs make incorrect predictions.
    Extensive experiments validate V3Fusion on four popular VLM benchmarks (A-OKVQA, MMMU, MMMU-Pro, and
    OCR-VQA). The results show that V3Fusion outperforms the best-performing VLM on MMMU by 8.09% and
    MMMU-Pro by 4.87% gain in accuracy. For generative tasks, V3Fusion outperforms Intern-VL2-8b and Qwen2.5-VL-7b,
    the top-2 VLM performers on both A-OKVQA and OCR-VQA. Our code and datasets are available at https://github.com/sftekin/v3fusion.
