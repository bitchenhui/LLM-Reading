  title: Synthesized Annotation Guidelines are Knowledge-Lite Boosters for Clinical Information Extraction
  authors:
  - Enshuo Hsu
  - Martin Ugbala
  - Krishna Kumar Kookal
  - Zouaidi Kawtar
  - Nicholas L. Rider
  - Muhammad F. Walji
  - Kirk Roberts
