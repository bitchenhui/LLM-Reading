  - eess.AS
  abstract: Most neural speech codecs use residual vector quantization (RVQ), in which later VQs contribute
    less but consume the same bitrate, leading to inefficiency. We propose P2PSynCodec, an ultra-low-bitrate
    neural speech codec with a plain-to-pseudo synergistic vector quantizer (P2PSVQ). P2PSVQ consists
    of one plain VQ and multiple pseudo VQs. The plain VQ produces basic tokens by quantization, while
    the pseudo VQs generate auxiliary tokens by neural prediction and incur zero transmitted bitrate.
    Thus, speech is decoded from the plain-VQ tokens together with predicted pseudo-VQ tokens, greatly
    reducing bitrate. Experiments show that P2PSynCodec achieves speech reconstruction quality comparable
    to competing codecs at 2.0 kbps while operating at only 0.5 kbps, demonstrating high efficiency for
    ultra-low-bitrate speech coding.
