  title: Contamination, Prior, or Evidence? Decomposing and Training Evidence Use in Whole-Slide Vision-Language
    Models
  authors:
  - Wenhao Zhang
  - Zhongliang Zhou
  - Shiyuan Zhang
  - Yiqing Yang
  - Pinqiao Wang
  - Lehan Yang
