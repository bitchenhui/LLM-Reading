  title: 'Representing Sounds as Neural Amplitude Fields: A Benchmark of Coordinate-MLPs and A Fourier
    Kolmogorov-Arnold Framework'
  authors:
  - Linfei Li
  - Lin Zhang
  - Zhong Wang
  - Fengyi Zhang
  - Zelin Li
  - Ying Shen
  published: '2026-01-10'
  updated: '2026-01-10'
  categories:
  - cs.SD
  abstract: 'Although Coordinate-MLP-based implicit neural representations have excelled in representing
    radiance fields, 3D shapes, and images, their application to audio signals remains underexplored.
    To fill this gap, we investigate existing implicit neural representations, from which we extract 3
    types of positional encoding and 16 commonly used activation functions. Through combinatorial design,
    we establish the first benchmark for Coordinate-MLPs in audio signal representations. Our benchmark
    reveals that Coordinate-MLPs require complex hyperparameter tuning and frequency-dependent initialization,
    limiting their robustness. To address these issues, we propose Fourier-ASR, a novel framework based
    on the Fourier series theorem and the Kolmogorov-Arnold representation theorem. Fourier-ASR introduces
    Fourier Kolmogorov-Arnold Networks (Fourier-KAN), which leverage periodicity and strong nonlinearity
    to represent audio signals, eliminating the need for additional positional encoding. Furthermore,
    a Frequency-adaptive Learning Strategy (FaLS) is proposed to enhance the convergence of Fourier-KAN
    by capturing high-frequency components and preventing overfitting of low-frequency signals. Extensive
    experiments conducted on natural speech and music datasets reveal that: (1) well-designed positional
    encoding and activation functions in Coordinate-MLPs can effectively improve audio representation
    quality; and (2) Fourier-ASR can robustly represent complex audio signals without extensive hyperparameter
    tuning. Looking ahead, the continuity and infinite resolution of implicit audio representations make
    our research highly promising for tasks such as audio compression, synthesis, and generation. The
    source code will be released publicly to ensure reproducibility. The code is available at https://github.com/lif314/Fourier-ASR.'
