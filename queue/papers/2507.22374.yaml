  title: End-to-end image compression and reconstruction with ultrahigh speed and ultralow energy enabled
    by opto-electronic computing processor
  authors:
  - Yuhang Wang
  - Ang Li
  - Yihang Shao
  - Qiang Li
  - Yang Zhao
  - Shilong Pan
  published: '2025-07-30'
  updated: '2025-07-30'
