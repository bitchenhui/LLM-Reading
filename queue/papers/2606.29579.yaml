  title: 'ScAle: Attention Head Scaling as a Minimal Adapter for Spatial Reasoning in Vision Language
    Models'
  authors:
  - Rahul Chowdhury
  - Timothy A Rupprecht
  - Xuan Shen
  - Pu Zhao
  - Yanzhi Wang
  published: '2026-06-28'
  updated: '2026-06-28'
