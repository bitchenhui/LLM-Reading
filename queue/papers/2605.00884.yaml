  title: 'LiteVLA-H: Dual-Rate Vision-Language-Action Inference for Onboard Aerial Guidance and Semantic
    Perception'
  authors:
  - Justin williams
  - Kishor Datta Gupta
  - Roy George
  - Mrinmoy Sarkar
  published: '2026-04-27'
  updated: '2026-05-09'
