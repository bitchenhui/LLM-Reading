  title: Efficient Video Compression via Content-Adaptive Super-Resolution
  authors:
  - Mehrdad Khani
  - Vibhaalakshmi Sivaraman
  - Mohammad Alizadeh
  published: '2021-04-06'
  updated: '2021-04-06'
