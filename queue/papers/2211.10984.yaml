  title: 'DAQE: Enhancing the Quality of Compressed Images by Exploiting the Inherent Characteristic of
    Defocus'
  authors:
  - Qunliang Xing
  - Mai Xu
  - Xin Deng
  - Yichen Guo
  published: '2022-11-20'
  updated: '2023-03-13'
  categories:
  - eess.IV
