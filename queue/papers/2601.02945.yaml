  abstract: 'With the rapid development of e-commerce and digital fashion, image-based virtual try-on
    (VTON) has attracted increasing attention. However, existing VTON models often suffer from artifacts
    such as garment distortion and body inconsistency, highlighting the need for reliable quality evaluation
    of VTON-generated images. To this end, we construct \textbf{VTONQA}, the first multi-dimensional quality
    assessment dataset specifically designed for VTON, which contains 8,132 images generated by 11 representative
    VTON models, along with 24,396 mean opinion scores (MOSs) across three evaluation dimensions (\textit{i.e.},
    clothing fit, body compatibility, and overall quality). Based on VTONQA, we benchmark both VTON models
    and a diverse set of image quality assessment (IQA) metrics, revealing the limitations of existing
    methods and highlighting the value of the proposed dataset. We believe that the VTONQA dataset and
    corresponding benchmarks will provide a solid foundation for perceptually aligned evaluation, benefiting
    both the development of quality assessment methods and the advancement of VTON models. The dataset
    we proposed in this paper is publicly available at: https://huggingface.co/datasets/weixiny0408/vtonqa.'
