  title: Fast, faithful and photorealistic diffusion-based image super-resolution with enhanced Flow Map
    models
  authors:
  - Maxence Noble
  - Gonzalo Iñaki Quintana
  - Benjamin Aubin
  - Clément Chadebec
  published: '2026-01-23'
  updated: '2026-01-23'
