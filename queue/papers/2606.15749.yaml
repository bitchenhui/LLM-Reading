  abstract: Traffic scene understanding requires models to reason beyond object recognition, including
    lane topology, multi-view geometry, temporal evolution, and signal-phase semantics. However, existing
    traffic-oriented multimodal benchmarks largely emphasize passive visual recognition or isolated video
    understanding, offering limited support for evaluating structure-aware traffic reasoning under controlled
    conditions. We introduce OmniTraffic, a controllable generation pipeline and benchmark for spatio-temporal
    traffic reasoning. Built around 12 real-world intersections reconstructed into editable 3D traffic
    environments and complemented by surveillance footage from two countries, OmniTraffic supports both
    controlled and natural-condition evaluation. It defines a three-level task hierarchy spanning scene
    perception, multi-view and temporal reasoning, and decision support. Using structured traffic metadata,
    OmniTraffic generates synchronized multi-view VQA samples covering vehicle states, lane functions,
    view--BEV correspondence, temporal dynamics, and signal-phase analysis, resulting in 8M VQA samples
    and a 3K human-verified test set. Evaluation of eleven frontier MLLMs reveals a large human--model
    gap, with the most pronounced failures in topology-grounded and spatio-temporal reasoning tasks. Fine-tuning
    a lightweight MLLM on simulated OmniTraffic data further improves performance on real-world traffic
    scenes, demonstrating the value of simulation-generated supervision for traffic-specific multimodal
    reasoning. Beyond a fixed dataset, OmniTraffic provides an extensible pipeline with configurable intersections,
    camera views, traffic demands, signal phases, visual conditions, and rare events.
