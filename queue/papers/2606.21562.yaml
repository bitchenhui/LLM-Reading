  title: 'Compressing History into Memory: Distilling Transformers into Recurrent Transformers'
  authors:
  - Philippe Weinzaepfel
  - Christian Wolf
  - Mert Bülent Sariyildiz
  - Guillaume Bono
  - Gianluca Monaci
  published: '2026-06-19'
  updated: '2026-10-01'
