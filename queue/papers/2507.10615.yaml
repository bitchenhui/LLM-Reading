  abstract: The exponential growth of medical imaging has created significant challenges in data storage,
    transmission, and management for healthcare systems. In this vein, efficient compression becomes increasingly
    important. Unlike natural image compression, medical image compression prioritizes preserving diagnostic
    details and structural integrity, imposing stricter quality requirements and demanding fast, memory-efficient
    algorithms that balance computational complexity with clinically acceptable reconstruction quality.
    Meanwhile, the medical imaging family includes a plethora of modalities, each possessing different
    requirements. For example, 2D medical image (e.g., X-rays, histopathological images) compression focuses
    on exploiting intra-slice spatial redundancy, while volumetric medical image faces require handling
    intra-slice and inter-slice spatial correlations, and 4D dynamic imaging (e.g., time-series CT/MRI,
    4D ultrasound) additionally demands processing temporal correlations between consecutive time frames.
    Traditional compression methods, grounded in mathematical transforms and information theory principles,
    provide solid theoretical foundations, predictable performance, and high standardization levels, with
    extensive validation in clinical environments. In contrast, deep learning-based approaches demonstrate
    remarkable adaptive learning capabilities and can capture complex statistical characteristics and
    semantic information within medical images. This comprehensive survey establishes a two-facet taxonomy
    based on data structure (2D vs 3D/4D) and technical approaches (traditional vs learning-based), thereby
    systematically presenting the complete technological evolution, analyzing the unique technical challenges,
    and prospecting future directions in medical image compression.
