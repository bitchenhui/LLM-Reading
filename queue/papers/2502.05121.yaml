  abstract: Integration-by-parts reductions of Feynman integrals pose a frequent bottle-neck in state-of-the-art
    calculations in theoretical particle and gravitational-wave physics, and rely on heuristic approaches
    for selecting integration-by-parts identities, whose quality heavily influences the performance. In
    this paper, we investigate the use of machine-learning techniques to find improved heuristics. We
    use funsearch, a genetic programming variant based on code generation by a Large Language Model, in
    order to explore possible approaches, then use strongly typed genetic programming to zero in on useful
    solutions. Both approaches manage to re-discover the state-of-the-art heuristics recently incorporated
    into integration-by-parts solvers, and in one example find a small advance on this state of the art.
