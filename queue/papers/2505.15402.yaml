  abstract: Recent advances in discrete audio codecs have significantly improved speech representation
    modeling, while codec language models have enabled in-context learning for zero-shot speech synthesis.
    Inspired by this, we propose a voice conversion (VC) model within the VALLE-X framework, leveraging
    its strong in-context learning capabilities for speaker adaptation. To enhance prosody control, we
    introduce a prosody-aware audio codec encoder (PACE) module, which isolates and refines prosody from
    other sources, improving expressiveness and control. By integrating PACE into our VC model, we achieve
    greater flexibility in prosody manipulation while preserving speaker timbre. Experimental evaluation
    results demonstrate that our approach outperforms baseline VC systems in prosody preservation, timbre
    consistency, and overall naturalness, surpassing baseline VC systems.
