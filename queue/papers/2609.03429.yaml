  title: When Do Frozen VLMs Respond to Image-Free Object-Token Edits? An Answer-Key-Free Protocol and
    What It Reveals
  authors:
  - Wonbin Son
  - Gyumun Choi
  - Junil Seo
  - Seungmin Rho
  - Mi Young Lee
  - Hyungjoon Kim
  published: '2026-09-03'
  updated: '2026-09-03'
  categories:
  - cs.CV
  abstract: 'Answering what-if queries about a scene with a VLM usually means injecting the assumption
    as text or repainting the scene with a generative model. We instead move the edit to the representation
    level, before the model input. The image is abstracted into a set of object-level tokens, and the
    original image never enters the VLM. This design rests on an open question: when do frozen VLMs actually
    respond to such token edits? We introduce an answer-key-free protocol: no post-edit answer is annotated.
    It scores edits whose answers are logically determined, and audits itself by reversing each scoreable
    choice. The protocol reveals three structures. The response is not free: explicit edit teaching, not
    ordinary VQA training, produces it in dense scenes and multiplies it in sparse ones, on all three
    operations. Once on, it is governed by token cleanliness and density, with deployable detector+segmenter
    tokens competitive with the oracle and outperforming it on VRSBench. And reading is a separable axis:
    the image-free token route preserves 92-96% of a matched patch-token baseline''s free-text VQA, and
    the answers measurably depend on the tokens. The response, cleanliness, and reading structures are
    sign-preserved across two remote-sensing datasets (iSAID, VRSBench) and three frozen LM backbones.
    We release the probe generator, records, judge logs, and code.'
