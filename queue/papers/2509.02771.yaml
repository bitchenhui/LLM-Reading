  title: Analysis of Speaker Verification Performance Trade-offs with Neural Audio Codec Transmission
  authors:
  - Nirmalya Mallick Thakur
  - Jia Qi Yip
  - Eng Siong Chng
  published: '2025-09-02'
  updated: '2025-09-02'
