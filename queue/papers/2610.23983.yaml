  abstract: Although reinforcement learning (RL) effectively trains Vision-Language Model (VLM) agents,
    the mechanisms behind these capability gains are poorly understood. Across four diverse agent environments,
    we investigate whether the task-success gains from multi-turn RL are accompanied by improved grounded
    visual question answering about the environment. To assess this, we design environment-specific grounded
    VQA tasks that reveal improvements in grounded visual understanding. Representational probing shows
    that vision-encoder probe accuracy remains relatively stable, while LLM-layer probe accuracy improves.
    Attention analysis further reveals that LLM layers pay more attention to visual tokens during RL training.
    To test whether increased attention to visual tokens contributes to VQA gains, we introduce a lightweight
    plug-and-play intervention using a fixed attention bias. Without updating model parameters or computing
    gradients, this intervention partially restores VQA gains on the untrained model. These results reveal
    better utilization of visual information as a key mechanism behind the gains from RL.
