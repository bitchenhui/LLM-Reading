  title: Automated Report-Derived Oncology VQA Benchmark for Evaluating Vision-Language Models on 3D Medical
    Imaging
  authors:
  - Bo Liu
  - Hanxue Gu
  - Xiangru Li
  - Zheren Zhu
  - Jacob Ellison
  - Kang Wang
  - Janine M. Lupo
  - Yang Yang
  - Hui Lin
  published: '2026-06-01'
  updated: '2026-06-01'
  categories:
  - cs.CV
  abstract: 'Evaluating vision-language models (VLMs) on medical images requires benchmarks that are clinically
    grounded, scalable, and controlled for evaluation confounds. Existing public benchmarks are limited
    in scale, manually annotated, or potentially leaked into VLM pretraining corpora. We present an automated
    agent-driven pipeline that generates multiple-choice VQA datasets directly from paired private radiology
    reports and 3D oncology imaging, producing two complementary question types: RADS-style questions
    deterministically derived from clinician-defined reporting schemas, and radiology report-derived questions
    generated by an LLM from radiologist findings and verified against the source report. Applied to four
    in-house cancer cohorts, the pipeline yields an instance-contamination-controlled benchmark without
    per-question human annotation. Zero-shot evaluation of six VLMs reveals no dominant model and substantial
    headroom across all cells. A blind ablation reveals that visual reliance is highly dataset-specific:
    liver Report-derived questions genuinely require the image, while Lung CT is essentially solvable
    without it - the leading closed model exceeds its sighted accuracy on Lung CT when blinded - indicating
    that even private clinical data does not guarantee a contamination-controlled read of visual capability.
    The pipeline is released as an open agent skill for in-house redeployment.'
