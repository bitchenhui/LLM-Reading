  title: 'Mixture-Net: Low-Rank Deep Image Prior Inspired by Mixture Models for Spectral Image Recovery'
  authors:
  - Tatiana Gelvez-Barrera
  - Jorge Bacca
  - Henry Arguello
  published: '2022-11-05'
