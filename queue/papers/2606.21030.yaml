  abstract: 'Diffusion-based image compression has achieved strong perceptual quality at ultra-low bitrates.
    However, existing codecs are often tied to specific backbones and specialized components, making diverse,
    rapidly evolving generative models difficult to reuse. This raises a natural question: Can modern
    generative foundation models be connected to image compression through a simple and extensible interface?
    Two insights guide our design: stronger generative priors make a simpler codec interface viable, and
    generation and compression can be intrinsically linked through latent transport. We therefore propose
    Gen2-IC with two stages: (1) Latent Compression maps clean image latents to entropy-constrained latents;
    and (2) Latent Transport refines them with one near-terminal update based on the pretrained model.
    Gen2-IC requires neither auxiliary conditioning signals nor task-specific backbone modifications.
    With lightweight adaptation and no distillation, it supports fast encoding and one-step decoding across
    multiple bitrates. We validate Gen2-IC on SD-2.1, SANA-1.5, FLUX.1-dev, and Qwen-Image-2512, spanning
    U-Net and Transformer architectures as well as diffusion and flow-matching formulations. With stronger
    priors, Gen2-IC delivers gains below 0.05 bpp: the Qwen variant leads diffusion-based generative codecs
    in reconstruction fidelity (PSNR), perceptual similarity (LPIPS and DISTS), and recognizer-based semantic
    fidelity (OCR CER/WER and face-ROI similarity) across four benchmarks.'
