  title: 'Explicit-NeRF-QA: A Quality Assessment Database for Explicit NeRF Model Compression'
  authors:
  - Yuke Xing
  - Qi Yang
  - Kaifa Yang
  - Yilin Xu
  - Zhu Li
  published: '2024-07-11'
  updated: '2024-09-20'
