  title: Blind Quality Enhancement for G-PCC Compressed Dynamic Point Clouds
  authors:
  - Tian Guo
  - Hui Yuan
  - Chang Sun
  - Wei Zhang
  - Raouf Hamzaoui
  - Sam Kwong
  published: '2026-03-25'
  updated: '2026-03-25'
