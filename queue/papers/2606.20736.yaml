  abstract: 'Static visual question answering (VQA) benchmarks age quickly: Once the items leak into training
    corpora, scores can reflect memorization rather than genuine visual ability, thus obscuring real progress.
    Rebuilding high-quality benchmarks such as V*Bench requires substantial human annotation, yet each
    static release can quickly become another leaked artifact. We propose ReKey, a live benchmark protocol
    that randomly regenerates the answer-bearing local detail, or visual key, in real images at evaluation
    time. Using human-validated edit slots, ReKey samples fresh instances with new answers, construction-grounded
    labels, and controlled visual-search difficulty. On V*Bench, the ReKey regenerated benchmark reveals
    a sharp score jump across eight frontier vision-language models (VLMs): The original items score 9.5--18.8
    percentage points higher than the regenerated variants. By making the visual key renewable, ReKey
    keeps evaluation fresh as models and training data evolve.'
