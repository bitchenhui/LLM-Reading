  title: Boosting Knowledge-based Visual Question Answering with Structured Context Reasoning
  authors:
  - Qiyou Liu
  - Yong Zhang
  - Jianjie Luo
  - Zhenguo Yang
  - Yi Yu
  published: '2026-08-17'
  updated: '2026-08-17'
  categories:
  - cs.CV
