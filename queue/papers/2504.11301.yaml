  abstract: Large Language Model (LLM)-based agents have demonstrated strong capabilities across a wide
    range of tasks, and their application in the medical domain holds particular promise due to the demand
    for high generalizability and reliance on interdisciplinary knowledge. However, existing medical agent
    systems often rely on static, manually crafted workflows that lack the flexibility to accommodate
    diverse diagnostic requirements and adapt to emerging clinical scenarios. Motivated by the success
    of automated machine learning (AutoML), this paper introduces a novel framework for the automated
    design of medical agent architectures. Specifically, we define a hierarchical and expressive agent
    search space that enables dynamic workflow adaptation through structured modifications at the node,
    structural, and framework levels. Our framework conceptualizes medical agents as graph-based architectures
    composed of diverse, functional node types and supports iterative self-improvement guided by diagnostic
    feedback. Experimental results on skin disease diagnosis tasks demonstrate that the proposed method
    effectively evolves workflow structures and significantly enhances diagnostic accuracy over time.
    This work represents the first fully automated framework for medical agent architecture design and
    offers a scalable, adaptable foundation for deploying intelligent agents in real-world clinical environments.
