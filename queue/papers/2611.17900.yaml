  title: 'AmbiSteer: Selectively Eliciting Ambiguity-Aware Responses in Vision-Language Models'
  authors:
  - Monica Riedler
  - Samuele Antonelli
  - Barbara Plank
  - Raffaella Bernardi
  published: '2026-11-13'
  updated: '2026-11-13'
  categories:
  - cs.CV
