  abstract: 'Vision-language models (VLMs) often exhibit overconfidence, providing firm answers even when
    visual evidence is insufficient. A prominent case is referential ambiguity in Visual Question Answering
    (VQA), where multiple entities in an image are plausible referents of a question. Addressing such
    cases requires recognizing when ambiguity is present: ambiguous questions can be handled by asking
    for clarification or enumerating plausible referents, while unambiguous questions should receive a
    direct answer. Current VLMs struggle with this distinction, often defaulting to a single interpretation.
    To investigate whether activation steering can serve as an inference-time mechanism to elicit such
    behaviors, we introduce AmbiSteer, a lightweight framework to selectively elicit ambiguity-aware behavior.
    Across three VLMs, we find that steering alone has limited and model-dependent effects, while prompting
    is generally more effective. Combining prompting and steering substantially increases clarification
    and enumeration behaviors, but also elicits them on unambiguous cases. AmbiSteer addresses this using
    a linear classifier to predict input ambiguity and condition the steering direction accordingly, increasing
    the proportion of inputs handled appropriately from 59.0% to 77.0% on average across models. Our work
    sets the ground for lightweight approaches to reduce model overconfidence in uncertain multimodal
    settings.'
