  title: Room Impulse Response Generation Conditioned on Acoustic Parameters
  authors:
  - Silvia Arellano
  - Chunghsin Yeh
  - Gautam Bhattacharya
  - Daniel Arteaga
  published: '2025-07-16'
  updated: '2025-07-16'
