  title: Exploring Autoregressive Vision Foundation Models for Image Compression
  authors:
  - Huu-Tai Phung
  - Yu-Hsiang Lin
  - Yen-Kuan Ho
  - Wen-Hsiao Peng
  published: '2025-09-05'
  updated: '2025-09-05'
