  abstract: 'Generative models are rapidly expanding image quality assessment (IQA) beyond traditional
    fidelity factors to emerging dimensions such as physical plausibility and text-rendering correctness.
    However, existing IQA models rely on fixed definitions and heavy supervision, making them difficult
    to extend to open-ended perceptual dimensions. We identify holistic bias as an important limitation:
    when scoring an unseen dimension, models reuse generic quality priors, leading to scoring errors and
    rank inversion. To address this, we propose PACE (Perceptual Agentic Collaborative Evolution), a training-free
    multi-agent framework that formulates open-ended IQA as explicit protocol construction. Given a target
    dimension, PACE uses collaborative agents to construct an evaluation protocol composed of verifiable
    Visual Question Answering (VQA) probes, grounding evaluation in concrete visual evidence rather than
    holistic impressions. The resulting protocol is calibrated using only four human-annotated images
    per dimension, while a dual-track scoring mechanism aligns model perception with human scoring scales.
    Across traditional IQA, structural fidelity, context-aware aesthetics, and newly defined open-ended
    dimensions, PACE consistently improves its MLLM backbone, achieving competitive performance across
    diverse IQA settings, and reduces the Holistic Override Rate (HOR) from 44.4\% to 8.6\%.'
