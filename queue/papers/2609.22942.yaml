  title: An Evolutionary Agentic Approach for Open-ended Image Quality Perception
  authors:
  - Zhenchen Tang
  - Bo Peng
  - Zichuan Wang
  - Songlin Yang
  - Leilei Cao
  - Fengjie Zhu
  - Jing Dong
  published: '2026-09-19'
  updated: '2026-09-19'
  categories:
