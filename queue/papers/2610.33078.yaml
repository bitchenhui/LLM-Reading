  title: Evaluating Visual Language Models on Visual Grounding for Visually Impaired People
  authors:
  - Fairooz Azim
  - Lydia Achour
  - Claudia Borg
  - Lina Rojas-Barahona
  published: '2026-10-21'
  updated: '2026-10-27'
  categories:
  - cs.CV
  - cs.AI
  abstract: Visual grounding (VG) in visual question answering (VQA) is a fundamental capability of Vision-Language
    Models (VLMs), enabling the detection of the most relevant region in an image to answer the question.
    This reflects the model's capability of multimodal comprehension, which is crucial when interacting
    with visually impaired people (VIP). Indeed, visual grounding, when applied to assistive scenarios,
    is not merely a technical feature, but rather a trust and safety requirement. In this work, we study
    visual grounding in VLMs for visually impaired people. To this end, we assess open-source VLMs on
    visual grounding using the VizWiz-VQA-Grounding dataset and challenge, which contains real-life images
    taken by VIP. We propose VG-SHAP, which extends an existing explainability framework to provide visual
    grounding explanations, allowing the evaluation of black-box VLMs. Our results on the VizWiz-VQA-Grounding
    challenge show that despite generating correct answers, VLMs struggle to ground in the proper region
    in the image. However, these results are constrained by the quality of the segmentation model of our
    explainability framework and further research is necessary.
