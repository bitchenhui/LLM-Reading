  abstract: Web Real-Time Communication (WebRTC) is a new standard and industry effort that extends the
    web browsing model. For the first time, browsers are able to directly exchange real-time media with
    other browsers in a peer-to-peer fashion. Before WebRTC was introduced, it was cumbersome to build
    smooth chat and video applications, users often experience unstable connections, blurry videos, and
    unclear sounds. WebRTC's peer-to-peer communication paradigm establishes the real-time connection
    between browsers using the SIP(Session Initiation Protocol) Trapezoid. A wide set of protocols are
    bundled in WebRTC API, such as connection management, encoding/decoding negotiation, media control,
    selection and control, firewall and NAT element traversal, etc. However, almost all current WebRTC
    applications are using centralized signaling infrastructure which brings the problems of scalability,
    stability, and fault-tolerance. In this paper, I am presenting a decentralized architecture by introducing
    the Kademlia network into WebRTC to reduce the need for a centralized signaling service for WebRTC.
