  abstract: Building upon advancements in Large Language Models (LLMs), the field of audio processing
    has seen increased interest in training audio generation tasks with discrete audio token sequences.
    However, directly discretizing audio by neural audio codecs often results in sequences that fundamentally
    differ from text sequences. Unlike text, where text token sequences are deterministic, discrete audio
    tokens can exhibit significant variability based on contextual factors, while still producing perceptually
    identical audio segments. We refer to this phenomenon as \textbf{Discrete Representation Inconsistency
    (DRI)}. This inconsistency can lead to a single audio segment being represented by multiple divergent
    sequences, which creates confusion in neural codec language models and results in omissions and repetitions
    during speech generation. In this paper, we quantitatively analyze the DRI phenomenon within popular
    audio tokenizers such as EnCodec. Our approach effectively mitigates the DRI phenomenon of the neural
    audio codec. Furthermore, extensive experiments on the neural codec language model over LibriTTS and
    large-scale MLS datases (44,000 hours) demonstrate the effectiveness and generality of our method.
    The demo of audio samples is available online~\footnote{\url{https://consistencyinneuralcodec.github.io}}.
