  title: 'Med-Evo: Test-time Self-evolution for Medical Multimodal Large Language Models'
  authors:
  - Dunyuan Xu
  - Xikai Yang
  - Juzheng Miao
  - Yaoqian Li
  - Jinpeng Li
  - Pheng-Ann Heng
  published: '2026-03-08'
  updated: '2026-03-08'
