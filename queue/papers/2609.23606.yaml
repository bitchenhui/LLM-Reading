  title: 'Beyond UV Mapping: Mesh Texture Compression via Surface-Aligned Texture Fields'
  authors:
  - Jianqiang Wang
  - Junhui Hou
  - Siyu Ren
  - Weiyao Lin
  - Wenping Wang
  published: '2026-09-20'
  updated: '2026-10-16'
  categories:
  - cs.CV
  abstract: Mesh texture compression typically relies on 2D UV atlases, whose chart discontinuities and
    mapping overhead can limit coding efficiency. To tackle this challenge, we introduce TexF, a surface-aligned
    texture field that organizes texture attributes in sparse voxels derived from the mesh surface. This
    representation supports high-resolution textures while preserving local 3D correlations for compression
    and enabling direct surface queries. For bitstream compression, TexF reuses established 3D attribute
    codecs, with voxel locations reconstructed from the decoded mesh without separate transmission. For
    GPU-resident compression, we develop 3DNTC, which combines quantized hash features with a lightweight
    decoder for random-access reconstruction at surface positions. Differentiable rendering enables image-space
    refinement of both voxel attributes and compressed neural fields. Experiments on the MPEG and AOM
    mesh compression benchmarks demonstrate improved average rate-distortion performance over representative
    UV-based methods for both bitstream and GPU-resident compression. 3DNTC also supports real-time rendering.
