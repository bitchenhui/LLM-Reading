  title: 'BiMTokenizer: Preserving Semantic-Acoustic Balance in Low-Bitrate Speech Tokenization via Bidirectional
    State-Space Modeling'
  authors:
  - Xin Zhang
  - Lin Li
  - Chuanbo Liu
  - Jianquan Liu
  - Kong Aik Lee
  published: '2026-09-01'
  updated: '2026-09-01'
  categories:
