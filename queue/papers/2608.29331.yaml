  abstract: 'Video traffic constitutes a significant share of global web traffic. To reduce its volume,
    video codecs have been developed and continuously improved. While the industry has achieved substantial
    progress in traditional video coding, neural video codecs (NVCs) have recently emerged as a new approach
    that applies deep learning to video compression. This creates new challenges for compression quality
    assessment, which is essential for the further development and improvement of such codecs. In particular,
    it is important to evaluate the novel temporal compression paradigms introduced by NVCs. In this work,
    we present a large-scale subjective dataset of videos compressed with both neural and traditional
    video codecs. The subjective scores were collected through crowd-sourced pairwise comparisons. The
    proposed dataset provides a valuable resource for the development and benchmarking of video quality
    metrics tailored to neural video codecs. The dataset is available at the following link: https://videoprocessing.github.io/nvc-dataset-benchmark'
