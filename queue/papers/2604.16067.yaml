  abstract: 'Fine-tuning pre-trained Vision-Language Models (VLMs) for robotic manipulation introduces
    a fundamental stability-plasticity dilemma: continuous flow-matching action experts backpropagate
    concentrated, low-rank regression gradients into transformer backbones trained on high-dimensional
    cross-entropy objectives. This cross-modal gradient asymmetry rapidly degrades pre-trained visual
    reasoning. Existing solutions either disconnect continuous gradient flow via stop-gradients or constrain
    updates via LoRA, which restricts update rank but remains directionally blind to semantic corruption;
    both typically rely on mixed-batch VQA co-training, doubling training compute. We introduce AEGIS
    (Anchor-Enforced Gradient Isolation System), a buffer-free, layer-wise orthogonal gradient projection
    framework enabling continuous flow-matching fine-tuning while isolating pre-trained representations
    from destructive parameter updates. Prior to training, AEGIS estimates per-layer Gaussian activation
    statistics from pre-training data as a static reference anchor. During fine-tuning, a closed-form
    Wasserstein-2 transport penalty generates an anchor-restoration gradient through the active computation
    graph. A sequential dual-backward pass applies layer-wise Gram-Schmidt orthogonalization, projecting
    task gradients onto the orthogonal complement of the restoration vector during directional conflict.
    We establish an exact energy preservation bound for layer-wise orthogonal projection, showing that
    AEGIS sheds only 0.62% of gradient energy empirically while halting cumulative feature drift. On PaliGemma2-3B
    fine-tuned on the LIBERO manipulation benchmark, AEGIS fully preserves pre-trained Visual Question
    Answering performance and baseline holdout loss while matching continuous action convergence, without
    replay buffers, teacher models, or co-training data.'
