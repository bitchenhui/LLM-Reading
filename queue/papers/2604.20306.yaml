  title: 'Dual Causal Inference: Integrating Backdoor Adjustment and Instrumental Variable Learning for
    Medical VQA'
  authors:
  - Zibo Xu
  - Qiang Li
  - Ke Lu
  - Jin Wang
  - Weizhi Nie
  - Yuting Su
  published: '2026-04-22'
  updated: '2026-04-22'
