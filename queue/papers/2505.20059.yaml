  title: 'LPCM: Learning-based Predictive Coding for LiDAR Point Cloud Compression'
  authors:
  - Chang Sun
  - Hui Yuan
  - Shiqi Jiang
  - Da Ai
  - Wei Zhang
  - Raouf Hamzaoui
  published: '2025-05-26'
  updated: '2025-05-26'
