  title: What Does Your Short-Answer VQA Score Actually Measure? Evaluator-Dependent Instability in Multimodal
    Short-Answer Benchmarks
  authors:
  - Guanhua Ye
  - Niu Jingbin
  - Yan Li
  - Meiyu Liang
  - Zhe Xue
  - Yingxia Shao
  - Yawen Li
  published: '2026-07-11'
  updated: '2026-07-11'
