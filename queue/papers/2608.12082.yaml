  title: Rethinking Language Model-Based Generative Speech Enhancement in the Latent Space of a Neural
    Audio Codec
  authors:
  - Yihui Fu
  - Zhengyang Li
  - Tim Fingscheidt
  published: '2026-08-12'
  updated: '2026-08-12'
  categories:
  - eess.AS
  abstract: 'Language model (LM)-based speech enhancement (SE) has recently emerged rapidly using latent
    space features of neural audio codecs (NACs). In this paper, first, we present a unified framework
    covering six popular LM-based generative SE modeling paradigms based on discrete/continuous latent
    NAC features: discrete or continuous autoregressive (D/CAR) SE, discrete or continuous non-autoregressive
    (D/CNAR) SE, discrete diffusion (DDiff) SE, and continuous flow matching (CFM) SE. Second, we are
    the first to compare their performance in a unified experimental setup and synopsis with diverse intrusive
    and non-intrusive metrics, enabling a fair and comprehensive evaluation. Third, we propose a fine-tuning
    strategy with auxiliary losses on reconstructed speech to improve both intrusive and non-intrusive
    metrics. Trained and evaluated on URGENT 2025 Speech Enhancement Challenge data splits, all continuous-domain
    paradigms excel their discrete-domain counterparts. The overall best approach turns out to be CNAR.
    We further show that our proposed auxiliary loss fine-tuning strategy helps to improve DNSMOS, NISQA,
    PESQ, and POLQA consistently in all six paradigms.'
