  title: 'CORTEX: A Structured Reasoning Benchmark for Trustworthy 3D Chest CT MLLMs'
  authors:
  - Hashmat Shadab Malik
  - Anees Ur Rehman Hashmi
  - Numan Saeed
  - Muzammal Naseer
  - Salman Khan
  - Christoph Lippert
  published: '2026-06-25'
  updated: '2026-09-22'
