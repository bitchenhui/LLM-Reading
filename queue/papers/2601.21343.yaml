  abstract: 'Large language models are classically trained in stages: pretraining on raw text followed
    by post-training for instruction following and reasoning. However, this separation creates a fundamental
    limitation: many desirable behaviors such as safety, factuality, overall generation quality, and reasoning
    ability are only added at a late stage, even though the patterns learned earlier strongly shape a
    model''s capabilities. To tackle this issue, we introduce a new way to pretrain and mid-train models
    that incorporates these behaviors earlier. We utilize an existing strong, post-trained model to both
    rewrite data and to judge policy model rollouts, thus introducing thinking and reinforcement earlier
    in training. We further improve reasoning at all stages by introducing the concept of self-improving
    post-thinking: improving the model''s reasoning and self-judging ability by reasoning after generation.
    In our experiments, we show these approaches can give strong gains across multiple axes.'
