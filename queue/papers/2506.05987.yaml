  abstract: JPEG XL is a new image coding system offering state-of-the-art compression performance, lossless
    JPEG recompression, and advanced features. It aims to replace JPEG, PNG, GIF, and other formats with
    a single universal codec. This article provides an overview of JPEG XL, including its history, design
    rationale, coding tools, and future potential. It can be used as a companion document to the standard
    (ISO/IEC 18181), or as a standalone article to better understand JPEG XL, either at a high level or
    in considerable technical detail.
