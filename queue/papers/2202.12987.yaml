  title: A Brief Survey on Adaptive Video Streaming Quality Assessment
  authors:
  - Wei Zhou
  - Xiongkuo Min
  - Hong Li
  - Qiuping Jiang
  published: '2022-02-25'
  updated: '2022-02-25'
  categories:
  - cs.MM
