  title: 'More with Less: a Large Scale Remote Sensing VLM with a Simple Recipe'
  authors:
  - Stefan Maria Ailuro
  - Mario Markov
  - Mohammad Mahdi
  - Luc Van Gool
  - Danda Pani Paudel
  published: '2026-07-17'
  updated: '2026-10-01'
