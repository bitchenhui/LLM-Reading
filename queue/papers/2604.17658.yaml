  title: Towards Self-Improving Error Diagnosis in Multi-Agent Systems
  authors:
  - Jiazheng Li
  - Emine Yilmaz
  - Bei Chen
  - Dieu-Thu Le
  published: '2026-04-19'
  updated: '2026-04-19'
