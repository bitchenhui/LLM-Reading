  title: Efficient Dynamic-NeRF Based Volumetric Video Coding with Rate Distortion Optimization
  authors:
  - Zhiyu Zhang
  - Guo Lu
  - Huanxiong Liang
  - Anni Tang
  - Qiang Hu
  - Li Song
  published: '2024-02-02'
  updated: '2024-11-08'
