  title: 'ProtoAda: Prototype-Guided Adaptive Adapter Expansion and Geometric Consolidation for Multimodal
    Continual Instruction Tuning'
  authors:
  - Yu-Cheng Shi
  - Zhen-Hao Xie
  - Jun-Tao Tang
  - Da-Wei Zhou
  published: '2026-06-01'
  updated: '2026-06-03'
  categories:
  - cs.CV
