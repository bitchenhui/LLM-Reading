  title: 'T-GVC: Trajectory-Guided Generative Video Coding at Ultra-Low Bitrates'
  authors:
  - Zhitao Wang
  - Hengyu Man
  - Wenrui Li
  - Xingtao Wang
  - Xiaopeng Fan
  - Debin Zhao
  published: '2025-07-10'
  updated: '2025-11-11'
