  title: 'HybridFlow: Infusing Continuity into Masked Codebook for Extreme Low-Bitrate Image Compression'
  authors:
  - Lei Lu
  - Yanyue Xie
  - Wei Jiang
  - Wei Wang
  - Xue Lin
  - Yanzhi Wang
  published: '2024-04-20'
  updated: '2024-04-20'
