  abstract: 'JPEG, as a widely used image compression standard, often introduces severe visual artifacts
    when achieving high compression ratios. Although existing deep learning-based restoration methods
    have made considerable progress, they often struggle to recover complex texture details, resulting
    in over-smoothed outputs. To overcome these limitations, we propose SODiff, a novel and efficient
    semantic-oriented one-step diffusion model for JPEG artifacts removal. Our core idea is that effective
    restoration hinges on providing semantic-oriented guidance to the pre-trained diffusion model, thereby
    fully leveraging its powerful generative prior. To this end, SODiff incorporates a semantic-aligned
    image prompt extractor (SAIPE). SAIPE extracts rich features from low-quality (LQ) images and projects
    them into an embedding space semantically aligned with that of the text encoder. Simultaneously, it
    preserves crucial information for faithful reconstruction. Furthermore, we propose a quality factor-aware
    time predictor that implicitly learns the compression quality factor (QF) of the LQ image and adaptively
    selects the optimal denoising start timestep for the diffusion process. Extensive experimental results
    show that our SODiff outperforms recent leading methods in both visual quality and quantitative metrics.
    Code is available at: https://github.com/frakenation/SODiff'
