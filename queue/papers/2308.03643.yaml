  title: 'Mamba: Bringing Multi-Dimensional ABR to WebRTC'
  authors:
  - Yueheng Li
  - Zicheng Zhang
  - Hao Chen
  - Zhan Ma
  published: '2023-08-07'
  updated: '2023-08-07'
