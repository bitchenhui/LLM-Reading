  published: '2024-11-27'
  updated: '2025-04-27'
  categories:
  - eess.AS
  abstract: Neural audio codecs (NACs) have garnered significant attention as key technologies for audio
    compression as well as audio representation for speech language models. While mainstream NAC models
    are predominantly convolution-based, the performance of NACs with a purely transformer-based, and
    convolution-free architecture remains unexplored. This paper introduces TS3-Codec, a Transformer-Based
    Simple Streaming Single Codec. TS3-Codec consists of only a stack of transformer layers with a few
    linear layers, offering greater simplicity and expressiveness by fully eliminating convolution layers
    that require careful hyperparameter tuning and large computations. Under the streaming setup, the
    proposed TS3-Codec achieves comparable or superior performance compared to the codec with state-of-the-art
    convolution-based architecture while requiring only 12% of the computation and 77% of bitrate. Furthermore,
    it significantly outperforms the convolution-based codec when using similar computational resources.
