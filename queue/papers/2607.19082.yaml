  abstract: Autoregressive context models are foundational for learned image compression,but they suffer
    from slow serial inference. Existing acceleration methods such as checkerboard context require architectural
    changes and retraining, thus are inapplicable to pre-trained models. We propose a completely training-free
    inference-time acceleration algorithm inspired by wavefront parallelism in video coding standards.
    Our method reorganizes inference into an optimal ``staggered'' wavefront order, minimizing sequential
    steps while maintaining exact autoregressive dependencies. Experimental results show our approach
    accelerates pre-trained autoregressive models (e.g., Cheng et al.) by more than $13\times$ while preserving
    the original rate-distortion performance. We also demonstrate that faster decoding is possible by
    trading off precise context dependencies. Source code will be available at https://github.com/tokkiwa/compressai-wavefront.
