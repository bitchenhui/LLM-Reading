  abstract: Vision-language models (VLMs) still struggle with visual perception tasks such as spatial
    understanding and viewpoint recognition, largely because natural image datasets provide limited supervision
    for low-level visual skills. Can targeted synthetic supervision address these weaknesses without reference
    images or manual annotation? To investigate this, we introduce VisionFoundry, an automated pipeline
    that takes only a task name as input, uses LLMs to synthesize paired questions, answers, and text-to-image
    (T2I) prompts, generates images with T2I models, and filters samples via multimodal verification.
    With VisionFoundry, we construct VisionFoundry-10k, a synthetic VQA dataset spanning 10 perception
    tasks. Finetuning on VisionFoundry-10k consistently improves perception benchmarks across three open-source
    backbones (e.g., +6.7% on MMVP-pair and +10.5% on CV-Bench-3D for Qwen2.5-VL-3B-Instruct) while preserving
    broader capabilities and showing positive data scaling. The same synthetic supervision also yields
    consistent gains under reinforcement learning (RL) across all three backbones, and the framework remains
    effective under open-source synthesis and self-verification. Our findings demonstrate that automated
    synthetic supervision offers an effective and scalable path toward systematic VLM training.
