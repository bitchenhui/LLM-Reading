  abstract: We present a software architecture to enable end user driven innovation of web multimedia
    communication applications. RTC Helper is a simple and easy-to-use software that can intercept WebRTC
    (web real-time communication) and related APIs in the browser, and change the behavior of web apps
    in real-time. Such customization can even be driven by the end user on third-party web apps using
    our flexible and general purpose browser extension. It also facilitates rapid prototyping of ideas
    by web developers in their existing web apps without having to rebuild or redeploy after every change.
    It has more than ten customization categories, and over a hundred built-in examples covering a wide
    range of novel use cases in web-based audio/video communication.
