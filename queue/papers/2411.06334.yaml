  title: A Multicast Scheme for Live Streaming Courses in Large-Scale, Geographically Dense Campus Networks
  authors:
  - Senxin Wu
  - Jinlong Hu
  - Ling Zhang
  published: '2024-11-10'
  updated: '2024-11-10'
  categories:
  - cs.NI
  abstract: Video courses have become a significant component of modern education. However, the increasing
    demand for live streaming video courses places considerable strain on the service capabilities of
    campus networks. The challenges associated with live streaming course videos in campus network environments
    exhibit distinct spatial distribution characteristics. The audience for specific video courses may
    be highly concentrated in certain areas, leading to a large number of users attempting to access the
    same live stream simultaneously. Utilizing a Content Delivery Network (CDN) to distribute videos in
    these campus scenarios creates substantial unicast pressure on edge CDN servers. This paper proposes
    a two-layer dynamic partitioning Recursive Bit String (RBS) virtual domain network layer multicast
    architecture specifically designed for large-scale, geographically dense multicast scenarios within
    campus networks. This approach reduces redundant multicast messages by approximately 10-30\% compared
    to the two-layer fixed partitioning method. Additionally, it establishes multicast source authentication
    capabilities based on Source Address Validation Improvement (SAVI) and facilitates secure multicast
    group key exchange using a concise exchange protocol within the WebRTC framework. In the next-generation
    data plane of programmable software-defined networks, the RBS stateless multicast technology can be
    integrated with the unique characteristics of large-scale, geographically dense campus network scenarios
    to dynamically and efficiently extend multicast coverage to every dormitory.
