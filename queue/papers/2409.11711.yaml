  abstract: Light-Field (LF) image is emerging 4D data of light rays that is capable of realistically
    presenting spatial and angular information of 3D scene. However, the large data volume of LF images
    becomes the most challenging issue in real-time processing, transmission, and storage. In this paper,
    we propose an end-to-end deep LF Image Compression method Using Disentangled Representation and Asymmetrical
    Strip Convolution (LFIC-DRASC) to improve coding efficiency. Firstly, we formulate the LF image compression
    problem as learning a disentangled LF representation network and an image encoding-decoding network.
    Secondly, we propose two novel feature extractors that leverage the structural prior of LF data by
    integrating features across different dimensions. Meanwhile, disentangled LF representation network
    is proposed to enhance the LF feature disentangling and decoupling. Thirdly, we propose the LFIC-DRASC
    for LF image compression, where two Asymmetrical Strip Convolution (ASC) operators, i.e. horizontal
    and vertical, are proposed to capture long-range correlation in LF feature space. These two ASC operators
    can be combined with the square convolution to further decouple LF features, which enhances the model
    ability in representing intricate spatial relationships. Experimental results demonstrate that the
    proposed LFIC-DRASC achieves an average of 20.5\% bit rate reductions comparing with the state-of-the-art
    methods.
