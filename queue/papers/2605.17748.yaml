  abstract: In the field of Blind Image Quality Assessment (BIQA), accurately predicting the perceptual
    quality of authentically distorted images remains highly challenging due to the diverse and complex
    distortions present in natural environments. Although existing methods have achieved notable accuracy,
    their scalability is often constrained by the high cost of subjective annotation and the limited size
    of available datasets. Recent advances in large-scale pre-trained vision models have introduced powerful
    semantic and representational capabilities, yet their application to IQA tasks is hindered by substantial
    computational demands and suboptimal fine-tuning efficiency. To overcome these limitations, we introduce
    the Global-Local Interaction Adapter (GLIA), a novel framework that effectively harnesses pre-trained
    Vision Transformers through a dual-stream feature extraction mechanism coupled with interactive global-local
    fusion. By jointly retaining global semantic information and fine-grained local details, our approach
    delivers superior prediction accuracy and robustness while requiring significantly fewer trainable
    parameters. Extensive experiments on multiple benchmarks validate the effectiveness and superiority
    of our approach.
