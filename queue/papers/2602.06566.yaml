  abstract: Despite recent successes, test-time scaling -- i.e., dynamically expanding the token budget
    during inference as needed -- remains brittle for vision-language models (VLMs). Unstructured visual
    reasoning chains entangle perception and reasoning, leading to long, disorganized contexts where small
    perceptual mistakes may cascade into completely wrong answers. Reasoning also requires expensive reinforcement
    learning with hand-crafted rewards. Here, we introduce SPARC (Separating Perception And Reasoning
    Circuits), a modular framework that explicitly decouples visual perception from reasoning. Inspired
    by sequential sensory-to-cognitive processing in the brain, SPARC implements a two-stage pipeline
    where the model first performs explicit visual search to localize question-relevant regions, then
    conditions its reasoning on those regions to produce the final answer. This separation enables independent
    test-time scaling with asymmetric compute allocation (e.g., prioritizing perceptual processing under
    distribution shift), and supports selective optimization (e.g., improving the perceptual stage alone
    when it is the bottleneck for end-to-end performance). It also accommodates compressed contexts by
    running global search at lower image resolutions and allocating high-resolution processing only to
    selected regions, thereby reducing visual token count and compute. SPARC outperforms monolithic baselines
    and strong visual-grounding approaches across challenging visual reasoning tasks, such as improving
    Qwen3VL 4B on the $V^*$ VQA benchmark by 6.7 points and surpassing "thinking with images" by 4.6 points
    in an OOD setting with a $200\times$ lower token budget.
