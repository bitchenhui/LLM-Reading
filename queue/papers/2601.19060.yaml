  abstract: Multimodal Retrieval-Augmented Generation (MM-RAG) augments visual question answering (VQA)
    with external knowledge, but many systems rely on modular pipelines that separate visual grounding,
    query construction, and answer generation. This separation can propagate errors from intermediate
    detections, masks, or captions into retrieval while adding latency and limiting coordination with
    ongoing reasoning. These limitations are especially consequential for egocentric images, where questions
    often concern small, off-center, or long-tail entities that global retrieval can overlook. We propose
    PixSearch, an end-to-end segmenting Large Multimodal Model (LMM) that unifies region-level visual
    grounding with retrieval-augmented reasoning. During autoregressive generation, PixSearch learns when
    to retrieve, how to route queries across text, whole-image, and region-level retrieval, and how to
    crop the target entity as a visual query using a jointly trained mask decoder. A two-stage supervised
    fine-tuning regimen with search-interleaved supervision teaches retrieval triggering, query selection,
    and evidence-grounded answer generation while preserving segmentation ability. On egocentric and entity-centric
    VQA benchmarks, PixSearch achieves an 18.3% relative accuracy gain on CRAG-MM over whole-image retrieval,
    with particularly strong gains on egocentric images, while remaining competitive on broader VQA and
    text-only QA tasks. It also reduces inference latency by 36.4% compared with a cached GroundedSAM-LLaVA
    pipeline.
