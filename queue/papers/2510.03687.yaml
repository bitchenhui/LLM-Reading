  title: 'MedReflect: Teaching Medical LLMs to Self-Improve via Reflective Correction'
  authors:
  - Yue Huang
  - Yanyuan Chen
  - Dexuan Xu
  - Chenzhuo Zhao
  - Weihua Yue
  - Yu Huang
  published: '2025-10-04'
  updated: '2026-01-16'
  categories:
  - cs.CL
