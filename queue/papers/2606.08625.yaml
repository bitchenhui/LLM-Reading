  title: 'From Holistic Evaluation to Structured Criteria: Rubrics Across the Evolving LLM Landscape'
  authors:
  - Hao Chen
  - Ziyu Han
  - Yukun Yan
  - Qingfu Zhu
  - Maosong Sun
  - Wanxiang Che
  published: '2026-06-07'
  updated: '2026-07-01'
  categories:
  - cs.CL
  abstract: 'As Large Language Models (LLMs) advance toward open-ended autonomous agents, the mechanisms
    used to evaluate and guide their behavior must evolve accordingly. This work introduces the rubric
    as a unifying framework capturing this evolution, characterizing rubrics as a dynamic response to
    successive LLM paradigm shifts that recurs across otherwise independent efforts in evaluation, reinforcement
    learning, and safety alignment. We define rubrics as explicit criteria sets that transform complex
    quality judgments into structured and actionable standards, and demonstrate that their recurrence
    across these research threads is not coincidental. We systematically organize existing rubric designs,
    examine their construction and optimization, and analyze their role across evaluation and training.
    Rubrics manifest at three progressively deeper levels: at the evaluative level, they decompose holistic
    judgments into verifiable dimensions; at the training level, they serve as dense feedback signals
    providing process-level guidance where scalar rewards fall short; at the intrinsic level, they emerge
    dynamically from model behaviors, driving self-improvement. We further assess rubric reliability across
    generation quality, execution fidelity, theoretical constraints, and security threats, before surveying
    rubric-based benchmarks across diverse domains. By rendering assessment transparent and decomposable,
    rubrics translate human value expectations into machine-learnable signals, serving as the enduring
    bridge between human intentions and machine behavior.'
