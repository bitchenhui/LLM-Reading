  title: Local SVD-Entropy Maps as a Complementary Structural Representation for Full-Reference and No-Reference
    Image Quality Assessment
  authors:
  - Andrei Velichko
  - Petr Boriskov
  published: '2026-08-23'
  updated: '2026-08-23'
