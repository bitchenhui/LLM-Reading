  abstract: We present a method for post-processing point clouds' geometric information by applying a
    previously proposed fractional super-resolution technique to clouds compressed and decoded with MPEG's
    G-PCC codec. In some sense, this is a continuation of that previous work, which requires only a down-scaled
    point cloud and a scaling factor, both of which are provided by the G-PCC codec. For non-solid point
    clouds, an a priori down-scaling is required for improved efficiency. The method is compared to the
    GPCC itself, as well as machine-learning-based techniques. Results show a great improvement in quality
