  title: The Bjøntegaard Bible -- Why your Way of Comparing Video Codecs May Be Wrong
  authors:
  - Christian Herglotz
  - Hannah Och
  - Anna Meyer
  - Geetha Ramasubbu
  - Lena Eichermüller
  - Matthias Kränzler
  - Fabian Brand
  - Kristian Fischer
  - Dat Thanh Nguyen
  - Andy Regensky
  - André Kaup
  published: '2023-04-25'
  updated: '2023-12-22'
