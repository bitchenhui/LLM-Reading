  title: 'Teach to Learn: Hint Annealing for Self-improving LLM Reasoning'
  authors:
  - Zile Wang
  - Zijian Li
  - Haodong Wang
  - Jian Liu
  - Qianli Liu
  - Lucas Muli
  - Blaze Chen
  - Song Guo
  published: '2026-09-28'
  updated: '2026-09-28'
  categories:
