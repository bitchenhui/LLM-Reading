  abstract: This survey presents the evolution of live media streaming and the technological developments
    behind today's IP-based low-latency live streaming systems. Live streaming primarily involves capturing,
    encoding, packaging and delivering real-time events such as live sports, live news, personal broadcasts
    and surveillance videos. Live streaming also involves concurrent streaming of linear TV programming
    off the satellite, cable, over-the-air or IPTV broadcast, where the programming is not necessarily
    a real-time event. The survey starts with a discussion on the latency and latency continuum in streaming
    applications. Then, it lays out the existing live streaming workflows and protocols, followed by an
    in-depth analysis of the latency sources in these workflows and protocols. The survey continues with
    the technology enablers, low-latency extensions for the popular HTTP adaptive streaming methods and
    enhancements for robust low-latency playback. An entire section is dedicated to the detailed summary
    and findings of Twitch's grand challenge on low-latency live streaming. The survey concludes with
    a discussion of ongoing research problems in this space. We expect this survey to be the one-stop
    reference for those who would like to learn how low-latency live streaming has evolved and works today,
    and what further developments could happen in the future.
