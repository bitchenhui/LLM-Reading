  title: 'Objective Measures of Perceptual Audio Quality Reviewed: An Evaluation of Their Application
    Domain Dependence'
  authors:
  - Matteo Torcoli
  - Thorsten Kastner
  - Jürgen Herre
  published: '2021-10-21'
  updated: '2021-10-21'
