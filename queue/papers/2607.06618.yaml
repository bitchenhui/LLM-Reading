  abstract: 'Following the CMIVQA, MMI-VQA, and M4IVQA challenges in NLPCC 2023--2025, we introduce the
    Difficulty-Aware Medical Instructional Video Question Answering (DA-MIVQA) shared task for NLPCC 2026.
    DA-MIVQA extends previous multilingual and multimodal medical video benchmarks by explicitly distinguishing
    questions according to the type and complexity of evidence required for answering. Specifically, simple
    questions can often be answered from subtitle-based textual cues, whereas complex questions require
    visual grounding, procedural understanding, and cross-modal evidence integration. The challenge contains
    three tracks: Difficulty-Aware Temporal Answer Grounding in Single Video (DA-TAGSV), Difficulty-Aware
    Video Corpus Retrieval (DA-VCR), and Difficulty-Aware Temporal Answer Grounding in Video Corpus (DA-TAGVC).
    The dataset is collected from public medical instructional channels, covers diverse scenarios such
    as first aid, emergency response, rehabilitation, nursing, and general medical education, and is manually
    verified with difficulty annotations. This paper presents the task motivation, dataset construction,
    evaluation protocol, participation overview, competition results, and representative systems of DA-MIVQA.
    DA-MIVQA provides a practical benchmark for evaluating medical instructional video question answering
    systems under varying textual, visual, temporal, and procedural reasoning requirements.'
