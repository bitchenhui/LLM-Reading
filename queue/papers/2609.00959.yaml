  title: Candidate-Expanding Routing with Permutation-Stabilized Experts for Mixed-Format Medical VQA
  authors:
  - Hai-Dang Nguyen
  - Huy-Hieu Pham
  published: '2026-09-01'
  updated: '2026-09-01'
  categories:
  - cs.CV
  abstract: 'Mixed-format medical visual question answering (VQA) requires stable option selection and
    machine-readable free-text output. The two formats fail differently: multiple-choice predictions can
    change with option symbols or positions, while clinically plausible open answers can fail automated
    evaluation when serialization is malformed. We address both challenges with an answer-text memory,
    a permutation-stabilized vision--language expert, and a sparse candidate- expanding router. The cyclic
    schedule follows prior work; our contribution is to make expert top-2 a routable candidate alongside
    memory and expert top-1. On a 1,403-case retrospective internal analysis, this expansion improves
    a matched binary router from 88.95% to 91.73% (+2.78 percentage points; 95% CI 1.57--3.99), with 56
    rescued errors and 17 regressions. Oracle coverage rises from 90.31% to 96.15%, and the final submitted
    configuration reaches 92.23% on the same retrospective split. For open questions, strict generation
    and deterministic guards produce 475/475 schema- valid participant-facing outputs without repair,
    retry, or hard-gate failure. Visual ablations reveal substantial textual dependence. Candidate expansion
    supplies the principal controlled routing gain; open-path evidence establishes output-contract validity
    rather than clinical correctness in medical use or deployment.'
