  abstract: 'We introduce Orca, an initial instantiation of a general world foundation model. Orca learns
    a unified world latent space from multimodal world signals and exposes it through multimodal readout
    interfaces. Rather than optimizing isolated next-token, next-frame, or next-action prediction, we
    are centered on Next-State-Prediction modeling, offering a unified state-transition modeling route
    toward understanding, predicting, and acting upon the world. Orca learns through two complementary
    paradigms: unconscious learning captures dense natural state transitions from continuous videos, and
    conscious learning models sparse meaningful state transitions by language-described events and VQA
    supervision. For pre-training, we construct a large-scale world-learning inventory data, including
    125K hours of video data and 160M event annotations. After pre-training, Orca learns a unified world
    latent space. To examine whether the learned latent supports downstream, we evaluate it by three representative
    downstream readouts: text generation, image prediction, and embodied action generation. Orca''s backbone
    is frozen, and only the lightweight modality-specific decoders are trainable. Experiments show the
    scalability of the proposed paradigm and verify that stronger world latent enables stronger downstream
    readouts. Orca outperforms similar-sized specialized baselines. These results show that Orca, as a
    general world foundation model, presents a promising approach to understanding, predicting, and acting
    upon the world. Finally, we discuss the current limitations, aiming to provide useful insights and
    inspiration for the community.'
