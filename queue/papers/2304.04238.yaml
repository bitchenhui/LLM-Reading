  title: 'Towards Arbitrary-scale Histopathology Image Super-resolution: An Efficient Dual-branch Framework
    based on Implicit Self-texture Enhancement'
  authors:
  - Linhao Qu
  - Minghong Duan
  - Zhiwei Yang
  - Manning Wang
  - Zhijian Song
  published: '2023-04-09'
  updated: '2023-04-09'
