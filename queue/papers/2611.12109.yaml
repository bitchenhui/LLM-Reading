  title: 'SkillDuet: Co-Evolving Models and Skills through Response Feedback'
  authors:
  - Xingguang Ji
  - Ziqiang Dong
  - Yubo Zhang
  - Xi Leng
  - Yang Yang
  - Guanjun Jiang
  published: '2026-11-09'
  updated: '2026-11-09'
  categories:
  - cs.AI
