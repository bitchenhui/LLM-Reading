  title: Competitive Learning for Achieving Content-specific Filters in Video Coding for Machines
  authors:
  - Honglei Zhang
  - Jukka I. Ahonen
  - Nam Le
  - Ruiying Yang
  - Francesco Cricri
  published: '2024-06-18'
  updated: '2024-06-18'
