  title: Bound-Conditioned Latent Inference for Progressive Image Compression
  authors:
  - Jaeseok Jang
  - Seungmin Jeon
  - Kwang Pyo Choi
  - Chang-Su Kim
  published: '2026-10-22'
  updated: '2026-10-22'
