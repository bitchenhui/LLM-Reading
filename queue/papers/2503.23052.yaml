  title: 'ShiftLIC: Lightweight Learned Image Compression with Spatial-Channel Shift Operations'
  authors:
  - Youneng Bao
  - Wen Tan
  - Chuanmin Jia
  - Mu Li
  - Yongsheng Liang
  - Yonghong Tian
  published: '2025-03-29'
  updated: '2025-03-29'
  categories:
  - eess.IV
  abstract: Learned Image Compression (LIC) has attracted considerable attention due to their outstanding
    rate-distortion (R-D) performance and flexibility. However, the substantial computational cost poses
    challenges for practical deployment. The issue of feature redundancy in LIC is rarely addressed. Our
    findings indicate that many features within the LIC backbone network exhibit similarities. This paper
    introduces ShiftLIC, a novel and efficient LIC framework that employs parameter-free shift operations
    to replace large-kernel convolutions, significantly reducing the model's computational burden and
    parameter count. Specifically, we propose the Spatial Shift Block (SSB), which combines shift operations
    with small-kernel convolutions to replace large-kernel. This approach maintains feature extraction
    efficiency while reducing both computational complexity and model size. To further enhance the representation
    capability in the channel dimension, we propose a channel attention module based on recursive feature
    fusion. This module enhances feature interaction while minimizing computational overhead. Additionally,
    we introduce an improved entropy model integrated with the SSB module, making the entropy estimation
    process more lightweight and thereby comprehensively reducing computational costs. Experimental results
    demonstrate that ShiftLIC outperforms leading compression methods, such as VVC Intra and GMM, in terms
    of computational cost, parameter count, and decoding latency. Additionally, ShiftLIC sets a new SOTA
    benchmark with a BD-rate gain per MACs/pixel of -102.6\%, showcasing its potential for practical deployment
    in resource-constrained environments. The code is released at https://github.com/baoyu2020/ShiftLIC.
