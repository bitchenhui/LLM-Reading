  title: 'OEMA: Ontology-Enhanced Multi-Agent Collaboration Framework for Zero-Shot Clinical Named Entity
    Recognition'
  authors:
  - Xinli Tao
  - Xin Dong
  - Xuezhong Zhou
  published: '2025-11-19'
  updated: '2025-11-20'
  categories:
  - cs.CL
