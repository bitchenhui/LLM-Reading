  title: Attribute Artifacts Removal for Geometry-based Point Cloud Compression
  authors:
  - Xihua Sheng
  - Li Li
  - Dong Liu
  - Zhiwei Xiong
  published: '2021-12-01'
  updated: '2022-03-01'
