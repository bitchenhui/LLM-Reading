  abstract: Most super-resolution (SR) models struggle with real-world low-resolution (LR) images. This
    issue arises because the degradation characteristics in the synthetic datasets differ from those in
    real-world LR images. Since SR models are trained on pairs of high-resolution (HR) and LR images generated
    by downsampling, they are optimized for simple degradation. However, real-world LR images contain
    complex degradation caused by factors such as the imaging process and JPEG compression. Due to these
    differences in degradation characteristics, most SR models perform poorly on real-world LR images.
    This study proposes a dataset generation method using undertrained image reconstruction models. These
    models have the property of reconstructing low-quality images with diverse degradation from input
    images. By leveraging this property, this study generates LR images with diverse degradation from
    HR images to construct the datasets. Fine-tuning pre-trained SR models on our generated datasets improves
    noise removal and blur reduction, enhancing performance on real-world LR images. Furthermore, an analysis
    of the datasets reveals that degradation diversity contributes to performance improvements, whereas
    color differences between HR and LR images may degrade performance. 11 pages, (11 figures and 2 tables)
