  title: 'FunL2O: LLM-Guided Feature Function Design for Learning to Optimize'
  authors:
  - Bingheng Li
  - Junyang Cai
  - Yupeng Zhang
  - Bistra Dilkina
  - Jayant Kalagnanam
  - Dzung T. Phan
  published: '2026-07-29'
  updated: '2026-07-29'
