  title: Bidirectional Learned Facial Animation Codec for Low Bitrate Talking Head Videos
  authors:
  - Riku Takahashi
  - Ryugo Morita
  - Fuma Kimishima
  - Kosuke Iwama
  - Jinjia Zhou
