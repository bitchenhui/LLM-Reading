  title: Rethinking Visual Attribution for Chest X-ray Reasoning in Large Vision Language Models
  authors:
  - Guangzhi Xiong
  - Qiao Jin
  - Sanchit Sinha
  - Zhiyong Lu
  - Aidong Zhang
  published: '2026-05-19'
  updated: '2026-05-19'
  categories:
  - cs.CV
