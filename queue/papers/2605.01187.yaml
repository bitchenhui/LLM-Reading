  title: 'Evolution of NVENC Efficiency: A Longitudinal Analysis of HQ and UHQ Tuning Efficiency, Latency
    and Energy Trade-offs'
  authors:
  - Kasidis Arunruangsirilert
  - Jiro Katto
  published: '2026-05-02'
  updated: '2026-05-02'
