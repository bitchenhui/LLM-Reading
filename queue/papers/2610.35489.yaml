  title: 'TP-JSCC: Efficient Token Pruning and Joint Source-Channel Coding for LVLMs-based 3D-VQA in Cloud-Edge
    Collaboration'
  authors:
  - Zhengxin Li
  - Chongzhen Tian
  - Hui Yuan
  - Hao Liu
  - Sam Kwong
  published: '2026-10-26'
  updated: '2026-10-26'
