  abstract: Remote sensing vision-language models have advanced Earth observation, but available large-scale
    vision-language resources remain RGB-centered, leaving complementary infrared information underexplored.
    Infrared observations provide distinctive intensity structures, object boundaries, and illumination-invariant
    cues that complement conventional RGB imagery, yet large-scale RGB-infrared-text resources remain
    scarce. We introduce FusionRS, the first large-scale RGB-infrared-style-text dataset for controlled
    dual-modal remote sensing vision-language learning. It contains 600,000 spatially aligned pairs created
    by translating diverse public RGB remote sensing images into infrared-style counterparts. Each pair
    retains a conventional scene caption, and a curated subset adds 45,913 IR-aware captions describing
    observable intensity, contrast, texture, and structure while preserving scene semantics. We train
    CLIP-style models for RGB-infrared-style-text alignment and adapt a generative vision-language model
    with mixed task-conditioned caption supervision. Evaluation covers cross-modal retrieval, scaling
    and supervision ablations, sensor-captured transfer, and strictly held-out captioning and VQA. FusionRS
    substantially improves RGB-infrared-style alignment and infrared-to-text retrieval over RGB-only and
    non-IR-aware settings. Ablations show that IR-aware captions improve task-conditioned infrared description,
    demonstrating the value of modality-specific supervision. FusionRS provides a scalable foundation
    for controlled RGB-infrared remote sensing vision-language learning.
