  title: Standard compliant video coding using low complexity, switchable neural wrappers
  authors:
  - Yueyu Hu
  - Chenhao Zhang
  - Onur G. Guleryuz
  - Debargha Mukherjee
  - Yao Wang
  published: '2024-07-10'
