  abstract: Intra prediction is a crucial component in traditional video coding frameworks, aiming to
    eliminate spatial redundancy within frames. In recent years, an increasing number of decoder-side
    adaptive mode derivation methods have been adopted into Enhanced Compression Model (ECM). However,
    these methods predominantly rely on adjacent spatial information for intra mode decision-making, overlooking
    potential similarity patterns in non-adjacent spatial regions, thereby limiting intra prediction efficiency.
    To address this limitation, this paper proposes a template-based intra mode derivation approach enhanced
    by block vector-based prediction. The adaptive block vector replacement strategy effectively expands
    the reference scope of the existing template-based intra mode derivation mode to non-adjacent spatial
    information, thereby enhancing prediction efficiency. Extensive experiments demonstrate that our strategy
    achieves 0.082% Bjøntegaard delta rate (BD-rate) savings for Y components under the All Intra (AI)
    configuration compared to ECM-16.1 while maintaining identical encoding/decoding complexity, and delivers
    an additional 0.25% BD-rate savings for Y components on screen content sequences.
