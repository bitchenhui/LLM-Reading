  abstract: With advances in image recognition technology based on deep learning, automatic video analysis
    by Artificial Intelligence is becoming more widespread. As the amount of video used for image recognition
    increases, efficient compression methods for such video data are necessary. In general, when the image
    quality deteriorates due to image encoding, the image recognition accuracy also falls. Therefore,
    in this paper, we propose a neural-network-based approach to improve image recognition accuracy, especially
    the object detection accuracy by applying post-processing to the encoded video. Versatile Video Coding
    (VVC) will be used for the video compression method, since it is the latest video coding method with
    the best encoding performance. The neural network is trained using the features of YOLO-v7, the latest
    object detection model. By using VVC as the video coding method and YOLO-v7 as the detection model,
    high object detection accuracy is achieved even at low bit rates. Experimental results show that the
    combination of the proposed method and VVC achieves better coding performance than regular VVC in
    object detection accuracy.
