  title: 'A new subband non linear prediction coding algorithm for narrowband speech signal: The nADPCMB
    MLT coding scheme'
  authors:
  - Guido D'Alessandro
  - Marcos Faundez Zanuy
  - Francesco Piazza
  published: '2022-03-24'
  updated: '2022-03-24'
  categories:
  - cs.SD
  - eess.AS
  abstract: This paper focuses on a newly developed transparent nADPCMB MLT speech coding algorithm. Our
    coder first decomposes the narrowband speech signal in subbands, a non linear ADPCM scheme is then
    performed in each subband. The signal subband decomposition is piloted by the equivalent Modulated
    Lapped Transform (MLT) filter bank. The novelty of this algorithm is the non linear approach, based
    on neural networks, to subband prediction coding. We have evaluated the performance of the nADPCMB
    MLT coding algorithm with a session of formal listening based on the five grade impairment scale standardized
    within ITU - T Recommendation P.800.
