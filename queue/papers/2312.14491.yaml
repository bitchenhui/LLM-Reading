  title: Enhanced Color Palette Modeling for Lossless Screen Content Compression
  authors:
  - Hannah Och
  - Shabhrish Reddy Uddehal
  - Tilo Strutz
  - André Kaup
  published: '2023-12-22'
  updated: '2024-10-07'
