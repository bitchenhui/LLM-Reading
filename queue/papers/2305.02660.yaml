  title: Expanding Synthetic Real-World Degradations for Blind Video Super Resolution
  authors:
  - Mehran Jeelani
  - ' Sadbhawna'
  - Noshaba Cheema
  - Klaus Illgner-Fehns
  - Philipp Slusallek
