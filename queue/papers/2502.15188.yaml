  title: Interleaved Block-based Learned Image Compression with Feature Enhancement and Quantization Error
    Compensation
  authors:
  - Shiqi Jiang
  - Hui Yuan
  - Shuai Li
  - Raouf Hamzaoui
  - Xu Wang
  - Junyan Huo
  published: '2025-02-21'
  updated: '2025-02-21'
  categories:
  - eess.IV
