  abstract: In this paper we propose a nonlinear vectorial prediction scheme based on a Multi Layer Perceptron.
    This system is applied to speech coding in an ADPCM backward scheme. In addition a procedure to obtain
    a vectorial quantizer is given, in order to achieve a fully vectorial speech encoder. We also present
    several results with the proposed system
