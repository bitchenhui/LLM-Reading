  abstract: Recursive Self-Improvement (RSI) aims to enable AI systems to autonomously build and improve
    AI systems themselves, including models, harnesses, and underlying infrastructure. Within this broader
    agenda, a central capability is enabling agents to train and improve base models. However, existing
    studies on automated model training primarily focused on workflow- or harness-level optimizations,
    rather than internalizing the ability to conduct post-training into the model itself. Developing this
    capability requires executable model training environments that can produce high-quality trajectories
    demonstrating how to select data, train models, diagnose failures, and iteratively improve results.
    In this paper, we introduce RSI-Dojo, a collection of executable model training environments designed
    to teach LLM agents to conduct post-training. To construct RSI-Dojo, we develop RSI-Craft, an automatic
    pipeline that converts human research artifacts into executable model training environments. RSI-Craft
    automatically collects research papers from top venues, instantiates datasets and metrics into a unified
    interface, and reproduces evaluation dependencies. It then filters tasks by data size, execution reliability,
    and discriminability, yielding RSI-Dojo with 281 seed model training tasks. Building on RSI-Dojo,
    we employ a trajectory collection method with an improved harness to collect high-quality model-training
    trajectories from frontier models, then retain examples through rubric-based and outcome-based filtering.
    We fine-tune Qwen3.5-9B and Qwen3.6-35B-A3B on these trajectories. The resulting RSI-Dojo-9B and RSI-Dojo-35B-A3B
    improve over their base models by 8.74 and 16.87 PostTrainBench points, respectively. RSI-Dojo-35B-A3B
    reaches 29.95 on PostTrainBench and 53.29 on PostTrainBench-Lite, matching the performance of frontier
    models such as GLM-5.2 and GPT 5.5.
