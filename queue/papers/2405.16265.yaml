  abstract: Although Large Language Models (LLMs) achieve remarkable performance across various tasks,
    they often struggle with complex reasoning tasks, such as answering mathematical questions. Recent
    efforts to address this issue have primarily focused on leveraging mathematical datasets through supervised
    fine-tuning or self-improvement techniques. However, these methods often depend on high-quality datasets
    that are difficult to prepare, or they require substantial computational resources for fine-tuning.
    Inspired by findings that LLMs know how to produce the right answer but struggle to select the correct
    reasoning path, we propose a purely inference-based searching method -- MindStar (M*). This method
    formulates reasoning tasks as searching problems and proposes two search ideas to identify the optimal
    reasoning paths. We evaluate the M* framework on both the GSM8K and MATH datasets, comparing its performance
    with existing open and closed-source LLMs. Our results demonstrate that M* significantly enhances
    the reasoning abilities of open-source models, such as Llama-2-13B and Mistral-7B, and achieves comparable
    performance to GPT-3.5 and Grok-1, but with substantially reduced model size and computational costs.
