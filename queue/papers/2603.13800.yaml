  abstract: Visual spatial intelligence is critical for medical image interpretation, yet remains largely
    unexplored in Multimodal Large Language Models (MLLMs) for 3D imaging. This gap persists due to a
    systemic lack of datasets featuring structured 3D spatial annotations beyond basic labels. In this
    study, we introduce an agentic pipeline that autonomously synthesizes spatial visual question-answering
    (VQA) data by orchestrating computational tools such as volume estimation and bounding boxes extraction
    with multi-agent collaboration and expert radiologist validation. We present SpatialMed, the first
    comprehensive benchmark for evaluating 3D spatial intelligence in medical MLLMs, comprising 31,253
    question-answer pairs across multiple organs and tumor types. Our evaluations on 24 state-of-the-art
    MLLMs and extensive analyses reveal that current models lack robust spatial reasoning capabilities
    for medical imaging.
