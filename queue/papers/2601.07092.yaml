  title: Efficient Visual Question Answering Pipeline for Autonomous Driving via Scene Region Compression
  authors:
  - Yuliang Cai
  - Dongqiangzi Ye
  - Zitian Chen
  - Chongruo Wu
  published: '2026-01-11'
  updated: '2026-01-11'
  categories:
  - cs.CV
  abstract: Autonomous driving increasingly relies on Visual Question Answering (VQA) to enable vehicles
    to understand complex surroundings by analyzing visual inputs and textual queries. Currently, a paramount
    concern for VQA in this domain is the stringent requirement for fast latency and real-time processing,
    as delays directly impact real-world safety in this safety-critical application. However, current
    state-of-the-art VQA models, particularly large vision-language models (VLMs), often prioritize performance
    over computational efficiency. These models typically process dense patch tokens for every frame,
    leading to prohibitive computational costs (FLOPs) and significant inference latency, especially with
    long video sequences. This focus limits their practical deployment in real-time autonomous driving
    scenarios. To tackle this issue, we propose an efficient VLM framework for autonomous driving VQA
    tasks, SRC-Pipeline. It learns to compress early frame tokens into a small number of high-level tokens
    while retaining full patch tokens for recent frames. Experiments on autonomous driving video question
    answering tasks show that our approach achieves 66% FLOPs reduction while maintaining comparable performance,
    enabling VLMs to operate more effectively in real-time, safety-critical autonomous driving settings.
