  title: 'Learning to Attract and Repel: Dual Quality Margin Learning for Face Recognition (DQM-Face)'
  authors:
  - El Ouanas Belabbaci
  - Bhavesh Wani
  - Philipp Terhörst
  published: '2026-09-02'
  updated: '2026-09-02'
  categories:
  - cs.CV
  abstract: 'Face recognition in unconstrained environments remains highly challenging due to diverse
    and extreme variations encountered in real-world scenarios. To mitigate these effects, existing margin-based
    approaches model sample quality through feature magnitude. However, magnitude-based modeling alone
    is susceptible to identity-agnostic noise, which can degrade the reliability and discriminative power
    of learned representations. In this paper, we propose Dual Quality Margin Learning for Face Recognition
    (DQM-Face), a novel framework that enables refined attraction and repulsion dynamics during representation
    learning. Our approach unifies conventional magnitude-based quality estimation with a newly introduced
    semantic quality learning mechanism, realized via squeeze-and-excitation semantic attention. By jointly
    leveraging magnitude and semantic cues, we construct enhanced quality-aware margins that adaptively
    strengthen intra-class compactness through improved attraction during learning. To further enhance
    inter-class discrimination, we introduce a repulsion margin formulation that explicitly enlarges inter-class
    separation. The unified integration of semantic quality modeling with dual attraction-repulsion margin
    optimization results in a more structured and discriminative feature geometry. Extensive experiments
    on multiple challenging benchmarks demonstrate that DQM-Face consistently outperforms state-of-the-art
    face recognition methods. Moreover, we show that the quality learned for margin optimization is highly
    effective for face image quality assessment within the proposed framework, demonstrating that the
    learned quality signal is intrinsically aligned with the recognition objective. The code is publicly
    available: https://github.com/RAIB-group/DQM-Face'
