  abstract: Healthcare spans high-stakes communication, expert reasoning, and workflow execution, yet
    specialized language models that cover these use cases together remain limited. A healthcare model
    must handle patient consultation, clinical reasoning over text and images, interactive diagnosis,
    and electronic health record (EHR) tool use. These capabilities fail in different ways, and a narrow
    update for one task can degrade another. We present Cura 1T, a healthcare foundation model trained
    through recursive self-improvement (RSI). In each RSI round, the RSI harness runs the current model
    on healthcare benchmarks, evaluates the trajectories to locate capability gaps, and refines the training
    mixture by synthesizing training data. On 6 healthcare benchmarks, Cura 1T scores highest on MedAgentBench,
    HealthBench Professional, HealthBench Hard, MedXpertQA text, and AgentClinic, and second on MedXpertQA
    multimodal. It preserves performances on out-of-domain reasoning and agentic benchmarks including
    AIME, GPQA-Diamond, and $τ^2$-Bench.
