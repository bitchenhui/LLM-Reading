  abstract: Neural speech codecs have demonstrated their ability to compress high-quality speech and audio
    by converting them into discrete token representations. Most existing methods utilize Residual Vector
    Quantization (RVQ) to encode speech into multiple layers of discrete codes with uniform time scales.
    However, this strategy overlooks the differences in information density across various speech features,
    leading to redundant encoding of sparse information, which limits the performance of these methods
    at low bitrate. This paper proposes MsCodec, a novel multi-scale neural speech codec that encodes
    speech into multiple layers of discrete codes, each corresponding to a different time scale. This
    encourages the model to decouple speech features according to their diverse information densities,
    consequently enhancing the performance of speech compression. Furthermore, we incorporate mutual information
    loss to augment the diversity among speech codes across different layers. Experimental results indicate
    that our proposed method significantly improves codec performance at low bitrate.
