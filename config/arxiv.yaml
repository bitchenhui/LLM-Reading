# arXiv 检索 adapter 配置——按领域分类（domain）多 track 检索。
# video_image_coding 为核心域（core: true，深读优先）；其余域 v1 以 summary 级跟踪。
# 领域精度仍靠实体对齐打分（kb/entities/），关键词只是初筛。

tracks:
  - name: video_image_coding
    core: true
    search_query: '(cat:eess.IV OR cat:cs.MM) AND (abs:"video compression" OR abs:"video coding" OR abs:"image compression" OR abs:"image coding" OR abs:"video codec" OR abs:"image codec" OR abs:"neural compression")'
  - name: audio_coding
    threshold: 2
    search_query: '(cat:eess.AS OR cat:cs.SD) AND (abs:"neural audio codec" OR abs:"audio codec" OR abs:"audio compression" OR abs:"speech coding" OR abs:"speech codec" OR abs:"audio coding")'
  - name: streaming_delivery
    threshold: 2
    search_query: '(cat:cs.MM OR cat:cs.NI) AND (abs:"adaptive bitrate" OR abs:"adaptive streaming" OR abs:"MPEG-DASH" OR abs:"low latency streaming" OR abs:"low-latency video" OR abs:"WebRTC" OR abs:"Media over QUIC")'
  - name: quality_assessment
    threshold: 2
    search_query: '(cat:eess.IV OR cat:cs.MM OR cat:cs.CV) AND (abs:"video quality assessment" OR abs:"image quality assessment" OR abs:"VQA" OR abs:"IQA" OR abs:"no-reference quality" OR abs:"perceptual quality assessment" OR abs:"compression quality")'
  - name: processing_enhancement
    threshold: 2
    search_query: '(cat:eess.IV OR cat:cs.CV) AND (abs:"super resolution" OR abs:"post-filter" OR abs:"artifact removal" OR abs:"quality enhancement") AND (abs:"compression" OR abs:"coded video" OR abs:"codec")'
  - name: immersive_media
    threshold: 2
    search_query: '(cat:eess.IV OR cat:cs.CV OR cat:cs.GR) AND (abs:"point cloud compression" OR abs:"point cloud coding" OR abs:"NeRF compression" OR abs:"Gaussian splatting compression" OR abs:"light field compression" OR abs:"volumetric video" OR abs:"mesh compression")'
  - name: self_improvement
    threshold: 2
    search_query: '(cat:cs.AI OR cat:cs.LG OR cat:cs.CL OR cat:cs.NE) AND ((abs:"self-improvement" OR abs:"self-improving" OR abs:"evolution of heuristics" OR abs:"recursive self-improvement" OR abs:"AlphaEvolve" OR abs:"FunSearch") AND (abs:"large language model" OR abs:"LLM" OR abs:"language model"))'

page_size: 100          # 每页条数（arXiv API 上限内）
default_days: 30        # 无 --since/--days 时的回看窗口
per_track_max: 120      # 单 track 单次最多处理条数（防止泛化查询灌爆队列）

# 实体对齐打分：具体标准/实现是强信号；数据集/指标/概念/组织是弱信号
weights:
  codec_standard: 3
  implementation: 3
  dataset: 1
  metric: 1
  concept: 1
  org: 1

thresholds:
  pending: 3            # 默认门槛（核心域）：总分 >= 该值 → pending
  # 非核心域可在 track 上覆写 threshold: 2 —— 实体注册表尚薄的域先放行到 LLM 审阅层做精度过滤
