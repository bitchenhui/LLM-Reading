summaries:
  one_liner_zh: 修复10位编码与SMP/AMP代价计算，veryslow预设BD-BR(PSNR)降2.7%
  abstract_zh: 该版本无重大新特性，但包含多项关键修复，最显著的是10位编码修复以及SMP/AMP块的代价计算修正，使veryslow预设重新启用AMP。修复使veryslow预设整体BD-BR(PSNR)下降约1.2%，与v2.3.1的veryslow相比BD-BR(PSNR)下降2.7%，代价是编码速度降至0.77×。此外还改进了码率控制，修复y4m读取、--no-early-skip、无损模式误选skip等问题，并补充iOS、Android、Windows
    ARM64、emscripten等多平台构建修复。
assessment:
  relevance: high
  decision: summary_only
  reason: 正式补丁版但含实质压缩率改进（veryslow 预设 BD-BR 显著下降）与预设行为变化，属有实质内容的正式版，不构成架构级重大版本
