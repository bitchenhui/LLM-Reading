summaries:
  one_liner_zh: libavif v1.4.2 新增 gain map 工具多线程支持，修复色调映射与分层图像解码多项缺陷。
  abstract_zh: 该版本为 avifgainmaputil 新增 --jobs 多线程读写标志并启用自动 tiling，分层图像帧间编码改用 libaom 的 AOM_TUNE_IQ。编译要求提升至
    C11（公共头文件保持 C99），并同步更新 libaom v3.14.1、SVT-AV1 v4.1.0 等依赖。同时修复 gain map 色调映射 NaN 旁路与传递函数 11 缺陷、altICC
    内存泄漏、多层缩放 alpha 分层图像解码及 avifImageCopy 空指针解引用等多个问题。
