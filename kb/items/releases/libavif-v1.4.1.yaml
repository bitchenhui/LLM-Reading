summaries:
  one_liner_zh: 补丁版修复构建与内存泄漏，渐进式/分层编码等实验特性正式转正
  abstract_zh: libavif v1.4.1 修复 CMake 3.22 构建问题，支持 Windows 长路径名，并修复 avifgainmaputil 中的 CICP 管理与内存泄漏。同时将
    avifenc 的 --progressive、--layered、--scaling-mode 及 avifEncoder 的 extraLayerCount 从实验性状态转正，标志分层与渐进式
    AVIF 编码能力进入稳定阶段。依赖同步更新至 aom v3.13.2、libxml2 v2.15.2 及新版 libyuv。
