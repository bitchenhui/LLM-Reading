summaries:
  one_liner_zh: VVenC v1.13.1 修复 ARM/SIMD 与码控缺陷，x86 最低要求提升至 SSE 4.1，新增可选帧级用户数据 API 扩展
  abstract_zh: 本版本修复多项问题：ARM 平台非对齐 load/store、32 位 ARM SIMD 水平加法、FGA 行/列访问，以及启用 slice type adaptation
    时因统计缺失导致码率控制精度下降的 bug。兼容性方面，要求 x86(_64) 平台支持 SSE 4.1，并修复旧 x86 CPU 上因非法指令导致的库加载错误。此外允许链接外部 nlohmann_json，并新增默认关闭、保持
    API/ABI 兼容的可选扩展，支持随输入帧传递用户数据。
