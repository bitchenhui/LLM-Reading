summaries:
  one_liner_zh: VVenC v1.13.0 引入 ARM 优化、实验性胶片颗粒分析，中等预设提速 5%
  abstract_zh: VVenC v1.13.0 相较 1.12.1 新增多项 ARM 平台优化、DASH 场景的解码刷新模式 idr_no_radl 以及非 QPA 情形下的 GOP 自适应 QP
    级联，并引入实验性胶片颗粒分析功能。码控与 QPA 协同性改善（尤其 fast 预设），faster/fast/medium 预设内存占用下降；预设调优使 medium 提速 5%，slow/slower
    提速 2%。相较 rc1 仅移除 gcc_s 链接依赖。
