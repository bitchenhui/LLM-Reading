summaries:
  one_liner_zh: IAMF v1.1.0 完成比特流冻结，新增 Base-Enhanced Profile、CENC 加密与 9.1.6ch 等新布局。
  abstract_zh: IAMF（沉浸式音频模型与格式）发布 v1.1.0 正式版，于 7 月 1 日完成比特流冻结，是 v1.0.0 之后的首个规范大版本。新版本引入 Base-Enhanced
    Profile 定义、CENC 通用加密规范及 MixPresentationTags 语法语义，并新增 9.1.6ch 相关扩展扬声器布局与多语言服务用例。同时调整 leb128() 8 字节上限等比特流约束，并修正
    22.2 至 9.1.6ch 下混矩阵的错误系数。
