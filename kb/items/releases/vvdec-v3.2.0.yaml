summaries:
  one_liner_zh: VVC 解码器新增 ARM NEON/SVE 系列 SIMD 支持并强化码流健壮性与模糊测试
  abstract_zh: vvdec v3.2.0 为多数既有 SIMD 函数补齐 ARM NEON、NEON-RDM、SVE 与 SVE2 实现，并正确实现 ARM CPU 特性检测，同时向后兼容地扩展
    SIMD 扩展枚举。版本引入 libfuzzer 模糊测试基础设施，修复大量未定义行为、坏码流触发的内存越界与泄漏，并增加码流一致性检查。x86 SIMD 代码亦在合适处改用非对齐加载。
