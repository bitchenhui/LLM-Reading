summaries:
  one_liner_zh: libavif 1.1.1 修复 dimg 网格关联错误，增益图元数据对齐 ISO 21496-1 草案，并修复多处构建问题。
  abstract_zh: libavif v1.1.1 为 v1.1.0 之后的补丁版本，核心修复包括乱序 'dimg' 网格关联的正确性问题，以及将 gain map 元数据更新至 ISO 21496-1
    当前草案。同时对同一 item 出现在多个 'dimg' box 的文件改报 AVIF_RESULT_NOT_IMPLEMENTED（原为 AVIF_RESULT_INVALID_IMAGE_GRID），属于
    API 行为变化。其余改动集中于 Windows/clang-cl 编译修复与 CMake 构建系统完善。
