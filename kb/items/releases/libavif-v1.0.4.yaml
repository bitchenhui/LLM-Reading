summaries:
  one_liner_zh: 补丁版本，修复 alpha 平面错误释放、动画 chunk 跳过优化缺陷及网格 alpha item ID 选择问题。
  abstract_zh: libavif v1.0.4 为稳定性修复版本。主要修复三处缺陷：解码 tile 像素格式与输出图像像素格式不匹配时 alpha 平面被错误释放；写入动画数据时相同 chunk
    跳过优化出错；解码含辅助 alpha 图像 item 的 tile 网格时人工网格 alpha item 的 ID 选择错误。此外构建选项 AVIF_ENABLE_WERROR 默认改为 OFF。
