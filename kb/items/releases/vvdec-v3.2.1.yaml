summaries:
  one_liner_zh: VVDec 3.2.1 修复五个安全漏洞与多项内存安全问题，新增 ARM NEON 解码优化。
  abstract_zh: VVDec 3.2.1 修复五个安全漏洞（use-after-free、堆越界读、未受信指针解引用、整数溢出堆溢出）及更多由损坏码流触发的内存安全问题。该版本增强码流校验，拒绝重叠/不完整切片覆盖、越界子图数、超过10bit位深等非法码流，并修复单线程死循环与不完整编码图像挂起问题。此外新增
    ARM NEON 实现，覆盖反量化、色度角度帧内预测和逆 LFNST。
