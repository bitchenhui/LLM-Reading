summaries:
  one_liner_zh: VVenC 1.12.0 新增封顶恒定质量模式 CQF 与自动多线程配置，faster 预设提速约5%。
  abstract_zh: 本版本新增封顶恒定质量模式（CQF），在固定 QP 结合 QPA 与最大码率约束时启用；simple app 增加单色视频支持。多线程选项改为自动配置以改善扩展性（simple
    app 默认开启、FF-app 默认关闭，可用 mtprofile 禁用），编码结果将随线程数变化。此外 faster 预设速度提升约5%。
