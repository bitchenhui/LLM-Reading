summaries:
  one_liner_zh: VVenC v1.13.1-rc1 修复 ARM/x86 平台兼容性问题，并将 SSE 4.1 设为 x86 最低要求
  abstract_zh: VVenC v1.13.1-rc1 为补丁级候选版本，主要修复 ARM 上的非对齐访存、32 位 ARM SIMD horizontal add 以及旧 x86 CPU 库加载时的非法指令错误等平台兼容性问题。同时将
    x86(_64) 架构的最低指令集要求提升至 SSE 4.1，并修复了启用 slice type adaptation 时码控缺少统计信息导致精度下降的 bug 及 FGA 的 row/cols
    访问问题。
