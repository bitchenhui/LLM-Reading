summaries:
  one_liner_zh: SVT-AV1 3.0.1 修复 Arm 与 x86 输出不一致、内存泄漏及整数溢出，API 修复已合入 FFmpeg 与 GStreamer。
  abstract_zh: SVT-AV1 v3.0.1 为 3.0 系列的编码器清理与缺陷修复版本：进一步增强 Arm 平台并修复 Arm 与 x86 输出不一致问题，同时修复 compute_global_motion
    内存泄漏、subpel search 整数溢出及若干未定义行为。针对上一版 API 变更的适配修复现已可用，FFmpeg 与 GStreamer 已合入相关修复。已知问题包括 macOS M1 上配合
    libavif 的 avifsvttest 偶发 SIGTRAP。
