summaries:
  one_liner_zh: 修复线程池死锁并解除64线程限制，启用AVX2到NEON转译，提升播放能效与CPU利用率。
  abstract_zh: vvdec v2.2.0 修复 simd-everywhere 中的缺陷，从而启用 AVX2 到 NEON 的指令转译，扩展了对 ARM 平台的优化支持。同时修复线程池死锁并移除
    64 线程数量上限，通过播放时休眠空闲线程降低功耗。此外将默认解析延迟提升至 1.5 倍线程数以改善 CPU 利用率，并修正长期参考图像的 POC 设置及若干小问题。
