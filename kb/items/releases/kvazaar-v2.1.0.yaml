summaries:
  one_liner_zh: Kvazaar 2.1.0：许可证改为 BSD-3，新增 AVX2 插值优化与 Y4M 输入支持
  abstract_zh: Kvazaar v2.1.0 将许可证从 LGPL2.1 变更为 3-Clause BSD，放宽了使用限制。新特性包括快速码率估计权重自定义表及配套采样工具、Y4M 输入自动检测支持、调试用块统计输出，并为插值滤波器新增
    AVX2 实现。同时修复了 GOP 下序列起始 DTS 偏移错误、VPS 缺少重排序/缓冲信息导致的 VLC 播放问题，以及 mingw 与 FreeBSD 构建问题。
