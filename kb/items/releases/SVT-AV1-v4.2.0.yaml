  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: RTC 支持运行时动态调整 MG 尺寸、preset、码率与帧率，并优化小分辨率内存占用
  confidence: reported
  evidence: abstract（初筛，未读全文）
