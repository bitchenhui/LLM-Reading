  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 修复 superres 重编码崩溃、RTC 码控竞态、越界读、内存泄漏等缺陷，并新增 NVTX 性能剖析钩子
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 新增 TUNE-VMAF 模式与 RTC CBR 码控/LTR API，重构熵编码，VMAF BD-rate 目标提升约15%。
  abstract_zh: SVT-AV1 v4.2.0 在 VOD/RA 侧新增 TUNE-VMAF 模式（目标约15% VMAF BD-rate 改进、PSNR 损失极小）、原始 OBU 输出及多项新
    CLI 选项；RTC/低延迟侧引入基于卡尔曼滤波 QP 估计的 CBR 码控、循环刷新、动态参数调整以及带 LTR 支持的参考帧管理 API。编码器核心重构了熵编码与 CDEF/MD/ME 优化，并为
    Arm 补充 NEON 变换、SAD 及 SVE2 VMAF 等内核，另修复多处崩溃、UB 与内存泄漏问题。
