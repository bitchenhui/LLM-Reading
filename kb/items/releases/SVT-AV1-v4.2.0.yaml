  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 新增 CLI 选项 --cqp、--enable-intrabc、--hbd-mds、--enable-kf-tf，并支持原始 OBU 输出格式
  confidence: reported
  evidence: abstract（初筛，未读全文）
