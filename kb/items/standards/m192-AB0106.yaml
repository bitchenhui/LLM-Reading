  one_liner_zh: 对VVC中结合参考图像重采样（RPR）的CNN超分辨滤波方案（EE1-2.2）实验结果进行交叉核查。
  abstract_zh: 该文档为腾讯在2022年10月美因茨JVET会议提交的交叉验证（crosscheck）报告，核查提案JVET-AB0077即探索实验EE1-2.2的结果。其主题方向是在VVC框架下验证采用CNN滤波实现超分辨率并具备参考图像重采样（RPR）功能的技术方案，属于VVC后续增强探索中神经网络工具研读流程的独立验证环节。
