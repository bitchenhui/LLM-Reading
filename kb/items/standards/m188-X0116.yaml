  abstract_zh: 该文档是爱立信向 JVET（2021 年 10 月远程会议）AHG10 提交的测试条件修改建议，主张对 HM 与 VTM 参考软件的 CTC 低时延配置启用 GOP 基时域滤波。若被
    AHG 采纳，将改变低时延场景下测试锚点的生成方式，影响后续工具评估的基线。
