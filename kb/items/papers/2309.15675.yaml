summaries:
  one_liner_zh: 构建含21个参考网格、945个失真样本的带纹理静态网格质量评估数据库SJTU-TMQA，通过主观实验获取MOS并评测13种客观指标
  abstract_zh: 带纹理静态网格已成为动画、游戏、医学影像和文化遗产等领域的主流三维数字表示，但针对其质量评估的研究匮乏，制约了网格压缩与增强等面向质量的应用发展。本文构建了大规模带纹理网格质量评估数据库SJTU-TMQA，包含21个参考网格和945个失真样本。网格被渲染为处理后的视频序列并开展主观实验获得平均意见得分（MOS），通过内容多样性与MOS精度验证了数据库的异构性与可靠性。论文展示了各类失真对人眼感知的影响，并在该数据库上评测了13种最先进客观指标，最高相关系数仅约0.6，表明亟需更有效的客观质量指标。数据库已在项目页面开源。
