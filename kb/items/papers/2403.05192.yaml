summaries:
  one_liner_zh: 从采集到播放的全链路视角，综述尽力而为网络下基于客户端 ABR 与 CDN 的长视频流传输研究。
  abstract_zh: 该文以务实视角综述流媒体最新进展，聚焦在尽力而为互联网上经由客户端自适应码率（ABR）算法并借助 CDN 辅助分发长篇二维视频的主流范式，并附带教程性材料。与既有碎片化综述不同，它给出从设备采集到用户播放的完整端到端流水线视角，覆盖摄入、处理与分发三个阶段，讨论视频压缩、上传、转码、ABR
    算法、CDN 支持与体验质量（QoE）等关键问题。作者系统评述了 200 余篇论文，按问题求解方法论将流媒体设计分为直觉启发式、形式化优化与机器学习三类，并按兼容编解码器、是否使用超分辨率等特征进一步刻画。综述还将研究与商用流媒体平台实践相联系，并总结当前趋势与未来方向。
