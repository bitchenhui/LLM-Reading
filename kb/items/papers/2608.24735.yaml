summaries:
  one_liner_zh: 固定元操作Ω并对输入递归生成逐层升高的策略与工具库，在八个基准族上超越既有自我改进智能体。
  abstract_zh: 现有自我改进LLM智能体只改进答案而非产生答案的过程：加元层的系统会固定该层级，编辑自身的系统必须保留部分编辑机制不动，实际元深度被限制在约2。Meta^n保持元操作Ω固定而对输入递归：Ω反复应用于自身产物，读取下方求解器栈的轨迹与生成代码，将下一层写为策略性预处理和可调用辅助函数库。由于Ω永不改变，系统不会失稳；输入严格增长使每层从更高视角推理，深度由收敛决定而非预设，并用进化档案搜索层链。在两个LLM骨干上，Meta^n在全部八个基准族上超越既有自我改进智能体；在专为抵抗技能记忆化设计的ARC-AGI-2上，唯有它得分高于零。消融表明递归收益主要来自层间传递的条件，且各层角色随深度涌现分化而无需提示词规定。
