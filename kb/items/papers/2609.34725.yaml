summaries:
  one_liner_zh: 用预训练视频生成先验以轻量 LoRA 适配器增强现有编码器重建，不改码流即可大幅提升感知与率失真性能。
  abstract_zh: 提出 Gen2-VC 框架，以原生编码器重建作为共享接口，用预训练视频生成先验（Wan2.1-T2V-1.3B）对学习式与传统编码器输出进行生成式精修，完全保留原码流与参考帧更新流程。编码器、VAE
    与生成骨干全部冻结，仅训练轻量 LoRA 适配器，先做单帧空间适配再做多帧时序适配。Gen2-VC-DCVC-UF 在 LPIPS/DISTS 上优于此前领先编码器，并据称是首个在低码率下 PSNR
    与 MS-SSIM 均超越 VTM-23.0 的生成式视频编码器（六数据集 BD-rate 均值）。相对 VTM-23.0，在匹配 LPIPS 与 DISTS 下平均分别节省码率 86.65% 与
    94.24%；且仅在 DCVC-UF 上训练的适配器无需重训练即可提升 DCVC-RT、ECM、VTM、HM 的感知质量。
  deep_dive: docs/auto/2609.34725.md
