summaries:
  one_liner_zh: 双框架 LLM 智能体自主搜索并设计基础模型架构，发现的 AIRAformer/AIRAhybrid 在 1B 规模超越 Llama 3.2。
  abstract_zh: 论文提出双框架方法：AIRA-Compose 以 11 个智能体在 24 小时预算内进行高层架构搜索，将百万参数级候选外推到 350M、1B、3B 规模，产出 14 个架构（AIRAformers
    与 Transformer-Mamba 混合的 AIRAhybrids 两个家族）。1B 规模预训练后，这些架构在下游任务上持续超越 Llama 3.2 与 Composer 基线，AIRAformer-D
    和 AIRAhybrid-D 分别提升准确率 2.4% 和 3.8%。扩展效率上，AIRAformer-C 扩展速度比 Llama 3.2 和 Composer 最佳 Transformer 快
    54% 与 71%，AIRAhybrid-C 扩展性超出 Nemotron-2 与 Composer 最佳混合架构 23% 和 37%。AIRA-Design 则让 20 个智能体撰写新颖的长程注意力机制与训练脚本，在
    Long Range Arena 上距人类 SOTA 仅差 2.3% 与 2.6%，并在 Autoresearch 基准上以 0.968 验证 bits-per-byte 超过已发表最低值。结果表明
    LLM 智能体可自主发现匹配或超越人工设计的架构与算法优化，是迈向递归自我改进的清晰一步。
