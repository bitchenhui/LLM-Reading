summaries:
  one_liner_zh: 借鉴LLM权重量化思想，用随机FWHT旋转加6比特Lloyd-Max量化与1比特残差校正实现单线程CPU实时音频压缩。
  abstract_zh: 传统有损音频压缩依赖心理声学建模与频域表示（如MP3、AAC、Opus），计算复杂且领域专用。AudioTQ受LLM权重量化技术（TurboQuant框架）启发，直接在时域工作，用随机化快速Walsh-Hadamard变换（FWHT）正交旋转将易变的时域幅度均匀化为可预测的标准正态分布。在此基础上使用离线训练的MSE最优6比特Lloyd-Max标量量化器，并叠加1比特QJL残差校正层，7比特虚拟索引打包进原生8比特容器以对齐CPU寄存器边界，无需硬件并行加速器即可单线程实时执行。论文给出24比特录音棚音轨的逐比特重建细节、FWHT蝶形网络分析以及稀疏输入下的数学失效模式推导，基准测试显示物理体积最多缩减74.4%，SQNR约30
    dB。
