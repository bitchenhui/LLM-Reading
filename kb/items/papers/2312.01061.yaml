summaries:
  one_liner_zh: 提出SINR，将隐式神经表示引入CASSI高光谱重建，实现连续光谱超分与任意波段数输出。
  abstract_zh: 针对编码孔径快照光谱成像（CASSI）从2D压缩测量重建3D空间-光谱信号的 任务，现有方法仅映射到预定离散光谱波段，忽略了光谱信息的连续性。本文提出光谱维隐式神经表示（SINR），实现连续光谱放大重建，支持可自定义放大倍数的光谱超分辨率。方法将各光谱通道视为独立token的光谱注意力机制捕获全局光谱依赖，并用傅里叶坐标编码器强化高频成分、用光谱尺度因子模块适配可变的光谱通道数，从而支持任意数量的输出光谱波段。大量实验表明SINR优于基线方法，是将INR引入CASSI重建领域的初步尝试。
