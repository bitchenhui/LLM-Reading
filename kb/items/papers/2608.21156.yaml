summaries:
  one_liner_zh: 提出图工程新范式：以动态演化图结构组织多智能体系统，实现从个体智能到系统智能的跃迁
  abstract_zh: 论文回顾LLM从语言生成器演化为自主智能体的过程，梳理提示工程、上下文工程、线束工程与循环工程等范式，其中循环工程支撑持续反思与自我改进。作者指出个体智能存在根本上限：复杂任务需要异构专长、相互依赖子任务、并行执行、独立验证与持久状态，超出单个智能体的组织能力，仅增强单智能体的能力或上下文无法解决这一架构错配。据此提出系统智能概念，即智能体系统将多个智能组件组织协调为追求共同目标的连贯自适应整体的能力。进而引入图工程范式：构建表示任务、智能体与系统状态的显式动态演化图结构，为组织复杂目标、编排异构智能体、建模系统动态与支持可扩展智能体进化提供统一基础，并系统综述其原理、方法与应用。
