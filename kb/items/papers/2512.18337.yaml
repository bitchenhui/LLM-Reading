summaries:
  one_liner_zh: 提出AgentInfer框架，以双模型协作、缓存感知调度、后缀自动机投机解码与语义压缩协同加速LLM智能体，减少50%以上无效token并提速1.8-2.5倍
  abstract_zh: 论文指出LLM智能体的部署瓶颈不在单次推理，而在多轮推理循环、上下文增长与异构工具交互累积的系统性延迟，提出端到端加速框架AgentInfer。框架由四个协同模块组成：AgentCollab通过大/小模型动态角色分配实现分层双模型推理；AgentSched是面向异构请求模式的缓存感知混合调度器；AgentSAM基于后缀自动机的投机解码复用多会话语义记忆实现低开销加速；AgentCompress在不打断推理的情况下异步蒸馏与重组智能体记忆。这些模块共同构成自我进化引擎，在长程推理任务中维持效率与认知稳定性。在BrowseComp-zh和DeepDiver基准上，无效token消耗降低超过50%，整体提速1.8-2.5倍且精度保持。
