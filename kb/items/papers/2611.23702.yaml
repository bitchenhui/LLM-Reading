summaries:
  one_liner_zh: 融合主题相关性、时效、作者研究历史与合作网络的多源证据论文发现工具，定位为文献知情 RSI 工作流的上游组件。
  abstract_zh: 该工具让用户指定主题、优先级、排除项与日期范围，系统整合主题相关性、时效性、作者研究历史、合作路径与方向性机构上下文，生成个性化阅读优先级，并公开各评分组件及其支撑来源。自动获取、版本合并与图缓存复用使常规使用无需大语言模型（LLM）推理。在
    174,640 条获取记录上的实验显示，重复上下文准备提速三倍以上；启用缓存摘要后，专家评判检索任务的 NDCG@10 从 0.412 提升至 0.598。配套累积记录还支持语义检索、研究历史建模与文献知情规划等分析，并通过浏览器界面与结构化
    CLI 同时服务研究者与研究智能体。
