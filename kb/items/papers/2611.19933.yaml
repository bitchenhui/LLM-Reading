summaries:
  one_liner_zh: 免训练自进化智能体框架，以证据校验与分层经验记忆提升知识型视觉问答表现
  abstract_zh: 论文提出 SAGE-VQA，一个免训练的智能体框架，将证据校验与经验演化结合，用于知识型视觉问答（KB-VQA）。其核心为证据驱动自适应推理（EDAR）策略：通过协同校验的视觉定位模块获取并验证与问题相关的细粒度视觉信息，为后续推理提供接地证据，抑制感知误差引发的幻觉。同时引入自进化分层记忆（SHM）机制，将经验按陈述性与程序性两类组织，通过反馈在不更新模型参数的情况下持续精炼复用。实验显示该方法优于基于轻量开源
    VLM 与闭源 VLM 的竞争方法，并可作为即插即用推理框架接入现有 VLM 而无需修改其架构。
