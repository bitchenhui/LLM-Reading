summaries:
  one_liner_zh: 借鉴SoundStream神经音频编解码架构，实现移动端可运行、低延迟流式语音转换，支持通话中匿名化等场景。
  abstract_zh: 论文提出StreamVC，一种流式语音转换方案，可在保留源语音内容与韵律的同时匹配任意目标语音的音色。与以往方法不同，它能在移动平台上以低延迟从输入信号直接生成目标波形，适用于通话、视频会议等实时通信场景，并可用于语音匿名化。设计上复用SoundStream神经音频编解码器的架构与训练策略，实现轻量高质量语音合成。作者验证了因果式学习软语音单元的可行性，并证明输入白化的基频（F0）信息可在不泄露源音色的前提下提升音高稳定性。
