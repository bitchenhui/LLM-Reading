summaries:
  one_liner_zh: 将递归自我改进形式化为参数-上下文协同演化，提出COEVO框架在共享反馈环中同步更新模型参数与上下文引导。
  abstract_zh: 递归自我改进（RSI）现有路线或通过在线学习更新模型参数，或通过搜索、反思与提示优化改进外部上下文，二者通常被独立研究。COEVO 将 RSI 形式化为参数-上下文协同演化问题，在共享反馈环中基于
    on-policy 经验更新模型参数，并根据演化中策略的状态自适应调整上下文引导，以策略熵与提示条件化注意力作为互补调节信号。实验表明 COEVO 的任务性能一致优于固定上下文的强化学习，且产生的策略对系统提示变化更鲁棒。作者据此主张外部上下文应被视为
    RSI 的自适应组成部分而非固定接口。
