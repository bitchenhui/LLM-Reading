summaries:
  one_liner_zh: 提出自恢复渐进分辨率框架SelfLift，免训练实现少步扩散可靠的晚期升分辨率，端到端延迟降41.5%/44.1%。
  abstract_zh: 少步扩散模型中单次评估的空间计算已成为推理延迟主导来源，渐进式分辨率推理先低分辨率去噪再高分辨率精修，但现有方法直接提升中间潜变量、分布失配需后续步骤吸收，在少步场景留下可见伪影。SelfLift从生成模型自身导出过渡修复信号与轨迹对齐监督：SelfLift-zero提出免训练的伪影感知一致性提升，将直接潜变量提升与像素VAE重编码之间的分歧同时用作局部伪影风险信号和模型原生修正方向，无需外部超分、额外去噪器评估或采样日程修改即可支持可靠的晚期分辨率过渡。SelfLift-rich在此基础上对学生访问状态执行在策自恢复，从内部自教师迁移密集高分辨率引导。在FLUX.2-Klein与Z-Image-Turbo上端到端延迟分别降低41.5%与44.1%；结合时间步蒸馏，相对对应50步模型整体加速29.61倍与19.21倍，同时保持有竞争力的生成质量。
