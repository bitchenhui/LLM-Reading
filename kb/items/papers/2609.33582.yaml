summaries:
  one_liner_zh: 将掩码修复扩散Transformer复用为真实图像超分，无需额外空间分支，支持至QHD的混合分辨率与可预测显存。
  abstract_zh: 论文提出Fill2SR，将掩码图像修复扩散Transformer重新用于真实世界图像超分辨率，省去ControlNet式分支与空间条件token。其IIEA适配器把低质量观测写入原生掩码图像槽位，在整图掩码下将修复任务转化为以退化为条件的逆向整流流，仅用LoRA微调。另提出RCDT离线流水线，从非配对真实图像蒸馏退化描述子，并用冻结开源模型迁移到干净目标图像。模型支持混合分辨率训练至QHD，在512/1024/2048输出上性能稳定：基础模型在DIV2K与LSDIR上取得最佳LPIPS，加入RCDT后以小幅LPIPS下降换取RealLQ250与RealPhoto60上更强的无参考质量。1536²推理可在单张32GB
    GPU上运行，并可通过分块修复扩展到多兆像素输出。
