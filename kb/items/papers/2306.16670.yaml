summaries:
  one_liner_zh: 提出融合与编码交织的端到端多尺度特征压缩模型，BD-rate较先前方法至少降52%，编码时间减少5–27倍
  abstract_zh: 论文针对MPEG-VCM特征压缩轨道，指出基于VVC的方案虽相对MPEG-VCM特征锚点最高可降96% BD-rate，但VVC并非为提取特征设计且编码复杂度高、难以轻量化。作者将可学习压缩器与多尺度特征融合网络结合，以交织方式交替执行编码与融合：先编码较大尺度特征得到潜在表示，再与更小尺度特征融合，逐级处理直至最小尺度后对最终潜在表示进行熵编码传输。该设计可在提取特征上端到端优化并支持轻量编码器，在目标检测任务上较先前方法至少取得52%
    BD-rate降低，编码时间减少5至27倍。
