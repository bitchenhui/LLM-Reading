summaries:
  one_liner_zh: 提出 RecurSE，以裁判-检查器协同进化在 RL 奖励中消除外部金标监督，实现可早停的有界 LLM 裁判自改进。
  abstract_zh: 针对改进 LLM-as-judge 通常依赖昂贵标注、奖励模型或强教师蒸馏的问题，该文在 RL 训练奖励中去除外部金标监督，由模型自身评估能力生成学习信号，构成'有界递归自改进（RSI）'闭环
    RecurSE。方法上，Pass 1 让可训练裁判按逐条规则评估候选回答，Pass 2 由同步的策略副本检查器依元规则审计裁判推理并给出标量过程奖励；接口解耦将检查器标量分数与裁判判定 token
    结构性隔离，消除膨胀自奖励的 token 复制捷径。针对无锚定递归学习天然有界的问题，提出 Pairwise Advantage Validity（PAV）作为无偏验证监视器，联合跟踪裁判准确率与检查器保真度以定位最优早停窗口。在
    Qwen3.5-9B、Gemma-4-E4B-it、Qwen3.6-27B 上，RecurSE 在医学、成对比较、摘要与专业等留出基准上取得一致泛化收益；消融显示同步裁判-检查器协同进化优于冻结检查器、外部元裁判、自一致性与规模化教师蒸馏，其裁判筛选的偏好对还可增强下游策略对齐。
