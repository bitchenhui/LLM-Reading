claims:
- statement: 将MAS优化目标分解为两类信用信号：用状态空间瓶颈做时序信用（识别关键轮次），用稳定角色策略做结构信用（隔离智能体贡献），从而解缠误差信号、降低黑盒探索的高方差。
  confidence: reported
