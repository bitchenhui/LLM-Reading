- statement: 提出离散化、言语化的块坐标下降算法，交替优化角色提示与聚合协议，借助LLM生成的"代理梯度"只针对识别出的薄弱环节更新；在多个推理基准上显著降低查询复杂度并提升性能。
  confidence: reported
