summaries:
  one_liner_zh: 提出时序与结构双轴信用分配，以块坐标下降迭代优化多智能体LLM的角色提示与聚合协议，实现自改进。
  abstract_zh: 针对LLM多智能体系统（MAS）计算图离散不可微、全局监督信号稀疏导致黑盒优化器难以定位局部故障的问题，作者提出沿两个轴分解优化目标：时序信用用状态空间瓶颈识别关键轮次，结构信用用稳定角色策略隔离各智能体的贡献。基于分解后的信号，引入离散化、言语化的块坐标下降算法，交替优化角色提示与聚合协议，利用LLM生成的"代理梯度"只更新被识别的薄弱环节。在多个推理基准上，该方法显著降低查询复杂度并提升性能，为自改进MAS提供了有原则、可解释的路径。
  deep_dive: docs/auto/2605.30227.md
