summaries:
  one_liner_zh: IT/IST/IPLeiria 向 JPEG Pleno 点云编码 CfP 提交深度学习点云编解码器，几何编码性能超 G-PCC、可比 V-PCC。
  abstract_zh: 本文是 IT/IST/IPLeiria 团队对 2022 年 1 月发布的 JPEG Pleno 点云编码提案征集（CfP）的应案，提出两款基于深度学习的点云编解码器：一款纯几何编解码器和一款几何与颜色联合编解码器。所提编解码器基于近期深度学习点云几何编码进展构建，并支持
    CfP 要求的部分关键功能。在 JPEG CfP 测试集上，几何编解码器的压缩效率优于 MPEG G-PCC 标准，并优于或与 V-PCC Intra 标准相当。几何与颜色联合编解码器受质量饱和效应影响未能取得同等压缩性能，该问题尚待克服。
