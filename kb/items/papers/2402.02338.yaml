summaries:
  one_liner_zh: 首个LLM网络适配框架NetLLM，在视点预测、ABR流媒体与集群调度上显著超越现有SOTA算法。
  abstract_zh: 该文提出NetLLM，首个将大语言模型统一适配到网络任务的框架，旨在借助预训练知识实现"一个模型服务多任务"并获得更强泛化能力。框架设计了网络多模态数据的编码处理方式与任务专用答案生成机制，并通过低成本微调显著降低领域知识适配开销。在视点预测、自适应码率流媒体（ABR）和集群作业调度三个用例上，NetLLM适配的LLM显著优于现有最先进算法。
assessment:
  relevance: medium
