summaries:
  one_liner_zh: 提出两阶段合成数据框架Condor（世界知识树+自反思精炼），20K样本即可超越同类，并支持至72B规模的LLM迭代自改进。
  abstract_zh: 高质量SFT数据是提升LLM对话能力的关键，但随着模型进步，人工标注数据日益稀缺，合成数据成为必然选择。论文提出Condor两阶段合成数据生成框架：第一阶段以'世界知识树'组织知识驱动的大规模数据生成，第二阶段以'自反思精炼'提升数据质量。实验表明，仅用20K条Condor生成的样本微调基础模型即可优于同类方法。额外的精炼阶段使各规模（最高72B）的LLM实现迭代自改进；对后训练中合成数据规模化的分析还揭示了可观的性能提升空间。
