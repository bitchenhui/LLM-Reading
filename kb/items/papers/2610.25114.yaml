summaries:
  one_liner_zh: 强模型离线编写并修复具身操作技能，冻结为可移植代码后由廉价调用器运行，验证技能级RSI的增益。
  abstract_zh: 提出技能级递归自我改进 Skill-RSI：强通用模型仅作离线作者，在仿真中编写、运行、诊断并修复操作技能直至通过冻结后抽取布局上的考试，技能随后以纯代码或廉价调用器独立运行。在
    7 个 RoboTwin 2.0 杂乱桌面任务上，Claude Code 将 4 个任务编译为 7 个冻结技能，其中 5 个首稿即通过资格考核，单技能作者成本 4.29-8.22 美元（计入 13
    次失败活动约 55 美元/技能），其余 3 个任务在 18 次活动中未编译成功。隐藏布局上，继承前版本的修复在 8/8 受控活动中优于从零重写（sign test p=0.004）。冻结技能在新布局上无模型时保持
    148/150 成功，配 DeepSeek-flash 调用器为 147/150，每回合成本 0.00028-0.00054 美元。
