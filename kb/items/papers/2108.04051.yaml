summaries:
  one_liner_zh: 改造StyleMelGAN为流式GAN声码器，从1.6 kbit/s参数生成宽带语音，胜过LPCNet、媲美5.9 kbit/s的EVS。
  abstract_zh: GAN声码器在语音合成中的感知质量与生成速度已超越自回归模型，但极低码率语音编码此前仍惯用自回归声码器。本文对StyleMelGAN进行改造，使其可逐帧运行，从1.6 kbit/s的编码参数流式生成宽带语音波形，适合流式应用。实验表明该模型在极低码率语音编码上显著优于LPCNet等自回归声码器，计算量约5
    GMACs，为该领域建立了新的最优水平。在干净语音上其质量可与5.9 kbit/s的先进语音编解码器EVS相竞争，支持前馈全卷积模型进一步用于低码率语音编码。
