summaries:
  one_liner_zh: 提出FlowBoost闭环生成框架（流匹配+奖励引导+局部搜索），在圆堆积等问题上改进已知下界并超越AlphaEvolve。
  abstract_zh: FlowBoost是一个闭环生成式框架，由几何感知条件流匹配模型、带动作探索的奖励引导策略优化、以及用于训练数据生成与最终精修的随机局部搜索三部分组成，用于发现稀有极值几何构型。与PatternBoost等开环方法不同，也不同于依赖冻结LLM的AlphaEvolve，FlowBoost在采样阶段强制几何可行性并将奖励信号直接传播进生成模型，从而闭合优化循环。该方法所需训练集更小、训练时间更短，外层迭代次数减少数个数量级，且摆脱了对LLM的依赖。在超立方体球堆积、最大化半径和的圆堆积、Heilbronn三角形与星偏差最小化四个几何优化问题上，多数结果匹配或超越已知最优。圆堆积问题上FlowBoost改进了已知最优下界，在显著更少算力下超过AlphaEvolve。
