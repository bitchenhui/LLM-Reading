summaries:
  one_liner_zh: 仅用VVC编码稀疏参考视图，解码端以LF-D2GAN合成并增强其余视图，BD-BR较SOTA降36.22%。
  abstract_zh: 论文提出一种光场图像编码方法：不再传输全部视图，而是仅选取稀疏的参考视图并用VVC标准编码，其余被丢弃视图在解码端合成。被丢弃视图的选取基于VVC时域可分级性的率失真优化完成。解码端采用LF-D2GAN（双判别器GAN）模型重建被丢弃视图，并施加质量增强流程以保证视图间质量一致、支持平滑导航。实验结果显示，该方法在BD-BR上较SOTA光场图像压缩方法降低36.22%，BD-PSNR提升1.35
    dB。
