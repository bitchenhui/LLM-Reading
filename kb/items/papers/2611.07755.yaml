summaries:
  one_liner_zh: 提出FFmpeg+Whisper+BART+Llama的视频转问答流水线，经自验证循环过滤后LoRA微调，实现无人工标注的自我改进。
  abstract_zh: 针对YouTube等平台海量教育视频的知识检索与测评需求，作者提出端到端自动流水线：用FFmpeg提取音轨，Whisper进行语音识别生成转写。为突破LLM token限制，转写被分段并用BART做摘要。核心创新是自验证与微调闭环：由Llama-3.1-8B-Instruct从转写片段生成候选问答对，再反馈给模型自评相关性与重要性，仅保留通过验证的高质量对构建合成数据集。该数据集经LoRA微调Llama得到能生成领域对齐测评题的专用模型，作者称无需人工标注即可构建自我改进的教育工具，模型与代码已在Kaggle和GitHub开放。
