summaries:
  one_liner_zh: 提出免训练采样器 MV-SDI，以K视角梯度平均降低单视角方差，冻结扩散先验提升3D分数蒸馏的质量与效率。
  abstract_zh: 分数蒸馏将预训练2D扩散模型转化为3D生成器，但其单随机视角的每步梯度估计方差高且忽略全局形状一致性。作者将采样轴与先验质量解耦、冻结扩散先验，提出免训练采样器 MV-SDI：在固定UNet调用预算下用K个视角的平均梯度替代单视角梯度，方差降至约1/K。进一步以对跖视角对采样（实测对跖相关ρ≈0）不额外降方差，但实现每步覆盖两半球的角度分层，消除独立采样的同半球聚集。在43条提示的SDI基准、10,000次UNet调用预算下，K=2使优化步数减半，CLIP
    R-Precision从74.8%升至83.8%，CLIP分数从0.297升至0.312，发散率0.0%；K=4实现四倍步数缩减，R-Precision达86.9%。增益集中在单视角蒸馏崩溃的困难提示上，代价为CLIP-IQA下降；方法可即插即用于SDI与朴素SDS，无需再训练或多视角数据。
