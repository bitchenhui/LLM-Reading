summaries:
  one_liner_zh: 提出BaseRSI范式：基础VLM将自身harness通过免训练编辑写入权重，在10个视觉推理基准上持续提升
  abstract_zh: 论文针对现有RSI的三大挑战（harness增益停留在基础模型之外、黑盒监督只读输出、编辑位置与强度预先固定），提出递归Harness内化（Recursive Harness
    Internalization）范式BaseRSI：基础模型先改进自身harness，再通过免训练编辑把harness带来的能力写入自身权重，并在自身响应上逐轮递归。为支撑该范式，提出ReGap机制，以harness在每个transformer块单独引入的高维激活差异作为监督信号，在低维子空间沿该信号更新块权重。进一步提出ReKey算法，通过回归将该信号写入每个块的少量key-value神经元，并在模型自身响应上度量每次编辑的位置与强度，不同位置的编辑可组合进单一检查点而无需重新拟合；整个递归仅靠前向传播即可由基础模型独立完成各角色。在十个视觉推理基准上，BaseRSI持续提升基础VLM在分布内与held-out基准上的表现。
  deep_dive: docs/auto/2611.24578.md
