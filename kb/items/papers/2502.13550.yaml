summaries:
  one_liner_zh: 将SQL生成重构为思维链推理过程，用正确结果筛选的推理微调LLM并辅以ORM验证器，Spider执行准确率达86.6%
  abstract_zh: 论文提出STaR-SQL，将文本到SQL生成重构为推理驱动过程：先提示LLM为SQL查询生成逐步思维链推理，再用能导出正确执行结果的推理样本对模型微调。该方法在推理时投入额外测试时计算，将LLM定位为自发推理器而非纯提示代理。为进一步扩展推理规模，引入结果监督奖励模型（ORM）作为验证器以提升SQL查询准确率。在Spider基准上执行准确率达86.6%，比少样本基线高31.6%，比直接预测答案的微调基线高18.0%，并超过使用GPT-4等闭源模型的代理式提示方法。
