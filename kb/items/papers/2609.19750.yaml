summaries:
  one_liner_zh: 提出DELUGE，利用物理模拟粒子的时间相干性与速度可预测性实现亚帧延迟实时粒子流压缩。
  abstract_zh: 针对社交VR与数字孪生中多人实时共享流体、烟雾、颗粒介质等物理模拟的需求，论文指出G-PCC(TMC13)与Draco等面向静态几何的点云压缩方法在动态粒子流场景下编码延迟超出帧周期。DELUGE通过三项互补技术利用物理模拟粒子固有的时间相干性与速度可预测性，实现亚帧级编解码。在动态点云数据集上，解码较G-PCC(TMC13)快约20倍、编码较Draco快约6倍。作者还构建了Web浏览器与Apple
    Vision Pro端到端客户端，通过被试内感知质量评估与双人协作任务研究验证了手部追踪流体交互的实时协作体验。
