summaries:
  one_liner_zh: 通过客观指标分析码率分配策略并以两种主观评估协议，首次对比MPEG与JPEG Pleno点云压缩标准的感知性能。
  abstract_zh: 该研究对MPEG与JPEG Pleno点云压缩标准进行了系统性性能评估，首次将JPEG Pleno标准与MPEG标准进行主观对比。作者先用客观质量指标分析不同配置参数对编解码器性能的影响，据此为每个编解码器定义三种码率分配策略，并在四个目标码率下压缩一组点云。随后按照两种主观质量评估协议对失真点云集进行主观评测，最终比较各压缩标准的性能并总结最佳编码实践。
assessment:
  relevance: high
  decision: summary_only
  reason: 点云压缩属沉浸式媒体（非核心视频/图像编码域），为MPEG与JPEG Pleno点云标准的主观质量对比评估，重要但按基准仅收录初筛。
