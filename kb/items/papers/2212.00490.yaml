summaries:
  one_liner_zh: 提出DDNM零样本图像复原框架，仅用预训练扩散先验并在反向扩散中细化零空间，即可统一解决超分、上色、修复等线性逆问题。
  abstract_zh: 现有图像复原（IR）模型多为任务特定，难以泛化到不同退化算子。本文提出去噪扩散零空间模型（DDNM），一种面向任意线性图像复原问题的零样本框架，覆盖超分辨率、上色、修复、压缩感知与去模糊等任务。DDNM
    仅需一个预训练的现成扩散模型作为生成先验，无需任何额外训练或网络修改；通过在反向扩散过程中仅细化零空间内容，得到同时满足数据一致性与真实感的多样化结果。作者进一步提出增强鲁棒版本 DDNM+，支持带噪复原并提升困难任务的复原质量。多项
    IR 任务实验表明 DDNM 优于其他最先进的零样本复原方法，DDNM+ 还能解决老照片修复等复杂真实应用。
