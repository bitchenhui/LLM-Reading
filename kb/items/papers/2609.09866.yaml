summaries:
  one_liner_zh: 全因果 48kHz 神经音频编解码器，用多专家残差矢量量化(ME-RVQ)扩展量化容量，实时流式编码语音/音乐/环境声。
  abstract_zh: UniStream 是面向流式语音、音乐与环境声的全因果 48 kHz 神经音频编解码器。其核心 ME-RVQ 用确定性 Top-K 路由控制的四个专家码本取代每层残差量化中的单一共享码本；路由决策仅依赖已解码的量化状态，解码端无需传输专家标识即可复现选择，仅增加
    5.5M 参数。训练时引入最优传输条件流匹配（OT-CFM）辅助目标正则化量化潜空间，推理时完全移除该模块、无运行时开销。系统支持 12 kbps Top-1 与 22.5 kbps Top-2
    两种模式并实现 GPU 实时推理：12 kbps 下 PESQ/UTMOS 与 EnCodec 相当且语音 Mel-D 从 13.07 降至 8.21；22.5 kbps 下 ViSQOL 语音/环境声模式达
    4.67/3.96，语音上与 24 kbps Opus 的 ViSQOL 差距不超过 0.03 MOS-LQO。消融实验证实 ME-RVQ 是质量提升的主要来源。
