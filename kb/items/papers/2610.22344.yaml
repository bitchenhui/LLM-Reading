summaries:
  one_liner_zh: 以层级智能体SFT与窗口化交互RL训练35B MoE模型MLExpert，MLE-Bench Lite奖牌率37.9%→72.7%
  abstract_zh: 论文面向AI for AI（AI4AI）与递归自我改进（RSI），提出面向长时程自主机器学习工程（MLE）优化的后训练方法，训练出35B混合专家（MoE）智能体模型MLExpert。作者构建Kaggle-MLE
    Factory生成可执行任务并设计模型主导实验的交互框架；层级智能体SFT以结果导向监督将通用工具使用与编码能力迁移到MLE。窗口化交互强化学习（WIRL）把相邻实验结果之间的多轮决策视为一个执行窗口并赋予共享的基于结果的奖励，配合异步轨迹收集与策略修正在轨迹结束前即可更新策略。在MLE-Bench
    Lite上，MLExpert将基座模型平均奖牌率从37.9%提升至72.7%，与Kimi-K3、GLM-5.3等更大前沿模型相当；在NatureBench Lite、智能体脚手架优化与算法优化上亦有提升，表明所学优化能力可泛化。
