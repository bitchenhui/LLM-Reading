summaries:
  one_liner_zh: 提出围绕快慢双修复时间尺度组织的物理接地 LLM 智能体 Mimir，在有界经验驱动自改进下控制长时程灌溉，较历史调度节水约 51%。
  abstract_zh: 针对长时程物理控制中动作改变未来状态、误差跨决策累积的挑战，提出 Mimir——围绕快慢两个修复时间尺度组织的物理接地 LLM 智能体。快时间尺度上，结构化物理接口与确定性仿真器将
    LLM 输出转为可数值检查、修订的提案，并执行有界确定性动作选择；慢时间尺度上，将反复出现的失败模式固化为持久上下文原则以约束后续提案，同时物理模型、评估器与执行约束保持不可变。在覆盖多站点、作物与年份的统一回溯评估下，Mimir
    取得所评估参考方法中最低的总控制成本，灌溉用水较历史调度重放减少约 51%。消融实验显示移除前向仿真、经验证的修订或持久上下文均会抬高控制成本，且增大 LLM 规模未带来单调收益。
