summaries:
  one_liner_zh: 提出SpatialQ框架，用VGGT编码器+质量头学习结构感知的3DGS场景质量表示，并结合Qwen多模态大模型进行接地推理评估。
  abstract_zh: 论文指出3DGS场景质量不仅取决于渲染视角的感知保真度，还取决于空间结构与跨视角一致性等场景级因素，而现有IQA方法依赖2D感知线索、通用MLLM难以稳定完成质量回归。为此提出3D感知质量表示学习框架：在VGGT编码器上增加专用质量头，将多视角图像编码为视角特征并聚合以捕捉跨视角一致性，并通过联合建模深度与点云相关结构信息引入几何线索，学习超越外观驱动的结构感知质量表示。同时构建接地的多模态推理机制，将原始图像、深度图、点云渲染图与相机参数联合输入基于Qwen的MLLM。摘要未给出具体定量实验结果。
