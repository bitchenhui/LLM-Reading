summaries:
  one_liner_zh: 系统研究跨任务洞见注入对智能体MLE系统的影响，提出防泄漏基准MLE-InsightBench与洞见组装智能体MLE-InsightForge。
  abstract_zh: 智能体机器学习工程（MLE）是面向复杂机器学习任务的AI4SE应用，被视为AI递归自我改进（RSI）的重要一步。针对现有系统洞见收集与注入零散、评估中洞见来源不受控而易数据泄漏的问题，作者系统研究相关MLE任务洞见对智能体MLE系统的影响。他们构建MLE-InsightBench基准，涵盖12个领域的160个Kaggle竞赛，每域留出1个目标竞赛，其余148个源竞赛仅在确认不受目标影响时才可用以防泄漏。同时开发MLE-InsightForge洞见组装智能体，从源竞赛、人类顶尖方案与writeup中构造12条领域洞见、148条竞赛洞见和16条改进洞见三类洞见，以按需技能（skill）或前置手册（playbook）两种方式注入。实验表明洞见使标准化私有测试分数较无洞见基线提升123.9%，三类洞见互补，skill整体比playbook更具成本效益，且收益可跨后端LLM泛化。
