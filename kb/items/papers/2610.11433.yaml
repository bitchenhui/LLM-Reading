summaries:
  one_liner_zh: 提出指标引导的动态损失控制器DLC，训练中由LLM依据质量指标动态重加权既有损失，在图像复原任务中平衡保真与感知质量。
  abstract_zh: 论文提出面向多目标图像复原训练的指标引导动态损失控制器DLC。DLC不修改复原网络结构、也不引入新的可微损失项，而是在训练过程中周期性地在固定反馈子集上评估当前模型，并通过基于LLM的控制器根据质量指标更新既有损失的权重向量。控制器与架构和损失项无关，可跨不同复原训练管线实例化。作者在低光照增强、去雨和真实世界超分辨率三个复原任务上验证，使用全参考与无参考质量指标评估。结果显示DLC能引导训练走向保真度与感知质量之间更均衡的工作点，可作为多目标复原训练的即插即用控制器。
