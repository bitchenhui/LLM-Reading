summaries:
  one_liner_zh: 提出沉浸式体视频新格式，构建多视点音视频数据集ImViD及高斯时空动态光场与声场重建管线，实现大空间6-DoF VR视听体验。
  abstract_zh: 论文定义了沉浸式体视频（IVV）这一新媒体格式，目标是在真实拍摄视频基础上提供大6-DoF交互空间、视听反馈及高分辨率高帧率动态内容。为此构建了基于面向空间采集理念的多视点多模态数据集ImViD，自研采集平台可在运动中同步采集多视点音视频，数据集为5K分辨率60FPS、时长1-5分钟，覆盖室内外复杂前景-背景交互与动态场景。在重建方面，提出基于高斯时空表征的动态光场框架，融合光流引导稀疏初始化、相机时间联合标定与多项目时空监督以稳健建模复杂运动，并据称首次提出从多视点视听数据重建声场的方法。VR沉浸实验表明该管线可生成高质量、时域稳定的大空间音视频体内容。
