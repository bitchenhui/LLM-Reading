summaries:
  one_liner_zh: 提出双阶段PTQ方法2DQuant，经分布导向边界初始化与蒸馏校准，在2比特量化下大幅超越现有超分量化的SOTA。
  abstract_zh: 该工作针对图像超分辨率（SR）模型的低比特部署问题，提出双阶段后训练量化方法2DQuant。作者分析发现SR模型的权重与激活分布呈现对称/非对称共存和长尾特征，第一阶段提出分布导向边界初始化（DOBI），采用不同搜索策略为量化器粗搜边界；第二阶段提出蒸馏量化校准（DQC），通过让量化模型向全精度模型蒸馏来精调量化器参数。实验表明仅DOBI即可达到SOTA，两阶段结合后在各比特位与缩放因子下指标与视觉效果均超越现有PTQ方法。
