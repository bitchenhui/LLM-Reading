claims:
- statement: SIFT以SPLADE稀疏编码器+LightGBM的廉价CPU管线服务分类，仅将低置信度少数页面升级给LLM裁判，裁判判定写回标注语料库，形成昂贵模型持续教学廉价模型的自反馈循环，升级率下降且精度随使用复合提升。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 接入新文档家族只需声明式配置包（标签空间、锚点短语、裁判术语表），无需预先开展标注工程。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 安全机制为两重晋升门：关键标签F1回归检查加上模型从不参与训练的冻结黄金回归集，任一门均可否决模型晋升，使无人值守的月度自动再训练变得常规化。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 该自改进循环使分类器的边际标注成本随生产流量增长趋向于零。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: SIFT用廉价SPLADE+LightGBM管线分类文档，LLM裁判判定回流标注语料驱动自再训练，冻结黄金回归集门控保障安全晋升。
  abstract_zh: SIFT是一种动态文档分类服务，采用刻意廉价的CPU管线（SPLADE稀疏编码器+LightGBM分类头）服务分类，仅将低置信度少数页面升级给LLM裁判裁决。裁判判定结果写回标注语料库，使昂贵模型持续教学廉价模型，升级率随使用下降、语料库从生产流量自然增长、精度随使用复合提升。接入新文档家族仅需声明式配置包（标签空间、锚点短语、裁判术语表），无需前期标注工程。针对自主再训练可能静默退化的风险，SIFT设计双重晋升门——关键标签F1回归检查加上永不参与训练的冻结黄金回归集，任一门可否决晋升，使无人值守的月度再训练成为常规，且边际标注成本趋向于零。
