summaries:
  one_liner_zh: 提出Robust-U1：SFT+双奖励强化学习让MLLM自恢复受损图像，联合推理实现鲁棒视觉理解
  abstract_zh: 针对多模态大语言模型在真实世界视觉退化下性能显著下降的问题，提出Robust-U1框架，赋予MLLM显式的视觉自恢复能力。方法分三阶段：先监督微调完成初步重建，再以像素级SSIM与语义级CLIP相似度构成双奖励的强化学习对齐高视觉质量，最后联合受损输入与恢复图像进行多模态推理。实验表明该方法在真实退化基准上达到SOTA鲁棒性，并在通用VQA基准的对抗退化下保持优越性能。分析证实高质量视觉恢复可直接提升推理性能，将自恢复确立为鲁棒视觉理解的关键机制。
