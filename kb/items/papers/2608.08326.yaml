summaries:
  one_liner_zh: StructReward用轻量步骤级对齐生成密集过程奖励，结合门控GRPO与rollout回收，实现高效自改进多模态推理。
  abstract_zh: 针对RLVR仅以最终答案二值奖励评估整体响应、丢弃中间推理监督的问题，作者提出StructReward框架：将生成解表示为推理步骤序列，用轻量的数值、符号与词法匹配规则与带过程标注的参考步骤对齐，聚合成密集过程奖励，并通过门控GRPO目标与最终答案一致性、输出有效性奖励结合。该方法进一步将策略rollout回收为响应比较与反思性自我纠正的补充监督，并用强LLM把采样的正确轨迹改写为反思导向训练实例。由于奖励在线计算、无需额外训练的验证器或外部LLM评判器，计算开销显著降低；实验表明结构化过程监督与rollout回收为自改进多模态推理提供了高效路径。
