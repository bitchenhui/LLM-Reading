summaries:
  one_liner_zh: 提出基于回顾式语言模型的多级反思合成框架，让LLM智能体以失败为中心进行自我学习改进
  abstract_zh: 针对LLM智能体因错误分析不足、依赖稀缺成功轨迹而难以生成有意义反思的问题，提出SAMULE自学习框架。其核心是多级反思合成训练的回顾式语言模型，涵盖三个互补层级：单轨迹学习（微观级纠错）、任务内学习（中观级跨多次尝试构建错误分类体系）、任务间学习（宏观级从同类错误中提取可迁移洞见），并微调该模型在推理时生成反思。框架进一步通过基于预见的反思机制扩展到交互场景，使智能体在用户交互中通过比较预测与实际响应来主动反思和适应。在TravelPlanner、NATURAL
    PLAN和Tau-bench三个挑战性基准上显著优于反思类基线，凸显了精心设计的反思合成与以失败为中心的学习对构建自改进智能体的关键作用。
