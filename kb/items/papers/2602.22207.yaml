summaries:
  one_liner_zh: 用USI自改进与T-RANK多轮排序实现基准数据集高质量自动翻译，覆盖8种东欧/南欧语言。
  abstract_zh: 论文提出一个全自动化框架，通过扩展测试时计算策略——Universal Self-Improvement（USI）和自研的多轮排序方法T-RANK——实现可扩展的高质量数据集与基准翻译。该框架在本地化过程中保留原始基准的任务结构与语言细微差异，避免语义漂移与上下文丢失。作者将流行基准与数据集翻译成乌克兰语、保加利亚语、斯洛伐克语、罗马尼亚语、立陶宛语、爱沙尼亚语、土耳其语、希腊语共8种语言。基于参考指标与LLM-as-a-judge的评估显示，其翻译质量超越现有资源，使下游多语言模型评估更准确，并开源了框架与改进后的基准。
