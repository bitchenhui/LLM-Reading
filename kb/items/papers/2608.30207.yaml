summaries:
  one_liner_zh: 黑盒自改进红队框架，迭代蒸馏注入原则攻破计算机使用代理，联合ASR达24–28%
  abstract_zh: 计算机使用代理（CUA）由视觉语言模型驱动，面临间接提示注入（IPI）风险，固定手写注入会低估自适应攻击者的威胁。论文提出 SIR，一个黑盒自改进红队框架：从可复用的自然语言红队原则库组合任务特定注入，并通过迭代反馈环分析失败攻击轨迹、蒸馏新的命名原则存入共享库跨任务复用。攻击以操作系统级破坏为目标，成功判定采用文件系统、服务和权限状态的确定性检查而非
    LLM 评审，且要求对抗目标与良性用户任务在同一执行中同时完成。在三个前沿 CUA、每个案例最多 10 次尝试下，SIR 在 Claude Opus 4.8 与 Gemini 3.5 Flash
    上分别取得 24% 与 28% 的联合攻击成功率，远超基准固定手写注入的 4% 与 0%；针对某一受害模型发现的原则无需额外反馈即可迁移至包括不同模型家族的其他受害模型。
