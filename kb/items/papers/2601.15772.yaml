summaries:
  one_liner_zh: 首个在2DGS压缩表示域内直接进行零样本无监督低照度增强的框架，免解压即增强并保持高压缩比
  abstract_zh: 现有低照度增强算法大多在像素域运行，处理2DGS压缩图像需经历'解压-增强-再压缩'流程，效率低下且引入二次劣化。该文提出LL-GaussianImage，首个直接在2DGS压缩表示域内进行零样本无监督低照度增强的框架。方法上设计语义引导的混合专家（MoE）增强框架，以渲染图像为引导对2DGS稀疏属性空间施加动态自适应变换，实现'压缩即增强'而无需完全解压到像素网格；并建立多目标协同损失约束增强过程中的平滑性与保真度以抑制伪影。通过两阶段优化实现'重建即增强'：先单尺度重建保证基础表示精度，再提升增强网络鲁棒性。实验验证该范式可在保持高压缩比的同时获得高质量增强结果，证明压缩表示域内直接处理的可行性与优越性。
  deep_dive: docs/auto/2601.15772.md
