summaries:
  one_liner_zh: 提出VETR框架，以验证过的执行轨迹为基础，实现符号图形推理任务的递归自我改进。
  abstract_zh: 面向符号图形推理的视觉智能体依赖可执行世界表示，但最终渲染提供的监督信号模糊，制约了持续改进。VETR在每个任务内保留对齐的程序/渲染记录与有界运行时观测，并引入执行精炼器，将观测到的写入操作与状态变化编译为受约束的备选程序。精炼器针对捕获的运行时状态验证端点与保留条件，再由普通视觉验证器评估目标相关性；修复构建不需要额外的语言模型调用，但可能需要额外的程序执行。在BlenderGym（280个任务）与BlenderBench（27个已发布任务）上使用GPT-5.6-luna和Qwen3.8-27B评估，VETR持续优于BlenderAlchemy和VIGA等现有精炼策略；受控消融实验进一步量化了执行精炼与角色非对称证据组织各自的贡献。
