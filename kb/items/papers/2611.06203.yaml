summaries:
  one_liner_zh: 以嵌套采样与图内差分将11教师集成蒸馏为小参数学生网络，实现目标区域质量评估且超越教师共识。
  abstract_zh: 论文指出整图NR-IQA在目标仅占画面很小比例时评分由背景主导，且现有公开基准均缺乏目标级人类MOS标签。方法上，从目标框向外逐层扩展补丁形成嵌套采样序列，用线性观测模型与图内差分机制从序列相对结构推断目标质量，该差分可证明地消去目标项与教师特异性偏置，从而将11教师集成蒸馏为仅39,482参数的学生网络BiCG-Net。结果上，学生在CSIQ与LIVEC上对人类MOS的PLCC分别达0.9009与0.9133，超过最佳单教师与教师共识；在自建无MOS铁路数据集上对弱标签PLCC达0.9855。CSIQ到LIVEC零样本迁移下冻结学生PLCC为0.8416、超共识0.1947，残差分析与背景污染、教师分歧、标签极端性显著相关，表明学生提取了共识之外的信息；作者将其定位为离线目标级质量审计与标签生成引擎。
