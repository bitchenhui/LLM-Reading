claims:
- statement: MMVC在特征域按空间块从三种预测模式（ConvLSTM特征域预测、光流条件化特征域预测、特征传播）中选择最优模式，覆盖从静态场景到运动相机的多样运动情况。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 提出由二值密度图引导的双模式熵编码：对稠密与稀疏量化残差分别编码，稀疏残差可选游程编码，其码率节省超过传输二值选择图带来的额外开销。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在主流基准数据集上，与SOTA学习式视频压缩方案及标准编码器相比，MMVC以PSNR和MS-SSIM衡量取得更好或具竞争力的压缩性能。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出按块选择多模式预测与密度自适应熵编码的学习视频压缩框架，PSNR/MS-SSIM优于或接近SOTA与标准编码器。
  abstract_zh: 论文提出多模式视频压缩框架MMVC，将特征空间划分为空间块，在特征域按块从ConvLSTM特征域预测、光流条件化特征域预测与特征传播三种模式中择优，以适配从无明显运动的静态场景到相机运动的动态场景。熵编码采用由二值密度图引导的双模式方案：对稠密与稀疏的量化残差分别处理，稀疏残差可进一步施加游程编码，码率节省超过传输二值选择图的额外开销。在主流基准数据集上与SOTA学习式视频压缩方案及标准编码器对比，以PSNR和MS-SSIM衡量取得更好或具竞争力的结果。
