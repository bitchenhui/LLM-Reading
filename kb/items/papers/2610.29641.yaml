summaries:
  one_liner_zh: 提出 ComRSI 框架，用 LLM 递归演化语义通信程序代码，以更少信道符号换取更高推理精度。
  abstract_zh: 该文提出 ComRSI（面向通信的递归自改进）框架，由 LLM agent 递归修改语义通信系统的编码器、信道适配器、解码器、损失与训练策略代码，并由受保护的评估器在预算与资源约束下筛选候选。在
    CIFAR-100 十代演化中，八次被接受的修订产生注意力池化代码，在 AWGN 信道下以每图 32 个复符号达到 74.3% 测试精度，而初始设计需 256 符号才达 67.2%。演化所得程序重训后可迁移至
    Tiny-ImageNet，且在该数据集上独立的 ComRSI 搜索带来进一步递归改进。每方法 10 次搜索的重复实验显示，ComRSI 平衡精度、速率与计算成本的平均最终得分为 0.7587，优于带/不带文本历史的非递归
    agent（0.7376/0.7089），平均接受修订数分别为 6.0/5.0/2.1。双侧秩检验支持对无记忆 agent 的显著优势，但与带历史 agent 的差异在当前样本量下尚不显著，论文同时指出速率鲁棒性与计算放置上的折衷仍待解决。
