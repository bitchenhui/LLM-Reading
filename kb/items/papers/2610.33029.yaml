summaries:
  one_liner_zh: 预注册实验发现：LLM 依噪声结果写的教训会把运气带入后续决策，好工具偶发失败后 11.6% 下次选更差工具。
  abstract_zh: 论文以预注册、先行存证与时间戳固定的实验测量自我改进智能体'写教训'链条中的一环：当运行结果带噪声时，LLM 撰写的教训是否会将偶然性带入后续决策。在 256 个合成世界（重复任务、两个可靠性已知的可互换工具）中，脚本化的上一次运行使用更好或更差工具并指定成败，模型按
    ReasoningBank 记忆写入指令撰写教训，同模型的新会话在持有权威日志与上次结果的前提下，依据单条记忆（该教训、另一结局的教训、无关记忆项或未经推理的指令）选择下次运行的首个工具。11 个
    LLM 端点共给出 90,084 个回答：好工具遭遇偶然失败后，读取教训的会话有 11.6% 下次选了更差工具，而无关记忆项与成功教训组仅 0.4%，面板级交互效应 +0.112（95% 区间 [+0.097,
    +0.126]）。效应受日志是否声明失败相互独立影响（+0.042 vs +0.181，描述性）；更差工具侥幸成功后交互效应仅 +0.002（界低于 0.10）。探索性干预中，写入指令加入三句决策质量注记可将偶然失败后的错选率降至
    7.5%，加入带'无变化'选项的双结局指令可降至 3.1%，但均未在每个端点满足注册的减害规则。
