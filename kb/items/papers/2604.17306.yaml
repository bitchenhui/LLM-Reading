summaries:
  one_liner_zh: NTIRE 2026 首届移动端真实世界图像超分挑战综述，评测结合 IQA 与加速比，108 人报名 16 队有效。
  abstract_zh: 该文回顾了 NTIRE 2026 首届移动端真实世界图像超分辨率（SR）挑战赛，总结各参赛方案与最终成绩。赛题要求从经历未知退化、放大倍率为 x4 的低分辨率图像中恢复高分辨率图像，且模型须可在移动设备上执行。评测采用图像质量评价（IQA）得分与加速比的加权组合。挑战赛共吸引
    108 名注册者，最终 16 支队伍获得有效排名，展示了移动端高效真实世界 SR 的最新趋势。
