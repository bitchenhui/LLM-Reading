claims:
- statement: Quad-DeepSC被作者称为首个在多种分辨率数据集上超越传统方案的图像DeepSC系统，传统方案采用VTM进行源编码、并采用3GPP标准下最优MCS索引进行信道编码与数字调制。
  confidence: reported
