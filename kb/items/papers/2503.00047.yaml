summaries:
  one_liner_zh: 基于最优传输理论的GAN增强G-PCC压缩点云属性质量，BD-rate较PredLift与RAHT配置平均降低19.2%与18.3%。
  abstract_zh: 针对点云压缩牺牲重建质量的问题，提出基于最优传输理论的生成对抗网络PCE-GAN，同时优化数据保真度与人眼感知质量。生成器由局部特征提取单元（动态图构建+图注意力，侧重失真严重的点）、全局空间关联单元（利用邻域patch几何信息并以Transformer结构捕获长程关联）和特征压缩单元组成；判别器计算增强点云与原始点云概率分布偏差以指导生成器。将PCE-GAN应用于最新G-PCC测试模型后，相对PredLift编码配置平均BD-rate降低19.2%，相对RAHT配置降低18.3%。主观对比显示纹理清晰度和色彩过渡显著改善，细节更丰富、色彩渐变更自然。
assessment:
  relevance: high
  decision: summary_only
  reason: 点云属性压缩质量增强属于沉浸式媒体（点云）领域，按收录基准非核心域，仅做摘要级收录，但与G-PCC编码链路直接相关且增益显著。
