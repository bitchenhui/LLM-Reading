summaries:
  one_liner_zh: 以可学习通道掩码实现非连续通道选择的精简图像压缩，兼得稳定变码率控制，窄模型低码率性能大幅提升
  abstract_zh: 针对现有 slimmable 学习式图像压缩被迫连续选通道导致窄模型低码率性能下降、且缺乏稳定变码率控制的问题，提出通道级掩码引导方法：通过带稀疏正则的可学习逐通道掩码实现非连续
    top-w 通道选择，训练后经掩码合并与通道重排（M2S 转换）化为标准 slimmable 网络以高效推理。变码率方面结合 lambda 与宽度条件调制、量化步长缩放及先冻结后微调的渐进训练策略。在
    Kodak 上于 E2E、Hyperprior、Checkerboard 三种骨干跨宽度跨码率取得更优率失真表现，w=48 时相对同宽度 Slimmable 基线最高节省 19.22%/24.11%/22.76%
    BD-rate；单一 VBR 模型可替代 40 个独立模型，存储降低 14.8 至 15.9 倍。
