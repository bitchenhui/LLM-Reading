summaries:
  one_liner_zh: 提出基于双向VQA的生成式超分幻觉评估指标VHA及其轻量学习版VHA+，与人类幻觉判断高度相关。
  abstract_zh: 生成式图像超分辨率虽能产生逼真的高分辨率图像，但可能引入幻觉（添加无依据内容或改变已有细节），而现有超分指标无法衡量生成细节是否有参考图像支撑。论文提出VHA，利用视觉语言模型（VLM）从每张图像构建问答对，并在真值图与超分图上双向作答，双向得分差异可揭示缺失/改变的真值信息与无依据的新增内容。由于VLM推理代价高，作者进一步训练轻量模型VHA+，直接从真值-超分图像对预测VHA分数。通过人类研究构建幻觉基准VHA-bench，实验表明VHA与VHA+均与人类幻觉判断高度相关，代码、基准与权重已开源。
