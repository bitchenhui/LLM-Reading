summaries:
  one_liner_zh: 构建含350条实验轨迹的RSI-Prime数据集提升LLM自主训练模型的能力，为递归自我改进奠基。
  abstract_zh: 该工作研究LLM从'被训练'角色向'执行训练'角色扩展的问题，系统提升其模型训练能力。作者构建了模型训练能力改进数据集RSI-Prime，涵盖7类任务共350条完整实验轨迹。方法上对实验决策进行细粒度识别与质量标注，并采用决策级损失掩码排除对低质量行为的监督，帮助LLM从训练实践中学会做出高质量实验决策。在自主后训练基准PostTrainBench上，经RSI-Prime训练的GLM-5.3相比原始模型整体性能相对提升31.95%，展示了模型自主持续自我提升的RSI路径。
