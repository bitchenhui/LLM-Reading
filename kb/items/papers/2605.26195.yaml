summaries:
  one_liner_zh: 提出结构化自我进化的网络安全LLM代理框架，从失败执行经验中迭代修订自身脚手架，平均提升成功率13.6%。
  abstract_zh: 针对现有网络安全LLM代理依赖固定人工设计脚手架、难以适配多样目标与失败模式的问题，提出自我进化框架CyberEvolver，基于失败执行轨迹迭代修订代理脚手架。方法包含四层可进化架构，将脚手架优化分解为结构化组件；轨迹到诊断机制把噪声执行日志转化为可操作的修订信号；基于种群的束搜索策略在进化过程中保持代理变体多样性。在CTF挑战、漏洞利用与渗透测试任务上用四个开源LLM评估，平均将种子代理成功率提升13.6%，优于六个人工设计的网络安全代理及两种从其他领域改造的自我改进方法。
