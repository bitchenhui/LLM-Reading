summaries:
  one_liner_zh: 以VLM原生分辨率Likert问卷替代二值VQA，构建与人类BT偏好对齐的生成视频多维质量基准
  abstract_zh: 论文针对生成式视频模型评估难题，指出SSIM/PSNR偏像素保真、FVD偏分布纹理、VBench 2.0等二值VQA基准存在肯定偏置且依赖低分辨率评审。WorldJen改用VLM在视频原生分辨率下按维度Likert问卷打分，并以对抗性策划的提示词同时考察多达16个质量维度以降低生成成本。作者开展盲测人类偏好研究：50条提示词×6个SOTA视频模型，7名标注者共2,696对标注、100%对覆盖，平均标注者间一致率66.9%，据此建立人类三层级Bradley-Terry(BT)评级。其VLM评估引擎（每维度10题、共47,160个评分响应）独立复现人类三层级BT评级结构，Spearman
    ρ̂=1.000（p=0.0014），并通过六项消融研究验证框架鲁棒性。
