summaries:
  one_liner_zh: 提出TICK自动生成指令专用YES/NO检查表改进LLM评估，并经STICK自细化与Best-of-N选择提升生成质量。
  abstract_zh: 针对偏好排序将多维度评估压缩为单一排名、且 LLM 判官可靠性不足的问题，提出 TICK：由 LLM 针对每条指令自动生成将其分解为一系列 YES/NO 问题的检查表，进行全自动、可解释的结构化评估。相比
    LLM 直接打分，TICK 使 LLM 判断与人类偏好完全一致率从 46.4% 提升到 52.2%。进一步提出 STICK（Self-TICK）用于自我改进：自细化在 LiveBench 推理任务上获得
    +7.8% 绝对提升，Best-of-N 选择在 WildBench 真实指令数据集上获得 +6.3% 绝对提升。此外，将检查表提供给人类评估者后，WildBench 标注者间一致性从 0.194
    提升到 0.256，表明结构化、多维度自我改进是推进 LLM 能力的有效途径。
