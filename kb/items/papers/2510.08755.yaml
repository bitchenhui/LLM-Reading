summaries:
  one_liner_zh: 通过暴露失败实例、解释失败原因并按输入区域专门化，引导LLM生成比FunSearch更鲁棒的启发式算法。
  abstract_zh: 作者主张在LLM启发式设计中引入能解释启发式为何表现不佳并给出修复建议的工具，以生成更鲁棒、性能更优的算法。方法包含三个简单思路：让LLM接触启发式表现不佳的具体输入实例；解释这些失败发生的原因；将算法设计专门化到输入空间的特定区域。结果显示，所生成的启发式相比FunSearch等现有技术具有约28倍更好的最坏情况性能，同时平均性能有所提升且运行时间保持不变。
