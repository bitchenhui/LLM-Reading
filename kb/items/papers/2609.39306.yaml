summaries:
  one_liner_zh: 提出ReSAIL即插即用增强，通过选择性蒸馏与特权信息行为保持缓解LLM智能体迭代自蒸馏的性能崩溃。
  abstract_zh: 迭代自蒸馏让LLM智能体从连续部署中学习，是通向递归自改进（RSI）的途径，但作者实验发现现有方法随循环推进出现部署性能崩溃，特权信息（PI）条件下的任务性能也随之下降。ReSAIL作为迭代PI自蒸馏的即插即用增强，选择PI最能改变教师预测的交互步骤进行蒸馏并平衡跨轨迹蒸馏损失，同时将学生的PI条件输出分布向冻结教师正则化，以便在下一循环保留可用的PI条件监督。在ALFWorld和TextCraft上跨多种模型规模、三个循环的实验显示，加入ReSAIL后自蒸馏基线的末轮成功率平均绝对提升22.5%。敏感度引导的离线数据选择还能提升多模态GUI智能体在AITZ上的动作预测精度。作者称这是首个表明更稳健的学习机制可有效缓解迭代智能体自蒸馏性能崩溃的证据。
  deep_dive: docs/auto/2609.39306.md
