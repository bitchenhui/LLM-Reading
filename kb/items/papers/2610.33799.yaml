summaries:
  one_liner_zh: 在线QA生成器与深度搜索求解器共训练，用Goldilocks奖励实现多模态深度搜索智能体自改进
  abstract_zh: 论文提出MTA-Zero，一个无需预计算多跳语料的在线多模态QA-求解器共训练框架，用于自改进的多模态深度搜索智能体。从图像锚定的VQA种子出发，可训练的QA生成器在线检索证据并构造经校验的多跳问题；独立的深度搜索求解器选择工具、收集证据并作答。生成器从求解器的分组rollout成功率导出Goldilocks奖励，偏向求解器当前学习边界附近的问题，两策略用GRPO独立优化、不共享参数或梯度。在六个多模态深度搜索基准上，MTA-Zero将Qwen3-VL-8B求解器的平均准确率从36.91%提升到51.58%，同一工作流下性能与GPT-5相当，并使更新的Qwen3.6-27B求解器再提升10.82分。
