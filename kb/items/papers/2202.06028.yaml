summaries:
  one_liner_zh: 基于八叉树与注意力机制的上下文熵模型，对点云无损编码，较 SOTA 提升 10%-35% BD-Rate 并省 95% 编码时间。
  abstract_zh: 针对体素化方法在稀疏点云上可收集上下文不足的问题，论文采用八叉树结构表示点云以降低空间冗余，并对不同分辨率点云具有鲁棒性。方法以兄弟节点与祖先节点构成大规模上下文，设计大感受野的条件熵模型，并用注意力机制强化相邻节点间的相关性，对八叉树符号序列进行无损熵编码。训练与测试中引入掩码操作，在编码时间与压缩性能之间取得折中。在
    LiDAR 基准（SemanticKITTI）与物体点云数据集（MPEG 8i、MVUB）上较此前最优方法取得 10%-35% BD-Rate 增益，并相对体素基线节省 95% 编码时间，代码已开源。
