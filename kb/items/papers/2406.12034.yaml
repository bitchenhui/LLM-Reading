summaries:
  one_liner_zh: 将单体LLM转化为自专化专家模块系统MiXSE，借助自生成数据与自优化路由实现多领域能力提升。
  abstract_zh: 提出Self-MoE方法，将单体大语言模型转化为由自专化专家构成的组合式模块化系统MiXSE。该方法基于自生成合成数据构建专家模块，为共享基座LLM注入不同领域专长，并通过自优化路由动态激活。实验显示对LLM做单一领域专化会在非专化任务上产生性能权衡，而Self-MoE在知识、推理、数学、编码等多类基准上平均较基座LLM提升6.5个百分点，并持续优于实例合并与权重合并等对比方法，同时在语义专家与路由设计上具备更好的灵活性与可解释性。
