summaries:
  one_liner_zh: 基于6DoF观看距离的视觉敏锐度模型自适应调节体积视频点云密度，QoE最高提升26%。
  abstract_zh: 论文研究六自由度(6DoF)空间导航中观看距离对用户感知质量的影响，提出描述虚拟观看距离与可容忍点云密度边界关系的视觉敏锐度模型。该模型利用人眼视觉分辨率的限制，在6DoF探索过程中满足空间视觉需求，并动态调整质量级别以平衡感知质量与带宽消耗。此外提出QoE模型精确刻画不同观看距离下的用户感知质量。基于真实网络与用户轨迹的实验表明，相比现有基线，所提方案整体平均QoE最高提升26%。
