summaries:
  one_liner_zh: 提出单次反思链（自我提问-自我回答-决策修正）框架，让医学LLM无需外部检索与大量标注即可自我改进。
  abstract_zh: 医学问题求解需要专家知识与复杂推理，现有方案依赖外部检索或高成本标注且受制于外部助手。MedReflect 框架让 LLM 模拟医生式反思思维，在单次生成中完成初始假设、自我提问、自我回答与决策修正的反思链。其自我验证、自我反思特性无需外部检索和繁重标注即可释放
    LLM 在医学求解上的潜在能力，并支持低成本医学数据集构建。仅需随机抽样的小规模训练子集与轻量微调，即在一系列医学基准上取得显著绝对准确率提升，同时大幅削减标注需求，证明 LLM 可经自我反思与自我改进解决专业医学问题。
