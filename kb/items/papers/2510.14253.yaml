- statement: GRM验证容量是自学习的主要瓶颈：冻结GRM会诱发奖励攻击并使进展停滞；对演化数据分布持续训练GRM可缓解该问题，后期少量真实验证数据注入可抬高性能上限。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出ASL闭环多角色自学习框架：任务生成、策略执行与生成式奖励模型共进化，零标注数据下LLM智能体持续自我改进
  abstract_zh: 该论文研究在不依赖人工策展数据与预定义规则奖励的条件下，自学习能否规模化扩展基于LLM的智能体能力。搜索智能体受控实验表明，奖励信号来源与智能体任务数据规模是可扩展训练的两个关键决定因素：生成式奖励模型（GRM）的奖励优于刚性规则信号，与策略共同进化可进一步提升性能，且合成生成的任务数据量增加能显著增强智能体能力。据此提出Agentic
    Self-Learning（ASL），一个全闭环多角色强化学习框架，将任务生成、策略执行与评估统一在共享工具环境和LLM主干中，协调提示生成器、策略模型与GRM形成更难任务设定、更锐利验证与更强求解的良性循环。实验显示ASL逐轮稳定增益，超越趋于平台化或退化的RLVR基线（如Search-R1），并在零标注数据条件下持续改进；进一步发现GRM验证能力是主要瓶颈——冻结GRM会引发奖励攻击并停滞进展，对演化数据分布持续训练GRM可缓解，后期少量真实验证数据注入可抬高性能上限。
