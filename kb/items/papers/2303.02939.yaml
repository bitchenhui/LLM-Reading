summaries:
  one_liner_zh: 用分层VQ-GAN神经音频编解码器提取离散语音token，并用LLM自回归生成token的TTS系统，服务ASR定制。
  abstract_zh: 针对级联或端到端TTS中连续声学帧难以仅凭音素预测、多样化输出需复杂VAE/流模型的两大局限，提出FoundationTTS。其一是基于VQ-GAN对抗训练的分层编解码网络：先以细粒度编解码提取连续帧级语音表征，再以粗粒度编解码将每帧量化为离散语音token并支持波形重建；其二是用大语言模型联合建模语音token、音素token与说话人token，自回归预测离散语音token。实验显示合成质量MOS较基线系统提升0.14；在ASR定制任务上，相较两个强定制基线分别取得7.09%和10.35%的相对词错误率降低（WERR）。
