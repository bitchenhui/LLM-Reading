summaries:
  one_liner_zh: 受海马选择性编码与回放启发的免训练外部记忆框架，让LLM智能体在不更新参数的情况下从经验中自我改进。
  abstract_zh: 受递归自我改进（RSI）动机驱动，本文研究LLM智能体如何在不更新模型参数的前提下通过外部记忆学习。作者提出Hippo记忆框架，借鉴选择性海马编码与回放机制，在诊断出缺陷时通过对比同一任务的不同尝试来识别可复用决策并精化其适用条件；新经验与既有记忆合并重叠、以显式适用条件消解冲突，避免逐条堆积。实验显示无整合的经验累积基线先升后降、最终低于无记忆基线，而Hippo在SWE-bench
    Verified、WebArena和Mind2Web三个基准上均取得提升且保留经验远少于累积基线。增益在不同能力的基础模型上均成立，表明即使对强模型，基于记忆的适应仍然有效。
  deep_dive: docs/auto/2610.24453.md
