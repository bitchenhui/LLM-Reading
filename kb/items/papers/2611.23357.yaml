summaries:
  one_liner_zh: 系统综述LLM强化学习训练全生命周期的运维技术，按五阶段组织方法并指出面向递归自我改进的RLOps等未来方向。
  abstract_zh: 该综述系统梳理面向大语言模型的强化学习运维（RLOps）技术，动因是RL训练规模化会在分布式执行、反馈计算与学习动态上暴露故障，浪费算力、拖慢训练并削弱模型改进。作者将现有方法组织为训练设置、经验采集、奖励计算、策略优化与模型评估五个阶段，逐一考察各阶段的运维关切、管理技术与评估证据。基于该分类体系，论文识别出训练过程可观测性、跨阶段协调、可泛化RLOps、多轮次管理以及面向递归自我改进（RSI）的RLOps等开放挑战与未来方向。这些方向旨在把运维管理从单次训练运行扩展到多样化训练设置、共享基础设施与持续改进循环，作者并维护了索引相关论文与开放资源的GitHub仓库。
