summaries:
  one_liner_zh: 提出工具-分析者-科学家三级自主性分类，系统梳理LLM在科学发现中的角色演进、挑战与自我改进方向
  abstract_zh: 该综述以科学方法为视角，系统梳理大语言模型在科学发现领域的快速演进。作者提出工具、分析者、科学家三级分类体系，刻画LLM在研究生命周期中自主性与职责的递进升级。论文指出LLM正从任务专用自动化工具转变为日益自主的智能体，从根本上重新定义研究流程与人机协作模式。作者识别出机器人自动化、自我改进与伦理治理等关键挑战和未来研究方向。综述同时提供概念架构与战略展望，并附带持续维护的GitHub资源库。
