summaries:
  one_liner_zh: 用多元线性回归加卡尔曼滤波校正实现5G吞吐量低复杂度预测，配合MPC类ABR提升流媒体QoE。
  abstract_zh: 针对视频流媒体等网络感知应用对吞吐量预测的需求，论文将未来吞吐量建模为当前多个网络参数与当前吞吐量的多元线性回归，并把预测误差方差与现有工作未考虑的测量误差方差送入基于卡尔曼滤波的预测-校正框架，得到未来吞吐量的最优估计。在七个公开5G吞吐量数据集、不同预测窗口长度上的大量实验表明，该方法比基线ML/DL算法预测更准确，且推理与再训练耗时更短。与主流MPC类自适应码率（ABR）算法结合时，该方法为点播与直播视频用户带来比ML/DL基线预测更高的QoE。
