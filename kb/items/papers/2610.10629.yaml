summaries:
  one_liner_zh: 将LLM智能体自进化限制在harness层面并以哈希链准入门审查，仿真中仅放行144/7449个候选变更。
  abstract_zh: 论文主张自进化只有在限制于运行时harness（指令文本、工具调用逻辑与原语组合）且模型权重固定时才可审查，使每次适应都是附原因与测试的diff。作者构建了基于该边界的双循环引擎，配有一个在部署前写入哈希链记录的准入门，并用模拟智能体与种子搜索提议器（而非真实语言模型）在信贷流水线仿真中量化该门的效果。在三类监督规则重释、三个严重度、每格10种子的实验中，门控循环从7,449个候选变更中仅接受144个，无一恶化留出历史误差，并在所有低、中严重度场景中将误报率恢复到oracle水平且不增加漏报。若把门替换为无界系统所用的松散检查（近期轨迹错误更少即通过），同样的循环接受了309个有害变更，90次运行中有49次漏报率超过10%。门的固定容差在最高结构严重度下于一半种子中阻止了正确的原语替换；作者还将机制映射到欧盟AI法案高风险信贷条款，并指出2026年4月美国模型风险指南未将agentic
    AI纳入范围。
