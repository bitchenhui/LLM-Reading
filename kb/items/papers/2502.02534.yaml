summaries:
  one_liner_zh: 提出自适应自我改进智能体系统，用LLM为专用架构生成ML库ASPL代码，较单LLM基线最高提升3.9倍。
  abstract_zh: 高性能ML库通常以面向特定领域架构的架构专用编程语言（ASPL）编写，撰写需要ML算法与ASPL的双重专家知识，且ASPL深奥、演化快导致可用代码示例稀缺。针对LLM在该任务上需在有限数据下进行复杂推理的挑战，作者提出一个自适应自我改进智能体系统。他们构建了一个典型ML库的基准，并用开源与闭源LLM在该基准上生成ASPL代码进行评估。结果显示，该系统相较单个LLM基线最高取得3.9倍提升。
