summaries:
  one_liner_zh: 将EMD/VMD/MEMD/BEMD分解与curvelet软硬阈值结合的混合去噪框架，实现CT锐核到软核转换，VMD表现最佳。
  abstract_zh: 该研究提出一种混合去噪框架，将经验模态分解（EMD）、变分模态分解（VMD）、多通道EMD（MEMD）和二维EMD（BEMD）等分解技术与curvelet变换阈值化相结合。每个分解得到的模式分别经过软阈值和硬阈值处理，再将去噪后的模式重组为最终图像。在使用B50、B46、B41、B36等不同重建核的标准CT图像数据集上的综合评估显示去噪效果显著提升，其中VMD在PSNR和SSIM上一致取得最高值。研究还分析了软硬阈值的权衡：软阈值更好保留精细视觉细节，硬阈值提供更强去噪。该方法在参考型与非参考型质量指标上均优于传统技术，有望推广至更广的医学影像应用并与自适应阈值算法结合。
