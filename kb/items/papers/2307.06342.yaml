summaries:
  one_liner_zh: 提出 ConvNeXt 变换+通道自回归先验的神经图像压缩框架，PSNR 口径 BD-rate 较 VTM-18.0 平均降 5.24%
  abstract_zh: 针对现有神经图像压缩（含注意力式变换编码）在非均匀纹理区域码率-保真度权衡不足、参数量与解码耗时偏高的问题，提出 ConvNeXt-ChARM 变换编码框架。该方法以新一代卷积网络
    ConvNeXt 构建变换网络，并搭配计算高效的通道自回归先验（ChARM），从超先验与量化隐表示中同时捕获全局与局部上下文。框架可端到端优化，提取紧凑隐表示并重建更高质量图像。在四个常用数据集上，平均
    BD-rate（PSNR）较 VVC 参考编码器 VTM-18.0 降低 5.24%，较 SOTA 学习图像压缩方法 SwinT-ChARM 降低 1.22%。此外通过模型缩放实验验证计算效率，并以客观与主观分析揭示
    ConvNeXt 相对 Swin Transformer 的性能优势。
