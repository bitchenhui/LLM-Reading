summaries:
  one_liner_zh: 大规模基准显示LLM解码器并不放大种族偏差，音频编码器设计而非LLM规模才是公平鲁棒语音识别的关键杠杆。
  abstract_zh: 论文评测9个覆盖三代架构的语音识别模型（无语言模型的CTC、隐式LM的编码器-解码器、显式预训练LLM解码器），在约4.3万条语音、5个人口统计维度（种族、口音、性别、年龄、母语）上衡量公平性，数据来自Common
    Voice 24与Meta的Fair-Speech受控提示数据集。干净音频上发现LLM解码器并未放大种族偏差（Granite-8B最优，最大/最小WER比为2.28），而Whisper对印度口音语音出现病理性幻觉，插入率在large-v3处非单调升至9.62%，且音频压缩比LLM规模更能预测口音公平性。随后在12种声学退化条件（噪声、混响、静音注入、片段掩码）下开展共216次推理压测：严重退化反而使各群体收敛到高WER从而压缩公平性差距，但静音注入通过人群选择性幻觉将Whisper口音偏差放大至4.64倍。掩码条件下Whisper陷入灾难性重复循环（51797次插入中86%为重复），显式LLM解码器插入错误少38倍且几乎无重复，而高压缩音频编码（Q-former）会让LLM解码器重现重复病理。结论指出音频编码器设计而非LLM规模是公平且鲁棒的语音识别的主要杠杆。
