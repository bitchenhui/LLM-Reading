summaries:
  one_liner_zh: 从真实部署轨迹自动构建针对指定不良行为的LLM智能体评测基准，可作为RSI循环的关键组件。
  abstract_zh: 提出 TraceDance，一个从智能体部署轨迹出发、针对用户指定不良行为自动构建评测基准的系统。其 Anchor-and-Confirm 方法将可编程检索与 Flash LLM
    的候选级确认结合，Anchor Synthesis Loop 负责生成并修订自定义行为规范。基准采用决策点续接式评估：在记录的决策点用行为专属评分规则评估 LLM 的下一回合输出，无需参考答案或环境重放。在编码与通用工具使用领域，系统基于
    252,557 个会话构建了 107 个基准共 4,125 个实例，满足 95.3% 的构建目标请求；抽样实例中 84% 经人工标注确认所请求行为，自动评分器与人工 pass/fail 判断的一致性接近标注者之间的一致性。九个前沿
    LLM 平均通过率仅 26.7%，显示其在被评估决策点上仍难以恰当回应。
