summaries:
  one_liner_zh: 提出FISA框架，从模型自身失败案例生成保答案的困难图像样本，实现MLLM自我改进并提升VQA性能。
  abstract_zh: 针对多模态大语言模型（MLLM）依赖大规模高质量标注数据、且现有自我增强方法以文本为中心的问题，提出失败感知图像自增强框架FISA。该方法从模型的失败案例出发，生成具有视觉挑战性但保持答案不变的图像复杂化样本，通过自检验证样本效用，并用双重保真过滤避免语义失真。在视觉问答基准上，该方法在分布内和分布外设置下均带来持续性能提升；实验还验证了其与文本自增强方法的兼容性，以及合成样本相对通用图像增强基线的更高数据效率。
