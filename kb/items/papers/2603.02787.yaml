summaries:
  one_liner_zh: 用问题求解轨迹的 DTW 对齐度量算法行为相似性，增强 FunSearch/EoH 等 LLM 自动算法设计框架。
  abstract_zh: LLM 自动算法设计（LLM-AAD）中算法思想隐式嵌入生成代码，现有代码相似度指标只关注表层语法或输出等价，无法刻画算法逻辑层面的相似性。论文提出 BehaveSim，以执行过程中产生的中间解序列（问题求解轨迹
    PSTrajs）为视角，用动态时间规整（DTW）量化轨迹对齐来度量算法相似性，从而区分语法或输出相似但逻辑迥异的算法。应用一：将 BehaveSim 集成到 FunSearch、EoH 等现有 LLM-AAD
    框架以促进行为多样性，在三项 AAD 任务上显著提升性能。应用二：按求解行为聚类 AI 生成算法，支持对问题求解策略的系统性分析，数据与代码已开源。
