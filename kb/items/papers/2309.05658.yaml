summaries:
  one_liner_zh: 系统性综述体积视频服务全流程：表示、数据集、质量指标与采集、压缩、传输、渲染、显示各环节技术
  abstract_zh: 该综述面向六自由度的体积视频，提出体积视频服务的总体框架。文章首先梳理前置要素，包括表示形式、开放数据集与质量评估指标；随后逐环节评述采集、压缩、传输、渲染与显示的现有方法。最后总结该技术支撑的各类应用，并指出体积视频服务领域的研究挑战与未来机遇，相较传统视频，六自由度带来更强的沉浸感与交互性。
