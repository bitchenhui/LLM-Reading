summaries:
  one_liner_zh: 提出对比自蒸馏CSD框架，经通道分裂构建紧凑学生网络并用对比损失同步压缩加速EDSR/RCAN/CARN等超分模型
  abstract_zh: 针对CNN超分模型架构复杂、内存与计算开销大、难以部署在资源受限设备的问题，提出一种新型对比自蒸馏（CSD）框架，可同时压缩与加速多种现成SR模型。该方法首先从目标教师网络出发，通过通道分裂构建紧凑的学生超分网络。随后引入新颖的对比损失，通过显式知识迁移提升SR图像质量以及PSNR/SSIM指标。大量实验表明，CSD方案能有效压缩并加速EDSR、RCAN、CARN等多个标准SR模型，代码已开源。
