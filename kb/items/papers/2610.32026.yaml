summaries:
  one_liner_zh: 提出即插即用递归自我改进框架RSI-Opt，元智能体跨训练运行演化优化器策略与代码库，显著提升优化器agent性能并支持跨模型迁移。
  abstract_zh: 论文提出 RSI-Opt，一种即插即用的递归自我改进优化器智能体框架：元智能体基于先前训练运行的证据递归改写指导优化器调控行为的策略，涵盖提示词、流程手册、经测试的优化器代码库与决策节奏，并由存档保留已评估策略供后续进化。在三个训练任务上的
    5 代进化中，元智能体发展出可复用的流程与代码，并自主开展 CPU 代理实验。结果显示，进化套件上 Opus 5.5 的代表性原始空间汇总 z-score 从 +10.48 升至 +14.33，经跨模型策略迁移
    GPT-5.5 在 held-out 任务上从 -0.36 升至 +3.11。在 Burgers PDE 上，相比固定提示 agent 基线，平均相对 L2 误差分别降低约 2.7 倍（Opus
    5.5）与 8.8 倍（GPT-6.1），但 PDE 迁移效果随 LLM 与任务而异。控制对比表明进化策略兼具可复用优化知识与任务适应性：初始决策贡献已见任务上的大部分收益，持续适应则改善未见任务结果。
