summaries:
  one_liner_zh: 以主观测试为基准检验质量模型评估扩散式VSR的能力，CNN全参考模型最佳但仍不足以替代主观测试。
  abstract_zh: 研究将六种上采样方法（Lanczos、Rhea、SCST、DOVE、SeedVR2、Starlight Mini）应用于经AV1与DCVC-RT压缩以及未压缩的低分辨率视频，针对UHD-1/4K屏幕播放开展主观测试。随后将多种全参考与无参考质量模型的预测与主观分数对比，聚焦序列内性能。结果显示LPIPS、DISTS、CVQA-FR等基于CNN的全参考模型相关性显著高于传统全参考模型和所测无参考模型。多数模型高估SCST的过锐结果，VMAF主要因Starlight
    Mini引入的空间不一致而失效。没有任何被测模型达到足以替代主观测试的精度，视频、评分与模型分数均已开源。
