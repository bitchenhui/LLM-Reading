summaries:
  one_liner_zh: 将 Web 智能体的反思/前瞻、分支、回滚推理重构为思维链数据并微调 LLM，多基准显著提升。
  abstract_zh: 论文指出基于 LLM 的 Web 智能体在不确定、动态的网页环境中推理能力有限，归纳出反思与前瞻（reflection & lookahead）、分支（branching）、回滚（rollback）三项关键推理技能。作者将智能体推理时使用的推理算法重构为思维链（CoT）理据，构建出体现这些能力的轨迹数据。通过简单微调将显著推理模式蒸馏进骨干
    LLM，并在自改进基准 OpenWebVoyager 上进行实验验证。方法在 WebVoyager、Mind2web-live、SimpleQA（网页搜索）等多个基准上带来显著性能提升。
