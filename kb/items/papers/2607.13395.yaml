summaries:
  one_liner_zh: 提出免训练后调范式 Enlightenment，通过修改注意力头混合捷径与残差缩放因子，无需更新权重即可激发大模型'顿悟'式能力跃升。
  abstract_zh: 受人类大脑'顿悟/aha时刻'启发，作者假设大规模模型存在类似的潜在突变式能力提升现象，并提出 Enlightenment——一种无需训练的后调优范式。该方法通过修改关键模块/层的'捷径'实现性能提升而不更新权重，区别于现有主要操纵注意力权重的免训练方法。针对大语言模型，提出注意力头混合捷径，将首个注意力头的输出连接到其他所有目标头并用自适应缩放因子初始化策略调制；针对视觉-语言模型，在解码器层残差连接上施加轻量标量调制因子以调控信息流。大量实验表明该方法能有效释放预训练网络的潜在能力，在多种基准和模型上取得显著性能提升。
