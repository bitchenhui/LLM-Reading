summaries:
  one_liner_zh: HSI框架：冻结LLM经evolver与meta-evolver三层结构迭代重写任务harness，中难度任务稳定增益，超骨干能力则无效。
  abstract_zh: 论文提出分层自我改进（HSI）框架：单个冻结LLM在三层结构中运行——任务harness执行任务、evolver依据环境反馈重写harness、meta-evolver在冻结外锚约束下重写evolver的策略代码，各任务族通过固定任务注入接缝热插拔专属harness。thinking-on/off设计在任务执行时关闭推理、在自我修改时开启，以隔离harness进化的贡献。框架受反馈保真度界与骨干能力界双重约束。在BALROG上以DeepSeek-V4-Flash-Preview为冻结骨干，HSI在中难度任务取得稳定增益（BabyAI
    +39.3、Crafter +33.0、TextWorld +25.0、MiniHack +15.0，原始% Progress），并在BabaIsAI子套件20%未见划分上表现出强泛化（BreakStop
    0.98、GoTo 1.00）；超出骨干能力的NLE任务则无改进。
