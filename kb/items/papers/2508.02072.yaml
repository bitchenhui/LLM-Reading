summaries:
  one_liner_zh: 混合显式解码帧与隐特征的递归传播学习视频编码框架，缓冲更小且PSNR/MS-SSIM超越VTM 17.0低时延B
  abstract_zh: 该工作从RNN视角重新审视基于帧的学习视频编码：output-recurrence方式传播解码帧虽直观但给输出帧施加双重约束，导致率失真次优；hidden-to-hidden方式传播隐特征更灵活却需要大缓冲区。HyTIP结合两种机制，采用显式解码帧加少量隐式潜特征的混合缓冲策略。实验表明混合方案优于任一单独机制，达到与SOTA相当的性能但缓冲区大小显著更小，并在PSNR-RGB与MS-SSIM-RGB上超越VTM
    17.0（Low-delay B）。源代码已在GitHub开源。
