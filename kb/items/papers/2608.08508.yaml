summaries:
  one_liner_zh: 以测试时自适应统一免参考视频质量评估与视频超分，在未知失真下免重训提升感知质量与文字可读性。
  abstract_zh: 该博士论文针对视频超分辨率（VSR）在异构设备、编解码器和网络环境导致的未知退化下泛化能力差的问题，提出以测试时自适应（TTA）为统一范式，无需重训练或高质量监督即可提升鲁棒性与感知质量。具体包括：1）提出基于TTA的免参考视频质量评估（VQA）框架，以自适应后的质量预测为未见失真下的VSR提供感知引导；2）开发面向屏幕内容超分的Transformer架构，保持文字清晰度与结构保真度；3）引入区域感知TTA策略，选择性精修文字与非文字区域且无需高分辨率真值。在多个基准上的实验表明感知质量与可读性均获一致提升，论文还展望了可跨未见域泛化的全自适应视频增强系统。
