summaries:
  one_liner_zh: 提出BlindPSNR，用窗口交叉注意力融合增强图与低照度输入，无参考预测PSNR以自动化LLIE参数选择。
  abstract_zh: 低照度图像增强（LLIE）方法的可调参数通常固定，跨场景易性能退化，而自动参数选择需要保真度准则，但PSNR依赖通常不可得的真值参考。作者指出NR-IQA以感知质量为目标而非信号保真度，其测试的七个NR-IQA基线在其基准上top-1选择精度均为0%。利用配对训练数据可解析计算真值PSNR，从而提供精确监督而无需教师网络。基于此提出轻量无参考网络BlindPSNR，通过窗口交叉注意力融合增强图与退化的低照度输入，并以异方差回归估计PSNR，将top-1精度从标量回归基线的54.4%提升至89.5%，遗憾从1.62
    dB降至0.026 dB，且在未见数据集上SRCC为0.61-0.67。
