summaries:
  one_liner_zh: 通过时间退火预算、批评者与剪枝器约束agent harness的递归自我改进，缓解对训练任务的过拟合
  abstract_zh: LLM agent能力很大程度上由其harness（提示、控制流、工具、记忆与上下文管理）放大，近期方法通过迭代提出并选择组件级编辑实现agent系统层面的递归自我改进（RSI），但递归进化易通过记忆训练任务而过拟合，分布内收益在分布外基准上缩小甚至消失。RRSI将正则化原则引入harness自我改进：proposer采用时间退火预算限制单次候选可捆绑的编辑数量，并基于进化历史鼓励未探索的轨迹；selector配备critic与pruner，前者筛除基准特定提案，后者移除过小、代价过高或失效的修改。在涵盖编码、代理工作区与工程设计任务的八个基准上，RRSI在其进化的split上最多提升6.0分，在五个分布外基准上最多提升4.3分，且生成的harness比未正则化进化少用30%的policy
    token。
