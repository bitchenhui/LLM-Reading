summaries:
  one_liner_zh: 提出基于 MoQ 的多接入分块流框架 MultiMoQ，以多路径传输与灵活 tile 调度提升 360° 视频直播的吞吐与播放连续性。
  abstract_zh: 针对 360° 沉浸式视频在大规模并发用户下高码率传输困难、粗粒度分发响应不足、并发 tile 流协调欠缺等问题，作者提出构建在 Media over QUIC（MoQ）之上的多接入
    tile 流传输框架 MultiMoQ，重新设计其传输机制，支持跨多条接入路径的鲁棒高码率传输、灵活 tile 调度与无缝接入切换。团队实现了完整功能原型，并在网络仿真中于异构真实网络条件下与 DASH
    和标准 MoQ 进行对比评估。结果显示，MultiMoQ 提升了增强 tile 与基础视频的 goodput，降低了增强 tile 的尾端到端时延，同时保持音频连续性并避免标准 MoQ 的持续卡顿。传输层收益转化为更流畅的视口播放，消融实验进一步证实了多接入控制对播放连续性的贡献。
