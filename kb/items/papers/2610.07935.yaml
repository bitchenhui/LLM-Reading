summaries:
  one_liner_zh: 提出SIGMA流水线，让LLM仅凭Model Spec自生成对齐任务并自我训练，安全对齐泛化至多轮智能体场景。
  abstract_zh: 针对能力自改进快于安全对齐带来的风险，论文提出SIGMA——一条实现安全对齐自改进的数据生成与训练流水线，仅需一份描述期望行为的Model Spec。SIGMA首先进行规范引导的任务合成，让候选模型作为任务设计智能体生成多样化的对齐两难场景并转化为压力测试任务；随后通过监督微调与基于rubric的强化学习进行自我评判的对齐训练，模型自身充当奖励模型。尽管仅在单轮对话数据上训练，SIGMA在多轮智能体环境中显著提升安全对齐（AgentHarm有害性从22.6降至14.8，Agentic
    Misalignment从79.1降至3.8），优于Deliberative Alignment与Constitutional AI基线并保留通用能力。分析表明，兼顾无害性与有用性的Model Spec、面向安全思辨的测试时推理、以及任务智能体产出的高质量rubric是有效自改进的关键。
