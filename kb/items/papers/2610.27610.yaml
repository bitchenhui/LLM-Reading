summaries:
  one_liner_zh: 对114项RSI相关研究全文编码审计，发现产品评估常见而递归可重复性与改进程序对比证据薄弱，提出按声明索引的报告标准。
  abstract_zh: 论文通过在2026年10月冻结的可复现arXiv检索框中对114项合格研究进行全文编码（其中90项自称RSI），测量RSI声明所需评估证据的实际报告率。在90项RSI研究中，宽标准下90%报告了超出开发任务的产品评估，但仅60%在未用于选择的任务上评估，仅22%审计了两次以上完整循环重跑；人工编码随机样本中对应比例降至45%与14%。在26项声称改进了改进程序的研究中，23项报告了相关比较，但仅4项在相同起始工件与匹配预算下比较前后程序。作者提出三个命题，说明选择效应、共享评估器错误与系统状态变化如何限制产品评估的证明力，并支持一项将每条声明与所需评估设计挂钩的'声明索引'报告标准。
