claims:
- statement: OPSD强迫学生模仿基于特权信息的过度自信推理轨迹，会抑制不确定性表达并惩罚探索性自我纠错行为，在复杂推理任务上严重损害LLM性能。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: NSD让模型自身为每个问题生成负向条件教师（如"粗心推理者"），并将学生分布推离该教师，全程不使用标准答案或外部监督。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 直接用遗忘目标实现分布偏分会无差别惩罚基础语言token，NSD通过动态门控机制自动识别推理关键token、只对缺陷token施加梯度更新，从而保住语言先验。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在无标签、自举式强化学习设定下，NSD在复杂推理任务上持续优于OPSD及其他同类基线。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出NSD框架，让LLM远离自生成的缺陷推理教师而非模仿特权解答，并用动态门控保护语言能力，推理表现优于OPSD等无标签自提升基线。
  abstract_zh: 针对在线策略自蒸馏（OPSD）在复杂推理任务上会压制不确定性表达、惩罚探索性自我纠错行为从而导致性能退化的问题，作者提出负向自蒸馏（NSD）。NSD不依赖标准答案或外部监督，而是让模型自己生成针对问题的负向条件（如扮演"粗心推理者"），并将学生分布推离这一自生成的负向教师。由于缺陷推理token与基础语言token混杂，直接套用遗忘目标会损害语言能力，论文设计了动态门控机制自动识别并隔离推理关键token，使梯度更新只作用于行为缺陷。实验表明NSD在无标签、自举式强化学习设定下持续优于OPSD及其他基线。
