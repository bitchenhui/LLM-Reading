summaries:
  one_liner_zh: 提出闭环神经控制平面NCP，验证引导地合成与准入权重空间干预规则，探索控制策略层面的递归自我改进。
  abstract_zh: 提出神经控制平面（NCP），将预训练模型的推理数据平面与选择临时参数干预的控制策略分离，通过观测模型执行、合成候选干预规则、验证评估并维护版本化策略表；W-ISA 提供事务执行与参数恢复，每次请求后恢复基础模型参数。在本地
    SmolLM-135M-Instruct 实验中，NCP 从开发遥测生成三个候选规则，并在独立任务样例及 4,095 目标的 WikiText-2 切片上评估。其中一个投影将验证 token 重复率从
    0.4133 降至 0.2191，困惑度变化 -0.0574%；但因所有候选零新增正确精确答案，配置的准入门槛将三个候选全部归档并保留原始策略。该框架为控制策略层面的递归自我改进研究提供了可执行平台。
