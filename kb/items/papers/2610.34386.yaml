summaries:
  one_liner_zh: 提出多域RSI评测环境ParetoRSI-Gym，智能体经数据搜索-训练-读回迭代改进LLM，最强系统泛化分数平均提升9.2%。
  abstract_zh: 该工作提出ParetoRSI-Gym，一个面向递归自我改进（RSI）的多域评测环境：智能体在数学、代码、金融、医学、科学五个域中搜索并筛选数据、执行SFT训练、读回各域结果并循环迭代，其中初始LLM、域集合、工具集与训练管线全部固定，仅数据可变。各域泛化基准用于将真实能力提升与对优化得分的过拟合区分开。在3个智能体系统、3个基座模型、5轮迭代及多种子实验中，最强的Claude
    Code + Opus-5系统使代理最优检查点的泛化分数相对起始模型平均提升9.2%（+2.3绝对百分点，3基座×5域等权平均），单域最高相对提升达63%（Ministral-3-3B上的医学域）。进一步分析表明评测框架（harness）与其驱动的模型同等重要，且各智能体保留了各自独特的数据选择策略。
