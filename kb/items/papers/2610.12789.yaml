summaries:
  one_liner_zh: 将环境知识表示为可证伪假设的自进化世界模型，在 LLM 冻结下实现测试时的智能体自我改进。
  abstract_zh: 论文提出 EvoBelief，一种将环境知识组织为可证伪假设的自进化世界模型：意外结果与决策相关的未知触发假设形成，后续观测和受控实验提供独立验证后方可在其支持范围内指导预测与规划，反例会使规则收窄或退役。语言模型全程保持冻结，每条规则与其证据及所影响的决策保持关联。在涵盖静态动力学、隐藏漂移和科学发现的四个基准上，EvoBelief
    提升任务表现并跨任务复用所学规则。ALFWorld 上（无 actor 侧转移记忆）相比匹配的 Frozen World Model 基线，使用 Claude Haiku 4.5 和 GPT-5.4
    分别提升成功率 23.9% 和 31.3%；DiscoveryWorld Reactor Lab 中完成 83.3% Normal-tier 与 58.3% Challenge-tier 实例，而所有被评估基线均为
    0%。
