summaries:
  one_liner_zh: 提出W.A.L.T：因果编码器统一图像视频潜空间、窗口注意力扩散Transformer，级联超分实现SOTA视频生成
  abstract_zh: W.A.L.T是一种基于Transformer的扩散模型视频生成方法，包含两个关键设计。其一，采用因果编码器将图像与视频联合压缩到统一潜空间，实现跨模态的联合训练与生成。其二，采用面向空间与时空联合生成建模的窗口注意力架构，降低显存占用与训练开销。在不使用classifier-free
    guidance的条件下，该方法在UCF-101、Kinetics-600视频生成基准与ImageNet图像生成基准上取得SOTA。作者还级联训练三个模型（基础潜视频扩散模型加两个视频超分扩散模型）用于文生视频，可生成512×896分辨率、8帧每秒的视频。
