summaries:
  one_liner_zh: 系统稀疏化3D高斯语言场语义嵌入，仅数百token即可保持3D视觉问答性能并大幅降低内存与推理成本。
  abstract_zh: 该文考察3D视觉问答（VQA）中3D高斯语言场密集语义嵌入的必要性，将嵌入系统稀疏化至低于单帧等效块、低至8个视觉token的极端区间。作者比较随机、几何、语义及空间-语义联合选择策略，并提出基于检测对象分配token预算、同时保留背景上下文的对象级稀疏化方法。在ScanQA与MV-ScanQA上的实验表明密集高斯语言场存在大量冗余：仅数百个语义嵌入（不足原始表示的1%）即可保持较强的VQA性能。对象级选择在低至256
    token时性能变化有限，此时保留SplatTalk 32,076-token推理输入的0.80%、平均77,207高斯密集场的0.332%，解码特征内存降低125倍并提升推理吞吐。
