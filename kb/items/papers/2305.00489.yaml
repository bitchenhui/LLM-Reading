summaries:
  one_liner_zh: 提出含微图像预处理与全局注意力的端到端聚焦光场（光场）图像压缩，码率表现优于HEVC/VVC帧内编码。
  abstract_zh: 针对聚焦光场相机图像中微透镜中继成像产生的复杂微纹理及微图像间长距离相关性使现有压缩方法失效的问题，提出有损端到端学习压缩架构。首先依据成像原理设计预处理方案，去除子孔径图像无效像素并将微图像对齐到矩形网格；随后提出大感受野的全局注意力模块，通过重采样过程中的逐像素向量注意力捕捉特征图间全局相关性。同时构建了包含1910张内容与深度多样性聚焦光场图像的新数据集用于训练与测试。实验表明，在20张预处理后图像上，该方法相比HEVC与VVC帧内编码分别平均降低62.57%与51.67%码率，相比最先进端到端图像压缩方法节省18.73%码率且重建感知质量更佳，数据集与代码已开源。
