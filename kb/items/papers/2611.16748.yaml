summaries:
  one_liner_zh: 构建统一框架在生成、筛选、修正全流程引导LLM，将物理知识蒸馏进视频数据，实现视频生成模型的自我改进与修复。
  abstract_zh: 视频生成模型虽视觉逼真，但在物理动态与因果一致性上仍有不足，且细粒度物理监督难以获取。PhysLoop 提出统一框架，在视频生成、筛选与修正全过程中引导并约束大语言模型，将其物理知识蒸馏为物理一致的视频，支持可控训练数据构建与推理期视频修复。通过识别并修正失败案例，该框架以有限人工干预推动视频生成模型迈向递归自我改进（RSI）。作者发布了覆盖多样室内外场景的
    10 万条视频、配套生成工具，以及 PhysLoop-Gen 与 PhysLoop-Repair 两个评测集，分别用于可控生成与局部修复评估，并在外部 Physics-IQ Verified 基准上评估物理行为。
