summaries:
  one_liner_zh: 提出含多智能体开发框架、仓库回译自我改进与全栈测试基准的 FullStack-Agent 系统，显著提升 LLM 全栈网页开发能力。
  abstract_zh: 针对现有代码智能体只善前端生成、难以构建含真实数据处理与存储的生产级全栈应用的问题，提出统一智能体系统 FullStack-Agent。其包含三部分：FullStack-Dev
    多智能体框架（规划、代码编辑、代码库导航与缺陷定位）；FullStack-Learn，通过回译爬取与合成的网站仓库实现数据扩展与自我改进，提升主干 LLM；FullStack-Bench，系统性评测生成网站的前端、后端与数据库功能。结果显示
    FullStack-Dev 在前端、后端、数据库测试用例上分别超越此前 SOTA 8.7%、38.2%、15.9%；FullStack-Learn 通过自我改进使 30B 模型在三组用例上分别提升
    9.7%、9.5%、2.8%。
  deep_dive: docs/auto/2602.03798.md
