summaries:
  one_liner_zh: 提出面向金字塔级联扩散架构的像素域由粗到细后验采样算法，求解超分、去模糊、修复与加速MRI等图像逆问题。
  abstract_zh: 针对潜空间扩散模型因自编码器压缩损失空间细节、并将优化转为非线性问题的缺陷，论文提出适配金字塔/级联架构的像素域后验采样算法 CLIMB-Flow。方法采用由粗到细的分层策略，在每一尺度交替执行三步：从当前粗而带噪的图像估计终点、对干净图像做数据一致性更新、再重新加噪回网络期望的噪声水平，从而以两个条件分布间的近似吉布斯采样求取该尺度后验。实验在
    ImageNet、CelebA、AFHQ 和 fastMRI 上覆盖修复、去模糊、超分辨率与加速 MRI 任务，像素域重建分辨率可达 512×512，在 CelebA 上相对最强对比方法取得 1.37–7.66
    dB 的 PSNR 提升。
