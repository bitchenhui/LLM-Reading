summaries:
  one_liner_zh: 提出写-管-读记忆闭环与三维分类法，系统综述LLM智能体记忆的设计、实现与评估。
  abstract_zh: 该综述将LLM智能体记忆形式化为与感知、行动紧密耦合的'写入-管理-读取'闭环，并沿时间范围、表征基底、控制策略三个维度建立分类法。文章深入考察五大机制族：上下文内压缩、检索增强存储、反思式自我改进、分层虚拟上下文与策略学习管理。评估部分追踪了从静态回忆基准到记忆与决策交织的多会话智能体测试的转变，并分析四个近期基准暴露的顽固差距。最后讨论持续巩固、因果化检索、可信反思、学习遗忘与多模态具身记忆等开放挑战。
