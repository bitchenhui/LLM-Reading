summaries:
  one_liner_zh: 提出FederatedSkill，以语义技能差异补丁为通信单元实现隐私保护、个性化的跨用户智能体技能协同演化。
  abstract_zh: 现代LLM智能体依赖技能库处理复杂任务，技能演化是自我改进的主要驱动力，但孤立的单用户任务流缺乏构建全面技能所需的数据多样性。跨用户协作虽可突破数据瓶颈，但现有轨迹共享方法损害用户隐私，且统一全局技能库无法适配客户端异质性。FederatedSkill以本地技能库上的结构化补丁（语义技能差异）作为通信基本单元，服务器端演化智能体聚合这些补丁，动态建模各客户端的能力边界，实现严格的个性化技能演化而非次优全局平均。在20个不同智能体任务族上的评估显示，该方法相对自我演化基线成功率最高提升44.4%，计算成本最高降低37.5%。
