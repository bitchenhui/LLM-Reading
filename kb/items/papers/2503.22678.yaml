summaries:
  one_liner_zh: 提出开源临床模拟环境MedAgentSim，医生-患者-测量多智能体多轮交互，结合自我改进机制迭代提升LLM诊断能力。
  abstract_zh: 该工作提出MedAgentSim，一个开源临床模拟环境，包含医生、患者和测量智能体，用于评估和提升LLM在动态诊断场景中的表现。医生智能体通过多轮对话主动向患者问诊，并向测量智能体申请检查（如体温、血压、心电图）和影像结果（如MRI、X光），模拟真实诊断流程。框架引入自我改进机制使模型迭代优化诊断策略，并结合多智能体讨论、思维链推理与基于经验的知识检索，随医生智能体接触更多患者实现渐进式学习。作者还提出评估LLM动态、上下文感知诊断交互能力的基准，系统支持全自动与人工控制两种模式。在多种模拟诊断场景中的综合评估验证了方法有效性，代码与仿真工具已开源。
