summaries:
  one_liner_zh: 从处理后sRGB图与ISO元数据预测代理参考图，无参考估计PSNR/SSIM/LPIPS以评估相机ISP流水线。
  abstract_zh: 评估相机ISP流水线需要测量去噪、去马赛克、色调映射与压缩等操作引入的低层伪影，但现有盲IQA方法偏重语义与高层线索，而PSNR/SSIM/LPIPS等全参考指标又要求难以获取的严格对齐图像对。为此，作者提出无参考学习框架：从处理后的sRGB图像及其ISO元数据预测一个代理sRGB参考图，再与处理图像按标准全参考形式计算PSNR、SSIM和LPIPS。实验表明该代理参考模型可从合成数据学习并应用于真实相机数据，且轻量LoRA微调能在ISP组件或流水线配置变化时高效适配。该方法在估计指标值上优于直接指标回归，与全参考排名的一致性也高于常规盲IQA方法。
