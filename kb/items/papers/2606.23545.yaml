summaries:
  one_liner_zh: 开源统一框架，集成六个LIC模型并与传统帧内编码器在等码率下对比评测质量
  abstract_zh: 该论文针对学习式图像压缩（LIC）评测中软件栈异构、训练条件不一、评测方法分歧的问题，提出开源框架UI-LIC。框架集成了六个高性能LIC模型，通过统一配置参数的集中控制器完成训练、推理与分析。其GUI程序支持将LIC模型与传统视频帧内编码器进行等码率对比，并计算PSNR、SSIM、VMAF、LPIPS等质量指标；另提供可配置质量热图叠加的交互式图像分析器。软件以MIT许可证开源，旨在降低LIC研究门槛，一条安装命令即可完成对比指标与主观分析。
