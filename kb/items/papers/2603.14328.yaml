summaries:
  one_liner_zh: 发布覆盖10种英语口音的神经音频编解码器重合成与LLM-TTS语音MOS基准数据集CodecMOS-Accent。
  abstract_zh: 该工作提出CodecMOS-Accent数据集，用于评测神经音频编解码器（NAC）重合成语音及其上训练的基于LLM的TTS系统在非标准（带口音）语音上的表现。数据集包含来自24个系统的4,000条重合成与TTS样本，涉及32位说话人、10种英语口音。大规模主观测试由25名听测者给出19,600条标注，覆盖自然度、说话人相似度和口音相似度三个维度。分析发现说话人相似度与口音相似度紧密相关、客观指标具有一定预测能力，且听测者与说话人共享口音时存在感知偏差，旨在推动面向人的NAC与带口音TTS评测研究。
