summaries:
  one_liner_zh: 提出熵约束编解码器ECC，在两个测试集上平均降低BD-rate 39.9%（ViSQOL）/76.3%（PESQ）
  abstract_zh: 论文从率-失真视角对神经语音压缩进行基准式分析，指出许多神经语音编解码器以预设速率的离散符号表示量化隐变量、或在符号生成后才做熵编码，导致表示学习与概率建模解耦。作者形式化统一的基于学习的语音编码流程，并分析近期神经语音编解码器，发现显式概率建模在该领域仍研究不足。据此提出熵约束编解码器ECC，将标量量化与学习型熵模型结合，集成超先验边信息、通道级上下文建模、隐变量残差预测与轻量时序建模，训练时用于率估计、推理时用于算术编码。为进一步提升低码率效率，引入entropy
    skip机制，利用解码端可得的尺度估计直接略去高可预测的残差符号而无需传输额外跳过掩码。实验表明ECC在两个常用测试集上相对传统与神经编解码基线平均降低BD-rate：ViSQOL 39.9%、PESQ
    76.3%，消融与诊断研究验证了熵建模的有效性。
