claims:
- statement: 把 VVC 8-tap 分数插值近似为 2-tap 后，MMVD 候选是否值得计算可归结为一次残差-梯度内积的符号（-α·⟨e,g⟩≥0 则跳过），判决成本从「完整运动补偿」降到「一次内积」。
  evidence: docs/02_MMVD-Fast.md §2-3
  confidence: reported
- statement: fast preset 下 +Ours 相对 full MMVD baseline：BD-Rate -0.35% vs -0.64%，编码时间节省 2.23% vs 21.10%——几乎不损失压缩率地拿走大部分加速收益。
  metrics:
  - ref: metric:BD-Rate
    value: -0.35
    unit: '%'
    scope: +Ours, fast, CTC 全类, PSNR, vs anchor
  - ref: metric:EncodeTimeSaving
    value: 2.23
    unit: '%'
    scope: +Ours, fast
  evidence: docs/02_MMVD-Fast.md §6
- statement: faster preset 下 +Ours 保持 BD-Rate -0.72%、时间节省 4.64%（baseline 36.39%）。
  metrics:
  - ref: metric:BD-Rate
    value: -0.72
    unit: '%'
    scope: +Ours, faster
  - ref: metric:EncodeTimeSaving
    value: 4.64
    unit: '%'
    scope: +Ours, faster
- statement: 效率-复杂度比 η：fast preset 从 +Fast123 的 11.79 降到 7.10（baseline 35.17），权衡显著改善。
  metrics:
  - ref: metric:Eta
    value: 7.1
    scope: +Ours, fast
  - ref: metric:Eta
    value: 11.79
    scope: +Fast123, fast
- statement: 平均每 CTU 的 MMVD 尝试次数比例从 +Fast123 的 21.07% 降到 11.05%，候选数再减半（r≈0.52）。
  evidence: docs/02_MMVD-Fast.md §6
- statement: 对称偏移推断 + 十字采样点积 + SIMD 把额外开销从 4.21% 压到 2.23%；判据目前仅支持标准四正交方向，对角方向留作未来工作。
  evidence: docs/02_MMVD-Fast.md §4, §7
