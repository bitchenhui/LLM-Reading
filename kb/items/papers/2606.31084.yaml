summaries:
  one_liner_zh: 用 2-tap 滤波器差分近似把 VVenC 的 MMVD 候选判决降为一次残差-梯度内积，MMVD 搜索比从 21% 降到 11%，η 从 11.79 降到 7.10。
  abstract_zh: '观察 8-tap DCT-IF 主能量集中在两个整像素，推出任意两分数相位的滤波器差 ∝ [-1,1]， 进而把 MMVD 候选增益判断化为参考块空间梯度与 regular-merge
    残差的一次内积符号检验； 配合对称偏移推断与十字采样把开销压到 2.23%。理论清晰、可并入现有 Fast1/2/3 规则链。

    '
