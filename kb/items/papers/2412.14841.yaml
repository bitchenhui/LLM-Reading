claims:
- statement: 通用开源LLM生成的C代码经常不正确，且可能包含安全漏洞，而模型对错误与漏洞的自行检出能力都很差
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在提供失败测试或潜在漏洞报告作为反馈时，LLM展现出对缺陷代码的可观修复能力
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出用基准测试与静态分析反馈引导LLM自改进生成C代码的框架，发现其自查能力弱但据反馈修复能力可观
  abstract_zh: 该框架首先让通用开源LLM生成C代码解决编程任务，再用基准测试评估生成代码的正确性，并用静态分析工具检测潜在安全漏洞。随后考察模型自我评估生成代码、发现错误与漏洞的能力，最后以失败测试报告与漏洞报告作为反馈，考察模型修复缺陷代码的能力。结果显示模型经常生成不正确代码且可能含安全问题，而对这两类问题的自行检出能力都很差。积极方面是，在提供失败测试或潜在漏洞信息时，模型展现出可观的修复能力，为提升LLM代码生成安全性指出了有前景的方向。
