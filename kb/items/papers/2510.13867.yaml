summaries:
  one_liner_zh: JPEG AI 学习型图像编码标准首版技术综述：单流压缩域表示，兼顾人眼与机器消费。
  abstract_zh: JPEG AI 是 JPEG 专家组制定的基于学习的图像编码标准，旨在提供单流、紧凑的压缩域表示，同时面向人眼可视化与机器消费两类任务。其第一版计划于 2025 年初完成，聚焦人类视觉任务，在
    MS-SSIM、FSIM、VIF、VMAF、PSNR-HVS、IW-SSIM 与 NLPD 等质量指标上相较现有标准取得显著 BD-rate 降低。标准设计中纳入多种特性以保证跨设备、跨应用部署的广泛互操作性。本文系统综述了
    JPEG AI 标准的技术特性与设计要点。
