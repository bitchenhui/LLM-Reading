summaries:
  one_liner_zh: 面向IoT/MCU的超轻量学习型视频编码器：仅10.5K参数，码率较M-JPEG降约55%且支持自适应码率传输
  abstract_zh: 摄像头类IoT设备通常仅有1-2MB内存且网络不稳定，传统与深度视频压缩方法均超出其硬件能力，实际部署往往退化为M-JPEG。该文提出开源的自适应码率学习型视频压缩模型MCUCoder，编码器仅含10.5K参数、内存占用350KB，可在MCU等资源受限边缘设备上运行。在与M-JPEG能耗相近的前提下，以MS-SSIM为质量口径，MCUCoder在MCL-JCV与UVG数据集上分别将码率降低55.65%与55.59%。其生成按重要性排序的潜在表示，可依据可用带宽截断传输，从而在低资源设备上实现带宽波动下的平滑实时视频传输。
