summaries:
  one_liner_zh: 用行为规范加多前沿树搜索实现编码代理的递归自我改进，克服规范间'输出耦合'引发的回归问题
  abstract_zh: 论文研究冻结语言模型编码代理在不更新权重下的递归自我改进：代理依据自然语言行为规范生成代码，用执行验证的测试评估，再依据失败修订规范形成自改进闭环。针对程序实体相互依赖导致的'输出耦合'（改进某实体规范会破坏其他实体的正确性、产生打地鼠效应），提出多前沿树搜索框架
    SpecForge，含帕累托引导状态选择、先被调用者后被调用者的依赖约束实体选择、错误多样化扩展三项机制。在 DevEval+ 上，SpecForge 在五个骨干模型上均取得最佳性能：Claude-4.5-Sonnet
    求解率达 94.9%，较最强基线平均提升 5.7 个百分点。改进后的规范还可迁移至跨语言翻译与新功能实现等循环外任务，优于基准提供的需求文档。
