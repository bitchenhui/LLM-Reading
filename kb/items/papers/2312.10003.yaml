summaries:
  one_liner_zh: 用ReST式轨迹迭代训练与AI反馈强化学习实现ReAct式LLM智能体自我改进，两轮迭代即可蒸馏出参数少两个数量级的小模型。
  abstract_zh: 针对检索+LLM问答系统存在失败案例且因外部知识交互不可微而无法端到端训练的问题，本文定义了一个具备推理与外部知识操作能力的ReAct式LLM智能体。该方法采用ReST式的迭代训练：在历史轨迹上反复微调，使用增长批量的强化学习并结合AI反馈，实现持续自我改进与自蒸馏。实验表明，从一个提示式大模型出发，仅经过两轮算法迭代即可得到微调后的小模型，在挑战性组合式问答基准上以少两个数量级的参数量达到与大模型相当的性能。
