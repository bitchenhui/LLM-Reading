summaries:
  one_liner_zh: 将偏好优化与递归推理反馈结合，让小模型自我教学式迭代深化推理，并构建多智能体递归自我改进推理框架。
  abstract_zh: 论文提出PRefLexOR，将偏好优化与强化学习概念结合，使模型通过迭代推理改进实现自我教学，在训练与推理阶段多步重访和精炼中间推理步骤。第一阶段通过优化偏好与非偏好响应之间的对数几率对齐推理路径，同时从随机文本片段生成问题并借助检索增强构建动态知识图谱；第二阶段利用拒绝采样在屏蔽推理步骤的同时持续生成就地训练数据，以偏好优化精炼推理质量。在思考token框架内引入递归反馈回路，使推理更具连贯性、一致性与适应性；仅在30亿参数的小模型上即可实现，方法可直接嵌入任意预训练LLM。示例聚焦生物材料科学，覆盖域内与跨域应用，并基于思考与反思模态构建多智能体递归自我改进推理方法，在推理时通过重复采样逐轮提升回答质量。
  deep_dive: docs/auto/2410.12375.md
