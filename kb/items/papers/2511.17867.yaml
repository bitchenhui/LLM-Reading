summaries:
  one_liner_zh: 提出整数化低复杂度数据相关变换 INT-DTT+，在 VVC MTS 框架经 RDOT 设计取得超 3% BD-rate 节省，复杂度接近整数 DCT-2。
  abstract_zh: 论文针对 KLT、GBST 等数据相关变换能量压缩好但缺乏可加速的结构对称性的问题，提出通用的低复杂度数据相关变换设计框架。方法上，基于 DTT+（由 DTT 图秩一更新导出的
    GBST 家族），提出联合估计行列图的图学习算法；并利用 DTT+ 的渐进结构将变换核分解为基准 DTT 与结构化 Cauchy 矩阵，经低复杂度整数 DTT 与 Cauchy 矩阵稀疏化构建整数近似
    INT-DTT+。相比可分离 KLT，INT-DTT+ 在性能损失极小的前提下显著降低计算与内存复杂度。在 VVC 显式多变换选择（MTS）框架下按率失真优化变换（RDOT）思路集成，相对 VVC
    MTS 基线取得超过 3% 的 BD-rate 节省，且基准 DTT 系数就绪后复杂度与整数 DCT-2 相当。
