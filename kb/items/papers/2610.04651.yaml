summaries:
  one_liner_zh: 用一维高斯泼溅参数分解替代量化瓶颈的神经语音编解码器，单一checkpoint免重训练即可调码率。
  abstract_zh: 主流神经音频编解码器（RVQ、FSQ、单码本）均沿用VQ-VAE式的码本或标量网格划分，本文质疑这一划分是否必要。GS-Codec将3D场景重建中的高斯泼溅迁移至一维潜在空间，通过内层优化把编码器每段拟合为1D高斯基元的加权和，解码器由渲染和重建波形。为避免推理时迭代内循环的开销，另训练轻量GS
    Predictor Net单次前向回归基元参数；训练管线全程无量化器，仅训练后对拟合参数施加标量量化。该表示提供细粒度码率-质量权衡：单一checkpoint通过改变基元数量与每参数位深即可调整码率，无需重训练。在与EnCodec、DAC可比码率下，GS-Codec在说话人相似度（SIM）、可懂度（STOI）与感知质量（UTMOS）上持平或更优，语义性能（WER）相当。
