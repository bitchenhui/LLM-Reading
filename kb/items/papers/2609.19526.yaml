summaries:
  one_liner_zh: 提出SIFT，用LLM评审信号与Bradley-Terry聚合驱动轻量解耦树搜索，在严格算力预算下高效自我改进编码智能体。
  abstract_zh: 针对编码智能体自我改进中候选补丁评估依赖重跑基准任务、耗时过长的瓶颈，提出SIFT框架。方法上引入LLM-as-a-judge对候选补丁做成对比较，胜负记录经正则化Bradley-Terry模型聚合为强度分数，分数进而驱动轻量解耦树搜索中基于排名的父节点采样。昂贵的下游任务评估仅保留给最有希望的节点，评审分数提供了不受慢评估限制的中间信号。实验显示SIFT在完整Polyglot基准上超越现有基于树搜索的自进化框架，且CPU小时、墙钟时间与API成本显著更低。
  deep_dive: docs/auto/2609.19526.md
