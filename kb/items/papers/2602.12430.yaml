summaries:
  one_liner_zh: 聚焦LLM智能体技能抽象层的综述：架构、获取、部署与安全，提出四级技能信任治理框架与自改进生态议程
  abstract_zh: 该综述系统梳理LLM智能体的技能抽象层——即按需加载、无需重训练的可组合指令/代码/资源包，形式化为渐进式披露范式、可移植技能定义及与MCP协议的集成。文章沿四轴组织领域：架构基础（SKILL.md规范、渐进上下文加载、技能与MCP互补角色）、技能获取（技能库强化学习、自主技能发现SEAgent、组合式技能合成）、规模化部署（CUA栈、GUI
    grounding、OSWorld与SWE-bench基准）与安全（实证分析显示26.1%的社区贡献技能存在漏洞）。据此提出技能信任与生命周期治理框架，采用四级门控权限模型将技能来源映射到分级部署能力。最后归纳七个开放挑战，并提出实现可信、自我改进技能生态的研究议程。
  deep_dive: docs/auto/2602.12430.md
