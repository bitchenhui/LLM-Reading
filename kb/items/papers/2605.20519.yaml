summaries:
  one_liner_zh: 提出CodecAttack：在神经音频编解码器潜空间而非波形域优化对抗扰动，攻击可穿透Opus/MP3/AAC压缩，证明有损压缩非可靠防御。
  abstract_zh: 先前针对音频大语言模型（Audio LLM）的对抗攻击可被部署中的编解码器压缩预处理检测或消除，本文提出的 CodecAttack 将扰动优化从波形域转移到神经音频编解码器的连续潜空间。方法采用多码率
    straight-through 期望变换（EoT）跨多种压缩信道硬化攻击，且完全无需修改目标模型。在三个真实音频LLM部署场景与三个目标模型上，CodecAttack 在 Opus 中等码率下取得平均
    85.5% 的目标子串攻击成功率，而同等 EoT 硬化的波形基线在任意码率下不超过 26%。攻击无需重训即可迁移到保留编解码器，在 MP3 上最高达 100%、AAC-LC 上达 84%。分带能量分析显示潜空间扰动集中在编解码器分配比特最多的
    4kHz 以下频段，而波形基线扩散至被丢弃的高频，证明有损压缩并非对抗音频的可靠防御。
