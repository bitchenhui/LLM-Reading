summaries:
  one_liner_zh: 提出基于提升方案MCTF的端到端可训练小波视频编码器，UVG上BD率较HEVC最高节省21%并超越SOTA学习型编码器。
  abstract_zh: 本文提出一种基于运动补偿时域滤波（MCTF）的端到端可训练小波视频编码器，为目前由残差编码与条件编码主导的学习型视频压缩提供了新的编码方案。通过在时间、水平和垂直三个维度执行离散小波变换，框架具备可解释性并支持空间与时域可分级。作者采用提升方案（lifting
    scheme）实现可训练MCTF模块，解决了训练中考虑多级时域分解以及MCTF编码顺序带来的较大时域位移问题，并提出推理阶段按运动强度自适应的内容自适应MCTF扩展。实验与学习型条件编码器及传统混合编码框架对比，尤其在高码率下率失真表现突出，UVG数据集上对HEVC的平均BD率节省最高达21%，超越现有最先进学习型视频编码器。
