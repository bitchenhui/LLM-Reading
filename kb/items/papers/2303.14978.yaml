summaries:
  one_liner_zh: 提出并行Transformer-CNN混合块TCM与基于SWAtten的通道级熵模型，在多分辨率数据集上达到LIC的SOTA率失真性能。
  abstract_zh: 该文提出一种高效并行的Transformer-CNN混合（TCM）块，复杂度可控，将CNN的局部建模能力与Transformer的非局部建模能力结合，用于改进图像压缩模型的整体架构。同时受近期熵估计模型与注意力模块进展的启发，提出通过通道
    squeezing 实现参数高效的、带Swin Transformer注意力（SWAtten）模块的通道级熵模型。实验表明，该方法在Kodak、Tecnick与CLIC Professional
    Validation三个不同分辨率数据集上取得优于现有学习图像压缩（LIC）方法的SOTA率失真性能。代码已在GitHub开源。
