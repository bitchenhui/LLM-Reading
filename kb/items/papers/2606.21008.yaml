summaries:
  one_liner_zh: LLM 相互构造类比并互评，用评分矩阵 SVD 同时导出裁判与生成者评分，无需外部标准答案，与 GPQA Diamond 相关性达 0.98。
  abstract_zh: 论文提出完全自包含的 Metanym 游戏基准：语言模型比赛撰写跨领域类比模板并相互主观打分，用事实评分矩阵的 SVD 左右奇异向量分别给出裁判评分与生成者评分，首次在 LLM
    同行评议中由一次分解得到两种评分。该基准与专家命题、有标准答案的 GPQA Diamond 相关性达 r=0.98，经审计确认无泄漏；作者假设两者测量同一能力——LLM 以跨领域原型语境持有知识，GPQA
    在单一领域实例化知识而 Metanym 游戏将一个原型实例化到多个领域，仅靠类比、无需推理。实验显示推理能力几乎不改变游戏评分却会提升 GPQA 成绩，且生成与评判是不同技能：最强生成者只是中等裁判。由五名最佳裁判组成、席位可竞争的评议会发布官方评分，可作为自我改进
    AI 的候选引导信号。
