summaries:
  one_liner_zh: 微调VLM智能体逐步选择修复工具并以预测PSNR增益决定接受或停止，遥感复合退化修复较最强基线提升2.3–3.2 dB
  abstract_zh: 论文针对遥感图像中雾、云、噪声、模糊、低光与低分辨率共存的复合退化问题，提出EORestore-Agent：用微调视觉语言模型逐步报告残余退化类型，对各类退化工具池联合打分，从逐步选择中涌现修复顺序。一个在合成退化链上以全参考监督训练的相对质量评分器，预测从当前图像到每个候选工具输出的PSNR/SSIM/LPIPS变化，仅当无负变化且预测PSNR增益为正时接受该步骤，否则保留当前图像。在含六种退化的合成Landsat-8基准上，该方法较最强重训all-in-one基线在2至6种退化复合场景中提升PSNR
    2.3–3.2 dB，而零样本自然图像智能体在18个设置中17个PSNR低于退化输入；用无参考质量差替换学习型评分器损失1.1–4.6 dB。Sentinel-2样例显示无需重训即可迁移到真实大气退化。
