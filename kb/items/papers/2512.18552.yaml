summaries:
  one_liner_zh: 仅凭沙盒代码仓库，经自博弈RL注入并修复bug训练单一LLM软件智能体，在SWE-bench上获显著自我提升。
  abstract_zh: 论文提出Self-play SWE-RL（SSR），迈向超级智能软件智能体训练范式的第一步：仅需可访问装有依赖的沙盒化代码仓库，无需人工标注的issue或测试。单一LLM智能体通过强化学习在自博弈环境中迭代注入并修复复杂度递增的软件bug，每个bug由test
    patch形式化定义而非自然语言issue描述。在SWE-bench Verified与SWE-Bench Pro上分别自我提升10.4和7.8点，且在整个训练轨迹中持续优于人类数据基线，尽管评测所用自然语言issue在自博弈中缺席。作者称该早期结果表明智能体可自主从真实软件仓库积累学习经验，是通向超越人类能力的超级智能系统的一条路径。
