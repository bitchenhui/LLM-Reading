summaries:
  one_liner_zh: 构建288条LLM自提实验想法数据集，测得前沿LLM预判实验结果最多仅解释一半方差（R²=0.49），直觉有用但有限。
  abstract_zh: 为检验 LLM 在长训练跑之前判断自生成 ML 实验想法是否值得执行的直觉，作者构建了覆盖 8 个 MLE-bench 任务、共 288 条 LLM 提出的实验想法的数据集，并让
    5 个前沿 LLM 预测各想法的影响力，再与实际训练结果对比。结果显示：预测显著优于随机但远非准确，最佳的 Claude Opus 5.5 仅解释结果方差的约一半（R²=0.49）；所有被测模型系统性低估变化幅度，且预测质量在不同任务间差异很大。此外，实现想法所用编码
    harness 的选择对结果影响很小，未发现自偏好证据，更高推理档位与更多上下文仅带来小幅提升。作者发布该数据集以支持后续研究。
  deep_dive: docs/auto/2610.22599.md
