summaries:
  one_liner_zh: 微调LLM在单次推理内生成多样化思维链，实现无需外部反馈的推理链自精化并提升推理性能。
  abstract_zh: 论文提出多样化思维链（DCoT）方法：微调大语言模型使其在单次推理步骤内顺序生成多条不同的思维链，区别于以往并行生成多条独立CoT再做集成或事后组合的路线。在覆盖多种推理类型的广泛任务实验中，DCoT微调在1.3B到70B多规模、多模型家族上均优于CoT基线，对数值答案等大结果状态空间任务收益尤为显著。定量分析与人工评估表明增益来自模型在推理内生成第二条更优推理链的自精化能力，无需外部反馈，展示了一种此前难以实现的自我改进。
