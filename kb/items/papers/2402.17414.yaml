summaries:
  one_liner_zh: 提出 DCVC-FM：以可学习量化缩放的潜特征调制与时序特征周期刷新，解决宽质量范围与长预测链退化的条件式神经视频编解码器。
  abstract_zh: 针对条件式神经视频编解码器（NVC）走向实用化面临的关键问题，本文提出基于特征调制的强力 NVC。其一，通过可学习量化缩放器调制当前帧潜特征，并设计均匀量化参数采样机制改善编码与量化的协调，使单模型支持的
    PSNR 质量范围从先前约 3.8 dB 提升到约 11.4 dB。其二，提出周期性刷新的时序特征调制机制，缓解大帧内周期（长预测链）设置下明显的质量退化。此外设计了同时支持 RGB 与 YUV
    色彩空间的单模型。在单一帧内设置下，相比先前 SOTA NVC 实现码率节省 29.7%、MACs 减少 16%，代码已在 github.com/microsoft/DCVC 开源。
