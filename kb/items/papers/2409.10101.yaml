summaries:
  one_liner_zh: 提出自适应分割初始化为SMoE/RBF核回归配置核，较规则网格与K-Means初始化显著提升质量与稀疏度并加速收敛。
  abstract_zh: 核图像回归方法（SMoE门控网络与带导向核的RBF网络）广泛应用于图像/光场压缩、Gaussian Splatting、去噪与超分，但其参数估计依赖梯度下降迭代优化，计算负担大。本文提出自适应分割初始化：将核分配到预计算的图像分割片段中，在每个片段内经迭代优化与核稀疏化推导最优核数量、位置与导向参数，再将局部片段信息聚合成可用于迭代优化的全局初始化。结果显示，相比广泛使用的规则网格初始化、K-Means初始化及已有分割初始化方法，客观与主观质量均大幅提升，模型稀疏度显著改善：同等质量下核数量约减少50%。整体运行时间最多节省50%，且该初始化策略可按分割数高度并行，4块并行GPU即可再获初始化阶段50%的运行时间节省。
