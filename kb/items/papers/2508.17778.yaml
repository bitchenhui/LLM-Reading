summaries:
  one_liner_zh: 用LLM智能体解析自然语言意图并自组织编排6G网络控制环路，AI-RAN Factory持续生成更优智能体实现网络智能自进化。
  abstract_zh: 提出AgentRAN，一个AI原生、对齐Open RAN的智能体框架：LLM驱动的智能体解析自然语言意图、通过结构化对话协商策略，并在网络中编排分布式控制环路。系统构建跨时间尺度、空间域和协议层的自组织智能体层级，将复杂意图逐层分解。核心创新AI-RAN
    Factory基于运行数据持续生成改进的智能体与算法，无需初始训练数据即可自举。实时5G实验验证了在功率控制与调度任务上对运营商意图变化的动态适应，且所有智能体推理可审计。
