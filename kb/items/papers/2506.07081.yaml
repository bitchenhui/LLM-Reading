summaries:
  one_liner_zh: 用流式低码率神经音频编解码器特征与标签延迟训练，实现低延迟、低截断错误的多轮对话端点检测。
  abstract_zh: 论文提出面向多轮对话系统的实时语音端点检测方法，以流式低比特率神经音频编解码器（NAC）特征替代传统基于频谱的音频特征。为降低截断错误，进一步引入新的标签延迟训练方案。在固定160ms中位延迟下，NAC结合标签延迟的方法相对基线在单流配置中取得42.7%的相对截断错误降低，双流配置取得37.5%。该方法还可高效集成到基于编解码器的预训练语音大语言模型中，使其中位响应时间缩短1200ms、截断错误降低35%。
