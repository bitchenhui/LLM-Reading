summaries:
  one_liner_zh: 冻结LLM智能体以自然语言规则手册为外部记忆，经反思-修订-编译-验证循环实现模型驱动RSI，在ARC-AGI-3上全部通关。
  abstract_zh: Memento 3 让冻结参数的 LLM 智能体通过外部记忆持续学习显式世界模型：以自然语言规则书作为持久语义记忆，记录关于环境动态的可修正假设，并将其编译为可执行代码用于预测与规划。在观察、反思、规则修订、编译与验证的持续循环中，智能体利用预测误差同时细化规则书与代码；只有当
    LLM 判定代码忠实于规则书且单元级回放能复现观测转移时，更新才被接受。该过程被作为一条通向递归自我改进（RSI）的模型驱动路径加以研究，底层 LLM 全程保持不变；种群扩展版本并行维护多个世界模型，共享交互证据并以预测引导探索。在
    ARC-AGI-3 上，单模型智能体通关全部 25 个公开游戏的所有关卡，平均 RHAE 达 100.0，动作数仅为人类用量的 44%；Atari Pong 案例中学习到的反馈控制器在三个不同开局对局均以
    21:0 获胜且无需进一步 LLM 调用。
  deep_dive: docs/auto/2610.11794.md
