- statement: 在B帧编码任务上，IBVC相比相关最先进学习方法取得显著提升，且相比H.266（VTM）随机接入（RA）配置可节省码率。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出插值驱动的学习型B帧压缩IBVC，以免码率插值式MEMC替代光流编码，码率优于H.266/VTM随机接入。
  abstract_zh: 针对现有学习型B帧压缩直接沿用P帧编解码器导致量化运动不准、运动补偿低效的问题，提出仅含视频帧插值与伪影削减压缩两大操作的IBVC。该方法基于插值实现免码率的运动估计与补偿（MEMC），规避光流量化及附加压缩失真；并部署残差引导掩码编码器，借助插值多尺度依赖自适应筛选有效上下文，降低重复码率消耗。同时提出条件时空解码器替代MEMC编码以消除位置误差与伪影。B帧编码实验表明IBVC显著优于相关SOTA方法，且相比H.266（VTM）随机接入（RA）配置可节省码率，代码将开源。
