summaries:
  one_liner_zh: 提出多智能体自动化科研框架，以LLM覆盖科研全生命周期，指向自我改进的AI驱动科研范式
  abstract_zh: 论文提出Agent-Based Auto Research，一个结构化的多智能体框架，旨在自动化、协调并优化科学研究全生命周期。系统依托大语言模型与模块化智能体协作，覆盖文献综述、构思、方法规划、实验、论文写作、审稿回复与成果传播等主要科研阶段。框架针对工作流碎片化、方法论专业能力参差与认知过载等问题，提供系统化、可扩展的科研路径。初步探索表明Auto
    Research作为自我改进、AI驱动的科研范式具有可行性与潜力。
