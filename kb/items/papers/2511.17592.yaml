summaries:
  one_liner_zh: 开源的AlphaEvolve式LLM-进化混合优化框架，模块化实现MAP-Elites、异步DAG评估与多岛策略
  abstract_zh: GigaEvo 是一个可扩展的开源框架，用于研究和实验受 AlphaEvolve 启发的 LLM-进化混合计算方法，针对已发表工作高层描述缺乏实现细节、可复现性不足的问题。系统模块化实现了
    MAP-Elites 质量多样性算法、异步 DAG 式评估流水线、带洞察生成与双向谱系追踪的 LLM 驱动变异算子，以及灵活的多岛进化策略。框架强调模块化、并发性与声明式配置下的快速原型开发。作者在
    AlphaEvolve 论文的三个挑战性问题上评估框架的可复现性并验证实现：Heilbronn 三角形放置、正方形内圆填充与高维 kissing number。框架与全部实验代码均已开源。
