summaries:
  one_liner_zh: 构建专家审计的OmniQ量子复现基准并提出自改进AI科学家RA，将验证过的修复蒸馏为可复用经验，大幅提升LLM智能体复现成功率。
  abstract_zh: 论文构建了专家审计的虚拟研究环境OmniQ，将59篇已发表量子研究论文转化为可执行复现任务，系统评测了5个基于大语言模型的智能体系统与6个第三方agent harness。结果显示当前AI科学家往往无法复现已发表结果，暴露出论文传递信息与自主智能体所需信息之间的根本错配；而人类专家干预可将失败转化为成功复现。据此作者提出面向量子领域的自改进AI科学家Residual
    Agents（RA），将外部验证的工作流修复蒸馏为可复用研究经验，在固定基座模型与有限适配预算下将DeepSeek V4.1 Flash性能从68%提升至85%，以约三分之一成本匹配Claude
    Code+Opus 5。全部复现结果被集成到基于模型上下文协议（MCP）的可扩展平台，支持新论文持续纳入。
