summaries:
  one_liner_zh: 统一框架QuantSR+融合比特重分配、量化可裁剪架构与局部蒸馏，实现2-4比特超分网络的精度-效率最优权衡。
  abstract_zh: 论文提出QuantSR+，一个面向超低比特（2-4位）量化超分辨率网络的统一框架，同时改进量化算子、网络设计与训练优化。其三项核心技术包括：重分布驱动的比特确定（RBD）在前向与反向传播中重塑量化分布以保持表征保真度；量化可裁剪架构（QSA）从过参数化模型出发逐步剪除次要模块以满足效率预算；剪枝引导的函数局部蒸馏（SFD）通过块级特征对齐与渐进式局部训练更好地捕捉量化效应并加速收敛。实验显示QuantSR+在专用量化超分方法与通用量化方法中均达到SOTA：在SwinIR-S的Urban100（x4）上，2比特设置较SOTA基线提升PSNR
    0.29 dB，同时运算量最多降低87.9%、存储降低89.4%，且对CNN与Transformer类SR模型均有效。
