  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 首个智能体自进化启发式框架：LLM智能体迭代演化启发式逻辑生成可解释出行链，优于深度生成与LLM方法。
  abstract_zh: 人类出行生成旨在为特定人群合成真实的出行链，现有深度生成模型、基于LLM的方法与传统启发式难以同时满足可解释性、行为合理性、群体级分布对齐与推理效率的要求。MobEvolve
    首先初始化一个行为启发的启发式系统，随后由 LLM 智能体在验证集上诊断经验性错位与失败案例，提出针对性更新并积累演化记忆，实现累积式自我改进。在新加坡与蒙特利尔两个基准上，MobEvolve 在个体轨迹保真度、群体级分布对齐与行为合理性方面显著优于最先进的深度生成与基于
    LLM 的方法，同时保持可解释性与高推理效率。
