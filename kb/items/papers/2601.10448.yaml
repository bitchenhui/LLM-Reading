summaries:
  one_liner_zh: 在 MPEG 多层测试条件下，用 DCR 主观评估 VVC+LCEVC 的 UHD 输出，并与上采样 VVC 和 ML-VVC 对比。
  abstract_zh: 本文报告了一种多层视频编码配置的主观质量评估：在 HD 分辨率的 VVC 基础层之上叠加由 LCEVC 测试模型 LTM 8.1 编码的 LCEVC 增强层，重建生成 UHD
    输出。测试遵循 MPEG 多层视频编码评估既定的方法与条件，将 VVC+LCEVC 配置与两个参考对比：上采样的 VVC 基础层解码输出以及多层 VVC（ML-VVC）。实验设置两个工作点，增强层码率约占总码率的
    10% 与 50%。主观评估采用 DCR 方法，由 25 名参与者对 15 个 SDR 与 HDR 序列打分，结果以带 95% 置信区间的 MOS 呈现，用于比较各编码方案与工作点之间的感知质量。
