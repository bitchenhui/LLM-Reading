summaries:
  one_liner_zh: 以无参数移位操作替代大核卷积并配合轻量通道注意力与轻量熵模型，构建高性价比的学习图像压缩框架。
  abstract_zh: 针对学习图像压缩（LIC）计算开销大、骨干网络特征冗余的问题，本文提出轻量级框架 ShiftLIC。其核心是空间移位块（SSB），用移位操作结合小核卷积替代大核卷积，在保持特征提取能力的同时显著降低计算复杂度与参数量；并引入基于递归特征融合的通道注意力模块以低成本增强通道间特征交互。此外，将
    SSB 集成进熵模型，使熵估计过程更加轻量。实验显示 ShiftLIC 在计算成本、参数量与解码延迟上优于 VVC Intra、GMM 等主流方法，并在每像素 MACs 归一化的 BD-rate
    上取得 -102.6% 的 SOTA 增益，适合资源受限环境部署，代码已开源。
