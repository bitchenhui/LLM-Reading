summaries:
  one_liner_zh: 交替SFT与强化学习的迭代循环使开源视觉语言模型涌现R1式思维链推理并形成持续自我改进。
  abstract_zh: 论文提出OpenVLThinker，是首批展现复杂思维链推理能力的开源大型视觉语言模型（LVLM）之一。作者发现直接从文本推理模型（如DeepSeek R1）经SFT蒸馏到LVLM会因视觉定位不精确导致性能下降，而纯RL方法搜索空间过大，难以在7B级模型中涌现反思行为；
    surprising的是，交替执行SFT与RL数轮迭代后取得显著提升。分析表明SFT有效激发基座模型潜在的推理行为并缩小RL搜索空间，后续RL阶段进一步精炼推理能力，同时产出更高质量的SFT数据用于继续自我改进。OpenVLThinker-7B在六个数学与通用推理基准上稳定提升，其中MathVista提高3.8%、EMMA提高2.4%、HallusionBench提高1.6%。
