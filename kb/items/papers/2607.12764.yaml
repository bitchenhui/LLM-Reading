summaries:
  one_liner_zh: 将知识超图重构为由智能体交互驱动的动态环境，以MDP建模检索实现自进化GraphRAG，提升多模态问答表现。
  abstract_zh: 该文指出GraphRAG将知识图视为离线构建、单次查询的静态结构，存在跨模态割裂、结构冻结、检索刚性三大瓶颈。EvoGraph-R1将知识超图重构为通过智能体交互塑形的动态环境，并把检索形式化为马尔可夫决策过程（MDP）。智能体可执行查询（GraphRetrieve）、扩展（WebSearch）、修正（GraphEdit）、终止（Answer）等动作，重塑超图结构并产生反馈信号驱动后续进化，从而整合新证据、纠正错误并支持多跳推理。在多模态VQA与文本QA基准上，该框架在准确率、覆盖度与可追溯性方面显著超越现有RAG基线。
