claims:
- statement: MemoryGraft通过向智能体长期记忆植入恶意的成功经验模板实现持久攻陷，区别于瞬时的提示注入与针对事实知识的常规RAG投毒，攻击面是智能体推理核心与自身经验之间的信任边界。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 攻击者仅需提供智能体执行期间读取的良性摄入级工件即可诱导构建投毒RAG库；遇到语义相似任务时，词汇与嵌入相似度的联合检索会可靠召回植入记忆，导致跨会话持久行为漂移。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在MetaGPT的DataInterpreter智能体（GPT-4o）上验证：少量投毒记录即可在良性工作负载的检索结果中占据大量份额，把经验式自改进变成隐蔽持久的攻陷向量。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出MemoryGraft：向LLM智能体长期记忆植入恶意成功经验，经RAG联合检索导致跨会话持久行为攻陷。
  abstract_zh: LLM智能体依赖长期记忆与RAG沉淀经验以改进后续表现，这暴露出智能体推理核心与其自身历史经验之间的信任边界这一未充分研究的攻击面。MemoryGraft不同于瞬时提示注入或针对事实知识的常规RAG投毒，而是利用智能体复用检索所得成功任务模式的语义模仿启发式，把少量恶意过程模板持久植入记忆库。攻击者只需在智能体执行时提供其读取的良性摄入级工件，即可诱导其构建含恶意模板的投毒RAG库；后续遇到语义相似任务时，词汇与嵌入相似度的联合检索可靠召回这些记忆，造成跨会话持久行为漂移。在MetaGPT的DataInterpreter智能体（GPT-4o）上验证：少量投毒记录即可在良性工作负载中占据检索经验的大部分，将基于经验的自改进机制转化为隐蔽持久的攻陷载体。
