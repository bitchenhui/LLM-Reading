summaries:
  one_liner_zh: 提出LINVIT/SLINVIT，将LLM策略先验作为正则融入价值型RL，显著提升样本效率并在代理环境取得SOTA成功率。
  abstract_zh: 该论文研究LLM提供的策略先验如何增强强化学习算法的样本效率。提出LINVIT算法，将LLM引导作为正则化因子纳入基于价值的RL，当理想策略与LLM先验策略差距较小时可大幅减少学习所需数据。进一步提出实用算法SLINVIT，简化价值函数构建并用子目标降低搜索复杂度。在ALFWorld、InterCode和BlocksWorld三个交互环境中，该方法取得SOTA成功率，样本效率也超过以往RL与LLM方法。
