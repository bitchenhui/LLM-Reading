summaries:
  one_liner_zh: 提出基于自适应视觉token的渐进式人脸视频压缩框架PFVC，率失真性能优于VVC与现有GFVC算法。
  abstract_zh: 针对生成式人脸视频压缩（GFVC）存在的重建质量不稳定与码率范围受限问题，本文提出渐进式人脸视频压缩框架PFVC，利用自适应视觉token在重建鲁棒性与带宽智能之间实现优异权衡。编码端以渐进方式将高维人脸信号投影为自适应视觉token；解码端以不同粒度对这些token进行重建，用于运动估计与信号合成。实验结果表明，PFVC相比最新VVC编码器和最先进的GFVC算法具有更好的编码灵活性与更优的率失真性能，可支撑超低码率人脸视频通信。
