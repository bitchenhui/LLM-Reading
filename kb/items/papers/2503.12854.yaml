summaries:
  one_liner_zh: 实证表明单轮粗过滤DPO即可显著提升数学推理，迭代框架使生成器与奖励模型共同进化，以更低算力达到RL级性能。
  abstract_zh: 该研究系统考察DPO作为LLM推理自我改进后训练范式的有效性，发现单轮带粗过滤的DPO即可显著提升数学推理性能，对强基座模型尤为明显。作者进一步设计了生成器与奖励模型（RM）共同增强的迭代框架，通过多轮DPO在线交互实现两者相互提升。最终模型DPO-VP仅借助简单可验证奖励即达到RL级性能，且计算开销显著更低。结论指出DPO是RL的可扩展、低成本替代方案，适合资源受限场景。
