summaries:
  one_liner_zh: 将 FunSearch 式 LLM 进化搜索用于删除纠错码设计，单删除情形下证明可构造最优 VT 码。
  abstract_zh: 该工作将 FunSearch（LLM 引导的进化搜索）改造用于发现短码长下删除纠错码的构造函数。针对单删除情形，搜索找到一个函数，作者证明其可构造猜想最优的 Varshamov–Tenengolts（VT）码。在多删除与四进制编辑码情形下，发现的函数优于已有显式构造、搜索式构造与神经构造，但仍属经验启发式，未带来新理论洞见。作者还研究了
    LLM 进化搜索的设计选择：算力用于采样更多函数比拉长单函数推理更划算，代码与自然语言描述共同进化会损害搜索质量，而进化中去除逻辑重复函数对保持搜索多样性至关重要。当前公式化下函数评估代价随码长指数增长，方法目前局限于短码。
