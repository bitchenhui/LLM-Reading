  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出IPFS上的无状态网络感知ABR策略，客户端将适配状态嵌入HTTP头，免除跨提供者状态同步，故障下QoE最高提升约6倍。
  abstract_zh: 论文针对IPFS去中心化环境中性能波动导致传统ABR流媒体QoE下降的问题展开研究，指出现有网络感知ABR依赖消费者与提供者间持续同步的状态，在节点漂移、提供者迁移、网络分区及内容分布变化下易失效。作者提出一种无状态网络感知ABR策略，仅利用客户端在请求时本地可观测的信号为每个视频分段重新计算码率；为保留适配上下文，客户端将自身适配状态嵌入HTTP头部随请求透明携带。该设计消除了跨提供者的状态同步，提升了对故障与网络重配置的鲁棒性并简化大规模部署。早期实验显示，该方案在故障条件下仍保持高QoE，相较现有方案最高提升约6倍。
