summaries:
  one_liner_zh: 提出OmniStyle-INR框架，以INR为统一连续表示，在文本提示与视觉范例引导下对图像、视频、3D及4D模态实现高质量风格迁移。
  abstract_zh: 风格迁移是跨数据模态的基础任务，需同时支持参考图像与文本描述两种条件。作者指出近期基于高斯泼溅的统一表示虽覆盖2D图像、视频、3D场景与4D动态，但对稠密连续域在结构上欠优，所需高斯数量常接近像素总数。相比之下，隐式神经表示（INR）天然具备数据压缩、超分辨能力以及与深度生成模型无缝集成等优势。为此提出OmniStyle-INR，将网络化连续表示作为真正通用的域，在文本与视觉范例双重引导下对全部视觉模态实现高质量风格迁移。
