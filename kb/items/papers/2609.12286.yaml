summaries:
  one_liner_zh: 以热力学自由能最小化统一LLM工件进化的存活选择，在线装箱任务上以更少调用胜过EoH。
  abstract_zh: 该工作受热力学遗传算法（TDGA）启发，提出T-GADE框架：保留种群与遗传算子概念，以LLM生成的结构化工件为个体，交叉与变异由LLM算子实现。框架引入HoxLM在评估后、存活选择前对个体尝试自修复，支持代际与稳态两种更新方式，并以费米型/玻色型占据规则界定解的同一性与重复许可。存活选择统一为最小化自由能F_T=⟨E⟩−TH，温度T显式调节质量与多样性的平衡。在按EoH对齐的在线装箱任务上，带HoxLM的配置以更少LLM总调用取得更低超出量：预注册的400次调用比较中10组种子配对赢9组，中位超出量0.836%对EoH的3.912%。温度在两种更新方式下均控制保留种群散布，小的正温度优于代际玻色型方案中T=0的塌缩点，进化出的启发式呈可读的评分规则。
