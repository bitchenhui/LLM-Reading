summaries:
  one_liner_zh: 提出7K分辨率360°图像VQA基准360Bench与免训练场景图框架Free360，系统揭示并缓解MLLM的360°感知短板。
  abstract_zh: 针对多模态大语言模型（MLLM）在360°图像感知上研究不足的问题，作者构建了360Bench：包含7K分辨率360°图像、七个代表性（子）任务、由人工标注的视觉问答（VQA）基准。基于该基准系统评估了7个MLLM与6种增强方法，揭示了模型在几何畸变与复杂空间关系上的感知缺陷。进而提出免训练框架Free360，将推理分解为模块化步骤，针对每步施加自适应球面图像变换，并将信息整合为统一场景图表示用于答案生成。实验表明Free360能持续提升其基础MLLM的性能，是360°
    VQA的强免训练方案，代码与数据集将在录用后公开。
