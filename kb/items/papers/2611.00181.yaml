summaries:
  one_liner_zh: 率失真优化跳过模式编码框架RDOSkip：时空联合自适应跳过决策，AVS/HEVC上BD-rate节省0.90%/1.29%。
  abstract_zh: 论文系统分析了AVS神经视频压缩中跳过模式编码的率失真分布，发现其随空间位置和时域参考质量变化。据此提出率失真优化的RDOSkip框架，利用超先验预测的统计分布与贝叶斯定理对skip模式的码率和失真进行建模，并发展基于时空联合率失真优化的自适应跳过模式决策方法，突破了现有方法依赖固定跳过阈值的刚性失真分布假设。所提时域跳过模式决策已被进行中的AVS
    NVC标准采纳并集成进参考软件，推理时无需训练且复杂度增加可忽略。实验显示RDOSkip在AVS和HEVC数据集上BD-rate分别节省0.90%和1.29%。
