summaries:
  one_liner_zh: 用他人评分学习高斯先验，对新用户仅需少量评分即可闭式求解个性化回归权重，无需训练网络。
  abstract_zh: 针对图像美学评估中平均分掩盖个体差异的问题，作者提出 Undertone-P：从其他评分者学习一个关于个性化回归权重的高斯先验，权重作用于冻结视觉语言模型（VLM）评判器的两个读出量（概率加权评分与分数
    token 隐状态）。新用户只需一次闭式求解即可完成个性化，无需训练任何网络。在 PARA 基准上，仅用先验即达 Spearman 相关 .640，超过已发表的 10 评分与 100 评分最优结果（.581
    与 .620）；加入 10/100 条个人评分后提升至 .648/.676。无标签时评判器期望分数预测 PARA 的 MOS 达 .835，优于作者复现的已发表最优模型 .694。
