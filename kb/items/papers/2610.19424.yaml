summaries:
  one_liner_zh: 提出证据治理的结构化递归自我改进框架，在冻结VLM上演化视频理解harness，held-out成绩提升6.2%，验证-测试差距缩小37.9%。
  abstract_zh: 该工作研究递归harness演化如何在有限、噪声且被反复复用的反馈下可靠发现可泛化的agent系统，并以agent式视频理解为实验载体。作者先提出VHarness-BRSI，围绕冻结视觉语言模型演化视频harness，分析超过4000个演化候选后识别出三种相互关联的失败模式：验证过拟合、搜索预算稀释与早期经验陷阱，并追溯到共同根源——同一份不完美的验证证据同时驱动harness修订和proposer的搜索策略。据此提出VHarness-SRSI证据治理框架：将proposer限制为只使用无内容反馈，用插桩预热实验指导探索，并在隔离的probe-race分支中开发机制后再进行因子化组合与联合精炼。在四个视频理解基准上，VideoHarness-SRSI的等权平均held-out分数相对VideoHarness-BRSI提升6.2%，验证-测试差距平均缩小37.9%，表明可靠的harness演化取决于搜索的组织与信息供给方式，而非仅优化验证性能。
