summaries:
  one_liner_zh: 提出受预测编码层级启发的无参考立体全景图像质量评估指标PCH，性能持续优于现有SOTA。
  abstract_zh: 针对虚拟现实环境中的立体全景图像（SOI），基于人类视觉系统特性提出受预测编码层级（PCH）启发的盲/无参考质量评估指标。方法模拟SOI观看流程：先提取多个视口并进行双眼融合（cyclopean转换）与显著性检测以聚合局部感知信息；随后基于双眼机制融合左右视图进行预测编码层级建模以推断全局场景；最后由视觉质量回归器结合局部与全局感知线索输出质量分数。大量实验表明，PCH相较最先进的质量评估方法取得有竞争力且持续提升的性能。
