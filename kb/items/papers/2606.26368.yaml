summaries:
  one_liner_zh: 在Mininet仿真中评估MoQ的SWITCH式ABR，验证标准ABR算法可直接用于时移播放并获得更高吞吐。
  abstract_zh: Media over QUIC（MoQ）基于QUIC实现超低延迟视频流，但其默认码率切换语义在网络拥塞时可能引入播放间隙，进行中的SWITCH规范旨在简化MoQ传输的速率自适应。作者在Mininet模拟拓扑上刻画了SWITCH式ABR对直播与时移两类客户端的性能。结果表明标准ABR算法无需修改即可直接应用于时移播放，并获得显著更高的吞吐量。研究还发现订阅端在经历rebuffering后整体吞吐量可能提升，并指出了MoQ
    ABR切换的进一步优化方向。
