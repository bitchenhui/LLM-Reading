summaries:
  one_liner_zh: 提出RAHT末层残差自适应跳过编码与自适应拉格朗日RDO，G-PCC动态点云属性BD-rate平均改善3.5%~5.6%。
  abstract_zh: 针对MPEG G-PCC中RAHT变换最后几层残差零值比例高、造成不必要码率消耗的问题，提出一种自适应跳过编码方法，逐层自适应决定是否编码末尾若干层的RAHT残差。同时设计了配套的率失真代价计算方法，引入自适应拉格朗日乘子以平衡失真与码率。在MPEG通用测试条件（CTC）下，与最先进的G-PCC参考软件相比，该方法在动态点云上使Luma、Cb、Cr分量的平均Bjøntegaard
    rate分别改善3.50%、5.56%和4.18%。
