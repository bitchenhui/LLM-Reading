summaries:
  one_liner_zh: 系统比较SSL与神经音频编解码器表征用于语音MOS预测，发现语义与细粒度声学结合方能达到更优上限。
  abstract_zh: 论文指出当前自动MOS预测器多依赖偏向高层语义的自监督学习（SSL）模型，可能损失对关键声学细节的捕捉能力。作者系统比较了三类表征范式：SSL模型、仅声学的神经音频编解码器（NAC）以及在重建架构中融合语义的统一NAC。在标准BVCC数据集及多个域外（OOD）数据集上的广泛基准测试表明，语义理解与细粒度声学建模协同的表征在语音质量评估上具有更高的性能上限。结论是仅有语义并不足够，稳健的MOS预测需同时关注语义内容与声学保真度。
