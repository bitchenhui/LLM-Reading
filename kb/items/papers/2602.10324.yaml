summaries:
  one_liner_zh: 用AlphaEvolve从对局数据中发现人类与LLM行为的可解释模型，揭示前沿LLM可展现比人类更深的策略行为。
  abstract_zh: 随着LLM被部署到社交与策略场景，理解其行为与人类分歧的根源变得关键，但现有行为博弈论模型难以完整刻画人类或LLM等黑盒智能体的特异行为。作者采用程序发现工具AlphaEvolve，直接从行为数据中发现人类与LLM行为的可解释模型，实现结构性驱动因素的开放式挖掘。在迭代石头剪刀布上的分析表明，前沿LLM可具备比人类更深层的策略行为。该工作为理解策略交互中人类与LLM行为差异的结构性成因提供了基础。
