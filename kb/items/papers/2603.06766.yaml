summaries:
  one_liner_zh: 提出分层字典熵建模HiDE，以全局-局部双字典级联检索利用外部先验，较VTM-12.1最多节省24%BD-rate。
  abstract_zh: 该论文针对学习式图像压缩（LIC）中的熵建模问题，指出现有字典式熵模型将异构外部先验压入单层字典，导致先验利用不均衡、表示能力受限。HiDE框架将外部先验分解为全局结构字典与局部细节字典，并通过级联检索实现外部信息的结构化高效利用。同时设计具有并行多感受野的上下文感知参数估计网络，自适应融合异构上下文以精确估计条件概率。实验显示HiDE在Kodak、CLIC、Tecnick上分别相对VTM-12.1取得18.5%、21.99%、24.01%的BD-rate节省。
  deep_dive: docs/auto/2603.06766.md
