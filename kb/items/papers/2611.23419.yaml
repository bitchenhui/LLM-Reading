summaries:
  one_liner_zh: 审计36个仓库353条RD曲线与28193条编码记录，揭示VTM版本漂移、测量惯例不一与统计显著性问题如何扭曲LIC的BD-rate结论
  abstract_zh: 学习图像压缩（LIC）论文常以不断更换版本的 VTM 参考软件为锚点报告百分之几的 BD-rate 改进，被审计论文共提及 7 个 VTM 版本。作者分析了 36 个仓库的
    353 条率失真曲线，并对 8 个公开编解码器发布做了 28,193 条编解码记录的受控重评估。结果发现三类问题：不同 VTM 参考运行使 BD-rate 波动高达 3.56 个百分点，CLIC
    Pro 上 55 个方法对中 10 个的排序与统一计算不一致；各发布在比特计数、PSNR 计算和图像填充上采用大量未记录的不同惯例，统一测量后 GLIC 在 Tecnick 上对 HPCM 的 1.00%
    领先变为 1.43% 落后，仅改变填充即反转 HPCM 与 CMIC 的比较，而以 MS-SSIM 取代 PSNR 时多数差距收窄；平均曲线掩盖逐图差异，显著性高度依赖方差假设——乐观假设使 Kodak
    规模测试集上 12.0% 的同等性能编解码器比较被判为显著（本应约 5%），谨慎假设则让 45 个近期编解码器差异中 18 个悬而未决、而逐图结果显示其中 12 个实为显著。项目提供版本化评测协议、公开排行榜与打分工具、源链接基准数据、逐图测量及报告指南，以使未来
    LIC 论文的进展声明可比较、可验证。
  deep_dive: docs/auto/2611.23419.md
