summaries:
  one_liner_zh: 两阶段 ITU-R BS.1116-3 双盲听测+LMM/TOST 统计分析，确定 Opus 音乐压缩感知透明阈值为 160 kbps。
  abstract_zh: 该研究针对开源音频编解码器 Opus 在高码率音乐压缩下感知透明阈值缺乏充分评估的问题，设计了两阶段 ITU-R BS.1116-3 双盲听测，用线性混合效应模型（LMM）分析差异评分，并用双重单侧检验（TOST）判定统计等效性。第一阶段（21
    名合格听音员、23 段音乐片段）中 128 kbps 与未压缩参考统计上不可区分（p=0.456），但以微弱差距未通过严格等效性检验（p=0.064）。第二阶段用最佳线性无偏预测（BLUP）筛选出
    10 名最关键听音员和 8 个最具挑战性样本做压力测试：128 kbps 被明确检出退化（p=0.030），160 kbps 则达到感知透明（p=0.747）并通过严格统计等效（p=0.024）。研究结论为
    160 kbps 在苛刻听音环境下对未压缩 CD 音质达到感知透明，并公开两阶段结果、匿名听音员背景与样本特征以保证可复现性。
