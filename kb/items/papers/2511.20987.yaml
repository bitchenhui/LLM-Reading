summaries:
  one_liner_zh: 将AlphaEvolve类进化式程序合成系统OpenEvolve用于组合双射构造，发现前沿AI仍难以独立产出研究级新双射
  abstract_zh: 论文考察以AlphaEvolve、OpenEvolve、ShinkaEvolve为代表的进化式程序合成系统：由多个LLM生成人类可读代码形式的候选解，再经进化迭代改进，以超越LLM单次生成的水平。以往数学应用多集中于界值估计类问题（如球堆积），而该方法适用于任何解为显式构造的问题。作者将OpenEvolve应用于三个基于Dyck路径的双射构造问题，其中两个已知解、一个为开放问题。结果表明此类系统对组合数学家有成为有价值工具的潜力，但发现新颖的研究级双射对当前前沿系统仍是难题，人类数学家仍需在环；文中还给出供同行参考的经验教训。
