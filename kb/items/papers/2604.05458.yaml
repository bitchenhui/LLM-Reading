summaries:
  one_liner_zh: 用LLM双智能体+自建经验库的RAG推理实现可解释的物联网入侵检测，Macro F1达89.75%/85.22%。
  abstract_zh: 针对签名式方法难以检测零日攻击、机器学习方法可解释性差、IoT环境资源受限等问题，提出MA-IDS多智能体入侵检测框架，结合LLM与检索增强生成（RAG）进行推理式检测。框架维护一个持久化、自构建的经验库：流量分类Agent在每次推理前通过FAISS向量库检索历史错误规则，错误分析Agent将误分类转化为人类可读的检测规则存入经验库，在不修改底层语言模型的情况下通过外部知识积累实现持续学习。在NF-BoT-IoT与NF-ToN-IoT基准上分别取得89.75%与85.22%的Macro
    F1，较零样本基线（17%与4.96%）提升超过72和80个百分点，与SVM性能相当，并为每次分类决策提供规则级解释。
