summaries:
  one_liner_zh: 泰国商用5G实测：SA网络下UHD低延迟DASH直播按时送达率超95%，LTE超20%片段超时。
  abstract_zh: 该论文在泰国最大运营商AIS的商用5G网络上，对基于MPEG-DASH的4K/8K超高清低延迟直播进行实测评估，采用最小缓冲策略以追求最低时延。实验对比5G SA、5G NSA与LTE三种移动网络技术，在静止、城区移动、高速移动及最大SINR理想条件下测量丢段数、MAC吞吐量与时延。结果显示5G
    SA在所有场景下均能将超过95%的UHD视频片段在时限窗口内成功送达；5G NSA表现取决于底层LTE网络状况，结果好坏参半；而LTE网络超过20%的片段无法在时限内送达。结论是低延迟UHD直播必须依赖5G
    SA，仅靠沿用旧控制信令的NSA可能不够。
