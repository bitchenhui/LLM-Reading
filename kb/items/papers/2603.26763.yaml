summaries:
  one_liner_zh: 开源838段相机原生FFV1无损谈话头数据集，四编码器评测中H.266较H.264的VMAF BD-rate最高节省71.3%。
  abstract_zh: 作者开源了一个相机原生谈话头视频数据集：838段15秒录像（约210分钟），来自799名参与者、443种相机型号，全部以FFV1无损存储，保留未压缩（24.7%）或MJPEG编码（75.3%）的原始相机信号；每段附MOS及十个感知质量标签，联合解释64.4%的MOS方差。从中构建120段的分层基准子集，涵盖原始、背景虚化、背景替换三种内容条件。在四数据集×四编码器（H.264/H.265/H.266/AV1）效率评测中，H.266相对H.264的VMAF
    BD-rate节省最高达-71.3%，且编码器×数据集（ηp²=.112）与编码器×内容条件（ηp²=.149）交互显著，表明内容类型与背景处理均影响压缩效率。初步超分辨率评测（四个SR模型）显示数据集显著影响绝对性能但保持模型排序，验证其可用于视频压缩、超分辨率与质量评估的基准测试。
