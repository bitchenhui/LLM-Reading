summaries:
  one_liner_zh: 为HEVC视频包按预测结构、帧重要性与负载分配MAC队列，提升VANET低时延传输质量。
  abstract_zh: 针对VANET信道多变、带宽受限条件下的HEVC视频低时延传输难题，论文提出一种低复杂度跨层机制：结合视频编码的时域预测结构、帧重要性及网络流量负载状态，为每个视频包在MAC层选择最合适的接入类别（AC）队列。仿真结果表明，在多种低时延视频通信场景下，相比802.11p标准采用的EDCA，该机制在接收端视频质量与端到端时延上均取得显著改善。作者还通过QoS与QoE双重评估进一步验证了方法的有效性。
