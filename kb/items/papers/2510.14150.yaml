summaries:
  one_liner_zh: 开源LLM+岛屿进化搜索框架CodeEvolve，在AlphaEvolve基准9题中5题持平或超越原版。
  abstract_zh: CodeEvolve是一个开源框架，将大语言模型与基于岛屿的进化搜索耦合以实现端到端算法发现，集成启发式交叉、元提示与深度细化，并建立在CVT-MAP-Elites归档与加权LLM集成之上。在AlphaEvolve基准套件上，它在9个问题中的5个上匹配或超越AlphaEvolve的报告结果；在匹配条件下于9个问题中的6个上优于开源框架OpenEvolve与ShinkaEvolve。采用开源权重Qwen3-Coder-30B骨干时，它在两个CirclePackingSquare实例上超越AlphaEvolve报告分数，成本比闭源前沿LLM集成低约一个数量级，且在启发式设计任务上无需重调参即与EoH保持竞争力。消融实验表明，结果是各组件间交互而非任何单一算子所驱动。框架、实验数据与超参数指南均已开源。
