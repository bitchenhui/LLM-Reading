summaries:
  one_liner_zh: 提出无奖励搜索SelfSearch，智能体借历史自我改进记录改进自身，以更低搜索成本匹配评估引导搜索的任务成功率。
  abstract_zh: 现有自我改进方法通过反复下游评估搜索更优智能体，成本高昂且将搜索绑定到被评估任务。SelfSearch 引入无奖励搜索流程：智能体依据先前自我改进回合的记录（含推理、工具动作与结果）来修改自身指令、工具与执行流程。在全部六个模型-基准设置中，群体平均成功率均优于初始智能体，单个智能体在
    Terminal-Bench 2.1 上最高提升 11.2 个百分点；SWE-bench Multilingual 上提升 5.0 个百分点，且在共同解决的任务上执行成本降低 38.5%。仅 4.03
    美元搜索成本即产出在 Terminal-Bench 2.1 上解决 82.0% 任务的 harness（DeepSeek V4 Flash），在公开九-harness对比中匹配最高分 harness
    Codex，搜索成本低于评估引导基线。
