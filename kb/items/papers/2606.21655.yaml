summaries:
  one_liner_zh: 提出INR图像编解码器PaaF，以改进架构、自适应量化与熵编码缩窄与传统编解码器的差距。
  abstract_zh: 针对INR图像压缩长期存在的编码耗时过长、PSNR等经典指标落后的问题，论文提出纯INR编解码器PaaF（Picture as a Function）。该方法引入改进的网络架构设计、自适应量化机制与高效熵编码方案，在提升率失真性能的同时保留INR解码的简洁性与可并行性。实验表明，PaaF在定量指标与感知质量上均一致优于现有INR压缩方法。该工作凸显了函数式表示压缩的潜力，有助于缩窄其与成熟压缩范式之间的性能差距。
