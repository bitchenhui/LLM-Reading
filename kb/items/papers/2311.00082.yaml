summaries:
  one_liner_zh: 综述无人机360度沉浸视频流媒体全链路，基准评测AVC/HEVC/VVC/VP9/AV1软硬件编码器并发布无人机360视频数据集
  abstract_zh: 该文系统综述了基于无人机的360度全景视频采集、编码、封装与实时流传输研究，梳理了保障沉浸式视频设备与服务互操作性的标准化进展，并评述了面向时变无人机无线信道的流媒体优化方法。作者构建并发布了不同飞行条件下无人机采集的高分辨率360度视频数据集，据此对AVC/H.264、HEVC/H.265、VVC/H.266、VP9与AV1等主流编码标准的软硬件编码器进行复杂度与编码效率基准评测。结果显示HEVC凭借硬件实现在编码效率与复杂度之间取得最佳折中，而AV1通过libsvt-av1软件实现在编码效率上表现最佳。论文还展示了经5G蜂窝网络远程控制无人机的360度视频实时流传输真实测试床，并总结开放研究挑战。
