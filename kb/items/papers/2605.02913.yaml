summaries:
  one_liner_zh: 提出GFCR生命周期分类法，系统综述LLM强化学习后训练中的rollout策略设计与权衡。
  abstract_zh: 该综述以优化器无关的视角形式化推理型LLM强化学习后训练的rollout流水线，提出Generate-Filter-Control-Replay（GFCR）生命周期分类法，将流水线分解为生成候选轨迹与拓扑、经由验证器/评判器/评论家构建中间信号、预算约束下算力分配与分支/停止决策、以及跨rollout重用产物四个模块化阶段。配套的准则分类法从可靠性、覆盖度与成本敏感性刻画rollout权衡。作者综合了可验证奖励RL、过程监督、judge门控、引导式与树/分段rollout、自适应算力分配、提前退出与部分rollout、吞吐量优化及面向自我改进的重放/重组方法，并以数学、代码/SQL、多模态推理、工具使用agent与agentic技能基准进行案例研究。其中Replay阶段涵盖可自主生成新训练任务的自我进化课程，与LLM自我改进密切相关；文末提供将常见rollout病理映射到GFCR模块与缓解手段的诊断索引及开放挑战。
