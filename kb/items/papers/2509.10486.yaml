  - name: 平均排名
    value: 最佳（best average rank）
    scope: ABRBench-3G/ABRBench-4G+，对比Pensieve、Comyco、NetLLM
  evidence: abstract（初筛，未读全文）
- statement: 现有学习型ABR方法因训练轨迹分布有限，在分布外（OOD）网络场景下泛化差。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出BC预训练+RL微调的ABR训练框架与宽分布基准，提升对未见网络条件的泛化稳定性。
  abstract_zh: 针对现有学习型ABR方法依赖有限网络轨迹训练、在分布外（OOD）真实网络下泛化差的问题，提出SABR训练框架，采用行为克隆（BC）预训练结合强化学习（RL）微调。同时构建ABRBench-3G与ABRBench-4G+基准，提供宽覆盖训练轨迹和专用OOD测试集用于评估鲁棒性。实验表明，在所提基准上SABR相对Pensieve、Comyco、NetLLM取得最佳平均排名，说明该框架能在宽分布网络条件下更稳定地学习，并提升对未见网络条件的泛化能力。
