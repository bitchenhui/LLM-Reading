summaries:
  one_liner_zh: 提出 TRUST 框架，用在线多重假设检验为 LLM 智能体递归自改进控制错误进化率并提供统计保证。
  abstract_zh: 递归自改进让智能体通过改造自身 harness 提升性能而无需重训底层 LLM，但仅凭验证分数的贪心门控易把偶然增益误判为真实进步导致性能退化，过于保守的统计门控又会错拒有益更新。论文提出
    TRUST 框架，将在线多重假设检验程序用于控制跨轮次的错误进化率，并由 LLM 分析历史上下文决定接受更新所需证据量。在可解释假设下，作者证明 TRUST 能限制被接受更新中造成不可接受性能损失的比例，并推导出最终性能增益的下界。在
    HotpotQA、DROP、APPS 三个基准上配合 DeepSeek-V4-Flash 与 Qwen-3.8-Flash，TRUST 把贪心门控平均 45.59% 的劣质更新接受率降到 2.78%，且最终分数高于现有
    SOTA 统计门控基线。
