summaries:
  one_liner_zh: 受人类视觉感知启发、以MLLM驱动IQA与粗到细分层策略的一体化图像修复框架，兼顾退化刻画与细节恢复。
  abstract_zh: 针对现有AiOIR方法过度依赖退化特定表示、易产生过平滑与伪影的问题，提出受人类视觉感知（HVP）启发的ClearAIR框架，采用由粗到细的分层修复策略。首先利用早期HVP的全局优先性，采用基于多模态大语言模型（MLLM）的图像质量评估（IQA）模型进行整体评价，借助跨模态理解更准确刻画复杂复合退化。其次引入区域感知与任务识别流水线：语义交叉注意力生成粗粒度语义提示，退化感知模块据此隐式捕捉区域特定退化特征，实现更精确的局部修复。最后提出自监督的内部线索复用机制，挖掘并利用图像自身内在信息以增强细节恢复。实验表明ClearAIR在多种合成与真实世界数据集上取得优于现有方法的性能。
