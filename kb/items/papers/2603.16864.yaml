summaries:
  one_liner_zh: 以稀疏HR关键帧为先验、LR视频运动为锚的可控交互式视频超分框架，基准指标最高提升24.6%。
  abstract_zh: 针对现有视频超分（VSR）模型推理时如黑盒、用户无法修正伪影的问题，提出交互式VSR框架SparkVSR：用户可先用任意现成图像超分模型处理少量关键帧，框架再将关键帧先验传播至整个视频序列，同时以原始低分辨率视频运动为约束。方法引入关键帧条件化的latent-pixel两阶段训练流程，融合LR视频潜变量与稀疏编码的HR关键帧潜变量，学习跨空间传播并精修感知细节。推理时支持灵活的关键帧选择（手动指定、编解码器I帧提取或随机采样）及无参考引导机制，在关键帧缺失或不完美时仍稳健。在多个VSR基准上时间一致性与恢复质量优于基线，CLIP-IQA、DOVER、MUSIQ分别最高提升24.6%、21.8%、5.6%，并可开箱即用扩展至老电影修复与视频风格迁移等未见任务。
