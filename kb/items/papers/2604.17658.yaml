summaries:
  one_liner_zh: ErrorProbe：面向LLM多智能体系统的自改进错误归因框架，经证据验证的记忆定位责任智能体与起源错误步骤。
  abstract_zh: 基于LLM的多智能体系统因交互轨迹长、智能体间依赖与错误延迟显现而调试困难，现有诊断依赖昂贵专家标注或难以在长上下文中定位决定性错误步骤的LLM-as-a-judge范式。论文提出ErrorProbe，一个自改进的语义失败归因框架，可识别责任智能体与起源错误步骤。框架采用三阶段流程：操作化MAS失败分类以检测局部异常、症状驱动的反向追踪剪除无关上下文、由Strategist/Investigator/Arbiter组成的专门多智能体团队通过工具接地执行验证错误假设。其经验证情景记忆仅在错误模式被可执行证据确认时更新，无需标注。在TracerTraj和Who&When基准上显著优于基线，尤其在步级定位上，且已验证记忆支持无需重训的跨域迁移。
