summaries:
  one_liner_zh: 提出HSEvo框架，用LLM结合和声搜索与遗传算法平衡多样性与收敛，自动设计高性能启发式。
  abstract_zh: 针对LLM驱动的进化程序搜索（LLM-EPS）中对启发式搜索空间特性认识不足、探索与开发难以平衡的问题，作者提出两个多样性度量指标，并对FunSearch、EoH、ReEvo等已有方法进行系统分析。在黑盒自动启发式设计（AHD）问题上发现：EoH多样性高于FunSearch与ReEvo，但目标分数不稳定；ReEvo的反思机制虽取得好的目标分数，却未能有效优化多样性。据此提出自适应LLM-EPS框架HSEvo，借助和声搜索算法在多样性与收敛之间维持平衡。实验表明HSEvo同时获得高多样性指数与良好目标分数，并保持较低的计算成本。
