summaries:
  one_liner_zh: 首个面向移动 NPU 优化的文生视频扩散 Transformer，6.7 秒端到端生成 640×1024 高保真视频，VBench 81.61。
  abstract_zh: Neodragon 是首个针对移动硬件优化的文生视频系统，可在 Qualcomm Hexagon NPU 上以 6.7 秒端到端生成 49 帧@24fps、640×1024
    分辨率的 2 秒视频（约 7 FPS）。方法上提出四项关键技术：通过文本编码器蒸馏将 4.762B 的 T5xxl 替换为 0.2B 的 DT5 且质量损失极小；提出非对称解码器蒸馏，用更高效的解码器替换原生
    codec-latent VAE 解码器而不扰动生成潜空间；基于相对重要性剪枝去噪骨干中的 MMDiT 块，并用两阶段蒸馏恢复原有性能；采用适配金字塔 flow-matching 的 DMD 步数蒸馏大幅减少采样评估次数（NFE）。配合优化的
    SSD1B 首帧图像生成器与 QuickSRNet 2 倍超分，端到端系统共 4.945B 参数、峰值内存 3.5GB、延迟 6.7 秒，VBench 总分 81.61，实现低成本、私密、离线的端侧视频创作。
assessment:
  relevance: medium
  decision: summary_only
  reason: 移动端文生视频扩散系统，经 codec-latent 潜空间、NPU 部署与超分组件与视频技术生态相关，但核心是生成而非编码压缩，初筛摘要级收录。
  reviewer: glm-5.3-flash(llm_review)
