summaries:
  one_liner_zh: 首个端到端深度动态点云压缩框架，通过特征空间3D运动估计与补偿，inter模式下较V-PCC v13平均节省76% BD-Rate。
  abstract_zh: 针对三维动态点云非均匀分布导致的帧间压缩难题，提出基于3D稀疏卷积的D-DPCC网络，在特征空间进行3D运动估计与运动补偿以压缩动态点云几何。设计多尺度运动融合（MMF）模块估计相邻帧特征表示间的3D光流，并提出带惩罚系数的3D自适应加权插值（3DAWI）算法自适应降低远邻点影响。采用基于自编码器的有损网络压缩运动嵌入与残差。据作者所知这是首个端到端深度动态点云压缩框架，实验显示inter模式下较V-PCC
    v13平均取得76% BD-Rate增益。
