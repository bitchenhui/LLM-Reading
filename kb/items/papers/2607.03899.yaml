summaries:
  one_liner_zh: 提出免训练推理方法DICT，以数据注入与对比轨迹细化统一提升风格迁移、超分、去模糊等条件生成任务质量。
  abstract_zh: 扩散模型已成为条件图像生成的主流范式，但现有方法或依赖任务特定设计而限制泛化，或将丰富条件压缩为标量损失逐步引导，造成信息瓶颈与采样轨迹上的误差累积。DICT是一种免训练的推理时方法：在早期去噪阶段注入受噪声扰动的条件信号，通过对其进行引导去噪，自适应地筛选并蒸馏任务相关信息，保持空间丰富性并确保条件与生成结果的精确对齐。该方法还引入对比轨迹细化，对相邻去噪状态进行成对比较以逐步改善样本质量。在风格迁移、图像超分辨率与图像去模糊等任务上的大量实验表明，DICT相较于代表性任务特定方法与损失引导基线，在保真度与感知质量上均取得一致提升，同时保持推理简洁并具备跨任务迁移能力。
