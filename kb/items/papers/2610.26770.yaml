summaries:
  one_liner_zh: 无标签的 harness 递归自改进方法，用帕累托优化兼顾任务性能提升与执行成本下降，产出 lite/medium/heavy 三档 harness。
  abstract_zh: 论文提出 HarnessPro，一种无标签的 harness 递归自改进方法：用 LLM 生成的测试评估候选 harness，无需真实答案或官方测试。专门化 agent 诊断执行轨迹、按不同性能-成本优先级规划更新并实现为候选
    harness。不同于返回单一 harness，该方法用归一化加权平方距离选择机制，提供面向成本（lite）、均衡（medium）和面向性能（heavy）三种 harness 以适配不同部署预算，选中的
    harness 进入下一轮迭代。在 Terminal-Bench 2、SWE-Bench Pro 和 ProgramBench 上，用 GPT-5.5+Codex 时，heavy 模式相对 RHO
    平均通过率提升 2.0 个百分点、单任务平均成本降低 26.1%；用 GLM-5.2+Claude Code 也保持该优势。
