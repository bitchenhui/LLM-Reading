summaries:
  one_liner_zh: 提出小波类变换端到端图像编码框架 iWaveV3，入选 IEEE 1857.11 神经图像编码标准候选方案。
  abstract_zh: 面向 IEEE 1857.11 工作组发起的神经网络图像编码标准征集提案（CfP），本文提出基于小波类变换的端到端图像编码框架 iWaveV3。该框架在此前 iWave++
    的基础上引入仿射小波类变换、感知友好质量指标以及更先进的训练与在线优化策略。iWaveV3 同时支持有损与无损压缩，在客观质量上达到当时最先进的压缩效率，感知质量亦具竞争力。该方案最终被采纳为 IEEE
    神经网络图像编码标准制定的候选方案。
