summaries:
  one_liner_zh: 提出无冲突多级4D哈希编码F-Hash，大幅加速时变体数据INR训练收敛并优化渲染采样。
  abstract_zh: 为解决大规模时变体数据隐式神经表示（INR）训练收敛慢的问题，作者提出基于特征的多分辨率Tesseract（4D超立方体）编码架构F-Hash。该方法采用多级无冲突哈希函数映射动态4D多分辨率嵌入网格，避免桶浪费，以紧凑编码参数获得高编码容量。该编码与具体特征检测方法无关，可统一服务于特征跟踪与演化可视化，并同时支撑时空域的压缩、渲染与超分辨率。实验显示F-Hash在多类时变体数据集、多种特征上取得最先进的训练收敛速度；另提出自适应光线步进算法优化样本流式加载，加快神经表示渲染。
