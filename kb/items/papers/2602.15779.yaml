claims:
- statement: 单指标NRM线性化（LNRM）用于RDO时，因NRM梯度局部不稳定且单一优化会利用模型特有偏差，在其他NRM评估下可能收益有限甚至质量退化。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 将LNRM扩展为优化NRM集成并加入基于平滑的梯度稳定化后，在多个NRM评估下取得一致的码率节省，且不增加解码端复杂度。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在过拟合式编码器（Cool-chic）上采用该框架可避免神经NRM的迭代评估与反向传播，相比直接NRM优化显著降低编码运行时间。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 该框架已在AVC与Cool-chic上、以YouTube UGC数据集验证，适配混合编码器场景。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 将无参考指标集成与梯度平滑引入LNRM框架，在AVC和Cool-chic上实现跨指标一致的码率节省并大幅降低编码耗时。
  abstract_zh: 无参考质量指标（NRM）适合评估无参考的用户生成内容，但视频编码的率失真优化（RDO）仍主要依赖平方误差等全参考指标。将单个NRM线性化用于RDO（LNRM）时，由于NRM是局部梯度不稳定的强非线性预测器，优化单一指标可能利用模型特有偏差，在其他指标评估下收益有限甚至退化。作者将LNRM扩展为优化NRM集成，并引入基于平滑的公式在线性化前稳定NRM梯度以增强鲁棒性。该框架适用于混合编码器与过拟合式编码器，可避免神经NRM的迭代评估与反向传播。在AVC与Cool-chic上基于YouTube
    UGC数据集的实验表明：多个NRM下均获得一致的码率节省且无解码端复杂度开销，Cool-chic上相比直接NRM优化编码运行时间大幅下降。
