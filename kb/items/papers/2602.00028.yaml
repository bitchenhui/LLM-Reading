summaries:
  one_liner_zh: 提出边缘侧代理式LLM框架ELLMPEG，用工具感知RAG与自反思自动生成并本地校验FFmpeg与VVenC命令，免除云端API依赖。
  abstract_zh: 针对云端LLM部署的计算能耗高、隐私可靠性风险与API成本问题，本文提出可在边缘端运行的代理式LLM框架ELLMPEG，将工具感知检索增强生成（RAG）与迭代自反思结合，自动生成FFmpeg与VVC编码器VVenC的可执行命令并在本地校验。作者构建了包含480条多样化查询的专用提示数据集，覆盖FFmpeg与VVenC命令的不同类别。研究以命令有效性、每秒生成token数、推理时延和能效为指标评估了四个开源LLM，并实际执行生成命令检验运行期正确性。结果表明，Qwen2.5结合ELLMPEG后平均命令生成准确率达78%，且零API成本，在FFmpeg与VVenC两个数据集上均优于其他开源模型。
