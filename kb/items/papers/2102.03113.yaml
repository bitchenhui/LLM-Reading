summaries:
  one_liner_zh: 提出估计真实模糊核、噪声与JPEG压缩退化的训练对生成框架，用LPIPS损失的GAN超分监控人脸并超越SoTA。
  abstract_zh: 针对现有超分方法基于双三次插值人工退化训练、难以适配真实低清图像的问题，作者提出一个真实LR/HR训练对生成框架：估计真实模糊核、噪声分布及JPEG压缩伪影，使合成LR图像与源域图像特征一致，从而可直接用高质量人脸图作为Ground-Truth训练SR模型。为提升感知质量，采用GAN基超分模型并将常用VGG损失替换为LPIPS损失。在真实与人工退化人脸图像上的实验显示，该方法较现有SoTA重建细节更多、噪声更低；同时发现传统无参考IQA指标无法捕捉这一改进，而较新的NIMA指标经Mean
    Opinion Rank验证与人类感知更一致。
