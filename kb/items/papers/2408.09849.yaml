summaries:
  one_liner_zh: 提出DS weight近似分布偏移程度，与自一致性结合过滤自生成样本，提升LLM自我改进的推理能力。
  abstract_zh: LLM自我改进范式在自生成数据上微调模型，但数据质量不稳定，现有工作主要按答案正确性过滤。本文证明过滤掉'正确但分布偏移程度(DSE)高'的样本同样能改善自我改进效果。由于真实样本分布通常不可得，作者借鉴重要性加权方法提出DS
    weight指标来近似DSE，并与自一致性结合综合过滤自生成样本。实验显示仅需不超过训练集5%规模的小验证集计算DS weight，即可显著提升现有LLM自我改进方法的推理能力，性能与依赖预训练奖励模型外部监督的方法相当。
