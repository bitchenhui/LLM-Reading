summaries:
  one_liner_zh: 提出分布式LLM工人系统Formal Disco，规模化生成形式验证程序合成数据并实现自我改进。
  abstract_zh: 针对形式验证语言人工编写样本稀缺的问题，提出Formal Disco：一个协调LLM工人的分布式系统，可大规模开展开放式合成数据生成。系统将任务分给三类工人：initiators读取开源仓库README与文档片段起草相关验证程序，fixers根据编译器与验证器反馈修复问题，extenders对可运行程序提出扩展补丁。系统记录全部智能体轨迹，既用于从更强模型蒸馏，也用于自我改进；并提出合成程序生成的最大熵原则，通过迭代监督微调使模型随时间生成日益多样的程序。团队发布覆盖Dafny、Verus与Frama-C三种语言的大规模合成验证程序数据集，微调后的开源模型在验证相关任务上常达到甚至超过Claude
    Opus 4.5的表现。
