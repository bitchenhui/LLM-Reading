summaries:
  one_liner_zh: 系统梳理奖励模型的架构、训练与评估，及其在推理优选、数据合成自改进与RL微调训练信号中的应用与开放问题。
  abstract_zh: 该综述系统介绍奖励模型（RM）的基础概念，包括其架构、训练方法与评估技术。进而梳理RM在LLM推理中的三类关键应用：推理时引导生成并从多候选中优选输出、支撑数据合成与LLM迭代自改进、在基于强化学习的微调中提供训练信号。作者结合已有研究与自身实证发现，讨论RM的选择、泛化、评估与增强等开放问题。分析旨在为RM的有效部署与进一步发展提供可操作建议。
