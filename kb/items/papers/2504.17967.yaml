summaries:
  one_liner_zh: 提出PharmaSwarm多LLM智能体框架，协同提出并验证药物靶点与先导化合物假设，借共享记忆与子模型微调实现自改进。
  abstract_zh: 提出PharmaSwarm统一多智能体框架，编排专业化LLM智能体对新型药物靶点与先导化合物进行假设提出、验证与迭代精炼。各智能体配备基因组/表达自动分析、生物医学知识图谱、通路富集与网络仿真、可解释结合亲和力预测等专属工具，中央Evaluator
    LLM按生物学合理性、新颖性、计算疗效与安全性持续排序提案。共享记忆层沉淀已验证洞见并随时间微调底层子模型，构成自改进系统；框架可部署于低代码平台或Kubernetes微服务，支持文献驱动发现、组学靶点识别与市场导向药物重定位。作者另提出四层验证流程（回溯基准、独立计算实验、湿实验测试、专家用户研究）以保障透明性与可复现性；文中未报告定量实验结果，属框架/立场性工作。
