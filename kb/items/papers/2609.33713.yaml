summaries:
  one_liner_zh: 自改进框架BIRD借模型混淆定位决策边界，经功能验证的证据蒸馏为理据以微调MLLM
  abstract_zh: 论文提出BIRD，一个自改进的边界感知理据蒸馏框架，用于将通用多模态大语言模型（MLLM）适配到医疗VQA、图表VQA等专业领域。其核心思路是：利用目标模型自身的表示空间检索最易混淆的候选近邻，从二者视觉差异中生成不泄露答案的候选证据，再通过功能性验证筛选最能强化模型对正确答案偏好且避免不当迁移的证据。验证后的证据被蒸馏为单样本理据，用于标准监督微调。在医疗与图表VQA上，BIRD在两个目标MLLM上均优于现有理据增强方法，并展现出对易混淆答案更清晰的区分能力，模型匹配的监督带来更强增益。
