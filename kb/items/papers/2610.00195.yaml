summaries:
  one_liner_zh: 提出直接在高斯泼溅参数域评估压缩失真的全参考指标GS-PQM，优于25种需渲染视点的现有图像/视频/点云指标且计算更高效。
  abstract_zh: 高斯泼溅（GS）压缩技术已能大幅缩减模型体积，可靠的目标质量评估因此成为比较压缩方法、指导GS编解码器开发的关键。现有GS质量评估多沿用图像/视频质量指标，需渲染预定义视点，评估结果依赖视角选择。本文提出GS-PQM，一种面向训练后GS压缩的全参考质量指标，直接在GS参数域工作，从一组参数域失真误差出发用支持向量回归（SVR）模型估计感知质量。实验表明GS-PQM在压缩GS内容上优于25种现有图像、视频和点云质量指标，是渲染式质量评估的精确且计算高效的替代方案。
