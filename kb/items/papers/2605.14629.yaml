summaries:
  one_liner_zh: 复用AV1编码器自带运动矢量替代穷举特征匹配，生成更稠密SfM点云，加速并提升3DGS重建质量。
  abstract_zh: 该论文提出一种基于AV1的特征检测与匹配管线，直接复用AV1视频编解码器中固有的运动矢量，绕开SfM中计算开销巨大的穷举式匹配，同时保持几何鲁棒性。相比基于COLMAP的标准流程，该管线生成的初始点云密度最高达到传统SfM的8倍，可缓解弱纹理区域的稀疏问题。更稠密的初始化直接改善3DGS重建：渲染质量VMAF提升9分，达到基线质量所需训练时间平均缩短63%。项目页面已公开。
