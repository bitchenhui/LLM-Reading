summaries:
  one_liner_zh: Blackwell GPU上8K 10-bit 4:2:2 HEVC四路分帧编码达122fps，证明商用GPU可实时支撑高保真V-PCC体积视频流。
  abstract_zh: V-PCC通过将3D几何与纹理投影到2D视频帧来压缩体积数据，需10-bit色深与4:2:2色度采样以避免三维重建时的空间失真与颜色渗色，且高密度动态点云要求8K分辨率、最高120fps的苛刻编码参数。此前旧款GPU硬件编码器不支持4:2:2，实时V-PCC只能依赖定制ASIC，而NVIDIA
    Blackwell架构首次在商用GPU上提供10-bit 4:2:2片上硬件编码。论文在配备四个并行硬件编码器的Blackwell GPU上，评估了8K 10-bit 4:2:2 HEVC在不同分帧编码（SFE）配置下的吞吐、率失真性能与功耗。结果显示4路SFE达到122fps编码吞吐，满足实时约束，代价是slice边界无法利用跨块空间冗余，带来最高5%的BD-Rate惩罚。作者据此认为商用现货GPU可作为实时体积视频流的高可行基线平台。
assessment:
