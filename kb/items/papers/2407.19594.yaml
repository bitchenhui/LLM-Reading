  confidence: reported
  metrics:
  - name: Arena-Hard win rate
    value: 20.6%→29.1%
    scope: Llama-3-8B-Instruct，Arena-Hard 基准，自我改进迭代前后对比
  evidence: abstract（初筛，未读全文）
- statement: 仅改进回复生成而忽视评判能力提升的现有 self-rewarding 方法会在迭代训练中快速饱和，Meta-Rewarding 旨在解决该问题。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出Meta-Rewarding：模型对自身评判再作评判，无监督下同时提升评判与指令遵循能力。
  abstract_zh: 现有self-rewarding方法让LLM评判自身回复并以此作为奖励训练，但只关注回复生成能力，导致迭代训练快速饱和。本文在自我改进流程中引入Meta-Rewarding环节，模型对自己生成的评判再进行评判，并利用该反馈改进评判技能。这一无监督方法同时提升了模型的评判能力和指令遵循能力：Llama-3-8B-Instruct在AlpacaEval
    2上的胜率从22.9%提升至39.4%，在Arena-Hard上从20.6%提升至29.1%。结果强烈表明无需人工监督的自我改进具有可行性。
