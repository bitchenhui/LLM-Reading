summaries:
  one_liner_zh: 提出端到端神经语音编解码器CBRC，用Intra-BRNN与GB-RVQ提升低码率质量，3kbps优于12kbps的Opus。
  abstract_zh: 神经网络虽已被证明能在低比特率下有效完成语音编码，但帧内相关性利用不足与量化器误差会明显降低重建音频质量。为此，作者提出端到端神经语音编解码器CBRC，采用1D-CNN与Intra-BRNN交错结构以更高效地挖掘帧内相关性，并引入分组束搜索残差矢量量化器GB-RVQ来降低量化噪声。CBRC每20ms编码一次音频且不引入额外时延，适用于实时通信场景。实验结果显示，CBRC在3kbps码率下的表现优于12kbps的Opus。
