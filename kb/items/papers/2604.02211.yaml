summaries:
  one_liner_zh: 综述LLM驱动的多智能体视频推荐系统（MAVRS）演进、协作模式分类与自改进推荐等开放方向。
  abstract_zh: 本综述系统梳理了多智能体视频推荐系统（MAVRS）的演进：从早期多智能体强化学习系统（如MMRF）到近期LLM驱动的架构（如MACRec、Agent4Rec）。作者融合多智能体推荐、基础模型与对话式AI思想，提出协作模式分类法，并分析视频理解、推理、记忆与反馈等专用智能体在从短视频到教育平台等多类视频场景中的协调机制。综述指出可扩展性、多模态理解与激励对齐是主要开放挑战，并提出混合强化学习-LLM系统、终身个性化与自我改进推荐系统等未来研究方向。
