summaries:
  one_liner_zh: 提出d1框架，用掩码SFT与无critic的策略梯度算法diffu-GRPO将预训练掩码扩散大语言模型转变为推理模型。
  abstract_zh: 论文提出d1框架，将预训练掩码扩散大语言模型（dLLM）通过监督微调与在线强化学习相结合改造为推理模型。方法上：(a) 采用掩码SFT从既有数据集蒸馏知识并注入自我改进行为；(b)
    提出无critic、基于策略梯度的强化学习算法diffu-GRPO，这是策略梯度方法首次与掩码dLLM结合。研究在多个数学与规划基准上比较了不同后训练配方，发现d1取得最优性能，并显著提升了一个最先进dLLM的表现。代码已开源。
