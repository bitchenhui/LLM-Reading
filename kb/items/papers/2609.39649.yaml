summaries:
  one_liner_zh: 提出以检测框内人脸/车牌识别得分评估视频超分辨率的基准 FANVIDv2，替代传统 PSNR/SSIM 评价。
  abstract_zh: 该基准提供 320×180 低分辨率视频及对应高分辨率参考，覆盖 48 位公众人物（各一张 HR 画廊图）与 375 段车牌片段（360 个不同车牌号），低分辨率视频由随机化复合退化（模糊、缩放抖动、传感器噪声、JPEG
    压缩、最终下采样）生成而非仅双三次下采样。提出两个识别型指标：FaceRecBox 仅当人脸被定位且正确识别时计分，TextRecBox 按定位质量加权的归一化编辑距离评车牌转写。以 2.3M 参数的
    RCDM 超分基线验证，FaceRecBox 从 0.6864 升至 0.7222，匹配人脸身份准确率从 84.35% 升至 86.93%，TextRecBox 从 0.3088 升至 0.3667；残差图门控变体
    RCDM-RMGF 在车牌上达 0.3801。作者发布标注、元数据、退化脚本与评估代码。
