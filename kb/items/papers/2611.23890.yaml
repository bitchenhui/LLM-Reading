summaries:
  one_liner_zh: 提出多智能体RSI框架EVA-RSI，用代理考试与纳什议价规则递归改进视频评估器的运动/时序质量判断。
  abstract_zh: 该文提出EVA-RSI，一个在'无验证器'且需同时评判物理、平滑度、运动等多维目标的约束下探索递归自我改进的多智能体框架。通过对视频施加时间倒放、丢帧等可控编辑构造固定代理考试，无需人工标注即可提供监督，并用少量人工标注的真实视频将考试锚定到人类判断；每个质量维度由一个LLM智能体提出改进，leader智能体协调，纳什议价规则选出跨维度平衡的更新，人类负责设计考试、审核候选改动并在阶段间修订课程。从Qwen3-VL-8B出发，EVA-RSI提升运动评估能力且平滑度维度增益最大，增益可迁移到运行中未见过的缺陷类型。在公开基准dynamics子集上，该评估器在21个受测模型中取得最高观测分数；作为RL奖励可增加生成运动的幅度并赢得人类偏好，纳入数据选择管线同样能增加生成运动。
  deep_dive: docs/auto/2611.23890.md
