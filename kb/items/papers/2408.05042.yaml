claims:
- statement: 在低时延配置下，JVET ECM 在全部被测编码器（VTM、ECM、libaom、AVM、DCVC-DC、DCVC-FM）中综合编码性能最佳。
  confidence: reported
  metrics:
  - name: BD-rate 节省
    value: 16.1%
    scope: PSNR 口径，ECM 相对 AOM AVM，低时延配置，AOM/MPEG CTC 测试序列，YCbCr 4:2:0
  - name: BD-rate 节省
    value: 11.0%
    scope: PSNR 口径，ECM 相对神经编码器 DCVC-FM，低时延配置
  evidence: abstract（初筛，未读全文）
- statement: 神经视频编码器 DCVC-DC 与 DCVC-FM 在大背景运动测试内容上表现出不一致的编码性能，稳定性劣于传统标准编码器。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 评测采用 MPEG 与 AOM 通用测试条件下的测试序列并在 YCbCr 4:2:0 空间进行，以保证跨阵营对比的公平性；既往多数工作基于随机访问模式，低时延场景下的系统对比此前缺失。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 低时延配置下公平对比 VTM/ECM、AV1/AVM 与 DCVC 神经编码器，ECM 综合编码性能最优。
  abstract_zh: 该论文针对直播等不允许随机访问式大延时的应用场景，在低时延配置下对最先进的传统与神经视频编码器进行系统对比，涵盖 MPEG 的 VVC VTM 与 JVET ECM、AOM
    的 libaom(AV1) 与 AVM，以及神经编码器 DCVC-DC 与 DCVC-FM。评测基于 AOM 与 MPEG 通用测试条件（CTC）定义的测试序列，统一在 YCbCr 4:2:0 色彩空间下进行以保证公平。结果显示
    JVET ECM 在所有被测编码器中综合表现最佳：按 PSNR 计算，BD-rate 相对 AOM AVM 平均节省 16.1%，相对 DCVC-FM 节省 11.0%。研究还观察到 DCVC-DC
    与 DCVC-FM 在具有大背景运动的测试内容上表现不一致，暴露出学习型编码器对内容特性的敏感性问题。
