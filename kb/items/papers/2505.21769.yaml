summaries:
  one_liner_zh: 系统评测多种QUIC实现的拥塞控制性能及其对VoD与低延迟直播ABR和QoE的影响。
  abstract_zh: 本文对多种QUIC实现进行综合分析，聚焦其传输层拥塞控制（CC）在单服务器多客户端环境下的性能及其对HTTP自适应流（HAS）的影响。通过大规模轨迹驱动实验，研究覆盖视频点播（VoD）与低延迟直播（LLL）两种场景，考察不同QUIC拥塞控制对ABR算法的作用，并分析排队策略与QUIC流间协作/竞争动态对QoE的影响。结果表明：不同QUIC实现即使采用相同CC算法也会产生显著性能差异，直接影响流媒体会话的QoE。作者据此呼吁对QUIC拥塞控制与ABR方案进行智能跨层协同设计，以提升整体流媒体性能。
