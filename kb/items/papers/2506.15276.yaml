claims:
- statement: MSNeRV 在 INR 类神经视频表示方法中具有更优的视频表示能力（在 HEVC ClassB 与 UVG 上验证）。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在动态（快速变化）场景下，MSNeRV 的压缩效率超越 VTM-23.7（Random Access 配置）。
  confidence: reported
  metrics:
  - name: 对比锚点
    value: VTM-23.7 (Random Access)
    scope: 动态场景压缩效率对比
  evidence: abstract（初筛，未读全文）
- statement: INR 类方法已可达到与 H.266/VVC 相当的压缩性能，但细节密集与快变内容仍是短板，MSNeRV 通过 GoP 划分、GoP 级背景网格与多尺度特征块缓解该问题。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出多尺度特征融合的 INR 神经视频表示 MSNeRV，在动态场景下压缩效率超越 VTM-23.7 随机接入。
  abstract_zh: 针对现有 INR 视频压缩方法难以表达细节密集与快速变化内容的问题，提出多尺度特征融合框架 MSNeRV。编码阶段利用时间窗增强时序一致性，将视频划分为多个 GoP 并以 GoP
    级网格进行背景表示；设计带尺度自适应损失的多尺度空间解码器以融合多分辨率、多频率信息，并引入多尺度特征块充分利用网络隐藏特征。在 HEVC ClassB 和 UVG 数据集上的实验表明，其表示能力在
    INR 类方法中最优，且在动态场景下的压缩效率超越 VTM-23.7（Random Access）。
