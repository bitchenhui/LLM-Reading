summaries:
  one_liner_zh: 综述LLM及其智能体在软件工程六大主题中的应用、基准与评估，辨析二者差异并指出自我改进等能力增益。
  abstract_zh: 该综述系统调查了大语言模型（LLM）与基于 LLM 的智能体在软件工程中的现有实践与解决方案。作者归纳出六个关键主题：需求工程、代码生成、自主决策、软件设计、测试生成与软件维护，并区分两者在各任务、基准与评估指标上的异同。综述指出，目前尚缺乏界定
    LLM 方案是否构成智能体的统一标准与基准，该领域仍处早期阶段。文章认为，以 LLM 为决策与行动核心的智能体可缓解 LLM 缺乏自主性与自我改进等内在局限，为通向 AGI 的研究指明方向。
