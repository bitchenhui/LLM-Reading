summaries:
  one_liner_zh: 深度编码器耦合无参数SMoE解码器，超快速估计SMoE参数，实现实时图像建模、去噪并支撑压缩与超分。
  abstract_zh: 导向混合专家（SMoE）此前被用于构建稀疏、边缘感知的像素数据模型，可服务于压缩与去噪并能与最先进压缩方法竞争，但其迭代优化式参数估计计算开销大。本文提出将深度编码器网络与浅层、无参数SMoE解码器耦合的自编码器设计，大幅缩短运行时间并提升块级SMoE方法的重建质量。相较其初期自编码器方案，新设计扩展到更高复杂度模型与不同块尺寸，并增强了去噪应用的噪声鲁棒性。结果显示，新自编码器可在无噪声与严重噪声输入下对复杂SMoE模型实现超快速参数估计并获得优异重建质量，从而支撑压缩、降噪与超分辨率等广泛的图像处理应用。
