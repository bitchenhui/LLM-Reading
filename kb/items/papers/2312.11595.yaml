summaries:
  one_liner_zh: 提出SPIRE框架，以自然语言提示控制扩散图像复原，支持语义对齐与定量复原强度调节，性能超越现有SOTA
  abstract_zh: SPIRE将自然语言作为用户友好接口来控制图像复原过程，从两个维度利用提示信息：内容相关提示增强语义对齐，缓解复原结果中的身份歧义。该框架首次支持通过语言定量指定复原强度的细粒度指令，无需任务特定设计。方法引入新的融合机制，在现有ControlNet架构上学习重新缩放生成先验，从而提升复原保真度。在去噪、超分辨率、去模糊和压缩伪影去除等任务上的大量实验表明，SPIRE的复原性能优于现有SOTA，同时提供基于文本的复原效果控制灵活性。
