summaries:
  one_liner_zh: 首次量化 rubric 式 LLM 评审的自偏好偏差：即使准则客观可验证，judge 仍显著偏袒自身输出。
  abstract_zh: 本文首次研究 rubric 式评估范式（judge 对单条评估准则给出二值判定）中的自偏好偏差（SPB）。基于 IFEval 与 LiveCodeBench 等可程序化验证的基准，作者发现即使评估准则完全客观，SPB
    依然存在：在生成器未通过的 rubric 上，judge 评审自己的输出时错判为达标的概率可高出 50% 以上。与其它评估范式类似，多 judge 集成可缓解但不能完全消除 SPB。在含主观 rubric
    的医疗对话基准 HealthBench 上，SPB 可使模型分数偏移最高 10 分，足以改变前沿模型排名；负向 rubric 与沟通、紧急转诊等主观话题尤其易受影响。
