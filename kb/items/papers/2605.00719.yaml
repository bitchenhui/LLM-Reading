summaries:
  one_liner_zh: 提出RGSUD框架，以IQA动态奖励回收与自强化损失实现无配对监督图像去雨，多数据集达SOTA
  abstract_zh: 论文提出无监督图像去雨方法RGSUD，包含奖励回收与自强化（SR）训练两个阶段。奖励回收阶段采用基于IQA的动态奖励回收机制，在训练过程中筛选并持续收集高质量去雨图像。自强化阶段将这些奖励样本并入模型优化过程，通过IQA自强化损失与动态更新的奖励提升合成伪配对数据质量并稳定优化。实验表明该方法在配对合成、配对真实与非配对真实图像多个数据集上均取得SOTA，主客观IQA指标优于现有无监督去雨方法，且自强化策略可迁移至其他无监督去雨方法、框架可泛化到现有有监督去雨网络。
