summaries:
  one_liner_zh: 综述LLM参数化记忆增强方法：按记忆参数的放置位置与获取时机两个正交轴组织方法版图。
  abstract_zh: 该综述关注LLM及基于LLM的智能体如何吸收预训练后获得的知识（领域事实、用户偏好、文档与交互经验）。与消耗上下文容量且编码成本随上下文长度增长的ICL不同，参数内记忆将可复用的记忆信息表示在模型参数、适配器等参数化对象中，并在推理时组合进前向传播。作者以两个正交轴组织该领域：参数放置位置（Embedding、Attention、FFN层或混合）与参数获取时机（部署期在线获取与部署前离线获取）。综述厘清了方法边界并进行了比较，还讨论了干扰、安全、与ICL协同设计以及递归自我改进等开放方向。
