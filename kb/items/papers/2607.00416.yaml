summaries:
  one_liner_zh: 融合SigLIP2与LoRA微调的Qwen3.5-9B多模态大模型，多任务预测无人机图像全局/目标/背景质量，获ICME 2026挑战赛第二名。
  abstract_zh: 本文提出DroneIQA-VLE，是ICME 2026低空无人机图像目标感知质量评估挑战赛的参赛方案，联合预测全局、目标与背景三类质量分数。框架集成两条互补流水线：一条为带多任务回归头的SigLIP2视觉编码器，另一条为经LoRA适配的Qwen3.5-9B多模态大语言模型用于质量分数回归。最终全局质量分数取两条流水线输出的算术平均。该方法在挑战赛中取得第二名，验证了有效性，代码已开源。
