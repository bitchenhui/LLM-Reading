summaries:
  one_liner_zh: 用深度强化学习与INT带内遥测在P4交换机动态调整AQM目标时延，DASH测试中卡顿降90倍、高清播放质量升42倍
  abstract_zh: 传统主动队列管理（AQM）依赖固定阈值（目标时延或队列占用率）计算随机丢包概率，难以适应动态流量，阈值过小会增加丢包并降低链路利用率，过大则增加排队时延。作者提出DESiRED，一种基于P4可编程数据平面的AQM，利用带内网络遥测（INT）获取精确网络反馈，驱动深度强化学习模型以最大化应用QoS为奖励动态调整目标时延。系统在运行MPEG-DASH服务的真实P4测试环境中评估。结果显示，相比固定阈值方案，视频卡顿最多减少90倍，高分辨率视频播放质量最高提升42倍。
