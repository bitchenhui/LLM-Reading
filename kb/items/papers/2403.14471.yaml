claims:
- statement: 提出的ACGC熵模型将隐表示划分为切片并在并行棋盘上下文中运行，实现切片间与切片内双重特征聚合，兼顾更快解码速度与更优率失真性能。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: ACGC中的自适应全局间注意力采用可变形注意力，依据真实空间关系与上下文动态细化注意力权重，以捕捉跨切片冗余全局特征。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: S2LIC主变换采用残差SwinV2 Transformer捕捉全局特征，并以密集块网络作特征增强模块提升非线性表征能力。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在PSNR与MS-SSIM指标上，S2LIC均优于VTM-17.1及若干近期学习式图像压缩方法，同时具备更快的编码与解码速度。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出ACGC切片式棋盘并行熵模型与残差SwinV2变换的S2LIC，性能超VTM-17.1且编解码更快。
  abstract_zh: 论文针对现有熵模型仅侧重通道与空间一维关联的问题，提出自适应通道内与全局间注意力上下文（ACGC）熵模型：将隐表示划分为多个切片，在并行棋盘上下文中执行，实现切片间与切片内双重特征聚合并加快解码速度；同时用可变形注意力基于真实空间关系动态细化跨切片全局特征的注意力权重。主变换结构中引入残差SwinV2
    Transformer捕捉全局特征，并以密集块网络作为特征增强模块提升非线性表达能力。实验表明该方法在PSNR和MS-SSIM两指标上均优于VTM-17.1及近期学习式图像压缩方法，且编码解码速度更快。
