summaries:
  one_liner_zh: 提出RefGRPO，以免费的反思-结果校准奖励增强标准RL，同时提升LLM智能体的反思校准与任务准确率。
  abstract_zh: LLM智能体在获得环境反馈（执行结果、错误信息、工具输出）后仍会误判自身输出，即使对已答对的问题也是如此，形成持续的'反思差距'，而标准RL因信用分配错位难以修复。作者提出RefGRPO，通过对比智能体自身反思与实际结果计算一个无需奖励模型、LLM判官或外部标注的'免费'校准奖励，并对其系数施加动态调度。在五个text-to-SQL基准上，相比标准RL基线，该方法将欠自信率从44.4%降至7.7%，任务准确率从75.1%提升至76.5%。校准后的反思使智能体成为基于环境反馈的自我验证器，进而支持以反思为伪奖励的无结果监督自改进，以及仅在被标记为正确的rollout上提交的测试时选择性预测。
  deep_dive: docs/auto/2606.14211.md
