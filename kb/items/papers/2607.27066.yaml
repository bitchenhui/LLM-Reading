  evidence: abstract（初筛，未读全文）
- statement: 消融实验表明稿件证据输入、引用上下文去噪和论文内排序监督均对性能至关重要，说明科研图表评估需要学习式视觉-稿件对齐而非纯提示词驱动。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 微调CLIP+SciBERT多模态评分器，以稿件证据为锚评估科研图表，显著优于LLM判分基线。
  abstract_zh: 论文指出科研图表评估不同于一般图像质量评价：图表需清晰可读、忠实支撑论文论点并具备清晰的视觉层级，经典IQA模型、CLIP图文匹配与零样本LLM/VLM判分均各有局限。作者构建了包含3857张同行评审会议论文图表的数据集，按清晰度、相关性、信息量、结构四个维度评分。提出的SciFigAlign端到端微调CLIP与SciBERT，采用逐模态交叉注意力与CubeMLP融合，联合优化SmoothL1回归和论文内排序hinge损失。在论文级划分测试集上取得macro
    MAE 0.3524、论文内成对准确率81.64%（n=396），较最佳LLM-as-judge基线（MAE 0.864）相对误差降低59%，消融证明稿件证据输入、引用上下文去噪与排序监督均不可或缺。
assessment:
  relevance: low
