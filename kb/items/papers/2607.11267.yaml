summaries:
  one_liner_zh: 提出辅助反馈RAG系统，系统化整合人类反馈以迭代提升主RAG系统的回答准确性与相关性。
  abstract_zh: 该研究提出一种通过策略性引入辅助反馈RAG系统来改进主RAG系统性能的方法论。其核心是在线人在回路实现：用户反馈被持续收集、分类并整合进推理工作流，使系统能够迭代学习与演进。为验证有效性，研究在三个覆盖通用领域与自定义领域知识的基准数据集上，采用LLM-as-a-Judge评估策略进行严格测试。该框架展示了反馈驱动的自适应信息检索增强潜力，是向自主优化迈进的一步。
