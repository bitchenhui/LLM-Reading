summaries:
  one_liner_zh: 提出CogCanvas基准，联合评测多身份保持、人物-物品绑定、背景与空间合理性，并给出BG-Sim与Attr-VQA两个新指标
  abstract_zh: 该工作针对多主体参考图图像生成中身份保持、人物-物品绑定、背景接地与空间合理性难以同时评测的问题，构建了CogCanvas基准：1,952张精选参考图覆盖100位名人身份、115种物品/服饰与29个真实背景场景，并组合出1,361条覆盖2-5人规模的提示。数据构建管线结合DINOv2去重、两阶段美学过滤以及自动生成的结构化交互与位置图作为真值监督。基准支持参考图多人生成、文生图组合生成与参考检索三类任务，并提出BG-Sim（SAM
    3掩码区域上DINOv3特征相似度评分背景保真度）与Attr-VQA（用多模态LLM对照结构图校验逐主体属性绑定与人际交互）两个新指标。对五个SOTA方法的评测显示：随群体规模从2人增至5人，所有模型性能显著退化，超过3个主体时物品/服饰绑定接近完全失败。
