- statement: 两阶段训练（形式化 CoT 监督微调激活推理能力 + 自反思后训练以自身输出迭代作为 CoT 标签）可在 R2R、REVERIE、CVDN、SOON 基准上一致优于先前 LLM-based
    VLN 方法
