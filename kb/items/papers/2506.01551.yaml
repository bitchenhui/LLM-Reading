summaries:
  one_liner_zh: 提出形式化CoT微调+自反思后训练的两阶段自改进范式，提升LLM视觉语言导航的精度与可解释性
  abstract_zh: 针对现有 LLM 视觉语言导航（VLN）方法采用直接输入-输出映射导致决策难以学习且不可解释的问题，提出 EvolveNav 自改进具身推理范式。第一阶段以整理的形式化 Chain-of-Thought
    标签做监督微调，激活模型导航推理能力并提升推理速度。第二阶段自反思后训练，将模型自身推理输出迭代用作自富集 CoT 标签以增强监督多样性，并设计自反思辅助任务，通过与错误推理对比学习正确推理模式。在任务特定与跨任务两种训练范式下，EvolveNav
    在 R2R、REVERIE、CVDN、SOON 等基准上均一致优于已有 LLM-based VLN 方法。
