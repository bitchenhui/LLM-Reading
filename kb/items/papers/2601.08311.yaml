summaries:
  one_liner_zh: IQARAG：免训练RAG框架，检索带MOS的相似参考图为LMM提供质量锚点，提升零样本IQA性能。
  abstract_zh: 论文提出IQARAG，一个免训练框架，利用检索增强生成（RAG）提升大型多模态模型（LMM）的图像质量评估（IQA）能力。该方法为输入图像检索若干语义相似但质量各异的参考图像及其平均意见分数（MOS），并将这些图像与输入图像整合进特定提示中，为LMM的IQA任务提供视觉感知锚点。框架包含检索特征提取、图像检索、整合与质量分数生成三个关键阶段。在KADID、KonIQ、LIVE
    Challenge和SPAQ等多个IQA数据集上的大量实验表明，IQARAG能有效提升LMM的IQA性能，为计算开销大的微调方法提供了资源高效的替代方案。
