summaries:
  one_liner_zh: 大规模实证表明：智能体进化的瓶颈是噪声评估无法可靠识别改进，而非无法提出改进。
  abstract_zh: 论文提出分辨率假说：智能体进化循环（提议者生成提示、技能、记忆等候选工件，选择机制保留得分更高者）停滞的原因并非提不出更优工件，而是带噪声的评估无法可靠识别它们。作者跨7种进化方法与6个模型、累计超过1000万次LLM调用进行验证。在候选层面，有益的候选工件确实存在，但选择机制在区分有益与有害工件时并不优于随机，误差因此跨轮累积；在方法层面，论文间典型的几个百分点差距小于同一方法两次独立运行之间的差异，故已发表的方法排名往往靠运气。研究呼吁将自改进智能体的研发与评测重心从设计更多候选改进系统，转向让真实改进可被检测与累积。
  deep_dive: docs/auto/2611.23068.md
