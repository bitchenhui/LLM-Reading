summaries:
  one_liner_zh: 提出类联邦学习框架FoT，多客户端LLM智能体在语义层共享元认知洞见库，协同提升推理效果与效率。
  abstract_zh: 论文提出类联邦学习框架 Federation over Text（FoT），让各自解决不同任务的多客户端 LLM 智能体在语义层面迭代联邦本地推理过程，不共享真实问题实例，也不涉及梯度优化或监督信号。每轮中客户端智能体独立执行本地推理与自改进程序，并将推理轨迹上传至中央服务器。服务器对跨任务、跨域知识进行聚合、蒸馏与整合，构建可复用的共享洞见库，供现有及未来智能体复用以改进推理。实验显示
    FoT 在真实日常任务、跨域协作与研究洞见发现等场景中平均提升 11.9 个绝对百分点的性能，同时客户端完成任务所需生成 token 减少 5.5%。
