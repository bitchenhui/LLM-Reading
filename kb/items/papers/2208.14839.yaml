summaries:
  one_liner_zh: 提出量化感知神经架构搜索QuantNAS，结合熵正则、量化噪声与ADQ模块，搜索出PSNR/BitOps权衡更优的量化友好超分架构
  abstract_zh: 论文提出将模型量化压缩与神经架构搜索相结合的量化感知搜索流程QuantNAS，用于自动发现对量化友好的高效图像超分辨率模型。方法引入熵正则促使每个搜索块内收敛到单一操作，向参数和激活添加量化噪声以近似量化后的性能退化，并提出ADQ（Adaptive
    Deviation for Quantization）模块缓解超分模型中Batch Norm带来的量化问题。实验表明这种近似比直接对模型量化更适合搜索过程，且搜索所得架构在PSNR/BitOps权衡上优于对固定架构做均匀或混合精度量化。方法在两个受SOTA超分模型与RFDN启发的搜索空间上验证，搜索流程比直接权重量化快30%且更稳定。
