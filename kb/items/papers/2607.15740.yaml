summaries:
  one_liner_zh: 构建基于轻量多模态大模型的隐式文化对齐奖励模型，高效评估文生图文化真实性并支撑偏好优化。
  abstract_zh: 现有文生图评估指标与多模态裁判依赖的视觉-语义表征难以捕捉隐式文化规范，导致偏好判断有偏；基于VQA的评估器又依赖自回归文本生成，扩展性受限。作者提出基于42亿参数轻量多模态大模型的隐式文化对齐奖励模型，引入隐式文化探针与跳跃连接交叉注意力（SkipCA）机制，使后期语义特征直接关注早期视觉表征以保留文化显著细节。在CulturalFrames基准3,323对精选图像对上，成对准确率达83.49%，Pearson与Kendall相关系数分别为0.5268和0.3749，优于代表性视觉-语言指标与MLLM评估器。绕过自回归文本生成后，单次评估仅需0.21秒，较标准VQA式评估器约10倍加速，可为RLHF/DPO等偏好优化流程提供高效的文化感知标量奖励信号。
