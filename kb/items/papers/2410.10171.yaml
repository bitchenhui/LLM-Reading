summaries:
  one_liner_zh: 提出多粒度时序轨迹分解的生成式人体视频压缩框架，客观与主观质量均超越VVC及最新生成模型。
  abstract_zh: 该文面向带宽受限的以人为中心的视频通信，提出多粒度时序轨迹分解（MTTF）生成式压缩框架。其运动分解策略先将高维视觉信号隐式表征为紧凑运动向量以保证表征紧凑性，再将这些向量转换为细粒度运动场以保证运动表达力，使码流以最低表征成本携带充分的视觉运动信息。框架还设计了具备背景稳定性增强的分辨率可扩展生成模块，使重建更鲁棒并支持灵活的分辨率自适应。实验表明，该方法在说话人脸视频与人体运动视频的客观和主观质量上均优于最新生成模型及最先进的视频编码标准VVC。
