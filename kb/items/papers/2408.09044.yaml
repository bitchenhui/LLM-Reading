summaries:
  one_liner_zh: 对 H.264/H.265/VP9 在三种分辨率下构建质量-码率凸包并数学建模，验证跨编码器性能可相互预测。
  abstract_zh: 该研究在 960×544、1920×1080、3840×2160 三种分辨率上，用 FFmpeg 对原始视频以不同 CRF 量化档位进行 H.264、H.265 和 VP9
    的编解码与重缩放，生成基于 PSNR 和 VMAF 的质量-码率（QR）曲线，并逐编码器推导凸包曲线。结果显示提高 CRF 会同时降低码率、PSNR 和 VMAF，实测 PSNR 落在 20–40
    dB 区间。对凸包采用对数多项式建模，RMSE 低、R² 高，拟合精度良好。作者据此提出一种编码器的凸包可用于预测其他编码器的性能，为内容驱动的预测方法与自适应流媒体效率提升提供支撑。
