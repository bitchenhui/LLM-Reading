summaries:
  one_liner_zh: MPAI组织制定端到端神经视频编码标准EEV，感知指标优于H.266/VVC，并规划UAV视频编码等新活动。
  abstract_zh: MPAI（基于人工智能的图像、音频与数据编码联盟）正在制定名为MPAI-EEV的"端到端优化神经视频编码"系列标准，利用数据训练的神经编码技术压缩高保真视频所需比特数，不受传统混合编码框架的约束。本文概述了该方向的近期与进行中的标准化工作，阐述EEV的关键技术与设计理念，并报告参考模型的编码效率对比。探索实验表明，EEV模型在感知评价指标上优于最新视频编码标准H.266/VVC。论文还介绍了规划、开发或探索阶段的新活动，如学习型无人机（UAV）视频编码，给出开发时间线、主要技术细节与参考文献指引。
