summaries:
  one_liner_zh: 提出Mastermind框架，以规划-执行-反思闭环自主积累漏洞知识，实现自改进的多轮LLM越狱攻击。
  abstract_zh: 论文针对现有多轮越狱攻击在长对话中易丢失进度、依赖固定模板、无法适应目标模型动态对话状态等问题，提出Mastermind框架。该框架采用规划、执行、反思的闭环流程，通过交互自主构建并完善关于模型漏洞的知识库；同时采用分层规划架构，将高层攻击目标与低层战术执行解耦以保证长期连贯性。知识库通过反思交互经验自动发现和精炼有效攻击模式，动态重组与适配攻击向量。在GPT-5、Claude
    3.7 Sonnet等前沿模型上的实验表明，其攻击成功率与有害性评分显著优于现有基线，并对多种先进防御机制表现出较强鲁棒性。
