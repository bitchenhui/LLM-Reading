summaries:
  one_liner_zh: 提出研究世界模型（RWM）让语言模型预测实验干预结果，在受限实验预算下支撑AI研究智能体的递归自我改进。
  abstract_zh: 该文针对AI研究智能体提出实验快于执行、结果预测成为关键能力的观察，提出用语言模型充当研究世界模型（RWM），预测候选干预在不同研究环境中的结果。评估基于来自预训练、后训练与推理三类共9个研究环境的2600余条实验记录，折合超过17.1万H100
    GPU小时。结果显示，从真实实验经验获取的研究知识可提升RWM对同环境未见干预的预测（Spearman +0.27），且知识可跨环境迁移：仅用OLMo3、Marin、Nanochat的预训练经验即可使Qwen3环境的选择遗憾较零经验降低78%。在固定选择预算的多轮Autoresearch中，带同环境与跨环境知识的RWM分别将最佳增益提高15.8%与11.6%；对13个语言模型的消融表明，加入研究知识比更换模型或增大推理算力更能改善干预排序。
