summaries:
  one_liner_zh: 提出含15个故障检测工具与2个根因分析模块的LLM智能体验证框架，系统性诊断并修复IBM CUGA的可靠性故障。
  abstract_zh: 该文提出面向LLM智能体系统的综合验证框架，包含15个故障检测工具和2个根因分析模块，覆盖输入处理、提示设计与输出生成环节，将轻量规则检查与LLM-as-a-judge评估结合，支持结构化的事件检测、分类与修复。框架应用于IBM
    CUGA并在AppWorld与WebArena基准上评估，发现规划器反复错位、schema违规、脆弱的提示依赖等故障模式。基于诊断结论改进提示与编码策略后，在保持CUGA基准成绩的同时，使Llama
    4和Mistral Medium等中型模型取得显著精度提升，大幅缩小与前沿模型的差距。另有探索性研究将诊断输出与智能体描述交给LLM进行自反思与优先级排序，表明验证过程可演进为对话驱动的智能体化流程。
