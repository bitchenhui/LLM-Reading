summaries:
  one_liner_zh: 提出CriticEval基准，从四个维度、九类任务全面可靠地评测LLM识别并纠正回答缺陷的批评能力。
  abstract_zh: 该文指出批评能力（LLM识别并纠正回答中缺陷的能力）对自我改进与可扩展监督至关重要，并提出CriticEval基准以全面、可靠地评测该能力。基准从四个维度、九类任务场景展开，同时评测标量型与文本型批评，并覆盖不同质量的回答。为保证可靠性，作者标注了大量批评参考文本，使GPT-4能够可靠地评判文本式批评。对开源与闭源LLM的大规模评测验证了该评测设置的可靠性，结果显示开源模型颇具潜力、批评数据集有效，且批评能力与任务类型、回答质量及批评维度之间存在值得关注的关联。
