summaries:
  one_liner_zh: 提出Critique-GRPO在线RL框架，融合自然语言批评与数值奖励优化LLM推理，实现自我批评式自我改进。
  abstract_zh: 论文指出纯数值奖励强化学习的三大局限：性能停滞、自发的自我反思无效、失败无法持续纠正，并发现停滞的RL模型在获得自然语言批评后能成功修正失败解。据此提出Critique-GRPO在线强化学习框架，将自然语言批评与数值奖励结合进行策略优化，使模型同时从初始回答和批评引导的改进回答中学习。实验显示该方法超越所有对比的监督微调与RL微调方法：Qwen系列模型在8个困难推理任务上平均Pass@1提升约+15.0-21.6%，Llama-3.2-3B-Instruct提升+7.3%。通过自我批评实现有效的自我改进，在AIME
    2024上相对GRPO取得+16.7%的Pass@1提升，代码与模型已开源。
