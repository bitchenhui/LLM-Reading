summaries:
  one_liner_zh: 提出统一框架将LLM推理树搜索解构为搜索机制、奖励形式化与转移函数，区分瞬态搜索引导与持久参数化奖励建模。
  abstract_zh: 该综述指出LLM推理领域的审议式树搜索统一了两大前沿：按需部署计算的测试时扩展（TTS）与利用搜索生成数据持久增强模型参数的自我改进，但该领域碎片化且缺乏共同形式化体系。论文将搜索算法解构为搜索机制、奖励形式化与转移函数三个核心组件，并形式化区分了服务于TTS的瞬态'搜索引导'与服务于自我改进的持久'参数化奖励建模'。基于该形式化，作者提出以组件为中心的分类体系，综合梳理了当前最先进方法，并规划了面向自主自我改进智能体的研究路线图。
  deep_dive: docs/auto/2510.09988.md
