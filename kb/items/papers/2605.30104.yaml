summaries:
  one_liner_zh: SEAL 用种子淘汰赛加自改进清单的元裁判协议，从饱和基准中低成本提取模型排序信号。
  abstract_zh: 针对主流语言模型基准日益饱和、前沿系统得分几乎并列而标准指标无法区分的问题，本文不构造更难的基准，而是改进对同一批候选输出的评测方式。提出的 SEAL（Seeded Elimination
    with Adaptive LLM-as-a-Meta-Judge）将候选输出组织成单场淘汰赛，每场比赛用任务级原则加自改进的清单式标准进行评判。该方法在代码生成、数学推理、知识密集型问答和工具使用智能体等多个饱和基准上验证。结果显示
    SEAL 与全成对评审的 Spearman 一致性达 0.83–1.00、top-1 一致率 4/4，且每任务仅需 11.89 次调用，远低于全成对评审的 28.00 次。
