summaries:
  one_liner_zh: 提出CDSR网络联合学习内容与退化感知特征，缓解退化嵌入与SR特征不一致问题，提升盲图像超分辨率性能
  abstract_zh: 针对盲图像超分辨率（SR）中退化嵌入与SR特征不一致的难题，作者观察到联合学习内容与退化感知特征是最优方案。据此提出CDSR网络，包含三个新模块：轻量块编码器（LPE）联合提取内容与退化特征，域查询注意力模块（DQA）自适应降低二者不一致性，码本空间压缩模块（CSC）抑制冗余信息。相比有监督核预测（SKP）依赖不可得的真实模糊核，CDSR绕开了该限制。在多个基准上的实验表明，CDSR优于现有无监督退化预测（UDP）模型，在PSNR和SSIM上与最先进的SKP方法相比也具有竞争力。
