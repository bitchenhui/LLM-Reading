summaries:
  one_liner_zh: 指出科学粒子与CV点云在分形维数上的差异限制了八叉树方法，神经编码器较G-PCC基线仅带来边际码率收益
  abstract_zh: 论文研究神经点云压缩（PCC）方法能否迁移到宇宙学、分子动力学和等离子体物理等领域的科学粒子数据。作者指出关键差异在于分形维数：CV点云局部呈平面状，而科学粒子并非如此，这削弱了大多数PCC方法所依赖的八叉树数据结构的有效性。跨多个科学领域的评测显示，神经编解码器仅比传统G-PCC基线取得边际的码率缩减，存在显著性能差距。论文据此勾勒了科学数据结构限制当前神经方法之处，以及未来学习方法的潜在助益方向。
