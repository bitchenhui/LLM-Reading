summaries:
  one_liner_zh: 用递归自我改进（RSI）循环训练的医疗基础模型，在多个医疗基准上夺冠且保持域外通用能力。
  abstract_zh: 论文提出通过递归自我改进（RSI）训练的医疗基础模型 Cura 1T，覆盖患者问诊、临床文本与图像推理、交互式诊断和电子病历（EHR）工具调用等高利害场景。每轮 RSI 中，RSI
    harness 在医疗基准上运行当前模型，评估轨迹以定位能力缺口，并通过合成训练数据修正训练混合，避免单一任务的窄更新损害其他能力。在6个医疗基准中，Cura 1T 在 MedAgentBench、HealthBench
    Professional、HealthBench Hard、MedXpertQA text 和 AgentClinic 上得分最高，在 MedXpertQA 多模态上排第二。同时它在 AIME、GPQA-Diamond
    和 τ²-Bench 等域外推理与智能体基准上保持性能不退化。
