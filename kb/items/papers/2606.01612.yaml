summaries:
  one_liner_zh: 用LVLM内部注意力模式筛选候选框，无需微调即实现小目标定位自改进，最高提升19%。
  abstract_zh: 论文发现LVLM的注意力结构中编码了定位质量信息：仅用注意力图训练的轻量IoU回归器即可对候选框质量做出较强预测（Pearson r>0.67）。该回归器驱动基于注意力的候选选择框架ACS-Learned，从多个采样候选框中挑选最优框以改进目标定位。通过分析回归器学到的规律，作者识别出最关键的transformer层与注意力头，并据此提出完全无需训练的ACS-Free选择器，按判别性头上的注意力熵对候选排序。在COCO和Objects365上，小目标定位取得最高19%的自改进，ACS-Free在所有无训练方法中表现最佳，表明有用的注意力结构同时提升了定位可靠性与可解释性。
