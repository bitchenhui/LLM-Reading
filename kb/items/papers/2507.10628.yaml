summaries:
  one_liner_zh: 提出难度感知的引导式混合策略优化GHPO，自适应混合模仿与探索式强化学习，稳定高效提升LLM推理自改进。
  abstract_zh: 论文针对RLVR范式下on-policy强化学习训练不稳定、低效的问题，指出根源在于训练数据难度与模型当前能力的错配，导致奖励信号稀疏、学习停滞。作者提出引导式混合策略优化GHPO，通过自适应提示细化动态校准任务难度：对超出模型能力的问题采用直接模仿学习，对可解任务保留探索式强化学习，形成平滑优化的学习课程。在六个数学基准上平均取得约5%的性能提升，持续优于强on-policy
    RL与课程学习基线，并显著增强训练稳定性，为资源受限的小型LLM提供可扩展的高效训练方案。
