  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 216条4K序列主观实验表明VMAF、PSNR等主流指标对神经编解码器仍有效，传统与神经编解码器间无显著差异。
  abstract_zh: 该论文通过受控主观质量实验，检验现有质量指标在神经视频编解码器（NVC）上的有效性。研究使用AV1、VVC两种传统编解码器与DCVC-FM、DCVC-RT两种神经编解码器，对6个4K/UHD-1源视频（8-10秒，60fps）在360p至2160p共4个分辨率、9个QP下编码，生成216条序列，由30名受试者评分。基于主观分数评估了全参考、混合与无参考三类质量指标。结果显示VMAF与AVQBits|H0|f具有较强Pearson相关，FasterVQA在无参考指标中表现最佳；PSNR在跨编解码器的序列内比较中Spearman秩相关最高；且传统与神经编解码器之间未观察到指标可靠性的显著差异。数据集（源视频、编码序列、主客观分数）将开源发布。
