summaries:
  one_liner_zh: 提出GCN层间交互+分层MoE专家专精的盲图像质量评估框架，兼顾精度与计算成本
  abstract_zh: 针对现有盲图像质量评估（BIQA）方法聚合多阶段骨干特征时未区分各层对质量预测贡献差异、以及统一监督所有专家限制表征多样性的问题，提出质量表征解码框架Life-IQA+。其层间交互模块用GCN精炼的最深层特征构建质量查询，以次深层特征作键值，通过交叉注意力实现跨层表征交互；并引入由密集激活共享专家层与稀疏激活路由专家层组成的灵活分层混合专家（MoE）架构。对部分共享专家施加辅助分类监督（合成失真数据用失真类型标签、真实数据用离散化质量等级标签）以增强专家多样性与能力。在合成与真实失真基准及消融实验中，Life-IQA+取得有竞争力的预测精度，并在精度与计算成本间达到良好平衡，代码已开源。
