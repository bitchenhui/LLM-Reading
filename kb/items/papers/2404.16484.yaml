summaries:
  one_liner_zh: AIS 2024实时超分挑战赛综述：AVIF压缩540p图像实时4x上采样至4K，25队方案优于Lanczos且耗时<10ms。
  abstract_zh: 该文是AIS 2024实时图像超分辨率（RTSR）挑战赛的基准介绍与优胜方案综述，任务为将AVIF压缩的540p图像在商用GPU上以4倍因子实时上采样至4K。测试集涵盖数字艺术、游戏与摄影等多样4K内容，并采用现代AVIF编解码器替代JPEG进行压缩。挑战赛共吸引160名参与者，25支队伍提交了代码与模型，方案针对内存效率与边缘设备运行时提出了新颖架构设计。所有方法在PSNR保真度上均超过Lanczos插值，单帧处理时间低于10ms。
assessment:
  relevance: medium
  decision: summary_only
  reason: 压缩图像的实时超分属于编码链路处理与增强（超分方向），非核心编码域，按基准仅收录摘要级。
