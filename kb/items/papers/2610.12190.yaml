summaries:
  one_liner_zh: 构建DataSense-Bench，评测前沿AI代理为微调小型LLM挑选训练数据并预测性能的"数据直觉"能力。
  abstract_zh: 针对RSI与AGI宣称盛行的现状，该工作提出DataSense-Bench，考察前沿AI模型是否具备可靠的数据选择能力。基准要求AI代理在禁止训练模型、禁止访问真实评测任务的约束下，通过检查数据、编写并执行分析代码、运行模型前向传播，为微调小型LLM挑选并排序候选训练子集；随后按标准化协议在各子集上微调基座模型并评估训练后性能，从最优子集训练后表现与排序准确性两个维度打分。基准在终端问题求解与工具使用两类任务上实例化，分别从OpenThoughts-Agent与EnvScaler选取训练轨迹，并在TBLite与BFCL上评测。结果显示：代理相对随机选择的收益有限，无法可靠排序所选子集，且排序能力跨任务不稳定；执行轨迹分析表明代理常使用相似的数据信号，却对其训练价值给出不同解读。
