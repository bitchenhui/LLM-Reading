summaries:
  one_liner_zh: 提出首个印度语系神经音频编解码器深伪语音基准 ICF，并给出双曲多模态融合检测模型 SATYAM
  abstract_zh: 神经音频编解码器（NAC）驱动的音频大语言模型催生了高度逼真的语音深伪（CodecFake），但现有检测研究集中于英语和中文。作者基于 IndicSUPERB 真实语料构建首个大规模印度语系基准
    ICF，覆盖多语言、多说话人画像和多种 NAC 合成语音。实验表明在英语中心数据集上训练的 SOTA 检测器无法泛化到 ICF，现有 ALM 零样本检测表现也持续不佳。为此提出 SATYAM 双曲
    ALM：将 Whisper 语义表示与 TRILLsson 韵律表示在双曲空间经 Bhattacharya 距离融合，再与输入条件提示做同构对齐，实现语音内（语义-韵律）与跨模态（语音-文本）双层建模，在
    ICF 上持续优于端到端与 ALM 基线。
