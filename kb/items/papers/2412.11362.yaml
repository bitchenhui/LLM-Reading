summaries:
  one_liner_zh: 提出端到端联合优化的可变速率NeRF体视频压缩框架VRVVC，单模型覆盖多码率且RD性能超越现有方法。
  abstract_zh: 针对NeRF体视频数据量巨大导致的存储与传输难题，提出端到端联合优化的可变速率压缩框架VRVVC，用单一模型实现多码率。框架引入紧凑的三平面隐式残差表示对长时动态场景做帧间建模，有效降低时间冗余。残差压缩采用可学习量化与轻量MLP熵模型，通过预定义拉格朗日乘子控制各潜在表示的量化误差，从而实现码率可变。配合端到端渐进式训练策略与多率失真损失优化整个框架。实验显示VRVVC在单模型内覆盖宽码率范围，并在多个数据集上的RD性能超越现有方法。
