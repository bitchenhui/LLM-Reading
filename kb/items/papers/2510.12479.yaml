summaries:
  one_liner_zh: 多假设时域预测的条件残差视频编码，每次预测限用两个参考帧降低内存访问，性能超VTM-17.0、比肩DCVC-FM。
  abstract_zh: 论文提出MH-LVC，一种在条件残差视频编码框架下利用长期与短期参考帧进行多假设时域预测的方案。针对近期时域上下文挖掘方法需存储大量隐式上下文信息、导致解码时内存访问过大的问题，MH-LVC虽存储多个长期/短期参考帧，但每次时域预测最多仅使用两个参考帧。其解码帧缓冲管理允许编码器灵活利用长期关键帧抑制时域级联误差、用短期参考帧最小化预测误差，且缓冲方案使时域预测结构可针对具体视频内容自适应调整，这一灵活性在传统编码器中常见但在学习型编码器中尚未充分探索。实验显示，该方法在常用测试数据集上以PSNR-RGB衡量优于低延迟B配置下的VTM-17.0，与DCVC-FM等最先进学习型编码器性能相当，同时所需解码帧缓冲更小、解码时间相近。
