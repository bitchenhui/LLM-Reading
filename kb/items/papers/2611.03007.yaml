summaries:
  one_liner_zh: 构建FGLive-Comments指令微调数据集并训练多模态大模型Q-CamTuning，实现直播场景细粒度质量推理与相机参数调整建议。
  abstract_zh: 直播普及使自动相机调优成为普通用户获得高QoE的关键，但现有IQA方法难以识别图像间细微质量差异，更缺乏细粒度差异解释与调参建议能力。作者构建指令微调数据集FGLive-Comments，含细粒度图像对偏好标注及基于全局/局部视觉证据的质量推理标注，支持相机参数选择性调整建议。据此开发多模态大语言模型Q-CamTuning，采用渐进式感知-证据-引导框架，学习质量感知视觉表征、以全局-局部证据增强细粒度推理，并将质量问题映射到相机参数调整方向。实验显示其在质量评分与细粒度图像对排序上优于现有IQA模型，用户研究亦验证调参建议能力。
