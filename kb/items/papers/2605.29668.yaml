  evidence: abstract（初筛，未读全文）
- statement: GRASP超过五个自我改进基线中最强者21.0个百分点，并使其他基础模型提升17.2至40.3个百分点。
  confidence: reported
  metrics:
  - name: 超过最强基线幅度
    value: +21.0 pts
