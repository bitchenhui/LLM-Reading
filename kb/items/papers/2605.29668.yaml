- statement: 为五个基线提供相同接受门可提升其域内表现但在分布外均无提升，说明增益源于施加在有界可编辑库上的门而非保留集验证本身。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 该机制适用于任务重复出现且结构可验证的环境，在开放式动作空间中效果平平；冻结技能库可跨模型及共享工具调用约定的基准迁移，接口不匹配时性能退化。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 将LLM代理自我改进建模为有界技能库的门控编辑序列，仅在保留探针净改进且不超硬回归预算时接受新技能。
  abstract_zh: 先前自我改进方法累积自然语言指导时不校验每条新经验是否保持既有正确行为，修复一条轨迹的建议可能悄悄损害另一条。GRASP把代理改进视为对有界技能库的一系列编辑，仅当候选技能在平衡保留探针上带来净改进并满足硬回归预算时才接纳。在两个基于FHIR的临床基准上对五个基础模型评估，MedAgentBench上gpt-oss-120b从40.6%升至88.8%，超过五个自我改进基线中最强者21.0个百分点，其余基础模型提升17.2至40.3个百分点。消融显示增益来自对比式提议生成、接受门与硬回归预算而非技能写作本身，且该机制仅在任务重复、结构可验证的环境有效，冻结技能库可跨模型与共享工具调用约定的基准迁移，接口不匹配时退化。
