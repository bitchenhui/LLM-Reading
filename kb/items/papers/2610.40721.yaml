summaries:
  one_liner_zh: 提出自改进框架 MetaVul，通过工作流优化循环迭代发现漏洞检测 LLM 智能体的最优 harness 并支持跨模型迁移。
  abstract_zh: LLM 智能体做漏洞检测时依赖固定且手工编写的 harness，难以适应评估反馈，且跨数据集与模型迁移性差。MetaVul 从种子结构化推理支架出发，利用配对的漏洞/修复函数反馈，在工作流优化循环中搜索
    harness 历史（含轨迹、日志与指标），保留结构化推理与判定格式，并返回帕累托最优 harness 集合。作者在 202 对验证集上优化、430 对未见 held-out 集上评估，覆盖前沿与小尺寸
    LLM 的多种智能体架构。结果显示成对漏洞检测在验证集最高提升 23.3 个百分点、held-out 集最高提升 25.8 个百分点；单模型学得的 harness 迁移到其他模型可在 held-out
    集上再提升 14.7 个百分点。
