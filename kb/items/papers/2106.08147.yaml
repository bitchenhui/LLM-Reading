claims:
- statement: M-SRGAN 以 GAN 在压缩内容上用感知损失训练，作为解码端空间上采样集成到 HEVC HM 16.20，在 JVET CTC（UHD、Random Access）下相对原始
    HM 16.20 感知质量明显提升，平均码率节省 35.6%（BD 度量、以 VMAF 计算）
  confidence: reported
  metrics:
  - name: Bjøntegaard Delta 码率节省
    value: 35.6%
    scope: 基于 VMAF；JVET 通用测试条件 UHD 测试序列、Random Access 配置；对比锚点为原始 HEVC HM 16.20
  evidence: abstract（初筛，未读全文）
- statement: 论文认为 MSE 等像素域损失与主观评价相关性差，因此改用感知损失函数在压缩内容上训练超分模型，以提升重建的主观质量
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出感知驱动超分 M-SRGAN（GAN+感知损失），集成 HEVC HM 后按 VMAF 测得平均 35.6% BD 码率节省
  abstract_zh: 论文针对视频编码中的空间分辨率自适应（低分辨率编码、解码端上采样重建）路线，提出感知驱动的超分辨率方法 M-SRGAN。该方法采用改进的 CNN 模型，通过生成对抗网络（GAN）在压缩内容上以感知损失函数训练，替代传统上采样滤波器，以克服
    MSE 类像素损失与主观质量相关性差的问题。方法集成到 HEVC HM 16.20，并在 JVET 通用测试条件（UHD 测试序列）的 Random Access 配置下评估。结果显示相对原始 HM
    16.20 感知质量明显提升，以 VMAF 衡量的 Bjøntegaard Delta 平均码率节省达 35.6%。
