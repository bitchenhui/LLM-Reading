summaries:
  one_liner_zh: 置信度引导融合双向时间线索与空间补充分支，统一超高分辨率神经视频编码，RA 下较 VTM-13.2 节省 13.01% PSNR BD-rate。
  abstract_zh: 针对空间分辨率提升后时间对应关系日益不可靠的问题，HR-NVC++ 构建共享时空上下文：以置信度引导的自适应融合平衡前向与后向时间线索的可靠性，并由空间补充分支丰富时间参考无法解释的区域。基于该共享上下文提供两种压缩模式：保真模式保留基于熵的隐变量编码实现像素级精确压缩；感知模式去除额外隐变量编码、直接从上下文重建，表明信息充分的时空上下文已携带感知友好重建所需的主要内容。在
    UVG-4K 与 JVET Class A1/A2 上的实验显示，随机访问配置下相对 H.266/VVC 参考模型 VTM-13.2 平均节省 13.01% PSNR BD-rate，同时感知质量与时间一致性显著优于现有神经视频编码器。
