summaries:
  one_liner_zh: 首个退化感知空间理解大规模数据集，将退化形成过程嵌入3DGS渲染，揭示MLLM空间推理在9类视觉退化下的鲁棒性缺口。
  abstract_zh: 提出SpaceDG，首个面向退化感知空间理解的大规模数据集：通过将退化形成过程物理化嵌入3DGS渲染的合成引擎，逼真模拟运动模糊、低光、恶劣天气、镜头畸变、压缩伪影等9类退化。数据集约含近1,000个室内场景的100万条QA对，并配有人工校验的SpaceDG-Bench（1,102题、11类推理、9类退化、超1万VQA实例）。对25个开源与闭源多模态大模型的评测表明，视觉退化持续且显著削弱空间推理能力，暴露关键鲁棒性缺口。在SpaceDG上微调可大幅提升退化条件下的鲁棒性，甚至超过人类水平，且不损失清晰图像上的性能。
