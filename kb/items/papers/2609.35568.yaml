summaries:
  one_liner_zh: 提出持久自改进智能体SAGE，用采用感知效用估计与效用门控固化积累NPU算子知识，执行率达95.5%。
  abstract_zh: 针对LLM的CUDA知识难以迁移到NPU等数据稀缺专用架构、后训练又依赖稀缺专家数据的问题，作者提出持久自改进智能体SAGE。其采用感知效用估计（ATU）将显式采纳记录与算子评估结果结合，实现采用感知的信用分配；效用门控固化（UGC）依据正效用与跨算子重复采纳，把可复用规则抽象进有界常驻上下文，兼顾检索开销与跨任务引导。在NPUKernelBench上，SAGE执行率达95.5%，优于最强受控基线的84.1%，且86.9%的已解算子性能超过torch_npu。配合GLM-5.3，在稀疏flash
    attention算子上相对torch_npu参考实现取得43.99倍加速，表明采用感知信用分配与选择性固化能有效跨任务积累并复用硬件专属知识。
