summaries:
  one_liner_zh: 将测试时训练封装为可调用工具并学习测试时策略，自主决定何时TTT、选哪种算法及是否复用技能，实现模型级自我改进。
  abstract_zh: 测试时训练（TTT）利用测试输入的信号更新LLM参数，可在预设场景（如IMO竞赛）带来显著提升，为模型级自我改进提供直接机制，但不适配的方法会浪费算力甚至损害性能。作者提出Agentic-TTT，学习一个测试时策略来决定是否启用TTT、调用哪种算法以及是否复用已有技能：将TTT流程封装为可调用工具，把积累的技能视为演化的部署环境，并依据决策观测到的效用增益训练该策略。在自建基准上，Agentic-TTT相比骨干模型使效用近乎翻倍，学会在效用与算力之间权衡，并能泛化到训练未见的领域，指向自主自我改进。
