summaries:
  one_liner_zh: 提出显式世界-语言-动作模型 D-World，经实-虚-实循环修正数字孪生，冻结 LLM 实现递归自我改进。
  abstract_zh: 论文指出机器人策略背后的世界模型多为隐式、难以检视与修正，提出基于感知-规划-行动分解的显式世界-语言-动作模型 D-World：感知智能体用生成的视觉与几何代码将场景写成可执行数字孪生，规划智能体在仿真中搜索动作，并在每段动作块执行后按实测修正孪生的物体状态与物理参数。参数修正仅在重放最新动作块不使任何实测残差超出容限时才被接受，每个动作块先在更新后的孪生中校验，结构失配则回送感知重建。作者将这一测量驱动的修正循环称为递归自我改进（RSI），其中
    LLM 保持冻结而世界模型持续改进，并把兼顾任务推进与暴露模型误差的动作选择建模为双控制问题，证明纳入证据的成本决定探测动作是否划算的阈值。在双臂机器人的毛巾与烤面包机任务上，局部修正（如面包渲染深度残差从
    22.4 mm 降至 1.5 mm）使执行无需重建即可继续。
  deep_dive: docs/auto/2610.17114.md
