summaries:
  one_liner_zh: 提出DR.Experts，用退化感知VLM提取失真先验并经MoE式动态加权融合，在五个BIQA基准上超越现有方法
  abstract_zh: 该论文指出无参考图像质量评估（BIQA）模型性能受限的根源是缺乏可靠的失真先验，导致对细微失真不敏感并与人类主观判断错位。DR.Experts首先借助退化感知视觉-语言模型获取失真特异性先验，再通过失真显著性差分模块将其与语义注意力区分并精炼，确保先验真实反映失真。随后采用MoE风格的动态失真加权模块，按感知影响对失真特征、语义与桥接表征加权融合以预测质量。在五个具有挑战性的BIQA基准上的实验表明其优于现有方法，且在泛化性和数据效率方面表现突出。
