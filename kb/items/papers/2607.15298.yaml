summaries:
  one_liner_zh: 用SIREN网络将视频与音频联合存储为网络权重，经蒸馏、16位量化与无损编码实现2.61倍压缩，但质量仍落后传统编解码器。
  abstract_zh: 该工作提出用单个SIREN网络将时空坐标映射为RGB值与音频幅度，把视频连同音轨一并编码为网络权重；网络含独立的音/视频初始化层、共享全连接隐层与三个输出分支，两个孪生音频分支的分歧用于估计并扣除残余噪声。过拟合的教师网络经响应式知识蒸馏压缩为更小的学生网络，随后做16位对称量化并用LZMA2无损编码。在6.08
    MiB测试视频上，量化学生网络达到视频PSNR 28.72 dB、SSIM 0.75，音频PSNR 24.18 dB、对数谱距离10.69 dB；表示体积从9.05 MiB降至2.33 MiB，整体压缩比2.61。1至32位量化扫描显示重建质量在16位处饱和；作者与H.264、HEVC及MP3对比并坦承性能不及，另提供基于WebRTC的浏览器端训练-传输-解码原型。
assessment:
  relevance: medium
  decision: summary_only
  reason: 属核心域INR视频编码方向，但整体压缩比仅2.61且质量显著落后H.264/HEVC，贡献有限，初筛摘要即可。
