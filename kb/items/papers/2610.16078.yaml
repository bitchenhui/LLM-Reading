summaries:
  one_liner_zh: 提出 HACE 框架，LLM 智能体与领域专家模型互惠协同进化，并以进化搜索优化两者交互框架。
  abstract_zh: 论文提出异构智能体协同进化框架 HACE，通过互惠学习联合进化领域专家基础模型与 LLM 智能体。专家模型经监督学习改进，智能体采用在线策略强化自训练，并以当前专家模型上验证的性能增益作为引导信号；智能体的探索结果反过来为后续专家模型训练提供信息。为维持这种互惠学习，HACE
    进一步用进化搜索优化两模型的交互框架，随能力演化自适应调整信息交换与训练经验选择方式。在推荐系统、蛋白质功能预测与晶体稳定性预测三个领域评估，HACE 在主要任务指标上均优于所对比的自改进方法。
