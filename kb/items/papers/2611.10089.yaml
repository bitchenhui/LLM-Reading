summaries:
  one_liner_zh: 提出双循环元内省框架META-IR，以内省MCTS加元学习外循环实现LLM安全对齐对越狱攻击的持续自适应改进。
  abstract_zh: 针对静态对齐流程在对抗分布偏移下失效的问题，论文提出元内省推理框架META-IR。其采用双循环架构：内循环通过SI-MCTS进行结构化风险分析、自我评估与反思纠错，外循环基于元学习在多类越狱任务族上优化内省策略，以快速泛化到未见攻击。动态越狱模拟模块使模型持续接触渐进变难的对抗提示，实现无人工监督的持续自我改进。在Llama-3.1-8B-Instruct与Qwen-2-7B-Instruct上的实验表明，META-IR在安全性、有用性、泛化与内省指标上较全部基线显著提升适应速度、鲁棒性与推理稳定性。
