summaries:
  one_liner_zh: 提出SAIP方法，以目标分割掩码实现免信令的任意形状帧间预测划分，在VTM 12.0上最高取得1.98% BD-rate增益
  abstract_zh: 针对VVC块划分无法紧凑表达自然视频中任意形状运动目标的问题，提出目标分割辅助帧间预测（SAIP）。该方法对参考帧中的目标进行分割，并在适当指示下将分割掩码传递到当前帧，作为各区域的任意形状划分，且无需额外信令比特。基于掩码对不同区域分别执行运动补偿以提升预测精度，并利用掩码更高效地编码各区域运动矢量；同时将掩码纳入运动估计与划分估计的联合率失真优化，以更准确地推导各区域运动矢量与划分。方法实现于VVC参考软件VTM
    12.0，在通用测试序列上，Low-delay P、Low-delay B、Random Access配置下平均BD-rate分别降低0.82%、0.49%、0.37%，最高分别达1.98%、1.14%、0.79%。
