summaries:
  one_liner_zh: 让 LLM 迭代改写合成预训练数据生成程序，以少 9-33% 的微调步数追平人工课程并超越 FunSearch/AlphaEvolve。
  abstract_zh: 提出 PRECOCIAL，自动优化生成合成预训练数据的符号程序：LLM 从初始生成器出发迭代改写程序，每次改写通过'随机初始化 transformer 在该数据上预训练+下游任务微调'来评分。为控制评估成本，整个搜索全程复用单个网络，对被接受的程序继续预训练，而非每个候选重新训练一个网络。在四个语言与代码数据集上，固定微调预算下优化后的程序困惑度低于人工设计课程、已发表程序化生成器、随机程序变异及
    LLM 首次迭代写出的程序；达到与人工课程相同困惑度仅需少 9-33% 的微调步数。在相同评估次数与更低成本下，最终困惑度优于为每个候选训练新网络的 FunSearch 和 AlphaEvolve。优化得到的生成程序可跨域迁移，并在四个推理与问题求解任务上带来更好的下游表现。
