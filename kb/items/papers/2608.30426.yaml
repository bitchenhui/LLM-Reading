summaries:
  one_liner_zh: 将ReAct适配任务型对话并提出无监督自改进微调流程，微调后8B模型超越70B上下文系统
  abstract_zh: 针对对话系统动态信息检索不足导致幻觉与准确性下降的问题，作者将ReAct框架适配到任务型对话，使LLM能够调用外部知识生成事实性回复。方法上提出无监督微调流程：通过上下文学习推理采集推理轨迹，并用LLM裁判过滤高质量样本构建训练集。在此基础上引入无监督自改进循环，由性能提升后的checkpoint生成更优轨迹供后续微调迭代使用。在SIMMC数据集上的实验表明ReAct系统凭借更强的推理与工具使用优于基线，微调后的8B模型超过70B的in-context系统；论文还给出误差分析、场景复杂度影响与跨域泛化实验。
