summaries:
  one_liner_zh: 提出可控单步扩散网络CODSR，兼顾图像超分的保真度、区域自适应生成先验与文本对齐
  abstract_zh: 论文针对现有一步扩散超分方法的三点不足展开：低质量输入经压缩编码导致的信息损失、生成先验缺乏区域判别性激活、文本提示与语义区域错位。CODSR设计了LQ引导的特征调制模块，利用低质输入中的未压缩信息为扩散过程提供高保真条件；提出区域自适应生成先验激活方法，在提升感知丰富度的同时保持局部结构保真；并引入文本匹配引导策略充分利用文本条件。实验表明其感知质量优于现有方法且保真度具竞争力，同时保持一步推理的高效性。
