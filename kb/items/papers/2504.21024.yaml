- statement: 现有多数网络智能体自我改进方法在自主学习循环中会到达性能停滞点，根因在于网络环境探索不足与LLM预训练网页知识利用不充分
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 协同进化的世界模型LLM在真实网络环境中较现有自我进化智能体取得约10%的性能提升
  confidence: reported
  metrics:
  - name: 性能提升
    value: 10%
    scope: Mind2Web-Live、WebVoyager、GAIA-web三个真实网络环境上相对现有自我进化智能体
  evidence: abstract（初筛，未读全文）
- statement: 世界模型LLM承担双重角色：作为虚拟网络服务器自生成指令式训练数据持续改进智能体策略，以及作为推理时的想象引擎通过前瞻模拟引导动作选择
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 该框架在不使用更强闭源模型蒸馏的情况下实现提升，且作者主张将世界模型集成进自主智能体框架是获得持续适应能力的必要条件
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 引入协同进化的世界模型LLM，兼任虚拟网络服务器与推理想象引擎，突破网络智能体自我改进的性能停滞。
  abstract_zh: 针对网络智能体自我改进在自主学习循环中性能停滞的问题，作者提出引入与智能体协同进化的世界模型LLM。该世界模型基于当前观测与动作预测下一观测，一方面充当虚拟网络服务器自生成指令式训练数据以持续优化智能体策略，另一方面在推理时作为想象引擎进行前瞻模拟引导动作选择。在Mind2Web-Live、WebVoyager和GAIA-web三个真实网络环境中，相比现有自我进化智能体取得约10%的性能提升，且不依赖来自更强闭源模型的蒸馏。
