summaries:
  one_liner_zh: 以Solver-Proposer-Checker三智能体信息不对称与多智能体强化学习抑制RAG幻觉，实现LLM事实性共同自进化。
  abstract_zh: 针对LLM-as-a-judge幻觉检测中验证器与生成器同源导致的自我确认偏差，提出MARCH框架，设置信息不对称：Checker在不接触Solver原始输出的前提下，将Proposer分解出的原子级命题逐条对照检索证据校验。通过多智能体强化学习（MARL）联合训练三个智能体，使其共同进化以优化事实一致性。实验表明MARCH在多个幻觉基准上显著降低幻觉率，配备MARCH的8B参数模型可达到与强大闭源模型相当的水平，为LLM事实性自我改进提供可扩展路径。
