summaries:
  one_liner_zh: 提出基于Givens旋转分解的快速二次变换FaSST，在AV2帧内编码中以远低于LFNST的复杂度实现持平乃至更优的编码性能。
  abstract_zh: 针对数据依赖二次变换计算复杂度高且缺乏显式率失真最优设计准则的问题，本文提出快速稀疏化二次变换（FaSST）设计框架。方法将数据驱动的稀疏正交变换分解为一系列Givens旋转，通过交替最小化结合近似Givens分解高效确定各旋转参数。旋转数量依据预测模式自适应调整以进一步降低计算量。作者用FaSST为AV2帧内预测残差设计了模式相关二次变换，模式自适应FaSST在匹配LFNST率失真性能的同时减少83.67%的计算量；并通过避免固定系数截断，相对LFNST最高取得1.80%的BD-rate节省，且复杂度低66.24%。
