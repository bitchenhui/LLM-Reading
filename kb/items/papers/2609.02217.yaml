summaries:
  one_liner_zh: 提出SkillGLoW，将任务本地技能聚合为过程族并压缩为去实例化全局先验，配合执行验证的提交门控，在长程任务流上实现更高效紧凑的智能体自改进。
  abstract_zh: LLM智能体通过书写与复用文本技能实现自我改进，但单一全局文档易坍缩为泛化规条，按任务的扁平技能池则不断膨胀且条目与具体实例绑定。SkillGLoW以'求解过程'为复用单元：将任务从自身执行中写出的本地技能聚合为过程族，压缩为去实例化的全局先验，实例细节按需再生成而非存储；提交门控仅在真实执行证明不降低已部署库性能时才接纳新先验。在数学推理、终端自动化、软件修复与具身控制四个基准、三个模型上，先验相对无技能基线平均提升17.2点（困难任务），12次持续改进运行全部正增益，加入本地再生成后达18.0点。技能库每个过程族仅保留一条先验，比按任务池紧凑3.6倍，同协议下在21个对比格中15个领先已发表的单文档优化器；在未见过的ALFWorld任务上成功率从73.9%升至83.9%，说明迁移的是过程而非任务记忆。
