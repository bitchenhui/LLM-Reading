claims:
- statement: 化学 LLM 普遍缺乏往返一致性（如能生成分子描述却无法从该文本重建分子结构），且模型往返一致性与主要任务性能存在强相关，可将一致性转化为直接优化目标。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: RTRL 以往返变换成功作为奖励信号训练化学 LLM，在有监督、自监督与合成数据三种数据情形下均显著超越强基线，同时提升任务性能与往返一致性。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: RTRL 的迭代变体中正向与反向映射交替互相训练形成自改进循环，数据高效，尤其适合利用化学领域常见的海量无标注数据。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出 RTRL 框架，以往返变换成功为奖励训练化学大模型，正反向映射交替互训形成自改进循环，显著提升性能与一致性。
  abstract_zh: 化学大语言模型在反应预测、逆合成等双向任务上往往缺乏往返一致性，例如能生成分子描述文本却无法从自己生成的文本重建原分子结构，说明模型学到的是单向记忆而非灵活掌握。已有研究表明往返一致性与主要任务性能强相关，作者据此提出往返强化学习（RTRL），把往返变换是否成功作为奖励信号来训练模型提升一致性。其迭代变体让正向与反向映射交替互相训练，构成自改进循环，对化学领域常见的海量无标注数据高度数据高效。实验显示
    RTRL 在有监督、自监督与合成数据三种情形下均显著超越强基线，同时提升性能与一致性。
