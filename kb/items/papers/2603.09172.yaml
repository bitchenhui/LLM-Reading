summaries:
  one_liner_zh: 用 AlphaEvolve（LLM 代码变异智能体）将九个经典拉姆齐数下界推高，如 R(4,19) 213→219。
  abstract_zh: 本文将 AlphaEvolve——一种基于 LLM 的代码变异智能体——应用于经典拉姆齐数下界的计算搜索，将九个 Ramsey 数的下界推至新高，例如 R(3,13) 60→61、R(4,16)
    170→174、R(4,19) 213→219、R(4,20) 234→237。该方法还成功恢复了所有已知精确 Ramsey 数的下界，并在众多其他情形匹配了已知最佳下界，包括此前工作未披露所用算法的一些下界。与以往几乎全部由各定制搜索算法逐一生成结果不同，AlphaEvolve
    是单一元算法，可为目标结果自动产出搜索算法。
