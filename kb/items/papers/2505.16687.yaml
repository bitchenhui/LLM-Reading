summaries:
  one_liner_zh: 提出单步扩散生成图像编解码器OneDC：超先验语义引导+语义蒸馏，达到SOTA感知质量、省39%码率且解码快20倍
  abstract_zh: 针对扩散式生成图像编解码器多步迭代采样带来的解码延迟，作者论证多步采样对生成式压缩并非必需。所提OneDC将潜在压缩模块与单步扩散生成器结合，并以超先验替代文本提示作为语义信号引导单步扩散。为增强超先验的语义能力，引入语义蒸馏机制，将预训练生成式tokenizer的知识迁移至超先验编解码模块。训练采用像素域与潜在域混合优化，兼顾重建保真度与感知真实感；实验显示OneDC以单步生成即达SOTA感知质量，相较先前多步扩散编解码器码率降低超39%、解码加速约20倍。
