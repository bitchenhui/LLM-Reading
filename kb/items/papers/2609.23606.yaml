summaries:
  one_liner_zh: 提出表面对齐纹理场 TexF 及 GPU 常驻神经压缩 3DNTC，在 MPEG/AOM 网格基准上率失真优于 UV 图集方法。
  abstract_zh: 针对传统 UV 图集接缝不连续与映射开销限制编码效率的问题，该文提出 TexF：一种表面对齐的纹理场表示，将从网格表面导出的稀疏体素用于组织纹理属性，保留局部三维相关性并支持高分辨率纹理与表面直接查询。码流压缩路径复用既有三维属性编解码器，体素位置可由解码后的网格重建，无需单独传输。GPU
    常驻压缩路径提出 3DNTC，结合量化哈希特征与轻量解码器实现表面位置的随机访问重建，并用可微渲染在图像空间细化体素属性与压缩神经场。在 MPEG 与 AOM 网格压缩基准上，码流与 GPU 常驻两种模式的平均率失真性能均优于代表性
    UV 方法，3DNTC 还支持实时渲染。
