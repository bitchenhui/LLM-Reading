summaries:
  one_liner_zh: 提出LIFE四阶段框架，统一综述LLM多智能体系统的协作、故障归因与自主自我改进及其因果依赖。
  abstract_zh: 基于LLM的自主智能体在推理、规划与工具使用上能力强，但在需要跨角色、工具与环境持续协同的任务中受限；多智能体系统以结构化协作应对，但更紧密的协作会放大错误在智能体与交互轮次间的传播，产生难以诊断且很少转化为结构性自我改进的失败。该综述指出已有工作分别覆盖单智能体能力、多智能体协作与智能体自我进化，三者间的因果依赖未被考察。作者提出LIFE四阶段统一框架：能力奠基、协作集成、故障归因、自主自我改进，为各阶段给出系统分类并形式化刻画相邻阶段间的依赖与约束关系。最后识别阶段边界处的开放挑战，提出面向闭环多智能体系统的跨阶段研究议程，使其能持续诊断失败、重组结构并改进行为。
  deep_dive: docs/auto/2605.14892.md
