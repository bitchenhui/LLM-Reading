summaries:
  one_liner_zh: 提出Safin-1.5模型，以安全架构、递归安全改进闭环与形式化推理框架实现安全与能力协同递归提升。
  abstract_zh: 递归自我改进（RSI）虽能通过 successive 更新持续提升大模型能力，但这些更新也可能引入新风险并削弱既有安全防护。作者提出'安全RSI'范式，遵循AI-45°定律，使安全能力与通用能力同步演进。Safin-1.5包含三部分：一是结合持久安全状态与危险知识解耦的安全架构，将目标危险知识迁入可移除的专家模块以最小化对通用能力的影响；二是'发现-评估-修复'递归安全改进闭环，仅接受在提升安全的同时保持通用能力并限制过度拒答的更新；三是形式化推理框架，通过证明义务引导的语义桥接，使符号求解器在形式化前提下构造可检验证明。实验结果表明Safin-1.5在安全性与推理性能上超越前沿模型。
