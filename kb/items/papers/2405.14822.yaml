summaries:
  one_liner_zh: 低分辨率扩散教师经蒸馏与渐进超分得到单步生成器，训练成本降64倍，ImageNet全分辨率SOTA
  abstract_zh: 扩散模型生成高维内容表现出色但训练计算开销大。PaGoDA 提出三阶段流水线：先在8倍降采样数据上训练扩散模型，再蒸馏预训练扩散模型得到单步生成器，最后通过渐进超分恢复高分辨率。该方案使8倍降采样数据上的扩散模型训练成本降低64倍；推理时单步采样即在
    ImageNet 64×64 至 512×512 全部分辨率及文生图任务上达到当时最优。流水线可直接作用于潜空间，在 LDM（如 Stable Diffusion）预训练自编码器之外叠加额外压缩。代码已开源。
assessment:
  relevance: medium
  decision: summary_only
  reason: 核心为低分辨率扩散蒸馏+渐进超分的单步生成管线，非编码核心域，但与编码链路超分及生成式压缩相关，按规则仅初筛摘要。
