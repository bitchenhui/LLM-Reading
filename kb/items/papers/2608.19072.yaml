summaries:
  one_liner_zh: 分析1338条后训练轨迹，发现智能体能可靠执行但锁死默认策略，缺的是重开策略的决策。
  abstract_zh: 该文将LLM智能体后训练LLM的能力拆分为执行层（在既定策略内迭代）与策略层（随实验证据积累修订策略），并分析1338条前沿智能体的后训练轨迹。结果显示智能体能可靠执行后训练，却锁入与任务无关的默认策略，相邻训练运行之间仅2.1%的策略转换真正改变策略。归因实验发现：经验只改善执行层而不改善策略层；更多推理算力主要在较易任务上带来前置收益，且只是细化而非修订已承诺策略；训练前人工审查只改变锁入哪种策略，不改变是否锁入。在同等预算下，一次中途指令比智能体自行续训最多高出17.44分。作者结论是智能体缺少的是重开已承诺策略并尝试另一策略的决策，实现RSI需要使策略修订成为显式且有奖励决策的交互协议与训练信号。
