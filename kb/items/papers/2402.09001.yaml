summaries:
  one_liner_zh: 系统评测六种视频编码格式的软硬件解码能耗与压缩效率，指出软件解码甜点为 AV1、硬件解码甜点为 HEVC。
  abstract_zh: 该综述对 AVC、VP9、HEVC、AV1、VVC、AVM 六种视频编码格式的压缩效率与解码能耗进行系统评测，评估参考与优化软件解码器实现，并分析 SIMD 指令对能耗的影响。软件解码方面，AV1
    是优化实现的甜点：相比 VP9 能耗增加 16.55%，同时码率节省 43.95%。硬件解码评测显示 AV1 相比 VP9 能耗增加 117.50%，而 HEVC 仅增加 6.06%，是硬件解码的能耗甜点。总体而言，硬件解码器的能耗不足优化软件解码器的
    9%。
