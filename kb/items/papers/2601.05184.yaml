summaries:
  one_liner_zh: 研究用户反馈驱动的LLM自消费训练循环的偏见演化，并提出基于奖励的拒绝采样缓解策略
  abstract_zh: 论文提出自消费表演性循环（SCPL）概念，刻画已部署LLM通过用户反馈影响其生成数据、进而塑造未来模型训练的动态再训练系统。在受控表演性反馈设置下，研究典型全量重训练与增量微调两种循环在三个真实任务上的偏见演化。实验发现表演性循环会加剧偏好偏见并降低群体间差异偏见。为此设计基于奖励的拒绝采样策略以缓解偏见，迈向更可信的自我改进系统。
