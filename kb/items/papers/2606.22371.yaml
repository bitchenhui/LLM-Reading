claims:
- statement: 首个低延迟、training-free、面向自回归视频扩散先验的生成式视频压缩框架：GOP 首帧用 OneDC，P 帧只传「码本原子索引 + 量化系数」引导预训练模型的少步一致性采样，完全免训练。
  evidence: docs/04_ZeroGVC.md §3, §7
  confidence: reported
- statement: 关键洞察：DDCM 式码本噪声压缩在 few-step 一致性采样中依然有效——每步选并传重注入噪声去最小化目标残差，为把新高效扩散范式引入压缩打开口子。
  evidence: docs/04_ZeroGVC.md §4
  confidence: reported
- statement: JVET Class C 上 LPIPS/DISTS/FID/DOVER 全面领先 VVC/HEVC/DCVC-FM/DCVC-RT/GLC-Video；Class B/UVG/MCL-JCV
    上 LPIPS 与 DOVER 一致最好，高分辨率高码率下优势收窄（推测 tiling 弱化生成先验）。
  evidence: docs/04_ZeroGVC.md §6.2
- statement: A800 上 training-free 达到 5-10 FPS：CF++ N=2 时编码 96 ms/帧、解码 124 ms/帧。
  metrics:
  - ref: metric:FPS
    value: 5-10
    scope: A800, CF++/CF, N∈{2,4,6}
  evidence: docs/04_ZeroGVC.md §6.3
- statement: 零码率开销的双向参考：把未来 I 帧 latent 作为额外 KV context，配合 RoPE 位置补偿缓解自回归误差累积；4 个未来参考帧是甜点。
  evidence: docs/04_ZeroGVC.md §5, §6.4
- statement: 码本大小 K=16384 恰好，更大边际收益递减且编码端内积搜索变贵；I 帧质量 λ=1.0 最好（低质量首帧会带偏整条自回归链）。
  evidence: docs/04_ZeroGVC.md §6.4
