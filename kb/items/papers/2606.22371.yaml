summaries:
  one_liner_zh: GOP 首帧用图像编码器、P 帧只传码本噪声原子索引+系数来引导预训练自回归视频扩散模型的少步一致性采样，完全免训练实现低延迟生成式视频压缩。
  abstract_zh: '把 Turbo-DDCM 的确定性码本采样扩展到 few-step consistency sampling：每步以共享种子复现高斯码本、 只编码选中原子索引与量化系数，decoder
    侧重复同样采样轨迹。配 RoPE 补偿的零开销双向参考抑制误差累积。 感知指标（LPIPS/DOVER）对 VVC/HEVC/DCVC 系/GCL-Video 一致领先，A800 上 5-10 FPS。
    意义：压缩可「免费搭车」快速迭代的预训练生成模型。

    '
