claims:
- statement: 基于码流运动矢量的帧/特征对齐可显著提升循环VSR性能，额外计算可忽略，性能可与基于光流的复杂对齐相当。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 结合码流残差信息跳过冗余像素计算，可在不损失性能的前提下大幅降低VSR计算量。
  confidence: reported
