  - name: 计算量节省
    value: 70%
    scope: 上限；REDS4测试视频经H.264编码CRF=23
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 复用码流运动矢量与残差辅助循环VSR对齐并跳过冗余计算，H.264 CRF23下最高省70%算力且性能不掉。
  abstract_zh: 针对压缩视频在线超分辨率任务，作者提出编解码信息辅助框架CIAF，用于提升并加速循环神经网络结构的VSR模型。框架首先复用码流中的运动矢量（MV）进行相邻帧的时序对齐，以可忽略的额外计算量取得与基于光流的复杂对齐相当的性能。其次进一步利用码流残差（Residuals）信息识别冗余像素并跳过其计算。在H.264编码（CRF=23）的REDS4测试视频上，框架最高可节省70%计算量且性能不下降。
