summaries:
  one_liner_zh: 基于AI眼镜52.9小时第一视角数据构建长时程记忆VQA基准，显示现有智能体系统在真实记忆任务上远不可靠
  abstract_zh: 该论文提出SuperMemory-VQA，一个用于评估AI助手在实用长时程记忆任务上的第一视角视觉问答数据集，面向AI眼镜式个性化记忆助手场景。数据来自AI眼镜录制的52.9小时日常活动，包含同步RGB视频、音频转写、眼动注视、IMU与SLAM轨迹等多模态信号。经人工核验的标注流程构建了4,853个有据可依的问答对，覆盖物体/位置记忆、意图回忆、视觉场景回忆、时间线重建、对话记忆与上下文检索六类任务。每题为选择题并含显式“不可回答”选项以测试幻觉鲁棒性；对主流智能体框架与LLM骨干的基准测试表明现有系统在真实记忆任务上远未可靠。参与者调查进一步支持这些问题贴近真实有用的日常记忆需求。
