summaries:
  one_liner_zh: NetRL 用示范轨迹 SFT 加 NetGRPO 在线强化的两阶段 LLM 框架，统一求解 ABR、负载均衡与拥塞控制等网络决策任务。
  abstract_zh: NetRL 是面向网络决策任务的两阶段 LLM 强化学习框架，先在示范轨迹上监督微调，再进行在线策略优化。统一混合嵌入接口将文本任务描述与精确数值状态结合，网络动作头输出合法决策。核心算法
    NetGRPO 在多条未来轨迹上评估候选动作，通过置信度感知预算对不确定选项投入更深搜索，并采用组相对、带裁剪与 KL 正则的更新。实验中 NetRL 较 NetLLM 提升 23.6% QoE，较
    Genet 降低 12.2% 作业完成时间，较 Orca 提升 24.1% 网络效用；置信度感知预算在验证 QoE 不降的前提下将端到端训练时间减少 27.1%。
