summaries:
  one_liner_zh: 提出 CSRO 框架，用 LLM 直接生成代码形式的最优响应策略，替代 PSRO 中的黑盒 RL 预言机，产出可解释且性能相当的多智能体策略
  abstract_zh: 针对 PSRO 等多智能体强化学习方法依赖黑盒深度 RL 预言机、策略难以解释信任与调试的问题，论文提出 CSRO 框架，将最优响应计算重构为代码生成任务，让 LLM 直接生成人类可读的策略代码。作者探索了三种构建与增强
    LLM oracle 的途径：零样本提示、迭代细化以及 AlphaEvolve 分布式 LLM 进化系统。实验显示 CSRO 在性能上与基线相当，同时产出多样化、可解释的策略，将多智能体学习的焦点从优化不透明策略参数转向合成可解释的算法行为。
