summaries:
  one_liner_zh: 提出ActiveGraph运行时，以事件日志为唯一事实来源，实现确定性重放、廉价分叉与全链路因果谱系。
  abstract_zh: 论文指出主流智能体框架以语言模型对话回路为中心，日志与记忆只是事后附加层。ActiveGraph 反转这一结构：append-only 事件日志是唯一事实来源，工作图是该日志的确定性投影，行为（普通函数、类、LLM
    例程或挂在类型化边上的逻辑）响应图变化并发出新事件，组件间协调完全经由共享图完成。该设计带来三个检索-摘要式记忆系统不具备的性质：任意运行的确定性重放、在任意事件处廉价分叉（无需重执行共享前缀）、以及从高层目标到每次模型调用的端到端谱系。文中给出使重放成立的确定性契约，并以一个尽职调查示例展示完整因果结构可仅凭日志重构。作者讨论（明确声明未演示）该基底为何特别适合自改进智能体，并说明其与
    BabyAGI 谱系及图记忆研究的延续关系。
