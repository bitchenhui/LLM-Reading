summaries:
  one_liner_zh: 将 3DGS 场景映射到 MoQ 传输层次，以空间轨道与渐进质量子组配独立 QUIC 流，消除队头阻塞并支持 6-DoF 自适应请求
  abstract_zh: 3DGS 可实现逼真的新视角合成，但吉字节量级的场景数据传输对沉浸式应用构成挑战；传统基于 TCP 的 HTTP 自适应流媒体存在队头（HOL）阻塞，且粗粒度分段不适合 3DGS
    的细粒度分发。MoQSplat 将 3DGS 内容映射到 Media over QUIC 传输层次：场景划分为空间轨道（Tracks），高斯泼溅聚类为语义连贯的组（Groups），并构建渐进质量子组（Subgroups）映射到相互独立的
    QUIC 流以消除连接级队头阻塞。系统采用无状态、订阅者驱动的自适应闭环，客户端依据 6-DoF 视锥可见性、距离与注视点对齐动态请求空间区域与质量层级。原型实现的核心组件评估表明，面向渐进式传输，基于不透明度的剪枝优于基于尺度的剪枝；源代码已开源。
  deep_dive: docs/auto/2609.18624.md
