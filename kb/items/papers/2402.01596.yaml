summaries:
  one_liner_zh: 将INR视频编码器HiNeRV扩展至多视点沉浸式视频，在MPEG MIV CTC下相对TMIV最高节省72.33%码率
  abstract_zh: 该文提出MV-HiNeRV，首次将隐式神经表示（INR）视频编码器扩展到沉浸式（多视点）视频，是对单视点SOTA INR编码器HiNeRV的增强。方法上为每个视点学习一组独立特征网格，同时在所有视点间共享已学习的网络参数，从而同时利用多视点视频的时空冗余与视点间冗余。编解码器在MPEG沉浸式视频（MIV）通用测试条件下压缩多视点纹理与深度视频序列，并与使用VVenC的MIV测试模型TMIV对比。结果显示MV-HiNeRV相对TMIV取得高达72.33%的显著编码增益，实现已开源供进一步开发与评估。
