summaries:
  one_liner_zh: SIMIT 在测试时让 VLM 自造训练数据实现自我改进，17 个基准上平均相对提升约 7%。
  abstract_zh: SIMIT 是一个测试时自我改进框架：视觉语言模型在回答无标注测试问题前，先自行生成与该问题相关的训练数据。其核心是'先指定答案、再生成图像'的合成方式，构造（问题、答案、图像）三元组，并结合原生图像生成与面向文档、图表、示意图等结构化视觉的可扩展技能库。流水线引入多阶段验证检查图像是否支持指定答案，用难度过滤保留有信息量的样本，并通过自适应预算对模型不自信的查询分配更多练习资源。生成的数据既可做上下文内改进（SIMIT-ICL），也可做权重内微调（SIMIT-FT）。在
    17 个多样化基准上超越现有自我改进方法：最佳配置较 BAGEL-7B 平均相对提升 +7.20%，免训练的 SIMIT-ICL 提升 +6.98%。
