summaries:
  one_liner_zh: 提出参考约束+策略内自蒸馏的递归超分框架OracleZoom，七数据集SOTA并显著减少幻觉。
  abstract_zh: 论文研究递归超分辨率（Recursive SR），通过反复将预测结果回送至同一模型实现极限放大，但深层预测缺乏真值监督。OracleZoom采用受策略内自蒸馏启发的参考约束框架，在训练自身轨迹的同时将最后一个真值证据携带到监督边界之外，以直接与跨尺度监督约束可验证内容，用无参考质量目标引导细尺度细节，并用KL约束的预训练隐空间先验和EMA一致性抑制质量漂移与稳定监督边界。在七个数据集上，OracleZoom在各放大尺度上取得SOTA超分质量，平均CLIPIQA达0.713，且在更深层尺度上增益更大，同时显著减少幻觉。代码、数据与模型已开源。
