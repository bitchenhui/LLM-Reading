summaries:
  one_liner_zh: 评估参考标准的选择会显著改变胸片模型性能估计与排名，SSIM/PSNR常与专家诊断可用性判断不一致。
  abstract_zh: 该论文系统研究评估参考标准的选择如何影响胸片机器学习的性能评估与模型排名。作者在剑桥大学医院（CUH）临床队列中收集了胸部病灶的成对专家图像标注与报告衍生标注，并整理了MIMIC-CXR的子集及专家对诊断图像质量的评分。结果显示，对监督分类器（ResNet、DenseNet）及零样本/微调视觉-语言模型（如MedKLIP、GLoRIA、ConVIRT），仅更换标签来源就会带来性能估计和模型排名的显著差异。同时，IQA度量与专家判断的一致性高度依赖度量选择，常用的SSIM和PSNR往往无法对应专家对诊断可用性的评估。作者据此主张评估参考的选择应被视为临床有效性的核心组成部分，需结合病灶、成像任务与下游临床用途加以论证。
