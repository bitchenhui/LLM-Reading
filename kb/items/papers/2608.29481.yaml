summaries:
  one_liner_zh: 提出儿科重症沟通训练首个基准套件与自改进LLM模拟框架SIC-Agents，优于静态专家提示
  abstract_zh: 儿科重症疾病沟通（SIC）训练缺乏可扩展方案，且较一般对话模拟面临多方交互、应对家长强烈情绪及依赖反馈动态等额外挑战。作者与教育者和儿科临床医生合作，提出首个面向儿科SIC训练的基准套件PitfallBench与DialogueBench，分别在回合级与整段对话层面评估模拟器。进一步提出自改进框架SIC-Agents，通过生成临床医生可编辑的技能文档引导模拟器的课程依赖行为。实验表明SIC-Agents优于静态专家提示，基准已开源。
