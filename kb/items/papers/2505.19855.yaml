summaries:
  one_liner_zh: 将LLM遗忘视为把知识编辑为拒绝/空集响应的特殊编辑任务，验证WISE、AlphaEdit等编辑方法可作为有效遗忘基线并提出self-improvement与query merging实用配方。
  abstract_zh: LLM遗忘旨在从模型中选择性移除信息，而知识编辑旨在修改模型知识；本文将遗忘概念化为一种特殊编辑——把目标信息改为拒绝或"空集∅"响应。作者在预训练与微调知识上，将ROME、MEMIT、GRACE、WISE、AlphaEdit等SOTA编辑方法与现有遗忘方法进行对比评测。结果显示WISE与AlphaEdit等方法可作为有效遗忘基线，尤其对预训练知识表现突出，且能生成与人类预期一致的拒绝式回答。为适配编辑方法用于遗忘场景，论文提出self-improvement（利用LLM自身上下文学习能力构造更符合人类预期的遗忘目标）与query
    merging（使ROME和MEMIT胜任较长样本序列的遗忘）两个实用方案。作者建议遗忘研究社区采用SOTA编辑方法作为基线，并从编辑视角研究LLM记忆控制。
