summaries:
  one_liner_zh: MLIC 系列升级版通过 MetaFormer 式轻量变换、超先验引导全局相关预测与通道重加权，BD-rate 较 VTM-17.0 Intra 降低 16%-24%。
  abstract_zh: 针对现有 MLIC 系列高码率性能退化、初始切片熵建模缺乏全局相关、缺少自适应通道重要性建模等局限，提出 MLICv2 与 MLICv2+。方法上引入受 MetaFormer
    启发的轻量 token mixing 模块增强变换容量，提出超先验引导的全局相关预测以在潜表示初始切片中提取全局上下文，并辅以通道重加权模块动态突出信息量大的通道；进一步探索增强位置嵌入、引导选择性压缩以及随机
    Gumbel 退火（SGA）的实例级优化。实验表明 MLICv2 与 MLICv2+ 相比 VTM-17.0 Intra 分别在 Kodak、Tecnick、CLIC Pro Val 上取得 16.54%/21.61%/16.05%
    与 20.46%/24.35%/19.14% 的 BD-rate 节省，达到 SOTA。
