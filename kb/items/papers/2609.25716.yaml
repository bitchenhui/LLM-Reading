summaries:
  one_liner_zh: 利用扩散模型生成分叉时刻自动生成无人工标注的逐点感知距离标签，训练参考型IQA度量。
  abstract_zh: 针对参考型图像质量评估（IQA）依赖昂贵且带噪的MOS人工标注、而2AFC成对标签仅有相对比较信息的问题，论文提出全自动数据生成管线。方法利用扩散模型生成动态：粗结构在早期时间步生成、细节在后期生成，故生成轨迹分叉越早的图像对感知距离越大。以该分叉时刻（FoMo）作为有参考锚定的逐点感知距离标签，监督训练参考型IQA度量，使任意图像对间可通用比较并支持信息更丰富的训练目标。多骨干架构的实验表明，所训度量在多个基准上优于基于人工标注数据训练的度量。
