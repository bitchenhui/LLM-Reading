summaries:
  one_liner_zh: 提出ExtFoamBench基准与EasyFoam框架，将CFD专业知识外化为可复用技能，经执行-演化双环实现自改进的OpenFOAM智能体。
  abstract_zh: 现有LLM智能体自动化OpenFOAM工作流的评估多停留在教程级案例与执行导向指标，掩盖了可执行性-可接受性差距：成功运行的仿真常不满足预设的数值或感兴趣量（QoI）标准，且领域知识与特定智能体架构紧耦合难以复用。论文提出覆盖五类工作流变化维度的ExtFoamBench基准，分别评估执行完成度、数值合理性与QoI满足度。同时提出EasyFoam框架，将CFD专业知识解耦为模块化、外置的技能，由双环机制驱动：执行环依据显式任务需求构建工作流，用结构化仿真证据诊断失败并定向修复；演化环通过配对评估筛选技能更新，将任务经验蒸馏为可复用技能。实验显示EasyFoam的任务接受率显著高于基线智能体，为自我改进CFD智能体研究提供起点。
