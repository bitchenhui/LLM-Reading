summaries:
  one_liner_zh: NTIRE 2022 挑战赛综述：发布 LDV 2.0 数据集（335 段视频），设 HEVC 压缩视频质量增强与 x2/x4 超分增强三赛道，测试阶段共 28 支队伍提交结果
  abstract_zh: 本文回顾 NTIRE 2022 压缩视频超分辨率与质量增强挑战赛，并发布 LDV 2.0 数据集，包含原有 LDV 数据集的 240 段视频及新增的 95 段视频。挑战赛设三个赛道：赛道
    1 针对固定 QP 下 HEVC 压缩视频的质量增强；赛道 2 和赛道 3 同时面向 HEVC 压缩视频的超分辨率与质量增强，分别要求 x2 和 x4 倍超分。三个赛道共吸引超过 600 次注册，测试阶段分别有
    8、8、12 支队伍向赛道 1、2、3 提交了最终结果。参赛方法与方案刻画了压缩视频超分与质量增强的技术前沿，LDV 2.0 数据集与开源代码均已公开。
