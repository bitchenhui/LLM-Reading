summaries:
  one_liner_zh: 用LLM生成字幕、文生图模型在嵌入空间合成图像，构造合成图文对训练VLM，性能可比人工标注数据且更省数据
  abstract_zh: 针对高质量人工标注图文数据瓶颈，该方法先用LLM生成字幕，再用预训练文生图模型从字幕合成图像嵌入，构建合成图文对用于VLM微调。由于图像生成器能创造新的组合，合成嵌入可超越原始数据集的覆盖范围。实验表明，仅在合成数据上微调的VLM可达到与纯人工标注数据训练相当的下游性能，且所需数据量显著更少；对字幕的分析显示语义多样性与平衡性是关键因素。在图像嵌入空间合成比在像素空间合成快25%，作者认为该工作为自改进多模态模型开辟了方向。
