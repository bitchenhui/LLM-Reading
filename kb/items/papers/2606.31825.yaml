summaries:
  one_liner_zh: 提出步骤级过程奖励的RL算法MRPO，切断早期推理失败引发的级联错误，提升医学多模态VQA准确率。
  abstract_zh: 现有医学多模态大模型后训练以结果为中心，依赖最终答案正确性，信用分配稀疏，早期推理失败会级联导致错误预测。作者提出MRPO（Medical Reasoning-aware Policy
    Optimization），当最终答案错误时对早期无效推理步骤中的token施加指数级放大的惩罚，在不破坏成功路径的前提下切断失败级联。在四个多模态LLM骨干上，MRPO持续优于标准GRPO和近期RL基线；在Qwen3-VL-8B-Thinking上比体量大得多的医学模型HuatuoGPT-Vision-34B高出4.59分。MRPO还将早期推理失败率从58.6%降至13.4%，表明针对性缓解级联失败可同时提升推理质量与最终准确率。
