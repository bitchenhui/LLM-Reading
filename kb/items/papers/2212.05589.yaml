- statement: 以共享网络跨立方体（单帧或多帧）复用参数、仅传输逐块潜码的表示方式可利用点云的空间与时间冗余。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在损失函数中同时考虑网络参数与潜码的熵以及原始与重建立方体间的失真，可得到率失真最优的点云几何表示。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 将空间分块并用共享网络加逐块潜码表示点云几何，经率失真优化后超越八叉树G-PCC。
  abstract_zh: 针对动态点云稀疏性多样、维度高、时域变化大导致的压缩难题，论文将空间划分为小立方体，用共享神经网络与逐块潜码表示每个非空立方体的几何。网络在单帧或多帧的所有立方体间共享，以利用空间与时间冗余；通过对网络参数与潜码的熵及重建失真建模，得到率失真（R-D）最优表示。实验表明该编码方案的R-D性能优于基于八叉树的G-PCC，尤其在多帧点云视频上优势明显，代码已开源。
