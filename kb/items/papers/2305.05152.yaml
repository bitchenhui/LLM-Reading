summaries:
  one_liner_zh: 提出VoxTracer框架，将源说话人身份不可感知地嵌入语音转换输出，抵御常见有损音频压缩仍可近乎100%溯源。
  abstract_zh: 论文首次研究语音转换（VC）生成语音的说话人溯源问题，提出可溯源VC框架VoxTracer，其范式类似但超越音频水印。方法上以唯一说话人嵌入表示身份，设计VAE-Glow结构，在隐藏过程将源说话人身份不可感知地融入VC语音，追踪过程可在严重语音质量退化下准确恢复源说话人身份甚至源语音，并采用异步训练策略应对隐藏与追踪过程间的语音失配。框架可通用于任意VC方法和主流音频编码标准。实验表明VoxTracer在隐藏端具有高不可感知性，并在AAC、MP3、Opus、SILK等多种有损压缩下、16-128
    kbps宽码率范围内实现近乎100%的溯源准确率，即使语音时长仅0.74秒。
