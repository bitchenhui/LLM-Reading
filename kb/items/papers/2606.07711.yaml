summaries:
  one_liner_zh: 提出以记忆为中心的跨LLM适配范式，联合训练写入/读取两侧算子，使一个模型写入的记忆可被其他模型高效复用。
  abstract_zh: 记忆是把无状态LLM转变为具备经验积累、长程规划与持续自我改进能力的智能体的关键组件，但现有记忆系统多围绕特定主干模型设计，而用户实际常在不同LLM间切换或在单任务内混用多个模型，导致上游写入的记忆需被下游消费。该工作将视角从'以LLM为中心的记忆设计'转向'以记忆为中心的LLM适配'，从写入与读取两侧设计两个档案条件化算子并联合训练，优化记忆的存储与呈现方式以提升任务完成度。为保证算子在广泛LLM集合上泛化，提出最小增益采样课程，训练时优先覆盖被服务最少的LLM；并设计性能差距奖励，通过与朴素记忆基线对比来衡量算子本身贡献而非LLM自身能力。在HotpotQA、2WikiMultihopQA与MuSiQue上持续超越基线，并在未见模型替换场景下保持稳健。
