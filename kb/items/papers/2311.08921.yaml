summaries:
  one_liner_zh: 免训练自改进框架：LLM 自一致性自标注、可靠标注筛选与上下文学习检索，提升零样本 NER 性能。
  abstract_zh: 该工作提出一个免训练的自改进框架，利用无标注语料激发 LLM 的自学习能力，以推进零样本命名实体识别的性能边界。方法分三步：先用 LLM 通过自一致性在无标注语料上预测，得到自标注数据集；再探索多种策略从中筛选可靠标注，构建可靠自标注数据集；最后对每个测试输入从可靠数据集检索示例并通过上下文学习完成推理。在四个基准上取得显著性能提升。实验分析表明，增大无标注语料规模或增加自改进迭代次数并不保证进一步提升，性能提升更依赖于更先进的可靠标注选择策略。
