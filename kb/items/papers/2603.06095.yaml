summaries:
  one_liner_zh: 提出PIC框架，将静态场景短期时变重释为正向激励噪声以微调NVC，在0.009%压缩率下实现视觉无损重构。
  abstract_zh: 针对监控、视频通话等静态场景视频，传统编码器时间冗余利用不足、神经视频压缩（NVC）又存在训练-测试分布鸿沟，而生成式压缩会引入不可接受的幻觉细节。论文提出正向激励相机（PIC）框架，将短期时变内容重新解释为正向激励噪声用于NVC模型微调，把瞬态变化与持久背景解耦，使结构化先验内化到压缩模型中。推理时仅不变分量需少量信令，在保持像素级保真的同时大幅降低传输数据量。实验表明PIC在0.009%的极低压缩率下对静态场景实现视觉无损重构，而DCVC-FM基线需要高20.5%的Bjøntegaard
    delta码率。该方法以算力换带宽，适用于恶劣网络下的鲁棒传输和监控 footage 的长期经济存储。
  deep_dive: docs/auto/2603.06095.md
