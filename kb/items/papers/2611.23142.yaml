summaries:
  one_liner_zh: 部署多智能体系统TriAgent，从工单与代码-文档差异中持续发现并修复文档缺口，构成可度量的自改进闭环。
  abstract_zh: 该论文部署了一套围绕分流智能体TriAgent构建的多智能体系统，持续从已解决的支持工单与代码-文档不一致中提取信号，识别并修复文档漂移。在43天影子模式运行中，系统分流499张工单并发现92处文档缺口。由独立模型家族的LLM评审团评估，TriAgent可验证论断正确率81.1%（245/302），在长度可比的对比中70.5%的评审偏好其回答，优于人类工程师的23.2%。修复文档缺口后，代理重答同一工单时，盲评在71.4%的情况下（n=35）偏好修复后的回答，人类盲审亦证实该自改进机制有效。
