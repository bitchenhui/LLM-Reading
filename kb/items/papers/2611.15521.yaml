summaries:
  one_liner_zh: 提出10万+工具规模的去中心化多智能体协作基准，并给出自改进路由基线GraphHarness，大幅提升成功率并降本。
  abstract_zh: 针对集中式多智能体系统依赖全局编排器带来的可扩展性与隐私问题，论文研究图约束通信下的去中心化协作：每个智能体仅观测局部状态、只与邻居交互，需主动发现非本地工具与技能等资源。作者构建了含10万+工具的可扩展分布式工具调用基准，实验表明最新LLM智能体难以发现非本地相关资源并协作，标准强化学习也无法可靠克服该局限。随后提出基线GraphHarness，结合拓扑感知预热与自改进的LLM路由，任务成功率较基线提升48.5，协作质量提升30.6，同时成本降低34.0。
