summaries:
  one_liner_zh: 将稀疏视角3DGS重构重构为少样本学习问题，用监督增强与训练正则化双策略抑制过拟合，获SIGGRAPH Asia 2025挑战赛稀疏视角赛道第一。
  abstract_zh: 论文提出从少样本学习的新视角统一看待稀疏视角3D高斯泼溅（3DGS）的过拟合与几何退化问题，将每个高斯基元视为神经元并借用深度学习正则化技术。方法包含两条策略：一是数据相关监督增强，通过光流引导的伪视角合成与相机-场景联合优化从稀缺观测中生成更有效监督；二是训练期正则化，采用运动感知dropout与早停在抑制过拟合的同时保持动态场景稳定性。在SIGGRAPH
    Asia 2025体积视频挑战赛稀疏视角数据集上，该方法显著优于SOTA优化式与前馈式基线，系统获得该挑战赛稀疏视角赛道第一名。
  deep_dive: docs/auto/2610.25887.md
