summaries:
  one_liner_zh: 分层离散视频压缩中，码本容量K而非空间分辨率主导LPIPS感知质量，可简化多分辨率部署。
  abstract_zh: 论文以MS-VQ-VAE分层离散视频编码器为对象，在UCF101上系统扫描码本大小K∈{128,256,512,1024}与分辨率64×64至256×256共12个工作点，考察感知质量对二者的敏感性。对LPIPS拟合对数线性模型Q(K,r)=α·log2K+β·log2r+γ，得到α=-0.0094（显著）而β=-0.0009（不显著），表明码本容量每增加一个对数单位的影响约为分辨率的10倍。同时底层熵效率η=H(z)/log2K随分辨率从84-87%升至92-94%，说明更大的空间网格被更充分利用而非浪费。在同等或更低码率下，模型在LPIPS上全面超越H.264（128×128增益25-52%）并在256×256超过H.265（增益21-37%），提示K是分层离散视频编码器的主导设计变量，有助于免重训的多分辨率部署与生成式视频模型的可扩展离散分词器设计。
  deep_dive: docs/auto/2607.23366.md
