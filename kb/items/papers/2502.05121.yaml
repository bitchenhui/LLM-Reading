summaries:
  one_liner_zh: 用 FunSearch 与强类型遗传编程自动搜索分部积分约化启发式，复现最优策略并小幅超越。
  abstract_zh: 分部积分（IBP）约化是理论粒子物理与引力波计算中的常见瓶颈，其性能高度依赖选择 IBP 恒等式的启发式规则。作者采用基于大语言模型代码生成的遗传编程变体 FunSearch
    探索候选启发式，再用强类型遗传编程聚焦收敛到有效解。两种方法都重新发现了近期并入 IBP 求解器的最先进启发式策略；在一个算例中还取得了对该最优方法的小幅改进。
