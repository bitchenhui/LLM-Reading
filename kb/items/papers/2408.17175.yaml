summaries:
  one_liner_zh: 提出X-Codec，在RVQ前注入预训练语义特征、RVQ后加语义重建损失，提升编解码器语义能力并显著降低语音合成WER。
  abstract_zh: 现有音频语言模型普遍沿用为音频压缩设计的声学编解码器（如EnCodec）进行音频令牌化，语义保持能力不足，导致VALL-E等模型在声学令牌生成中出现词跳过、内容错误与WER升高。论文提出X-Codec：在残差向量量化（RVQ）之前引入预训练语义编码器的语义特征，并在RVQ之后增加语义重建损失，增强编解码器的语义表征能力。在文本到语音任务中，该方法显著降低了合成语音的词错误率（WER）。收益还扩展到音乐续写与文本到音效等非语音生成任务，证明注入语义信息可整体提升语言模型的音频生成表现。代码与演示已开源。
  deep_dive: docs/auto/2408.17175.md
