claims:
- statement: 为音频压缩设计的声学编解码器（如EnCodec）用于音频语言模型令牌化时存在语义缺陷，导致VALL-E类模型声学令牌生成出现词跳过与词错误率升高。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: X-Codec在RVQ量化前引入预训练语义编码器特征、RVQ后增加语义重建损失，可显著降低语音合成任务的词错误率（WER）。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 语义增强的收益可从语音扩展到音乐续写与文本到音效等非语音音频生成任务，整体提升语言模型生成性能。
  confidence: reported
