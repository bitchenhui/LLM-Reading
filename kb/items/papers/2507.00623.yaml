summaries:
  one_liner_zh: 集成 GStreamer/FFmpeg 与渲染引擎构建 XR 远程渲染测试床，在 WiFi/5G 下对比 WebRTC、DASH 与 QUIC 类协议性能。
  abstract_zh: XR 应用日益复杂，轻量终端缺乏足够算力与带宽，远程渲染通过将渲染任务卸载到配备强大 GPU 的远程节点、再把画面流送回终端来缓解该问题。该工作将两大主流多媒体框架 GStreamer
    与 FFmpeg 与渲染引擎集成为远程渲染器（Remote Renderer）。系统经 WiFi 或 5G 网络分别以 WebRTC（附带交互数据通道）、DASH（更利于扩展）以及新兴的基于 QUIC
    的协议向终端交付渲染内容，并对比各框架-协议组合的性能。作者称该方案构成一个超越现有水平的测试床，可用于 XR 领域的前沿研究。
