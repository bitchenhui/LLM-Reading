summaries:
  one_liner_zh: 提出Combee框架，借助并行扫描、增强洗牌与动态批控实现高并行度提示学习，自我改进智能体提速最多17倍且不损精度。
  abstract_zh: 现有提示学习方法（如ACE、GEPA）多为单智能体或低并行度设定，难以高效利用大规模并行智能体运行轨迹，且在高并行度下出现学习质量退化。Combee提出一种可扩展的并行提示学习框架，利用并行扫描与增强洗牌机制聚合多个智能体的轨迹进行学习，并引入动态批大小控制器在质量与延迟间权衡。在AppWorld、Terminal-Bench、Formula与FiNER上的评估显示，Combee相对既有方法最多取得17倍加速，精度相当或更好，总成本持平。
