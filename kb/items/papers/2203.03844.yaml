summaries:
  one_liner_zh: 提出动态双可训练边界量化器DDTB，化解超分网络2/3比特量化中对称量化器与激活分布不对称的矛盾，显著提升超低精度性能。
  abstract_zh: 轻量级超分辨率模型广泛服务于移动设备，但现有网络量化方法在2比特、3比特等超低精度下性能严重退化。作者指出退化根源在于层级对称量化器与超分模型高度不对称激活分布之间的矛盾，导致量化层级浪费或重建图像细节丢失。为此提出DDTB激活量化器：一是带可训练上下界的层级量化器以适应不对称激活，二是动态门控控制器在运行时自适应调整上下界以应对不同样本间激活范围的剧烈变化。为控制额外开销，门控控制器本身量化为2比特，并按动态强度仅部署在超分网络的部分层。实验显示DDTB在超低精度下提升显著，例如对EDSR做2比特量化并在Urban100上4倍放大输出时PSNR提升0.70dB。
