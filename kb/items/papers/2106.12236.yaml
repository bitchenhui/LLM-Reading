summaries:
  one_liner_zh: 提出基于法向量夹角的帧内预测优化G-PCC预测子选择，LiDAR点云无损属性编码平均增益2.1%
  abstract_zh: 针对MPEG G-PCC中属性压缩帧内预测仅依赖距离相似性的不足，论文提出引入点云法向量的帧内预测方案。方法利用法向量之间的夹角进一步挖掘精确的局部相似性，从而优化预测子的选择。作者将该方法实现进G-PCC参考软件中。在LiDAR采集的数据集上的实验表明，相较G-PCC锚点，无损属性编码平均可获得2.1%的压缩增益。
