summaries:
  one_liner_zh: 两项预注册重执行研究显示编码智能体评估判定总体稳定，但评分器带来的策略风险仍未解决。
  abstract_zh: 论文通过两项预注册的重执行研究检验可执行测试对 LLM 编码智能体补丁评分的可复现性，均得到阴性结果。SWE-bench Pro v1 的离线评分对 59 个评分配置变更后被接受的
    Go 补丁无一拒绝，探索性无加权置信上限为 4.95%，3% 的暴露补丁风险仍未解决；而以参考解依赖重建的模块缓存拒绝了四个模型自带依赖时通过的替代方案。对 Darwin Gödel Machine
    档案中 1,929 个选定的智能体版本/任务评估进行重执行，在固定搜索历史与未重跑评分的前提下，最佳智能体选择与系统变体排名保持不变。探索性的主机、镜像与适配评分器比较也保持上述结论；23 处与存档判定的不一致中有
    7 处在第二台主机上不复现，重建镜像在四 CPU 执行下改变了 16 个（0.83%）三跑多数判定。作者提供证据-论断摘要、评分器审计经验与匿名复现包，并强调结论仅限已接受补丁与固定历史决策，一般策略安全与自适应学习稳健性仍需更广泛评估。
  deep_dive: docs/auto/2610.14460.md
