summaries:
  one_liner_zh: 轻量 HiNeRV++ + 多个高分辨率 feature grid 把复杂度与质量解耦，四档（7k-360k MACs/pixel）单模型跨全码率区间，S3 与 NVRC
    相当且解码快 7.6 倍。
  abstract_zh: '把 INR 视频编码从「复杂度随码率变化」改为「固定复杂度覆盖全码率」：表达负担卸给高分辨率 grid， 网络只留 1.23M 层参数；in-parameter 编码结构
    + 随机切片采样让 100M grid 单卡可训； scale/temporal/spatial 三 prior 组成快而强的 grid 熵模型；masking 与 multi-reference
    输入是消融中最大贡献项。

    '
