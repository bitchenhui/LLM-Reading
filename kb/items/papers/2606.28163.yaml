claims:
- statement: 范式转变：把表达负担从网络卸载到高分辨率 feature grid、网络做轻——HiNeRV++ 相对 HiNeRV(S)：grid 参数 0.35M→100.06M、层参数 2.84M→1.23M，MAC/pixel
    87.3→24.8，解码 35.5→162.9 FPS，PSNR(300ep) 35.27→39.46，全面占优。
  evidence: docs/06_NVRC++.md §6, Table 3
  confidence: reported
- statement: 四档复杂度 S1-S4（7.3/25.1/92.5/357.7 kMAC/pixel）单配置覆盖全码率区间且每档复杂度固定——修复 INR 编码「模型大小随目标质量变化」的结构缺陷。
  evidence: docs/06_NVRC++.md §7
- statement: S3 性能接近 NVRC（UVG PSNR 口径 -69.23 vs -73.74）但解码快 7.6 倍（73.4 vs 9.7 FPS）；S1 仅 7.3 kMAC/pixel
    即大幅胜 x265 与 C3，MS-SSIM 口径匹敌 HM。
  metrics:
  - ref: metric:BD-Rate
    value: -69.23
    unit: '%'
    scope: S3, UVG, PSNR, vs x265 veryslow
  - ref: metric:kMAC-per-pixel
    value: 7.3
    scope: S1 档
  - ref: metric:FPS
    value: 73.4
    scope: S3 解码, UVG
  evidence: docs/06_NVRC++.md §7
- statement: In-parameter coding structure（仿 Hierarchical-B 的 grid 时间切片依赖）+ unconditional symmetric quantization
    + random slice sampling，首次让 100M+ 参数 grid 在单张 24GB 消费级 GPU 上可训（600 帧 1080p）。
  evidence: docs/06_NVRC++.md §3
  confidence: reported
- statement: 三项关键技术缺一不可（UVG 消融）：无 multi-reference 输入 +35.55%、无 feature grid masking +30.33%、退回低分辨率 grid
    +44.01%；scale/temporal/spatial 三 prior 分别值 6.12/5.13/1.42%。
  evidence: docs/06_NVRC++.md §8, Table 2
- statement: 高分辨率 grid 在低码率下反而退化（特征映射到单像素级削弱空间冗余共享），用带退火的 grid dropout（对 rate 与 distortion 同时生效）解决。
  evidence: docs/06_NVRC++.md §4
  confidence: reported
