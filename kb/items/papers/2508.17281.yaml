summaries:
  one_liner_zh: 系统综述LLM自主智能体与工具使用：架构、认知机制、68个数据集评测及自我改进等关键发现。
  abstract_zh: 该综述基于2023–2025年发表于A*/A类会议与Q1期刊的文献，围绕七个研究问题梳理大语言模型作为自主智能体与工具使用者的发展。文章将应用划分为单智能体与多智能体系统，分析架构设计原则与外部工具集成策略，并考察推理、规划与记忆等认知机制以及提示方法与微调对智能体性能的影响。作者评测了现有基准与评估协议，并对68个公开数据集进行了分析以评估LLM智能体在各类任务上的表现。综述识别出LLM可验证推理与自我改进能力、智能体个性化等关键发现，最后提出十个未来研究方向。
