claims:
- statement: 各研究社区（合成破坏基准、感知IQA、低层视觉、物理成像系统分析）依赖不兼容的分组方案与后端特定的严重度定义，导致跨数据集、退化模型与任务的结果难以比较。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 提出的双轴框架以成像管线中的主导因果来源与主导感知效应刻画每类退化，形成覆盖算法破坏、感知失真、低层成像伪影与物理性相机/系统故障的分类体系。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 用全参考IQA指标PSNR、SSIM、LPIPS量化各退化的原生严重度等级，在不修改现有实现的情况下使严重度语义可观测，并保留原生参数化。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 构建了COCO-Degradation基准，与该分类体系对齐，用于评估目标检测器在多样低层成像条件下的鲁棒性。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出因果来源×感知效应双轴的图像退化分类框架，用PSNR/SSIM/LPIPS量化严重度，并构建COCO-Degradation检测鲁棒性基准。
  abstract_zh: 论文提出一个以因果为核心的图像退化组织与解释框架：每类退化由其在成像管线中的主导因果来源与主导感知效应两个正交轴刻画，形成覆盖算法破坏、感知失真、低层成像伪影与物理性相机/系统故障的紧凑分类体系。作者不引入新退化也不重定义现有基准，而是提供解释性表征与测量层，用全参考指标PSNR、SSIM、LPIPS量化各原生严重度等级，使严重度语义可观测且保留原生参数化，从而将因果来源、感知外观、测得失真强度与下游任务影响分离。框架通过COCO-Degradation基准演示，用于评估目标检测器在多样低层成像条件下的鲁棒性，支撑更可解释、可复现的机器感知退化影响评估。
