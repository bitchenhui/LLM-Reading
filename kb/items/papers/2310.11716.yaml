summaries:
  one_liner_zh: 利用LLM自我反思与评判能力回收重构指令-响应数据，训练出的模型在多基准上优于现有数据集训练的模型。
  abstract_zh: 针对指令微调训练集中低质量数据会导致LLM输出不一致甚至误导的问题，论文提出'反思微调'（Reflection-Tuning）方法。该方法借助一个oracle大语言模型，利用其自我改进与评判能力，对原始训练数据中的指令和响应进行内省式重构与增强，实现'数据回收'。在广泛使用的评测基准上的大量实验表明，用回收数据训练的LLM在多种基准上优于用现有数据集训练的模型。
