summaries:
  one_liner_zh: 从独立解码/采样、上下文感知、模型协作三视角系统综述LLM推理时自改进技术并给出分类法。
  abstract_zh: 该综述聚焦通过增加测试时计算量来提升大语言模型推理效果的自改进技术。作者从三个视角组织现有工作：独立自改进（基于解码或采样方法的增强）、上下文感知自改进（利用额外上下文或外部数据存储）、以及模型辅助自改进（通过模型协作实现提升）。综述对近期相关研究进行了全面回顾，构建了深入的分类体系（taxonomy），并讨论了当前方法的挑战与局限。文章最后为未来研究方向提供了见解。
