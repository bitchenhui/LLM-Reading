summaries:
  one_liner_zh: 以生命周期六阶段框架梳理LLM基础理论与机制，指出合成数据自改进理论极限等前沿挑战
  abstract_zh: 该综述针对LLM实证有效但理论滞后、被当作黑箱的矛盾，提出统一的基于生命周期的分类体系，将研究图景组织为数据准备、模型准备、训练、对齐、推理与评估六个阶段。作者系统回顾了驱动LLM性能的基础理论与内部机制，包括数据配比的数学依据、不同架构的表征能力边界以及对齐算法的优化动力学。在此基础上，论文识别出关键前沿挑战：合成数据自改进的理论极限、安全保证的数学边界以及涌现智能的机理起源。该工作旨在推动LLM发展从工程启发转向有原则的科学学科。
