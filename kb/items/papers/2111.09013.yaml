summaries:
  one_liner_zh: 提出T型四格拼块像素合并方案，结合LFCR网络做传感器超分重建，PSNR较VDSR最高提升+1.92 dB。
  abstract_zh: 针对高分辨率成像传感器在低照度和高帧率下的像素合并（binning）问题，提出一种基于四格拼块（tetromino）形像素的新型合并概念，并嵌入压缩感知框架，通过计算相干性论证所用传感器布局。论文首次在文献中研究tetromino像素的重建质量，并证明仅需由四个T-tetromino构成的小重复单元即可满足需求。重建采用局部全连接重建（LFCR）网络以及两种压缩感知经典方法。LFCR配合所提tetromino布局在PSNR、SSIM与视觉质量上均优于采用VDSR的传统单图超分，PSNR最高获得+1.92
    dB增益。
