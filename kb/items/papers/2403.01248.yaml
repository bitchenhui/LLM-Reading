summaries:
  one_liner_zh: 提出LLM智能体SceneCraft，将文本转为Blender脚本生成复杂3D场景，借助函数库学习实现无需参数调优的持续自我改进。
  abstract_zh: SceneCraft是一个LLM智能体，将文本描述转换为可执行的Blender Python脚本，渲染包含多达一百个3D资产的复杂场景。系统先将场景图建模为蓝图，刻画资产间空间关系，再将关系翻译为布局数值约束并生成代码，随后利用GPT-V等视觉-语言基础模型分析渲染图像、迭代修正场景。其库学习机制将常用脚本函数编译为可复用库，在无需昂贵LLM参数调优的情况下实现持续自我改进。评估显示其在约束遵从度和人类评估上优于现有LLM智能体，并展示了从Sintel电影重建3D场景、以生成场景为控制信号引导视频生成模型的应用潜力。
