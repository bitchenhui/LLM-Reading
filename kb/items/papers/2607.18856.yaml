summaries:
  one_liner_zh: 提出DQ-CTM将连续思维机器的窗口级思考动态经低秩紧凑-稠密查询机制扩展到超分任务ThinkSR，验证多tick逐步提升重建质量。
  abstract_zh: 连续思维机器（CTM）在神经元级时间维度上演化表示，但直接用于超分辨率等稠密视觉预测存在困难，因为空间证据需在每个输出位置保持可用。论文提出DQ-CTM：窗口级思考动态为每个局部窗口生成紧凑摘要表示，再通过结构化低秩、参数高效的紧凑到稠密查询机制将其转换为窗口对齐的稠密查询，共享思考动态随思考tick逐步细化稠密表示。其超分辨率实例ThinkSR将编码特征图划分为局部视觉窗口（不做token池化），共享细化后恢复至原特征场并解码为高分辨率图像。固定四tick训练范围的初步实验显示渐进重建轨迹：PSNR-Y从T=0的28.1045
    dB升至T=4的30.2817 dB，PSNR-RGB从26.6271 dB升至28.7781 dB，平均L1误差从0.034602降至0.023545，且全部100张评测图像从T=1到T=4均有改善。
