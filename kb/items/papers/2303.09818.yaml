summaries:
  one_liner_zh: 提出面向HAS的实时盲QoE指标，融合QoS与深度特征经SVR回归，精度较主流盲指标提升0.3，计算耗时仅为播放时长60%。
  abstract_zh: HTTP自适应流媒体（HAS）通过ABR算法动态切换码率，有效的QoE指标可为ABR算法提供关键反馈，但客户端实时QoE预测需同时满足与人类视觉系统高一致、低延迟与盲评估，难以兼得。作者分析HAS系统特性，提出非均匀采样机制以降低时间复杂度。所设计的QoE指标将分辨率与重缓冲时长作为QoS特征，融合深度神经网络输出的时空特征与特定码率切换事件作为内容信息，这些奖励与惩罚特征经支持向量回归（SVR）模型回归为质量分数。实验显示该指标准确率较主流盲QoE指标提升0.3，计算时间仅为视频播放时长的60%，可为ABR算法提供实时指导并改善HAS整体性能。
