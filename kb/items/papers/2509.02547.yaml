summaries:
  one_liner_zh: 系统综述Agentic RL如何将LLM从被动序列生成器升级为自主决策智能体，给出能力与应用双维分类法及资源汇编。
  abstract_zh: 该综述提出智能体强化学习（Agentic RL）标志着相对于传统LLM强化学习（LLM RL）的范式转变，将LLM从被动的序列生成器重塑为嵌入复杂动态环境中的自主决策智能体。作者通过对比LLM
    RL退化的单步MDP与Agentic RL时序延展的部分可观测MDP（POMDP），形式化了这一概念转变。在此基础上提出双维分类法：一维围绕规划、工具使用、记忆、推理、自我改进与感知六大核心智能体能力，另一维围绕其在多任务领域的应用。核心论点是强化学习是将这些能力从静态启发式模块转化为自适应、鲁棒智能体行为的关键机制。综述综合了五百余篇近期工作，并汇编了开源环境、基准与框架的实用资源清单，以支撑可扩展通用AI智能体的后续研究。
  deep_dive: docs/auto/2509.02547.md
