summaries:
  one_liner_zh: 提出AEL双时间尺度框架，用Thompson采样与LLM反思协同演化智能体的记忆检索策略骨架。
  abstract_zh: 论文指出LLM智能体的harness通常手工设计且固定不变，导致智能体虽积累经验却不学习如何使用经验。AEL将记忆使用重铸为在线策略选择：快尺度用Thompson Sampling多臂赌博机逐回合在各记忆检索策略间选择，慢尺度用LLM反思遵循"先诊断后处方"原则，在策略池趋稳时注入新的检索策略作为新臂。在序列投资组合基准上，AEL超越十个自改进与非LLM基线，Sharpe比率较最强纯记忆变体提升27%，且为所有随机方法中方差最低；并泛化到工单路由流任务，准确率较无反思Thompson
    Sampling提升18%、较此前最佳基线提升51%。机制分析表明增益是因果的：反思恰在环境需要不同检索行为时起作用，最优策略稳定时可证明无损害亦无增益。
