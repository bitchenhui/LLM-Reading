summaries:
  one_liner_zh: 构建源自真实付费运筹项目的端到端基准 OR-License，评测 11 个前沿 LLM 智能体从原始客户材料产出可用解的能力。
  abstract_zh: 论文提出 OR-License 基准，包含 10 个工业场景、31 个实例，全部来自总额 368 万美元的真实付费运筹学咨询项目，保留原始需求、输入数据、交付格式与信息边界并去标识。引入受控客户模拟器
    ORSim 研究信息获取（只披露业务事实不提供运筹专业知识），并用隐藏评测检验可行性、以部署调整质量（DAQ）对比构建基准前已被客户接受的专家参照解。对 11 个前沿 LLM 使用编码智能体框架评测：若干模型的条件性目标质量超过专家参照，但无一在
    DAQ 上匹敌专家，最强 Claude Code 主配置严格可行性 88.39%、DAQ 0.87。轨迹分析揭示建模与实现环节的失败模式，任务均衡后的研究链完成率在可评任务上为 24%–45%，结论呼吁持续消解信息缺口、忠实问题建模与证据链式自改进以支撑可靠的长时程智能体。
assessment:
  relevance: medium
  decision: summary_only
  reason: LLM 智能体在真实运筹任务上的长时程评测基准，结论明确指向证据链式自改进，属非核心域故按基准收录摘要。
