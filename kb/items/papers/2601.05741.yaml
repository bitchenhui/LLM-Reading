summaries:
  one_liner_zh: 提出仅需单次前向传播的无训练FIQA方法，利用ViT中间块间patch嵌入演化稳定性估计人脸图像质量。
  abstract_zh: 针对人脸图像质量评估（FIQA）现有方法仅利用最后层表示、无训练方法又需多次前向或反向传播的问题，提出ViTNT-FIQA。该方法测量ViT各中间块间patch嵌入的演化稳定性：高质量人脸图像呈现稳定的特征精炼轨迹，退化图像则变换混乱；通过计算相邻transformer块L2归一化patch嵌入间的欧氏距离并聚合得到图像级质量分数。在带可控退化等级的质量标注合成数据上验证了该相关性。方法仅需单次前向传播，无需反向传播或架构修改，可直接应用于任意预训练ViT人脸识别模型；在LFW、AgeDB-30、CFP-FP、CALFW、Adience、CPLFW、XQLFW、IJB-C八个基准上取得与SOTA相当的竞争性能，同时保持计算效率。
