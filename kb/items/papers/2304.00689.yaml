summaries:
  one_liner_zh: 用YOLO-v7特征训练神经网络后处理，提升VVC压缩视频在低码率下的目标检测精度。
  abstract_zh: 针对图像编码导致画质劣化、进而降低图像识别精度的问题，论文提出对VVC编码后的视频施加神经网络后处理以恢复目标检测精度。后处理网络利用最新目标检测模型YOLO-v7的特征进行训练，使增强过程直接面向机器分析任务。通过将该方法与最新视频编码标准VVC结合，在低码率下仍可获得较高的目标检测精度。实验结果表明，所提方法与VVC的组合在以目标检测精度衡量的编码性能上优于常规VVC。
