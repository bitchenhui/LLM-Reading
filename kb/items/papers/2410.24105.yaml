summaries:
  one_liner_zh: 组合式LLM程序通过合成上下文示范实现零样本自改进的跨数据源模式匹配。
  abstract_zh: 模式匹配旨在发现不同表结构与层级的异构数据源之间的属性对应关系，是构建可互操作ML就绪数据的关键，在医疗、金融、电商等领域应用广泛。由于模式间的结构与语义异构性，已有ML自动化方法要么依赖大量标注数据，要么零样本性能不佳。Matchmaker是由候选生成、精炼与置信度打分构成的组合式语言模型程序，并通过一种新的优化方法构建合成上下文示范来引导LLM推理过程，在无需标注示范的情况下实现零样本自改进。在真实医疗模式匹配基准上，Matchmaker的性能优于已有基于ML的方法。
