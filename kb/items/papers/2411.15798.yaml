summaries:
  one_liner_zh: 用LMM提取层级时空语义描述并以文本引导条件扩散重建视频，在超低码率下显著优于VVC。
  abstract_zh: 针对传统与神经编解码器在超低码率下可控性与通用性不足的问题，提出融合多模态生成模型的可控视频压缩框架M3-CVC。该框架采用语义-运动复合策略选取关键帧以保留关键信息，并通过对话式大模型（LMM）提取层级化时空细节，构建帧间与帧内表示，同时增强编码可解释性。关键帧压缩采用文本引导的条件扩散方法实现高保真重建，解码端由LMM生成的文本描述引导扩散过程恢复原视频内容。实验结果表明，M3-CVC在超低码率场景下显著优于最新VVC标准，尤其在语义与感知保真度方面表现突出。
