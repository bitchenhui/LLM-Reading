summaries:
  one_liner_zh: 系统梳理视频编解码器比较标准指标BD方法的原理、20年演变、失效场景与正确使用建议。
  abstract_zh: BD方法自2001年提出，用于基于两条率失真（RD）曲线计算编解码器之间的码率与质量差异，最初以PSNR为失真指标。此后大量工作将BD扩展到SSIM、VMAF乃至主观MOS评分，但由于缺乏系统性文献，BD结果常被错误解读。本文提供BD方法的详细教程并给出指标可能失效的典型案例，同时梳理其20年来的演变与各类改进变体。作者在不同RD特性、多种客观与主观指标下系统评估了各类BD方法及开源实现，最终提出使用建议和面向更有效编解码器压缩效率评估工具的探索方向。
