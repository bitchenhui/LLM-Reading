summaries:
  one_liner_zh: 自改进LLM智能体借优化记忆自动优化AI加速器内核，Trainium上峰值吞吐显著提升且开源模型更省成本。
  abstract_zh: 论文提出AccelOpt，一个无需专家提供硬件专用优化知识的自改进LLM智能体系统，自主为新兴AI加速器优化内核。其通过迭代生成探索内核优化空间，并利用一个从既往慢-快内核对中提炼经验与洞见的优化记忆。作者还构建了NKIBench，一个从真实LLM工作负载中提取、复杂度各异的AWS
    Trainium加速器内核基准套件。评估表明AccelOpt能力随时间增强，将NKIBench内核的平均峰值吞吐百分比在Trainium 1上从49%提升到61%，在Trainium 2上从45%提升到59%；使用开源模型时其内核改进效果匹敌Claude
    Sonnet 4，且成本低26倍。
