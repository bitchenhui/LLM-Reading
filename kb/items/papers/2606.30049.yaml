summaries:
  one_liner_zh: 构建Unity3D海事模拟数据集MSVD，提出以目标检测精度为桥梁的去雾能见度评估指标，实现可解释的可见距离估计。
  abstract_zh: 针对PSNR、SSIM、FSIM、FADE、NIQE等常规图像质量指标无法在复原质量与实际能见度阈值之间建立物理可解释联系的问题，该工作提出面向能见度的去雾评估框架。作者用Unity3D构建海事模拟能见度数据集MSVD，提供分级能见度条件下成对的雾化/清晰图像及精确能见度标注。进一步以目标检测精度为中间指标，建立能见度距离与检测性能之间的映射，把图像复原的改进转化为可测量的能见度增益。在该基准与所提指标下评估了六种代表性去雾方法，结果显示MSVD可作为分级能见度下去雾性能的可靠基准，所提指标能给出可解释且可靠的可见距离估计，用于支撑航行安全与运营效率评估。
