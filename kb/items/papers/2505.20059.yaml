claims:
- statement: LPCM 在高码率模式下采用轻量 LSTM 预测模块（LSTM-P）捕获不同坐标间的长期几何相关性以预测并压缩仰角；在几何相关性退化的低码率模式下引入变分半径压缩（VRC）模块直接压缩点半径。
  confidence: reported
