summaries:
  one_liner_zh: 提出多尺度特征重要性驱动的端到端FCM码率分配，目标检测较ELIC锚点节省38.2%码率。
  abstract_zh: 论文发现特征对机器视觉任务的重要性随尺度、目标尺寸与图像实例变化，据此提出多尺度特征重要性预测模块（MFIP）为各尺度特征预测重要性权重。进一步建立任务损失-码率模型，刻画压缩特征导致的任务精度损失与编码码率间的关系。基于二者构建MFIBA端到端码率分配框架，按重要性更合理地为多尺度特征分配编码比特。实验表明，结合ELIC时目标检测平均节省38.202%码率，实例分割与关键点检测分别节省17.212%与36.492%；迁移到LIC-TCM基编码器在三个任务上仍节省约18%–20%码率，验证了泛化性。
