- statement: 提出将潜在扩散模型集成于FFmpeg的语义通信框架，将I帧压缩至潜在空间，在不牺牲高视觉质量的前提下显著节省存储与语义传输开销，B/P帧保留为用户端重建精化的调整元数据。
