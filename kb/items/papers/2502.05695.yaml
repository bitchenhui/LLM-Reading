summaries:
  one_liner_zh: 提出嵌入FFmpeg的语义通信框架，用潜在扩散模型压缩I帧，低带宽高QoE实现实时自适应码率视频流。
  abstract_zh: 该论文提出将潜在扩散模型（LDM）集成到FFmpeg流程中的语义通信（SemCom）框架，面向无线网络中的实时自适应码率视频流传输，以解决传统CBR/ABS的带宽占用高、存储低效与QoE劣化问题。方法将I帧压缩至潜在空间以获得显著的存储与语义传输节省，同时保留B帧与P帧作为调整元数据，支持用户端对视频重建进行高效精化。框架进一步集成最先进的去噪与视频帧插值（VFI）技术，在有噪无线通信环境中缓解语义模糊并恢复帧间时间一致性。实验结果表明该方法在优化带宽占用的同时保持高视觉质量，在QoE与资源效率上优于现有最先进方案，为5G及后5G网络的可扩展实时视频流开辟了新方向。
