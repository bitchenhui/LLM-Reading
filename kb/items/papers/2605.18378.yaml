claims:
- statement: 在AV1、HEVC、VP9、H.264四种编解码器与多种内容类型上，视频帧间时域一致性误差随压缩增强（比特率降低）呈非线性退化。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 发现'可预测性异常'：运动不可预测或不规则的内容比运动幅度更大但更可预测的内容出现不成比例的更高时域不稳定，挑战了仅由运动量决定编码难度的传统假设。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 现有以空间质量为主的客观评估不足以刻画压缩损伤，压缩流水线应引入时域感知的质量指标。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 跨多编解码器与比特率区间实证表明时域一致性随压缩非线性退化，且运动可预测性比运动量更决定失稳程度。
  abstract_zh: 该论文在多个比特率区间下，利用客观质量指标系统测量AV1、HEVC、VP9、H.264四种编解码器压缩后视频的帧间一致性误差演进，覆盖多种内容类型。结果显示时域一致性随压缩增强呈非线性退化，而非简单的线性劣化。研究识别出'可预测性异常'：动态不可预测或不规则的内容比运动幅度更大但更可预测的内容表现出不成比例的更高时域不稳定。这一发现挑战了仅由运动量决定编码难度的传统假设，并论证压缩流水线中引入时域感知质量指标的必要性。
