summaries:
  one_liner_zh: 构建PickGlass-TPI数据集，按±5%允差的任务型IQA评估纱线计数，最优方法仍偏差约25%，单张照片无法证明达标。
  abstract_zh: 论文提出PickGlass-TPI数据集（76个工厂场景、44块布样），由受过纺织训练的标注员通过pick glass人工计数作为参考，并以织物规格常用的±5%允差作为任务型图像质量判定标准。在此基准上评测了前沿与开源视觉语言模型、CNN、专用计数模型及免训练谱方法PG-Lattice，结果无一方法达到允差内：仅用合成图微调的小型开源模型Molmo2-4B误差25%，与最优前沿模型GPT-6.1-sol（直接提问27%、给定四张放大特写25%）持平，二者均优于非专业标注员（37%）。PG-Lattice在同一布样两次拍摄的复拍一致性上最常落在5%以内，但其失误常为两倍量级；且参考计数本身跨复拍的中位数差异达9%，说明单张照片无法证明±5%达标，真正重要的图像质量是跨复拍的可靠性。通用免参考质量分无法排序PG-Lattice的计数误差，生成式增强虽提升感知分数但不可靠地改善计数。
