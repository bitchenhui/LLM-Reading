summaries:
  one_liner_zh: 提出让LLM在训练中自我改进物品tokenization的即插即用方法，推荐性能平均提升8%。
  abstract_zh: 生成式推荐系统以token序列建模物品并由LLM生成推荐，但现有外部tokenization方案（文本描述、数字串或新定义的离散token）常与LLM内部预训练分词模式不一致，导致性能下降。作者提出一种自我改进的物品tokenization方法：从任意外部模型的初始tokenization出发，在训练过程中周期性地依据LLM自身学到的模式调整tokenization，使其与模型对物品的内部理解保持一致。该方法实现简单，可作为即插即用增强集成到现有生成式推荐系统。在多个数据集和多种初始tokenization策略上的实验显示，推荐性能平均提升8%。
