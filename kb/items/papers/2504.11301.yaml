summaries:
  one_liner_zh: 提出首个全自动医疗智能体架构设计框架，经分层搜索与诊断反馈驱动的自改进，在皮肤病诊断上显著提升准确率。
  abstract_zh: 针对现有医疗智能体依赖静态人工工作流、难以适配多样诊断需求的问题，论文受AutoML启发提出医疗智能体架构自动化设计框架。该框架定义分层且表达力强的智能体搜索空间，可在节点、结构与框架三个层级进行结构化修改，实现工作流动态自适应。框架将医疗智能体建模为由多种功能节点组成的图结构架构，并以诊断反馈为引导进行迭代自改进。在皮肤病诊断任务上，该方法能有效演化工作流结构并随时间显著提升诊断准确率，论文称之为首个完全自动化的医疗智能体架构设计框架。
