summaries:
  one_liner_zh: 把 transformer LIC 的 FFN 换成 Expert-Choice 路由 + GShMLP 专家，一个模型服务重建与多种机器视觉任务，重建 BD-Rate 提升 6-12%、下游任务再提 8-10%。
  abstract_zh: >
    针对 ICM 的「task-specific 参数爆炸 vs 外挂 adapter 静态计算」两难，把 MoE 内建到 LIC 主干：
    Expert-Choice Routing + 空间 TV 正则解决 dense-tokenization 下的路由散乱与负载不均，
    GShMLP 控制参数膨胀，task token 触发不同路由实现一模型多任务。
    重建与下游任务同时超过 adaptation 基线，且激活参数更少、延迟更低。
  deep_dive: docs/03_MoECodec.md
  tags: [learned-image-compression, MoE, coding-for-machines, adaptive-compute]
