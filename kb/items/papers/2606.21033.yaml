claims:
  - statement: 首次把 token 级 MoE 结构化引入 LIC：冻结主干、仅将 encoder/decoder 的 FFN 换成 MoE 层，一个模型内同时容纳重建+分类+检测+分割多目标，取代外挂 adapter 范式。
    evidence: "docs/03_MoECodec.md §2, §7"
    confidence: reported
  - statement: TIC 主干上 Kodak 重建 BD-Rate 从 26.98 降到 15.44（vs VTM-17.1, PSNR）；TinyLIC -3.42→-11.54、TCM -5.45→-11.87——主干无关的稳定增益。
    metrics:
      - {ref: metric:BD-Rate, value: 15.44, unit: "%", scope: "TIC+MoECodec, Kodak, vs VTM-17.1, PSNR"}
      - {ref: metric:BD-Rate, value: -11.54, unit: "%", scope: "TinyLIC+MoECodec, Kodak"}
      - {ref: metric:BD-Rate, value: -11.87, unit: "%", scope: "TCM+MoECodec, Kodak"}
    evidence: "docs/03_MoECodec.md §5.1"
  - statement: 下游机器任务（vs Full-Finetune 锚点）大幅超过 adaptation 基线：分类 -7.74 / 检测 -8.98 / 分割 -9.72 BD-Rate（TransTIC 分别为 +35.77/+26.09/+12.83）。
    metrics:
      - {ref: metric:BD-Rate, value: -7.74, unit: "%", scope: "ImageNet 分类, vs TransTIC +35.77"}
      - {ref: metric:BD-Rate, value: -8.98, unit: "%", scope: "COCO 检测, vs TransTIC +26.09"}
      - {ref: metric:BD-Rate, value: -9.72, unit: "%", scope: "COCO 实例分割, vs TransTIC +12.83"}
    evidence: "docs/03_MoECodec.md §5.2"
  - statement: 两个可复用组件：Expert-Choice 路由+空间 TV 正则解决盐-胡椒路由散乱（TC→EC 19.57→15.90，+TV→15.44）；GShMLP 控参数（7.17M vs FFN-ratio1 7.53M 但 BD-Rate 15.44 vs 19.07）。
    metrics:
      - {ref: metric:BD-Rate, value: 15.44, unit: "%", scope: "EC+TV+GShMLP 最终配置"}
    evidence: "docs/03_MoECodec.md §3-4"
  - statement: 相对 TIC 参数还减少 4.5%，每 token 激活参数减约 17%，端到端延迟反而快 8.4%——自适应计算没有付出推理代价。
    evidence: "docs/03_MoECodec.md §5.1"
