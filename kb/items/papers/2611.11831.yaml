summaries:
  one_liner_zh: 提出SR与压缩伪影去除的端到端联合训练框架，兼顾人眼与机器感知，显著提升压缩图像的缺陷检测精度。
  abstract_zh: 工业机器视觉中，边缘设备图像经降采样与压缩后产生分辨率损失和压缩伪影，严重损害缺陷检测等下游任务性能。该文提出端到端质量增强框架，将超分辨率（SR）与压缩伪影去除（CAR）统一联合训练，同时优化人类感知与机器感知目标，并研究固定权重与基于不确定性的动态权重损失来平衡重建质量与任务性能。在
    PCB Defect、DeepPCB 和 NEU-DET 数据集上的大量实验表明，联合训练模型总体优于独立或串联训练的 SR-CAR 流水线。在重度 JPEG 压缩下，相比串联 SR-CAR 基线，缺陷检测
    mAP@50 从 0.461 提升至 0.887，PSNR 仅轻微下降。
