summaries:
  one_liner_zh: 在真实开源5G FWA测试床上量化SISO/MIMO、调制方式与用户负载对DASH 4K视频PSNR/SSIM/VMAF质量的影响。
  abstract_zh: 论文在真实开源5G固定无线接入（FWA）测试床上开展系统性的UHD视频质量实验，考察传输模式（SISO/MIMO）、调制方式（64-QAM/256-QAM）与网络负载（1至5个用户）对吞吐量和主观感知质量的影响。方法上通过MPEG-DASH自动化推流4K视频，并计算PSNR、SSIM、VMAF等全参考客观QoE指标，实现网络性能与用户体验的帧级关联。结果表明MIMO一致性优于SISO：在5个并发用户下，MIMO+256-QAM的VMAF仍保持高于视觉无损阈值，而SISO配置出现明显质量退化。研究为空间分集与高阶调制保障FWA上可靠UHD视频交付提供了实证依据，并给出可复现的质量评估框架。
