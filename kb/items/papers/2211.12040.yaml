claims:
- statement: 作者称INRN是首个同时覆盖低层与高层视觉任务的INR研究，通过重新定义INR的概念边界使其可嵌入深层网络。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 现有INR方法存在两大问题：理论定义过窄而不适用于高层任务、对深层网络的表征能力不足。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: INRN在图像拟合（低层）与图像分类、目标检测、实例分割（高层）任务上的大量实验验证了有效性。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出隐式神经表示网络INRN，首次将INR从图像拟合等低层任务扩展到分类、检测、分割等高层视觉任务。
  abstract_zh: 隐式神经表示（INR）虽能参数化连续信号，但现有方法局限于图像/视频压缩、超分辨率、图像生成等低层任务，且定义狭窄、对深层网络表征能力不足。作者从新视角重新形式化INR定义，提出隐式神经表示网络INRN，为其基础模块设计了三种关键结构，并给出两种堆叠方式及相应损失函数。在低层任务（图像拟合）和高层视觉任务（图像分类、目标检测、实例分割）上的大量实验与分析验证了该方法的普适性和有效性。
assessment:
  relevance: medium
