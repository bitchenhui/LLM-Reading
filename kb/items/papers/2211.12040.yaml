  reason: 重新形式化INR并提出INRN，将隐式神经表示从图像拟合/压缩、超分等低层任务扩展到分类检测分割等高层任务，与INR图像/视频编码路线同源，但核心贡献是通用视觉网络而非编码方法，给summary_only。
