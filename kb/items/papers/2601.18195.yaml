summaries:
  one_liner_zh: 免训练 RAG 框架 QualiRAG 动态构建四类质量知识源，提升 LMM 的视觉质量理解与比较能力。
  abstract_zh: 视觉质量评估正从标量分数预测转向可解释的质量理解，现有方法依赖监督微调或强化学习，存在标注成本高与数据集偏差问题。QualiRAG 提出一种免训练的检索增强生成框架，将问题分解为结构化请求，动态构建视觉元数据、主体定位、全局质量摘要与局部质量描述四类互补知识源，并通过相关性感知检索实现基于证据的推理。实验表明，QualiRAG
    在视觉质量理解任务上显著超越开源通用 LMM 与经 VQA 微调的 LMM，在视觉质量比较任务上也具有竞争力，无需任何任务特定训练即展现稳健的质量评估能力。代码将开源发布。
