summaries:
  one_liner_zh: 提出双时间尺度框架，使改进流程本身（元技能）也递归进化，三基准 held-out 准确率较原始骨干最高提升 23.54 分。
  abstract_zh: 现有自改进智能体只从执行轨迹重写任务技能（做什么），而改进流程本身（如何改进）是手工固定一次的，故自我进化并不递归。MetaSkill-Evolve 引入双时间尺度框架：每个分支同时携带任务技能
    s 与分支局部元技能 m=(ψ,σ,α,π,ε)，后者参数化改进流水线中的 Analyzer、Retriever、Allocator、Proposer、Evolver 五个智能体。任务技能在快循环上进化，元技能在慢循环上用同一流水线对自身进化，无需额外模型或目标函数，五个流水线智能体共享单一冻结骨干。在
    OfficeQA、SealQA、ALFWorld 三个智能体基准上，方法优于无技能、静态技能与单层进化基线，held-out 测试准确率较原始骨干分别提升 +23.54、+16.09、+1.92
    个百分点。
