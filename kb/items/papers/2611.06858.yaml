summaries:
  one_liner_zh: 提出 CompressionBench 基准，评测编码智能体在给定存储与时间预算下自主压缩 LLM 权重的能力。
  abstract_zh: 论文将 LLM 压缩形式化为终端任务：智能体接收源检查点、存储上限、推理环境与时间预算，自行设计算法与实验，产出压缩权重及可执行推理代码，困惑度反馈引导搜索，最终由独立验证器核查。跨
    6 个智能体与 6 个模型-规模设定，36 个提交中 29 个通过验证。逐任务选取困惑度最低的智能体设计，压缩模型平均困惑度较 BF16 仅增 3.4%，下游准确率 77.33%（BF16 为 79.56%）。记录的实验显示智能体在近固定存储下
    24 次修订中 21 次降低困惑度，而完整模型级反馈推翻了 79 个先前局部排名中的 17 个，表明表示设计、实验判断与能力验证是智能体驱动压缩的核心环节。
