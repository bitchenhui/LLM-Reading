summaries:
  one_liner_zh: 从 Stable Diffusion 1.5 全管线协同蒸馏出的帕累托最优小型扩散模型家族，可在移动 NPU 上以低至 20ms 实时完成超分等图像修复。
  abstract_zh: 论文提出 NanoSD，一类从 Stable Diffusion 1.5 蒸馏而来的帕累托最优扩散基础模型家族，通过对 U-Net 与 VAE 编解码器同时进行网络手术、逐特征生成蒸馏和结构化缩放实现全管线协同设计。该方法在压缩模型的同时保留潜在流形与生成先验，产出
    130M–315M 参数、占据精度-延迟-体积前沿不同工作点的模型。作者指出仅减少参数量并不等于硬件效率提升，并分析了架构平衡、特征路由与潜空间保留对端上实际延迟的影响。作为即插即用骨干，NanoSD
    在图像超分辨率、去模糊、人脸修复与单目深度估计任务上取得先进水平，并在移动级 NPU 上实现低至 20ms 的实时推理。
