summaries:
  one_liner_zh: 提出离线微调与在线特征优化两阶段光流增强，在DCVC上平均节省12.8%码率且不增加解码复杂度。
  abstract_zh: 论文指出深度视频压缩直接复用预训练光流估计网络存在两大缺陷：光流本身编码开销过大，且在合成数据上训练的网络对真实视频泛化不足。为此提出离线与在线两阶段光流增强：离线阶段以H.266/VVC提供的运动信息为监督微调光流估计网络，使其更符合率失真权衡；在线阶段用基于梯度下降的算法对待压缩视频的光流潜在特征逐视频优化，提升适应性。在DCVC上的实验表明，两阶段增强合计平均节省12.8%码率，且不增加解码器侧的模型与计算复杂度。
