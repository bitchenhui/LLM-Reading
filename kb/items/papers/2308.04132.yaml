summaries:
  one_liner_zh: 提出 Jade，用 RLHF 与秩比较式 QoE 模型对齐用户主观评分以优化 ABR，QoE 提升 8.09%–38.13%。
  abstract_zh: 传统 QoE 驱动的 ABR 算法依赖基于 MOS 的 QoE 模型，但未考虑用户在评分尺度上的异质性，导致策略行为偏离预期。作者提出 Jade，引入带人类反馈的强化学习（RLHF），构建基于用户评分相对值（秩比较）的
    QoE 模型以刻画主观感知，并提供线性与 DNN 两种架构以兼顾精度与泛化。训练策略时进一步提出熵感知强化机制与所提 QoE 模型集成。实验表明 Jade 在画质、卡顿率等常规指标上表现良好，在不同网络条件下
    QoE 较基线提升 8.09%–38.13%，凸显用户异质性在 QoE 建模中的重要性。
