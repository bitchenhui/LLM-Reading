summaries:
  one_liner_zh: 像素级肖像保护扰动难抵御缩放等串联良性图像变换，提出免训练区域级超分净化框架TIP-RSR低成本去扰动。
  abstract_zh: 针对通过像素级保护扰动防止人像被未经授权编辑或生成说话人脸（TFG）的主动防御方法，论文指出现有鲁棒性研究多只考察单一变换，忽略了显示与传播中的串联良性操作。作者系统评估了面向GAN/扩散模型编辑及TFG的代表性通用与肖像专用防御在缩放、色彩压缩等顺序图像变换下的定性与定量表现，结果显示像素级扰动难以抵御串联变换，存在实际失效风险。为证明该漏洞可被低成本利用，提出免训练净化框架TIP-RSR，将顺序图像变换与现成区域级超分辨率恢复模型结合，在保持图像保真度的同时高效去除保护性扰动，计算量远低于基于扩散模型的净化方法。代码已开源。
