summaries:
  one_liner_zh: 提出基于SigLIP2骨干与多任务学习的LEIQ-Assessor，联合预测MOS及六个感知子属性，获QoMEX 2026挑战赛第二名。
  abstract_zh: 论文针对低照度图像增强算法（LIEA）输出中常见的噪声放大、色偏、结构损伤和过曝等失真，提出面向低照度增强图像的多维质量评估模型LEIQ-Assessor，为QoMEX 2026低照度增强图像质量评估挑战赛开发。方法以预训练的SigLIP2
    Vision Transformer为骨干，通过多任务学习同时预测总体MOS与六个感知子属性（亮度、色彩保真度、噪声水平、曝光质量、自然度、内容恢复），并以PLCC损失联合优化这些相关目标，使共享表征比单任务模型捕捉更丰富的质量特征。在MLE基准上的实验表明，LEIQ-Assessor显著优于现有无参考IQA模型与手工质量描述子，并在挑战赛中取得第二名，代码已开源。
