- statement: 能力退化与隐表示几何劣化同步出现，特征为簇内紧致度降低与簇间分离度减弱。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 提出的表示几何正则化RGR通过鼓励簇内紧凑与簇间分离来在后训练中保持表示几何，可无缝嵌入现有OPSD方法且不改变其核心优化流程。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在多种OPSD方法与多个基准上的大量实验显示，RGR总体上缓解能力退化同时保留能力提升。
  confidence: reported
