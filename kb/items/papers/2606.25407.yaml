summaries:
  one_liner_zh: 提出T2R框架，以自竞争强化的Teacher与竞争引导的Reasoner为链式推理提供比较式监督，在CXR VQA上优于强基线
  abstract_zh: 胸部X光视觉问答（CXR VQA）要求模型除给出正确答案外还需产出可靠的医学推理，但现有强化学习训练多依赖答案级奖励，对思维链（CoT）质量提升过粗，且当组级优势坍缩为零时失效。T2R框架将基于比较的监督引入CoT优化：Teacher通过自我竞争迭代强化，Reasoner则针对逐步变强的Teacher生成参考进行优化。进一步设计case-wise奖励，在原奖励信息充分时保留其正负划分，当原奖励退化时从竞争分数恢复监督。在多个CXR开放式VQA基准上，T2R持续优于强基线，表明受控的比较式监督能为推理优化提供更有效的训练信号。
