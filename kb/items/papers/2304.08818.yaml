summaries:
  one_liner_zh: 提出Video LDM，在潜空间引入时间维，将图像扩散模型扩展为高分辨率视频生成与时序一致的视频超分模型。
  abstract_zh: 该工作将潜扩散模型（LDM）范式扩展到高分辨率视频生成：先仅用图像预训练LDM，再在潜空间引入时间维并在编码图像序列（即视频）上微调，使图像生成器变为视频生成器。同样地，对扩散上采样器做时序对齐，将其改造为时间一致的视频超分辨率模型。工作聚焦驾驶数据仿真与文生视频两类应用，在512×1024的真实驾驶视频上取得SOTA；并利用时序层的可移植性，将公开的Stable
    Diffusion文生图模型升级为分辨率最高1280×2048的高效文生视频模型。时序层可泛化到不同微调的文生图LDM，据此展示了首个个性化文生视频生成结果。
