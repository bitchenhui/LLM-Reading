claims:
- statement: Gen2-IC 通过潜空间传输将预训练生成基础模型与图像压缩相连，无需辅助条件信号或任务特定骨干修改，经轻量适配（无蒸馏）即支持快速编码、一步解码与多码率。
  confidence: reported
