- statement: 在 SD-2.1、SANA-1.5、FLUX.1-dev 与 Qwen-Image-2512 四个骨干（覆盖 U-Net/Transformer 与扩散/流匹配建模式）上验证；更强先验下，Qwen
    变体在 PSNR、LPIPS、DISTS 及语义保真指标（OCR CER/WER、人脸 ROI 相似度）上于四个基准全面领先扩散式生成编解码器。
  confidence: reported
  metrics:
  - name: 码率区间
    value: <0.05 bpp
    scope: Qwen 变体相对扩散式生成编解码器取得领先的工作码率区间
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出潜空间压缩+潜空间传输两阶段框架，以通用接口复用预训练生成基础模型做图像压缩，超低码率下保真度领先。
  abstract_zh: 论文认为更强的生成先验可支撑更简的编解码接口，并通过潜空间传输将生成与压缩内在关联。Gen2-IC 分两阶段：先将干净图像潜变量映射为熵约束潜变量（Latent Compression），再基于预训练生成模型进行一次近端更新（Latent
    Transport）。方法无需辅助条件信号、无需任务特定的骨干修改，经轻量适配（无蒸馏）即可支持快速编码、一步解码与多码率。作者在 SD-2.1、SANA-1.5、FLUX.1-dev 与 Qwen-Image-2512
    四个骨干上验证，覆盖 U-Net/Transformer 架构与扩散/流匹配两类建模式。结果显示在更强先验下增益出现在低于 0.05 bpp 的区间，Qwen 变体在四个基准上于 PSNR、LPIPS、DISTS
    以及基于识别器的语义保真（OCR CER/WER、人脸 ROI 相似度）上领先扩散式生成编解码器。
