summaries:
  one_liner_zh: 提出 VPO 强化学习算法，训练 LLM 生成面向向量奖励空间不同权衡的多样解集合，提升测试时搜索与进化搜索表现。
  abstract_zh: 标准 LLM 后训练优化预设标量奖励，导致响应分布低熵、缺乏推理时搜索所需的多样性。VPO 利用实践中奖励常为向量值的特点（如代码生成中的逐测试用例正确性、多个用户画像或奖励模型），将多答案提示与集合级奖励相结合，训练
    LLM 产出针对向量奖励空间不同权衡的解集合。在四个任务上，VPO 在 pass@k、best@k 等测试时搜索指标上匹配或超过最强标量 RL 基线，且搜索预算越大优势越明显；在进化搜索中，VPO
    模型能解锁 GRPO 模型完全无法解决的问题。
