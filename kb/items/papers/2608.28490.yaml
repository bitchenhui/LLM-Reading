summaries:
  one_liner_zh: 系统综述2023-2026年LLM安全智能体的架构、应用与评估，指出现有智能体能行动但缺乏权限约束与可审计性。
  abstract_zh: 该文对2023至2026年间同行评审文献进行系统性综述，梳理LLM安全智能体的技术路径，包括架构、感知、记忆、推理与规划、动作空间、编排以及自改进，并按所服务的安全任务梳理应用，按数据集、结果与轨迹指标、安全措施和基线梳理评估协议。综述指出领域存在'智能体'术语使用不一致、应用风险差异悬殊、评估协议不可比等问题。核心发现是：现有工作已构建能够自主行动的安全智能体，但尚缺乏权限受限、行为可审计的智能体。作者还总结了当前方法、应用与评估设计的局限与挑战，并展望未来研究方向。
