summaries:
  one_liner_zh: 研究仅给定原语、资源与总体目标时，LLM 智能体能否自主构建自我改进算法。
  abstract_zh: 论文提出一种自主自我改进范式：冻结的 LLM 智能体在游戏玩法测试床中，仅获得计算预算、收集经验与更新文本文档的工具，以及一个总体的自我改进目标，不被强加外部训练循环，也不接触真实世界数据。实验发现足够强的模型确实能在这些条件下自我改进，其策略与经典自我调节学习认知框架及机器学习中自生成课程的概念相吻合。作者进一步研究学到的文本制品能否迁移到外部基准，观察到在不同游戏时域、游戏机制与
    3D 导航任务上均有提升。
