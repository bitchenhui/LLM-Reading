summaries:
  one_liner_zh: 提出基于AlphaEvolve的LLM进化循环，自动优化人格生成器代码，合成覆盖长尾多样性的合成人格群体。
  abstract_zh: 评估与人类交互的AI系统需要覆盖多样化用户群体，但采集代表性真人数据成本高昂。作者提出人格生成器（Persona Generators），即可针对任意上下文产出多样化合成人格群体的函数，强调支撑覆盖（覆盖可能空间）而非仅做密度匹配。方法上应用基于AlphaEvolve的迭代改进循环，以LLM作为变异算子，在数百次迭代中自动进化人格生成器代码。进化所得的轻量级生成器可将简短描述自动扩展为沿相关多样性维度最大化观点与偏好覆盖的人格群体。在六个多样性指标上，进化后的生成器在留出上下文中显著优于现有基线，能生成标准LLM输出难以达到的稀有特质组合。
