summaries:
  one_liner_zh: PACE：免训练多智能体框架，以可验证VQA探针构建开放式IQA评估协议，将整体偏置率从44.4%降至8.6%。
  abstract_zh: 生成式模型将图像质量评估扩展到物理合理性与文字渲染正确性等新维度，但现有 IQA 模型依赖固定定义与重度监督，难以扩展到开放式感知维度。论文指出整体偏置（holistic bias）是关键局限：模型评分未见维度时复用通用质量先验，导致评分错误与排序颠倒。为此提出
    PACE（Perceptual Agentic Collaborative Evolution），一个免训练多智能体框架，将开放式 IQA 形式化为显式协议构建，由协作智能体构造由可验证 VQA
    探针组成的评估协议，使评估基于具体视觉证据而非整体印象。协议仅用每维度 4 张人工标注图像校准，并以双轨评分机制对齐模型感知与人类评分尺度。在传统 IQA、结构保真度、上下文感知美学及新定义的开放式维度上，PACE
    持续提升其 MLLM 骨干，将整体覆盖率（HOR）从 44.4% 降至 8.6%。
