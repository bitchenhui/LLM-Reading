summaries:
  one_liner_zh: 在hls.js上叠加临时层，跳转后按折扣带宽估计设置码率上限，加速恢复并减少播放中断。
  abstract_zh: 无缓冲跳转后ABR播放器前向缓冲极少，控制器却可能保留旧带宽估计，导致首请求昂贵、后续请求易中断播放。论文提出IAR，作为hls.js ABR控制器之上的临时层：跳转后对继承估计打折扣（γ=0.15）设置表示上限，直至重建8秒前向缓冲，期间正常自适应在上限之下运行。200次配对实验（4种网络、10个跳转位置、5种策略）显示，保守首请求相对标准hls.js将恢复延迟的配对中位数降低2.008秒；恢复期维持低上限在更强退化下减少后续中断，但降低早期呈现码率。另60次固定Moderate配置实验将估计器重置为6个受控标量先验，IAR上限在预测阈值处由L0切换至L1、L2，全程零卡顿。结果未证明基于历史带宽导出的上限优于固定低上限。
