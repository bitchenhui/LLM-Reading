summaries:
  one_liner_zh: 提出 Crescent 框架，零外部监督下自主生成问答数据，实现 LLM 数学推理自我改进。
  abstract_zh: 现有 LLM 自我改进方法通常依赖种子数据或第三方模型等外部监督信号。Crescent 框架分三步实现完全自主的合成数据生成：先用'诱饵提示'引导 LLM 生成原始问题，再通过基于拒绝采样的自我去重实现问题多样化，最后将问题反馈给
    LLM 并以多数投票收集答案。实验表明 Crescent 生成的问答对可在零外部监督下提升 LLM 的数学推理能力，同时保持其通用性能（尤其在 0-shot 设置下），并比基于种子数据集增强的方法更有效地将
    LLM 知识蒸馏到更弱模型。
