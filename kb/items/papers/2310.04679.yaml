summaries:
  one_liner_zh: 提出HVFVC框架，用置信度特征重建与周期补偿损失改善感知质量，仅需约50%码率即可超越VVC。
  abstract_zh: 现有学习式视频压缩方法在PSNR等客观指标上已超越传统方法，但对感知质量的关注不足，直接引入感知损失会引发若干感知质量问题。论文提出高视觉保真度学习视频压缩框架HVFVC，设计基于置信度的特征重建方法，解决新增出现区域重建质量差的问题，显著提升重建视觉质量。同时提出周期性补偿损失，缓解反卷积操作与优化带来的棋盘伪影。大量实验表明，HVFVC取得了优异的感知质量，仅需约50%的码率即可超越最新的VVC标准。
