summaries:
  one_liner_zh: 免训练推理时自纠正框架Self-RefineVQA：单VLM迭代生成-批判-精炼，显著提升表格VQA准确率，小模型获益最大。
  abstract_zh: 针对VLM在表格等结构化内容上推理不稳定、存在空间错位与逻辑幻觉的问题，作者提出Self-RefineVQA（Cycle-of-Thought），一个免训练、推理时的自纠正框架：单一VLM在提示引导下迭代扮演生成器、批评者与精炼者，形成闭环自反馈以修正推理错误，无需标注数据或模型更新。在表格VQA基准上，该方法在单语与跨语言理解中均取得一致的准确率提升，对2B-7B参数量的小模型增益尤为显著，使其可媲美大得多的模型。复杂度分析显示推理成本随迭代线性增长，但因消除了微调所需的人工标注瓶颈，数据效率更高、累计成本更低。
