summaries:
  one_liner_zh: 提出 ViLP 基准揭示 VLM 过度依赖语言先验，并用自生成好坏图像对自训练提升视觉推理能力。
  abstract_zh: 该工作指出 VLM 可能过度依赖训练数据中的视觉语言先验而非真正的视觉推理，为此构建 ViLP 基准，利用图像生成模型合成分布外图像与分布外问答对；每个问题配三个候选答案与三张对应图像，其中一张仅靠文本先验即可解答，两张必须依赖视觉推理。人类在该基准上接近满分，而
    GPT-4 仅取得 66.17%。为缓解该问题，作者提出自改进框架：模型自生成新的 VQA 数据，并施加像素级与语义级破坏构成'好-坏'图像对进行自训练，训练目标促使 VLM 更关注真实视觉输入。实验证明该框架能有效提升
    LLaVA-v1.5 与 Cambrian 等开源 VLM 的性能。
