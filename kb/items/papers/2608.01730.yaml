claims:
- statement: ReLIQS是分辨率无关的模型，直接在包含原始分辨率在内的多个尺度上采样patch，保留原始分辨率下的质量线索，避免激进缩放导致的信息丢失。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: ReLIQS支持在量表不匹配的多个异构主观IQA数据集上联合训练，并能跨真实失真、合成失真与AIGC基准泛化。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 在跨分辨率、跨失真类型的多个基准上，ReLIQS以相当或更低的计算成本取得优于CNN、CLIP及MLLM基线的泛化性能。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 架构由感知重要性估计器（预测IQA专用显著性/重要性图以选择少量信息性patch）与潜在质量轴模块（聚合patch嵌入输出整图分数）构成，兼具预算自适应性。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 提出基于CLIP的分辨率无关无参考IQA模型ReLIQS，联合学习'看哪里'与'如何评判'，跨数据集跨分辨率泛化更优。
  abstract_zh: 针对现有SOTA无参考IQA系统普遍存在的激进缩放丢失质量线索、跨分辨率泛化差、难以在MOS量表不一致的异构主观数据集上联合训练、计算开销大等问题，作者提出ReLIQS。该模型为基于CLIP视觉骨干的多尺度patch驱动架构：在包括原始分辨率在内的多个尺度上采样固定大小patch，由轻量的感知重要性估计器预测IQA专用重要性图以筛选信息量大的patch，再由潜在质量轴模块将patch嵌入聚合为整图质量分数。模型可在多个主观研究数据集上联合训练并保持计算高效、预算可调。在真实失真、合成失真及AIGC基准上，ReLIQS以相当或更低的计算成本取得优于CNN、CLIP及MLLM基线的泛化性能。
