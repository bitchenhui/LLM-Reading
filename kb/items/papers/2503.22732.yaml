summaries:
  one_liner_zh: 综述2023-2025年27个顶级LLM的推理进展，涵盖推理时扩展、RL、蒸馏、MoE、RAG、CoT与自我改进等策略。
  abstract_zh: 该综述系统梳理了2023至2025年间发布的27个顶级大语言模型（含DeepSeek-R1、OpenAI o1/o3、GPT-4o、QwQ-32B、Phi-4等）的核心创新与性能提升，指出推理时扩展、强化学习、监督微调与蒸馏已显著增强模型推理能力。论文回顾了多语言LLM在跨语言推理上的进展及以英语为中心训练的局限，并总结了Mamba等状态空间模型架构在长上下文处理上相对Transformer的效率优势。训练策略部分覆盖通用优化、混合专家（MoE）配置、检索增强生成（RAG）、思维链提示、自我改进方法以及测试时算力扩展与蒸馏框架。最后提出未来关键挑战：无人类监督的多步推理、链式任务执行鲁棒性、结构化提示与生成灵活性的平衡，以及长上下文检索与外部工具集成。
