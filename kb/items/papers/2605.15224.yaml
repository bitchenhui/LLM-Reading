summaries:
  one_liner_zh: 提出ICRL框架，联合训练求解器与批评者，将批评引导的成功内化为无外部辅助的求解器能力。
  abstract_zh: 针对LLM智能体在去掉批评后无法保持正确行为、即未将批评内化为自身能力的问题，提出ICRL框架：从共享主干联合训练求解器与批评者，批评者以求解器后续性能增益作为奖励以激励可执行的反馈。为弥合批评条件行为与无批评行为间的分布偏移，引入分布校准重加权比例，并采用角色分组优势估计稳定双角色联合优化。在Qwen3-4B与Qwen3-8B骨干上、覆盖智能体与数学推理的多个基准评测中，平均较GRPO分别提升6.4与7.0分；学到的8B批评者性能可与32B批评者相当且token消耗大幅减少。
