summaries:
  one_liner_zh: 实测四款神经音频编解码器解码端能耗：低码率并不必然带来端侧能耗收益。
  abstract_zh: 本文对 EnCodec、DAC、HILCodec、SNAC 四种神经音频编解码器及 AAC-LC、Opus 两种传统基线，在笔记本与手机平台上开展基于实测的码率-能耗-质量分析。采用原始参考的
    ViSQOL 协议分别评估语音与音乐，解码能耗按每秒音频的扣空闲能耗（J/s）测量，结果取三次重复运行的中位数，并由实测能耗与码率解析推导两两盈亏平衡传输能耗阈值。在质量匹配工作点上，神经编解码器以更低码率达到相近
    ViSQOL 分数，但解码端能耗通常高于传统编解码器；EnCodec 在两组质量匹配队列、两种平台上给出最低的神经侧盈亏平衡阈值。部分 DAC 与 SNAC 在 Phone XNNPACK CPU
    路径上的盈亏平衡阈值超过 200 mJ/kbit，其全频段手机配置解码 1 秒音频需超过 1 秒，表明低码率本身不保证能耗优势，部署效率还取决于解码复杂度、运行时与设备映射、执行有效性、加速器可用性及传输能耗系数。
