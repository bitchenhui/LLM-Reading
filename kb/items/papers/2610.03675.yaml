summaries:
  one_liner_zh: 提出成本感知LLM进化框架FrugalEvo，强LLM出策略、廉价LLM写代码，以单位成本收益最大化为目标并低成本刷新圆形装箱SOTA。
  abstract_zh: 针对AlphaEvolve等LLM引导进化方法只优化固定迭代次数下性能的局限，作者主张以单位成本收益最大化为目标，提出成本感知进化框架FrugalEvo：更强的昂贵LLM负责探索解题策略，更廉价的LLM负责实现并迭代精炼代码，并通过最大化提示前缀共享设计缓存友好的进化流程。同时提出预算感知曲线下面积BA-AUC指标，度量固定成本预算内最优评分曲线的面积。在10个数学与系统优化任务上，FrugalEvo匹配或超越OpenEvolve、ShinkaEvolve、AdaEvolve、EvoX等SOTA基线，并在其中9个任务上取得更高BA-AUC；在ALE-Bench-Lite的10个算法优化任务上平均性能亦更高。在圆形装箱任务上，使用GPT-5.6
    Terra/Luna仅花1.68美元、GLM-5.3及Flash仅0.55美元即取得新SOTA，匹配或超越平均花费约50美元的CORAL、SwarmResearch等多智能体方法。
