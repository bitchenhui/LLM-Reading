summaries:
  one_liner_zh: 提出自动化图像评估流水线，证明低压缩伪影、高图内多样性与大规模数据（ImageNet/PASS）可提升SR性能。
  abstract_zh: 该工作系统研究了长期被忽视的SR训练数据因素，质疑仅在DIV2K/DF2K等常用数据集上训练与评测SR的惯例。作者提出自动化图像评估流水线，对现有高分辨率数据集及ImageNet、PASS等更大规模数据集按质量与多样性进行分层并对比训练效果。结果表明：低压缩伪影、高图内多样性（以不同物体数量衡量）以及来自ImageNet或PASS的大量图像均正向影响SR性能。作者期望该简单有效的数据筛选流水线能指导未来SR数据集构建，从而产出更好的模型。
