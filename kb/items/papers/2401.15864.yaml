summaries:
  one_liner_zh: 提出结构-细节分解与长短期时域上下文融合的帧间预测，使学习型编解码器全面超越H.266/VVC。
  abstract_zh: 针对局部运动不一致与遮挡区域帧间预测不准的问题，论文借鉴传统编码中递归划分、几何划分和长期参考的思路，提出空间分解与时域融合的帧间预测方法。为处理运动不一致，先将视频分解为结构与细节（SDD）分量，再分别进行SDD运动估计与SDD时域上下文挖掘，生成短期时域上下文。为处理遮挡，通过循环积累各历史参考特征的时域信息来传播长期时域上下文，并与短期上下文融合，从而获得更准确的帧间预测。综合实验表明，该学习型视频编解码器在所有常用测试数据集上，PSNR与MS-SSIM两项指标均优于H.266/VVC参考软件。
