summaries:
  one_liner_zh: 提出JOSH自对齐算法与ToolWOZ稀疏奖励仿真环境，使LLM智能体无需人工反馈即可自我训练工具调用能力。
  abstract_zh: 论文指出SOTA LLM智能体在多轮对话任务上的进步主要依赖监督微调与高质量人工反馈，但随着基座模型能力增强，获取有意义的人工反馈变得愈发昂贵甚至不可行。作者提出JOSH（Juxtaposed
    Outcomes for Simulation Harvesting）自对齐算法，利用稀疏奖励仿真环境提取理想行为，再用模型自身输出继续训练。同时构建了源自MultiWOZ的稀疏奖励工具调用仿真环境ToolWOZ。实验表明，经JOSH训练的小型与前沿模型在工具交互上显著提升，同时在多样化基准上保持通用能力，代码与数据已开源。
