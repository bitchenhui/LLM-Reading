summaries:
  one_liner_zh: 用基于FunSearch的LLM进化搜索自动生成更难的关系推理基准实例，并改进Edge Transformer的泛化能力
  abstract_zh: 神经模型在系统性运用所学知识处理比训练更难的问题实例上仍面临挑战，而评估这种泛化能力的瓶颈在于事先难以判断实例难度。该工作提出用LLM自动化生成基准：给定由Datalog规则参数化的世界并以Edge
    Transformer作为推理评估器，采用基于FunSearch的LLM进化搜索与自主agentic搜索来发现能产生更难实例的采样函数。作者证明利用这些难例数据可改进Edge Transformer，使其对进一步的数据扰动具备良好泛化。最后，同一机制可应用于由LLM提出的全新世界，为神经关系推理的自主研究打开大门。
