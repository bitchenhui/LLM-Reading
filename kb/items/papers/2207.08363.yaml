summaries:
  one_liner_zh: 提出TF-Codec：在VQ-VAE框架内用潜域预测编码去除时域冗余，低延迟下1 kbps质量优于9 kbps Opus。
  abstract_zh: 针对现有神经语音编解码器编码特征中仍存在时域冗余的问题，论文在 VQ-VAE 框架中引入潜域预测编码，以过去量化潜帧的预测作为条件对当前帧编码，端到端实现低延迟语音编解码器
    TF-Codec。方法上引入对时频输入的可学习压缩，在不同码率下自适应调整对主频与细节的关注，并提出基于 distance-to-soft 映射与 Gumbel-Softmax 的可微分向量量化，在码率约束下更好建模潜变量分布。多语种语音数据集上的主观评测显示：低延迟条件下
    TF-Codec 在 1 kbps 的质量显著优于 9 kbps 的 Opus，3 kbps 优于 9.6 kbps 的 EVS 与 12 kbps 的 Opus。代码与模型已在 GitHub 开源（microsoft/TF-Codec）。
