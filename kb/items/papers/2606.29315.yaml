summaries:
  one_liner_zh: 提出以主动实验与分层技能蒸馏为核心的LLM自我改进框架HExA，在Interphyre物理任务上使前沿模型接近100%成功率。
  abstract_zh: 现有LLM智能体多依赖模仿获得的参数化知识，在新领域或需要先验之外信息的复杂查询上表现不佳。作者提出HExA，一个上下文内、以实验为中心的自我改进框架：迭代设计与优化与查询相关的实验，将交互经验增量蒸馏为可复用、可组合的技能，并整合实验证据来行动或作答；可配合任意LLM（含前沿黑盒模型），无需外部监督、oracle解或离线数据。作者同时发布Interphyre——一组支持工具调用与干预API的高难度程序化物理任务基准，当前前沿LLM（含GPT-6
    Astra）均告失败。实验覆盖多步推理、部分可观测交互游戏与物理定律发现任务：在Interphyre最难任务上HExA使模型接近100%成功率，且较朴素智能体与记忆基线提升token效率，并可通过分层技能迁移从易任务泛化到难任务。
