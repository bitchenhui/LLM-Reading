summaries:
  one_liner_zh: 提出CatalogAgent：监督者智能体调解生成-评估冲突并沉淀经验，经上下文工程使生成器与评估器分别提升15.24%和13.98%。
  abstract_zh: 针对电商商品目录中结构化属性（如材质、颜色、形状）缺失的问题，作者提出CatalogAgent智能体系统，采用LLM生成器-评估器框架预测属性值。当生成器与评估器内部冲突或卖家外部反馈出现分歧时，监督者智能体介入调解并做最终裁决。系统引入记忆库与记忆摘要器，将监督者的个案处理聚合为经验学习，并通过上下文工程将学习成果注入工作模型，无需人工干预实现自我改进。实验显示生成器与评估器性能分别提升15.24%与13.98%，提出了监督者中介式自学习系统的新范式。
