summaries:
  one_liner_zh: 十个前沿模型作为训练智能体自主后训练语言模型，探索人类反馈引导的递归自我改进（RSIHF）。
  abstract_zh: 提出 RSI Arena，一个研究自主后训练与人类反馈引导递归自我改进的两阶段平台：十个前沿模型作为训练智能体，均从 NVIDIA Nemotron 3.5 Lightning
    30B-A3B Base 出发，在六天第一阶段内各自拥有 1,000 GPU 小时和 300 美元 API 额度（共享 64 GPU 集群），独立选择数据、实施训练并挑选检查点。第一阶段在 20
    个基准与盲测人类评估上评测，全部十个智能体均产出可用助手，最强者（由 GPT-6 Astra 训练）在 12 个能力基准上中位数填补了基座到 NVIDIA Instruct 差距的 76%，人类偏好评分经回复长度与格式统计调整后接近
    NVIDIA Instruct。第二阶段各智能体获得其模型的对比记录与投票后再训三天，以 NVIDIA Instruct 为共同参照，十个模型中八个的风格调整后相对评分提升。研究发现基准收益有限且与偏好收益无明显关联，部分智能体诱导更长回复，一个模型在
    StrongREJECT 上有害顺从度上升。该平台为研究人类反馈如何引导自主模型开发提供了可审计的环境。
