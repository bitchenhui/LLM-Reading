summaries:
  one_liner_zh: 跨架构蒸馏将Transformer LLM网络知识迁移至线性复杂度Mamba学生模型，在ABR等任务上吞吐提升3.96倍、存储仅5.48%。
  abstract_zh: 论文提出Mamba4Net，一种跨架构知识蒸馏框架，借鉴DeepSeek-R1在蒸馏范式中的表现，将基于Transformer的大语言模型中的网络领域知识迁移到具有线性时间复杂度的Mamba架构学生模型。该设计相较Transformer的二次复杂度显著提升计算效率，更小的模型规模进一步降低资源开销。在视点预测、自适应码率（ABR）流媒体和集群作业调度三类网络任务上评估，相比不使用LLM的现有方法取得更优任务性能；相比直接应用Transformer
    LLM的方案，吞吐量提高3.96倍，存储占用仅为5.48%。源代码已开源。
