claims:
- statement: 以个体高斯基元显式跟踪长程复杂运动本质上不稳定，将高斯组织在时间条件锚点周围可局部化空间与时间支撑、降低长程运动复杂度。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 时间窗口策略仅激活与查询时刻相关的锚点，提升长序列体视频表示的可扩展性与时序一致性。
  confidence: reported
  evidence: abstract（初筛，未读全文）
- statement: 紧凑的多级锚点特征（全局特征+局部空间特征+局部时间特征）联合约束高斯生成，保证时空稳定性；ATGS 在长序列复杂运动体视频上持续优于已有方法。
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 用时间条件锚点组织高斯基元并配合时间窗口与多级锚点特征，提升长序列复杂运动体视频的时序稳定性与重建质量。
  abstract_zh: 针对现有体视频方法在长序列与复杂运动下时序不稳定、易出现伪影的问题，提出基于高斯泼溅的 ATGS 框架。核心思路是以时间条件锚点为中心组织高斯基元，局部化其空间与时间支撑范围，从而降低长程运动建模复杂度。引入时间窗口策略仅激活与查询时刻相关的锚点，提升可扩展性与时序一致性。并设计编码全局、局部空间与局部时间特征的多级紧凑锚点特征，共同约束高斯生成。实验表明其在长序列、复杂运动的体视频上持续优于已有方法。
