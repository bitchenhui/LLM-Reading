summaries:
  one_liner_zh: 提出HGM-Dual，以谱系感知上下文与误差条件双路径子代生成，实现预算高效的规划智能体框架进化。
  abstract_zh: 框架优化通过改进智能体的提示、工具与工作流来增强基于冻结或闭源LLM的智能体，代表性方法Darwin-Godel Machine与Huxley-Godel Machine依赖递归自我改进，且主要面向编码任务。规划任务中改进智能体所需能力与被改进能力不对齐，开放式自我修改会反复探索无效改动并消耗大量评估预算。HGM-Dual将智能体进化表示为谱系感知上下文，记录每个祖先的改动、行为改进/退化及无效修改，为编辑器提供显式的编辑-结果归因。同时引入误差条件双路径子代生成：对每个选中父代，生成保留开放式探索的通用子代，以及针对最可能引发最高优先级约束违例组件的专用子代。实验显示其案例准确率相对最强基线最高提升14.45%，并以2-4倍更少的评估预算匹配HGM变体的最终性能。
