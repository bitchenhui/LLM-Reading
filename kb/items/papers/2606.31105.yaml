summaries:
  one_liner_zh: 通过保分攻击与保质攻击系统探查语音质量评估模型UTMOS的鲁棒性，EnCodec潜空间优化成功率最高。
  abstract_zh: 该文以语音处理研究中广泛使用的深度神经网络语音质量评估指标UTMOS为攻击对象，从高质量语音出发沿两个方向优化输入：保分攻击（降低感知质量的同时维持预测分数）与保质攻击（压低预测分数的同时维持感知质量）。攻击在三种输入空间上进行优化：原始波形、经HiFi-GAN声码器生成的梅尔谱，以及神经音频编解码器EnCodec的潜空间。实验结果表明保分攻击对UTMOS十分有效，即感知质量已明显退化而模型评分仍保持不变；保质攻击更难完美实现，其中在EnCodec潜空间内的优化提供了最佳成功机会。这些结果揭示了UTMOS的失效模式，凸显了对DNN质量评估指标开展鲁棒性分析的重要性。
