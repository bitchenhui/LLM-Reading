summaries:
  one_liner_zh: 在开源 ALVR 上扩展网络性能指标并提出 NeSt-VR 算法，实现 Wi-Fi 下 VR 串流的码率自适应。
  abstract_zh: 交互式 VR 在 Wi-Fi 上串流面临信道竞争与用户移动导致的带宽波动挑战。自适应码率（ABR）算法根据可用网络容量动态调整视频编码码率，以最大化画质、缓解拥塞并保障用户体验质量（QoE）。本文基于开源
    VR 串流方案 Air Light VR（ALVR）开展 ABR 算法实验，为其扩展了一整套网络性能指标，实现对网络状态的稳健刻画，从而支撑更有依据的码率调整。为验证这些指标的效用，作者设计并测试了面向
    VR 串流的网络感知分级式 ABR 算法 NeSt-VR。实验结果验证了新实现网络指标的准确性，并证明 NeSt-VR 具备有效的视频码率自适应能力。
