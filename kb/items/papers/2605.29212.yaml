summaries:
  one_liner_zh: 提出人在回路主动排序框架MetaRanker，以语义可解读性评估超透镜图像质量，成对标注省约80%。
  abstract_zh: 超透镜可大幅小型化光学模块，但存在明显色差与场相关像差，需计算重建；现有重建模型多以PSNR等失真保真目标训练与选型，此类代理指标与人类偏好相关性弱（感知-失真权衡）。作者提出MetaRanker，将超透镜图像质量形式化为语义可解读性，即人在光学伪影下可靠识别物体与结构的程度。框架结合概率偏好模型与不确定性感知查询选择，并借助视觉-语言模型提供轻量语义先验，先验仅用于引导信息性比较采样，人类判断始终是主要监督信号。在真实与合成超透镜数据集上，MetaRanker的排序与人类评估最一致，所需成对标注较穷举成对评估减少约80%。研究还表明标准IQA指标在超透镜域与人类可解读性的一致性有限。
