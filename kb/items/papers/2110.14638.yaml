summaries:
  one_liner_zh: 提出元注意力机制，将退化元数据转为通道注意力向量，可即插即用于任意SR网络以提升像素级重建精度。
  abstract_zh: 超分辨率是病态问题，引入描述退化过程的元数据（如模糊核、压缩级别等）可指导网络更忠实地重建，但现有元数据融合方法多需大幅改动架构或增加显著复杂度，难以移植到任意SR网络。本文提出meta-attention这一轻量机制，将元数据翻译为通道注意力向量以选择性调制网络特征图，不依赖特定架构，可方便嵌入任意SR
    CNN。大量实验表明，在提供相关退化元数据时，meta-attention能持续提升SOTA网络的像素级精度：在模糊/降采样（X4）图像上，PSNR对SOTA通用SR模型平均提升0.2969 dB，对人脸SR模型平均提升0.3320
    dB。
