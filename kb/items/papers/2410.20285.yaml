summaries:
  one_liner_zh: 将MCTS与自改进机制结合的多智能体框架，在SWE-bench上使软件智能体性能相对提升23%。
  abstract_zh: 论文提出SWE-Search，一个融合蒙特卡洛树搜索（MCTS）与自改进机制的多智能体框架，用于解决现有LLM软件智能体线性执行、无法回溯探索替代方案的问题。该框架扩展传统MCTS，引入混合价值函数，利用LLM同时进行数值价值估计与定性评估，形成基于定量与自然语言反馈的自我反馈循环。框架由SWE-Agent（自适应探索）、Value
    Agent（迭代反馈）和Discriminator Agent（多智能体辩论协作决策）三个组件构成。在SWE-bench基准上，相较无MCTS的标准开源智能体，五个模型取得23%的相对性能提升。分析还表明性能随推理时算力增加（更深搜索）而扩展，无需更大模型或额外训练数据。
