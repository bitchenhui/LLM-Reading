summaries:
  one_liner_zh: 提出HCI指标诊断现有LLM短板，给出从改进执行自主到递归元改进的RSI发展路线图。
  abstract_zh: 该文首先提出 Headroom-Closed Index（HCI）指标，用以揭示现有 LLM 在自我改进方面的局限。随后系统阐述递归自我改进（RSI）的概念与发展路线图：从改进执行自主、改进策略自主、经验获取自主、环境适应自主，最终递进到递归元改进。文章进一步考察
    RSI 在科学发现、具身智能、软件工程等不同场景下的差异化需求与发展速度。结合产业实践与初步实证证据，作者将 RSI 研究与实际系统相连，并指出实现真正 RSI 所面临的关键挑战。
