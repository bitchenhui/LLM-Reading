summaries:
  one_liner_zh: 构建可执行模型训练环境集RSI-Dojo及其自动生成流水线RSI-Craft，微调出的智能体在PostTrainBench上达到前沿模型水平。
  abstract_zh: 论文面向递归自我改进（RSI）中的核心能力——让智能体自主训练和改进基座模型，提出可执行模型训练环境集RSI-Dojo，教LLM智能体完成数据选择、模型训练、失败诊断与迭代改进等后训练全流程。为此作者开发自动流水线RSI-Craft：从顶级会议收集论文，将数据集与指标实例化为统一接口并复现评测依赖，再按数据规模、执行可靠性和区分度过滤，得到281个种子模型训练任务。基于RSI-Dojo，用改进harness从前沿模型收集高质量训练轨迹，并经量规与结果双重过滤保留样本。微调Qwen3.5-9B与Qwen3.6-35B-A3B后，RSI-Dojo-9B和RSI-Dojo-35B-A3B分别较基座提升8.74和16.87个PostTrainBench点，其中35B-A3B版本在PostTrainBench达29.95、PostTrainBench-Lite达53.29，与GLM-5.2、GPT
    5.5等前沿模型持平。
