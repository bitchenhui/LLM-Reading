summaries:
  one_liner_zh: 提出 JevRSI：System-1 模型低延迟执行、System-2 LLM 异步递归改进模块化 harness，兼顾性能与成本
  abstract_zh: 论文提出 JevRSI，一个 System-1/System-2 协作框架，将 LLM 推理转化为可迁移的决策支持，并通过递归 harness 改进实现自我提升。Jev 风格的
    System-1 模型负责低延迟动作选择，异步的 System-2 LLM 开发模块化 harness，集成过程、状态记忆与世界模型，为决策提供覆盖过去、现在与未来的上下文。效用驱动检索依据上下文相关性与历史任务效用选取模块，环境反馈引导针对性修订，从而实现递归自改进。在三个数据集上的实验显示，JevRSI
    持续提升决策质量，在若干设置中达到或超越 LLM 智能体，同时保持低延迟执行与更优的性能-成本权衡。随着 harness 演化，System-2 开发干预逐渐减少，持续改进摊薄了 System-2
    成本。
