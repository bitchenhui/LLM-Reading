summaries:
  one_liner_zh: 将 FunSearch 改造用于烘焙食谱创作，发现循环内评估器设计是创造性搜索的一阶变量。
  abstract_zh: 该试点研究将 FunSearch 框架改编用于 2024 年 Pillsbury 烘焙大赛的食谱生成任务，并用基于 TTCT 的 LLM 评估方法与人类基准进行对比。在两组实验中考察迭代次数、生成器温度以及循环内选择评分器的模型规模。结果表明：迭代生成-选择可以产生与人类基准创造性相当的食谱，但单纯增加迭代次数并不能提升创造性。循环内评估器的影响最大——更小的选择评分器在多数
    TTCT 创造性维度上得分显著更高，温度仅在原创性维度上有一定作用，说明评估器设计是主观创造性搜索中的首要设计变量。
