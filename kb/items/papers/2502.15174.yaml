summaries:
  one_liner_zh: 频率分解的学习型屏幕内容图像压缩方法，附1万余张图像新数据集，PSNR与MS-SSIM超越传统标准与SOTA。
  abstract_zh: 针对屏幕内容图像具有锐利边缘、重复纹理、嵌入文字图形等特性、直接套用自然图像压缩方法效果欠佳的问题，提出FD-LSCIC方法：采用多频率两级倍频残差块（MToRB）提取特征，级联三尺度特征融合残差块（CTSFRB）实现多尺度特征整合，并以多频率上下文交互模块（MFCIM）降低频率间相关性。同时引入自适应量化模块，为每个频率分量学习缩放均匀噪声，实现量化粒度的灵活控制。针对大规模SC数据集缺失问题，构建了涵盖基础屏幕内容图像、计算机渲染图像及PC与移动平台混合内容的SDU-SCICD10K数据集（逾1万张图像）。实验表明该方法在PSNR与MS-SSIM上显著优于传统编码标准及最先进学习型压缩方法。
