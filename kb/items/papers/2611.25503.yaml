summaries:
  one_liner_zh: 提出源感知神经音频编解码器+LLM的语音与环境声联合token流生成框架，可直接适配真实混合录音场景
  abstract_zh: 针对语音场景生成任务，提出基于预训练大语言模型的联合建模框架，对语音与环境声两条token流分别建模并以交错方式生成。设计源感知神经音频编解码器，直接从混合录音中提取时间对齐的语音与环境声token，因而无需孤立源录音即可适配真实野外语音场景。模型以自然语言场景描述与语音内容为条件，在共享生成上下文中保持源专属表示。实验显示该方法在语音可懂度、场景相关性与音频质量上优于现有语音-场景生成技术，真实场景适配带来一致增益。
