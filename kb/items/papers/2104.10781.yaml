summaries:
  one_liner_zh: 首届NTIRE压缩视频质量增强挑战赛综述：基于LDV数据集设三赛道，482队注册、31队提交最终结果
  abstract_zh: 该文总结首届 NTIRE 压缩视频质量增强挑战赛的赛制、方法与结果。比赛采用新的大规模多样化视频数据集 LDV，设三个赛道：Track 1 与 Track 2 面向固定 QP
    的 HEVC 压缩视频，Track 3 面向固定码率的 x265 压缩视频。Track 1 与 Track 3 以 PSNR 衡量保真度提升，Track 2 以感知质量为目标。三个赛道共吸引 482
    支队伍注册，测试阶段分别有 12、8、11 支队伍提交最终结果，参赛方法代表了压缩视频质量增强的最先进水平。
