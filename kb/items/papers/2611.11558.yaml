summaries:
  one_liner_zh: 提出 InfraRSI 智能体框架，经五阶段验证工作流将开放式指令转化为分布式 LLM 训练优化，最高加速 2.75 倍。
  abstract_zh: InfraRSI 是一个智能体框架，将开放式人类指令转化为经过验证的分布式 LLM 训练基础设施优化，针对启动参数、算子内核与通信调度紧耦合导致的 OOM、编译冲突、测量抖动与数值漂移等难题。其五阶段工作流包括：init
    锁定可编辑范围与固定任务契约以防奖励作弊，doctor 建立基线并校准集群噪声，run 协同优化启动旋钮与代码补丁并对最优候选复核回基线，report 与 apply 审计源路径、记录失败试验成本并提交变更。方法从多样化经验种子配置初始化，基于含
    OOM 的全部试验拟合全局执行时间与删失峰值内存模型，据此为各设置定价内存成本、在线修正失准的 LLM 先验、并将高内存优化与省内存补丁配对。在四个单/多节点稠密与 MoE LLM 负载上，InfraRSI
    最高取得 2.75 倍加速，平均 MFU 从 17.4% 提升至 30.0%，超越现有调优器与编码智能体，并可在不同 GPU 间迁移经验，形成运行内修正先验与跨集群蒸馏经验的双层递归自改进闭环。
