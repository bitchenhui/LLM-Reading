summaries:
  one_liner_zh: 系统综述LLM知识蒸馏的算法、技能与垂直化三大支柱，及其在模型压缩与自我改进中的作用。
  abstract_zh: 该综述围绕算法、技能、垂直化三大支柱，系统梳理大语言模型知识蒸馏的机制、特定认知能力增强及跨领域应用。指出KD是将GPT-4等专有LLM的先进能力迁移至LLaMA、Mistral等开源模型的关键方法，同时在模型压缩和以模型自身为教师的自我改进中发挥重要作用。重点分析数据增强（DA）与KD的相互作用：利用DA生成上下文丰富、技能特定的训练数据，使开源模型逼近专有模型在上下文适应性、伦理对齐与深层语义方面的能力。并倡导遵守LLM使用法律条款，附有GitHub资源仓库。
