summaries:
  one_liner_zh: 提出基于最优传输的无训练时序token压缩框架，仅保留10%视觉token即可保留95.8%视频问答性能。
  abstract_zh: 随着视频更长更复杂，Video-LLM因跨帧累积大量视觉token导致推理开销快速增长，无训练token压缩成为实用方案，但现有方法依赖跨帧相似度或分割启发式，忽略token语义角色且无法按帧对可压缩性自适应分配强度。OTT-Vid采用两阶段设计：先做空间剪枝选出每帧代表性内容，再在相邻帧间求解带非均匀token质量与局部性感知代价的最优传输问题，以传输总代价度量帧对压缩难度并动态分配压缩预算。该方法在保护语义重要token的同时平衡token重要性与匹配代价。在覆盖视频问答与时序定位的六个基准上，仅保留10%token即可保留95.8%的VQA与73.9%的VTG性能，稳定优于现有SOTA无训练压缩方法。
