summaries:
  one_liner_zh: 提出可靠性感知视图分配与渲染引导视频修复，从画质混杂、视角覆盖不均的手持视频重建高质量3DGS。
  abstract_zh: ClearGS面向手持视频的3D高斯泼溅重建，针对视点覆盖不均与帧质量混杂问题，用可靠性感知视图分配（RVA）按外观可靠性、退化风险与几何效用分配分级的原始监督权重，并弱化重新激活被抑制但有用的帧以保持轨迹覆盖。由于加权无法恢复模糊/失真丢失的细节，进一步引入渲染引导的视频修复（RIVR）：以当前3DGS渲染作为位姿对齐的结构候选，冻结的无参考修复专家恢复原始视频观测，再用无参考感知评分在渲染、修复观测与高频融合候选之间选择。最后通过全轨迹修复巩固（Full-Trajectory
    Repair Consolidation）回访已接受的修复以保留早期引入的细节。在GS2E与GSOTM上取得整体最优性能，CLIP-IQA与MUSIQ一致提升、多数退化设置下LPIPS降低，无需成对清晰监督或匹配的干净参考。
