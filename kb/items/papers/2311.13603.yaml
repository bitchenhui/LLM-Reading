summaries:
  one_liner_zh: 结合HEVC全intra低延迟编码、多描述编码与802.11p MAC层自适应映射，提升车联网视频接收质量
  abstract_zh: 针对车联网对实时视频辅助应用日益增长的需求，作者提出一种低复杂度的跨层系统以改善接收端视频质量。方案利用HEVC的全intra（AI）编码结构保证最小编码时延，并以多描述编码（MDC）提升传输鲁棒性，在IEEE
    802.11p标准MAC层引入自适应映射机制。在真实车联网环境下的仿真结果表明，该方法是低复杂度的，并能在低延迟视频通信场景中显著改善接收端视频质量。
