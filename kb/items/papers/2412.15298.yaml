summaries:
  one_liner_zh: 比较DSPy框架下五种提示优化算法将LLM幻觉检测评估对齐人工标注的效果，优化后提示优于多种基线。
  abstract_zh: 论文主张DSPy（Declarative Self-improving Python）优化器是对齐LLM提示词及LLM评估与人工标注的有效途径。作者在DSPy框架内比较了五种teleprompter算法：COPRO、MIPRO、BootstrapFewShot、BootstrapFewShot+Optuna以及K近邻Few-Shot。具体任务为优化提示词，使LLM-as-judge的幻觉检测对齐公开基准数据集上的人工标注真值。实验表明优化后的提示词在幻觉检测上可超越多种基准方法，且部分teleprompter算法在这些实验中表现优于其他算法。
