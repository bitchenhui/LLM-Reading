summaries:
  one_liner_zh: 综述中国AVS工作组首代点云压缩标准AVS PCC的关键编码工具，并与MPEG G-PCC/V-PCC进行技术与性能对比。
  abstract_zh: 点云是广泛应用于沉浸式媒体、自动驾驶与数字文化遗产保护等领域的3D数据表示格式，但其庞大数据量给传输与存储带来挑战，点云压缩对实际部署至关重要。MPEG已建立基于几何的G-PCC与基于视频的V-PCC两项点云压缩标准。与此同时，中国AVS工作组也完成其第一代点云压缩标准AVS
    PCC的开发，该标准采用了多项区别于对标标准的新编码工具与技术。本文从相关技术与性能对比两个视角系统综述AVS PCC标准。
assessment:
  relevance: high
  decision: summary_only
  reason: 点云压缩属沉浸式媒体域（非核心编码域），但作为AVS首代点云压缩标准的官方综述与MPEG标准对比，参考价值高，按规则仅summary_only。
