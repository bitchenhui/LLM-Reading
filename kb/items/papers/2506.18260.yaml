summaries:
  one_liner_zh: 受FunSearch启发，用LLM多智能体系统在抽象层面自动搜索并优化量子机器学习算法（概念验证）。
  abstract_zh: 本文提出一个受Google DeepMind FunSearch启发的框架，利用基于大语言模型的多智能体系统（LLMMA）自动搜索和优化量子机器学习（QML）算法。该系统在抽象概念层面迭代生成并精炼经典机器学习算法（如多层感知机、forward-forward与反向传播）的量子变换。作为概念验证，该工作展示了智能体框架系统地探索经典机器学习概念并将其适配到量子计算的潜力，为量子增强机器学习算法的自动化开发铺路。未来方向包括引入规划机制与搜索空间优化策略。
