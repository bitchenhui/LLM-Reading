summaries:
  one_liner_zh: 将六项图像域测量以文本形式注入多模态LLM，实现无参考低剂量CT质量评分，追平挑战赛冠军水平。
  abstract_zh: 针对低剂量CT无参考质量评估（无需全剂量参考图即可预测放射科医生评分）的任务，作者在Qwen3.8-27B多模态大模型基础上引入测量感知机制：将噪声、清晰度、高频内容与条纹伪影等六项图像域测量以百分位文本形式提供给语言模型。在LDCT-IQA
    2023测试集上，该方法Overall得分2.735，与重训后的挑战赛冠军（2.735）持平，优于MedSigLIP-FiLM（2.713），并显著高于零样本基座MLLM。消融显示测试时打乱测量输入会使得分下降0.048（主要来自噪声测量），但同一组测量也会使模型对过度平滑的去噪图像给出偏高评分，暴露出一定局限。
