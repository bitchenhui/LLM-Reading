summaries:
  one_liner_zh: 提出StateWise自改进方法，让单个LLM自维护带墓碑的可修订约束状态，大幅降低多轮对话中已撤回约束的复发
  abstract_zh: 对话用户会不断新增、修改、撤回约束，指令微调LLM存在两类失败：随轮次累积约束不再被遵守（持续性失败），以及已撤回约束继续生效（复发）。StateWise让单个LLM自维护带墓碑标记的类型化约束状态，用可执行检查器度量两类失败并免费编译真值状态。方法先微调两个互补技能（将对话摘要为约束状态、按状态生成回复），再以精确往返校验过滤自训练轨迹进行自训练；7-8B模型状态跟踪近乎完美，但监督式自训练在Llama-3.1-8B上反而使复发约翻倍。为此加入基于自生成复发对比的偏好阶段（被拒回复执行已撤销规则、被选回复通过往返校验），最终相对监督自训练降低复发8-22点、较底座提升对话成功率8-19点，并在复发指标上超过oracle编译式账本基线且无需推理时脚手架。
