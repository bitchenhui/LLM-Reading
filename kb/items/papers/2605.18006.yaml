claims:
- statement: Inter-LPCM在球面坐标系下对LiDAR点云几何进行学习型帧间预测编码：方位角按预设角分辨率做增量编码，半径用Inter-RP模型结合当前帧与配准参考帧的邻点进行预测，仰角用轻量注意力模型LAEP捕获跨坐标长程几何相关性。
