- statement: '该方法旨在弥补G-PCC PredGeom帧间模式线性预测能力有限、以及现有球面域学习方法未利用帧间相关性去除几何冗余的不足，源代码已开源（GitHub: SDUChangSun/Inter-LPCM）。'
  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 在球面坐标系下提出学习型LiDAR点云帧间预测编码，利用帧间相关性去除几何冗余并对比G-PCC PredGeom。
  abstract_zh: 针对G-PCC PredGeom帧间模式仅依赖简单线性模型、而现有球面域学习方法未利用帧间相关性的两点局限，作者提出Inter-LPCM。方位角采用基于预设角分辨率的增量（delta）编码，半径引入同时利用当前帧与配准参考帧邻点的帧间半径预测模型（Inter-RP），仰角则用轻量注意力预测模型（LAEP）捕获跨坐标的长程几何相关性。量化环节提出球面坐标系下率失真优化的量化步长选择方法；熵编码为三个球面坐标分量分别设计适配各自统计先验的模型，以提升概率估计精度。源代码已在GitHub公开。
