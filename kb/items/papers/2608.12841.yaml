summaries:
  one_liner_zh: 用实验证据驱动的递归自我改进研究智能体，在加密货币因子发现与美股模型开发中取得稳健的预测与交易表现
  abstract_zh: 论文研究量化投资研究层面的递归自我改进：自主系统能否利用早期实验证据改进后续迭代提出的假设与候选方案。AQuA 包含两个独立的语言模型驱动研究系统：符号化因子发现系统和可训练模型开发系统，各自记录实验结果并据此指导后续提案，且都在固定沙箱中运行——固定数据划分、特征与标签定义及评估器，模型只能通过受限的因子表达式或配置差异进行操作。因子系统（管理者中介的多智能体流水线）在加密货币标的上组合出验证信息系数约
    0.190 的合成信号。模型系统（配置驱动的混合时序架构迭代循环）在美股达到每股 +0.0843 的信息系数，并转化为双腿交易成本下持有样本外夏普比率最高 +2.50 的阈值多空策略，该策略在 2021
    至 2025 年每年均为正收益。
