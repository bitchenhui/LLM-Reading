  evidence: abstract（初筛，未读全文）
- statement: 微调后 VC-STaR 在多种 VLM 上不仅优于现有自我改进方法，还超过了在 SoTA 视觉推理数据集上微调的模型，表明 VLM 的固有对比能力可自举其视觉推理。
  confidence: reported
