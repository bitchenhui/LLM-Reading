summaries:
  one_liner_zh: 提出ENVC：用编码解码端共享的事件流引导运动先验与时域上下文精炼，大幅降低RGB神经视频编码码率。
  abstract_zh: 该工作提出事件引导神经视频编解码器ENVC，利用编码端与解码端共享的事件流为RGB压缩提供跨模态时域观测。在运动编码上，ENVC构建事件引导的运动先验并仅编码剩余运动残差；在帧编码上，事件条件预测器提供多尺度特征，经门控机制精炼时域上下文。为在标准视频数据集上训练与评估，作者合成了成对RGB-事件数据，并与真实事件对比验证其预测效用。在六个基准上，ENVC相对DCMVC平均取得39.13%（PSNR-RGB口径）和67.63%（LPIPS口径）的BD-rate节省，且在大运动序列上增益依然保持。
  deep_dive: docs/auto/2610.02265.md
