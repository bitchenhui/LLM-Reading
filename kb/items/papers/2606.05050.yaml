summaries:
  one_liner_zh: 自进化多智能体数字孪生CatDT，在单GPU上5–30分钟内自主完成催化剂表面重构、反应路径搜索与动力学预测。
  abstract_zh: 论文提出CatDT，一个由8个专用智能体和27个科学工具组成的自进化多智能体系统，仅从体相晶体和自然语言反应描述即可构建工作催化剂的自主数字孪生，统一气-固与液-固建模。两项关键创新：UniMech通过融合智能体引导提议与能量缓存图搜索，以比穷举枚举低逾1000倍的代价找到新材料的主导反应路径；记忆增强强化回路将600个催化表面上的过渡态能垒计算成功率从41%提升至84%。在阶梯金属、单原子催化剂、金属间化合物、富空位二维硫化物/碳化物及SMSI界面等七个气-固基准上，全部预测均落在实验值的0.5–2倍范围内（跨四个数量级）；在丙烷脱氢任务中自主发现非贵金属候选Ni@ZrO2
    SMSI覆盖层，模拟TOF达1.63 s⁻¹且选择性约100%。作者结论：构建可信科学数字孪生的决定因素不是LLM原始能力，而是围绕它的确定性工具、持久记忆与经验证自我改进的工程化harness。
