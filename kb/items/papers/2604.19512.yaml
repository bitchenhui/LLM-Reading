summaries:
  one_liner_zh: 基于超声基础模型TinyUSFM提出全参考uLPIPS与无参考NRQ两项质量指标，使评分对齐诊断效用与专家偏好。
  abstract_zh: 论文针对超声重建中PSNR与VGG-LPIPS等通用指标无法反映声学成像物理特性与诊断效用的问题，基于TinyUSFM基础模型构建评估框架，提出两个指标：基于多层token关系的全参考感知距离TinyUSFM-uLPIPS，以及利用干净流形建模与最差区域聚合的可部署无参考质量分数TinyUSFM-NRQ。实验显示TinyUSFM-uLPIPS与分割任务Dice分数下降的校准优于VGG类指标，并在跨器官与域偏移数据上保持稳定评分尺度与严重度排序。TinyUSFM-NRQ无需真值图像即与PSNR保持一致的敏感性。综合评估中，专家偏好预测准确率从47.2%提升至72.8%，且由此指导的超分重建更受超声医师青睐。
