claims:
  - statement: 核心障碍定位：熵解码要求两端逐位一致的概率分布，而不同厂商 NPU 的浮点/整数运算无法逐位复现，一个 index 错位级联时域预测即灾难性失败——DCVC-RT 在 Apple 编/Intel 解场景完全崩溃。
    evidence: "docs/05_MLVC.md §1"
    confidence: reported
  - statement: Scale Sending 提供硬保证：σ 从隐式推断转为由 hyperlatent（固定 factorized 熵编码、两端逐位相同）经 abs+expand+lookup 显式导出，结构化共享压缩约 128×（s²·r），熵解码不再有失配风险；副作用是所有 latent group 可一次性 AD，解码加速。
    evidence: "docs/05_MLVC.md §3"
    confidence: reported
  - statement: 三招压制浮点漂移并恢复码率：ReLU 系激活（Apple NE 仅 ReLU/LeakyReLU 零误差）+ ReGLU 门控；LTR 恢复帧；定期 I 帧硬同步。消融中跨平台 TH XP 列只有 MLVC 家族为负（+LReLU +6.7 → +Mem -21.9 → +ReGLU -39.8 → full+LTR -58.7）。
    metrics:
      - {ref: metric:BD-Rate, value: -58.7, unit: "%", scope: "MLVC full+LTR, 跨平台(TH XP), vs HEVC-QSV"}
    evidence: "docs/05_MLVC.md §4, §6"
  - statement: VCD 视频会议基准（MOS 口径）相对 HEVC-QSV（最强可部署 baseline）BD-Rate 提升超 70%；主观质量与 DCVC-RT 相当但后者无法跨平台。
    metrics:
      - {ref: metric:BD-Rate, value: -70, unit: "%", scope: "VCD, MOS 感知口径, vs HEVC-QSV, >70% 提升"}
    evidence: "docs/05_MLVC.md §7"
  - statement: 编码+解码平均 100 FPS 跑在 Apple/Intel/Qualcomm 商用 NPU 上（fp16 推理而非 INT 量化）——首个「竞争压缩率+实时+跨平台鲁棒」三合一的神经视频编码器。
    metrics:
      - {ref: metric:FPS, value: 100, scope: "enc+dec 平均, Apple ANE / Intel / Qualcomm NPU, fp16"}
    evidence: "docs/05_MLVC.md §7"
  - statement: 工程配方四件套：Unified I/P Model（I 帧当全灰参考的 P 帧，DCVC-RT 的 174M+79M 双模型合一）；I-Frame Dropout（p=0.5）；Gated Memory（decoder 显式 LSTM 式记忆）；LPIPS+人脸 ROI 感知损失、刻意不用 GAN 防时序 flicker。
    evidence: "docs/05_MLVC.md §5"
    confidence: reported
