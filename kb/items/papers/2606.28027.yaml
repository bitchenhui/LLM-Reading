summaries:
  one_liner_zh: 把 DCVC-RT 的 scale 参数经 hyperprior 显式传输避免 NPU 跨平台熵解码崩溃，配 Gated Memory/ReGLU/LTR 恢复码率，首次在 Apple/Intel/Qualcomm NPU 上 100 FPS 跑通神经视频编码，MOS 超 HEVC-QSV 70%+。
  abstract_zh: >
    指出神经视频编码落地的真障碍是跨平台逐位一致性而非算力：Scale Sending 让熵先验由逐位一致的
    hyperlatent 导出（硬保证），ReLU 系激活规避 NPU 数值分歧，LTR/定期 I 帧压制特征漂移，
    单一 Unified I/P 模型 + Gated Memory + 感知损失面向视频会议优化。
    消融表格是「每项工程决策值多少 BD-Rate」的宝贵数据源。
