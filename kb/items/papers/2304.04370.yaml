summaries:
  one_liner_zh: 提出OpenAGI开源平台，让LLM调度领域专家模型求解复杂任务，并以任务反馈强化学习（RLTF）形成自我改进闭环。
  abstract_zh: 受人类组合基础技能解决复杂任务的能力启发，该文提出面向多步真实任务的开源AGI研发平台OpenAGI。平台采用双重策略：标准基准任务用于基准测试与评估，开放任务则支持可扩展的模型、工具、插件或API以进行创造性问题求解。任务以自然语言查询呈现给LLM，由其选择并执行合适的领域专家模型。作者进一步提出基于任务反馈的强化学习机制RLTF，利用任务执行结果改进LLM的任务求解能力，构建自我改进的AI反馈回路。项目开源了代码、数据集、基准、评测方法与UI演示。
