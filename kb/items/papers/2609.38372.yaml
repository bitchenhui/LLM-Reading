summaries:
  one_liner_zh: 同一冻结模型兼任求解器与提议者，多任务自进化harness，分布内约提升5分并在OOD基准与Codex持平。
  abstract_zh: 提出接近递归自我改进的框架：同一冻结模型在同一版本harness上先作为solver求解任务，再作为proposer读取完整运行记录并直接编辑运行自身的harness。每次演化批次从五个不同领域基准抽取任务，训练与held-out任务严格分离，并在五个演化中从未使用的分布外基准上评估泛化。作者将演化框定为深度学习训练的两阶段流程：多任务预训练与持续训练。从49行种子harness出发，GLM-5.3与GPT-5.6
    Sol演化的harness在分布内基准上约提升5分，达到或超过Claude Code与Codex；第二阶段在Claw-Eval上继续演化后进一步超越两者。文中还分析了演化涌现的机制，包括输出截断、历史压缩、完成检查、独立审查与视觉检查。
