summaries:
  one_liner_zh: 提出金字塔结构网络EDPN，联合处理模糊、降尺度与压缩退化，NTIRE 2021去模糊双赛道成绩领先。
  abstract_zh: 针对实际场景中模糊图像常伴随降尺度、压缩等额外退化的问题，提出增强深度金字塔网络EDPN进行多退化模糊图像恢复。设计金字塔渐进传递（PPT）模块，以同一退化图像的多个副本为输入，渐进式传递自尺度与跨尺度相似性信息；再由金字塔自注意力（PSA）模块用自注意力与空间注意力机制融合上述特征完成恢复。实验表明该方法在模糊图像超分辨率与模糊图像去块效应任务上显著优于现有方案。在NTIRE
    2021图像去模糊挑战赛中，EDPN在赛道1（低分辨率）取得最佳PSNR/SSIM/LPIPS，在赛道2（JPEG伪影）取得最佳SSIM/LPIPS。
