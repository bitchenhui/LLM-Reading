summaries:
  one_liner_zh: 对每张图像/视频单独过拟合小型神经模型，以低一个数量级的解码复杂度匹配 VTM 与神经基线的率失真性能。
  abstract_zh: 主流神经压缩模型依赖大规模数据训练以泛化到未见内容，通常需要庞大网络结构且解码复杂度高。C3 反其道而行，为每张图像或每个视频单独过拟合一个小模型，在保持强率失真（RD）性能的同时显著降低解码复杂度。方法上
    C3 以 COOL-CHIC 为基础，针对图像压缩做出多项简单而有效的改进，并提出新的方法学将该思路扩展到视频。在 CLIC2020 图像基准上，C3 以低于 3k MACs/pixel 的解码计算量达到与
    H.266 参考实现 VTM 相当的 RD 性能；在 UVG 视频基准上，以低于 5k MACs/pixel 的解码计算量匹配成熟神经视频编解码器 Video Compression Transformer
    的 RD 性能。
