summaries:
  one_liner_zh: 大规模实验量化Bjøntegaard Delta插值误差：标准RD比较误差<0.5pp，特殊场景可达5pp，并给出使用建议
  abstract_zh: 本文对Bjøntegaard Delta（BD）计算进行深入评估，构建了覆盖PSNR、VMAF、比特率及处理能耗等多种指标的大规模视频压缩性能对比数据集，涉及普通视频、360°视频、点云和屏幕内容，并涵盖传统混合编码器与最先进的神经压缩方法。通过在QP等参数定义的标准点之间加入额外支撑点，作者量化了BD计算的插值误差及其对最终BD值的影响。结果表明，BD计算在PSNR率失真比较的标准应用中最准确，平均误差低于0.5个百分点；而在VMAF质量、能耗和跨编解码器比较等场景误差最高可达5个百分点，增加支撑点数量可使误差减半。作者最终给出建议：应绘制并分析相对曲线差异、对SSIM和VMAF等饱和指标使用对数域、低于子集误差阈值的BD值不应用于下结论、两个支撑点即可获得粗略性能估计。
