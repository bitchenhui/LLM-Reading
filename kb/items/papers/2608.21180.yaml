summaries:
  one_liner_zh: 提出两阶段VLM框架，对心脏LGE-MRI生成结构化质量报告并输出消融规划的临床可用性判定。
  abstract_zh: 针对房颤导管消融规划中左心房LGE-MRI图像质量评估依赖放射科医生主观判断、现有自动化方法仅输出不可解释标量分数的问题，该文提出两阶段视觉语言模型框架。第一阶段微调VLM生成放射学风格的结构化质量报告，预测噪声、运动伪影、左心房边界准确性、肺静脉区域准确性与欠分割严重度五项判据；第二阶段用基于GPT的推理模块将预测结果映射为结构化质量评分和二值临床可用性决策。作者构建了来自20名患者的60个图像切片-文本标注对数据集，并基准测试四种SOTA
    VLM架构。结果表明InternVL2取得最高判据级精度（平均ACC=0.65，PLCC=0.79），DeepSeek在临床可用性判定上达到完全一致（Acc=1.00，kappa=1.00）。
