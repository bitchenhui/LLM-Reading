summaries:
  one_liner_zh: 提出CoT-Verify范式与Reasoning-CV两阶段微调（SFT+自我改进DPO），8B模型声明验证超越GPT-4o+CoT与o1-preview
  abstract_zh: 针对现有LLM声明验证普遍采用的'分解再验证'范式在子声明分解环节易引入错误的问题，作者提出CoT-Verify范式：利用LLM推理能力为原始复杂声明生成思维链验证路径，无需拆分为子声明并分步验证。基于该范式提出Reasoning-CV微调方法，包含监督微调（SFT）与自我改进直接偏好优化（DPO）两个阶段。仅使用8B预训练LLM，Reasoning-CV在知识辅助声明验证任务上超越现有Decompose-Then-Verify方法及GPT-4o+CoT、o1-preview等强大黑盒模型。代码已开源。
