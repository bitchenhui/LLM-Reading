summaries:
  one_liner_zh: 提出'缓存工程'让LLM智能体通过drop/repos直接操控活跃KV缓存，配套AKV服务引擎实现精度与成本兼得。
  abstract_zh: 针对LLM智能体长轨迹导致的KV缓存I/O与存储成本主导问题，作者提出'缓存工程'方案，让智能体通过drop与repos操作直接控制活跃缓存，无需修改轨迹前缀或对保留上下文重新预填充。由于相同token序列在不同缓存操作序列下产生不同缓存状态、前缀匹配不足以正确复用缓存，作者据此协同设计了AKV服务引擎：对外提供兼容现有API的无状态接口，内部管理有状态的缓存复用、驱逐与恢复。实验中，工具响应滚动丢弃缓存策略较常规阈值触发摘要化平均提升基准分1.7分、降低平均成本27.7%；配合AKV最高获得1.2倍输出吞吐与1.5倍P95请求延迟加速。缓存策略的递归自改进较专家手工设计进一步降低成本7.1%。
