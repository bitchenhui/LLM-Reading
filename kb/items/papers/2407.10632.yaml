summaries:
  one_liner_zh: 提出对称双向立体图像压缩BiSIC，以跨维熵模型融合空间/通道上下文与立体依赖，PSNR与MS-SSIM超越传统及学习式方法。
  abstract_zh: 针对以往单视点压缩依赖另一视点导致压缩不均衡的问题，论文提出对称的双向立体图像压缩架构BiSIC。编解码骨干基于3D卷积捕捉局部特征，并引入双向注意力块利用全局特征。核心创新是跨维熵模型，将空间上下文、通道上下文与立体依赖等多种条件因素融合，用于估计潜在表示分布以支撑熵编码。实验显示BiSIC在PSNR与MS-SSIM上优于传统图像/视频压缩标准以及最先进的学习式方法。
