summaries:
  one_liner_zh: 以四阶段渐进因果蒸馏将双向动作条件视频生成器转为1/2/4步交互世界模型，Minecraft上画质与控制精度领先。
  abstract_zh: ForgeWM 通过域适配、教师强制因果训练、因果一致性蒸馏以及与双向教师进行在策略分布匹配的四阶段渐进训练，将双向动作条件视频生成器转化为高效的少步世界模型。学生模型在 1、2、4
    步稳态去噪预算下运行，并支持'低延迟交互 + 回放期精修'的双路径部署，其中一步学生可对保存草稿重新加噪并精修。在成对 Minecraft 轨迹上，ForgeWM 在成像质量、参考对齐运动轮廓一致性、动作符号准确率与鼠标控制精度上领先被评估系统，并取得最低参考
    LPIPS；同一配方可迁移至手柄控制的 FPS（第一人称射击）游戏。回放期精修在达到四步参考质量的同时，与经验轨迹的贴合度比从噪声重新生成约高 3 倍。
