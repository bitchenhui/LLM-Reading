  confidence: reported
  evidence: abstract（初筛，未读全文）
summaries:
  one_liner_zh: 为冻结预训练神经语音编解码器动态分配RVQ深度，在精确字节预算下提升语音质量。
  abstract_zh: 预训练神经语音编解码器通常对所有帧使用固定的残差向量量化（RVQ）深度，忽略了量化难度的时变特性。BAMU提出码流感知的动态RVQ深度分配框架，作用于冻结的预训练编解码器：轻量级、与码率无关的预测器估计帧级与层级的边际潜在失真减少量，约束分配器在精确的序列化字节预算下选择前缀有效深度。在LibriSpeech上对EnCodec和DAC的实验（另含VCTK评估）显示EnCodec获得一致增益，DAC的改进主要出现在中高速率。30名听者的主观测试确认MOS从3.449提升至3.780（相对匹配固定深度编码）。
assessment:
