summaries:
  one_liner_zh: 提出编排者/偏转者/应答者/评估者四角色多智能体防御框架，经提示优化在测试时自改进，免重训练即可提升LLM安全鲁棒性。
  abstract_zh: AegisLLM 是一个协作式多智能体 LLM 安全防御系统，由编排者、偏转者、应答者与评估者构成结构化工作流，共同保证输出安全合规并抵御越狱攻击与信息泄露。系统通过自动化提示优化（如
    DSPy）随时间自改进，并可通过增加智能体角色在测试时扩展推理规模。该方法无需模型重训练即可实时适应演化的攻击。实验显示在 WMDP unlearning 基准上仅用 20 个训练样本、少于 300
    次 LM 调用即达近完美遗忘效果；StrongReject 越狱防御较基线提升 51%，PHTest 错误拒绝率仅 7.9%（可比方法为 18-55%）。
