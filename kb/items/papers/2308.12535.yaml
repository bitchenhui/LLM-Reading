summaries:
  one_liner_zh: 提出模型无关的球面坐标点云压缩SCP，利用LiDAR环形特征与多级八叉树，BD-Rate较SOTA最多省29.14%
  abstract_zh: 该文针对车载旋转LiDAR生成的点云，指出其环形结构与方位角不变性特征此前被现有学习型点云压缩方法忽视。作者提出模型无关的球面坐标变换方法SCP，将点云转换至球面坐标系以充分利用上述特征，并可叠加于多种学习型点云压缩框架。进一步设计多级八叉树结构，缓解球面坐标八叉树在远距离区域的重构误差。实验表明SCP在点对点PSNR口径下较此前SOTA最多节省29.14%的BD-Rate。
assessment:
  relevance: medium
