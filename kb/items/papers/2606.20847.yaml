claims:
  - statement: LLM 闭环进化（DeepSeek，种群 K=4，10 轮，Exploration/Modification 双提示）自动发现的帧级 QP 启发式等价于「熵约束 RDO」——score = weighted_PSNR / (1+H_QP) / log(1+total_bits)，隐式抑制 QP 抖动并自适应内容。
    evidence: "docs/01_LLM-VVenC-QP.md §3"
    confidence: reported
  - statement: 相对 VVenC-1.7.0 faster 固定 QP，CTC B 类平均 BD-Rate -1.73%（YUV-PSNR）。
    metrics:
      - {ref: metric:BD-Rate, value: -1.73, unit: "%", scope: "CTC B 平均, vs 固定QP, YUV-PSNR, VVenC-1.7.0 faster/RA"}
    evidence: "docs/01_LLM-VVenC-QP.md §4"
  - statement: UVG 平均 -1.00%、MCL-JCV 平均 -1.06%；三库总平均约省 1.26% 码率。
    metrics:
      - {ref: metric:BD-Rate, value: -1.00, unit: "%", scope: "UVG 平均"}
      - {ref: metric:BD-Rate, value: -1.06, unit: "%", scope: "MCL-JCV 平均"}
  - statement: 经典 Lagrangian RDO 启发式同配置下反而退化（CTC B +2.68% / UVG +3.09% / MCL-JCV +2.52%），说明朴素 λ 估计在帧级 QP 上不成立，该问题需要跨帧统计结构。
    metrics:
      - {ref: metric:BD-Rate, value: 2.68, unit: "%", scope: "Lagrangian 基线退化, CTC B"}
    evidence: "docs/01_LLM-VVenC-QP.md §4"
  - statement: 工程上把「启发式定义」与「编码器内部 RDO」解耦——multi-pass 编码收集 5 个候选 QP（±1/±2）的完整历史统计，评分完全在 Python 层做，实现成本低、可迁移到其他编码器决策。
    evidence: "docs/01_LLM-VVenC-QP.md §5"
    confidence: inferred
