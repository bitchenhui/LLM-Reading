summaries:
  one_liner_zh: 用 DeepSeek 闭环进化 Python 启发式为 VVenC 逐帧选 QP，自动发现「熵约束 RDO」，比固定 QP 平均省约 1.26% 码率。
  abstract_zh: >
    把帧级 QP 决策外置为 Python solver（multi-pass 收集 5 个候选 QP 的历史统计），
    用 LLM 以 Exploration/Modification 两种进化提示 + BD-Rate fitness 迭代启发式，
    最终得到带 QP 序列熵惩罚项的 RDO 评分函数，在 CTC/UVG/MCL-JCV 上稳定优于固定 QP 与朴素 Lagrangian。
    局限：QP-wise 训练、固定 5 邻域候选集。
