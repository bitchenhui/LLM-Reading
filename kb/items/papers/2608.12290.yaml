summaries:
  one_liner_zh: 提出Agentic Self-Improvement框架，用mLLM提示词迭代优化加贝叶斯参数搜索提升黑盒I2V生成与文本一致性。
  abstract_zh: 针对黑盒图生视频（I2V）模型缺乏细粒度控制、随机性导致暴力试错的问题，提出'智能体自改进'框架，将视频合成重构为闭环目标导向优化。第一阶段用多模态大语言模型迭代优化输入提示词，通过Davidsonian场景图（DSG）查询保障语义一致性，用常见错误问题（CMQ）检测伪影。第二阶段用贝叶斯优化联合搜索随机种子与CFG尺度，搜索由新提出的视频-文本一致性（VTA）分数等质量指标引导。人评研究显示该方法生成的视频显著优于无引导搜索，偏好胜率最高达69%，为视频生成模型走向可预测、可控制的生产级工具提供了实用方法。
assessment:
