summaries:
  one_liner_zh: 用 AlphaEvolve 演化出新 gadget 归约，改进 MAX-3/4-CUT 与度量 TSP 不可近似界，并自我演化出千倍加速的验证程序
  abstract_zh: 论文证明 AI 方法可以推动复杂性理论进展：利用 AlphaEvolve（LLM 代码变异智能体）在三个方向获得新结果。其一，改进 Kunisky-Yu 的结论，对随机 3/4
    正则图上 MAX-CUT 与 MAX-独立集的认证算法给出近乎最优的上界与（条件性）下界，其中下界靠构造多达 163 个顶点的近极值 Ramanujan 图；其二，用 AlphaEvolve 发现新
    gadget 归约，证明 MAX-4-CUT 与 MAX-3-CUT 分别在 0.987 与 0.9649 因子内近似为 NP 难（前者超过 SOTA 0.9883，后者超过最优 gadget 结果
    0.9853 但不及基于定制 PCP 的 16/17）；其三，证明度量 TSP 最小代价环游在 111/110 因子内近似为 NP 难，改进 SOTA 117/116。针对 AlphaEvolve
    候选构造验证代价高昂的问题，作者用 AlphaEvolve 自身演化出更快的验证程序，部分 gadget 加速达 1 万倍，并给出可独立复用的模块化可靠性/完备性论证。
  deep_dive: docs/auto/2509.18057.md
