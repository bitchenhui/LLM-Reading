summaries:
  one_liner_zh: 教师LLM反思改进数据质量、学生LLM选择兼容样本，实现样本高效的指令微调与自改进。
  abstract_zh: 论文提出Selective Reflection-Tuning范式，将教师LLM的反思与自省（用于提升既有数据质量）与学生LLM的数据选择能力结合，自动精炼已有指令微调数据，生成高质量且与学生模型兼容的指令-响应对。该教师-学生协同带来样本高效的指令微调，并作为数据增强与合成手段，无需收集全新数据即可改进LLM微调与自改进。作者在Alpaca和WizardLM数据上应用该方法，训练出更强且达到顶级水平的7B和13B模型。
