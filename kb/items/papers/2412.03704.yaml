summaries:
  one_liner_zh: 提出VisVM价值模型引导VLM推理时搜索，减少幻觉、丰富视觉细节，并支持自训练自我改进。
  abstract_zh: 论文提出视觉价值模型（VisVM），用于引导视觉语言模型（VLM）在推理阶段进行搜索，生成视觉理解质量更高的回答。VisVM不仅评估当前搜索步骤所生成句子的质量，还预估后续句子可能达到的质量，从而提供长期价值信号，引导VLM避开易产生幻觉或细节不足的生成路径。实验表明，与贪心解码及采用其他视觉奖励信号的搜索方法相比，VisVM引导的搜索显著提升了描述性字幕的视觉细节丰富度并减少幻觉。作者进一步发现，用VisVM引导生成的字幕对模型进行自训练，可在广泛的多模态基准上提升VLM性能，展示了构建自我改进VLM的潜力。
