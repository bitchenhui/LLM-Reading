summaries:
  one_liner_zh: 提出无数据依赖高吞吐调色板的轻量级中间码编解码器HLC，同吞吐下LUT资源减半，BD-PSNR较JPEG-XS最高提升5.312dB。
  abstract_zh: 现有中间码（mezzanine）图像编解码器缺乏专门的屏幕内容编码工具，在带宽受限尤其是密集文字场景下难以保证高质量，而标准编码器中的屏幕内容压缩技术计算复杂度过高，不适用于中间码编码。HLC
    的核心创新是一种无数据依赖的调色板（palette）编码模式，消除了吞吐瓶颈，使高吞吐 palette 编码切实可行。系统还协同设计了率失真优化（RDO）模块，在调色板与传统预测模式之间仲裁，并通过率估计与熵编码之间的数据复用策略降低整体硬件资源开销。实验表明，与
    4K@120fps JPEG-XS 编码器相比，HLC 在相同吞吐下仅用一半 LUT 资源，在游戏、自然和文字内容数据集上分别取得 3.461dB、3.299dB 和 5.312dB 的 BD-PSNR
    提升。
