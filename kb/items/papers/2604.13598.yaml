summaries:
  one_liner_zh: 提出ESC-RL框架，以证据感知分组奖励GEAR和自纠正偏好学习SPL实现放射报告生成的临床忠实且无需人工监督的持续自改进。
  abstract_zh: 针对现有RL放射报告生成方法报告级奖励缺乏证据支撑、缺少显式自改进机制两大局限，提出临床对齐的ESC-RL框架。GEAR组件以分组方式提供证据感知反馈：强化真阳性的一致性锚定、召回假阴性遗漏病灶、抑制假阳性的无依据内容。SPL策略从多源噪声观测中自动构建疾病感知偏好数据集，并利用LLM合成精炼报告，无需人工监督，支持训练过程中的持续自改进。在两个公开胸部X光数据集上取得一致提升并达到SOTA性能。
