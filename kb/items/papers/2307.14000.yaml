summaries:
  one_liner_zh: 用指令数、缓存缺失等处理器事件计数估计软件视频解码器能耗，平均误差小于6%
  abstract_zh: 论文提出利用处理器级事件（如指令执行数、缓存缺失）作为特征来估计软件视频解码器的处理能耗。作者在基于ARM的评估平台上进行真实能耗测量，并借助专用性能分析软件统计处理器事件计数。该方法在多种编解码器及解码器实现上进行了验证，以证明其普适性。结果表明，包括HEVC与VP9在内的近期视频编码标准，其真实解码能耗可用平均估计误差小于6%的精度估计出来。
